<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Short History of Sorting — motion-lab</title>
<style>
  /* Player chrome. The piece itself lives entirely in the canvas. */
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; font: 500 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; }
  canvas { display: block; width: min(100vw, calc(100vh * 16 / 9)); height: auto; aspect-ratio: 16 / 9; }
  #sound { position: fixed; left: 16px; bottom: 16px; padding: 8px 14px; border: 1px solid rgba(255,255,255,.35); border-radius: 999px;
           background: rgba(0,0,0,.55); color: #fff; font: inherit; cursor: pointer; }
  #sound[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080" aria-label="A short history of sorting: merge sort, Shellsort, quicksort, heapsort and Timsort, each running on a row of bars"></canvas>
<button id="sound" type="button">Click for sound</button>
<script>
'use strict';
/* ==========================================================================
   PIECE — A short history of sorting, 1945 -> 2002.
   Every bar move on screen is a step recorded from a real run of the
   algorithm below; the picture only replays the recording.
   ========================================================================== */
const W = 1920, H = 1080, FPS = 30, FRAMES = 900;          // 30 s
const cv = document.getElementById('stage');
const ctx = cv.getContext('2d', { willReadFrequently: true });   // CPU raster: identical pixels on every redraw
const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
const MONO = 'ui-monospace, "Cascadia Code", Consolas, Menlo, monospace';

// ---- helpers -------------------------------------------------------------
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (f, a, b) => clamp((f - a) / (b - a));           // 0..1 progress of frame f through [a, b]
const E = {
  inCubic: t => t * t * t,
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inOutCubic: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outExpo: t => t === 1 ? 1 : 1 - Math.pow(2, -10 * t),
  inExpo: t => t === 0 ? 0 : Math.pow(2, 10 * t - 10),
  inOutExpo: t => t === 0 ? 0 : t === 1 ? 1 : t < .5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2,
  outBack: t => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2),
  inOutSine: t => -(Math.cos(Math.PI * t) - 1) / 2,
};

// ---- palette: two accents + neutrals --------------------------------------
const C = {
  bg: '#0E1116', ink: '#EDEAE3', dim: '#8C919B', faint: '#262B34', bar: '#4B525E',
  amber: '#F4B942', cyan: '#5EC8F2',
};
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix = (a, b, t) => { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], t))).join(',')})`; };

// ---- the five eras (dates as published) ------------------------------------
const ERAS = [
  { year: 1945, name: 'Merge sort', who: 'John von Neumann', algo: 'merge', seed: 11,
    line: 'Von Neumann writes a merge sort for the EDVAC: split, sort each half, merge.' },
  { year: 1959, name: 'Shellsort', who: 'Donald L. Shell', algo: 'shell', seed: 5,
    line: 'Shell sorts far-apart items first, then shrinks the gap down to 1.' },
  { year: 1961, name: 'Quicksort', who: 'Tony Hoare', algo: 'quick', seed: 23,
    line: 'Hoare publishes Quicksort: pick a pivot, partition around it, recurse.' },
  { year: 1964, name: 'Heapsort', who: 'J. W. J. Williams', algo: 'heap', seed: 42,
    line: 'Williams builds a heap, then pulls out the largest item, one at a time.' },
  { year: 2002, name: 'Timsort', who: 'Tim Peters', algo: 'tim', seed: 0,
    line: 'Peters writes Timsort for Python: find runs already in the data, merge them.' },
];

// ---- recorder: runs an algorithm and keeps a snapshot after every step -----
function record(init, algo) {
  const a = init.slice(), ev = [];
  const st = { lo: 0, hi: a.length - 1, pv: null, fin: a.length, note: '', runs: null };
  const push = (t, i, j) => ev.push({ t, i, j, a: a.slice(), lo: st.lo, hi: st.hi, pv: st.pv, fin: st.fin, note: st.note,
    runs: st.runs ? st.runs.map(r => r.slice()) : null });
  const R = {
    a, st,
    touch(i, j) { push('c', i, j); },                              // a comparison the caller evaluates itself
    cmp(i, j) { push('c', i, j); return a[i] - a[j]; },
    cmpv(i, v) { push('c', i, -1); return a[i] - v; },
    swap(i, j) { const t = a[i]; a[i] = a[j]; a[j] = t; push('s', i, j); },
    write(i, v) { a[i] = v; push('w', i, -1); },
    mark() { push('m', -1, -1); },
  };
  push('m', -1, -1);
  ALGOS[algo](R);
  st.lo = 0; st.hi = a.length - 1; st.pv = null; st.fin = 0; st.note = 'sorted'; st.runs = null; push('m', -1, -1);
  let nc = 0, nw = 0;
  for (const e of ev) { if (e.t === 'c') nc++; if (e.t === 'w') nw++; if (e.t === 's') nw += 2; e.nc = nc; e.nw = nw; }
  return ev;
}

const ALGOS = {
  merge(R) {                                           // top-down merge sort with an auxiliary array
    const a = R.a, aux = [];
    (function sort(lo, hi) {
      if (hi <= lo) return;
      const mid = (lo + hi) >> 1;
      sort(lo, mid); sort(mid + 1, hi);
      R.st.lo = lo; R.st.hi = hi; R.st.note = `merge ${lo}..${hi}`;
      for (let k = lo; k <= hi; k++) aux[k] = a[k];
      let i = lo, j = mid + 1;
      for (let k = lo; k <= hi; k++) {
        if (i > mid) R.write(k, aux[j++]);
        else if (j > hi) R.write(k, aux[i++]);
        else { R.touch(i, j); if (aux[j] < aux[i]) R.write(k, aux[j++]); else R.write(k, aux[i++]); }
      }
    })(0, a.length - 1);
  },
  shell(R) {                                           // Shell's original gaps: n/2, n/4, ..., 1
    const a = R.a, n = a.length;
    for (let gap = n >> 1; gap > 0; gap >>= 1) {
      R.st.note = `gap ${gap}`;
      for (let i = gap; i < n; i++)
        for (let j = i; j >= gap; j -= gap) { if (R.cmp(j - gap, j) > 0) R.swap(j - gap, j); else break; }
    }
  },
  quick(R) {                                           // Hoare partition, middle pivot
    const a = R.a;
    (function qs(lo, hi) {
      if (lo >= hi) return;
      const pv = a[(lo + hi) >> 1];
      R.st.lo = lo; R.st.hi = hi; R.st.pv = pv; R.st.note = `pivot ${pv}`;
      let i = lo - 1, j = hi + 1;
      for (;;) {
        do { i++; } while (R.cmpv(i, pv) < 0);
        do { j--; } while (R.cmpv(j, pv) > 0);
        if (i >= j) break;
        R.swap(i, j);
      }
      qs(lo, j); qs(j + 1, hi);
    })(0, a.length - 1);
    R.st.pv = null;
  },
  heap(R) {                                            // max-heap, then repeated extract-max
    const a = R.a, n = a.length;
    const sift = (i, size) => {
      for (;;) {
        const l = 2 * i + 1, r = l + 1; let m = i;
        if (l < size && R.cmp(l, m) > 0) m = l;
        if (r < size && R.cmp(r, m) > 0) m = r;
        if (m === i) return;
        R.swap(i, m); i = m;
      }
    };
    R.st.note = 'build heap'; R.st.lo = 0; R.st.hi = n - 1;
    for (let i = (n >> 1) - 1; i >= 0; i--) sift(i, n);
    for (let end = n - 1; end > 0; end--) {
      R.st.note = 'take max'; R.st.hi = end;
      R.swap(0, end); R.st.fin = end; R.st.hi = end - 1; sift(0, end);
    }
    R.st.fin = 0;
  },
  tim(R) {                                             // runs + binary insertion + merge_collapse (no galloping)
    const a = R.a, n = a.length, MINRUN = 4, runs = [], aux = [];
    R.st.runs = runs;
    const mergeAt = k => {
      const [s1, l1] = runs[k], [s2, l2] = runs[k + 1], end = s2 + l2;
      R.st.lo = s1; R.st.hi = end - 1; R.st.note = 'merge runs';
      for (let x = s1; x < end; x++) aux[x] = a[x];
      let i = s1, j = s2;
      for (let q = s1; q < end; q++) {
        if (i >= s2) R.write(q, aux[j++]);
        else if (j >= end) R.write(q, aux[i++]);
        else { R.touch(i, j); if (aux[j] < aux[i]) R.write(q, aux[j++]); else R.write(q, aux[i++]); }
      }
      runs.splice(k, 2, [s1, l1 + l2]);
    };
    const L = k => runs[k][1];
    const collapse = () => {
      while (runs.length > 1) {
        let k = runs.length - 2;
        if ((k > 0 && L(k - 1) <= L(k) + L(k + 1)) || (k > 1 && L(k - 2) <= L(k - 1) + L(k))) { if (L(k - 1) < L(k + 1)) k--; mergeAt(k); }
        else if (L(k) <= L(k + 1)) mergeAt(k);
        else break;
      }
    };
    let i = 0;
    while (i < n) {
      const s = i; let e;
      R.st.lo = s; R.st.hi = s; R.st.note = 'find run';
      if (i === n - 1) e = n;
      else if (R.cmp(i + 1, i) < 0) {
        let j = i + 1; while (j + 1 < n && R.cmp(j + 1, j) < 0) j++;
        R.st.hi = j; R.st.note = 'reverse run';
        for (let lo = i, hi = j; lo < hi; lo++, hi--) R.swap(lo, hi);
        e = j + 1;
      } else {
        let j = i + 1; while (j + 1 < n && R.cmp(j + 1, j) >= 0) j++;
        e = j + 1;
      }
      R.st.hi = e - 1;
      if (e - s < MINRUN) {
        const f = Math.min(n, s + MINRUN);
        R.st.note = 'binary insertion';
        for (let k = e; k < f; k++) {
          const v = a[k]; let lo = s, hi = k;
          while (lo < hi) { const mid = (lo + hi) >> 1; R.touch(mid, k); if (v < a[mid]) hi = mid; else lo = mid + 1; }
          for (let q = k; q > lo; q--) R.swap(q - 1, q);
          R.st.hi = k;
        }
        e = f;
      }
      runs.push([s, e - s]); R.st.note = `runs ${runs.length}`; R.mark();
      collapse(); i = e;
    }
    while (runs.length > 1) { let k = runs.length - 2; if (k > 0 && L(k - 1) < L(k + 1)) k--; mergeAt(k); }
  },
};

function shuffled(n, seed) {
  const r = mulberry32(seed), p = Array.from({ length: n }, (_, i) => i + 1);
  for (let i = n - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = p[i]; p[i] = p[j]; p[j] = t; }
  return p;
}
// Timsort gets data with real structure: an ascending run, a descending run, and short runs to extend.
const TIM_DATA = [2, 5, 7, 9, 12, 15, 19, 17, 14, 10, 6, 1, 4, 8, 13, 18, 3, 11, 20, 16];
for (const era of ERAS) {
  era.init = era.algo === 'tim' ? TIM_DATA.slice() : shuffled(16, era.seed);
  era.n = era.init.length;
  era.ev = record(era.init, era.algo);
}

// ---- timing ---------------------------------------------------------------
const INTRO = 72, ERA_LEN = 150, OUTRO = INTRO + ERAS.length * ERA_LEN;   // outro starts at 822
const RUN0 = 24, RUN1 = 118, SWEEP0 = 120, SWEEP1 = 132, EXIT0 = 136;
const runK = (lf, ev) => (ev.length - 1) * E.inOutSine(prog(lf, RUN0, RUN1));   // fractional step index

const INTRO_N = 48, INTRO_PERM = shuffled(INTRO_N, 7);
const introLand = v => 3 + (v / INTRO_N) * 12;          // landing stagger by value -> a rising sweep

// ---- text helpers ---------------------------------------------------------
function font(size, weight = 500, fam = FONT) { ctx.font = `${weight} ${size}px ${fam}`; }
function fitFont(txt, maxW, size, weight = 500, fam = FONT) {
  let s = size; font(s, weight, fam);
  while (ctx.measureText(txt).width > maxW && s > 28) { s -= 1; font(s, weight, fam); }
  return s;
}
function reset() {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.shadowBlur = 0; ctx.filter = 'none'; ctx.letterSpacing = '0px'; ctx.setLineDash([]);
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.font = '10px sans-serif';
}

// ---- chrome: header + timeline --------------------------------------------
const TL = { x0: 170, x1: 1750, y: 988 };
const yearX = y => lerp(TL.x0, TL.x1, (y - 1945) / (2002 - 1945));
function header(alpha, showLabel) {
  ctx.save(); ctx.globalAlpha = alpha;
  font(22, 600); ctx.letterSpacing = '4px'; ctx.fillStyle = C.dim; ctx.textBaseline = 'alphabetic';
  if (showLabel) { ctx.textAlign = 'left'; ctx.fillText('A SHORT HISTORY OF SORTING', 120, 104); }
  ctx.textAlign = 'right'; ctx.fillText('BYTEPATTERNS', 1800, 104);
  ctx.restore();
}
function timeline(alpha, dotYear, lit) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.strokeStyle = C.faint; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(TL.x0 - 30, TL.y); ctx.lineTo(TL.x1 + 30, TL.y); ctx.stroke();
  // progress line up to the moving dot
  const dx = yearX(dotYear);
  ctx.strokeStyle = C.amber; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(TL.x0, TL.y); ctx.lineTo(dx, TL.y); ctx.stroke();
  font(24, 600, MONO); ctx.textAlign = 'center';
  ERAS.forEach((e, k) => {
    const x = yearX(e.year), on = k <= lit;
    ctx.fillStyle = on ? C.amber : C.bg; ctx.strokeStyle = on ? C.amber : C.dim; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, TL.y, 7, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = on ? C.ink : C.dim;
    ctx.fillText(String(e.year), x, k % 2 ? TL.y - 22 : TL.y + 40);
  });
  ctx.fillStyle = C.ink;
  ctx.beginPath(); ctx.arc(dx, TL.y, 11, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = C.bg;
  ctx.beginPath(); ctx.arc(dx, TL.y, 4.5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// ---- intro: 48 bars sort themselves in under a second ---------------------
function intro(f) {
  const n = INTRO_N, x0 = 120, x1 = 1800, slot = (x1 - x0) / n, bw = slot * 0.6, base = 900;
  for (let p = 0; p < n; p++) {
    const v = INTRO_PERM[p], d = introLand(v);
    const u = E.outExpo(prog(f, d, d + 20));
    const x = x0 + slot * lerp(p, v - 1, u) + (slot - bw) / 2;
    const lift = Math.sin(Math.PI * clamp(u * 1.15)) * 34;
    const out = E.inExpo(prog(f, 54 + (v / n) * 8, 68 + (v / n) * 4));
    const h = (26 + (v / n) * 400) * (1 - out);
    if (h < 0.5) continue;
    ctx.fillStyle = mix(C.bar, C.amber, E.outCubic(prog(f, d + 6, d + 14)));
    ctx.beginPath(); ctx.roundRect(x, base - h - lift, bw, h, [4, 4, 0, 0]); ctx.fill();
  }
  // title
  const tin = E.outExpo(prog(f, 8, 32)), tout = E.inCubic(prog(f, 52, 68));
  ctx.save();
  ctx.globalAlpha = tin * (1 - tout);
  ctx.textAlign = 'center'; ctx.fillStyle = C.ink;
  const s = fitFont('A short history of sorting', 1640, 116, 800);
  ctx.fillText('A short history of sorting', W / 2, 318 + (1 - tin) * 50 - tout * 40);
  ctx.globalAlpha = E.outExpo(prog(f, 18, 40)) * (1 - tout);
  font(40, 500); ctx.fillStyle = C.dim;
  ctx.fillText('Five ideas, 1945 → 2002', W / 2, 318 + s * 0.62 + (1 - tin) * 70 - tout * 40);
  ctx.restore();
  header(1, false);
}

// ---- one era ---------------------------------------------------------------
function drawBars(era, lf, alpha) {
  const ev = era.ev, n = era.n, x0 = 900, x1 = 1800, slot = (x1 - x0) / n, bw = slot * 0.7, base = 712, hmax = 380;
  const kf = runK(lf, ev), k = Math.min(ev.length - 1, Math.floor(kf)), fr = kf - k;
  const cur = ev[Math.min(ev.length - 1, k + 1)];
  const A = ev[k].a, B = cur.a, m = E.outCubic(fr);
  const running = lf >= RUN0 && lf <= RUN1 + 1;
  const sweep = prog(lf, SWEEP0, SWEEP1) * (n + 2);
  const hOf = v => 34 + (v / n) * (hmax - 34);
  ctx.save(); ctx.globalAlpha = alpha;

  // active range
  if (running && cur.t !== 'm' || (running && era.algo === 'tim')) {
    const lo = cur.lo, hi = cur.hi;
    if (lo >= 0 && hi >= lo) {
      ctx.fillStyle = C.cyan; ctx.globalAlpha = alpha * 0.9;
      ctx.fillRect(x0 + slot * lo + (slot - bw) / 2, base + 14, slot * (hi - lo) + bw, 4);
      ctx.globalAlpha = alpha;
    }
  }
  // Timsort runs
  if (cur.runs && running) {
    cur.runs.forEach((r, q) => {
      const xa = x0 + slot * r[0] + (slot - bw) / 2, xb = x0 + slot * (r[0] + r[1] - 1) + (slot + bw) / 2;
      ctx.strokeStyle = q % 2 ? C.dim : C.ink; ctx.lineWidth = 2; ctx.globalAlpha = alpha * 0.8;
      ctx.beginPath(); ctx.moveTo(xa, base + 30); ctx.lineTo(xa, base + 40); ctx.lineTo(xb, base + 40); ctx.lineTo(xb, base + 30); ctx.stroke();
    });
    ctx.globalAlpha = alpha;
  }
  // bars
  for (let i = 0; i < n; i++) {
    const g = E.outExpo(prog(lf, 2 + i * 0.9, 20 + i * 0.9));
    const h = lerp(hOf(A[i]), hOf(B[i]), m) * g;
    let col = C.bar;
    if (!running && lf < RUN0) col = C.bar;
    if (running) {
      if (i >= cur.fin) col = mix(C.bar, C.ink, 0.45);           // settled (heap suffix)
      if ((cur.t === 'c') && (i === cur.i || i === cur.j)) col = C.cyan;
      if ((cur.t === 's' || cur.t === 'w') && (i === cur.i || i === cur.j)) col = C.amber;
    }
    if (lf > RUN1 + 1) col = mix(C.bar, C.amber, clamp(sweep - i));
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.roundRect(x0 + slot * i + (slot - bw) / 2, base - h, bw, h, [4, 4, 0, 0]); ctx.fill();
  }
  // pivot line (quicksort)
  if (running && cur.pv != null) {
    const y = base - hOf(cur.pv);
    ctx.strokeStyle = C.cyan; ctx.lineWidth = 2; ctx.setLineDash([10, 8]); ctx.globalAlpha = alpha * 0.85;
    ctx.beginPath(); ctx.moveTo(x0 + slot * cur.lo, y); ctx.lineTo(x0 + slot * (cur.hi + 1), y); ctx.stroke();
    ctx.setLineDash([]); ctx.globalAlpha = alpha;
  }
  // counters
  const shown = lf < RUN0 ? ev[0] : lf > RUN1 ? ev[ev.length - 1] : cur;
  font(28, 500, MONO); ctx.fillStyle = C.dim; ctx.textAlign = 'left';
  ctx.fillText(`compares ${String(shown.nc).padStart(3, ' ')}   writes ${String(shown.nw).padStart(3, ' ')}`, x0, base + 84);
  ctx.textAlign = 'right'; ctx.fillStyle = lf > RUN1 ? C.amber : C.cyan;
  ctx.fillText(lf < RUN0 ? `n = ${n}` : shown.note, x1, base + 84);
  ctx.restore();
}

function eraScene(e, lf) {
  const era = ERAS[e], prev = ERAS[e - 1];
  const inT = E.outExpo(prog(lf, 0, 26));
  const out = E.inCubic(prog(lf, EXIT0, ERA_LEN));
  header(1, true);

  // year: counts up from the previous era, never leaves the screen
  const yu = E.inOutCubic(prog(lf, 0, 24));
  const year = prev ? Math.round(lerp(prev.year, era.year, yu)) : era.year;
  ctx.save();
  ctx.globalAlpha = prev ? 1 : inT;
  font(250, 800); ctx.fillStyle = C.ink; ctx.textAlign = 'left'; ctx.letterSpacing = '-6px';
  ctx.fillText(String(year), 110, 470 + (prev ? 0 : (1 - inT) * 60));
  ctx.restore();

  // name + inventor
  ctx.save();
  const nIn = E.outExpo(prog(lf, 6, 30));
  ctx.globalAlpha = nIn * (1 - out);
  font(68, 700); ctx.fillStyle = C.amber;
  ctx.fillText(era.name, 120, 572 + (1 - nIn) * 40 - out * 24);
  ctx.globalAlpha = E.outExpo(prog(lf, 10, 34)) * (1 - out);
  font(38, 500); ctx.fillStyle = C.dim;
  ctx.fillText(era.who, 122, 630 + (1 - nIn) * 40 - out * 24);
  ctx.restore();

  drawBars(era, lf, 1 - out);

  // one-sentence caption
  ctx.save();
  const cIn = E.outExpo(prog(lf, 14, 40));
  ctx.globalAlpha = cIn * (1 - out);
  fitFont(era.line, 1680, 42, 500); ctx.fillStyle = C.ink;
  ctx.fillText(era.line, 120, 886 + (1 - cIn) * 24);
  ctx.restore();

  const dotYear = prev ? lerp(prev.year, era.year, yu) : era.year;
  timeline(e === 0 ? 1 : 1, dotYear, yu > 0.5 ? e : e - 1);
}

// ---- outro -----------------------------------------------------------------
function outro(f) {
  header(1, true);
  const a = E.outExpo(prog(f, 0, 24));
  ctx.save();
  ctx.textAlign = 'center';
  ctx.globalAlpha = a;
  font(116, 800); ctx.letterSpacing = '-2px';
  const l1 = 'Five ideas. ', l2 = 'Same problem.';
  const w1 = ctx.measureText(l1).width, w2 = ctx.measureText(l2).width, xs = W / 2 - (w1 + w2) / 2;
  ctx.textAlign = 'left';
  ctx.fillStyle = C.ink; ctx.fillText(l1, xs, 360 + (1 - a) * 50);
  const b = E.outExpo(prog(f, 8, 32));
  ctx.globalAlpha = b; ctx.fillStyle = C.amber; ctx.fillText(l2, xs + w1, 360 + (1 - b) * 50);
  ctx.letterSpacing = '0px';
  ctx.textAlign = 'center';
  ERAS.forEach((e, k) => {
    const u = E.outExpo(prog(f, 12 + k * 4, 38 + k * 4));
    const x = 240 + k * 360;
    ctx.globalAlpha = u;
    font(64, 800); ctx.fillStyle = C.ink; ctx.fillText(String(e.year), x, 560 + (1 - u) * 40);
    font(32, 500); ctx.fillStyle = C.dim; ctx.fillText(e.name, x, 610 + (1 - u) * 40);
    // tiny sorted bars under each era
    for (let q = 0; q < 6; q++) {
      const hq = (8 + q * 9) * u;
      ctx.fillStyle = C.amber; ctx.fillRect(x - 51 + q * 18, 700 - hq, 12, hq);
    }
  });
  ctx.globalAlpha = E.outExpo(prog(f, 34, 58));
  font(38, 500); ctx.fillStyle = C.dim;
  ctx.fillText('Standard libraries still build on them.', W / 2, 800);
  ctx.restore();
  timeline(1, 2002, 4);
}

// ---- picture -------------------------------------------------------------
function draw(f) {
  reset();
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  if (f < INTRO) {
    intro(f);
    timeline(E.outCubic(prog(f, 58, 72)), 1945, -1);
  } else if (f < OUTRO) {
    const g = f - INTRO; eraScene(Math.floor(g / ERA_LEN), g % ERA_LEN);
  } else outro(f - OUTRO);
  reset();
}

// ---- sound (rendered offline, returned as one AudioBuffer) ---------------
const midi = m => 440 * Math.pow(2, (m - 69) / 12);
function makeIR(ac, seconds, decay, seed) {
  const r = mulberry32(seed), len = Math.floor(seconds * ac.sampleRate), b = ac.createBuffer(2, len, ac.sampleRate);
  for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (r() * 2 - 1) * Math.pow(1 - i / len, decay); }
  return b;
}
async function renderAudio() {
  const SR = 48000, dur = FRAMES / FPS;
  const ac = new OfflineAudioContext(2, Math.round(SR * dur), SR);
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -14; comp.knee.value = 10; comp.ratio.value = 3; comp.attack.value = 0.01; comp.release.value = 0.25;
  const MG = 1.7, master = ac.createGain(); master.gain.value = MG;
  master.gain.setValueAtTime(0, 0); master.gain.linearRampToValueAtTime(MG, 0.04);
  master.gain.setValueAtTime(MG, dur - 0.35); master.gain.linearRampToValueAtTime(0, dur - 0.01);
  comp.connect(master).connect(ac.destination);
  const verb = ac.createConvolver(); verb.buffer = makeIR(ac, 2.6, 3.2, 99);
  const wet = ac.createGain(); wet.gain.value = 0.32; verb.connect(wet).connect(comp);
  const dry = ac.createGain(); dry.gain.value = 1; dry.connect(comp); dry.connect(verb);

  // pad: one chord per scene, soft triangles through a lowpass
  const padLP = ac.createBiquadFilter(); padLP.type = 'lowpass'; padLP.frequency.value = 1100; padLP.Q.value = 0.4;
  const padBus = ac.createGain(); padBus.gain.value = 1; padLP.connect(padBus).connect(dry);
  const CH = [
    { f: 0, notes: [57, 60, 64, 71], bass: 45 },                         // Am9
    ...ERAS.map((_, k) => ({ f: INTRO + k * ERA_LEN, notes: [[53, 57, 60, 64], [55, 60, 62, 64], [55, 59, 62, 67], [57, 60, 62, 65], [53, 57, 60, 67]][k],
      bass: [41, 48, 43, 50, 41][k] })),
    { f: OUTRO, notes: [57, 60, 64, 71], bass: 45 },
  ];
  CH.forEach((c, k) => {
    const t0 = c.f / FPS, t1 = k + 1 < CH.length ? CH[k + 1].f / FPS : dur;
    const voice = (freq, type, vol, pan, dest) => {
      const o = ac.createOscillator(), g = ac.createGain(), p = ac.createStereoPanner();
      o.type = type; o.frequency.value = freq; p.pan.value = pan;
      g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0 + (k === 0 ? 0.25 : 0.9));
      g.gain.setValueAtTime(vol, Math.max(t0 + 1, t1 - 0.2)); g.gain.linearRampToValueAtTime(0, Math.min(dur, t1 + 0.9));
      o.connect(g).connect(p).connect(dest); o.start(t0); o.stop(Math.min(dur, t1 + 1));
    };
    c.notes.forEach((m, q) => {
      voice(midi(m) * Math.pow(2, 4 / 1200), 'triangle', 0.028, -0.35 + q * 0.05, padLP);
      voice(midi(m) * Math.pow(2, -4 / 1200), 'triangle', 0.028, 0.35 - q * 0.05, padLP);
    });
    voice(midi(c.bass), 'sine', 0.09, 0, dry);
  });

  // step ticks: one short blip per write/swap, pitched by the value written (A minor pentatonic)
  const PENTA = [0, 3, 5, 7, 10];
  const pitchOf = (v, n) => { const q = Math.round((v - 1) / Math.max(1, n - 1) * 10); return midi(69 + 12 * Math.floor(q / 5) + PENTA[q % 5]); };
  const tick = (at, freq, vol, pan = 0) => {
    const o = ac.createOscillator(), g = ac.createGain(), p = ac.createStereoPanner();
    o.type = 'sine'; o.frequency.value = freq; p.pan.value = pan;
    g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(vol, at + 0.004); g.gain.exponentialRampToValueAtTime(0.0005, at + 0.11);
    o.connect(g).connect(p).connect(dry); o.start(at); o.stop(at + 0.12);
  };
  // intro sweep: every bar lands with a rising blip
  for (let p = 0; p < INTRO_N; p++) {
    const v = INTRO_PERM[p]; tick((introLand(v) + 6) / FPS, pitchOf(v, INTRO_N), 0.035, -0.6 + 1.2 * (v / INTRO_N));
  }
  ERAS.forEach((era, e) => {
    const g0 = INTRO + e * ERA_LEN, ev = era.ev;
    for (let lf = RUN0; lf <= RUN1; lf++) {
      const k0 = runK(lf - 1, ev), k1 = runK(lf, ev);
      let made = 0;
      for (let j = Math.floor(k0) + 1; j <= Math.floor(k1) && made < 2; j++) {
        const s = ev[Math.min(ev.length - 1, j + 1)];
        if (s.t !== 's' && s.t !== 'w') continue;
        const at = (g0 + lf - 1 + (j - k0) / Math.max(1e-6, k1 - k0)) / FPS;
        const v = s.a[s.i], pos = s.i / (era.n - 1);
        tick(at, pitchOf(v, era.n), 0.05, -0.5 + pos);
        made++;
      }
    }
    // done-sweep glissando
    for (let i = 0; i < era.n; i++) {
      const at = (g0 + SWEEP0 + (i / (era.n + 2)) * (SWEEP1 - SWEEP0)) / FPS;
      tick(at, pitchOf(i + 1, era.n) * 2, 0.03, -0.5 + i / (era.n - 1));
    }
    // soft air on each scene change
    const at = g0 / FPS, len = 0.7, nb = ac.createBuffer(1, Math.floor(len * SR), SR), r = mulberry32(300 + e), d = nb.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = r() * 2 - 1;
    const src = ac.createBufferSource(), bp = ac.createBiquadFilter(), gg = ac.createGain();
    src.buffer = nb; bp.type = 'bandpass'; bp.Q.value = 1.2;
    bp.frequency.setValueAtTime(500, at); bp.frequency.exponentialRampToValueAtTime(2600, at + len);
    gg.gain.setValueAtTime(0, at); gg.gain.linearRampToValueAtTime(0.05, at + 0.25); gg.gain.linearRampToValueAtTime(0, at + len);
    src.connect(bp).connect(gg).connect(dry); src.start(at);
  });
  return ac.startRendering();
}

window.__motion = {
  title: 'A Short History of Sorting',
  description: 'Merge sort, Shellsort, quicksort, heapsort and Timsort, 1945 to 2002, each one running for real on a row of bars.',
  fps: FPS, width: W, height: H, frames: FRAMES,
  poster: INTRO + 2 * ERA_LEN + 70,
  gifStart: 2.4,
  seek(i) { draw(Math.max(0, Math.min(FRAMES - 1, Math.floor(i)))); },
  audio: renderAudio,
};

/* ==========================================================================
   PLAYER — identical in every piece; keep as is.
   Autoplays and loops, starts sound on the first click, ?frame=N pauses on a
   frame. When the renderer sets window.__MOTION_RENDER__ it stays out of the way.
   ========================================================================== */
(function player() {
  const M = window.__motion, btn = document.getElementById('sound');
  const dur = M.frames / M.fps;
  if (window.__MOTION_RENDER__) { btn.hidden = true; M.seek(0); return; }
  const q = new URLSearchParams(location.search);
  if (q.has('frame')) { btn.hidden = true; M.seek(+q.get('frame') || 0); return; }
  let t0 = performance.now(), ac = null, src = null, buf = null, paused = false, pausedAt = 0;
  const clock = () => ac && src ? (ac.currentTime - t0) : (performance.now() - t0) / 1000;
  function loop() {
    if (!paused) M.seek(Math.floor(((clock() % dur) + dur) % dur * M.fps));
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  btn.addEventListener('click', async () => {
    if (src) { src.stop(); src = null; btn.textContent = 'Click for sound'; t0 = performance.now(); return; }
    btn.textContent = 'Loading sound…';
    ac = ac || new AudioContext({ sampleRate: 48000 });
    buf = buf || await M.audio();
    await ac.resume();
    src = ac.createBufferSource(); src.buffer = buf; src.loop = true; src.connect(ac.destination);
    t0 = ac.currentTime + 0.05; src.start(t0);        // picture restarts from frame 0 in sync with the sound
    btn.textContent = 'Sound on — click to mute';
  });
  addEventListener('keydown', e => {
    if (e.code !== 'Space') return;
    e.preventDefault(); paused = !paused;
    if (ac) paused ? ac.suspend() : ac.resume();
    if (!ac) { if (paused) pausedAt = performance.now(); else t0 += performance.now() - pausedAt; }
  });
})();
</script>
