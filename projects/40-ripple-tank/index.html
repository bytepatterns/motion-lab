<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="teambytepatterns">
<meta name="description" content="A ripple tank computed pixel by pixel: one source makes circles, a second one makes an interference pattern, and the lines where crest always meets trough stay still; pull the sources apart and the still lines multiply from 6 to 12.">
<title>Ripple Tank — motion-lab</title>
<style>
  /* Player chrome. The piece itself lives entirely in the canvas. */
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; font: 500 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; }
  canvas { display: block; width: min(100vw, calc(100vh * 16 / 9)); height: auto; aspect-ratio: 16 / 9; }
  #sound { position: fixed; left: 16px; bottom: 16px; padding: 8px 14px; border: 1px solid rgba(255,255,255,.35); border-radius: 999px;
           background: rgba(0,0,0,.55); color: #fff; font: inherit; cursor: pointer; }
  #sound[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080" aria-label="Blue ripples spread from one glowing point, then from two; where the two sets of waves meet, fans of still lines appear and are traced in coral, and as the two points move apart the fan gets denser"></canvas>
<button id="sound" type="button">Click for sound</button>
<script>
'use strict';
/* ==========================================================================
   PIECE — Ripple Tank.
   Two point sources in a shallow tank send out circular waves of the same
   wavelength, in phase. At every pixel the two waves are added:
     height = sum over sources of  A(r) · sin(k·r − ω·t)
   with k = 2π/λ, a gentle 1/√r fall-off, and a front that only reaches
   distance c·(t − start). Where the paths from the two sources differ by
   half a wavelength (plus whole wavelengths) crest always meets trough and
   the water never moves: the nodal lines, which are hyperbolas with the
   sources as foci. Two sources d apart have 2·⌊d/λ + ½⌋ of them, so pulling
   the sources from 3λ to 6λ apart takes the count from 6 to 12.
   The field is computed per pixel of the tank on a one-third-resolution grid (ImageData)
   and scaled up; the still lines are drawn exactly, from the hyperbola.
   Everything is a function of the frame number, so seek(i) is pure in i.
   ========================================================================== */
const W = 1920, H = 1080, FPS = 30;
const cv = document.getElementById('stage');
const ctx = cv.getContext('2d', { willReadFrequently: true });   // CPU raster: identical pixels on every redraw
const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
const MONO = 'ui-monospace, "Cascadia Code", Consolas, Menlo, monospace';

// ---- helpers -------------------------------------------------------------
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (f, a, b) => clamp((f - a) / (b - a));
const smooth = t => t * t * (3 - 2 * t);
const E = {
  inCubic: t => t * t * t,
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inOutCubic: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outExpo: t => t === 1 ? 1 : 1 - Math.pow(2, -10 * t),
  inExpo: t => t === 0 ? 0 : Math.pow(2, 10 * t - 10),
  inOutExpo: t => t === 0 ? 0 : t === 1 ? 1 : t < .5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2,
  outBack: t => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2),
};
/** Canvas text; `max` shrinks the size until the line fits. Returns the width drawn. */
function text(g, str, x, y, { size = 40, weight = 600, color = '#fff', alpha = 1, spacing = 0, align = 'left', fam = FONT, base = 'alphabetic', max = 0 } = {}) {
  if (alpha <= 0.002 || !str) return 0;
  g.font = `${weight} ${size}px ${fam}`; g.letterSpacing = spacing + 'px';
  if (max) { const w0 = g.measureText(str).width; if (w0 > max) { size *= max / w0; g.font = `${weight} ${size}px ${fam}`; } }
  g.textAlign = align; g.textBaseline = base;
  const a0 = g.globalAlpha; g.globalAlpha = a0 * alpha; g.fillStyle = color;
  g.fillText(str, x, y);
  const w = g.measureText(str).width;
  g.globalAlpha = a0; g.letterSpacing = '0px';
  return w;
}
const measure = (g, str, size, weight = 800, fam = FONT, spacing = 0) => { g.font = `${weight} ${size}px ${fam}`; g.letterSpacing = spacing + 'px'; const w = g.measureText(str).width; g.letterSpacing = '0px'; return w; };
const env = (f, a, b, fin = 12, fout = 10) => {
  const i = E.outCubic(prog(f, a, a + fin)), o = 1 - E.inCubic(prog(f, b - fout, b));
  return [Math.min(i, o), (1 - i) * 24 - (1 - o) * 10];
};

// ---- palette -------------------------------------------------------------
const C = {
  bg: '#060B14', bgRGB: '6,11,20', paper: '#EEF3F6', dim: 'rgba(238,243,246,0.62)', faint: 'rgba(238,243,246,0.16)',
  accent: '#FF7A66', src: '#FFE7A8', srcRGB: '255,231,168',
  // water, by height from trough (0) to crest (1): mostly dark, only the high crests light up
  water: [[0, [7, 17, 32]], [0.55, [7, 17, 32]], [0.64, [18, 56, 96]], [0.78, [60, 160, 210]], [0.92, [170, 234, 250]], [1, [236, 252, 255]]],
};
const LUT = (() => {
  const L = new Uint8ClampedArray(256 * 3), S = C.water;
  for (let i = 0; i < 256; i++) {
    const u = i / 255; let k = 0; while (k < S.length - 2 && u > S[k + 1][0]) k++;
    const t = clamp((u - S[k][0]) / (S[k + 1][0] - S[k][0]));
    for (let c = 0; c < 3; c++) L[i * 3 + c] = Math.round(lerp(S[k][1][c], S[k + 1][1][c], t));
  }
  return L;
})();

// ---- the tank ------------------------------------------------------------------------------
const FREQ = 1.1;                                 // waves per second from each source
const TAU = Math.PI * 2;
const stillLines = (d, lam) => 2 * Math.floor(d / lam + 0.5);

function buildTL(o) {
  const TL = Object.assign({}, o);
  TL.caps = [
    [TL.a0 + 40, TL.b0 + 18, 'One source:|circles.'],
    [TL.b0 + 14, TL.nodes - 2, 'Add a second source.|The waves add up.'],
    [TL.nodes, TL.sep - 2, 'Crest meets trough:|the water stays still.'],
    [TL.sep, TL.calm, 'Pull them apart:|more still lines.'],
  ];
  return TL;
}
/** Separation of the two sources at frame f, in wavelengths. */
const sepAt = (TL, f) => lerp(TL.d0, TL.d1, E.inOutCubic(prog(f, TL.sep + 10, TL.sepEnd)));
/** Source positions (full-resolution px) at frame f: symmetric about the centre, along the axis. */
function sources(G, f) {
  const d = sepAt(G.TL, f) * G.lam / 2, [ux, uy] = G.axis;
  return [[G.cx - ux * d, G.cy - uy * d], [G.cx + ux * d, G.cy + uy * d]];
}

/** A(r)·cos(k·r) and A(r)·sin(k·r) sampled every 1/32 px, once per stage (phase error under 0.004 rad). */
const RQ = 32;
function waveTable(G) {
  if (G.wt) return G.wt;
  const n = Math.ceil(Math.hypot(G.w, G.h) * 1.5 * RQ) + 2, co = new Float32Array(n), si = new Float32Array(n), k = TAU / G.lam, fall = 1 / (0.9 * G.lam);
  for (let q = 0; q < n; q++) { const r = q / RQ, A = 1 / Math.sqrt(1 + r * fall); co[q] = A * Math.cos(k * r); si[q] = A * Math.sin(k * r); }
  return (G.wt = { co, si });
}
/** Distance, fall-off and phase of every grid pixel from one source at (sx, sy). */
function fillTab(e, sx, sy, ox, oy, nx, ny, sc, wt) {
  const R = e.r, CO = e.co, SI = e.si, TC = wt.co, TS = wt.si;
  for (let j = 0, o = 0; j < ny; j++) {
    const dy = oy + (j + 0.5) * sc - sy;
    for (let i = 0; i < nx; i++, o++) {
      const dx = ox + (i + 0.5) * sc - sx, r = Math.sqrt(dx * dx + dy * dy), q = (r * RQ + 0.5) | 0;
      R[o] = r; CO[o] = TC[q]; SI[o] = TS[q];
    }
  }
}
/** The tank outline, a rounded rectangle. */
const tankPath = T => { const p = new Path2D(); p.roundRect(T.x, T.y, T.w, T.h, T.r); return p; };
/** Draws the water surface for frame f into the tank. */
function water(g, G, f) {
  const TL = G.TL, t = f / FPS, S = sources(G, f), k = TAU / G.lam, w = TAU * FREQ, c = G.lam * FREQ;
  const on = [TL.a0, TL.b0].map(s => (f - s) / FPS);                 // seconds since each source started
  const amp = on.map(s => E.outCubic(clamp(s / 1.2)));
  const TK = G.tank, nx = G.gw, ny = G.gh, sc = TK.w / nx, img = G.img, D = img.data;
  const cw = Math.cos(w * t), sw = Math.sin(w * t);
  // per source, the distance, fall-off and phase of every pixel depend only on where the source is:
  // they are kept until the source moves (a cache of pure values; the picture does not depend on it)
  const T = [0, 1].map(s => {
    const key = S[s][0] + ',' + S[s][1];
    const e = G.tabs[s] || (G.tabs[s] = { key: '', r: new Float32Array(nx * ny), co: new Float32Array(nx * ny), si: new Float32Array(nx * ny) });
    if (e.key !== key) {
      e.key = key;
      fillTab(e, S[s][0], S[s][1], TK.x, TK.y, nx, ny, sc, waveTable(G));
    }
    return e;
  });
  const R0 = c * on[0], R1 = c * on[1], FW = G.lam * 0.9, a0 = amp[0], a1 = amp[1];
  const r0 = T[0].r, c0 = T[0].co, s0 = T[0].si, r1 = T[1].r, c1 = T[1].co, s1 = T[1].si;
  for (let o = 0, n = nx * ny; o < n; o++) {
    let re = 0, im = 0;
    if (a0 > 0) { const fr = (R0 - r0[o]) / FW; if (fr > 0) { const A = a0 * (fr < 1 ? fr : 1); re += A * c0[o]; im += A * s0[o]; } }   // the front has not gone farther yet
    if (a1 > 0) { const fr = (R1 - r1[o]) / FW; if (fr > 0) { const A = a1 * (fr < 1 ? fr : 1); re += A * c1[o]; im += A * s1[o]; } }
    const v = im * cw - re * sw;                                            // = sum of A sin(k r - w t)
    const q = Math.max(0, Math.min(255, Math.round(127.5 + v * 150))) * 3, p = o * 4;
    D[p] = LUT[q]; D[p + 1] = LUT[q + 1]; D[p + 2] = LUT[q + 2]; D[p + 3] = 255;
  }
  G.bx.putImageData(img, 0, 0);
  g.save(); g.clip(tankPath(TK)); g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'low';
  g.drawImage(G.buf, TK.x, TK.y, TK.w, TK.h); g.restore();
  return { S, amp };
}
/** The still lines: |r1 - r2| = (m + 1/2) λ, drawn from the hyperbola with foci at the sources. */
function nodal(g, G, f, S, alpha) {
  if (alpha <= 0.01) return 0;
  const TL = G.TL, d = sepAt(TL, f) * G.lam, cHalf = d / 2, [ux, uy] = G.axis, vx0 = -uy, vy0 = ux;
  const reach = E.inOutCubic(prog(f, TL.nodes, TL.nodes + 40));
  const p = new Path2D();
  let n = 0;
  for (let m = 0; ; m++) {
    const a = (m + 0.5) * G.lam / 2; if (a >= cHalf) break;
    const b = Math.sqrt(cHalf * cHalf - a * a), sMax = 4.2 * reach;
    for (const side of [-1, 1]) {
      n++;
      for (let q = -60; q <= 60; q++) {
        const s = q / 60 * sMax, u = side * a * Math.cosh(s), v = b * Math.sinh(s);
        const x = G.cx + ux * u + vx0 * v, y = G.cy + uy * u + vy0 * v;
        q === -60 ? p.moveTo(x, y) : p.lineTo(x, y);
      }
    }
  }
  g.save(); g.clip(tankPath(G.tank)); g.globalAlpha = alpha; g.strokeStyle = C.accent; g.lineWidth = G.nlw; g.setLineDash([G.nlw * 5, G.nlw * 3.4]);
  g.lineCap = 'round'; g.stroke(p); g.restore();
  return n;
}
function sourceDots(g, G, f, S, amp) {
  S.forEach(([x, y], s) => {
    if (amp[s] <= 0) return;
    const pulse = 0.5 + 0.5 * Math.cos(TAU * FREQ * f / FPS);
    g.save();
    const gl = g.createRadialGradient(x, y, 0, x, y, 46);
    gl.addColorStop(0, `rgba(${C.srcRGB},${0.7 * amp[s]})`); gl.addColorStop(1, `rgba(${C.srcRGB},0)`);
    g.fillStyle = gl; g.fillRect(x - 46, y - 46, 92, 92);
    g.globalAlpha = amp[s]; g.fillStyle = C.src; g.beginPath(); g.arc(x, y, 7 + 2 * pulse, 0, TAU); g.fill();
    g.restore();
  });
}
/** A bracket between the sources showing d in wavelengths. */
function bracket(g, G, f, S, alpha) {
  if (alpha <= 0.01) return;
  const [ux, uy] = G.axis, off = G.brOff, nx = -uy * off, ny = ux * off;
  const [a, b] = S, str = `d = ${sepAt(G.TL, f).toFixed(1)} λ`;
  g.save(); g.globalAlpha = alpha; g.strokeStyle = C.paper; g.lineWidth = 2;
  g.beginPath(); g.moveTo(a[0] + nx * 0.6, a[1] + ny * 0.6); g.lineTo(a[0] + nx, a[1] + ny); g.lineTo(b[0] + nx, b[1] + ny); g.lineTo(b[0] + nx * 0.6, b[1] + ny * 0.6); g.stroke();
  g.restore();
  const mx = (a[0] + b[0]) / 2 + nx * 1.0, my = (a[1] + b[1]) / 2 + ny * 1.0;
  const tw = measure(g, str, G.bfs, 800, MONO);
  const lx = G.brLabel === 'side' ? mx + (off < 0 ? -tw - 18 : 18) : mx - tw / 2, ly = G.brLabel === 'side' ? my + G.bfs * 0.35 : my - 16;
  g.save(); g.globalAlpha = alpha; g.fillStyle = `rgba(${C.bgRGB},0.78)`; g.fillRect(lx - 10, ly - G.bfs * 0.95, tw + 20, G.bfs * 1.35); g.restore();
  text(g, str, lx, ly, { size: G.bfs, weight: 800, color: C.paper, fam: MONO, alpha });
}
function caption(g, G, f) {
  for (const [t0, t1, str] of G.TL.caps) {
    const [a, dy] = env(f, t0, t1, 12, 10); if (a <= 0) continue;
    const [p1, p2] = str.split('|');
    if (G.capTwo) {
      text(g, p1, G.capX, G.capY + dy, { size: G.cap, weight: 850, color: C.paper, spacing: -1, alpha: a, max: G.capMax });
      text(g, p2, G.capX, G.capY + G.cap * 1.14 + dy, { size: G.cap, weight: 850, color: C.accent, spacing: -1, alpha: a, max: G.capMax });
    } else {
      const w1 = text(g, p1 + ' ', G.capX, G.capY + dy, { size: G.cap, weight: 850, color: C.paper, spacing: -1, alpha: a });
      text(g, p2, G.capX + w1, G.capY + dy, { size: G.cap, weight: 850, color: C.accent, spacing: -1, alpha: a });
    }
  }
}
function plate(g, x, y, w, size, alpha) {
  g.save(); g.globalAlpha = alpha; g.fillStyle = `rgba(${C.bgRGB},0.8)`; g.fillRect(x - 16, y - size * 1.05, w + 32, size * 1.5); g.restore();
}
function readout(g, G, f, lines) {
  const TL = G.TL, [a] = env(f, TL.a0 + 40, TL.end + 10, 12, 12);
  if (a <= 0) return;
  const s1 = 'λ = ', s2 = `${G.lam} px  ·  ${FREQ} waves/s`, w1 = measure(g, s1, G.fo, 700, MONO), w2 = measure(g, s2, G.fo, 800, MONO);
  plate(g, G.foX, G.foY, w1 + w2, G.fo, a);
  text(g, s1, G.foX, G.foY, { size: G.fo, weight: 700, color: C.dim, fam: MONO, alpha: a });
  text(g, s2, G.foX + w1, G.foY, { size: G.fo, weight: 800, color: C.paper, fam: MONO, alpha: a });
  const na = a * E.outCubic(prog(f, TL.nodes + 10, TL.nodes + 30));
  if (na > 0.01) {
    const r1 = `${lines}`, r2 = ' still lines', v1 = measure(g, r1, G.fo, 800, MONO), v2 = measure(g, r2, G.fo, 700, MONO);
    const x = G.pcAlign === 'right' ? G.pcX - v1 - v2 : G.pcX;
    plate(g, x, G.pcY, v1 + v2, G.fo, na);
    text(g, r1, x, G.pcY, { size: G.fo, weight: 800, color: C.accent, fam: MONO, alpha: na });
    text(g, r2, x + v1, G.pcY, { size: G.fo, weight: 700, color: C.paper, fam: MONO, alpha: na });
  }
}
function finale(g, G, f) {
  const TL = G.TL, k1 = E.outCubic(prog(f, TL.calm, TL.calm + 18)), k2 = E.outCubic(prog(f, TL.calm + 10, TL.calm + 28));
  if (k1 <= 0) return;
  const out = 1 - E.inCubic(prog(f, TL.end - 6, TL.end + 12));
  g.save(); g.fillStyle = `rgba(${C.bgRGB},${0.62 * k1 * out})`; g.fillRect(0, G.fnY - G.fn * 1.15, G.w, G.fn * 2.7); g.restore();
  text(g, 'Two sources.', G.fnX, G.fnY, { size: G.fn, weight: 900, color: C.paper, spacing: -2, align: G.fnAlign, alpha: k1 * out, max: G.fnMax });
  text(g, `${stillLines(TL.d1, 1)} lines that never move.`, G.fnX, G.fnY + G.fn * 1.1, { size: G.fn, weight: 900, color: C.accent, spacing: -2, align: G.fnAlign, alpha: k2 * out, max: G.fnMax });
}
function scene(g, G, f) {
  const TL = G.TL, { S, amp } = water(g, G, f);
  g.save(); g.strokeStyle = C.faint; g.lineWidth = 2; g.stroke(tankPath(G.tank)); g.restore();
  const na = E.outCubic(prog(f, TL.nodes, TL.nodes + 16)) * (1 - 0.6 * E.inCubic(prog(f, TL.calm, TL.calm + 20)));
  const lines = stillLines(sepAt(TL, f), 1);
  nodal(g, G, f, S, na);
  sourceDots(g, G, f, S, amp);
  bracket(g, G, f, S, E.outCubic(prog(f, TL.b0 + 20, TL.b0 + 40)) * (1 - E.inCubic(prog(f, TL.calm - 10, TL.calm + 10))));
  for (const [y0, y1] of G.scrims) {
    const gr = g.createLinearGradient(0, y0, 0, y1);
    gr.addColorStop(0, `rgba(${C.bgRGB},0.9)`); gr.addColorStop(1, `rgba(${C.bgRGB},0)`);
    g.fillStyle = gr; g.fillRect(0, Math.min(y0, y1), G.w, Math.abs(y1 - y0));
  }
  caption(g, G, f); readout(g, G, f, lines); finale(g, G, f);
}
function stage(G) {
  G.buf = document.createElement('canvas'); G.buf.width = G.gw; G.buf.height = G.gh;
  G.bx = G.buf.getContext('2d', { willReadFrequently: true }); G.img = G.bx.createImageData(G.gw, G.gh);
  G.tabs = [null, null];
  return G;
}

// ---- landscape picture ------------------------------------------------------------------
const TLL = buildTL({ a0: -50, b0: 150, nodes: 300, sep: 420, sepEnd: 560, calm: 620, end: 700, d0: 3, d1: 6 });
const FRAMES = TLL.end + 72;
const GL = stage({ TL: TLL, w: W, h: H, tank: { x: 240, y: 252, w: 1440, h: 708, r: 28 }, gw: 480, gh: 236, lam: 60, cx: 960, cy: 606, axis: [0, 1], nlw: 3, brOff: -150, brLabel: 'side', bfs: 30,
  scrims: [],
  capX: 120, capY: 216, cap: 52, capTwo: false, capMax: 1680,
  fo: 30, foX: 120, foY: 1004, pcX: 1800, pcY: 1004, pcAlign: 'right',
  fn: 96, fnX: W / 2, fnY: 520, fnAlign: 'center', fnMax: 1680 });
function hookL(f) {
  const o = 1 - E.inCubic(prog(f, 40, 56));
  if (o <= 0) return;
  const k = E.outExpo(prog(f, -8, 10)), k2 = E.outBack(prog(f, -6, 12));
  ctx.save(); ctx.fillStyle = `rgba(${C.bgRGB},${0.72 * o})`; ctx.fillRect(0, 400, W, 330); ctx.restore();
  text(ctx, 'Two ripples cross.', W / 2, 540 + (1 - k) * 30, { size: 108, weight: 900, color: C.paper, spacing: -3, align: 'center', alpha: o * Math.max(0.3, k) });
  text(ctx, 'Some water never moves.', W / 2, 670 + (1 - clamp(k2)) * 30, { size: 108, weight: 900, color: C.accent, spacing: -3, align: 'center', alpha: o * Math.max(0.3, clamp(k2)) });
}
function draw(f) {
  if (ctx.reset) ctx.reset();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none'; ctx.shadowBlur = 0;
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  const T = TLL, endK = E.inOutCubic(prog(f, T.end, T.end + 20)), a = 1 - endK;
  scene(ctx, GL, f);
  text(ctx, 'PHYSICS  ·  WAVE INTERFERENCE', 120, 104, { size: 26, weight: 600, color: C.dim, spacing: 5, alpha: a });
  text(ctx, 'BYTEPATTERNS', 1800, 104, { size: 26, weight: 600, color: C.dim, spacing: 5, align: 'right', alpha: a });
  hookL(f);
  if (endK > 0) {
    ctx.fillStyle = `rgba(${C.bgRGB},${0.86 * endK})`; ctx.fillRect(0, 0, W, H);
    const k1 = E.outCubic(prog(f, T.end + 6, T.end + 28)), k2 = E.outCubic(prog(f, T.end + 16, T.end + 38)), k3 = E.outCubic(prog(f, T.end + 26, T.end + 48));
    text(ctx, 'Ripple Tank', W / 2, 500 + (1 - k1) * 30, { size: 140, weight: 850, color: C.paper, spacing: -3, align: 'center', alpha: k1 });
    text(ctx, `two sources  ·  ${T.d0}λ to ${T.d1}λ apart  ·  ${stillLines(T.d0, 1)} to ${stillLines(T.d1, 1)} still lines`, W / 2, 580 + (1 - k2) * 20, { size: 42, weight: 500, color: C.accent, align: 'center', alpha: k2 });
    text(ctx, 'drawn in code  ·  bytepatterns.com', W / 2, 1000, { size: 32, weight: 600, color: C.paper, spacing: 3, align: 'center', alpha: k3 * 0.8 });
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.letterSpacing = '0px';
}

// ---- sound: a drop per source, two tones that beat against each other, a bell per still line ----
async function renderAudio(TL = TLL, frames = FRAMES) {
  const SR = 48000, dur = frames / FPS, LEN = Math.round(SR * dur);
  const ac = new OfflineAudioContext(2, LEN, SR);
  const at = fr => Math.max(0, fr / FPS);
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -16; comp.ratio.value = 3; comp.attack.value = 0.005; comp.release.value = 0.25;
  const master = ac.createGain(); master.gain.value = 0.9; master.connect(comp).connect(ac.destination);
  master.gain.setValueAtTime(0.9, dur - 1.0); master.gain.linearRampToValueAtTime(0.0001, dur - 0.02);
  const rnd = mulberry32(0x40C3);
  const ir = ac.createBuffer(2, SR * 3, SR);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let k = 0; k < d.length; k++) d[k] = (rnd() * 2 - 1) * Math.pow(1 - k / d.length, 2.4); }
  const verb = ac.createConvolver(); verb.buffer = ir; const vg = ac.createGain(); vg.gain.value = 0.42; verb.connect(vg).connect(master);
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  const bell = (t0, m, amp, pn, len = 1.8) => { for (const [r2, a2, d2] of [[1, 1, len], [2.76, 0.25, len * 0.4], [5.4, 0.07, len * 0.15]]) {
    const o = ac.createOscillator(); o.frequency.value = hz(m) * r2; const g = ac.createGain(), p = ac.createStereoPanner();
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(amp * a2, t0 + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d2);
    p.pan.value = pn; o.connect(g).connect(p); p.connect(master); p.connect(verb); o.start(t0); o.stop(t0 + d2 + 0.05); } };
  const drop = (t0, pn) => {
    const o = ac.createOscillator(), g = ac.createGain(), p = ac.createStereoPanner(); o.type = 'sine';
    o.frequency.setValueAtTime(520, t0); o.frequency.exponentialRampToValueAtTime(1500, t0 + 0.07);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.22, t0 + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.16);
    p.pan.value = pn; o.connect(g).connect(p); p.connect(master); p.connect(verb); o.start(t0); o.stop(t0 + 0.2);
  };
  // each source is a soft tone; the second is 1.5 Hz higher, so the two beat: interference you can hear
  const tone = (t0, t1, f0, pn, amp) => {
    for (const [mul, a2] of [[1, 1], [2, 0.3], [3, 0.1]]) {
      const o = ac.createOscillator(), g = ac.createGain(), p = ac.createStereoPanner(); o.type = 'sine'; o.frequency.value = f0 * mul;
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(amp * a2, t0 + 1.5); g.gain.setValueAtTime(amp * a2, t1 - 1);
      g.gain.exponentialRampToValueAtTime(0.0001, t1); p.pan.value = pn; o.connect(g).connect(p).connect(master); p.connect(verb); o.start(t0); o.stop(t1 + 0.05);
    }
  };
  tone(0, dur, hz(45), -0.35, 0.05);
  tone(at(TL.b0), dur, hz(45) + 1.5, 0.35, 0.05);
  // a slow ripple of plucks, one per wave from the first source
  for (let fr = Math.max(0, TL.a0); fr < TL.end; fr += FPS / FREQ) drop(at(fr), -0.2 + 0.4 * rnd());
  drop(at(TL.b0), 0.4);
  // the still lines: one bell each as they appear, then one for every line added as the sources separate
  const n0 = stillLines(TL.d0, 1);
  for (let q = 0; q < n0; q++) bell(at(TL.nodes + 8 + q * 5), 69 + [0, 2, 4, 7, 9, 12][q % 6], 0.05, (q / (n0 - 1) - 0.5) * 1.2);
  let last = n0;
  for (let fr = TL.sep; fr <= TL.sepEnd + 2; fr++) {
    const n = stillLines(sepAt(TL, fr), 1);
    if (n > last) { bell(at(fr), 69 + [0, 2, 4, 7, 9, 12, 14, 16][(n - n0) / 2 % 8] + 12, 0.06, -0.4); bell(at(fr) + 0.08, 69 + [0, 2, 4, 7, 9, 12, 14, 16][(n - n0) / 2 % 8] + 7, 0.05, 0.4); last = n; }
  }
  [62, 66, 69, 74].forEach((m, i) => bell(at(TL.calm) + i * 0.09, m, 0.06, -0.3 + i * 0.2));
  [69, 74, 78, 81].forEach((m, i) => bell(at(TL.end + 10 + i * 6), m, 0.06, -0.45 + i * 0.3));
  const buf = await ac.startRendering();
  let peak = 0; for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let k = 0; k < d.length; k++) peak = Math.max(peak, Math.abs(d[k])); }
  const norm = 0.85 / Math.max(peak, 1e-6);                          // every piece peaks at the same level
  for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let k = 0; k < d.length; k++) d[k] *= norm; }
  return buf;
}

/* ==========================================================================
   VERTICAL CUT — shared block, identical in every piece.
   1080x1920 for Reels, Shorts and TikTok (__motion.variants.vertical). The
   piece's own scene code is re-used and recomposed for a phone: everything a
   viewer must read stays inside the area no platform covers (x 60..900,
   y 230..1400); outside it there is only dimmed texture.
   ========================================================================== */
const VW = 1080, VH = 1920, SAFE = { x: 60, y: 230, w: 840, h: 1170, r: 900, b: 1400 };
const vcv = document.createElement('canvas'); vcv.width = VW; vcv.height = VH;
const vx = vcv.getContext('2d', { willReadFrequently: true });   // CPU raster: identical pixels on every redraw
const VL = 96, VR = 864;                                          // text column inside the safe area

function vReset() {
  vx.setTransform(1, 0, 0, 1, 0, 0); vx.globalAlpha = 1; vx.globalCompositeOperation = 'source-over';
  vx.filter = 'none'; vx.shadowBlur = 0; vx.shadowColor = 'transparent'; vx.letterSpacing = '0px'; vx.setLineDash([]);
  vx.textAlign = 'left'; vx.textBaseline = 'alphabetic'; vx.lineCap = 'butt'; vx.lineJoin = 'miter';
}
/** Canvas text on the vertical frame; `max` shrinks the size until the line fits. */
function vText(str, x, y, { size = 40, weight = 700, color = '#FFFFFF', align = 'left', spacing = 0, alpha = 1, fam = FONT, max = 0 } = {}) {
  if (alpha <= 0.002 || !str) return size;
  vx.font = `${weight} ${size}px ${fam}`; vx.letterSpacing = spacing + 'px';
  if (max) { const w = vx.measureText(str).width; if (w > max) { size = size * max / w; vx.font = `${weight} ${size}px ${fam}`; } }
  vx.textAlign = align; vx.textBaseline = 'alphabetic';
  const a0 = vx.globalAlpha; vx.globalAlpha = a0 * alpha; vx.fillStyle = color;
  vx.fillText(str, x + (align === 'center' ? spacing / 2 : align === 'right' ? spacing : 0), y);   // tracking is added after the last glyph too
  vx.globalAlpha = a0; vx.letterSpacing = '0px';
  return size;
}
/** Word-wraps with the given font; returns the lines. */
function vWrap(str, maxW, size, weight = 700, fam = FONT) {
  vx.font = `${weight} ${size}px ${fam}`; vx.letterSpacing = '0px';
  const words = str.split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (vx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur);
  return lines;
}
/** Fade envelope with a small rise: [alpha, dy]. */
function vEnv(v, a, b, fin = 8, fout = 8) {
  const i = E.outCubic(prog(v, a, a + fin)), o = 1 - E.inCubic(prog(v, b - fout, b));
  return [Math.min(i, o), (1 - i) * 22 - (1 - o) * 10];
}
/** Which segment of a cut list a vertical frame is in: segs = [{ at, src, len }] in frames. */
function vSeg(segs, v) {
  let k = 0; while (k < segs.length - 1 && v >= segs[k + 1].at) k++;
  const s = segs[k];
  return { k, s, local: v - s.at, src: s.src + (v - s.at) };
}
/** Dims everything outside the safe area to a quiet texture (brightness x 0.2), with a soft inner edge. */
function vShade(rgb, a = 0.8, feather = 40) {
  vx.save(); vx.setTransform(1, 0, 0, 1, 0, 0); vx.globalAlpha = 1; vx.globalCompositeOperation = 'source-over';
  vx.fillStyle = `rgba(${rgb},${a})`;
  vx.beginPath(); vx.rect(0, 0, VW, VH); vx.rect(SAFE.x, SAFE.y, SAFE.w, SAFE.h); vx.fill('evenodd');
  const strip = (x0, y0, x1, y1, rx, ry, rw, rh) => {
    const g = vx.createLinearGradient(x0, y0, x1, y1);
    g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`);
    vx.fillStyle = g; vx.fillRect(rx, ry, rw, rh);
  };
  strip(SAFE.x, 0, SAFE.x + feather, 0, SAFE.x, SAFE.y, feather, SAFE.h);
  strip(SAFE.r, 0, SAFE.r - feather, 0, SAFE.r - feather, SAFE.y, feather, SAFE.h);
  strip(0, SAFE.y, 0, SAFE.y + feather, SAFE.x, SAFE.y, SAFE.w, feather);
  strip(0, SAFE.b, 0, SAFE.b - feather, SAFE.x, SAFE.b - feather, SAFE.w, feather);
  vx.restore();
}
/** Series tag at the top of the safe area, e.g. MADE IN CODE · 04. */
function vTag(label, color, alpha = 1) {
  vText('MADE IN CODE', VL, 292, { size: 28, weight: 800, color, spacing: 5, alpha });
  vx.font = `800 28px ${FONT}`; vx.letterSpacing = '5px';
  const w = vx.measureText('MADE IN CODE').width; vx.letterSpacing = '0px';
  vText('·  ' + label, VL + w + 14, 292, { size: 28, weight: 600, color: 'rgba(255,255,255,0.72)', spacing: 3, alpha, max: VR - VL - w - 14 });
}
/** Big hook lines, left-aligned from y0; visible from frame 0, settles in a few frames. */
function vHook(v, lines, y0, { size = 84, lh = 1.08, color = '#FFFFFF', accent = null, weight = 800, spacing = -1.5, alpha = 1 } = {}) {
  const k = E.outExpo(prog(v, -6, 12));
  lines.forEach((ln, i) => {
    const kk = E.outExpo(prog(v, -12 + i * 2, 8 + i * 2));
    vText(ln, VL, y0 + i * size * lh + (1 - kk) * 30, { size, weight, spacing, color: accent && i === lines.length - 1 ? accent : color, alpha: alpha * Math.max(0.25, kk), max: VR - VL });
  });
  return k;
}
/** Closing card, the last 60 frames: piece title, "drawn in code · bytepatterns.com". l = frames into the card. */
function vEndCard(l, { title, line = '', ink = '#FFFFFF', dim = 'rgba(255,255,255,0.66)', accent = '#FFFFFF', scrim = '0,0,0', a = 0.84 }) {
  const k = E.outCubic(prog(l, 0, 12));
  vx.save(); vx.setTransform(1, 0, 0, 1, 0, 0);
  vx.fillStyle = `rgba(${scrim},${a * k})`; vx.fillRect(0, 0, VW, VH);
  vx.restore();
  const t1 = E.outExpo(prog(l, 3, 19)), t2 = E.outExpo(prog(l, 11, 27)), t3 = E.outExpo(prog(l, 19, 35));
  vx.fillStyle = accent; vx.globalAlpha = t1; vx.fillRect(VL, 742, 88 * t1, 7); vx.globalAlpha = 1;
  const size = vText(title, VL, 850 + (1 - t1) * 40, { size: 92, weight: 800, color: ink, spacing: -2, alpha: t1, max: VR - VL });
  const y2 = 850 + Math.max(size, 60) * 0.25 + 70;
  vx.font = `600 44px ${FONT}`;
  const lead = 'drawn in code  ·  ', lw = vx.measureText(lead).width;
  vText(lead, VL, y2 + (1 - t2) * 24, { size: 44, weight: 600, color: dim, alpha: t2 });
  vText('bytepatterns.com', VL + lw, y2 + (1 - t2) * 24, { size: 44, weight: 800, color: accent, alpha: t2 });
  if (line) vText(line, VL, y2 + 72 + (1 - t3) * 18, { size: 32, weight: 500, color: dim, alpha: t3, max: VR - VL });
}
/** Seeks a cut. The first frame a page draws is drawn twice: the very first read of a
 *  GPU-backed source canvas can come out a shade different from every later one. */
let vWarm = false;
function vSeek(draw, i, frames) {
  const f = Math.max(0, Math.min(frames - 1, Math.floor(i)));
  if (!vWarm) { vWarm = true; draw(f); }
  draw(f);
}
/** The soundtrack of a cut: the piece's own audio() spliced to the same segments as the picture. */
async function vAudio(segs, frames, { xf = 0.025, fadeOut = 0.6, extra = null } = {}) {
  const src = await renderAudio();
  const SR = 48000, dur = frames / FPS, ac = new OfflineAudioContext(2, Math.round(SR * dur), SR);
  const out = ac.createGain(); out.connect(ac.destination);
  out.gain.setValueAtTime(1, 0); out.gain.setValueAtTime(1, dur - fadeOut); out.gain.linearRampToValueAtTime(0, dur - 0.01);
  segs.forEach((s, k) => {
    const at = s.at / FPS, off = s.src / FPS, d = s.len / FPS;
    const pre = k === 0 ? 0 : Math.min(xf, off), post = k === segs.length - 1 ? 0 : xf;
    const b = ac.createBufferSource(), g = ac.createGain(); b.buffer = src;
    g.gain.setValueAtTime(pre ? 0 : 1, at - pre);
    if (pre) g.gain.linearRampToValueAtTime(1, at + pre);
    if (post) { g.gain.setValueAtTime(1, at + d - post); g.gain.linearRampToValueAtTime(0, at + d + post); }
    b.connect(g).connect(out); b.start(at - pre, off - pre, d + pre + post);
  });
  if (extra) extra(ac, out);
  const buf = await ac.startRendering();
  let peak = 0; for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) peak = Math.max(peak, Math.abs(d[i])); }
  if (peak > 0.9) for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] *= 0.9 / peak; }
  return buf;
}
/** A soft three-partial bell, for the closing card. */
function vChime(ac, dest, at, freq, vol = 0.08) {
  for (const [mul, v, dec] of [[1, 1, 1.8], [2.01, 0.35, 0.8], [3.02, 0.12, 0.4]]) {
    const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.value = freq * mul;
    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol * v, at + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, at + dec);
    o.connect(g).connect(dest); o.start(at); o.stop(at + dec + 0.05);
  }
}

/* VERTICAL CUT — this piece */
// The same tank on a 1080 x 1920 stage: the sources sit side by side, so the
// still lines fan up and down the tall frame; a shorter clock, same physics.
const TLV = buildTL({ a0: -50, b0: 110, nodes: 230, sep: 330, sepEnd: 440, calm: 470, end: 520, d0: 3, d1: 6 });
const VFR = TLV.end + 60, VEND = VFR - 60;
const GV = stage({ TL: TLV, w: VW, h: VH, tank: { x: 72, y: 492, w: 816, h: 756, r: 26 }, gw: 272, gh: 252, lam: 52, cx: 480, cy: 870, axis: [1, 0], nlw: 3, brOff: 120, brLabel: 'below', bfs: 30,
  scrims: [],
  capX: VL, capY: 380, cap: 50, capTwo: true, capMax: VR - VL,
  fo: 30, foX: VL, foY: 1300, pcX: VL, pcY: 1360, pcAlign: 'left',
  fn: 84, fnX: VL, fnY: 800, fnAlign: 'left', fnMax: VR - VL });
function hookV(v) {
  const o = 1 - E.inCubic(prog(v, 30, 44));
  if (o <= 0) return;
  vx.save(); vx.fillStyle = `rgba(${C.bgRGB},${0.72 * o})`; vx.fillRect(SAFE.x, 400, SAFE.w, 560); vx.restore();
  vHook(v, ['Two ripples', 'cross. Some', 'water never', 'moves.'], 500, { size: 104, accent: C.accent, color: C.paper, weight: 900, spacing: -2, alpha: o });
}
function vDraw(v) {
  if (vx.reset) vx.reset();
  vReset();
  vx.fillStyle = C.bg; vx.fillRect(0, 0, VW, VH);
  scene(vx, GV, v);
  hookV(v);
  vReset();
  vShade(C.bgRGB, 0.86);
  vTag('RIPPLE TANK', C.accent);
  if (v >= VEND) vEndCard(v - VEND, { title: 'Ripple Tank', line: `two sources  ·  ${stillLines(TLV.d0, 1)} to ${stillLines(TLV.d1, 1)} still lines`,
    ink: C.paper, dim: 'rgba(238,243,246,0.72)', accent: C.accent, scrim: C.bgRGB, a: 0.88 });
  vReset();
}

// The player asks for a frame on every display refresh; at 30 fps on a 60 Hz screen every other call
// asks for the frame already on the canvas, which is then left as it is (same frame, same pixels).
const shown = { L: -1, V: -1 };
window.__motion = {
  title: 'Ripple Tank',
  description: `Wave interference computed pixel by pixel: one source makes circles, a second makes an interference pattern, and the lines where crest always meets trough stay still. Pulling the sources from ${TLL.d0}λ to ${TLL.d1}λ apart takes them from ${stillLines(TLL.d0, 1)} to ${stillLines(TLL.d1, 1)} still lines (2·⌊d/λ + ½⌋), drawn exactly as hyperbolas; the two source tones beat 1.5 times a second.`,
  fps: FPS, width: W, height: H, frames: FRAMES,
  poster: TLL.nodes + 60,
  gifStart: Math.floor((TLL.nodes - 30) / FPS),
  seek(i) { const f = Math.max(0, Math.min(FRAMES - 1, Math.floor(i))); if (f !== shown.L) { shown.L = f; draw(f); } },
  audio: () => renderAudio(TLL, FRAMES),
  variants: {
    vertical: {
      width: VW, height: VH, frames: VFR, canvas: vcv,
      poster: TLV.sepEnd, gifStart: Math.floor((TLV.nodes - 20) / FPS),
      seek(i) { const v = Math.max(0, Math.min(VFR - 1, Math.floor(i))); if (v !== shown.V) { shown.V = v; vSeek(vDraw, v, VFR); } },
      audio: () => renderAudio(TLV, VFR),
    },
  },
};

/* ==========================================================================
   PLAYER — identical in every piece; keep as is.
   Autoplays and loops, starts sound on the first click, ?frame=N pauses on a
   frame, ?variant=vertical plays the vertical cut (if the piece has one).
   When the renderer sets window.__MOTION_RENDER__ it stays out of the way.
   ========================================================================== */
(function player() {
  const btn = document.getElementById('sound'), q = new URLSearchParams(location.search);
  let M = window.__motion;
  const V = !window.__MOTION_RENDER__ && M.variants && M.variants[q.get('variant')];
  if (V) {                                                // show the variant's own canvas instead
    M = Object.assign({}, M, V);
    V.canvas.style.cssText = `width:min(100vw,calc(100vh*${V.width}/${V.height}));height:auto;aspect-ratio:${V.width}/${V.height}`;
    document.querySelector('canvas').replaceWith(V.canvas);
  }
  const dur = M.frames / M.fps;
  if (window.__MOTION_RENDER__) { btn.hidden = true; M.seek(0); return; }
  if (q.has('frame')) { btn.hidden = true; M.seek(+q.get('frame') || 0); return; }
  let t0 = performance.now(), ac = null, src = null, buf = null, paused = false, pausedAt = 0;
  const clock = () => ac && src ? (ac.currentTime - t0) : (performance.now() - t0) / 1000;
  function loop() {
    if (!paused) M.seek(Math.floor(((clock() % dur) + dur) % dur * M.fps));
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  btn.addEventListener('click', async () => {
    if (src) { src.stop(); src = null; btn.textContent = 'Click for sound'; t0 = performance.now(); return; }
    btn.textContent = 'Loading sound…';
    ac = ac || new AudioContext({ sampleRate: 48000 });
    buf = buf || await M.audio();
    await ac.resume();
    src = ac.createBufferSource(); src.buffer = buf; src.loop = true; src.connect(ac.destination);
    t0 = ac.currentTime + 0.05; src.start(t0);        // picture restarts from frame 0 in sync with the sound
    btn.textContent = 'Sound on — click to mute';
  });
  addEventListener('keydown', e => {
    if (e.code !== 'Space') return;
    e.preventDefault(); paused = !paused;
    if (ac) paused ? ac.suspend() : ac.resume();
    if (!ac) { if (paused) pausedAt = performance.now(); else t0 += performance.now() - pausedAt; }
  });
})();
</script>
