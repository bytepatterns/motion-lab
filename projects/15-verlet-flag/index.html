<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="teambytepatterns">
<meta name="description" content="A flag made of Verlet points and springs rises in the wind, then a blade cuts its springs and it tears.">
<title>Held by Springs — motion-lab</title>
<style>
  /* Player chrome. The piece itself lives entirely in the canvas. */
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; font: 500 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; }
  canvas { display: block; width: min(100vw, calc(100vh * 16 / 9)); height: auto; aspect-ratio: 16 / 9; }
  #sound { position: fixed; left: 16px; bottom: 16px; padding: 8px 14px; border: 1px solid rgba(255,255,255,.35); border-radius: 999px;
           background: rgba(0,0,0,.55); color: #fff; font: inherit; cursor: pointer; }
  #sound[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080" aria-label="A cloth flag simulated with Verlet points and springs, waving in the wind and tearing"></canvas>
<button id="sound" type="button">Click for sound</button>
<script>
'use strict';
/* ==========================================================================
   PIECE — Held by Springs.
   A flag of 36 x 24 points in 3D. Each point stores where it is and where it
   was; the next position is x + (x - x_prev) + a dt^2 (Verlet). Springs
   (structural, shear and bend) are then relaxed eight times per step. Wind
   pushes on every triangle along its normal, so the cloth catches it and
   ripples. Late in the piece a blade cuts the springs along a line in the
   cloth's own grid, and the corner tears away.
   Determinism: a fixed-step simulation; the state after frame f depends only
   on f. Which springs are cut is a function of f alone (the blade follows a
   path in grid coordinates). seek(i) restores the nearest checkpoint (every
   15 frames) and steps forward.
   The fabric is a texture drawn once at load and mapped onto each triangle
   with an affine transform, then shaded by the triangle's normal.
   ========================================================================== */
const W = 1920, H = 1080, FPS = 30, FRAMES = 720;          // 24 s
const cv = document.getElementById('stage');
const ctx = cv.getContext('2d');
const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
const MONO = 'ui-monospace, "Cascadia Code", Consolas, Menlo, monospace';

// ---- helpers -------------------------------------------------------------
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (f, a, b) => clamp((f - a) / (b - a));
const smooth = t => t * t * (3 - 2 * t);
const E = {
  inCubic: t => t * t * t,
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inOutCubic: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outExpo: t => t === 1 ? 1 : 1 - Math.pow(2, -10 * t),
  inExpo: t => t === 0 ? 0 : Math.pow(2, 10 * t - 10),
  inOutExpo: t => t === 0 ? 0 : t === 1 ? 1 : t < .5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2,
  outBack: t => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2),
};
function text(g, str, x, y, { size = 40, weight = 600, color = '#fff', alpha = 1, spacing = 0, align = 'left', fam = FONT, base = 'alphabetic' } = {}) {
  if (alpha <= 0.002 || !str) return 0;
  g.font = `${weight} ${size}px ${fam}`; g.letterSpacing = spacing + 'px';
  g.textAlign = align; g.textBaseline = base;
  const a0 = g.globalAlpha; g.globalAlpha = a0 * alpha; g.fillStyle = color;
  g.fillText(str, x, y);
  const w = g.measureText(str).width;
  g.globalAlpha = a0; g.letterSpacing = '0px';
  return w;
}
const env = (f, a, b, fin = 12, fout = 10) => {
  const i = E.outCubic(prog(f, a, a + fin)), o = 1 - E.inCubic(prog(f, b - fout, b));
  return [Math.min(i, o), (1 - i) * 24 - (1 - o) * 10];
};

// ---- palette -------------------------------------------------------------
const C = { bg: '#0B0D14', bgRGB: '11,13,20', paper: '#F1ECE3', dim: 'rgba(241,236,227,0.62)', faint: 'rgba(241,236,227,0.3)',
  amber: '#F5B83D', coral: '#FF7A59', teal: '#58C4B8', navy: '#1A2040' };

// ---- timeline (frames) ---------------------------------------------------
const T = { windIn: 70, fabric: 150, fabricDone: 230, gust: 380, cut: 492, cutEnd: 548, end: 636 };

// ---- the cloth ---------------------------------------------------------------
const NX = 36, NY = 24, NP = NX * NY, SP = 22;               // points and rest spacing (px)
const POLE = { x: 0, y: 0 };                                  // cloth space: the pole is the line x = 0, y 0..(NY-1)*SP
const G = 800, DT = 1 / 60, SUB = 2, ITER = 8, DAMP = 0.992;
const P = new Float64Array(NP * 3), Q = new Float64Array(NP * 3), A = new Float64Array(NP * 3);
const pinned = i => i % NX === 0;
// springs: [a, b, rest, kind]; kind 0 structural, 1 shear, 2 bend
const SA = [], SB = [], SR = [], SK = [];
function spring(a, b, kind) { SA.push(a); SB.push(b); SR.push(0); SK.push(kind); }
for (let j = 0; j < NY; j++) for (let i = 0; i < NX; i++) {
  const p = j * NX + i;
  if (i < NX - 1) spring(p, p + 1, 0);
  if (j < NY - 1) spring(p, p + NX, 0);
  if (i < NX - 1 && j < NY - 1) { spring(p, p + NX + 1, 1); spring(p + 1, p + NX, 1); }
  if (i < NX - 2) spring(p, p + 2, 2);
  if (j < NY - 2) spring(p, p + 2 * NX, 2);
}
const NS = SA.length;
for (let s = 0; s < NS; s++) {
  const a = SA[s], b = SB[s], di = (b % NX) - (a % NX), dj = Math.floor(b / NX) - Math.floor(a / NX);
  SR[s] = Math.hypot(di, dj) * SP;
}
// the blade: a polyline in grid coordinates (i, j); a spring is cut when the blade passes its midpoint
const BLADE = [[35.5, 5.2], [30.5, 9.8], [27.2, 12.5], [22.8, 17.6], [19.5, 20.2], [16.4, 23.6]];
const CUT_AT = new Float64Array(NS).fill(1e9);
(function planCut() {
  const segs = []; let tot = 0;
  for (let k = 0; k < BLADE.length - 1; k++) { const [ax, ay] = BLADE[k], [bx, by] = BLADE[k + 1], L = Math.hypot(bx - ax, by - ay); segs.push({ ax, ay, bx, by, L, s0: tot }); tot += L; }
  for (let s = 0; s < NS; s++) {
    const a = SA[s], b = SB[s], mx = ((a % NX) + (b % NX)) / 2, my = (Math.floor(a / NX) + Math.floor(b / NX)) / 2;
    const reach = SK[s] === 2 ? 1.05 : 0.62;
    let best = 1e9, at = 0;
    for (const g of segs) {
      const u = clamp(((mx - g.ax) * (g.bx - g.ax) + (my - g.ay) * (g.by - g.ay)) / (g.L * g.L));
      const d = Math.hypot(mx - (g.ax + u * (g.bx - g.ax)), my - (g.ay + u * (g.by - g.ay)));
      if (d < best) { best = d; at = (g.s0 + u * g.L) / tot; }
    }
    if (best < reach) CUT_AT[s] = T.cut + at * (T.cutEnd - T.cut);
  }
})();
const bladeAt = f => {                                         // blade position in grid coordinates at frame f
  const u = prog(f, T.cut, T.cutEnd) * (BLADE.length - 1), k = Math.min(BLADE.length - 2, Math.floor(u)), r = u - k;
  return [lerp(BLADE[k][0], BLADE[k + 1][0], r), lerp(BLADE[k][1], BLADE[k + 1][1], r)];
};
const cutCount = f => { let n = 0; for (let s = 0; s < NS; s++) if (CUT_AT[s] <= f) n++; return n; };
const TOTAL_CUT = cutCount(1e8);
// the springs on each quad's four sides, to skip drawing torn quads
const QUAD = [];
{
  const idx = new Map(); for (let s = 0; s < NS; s++) if (SK[s] === 0) idx.set(SA[s] * NP + SB[s], s);
  for (let j = 0; j < NY - 1; j++) for (let i = 0; i < NX - 1; i++) {
    const p = j * NX + i;
    QUAD.push([p, p + 1, p + NX, p + NX + 1, idx.get(p * NP + p + 1), idx.get((p + NX) * NP + p + NX + 1), idx.get(p * NP + p + NX), idx.get((p + 1) * NP + p + NX + 1)]);
  }
}

function wind(t) {                                            // strength (px/s of air) at time t
  const f = t * FPS;
  const base = 520 * smooth(prog(f, T.windIn, T.windIn + 140));
  const gust = 380 * Math.exp(-Math.pow((f - T.gust) / 40, 2)) + 260 * Math.exp(-Math.pow((f - T.cutEnd - 10) / 50, 2));
  return base * (0.8 + 0.2 * Math.sin(t * 1.3) + 0.12 * Math.sin(t * 3.7 + 1)) + gust;
}
function initCloth() {
  for (let j = 0; j < NY; j++) for (let i = 0; i < NX; i++) {
    const p = (j * NX + i) * 3;
    P[p] = i * SP * 0.98; P[p + 1] = j * SP; P[p + 2] = Math.sin(i * 0.5) * 6;
    Q[p] = P[p]; Q[p + 1] = P[p + 1]; Q[p + 2] = P[p + 2];
  }
}
function step(f, sub) {
  const t = (f + sub / SUB) / FPS, ws = wind(t), fnow = f + sub / SUB;
  A.fill(0);
  for (let i = 0; i < NP; i++) A[i * 3 + 1] = G;
  // aerodynamic push on each triangle along its normal
  const kAir = 0.03;
  for (const q of QUAD) {
    const [a, b, c, d] = q;
    if (CUT_AT[q[4]] <= fnow || CUT_AT[q[5]] <= fnow || CUT_AT[q[6]] <= fnow || CUT_AT[q[7]] <= fnow) continue;   // torn: no sail
    for (const [p0, p1, p2] of [[a, b, c], [b, d, c]]) {
      const o0 = p0 * 3, o1 = p1 * 3, o2 = p2 * 3;
      const ux = P[o1] - P[o0], uy = P[o1 + 1] - P[o0 + 1], uz = P[o1 + 2] - P[o0 + 2];
      const vx = P[o2] - P[o0], vy = P[o2 + 1] - P[o0 + 1], vz = P[o2 + 2] - P[o0 + 2];
      const nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;   // |n| = 2 x area
      const nl = Math.hypot(nx, ny, nz) + 1e-9;
      const gi = (p0 % NX), gj = Math.floor(p0 / NX);
      const turb = 1 + 0.45 * Math.sin(gi * 0.33 - t * 7.1) * Math.cos(gj * 0.27 + t * 2.9);
      const wx = ws * turb, wy = -ws * 0.04, wz = ws * 0.22 * Math.sin(gi * 0.21 + gj * 0.13 + t * 4.3);
      const vxm = (P[o0] - Q[o0] + P[o1] - Q[o1] + P[o2] - Q[o2]) / (3 * DT);
      const vym = (P[o0 + 1] - Q[o0 + 1] + P[o1 + 1] - Q[o1 + 1] + P[o2 + 1] - Q[o2 + 1]) / (3 * DT);
      const vzm = (P[o0 + 2] - Q[o0 + 2] + P[o1 + 2] - Q[o1 + 2] + P[o2 + 2] - Q[o2 + 2]) / (3 * DT);
      const rx = wx - vxm, ry = wy - vym, rz = wz - vzm;
      const dn = (nx * rx + ny * ry + nz * rz) / nl;             // relative air speed along the normal
      const s = kAir * dn / 3 * Math.min(1, SP * SP * 1.5 / nl);  // force ~ area x normal speed, split over 3 points (area capped)
      for (const o of [o0, o1, o2]) { A[o] += nx * s * 0.5; A[o + 1] += ny * s * 0.5; A[o + 2] += nz * s * 0.5; }
    }
  }
  for (let i = 0; i < NP; i++) {
    if (pinned(i)) continue;
    const o = i * 3;
    for (let k = 0; k < 3; k++) { const x = P[o + k]; P[o + k] = x + clamp((x - Q[o + k]) * DAMP + A[o + k] * DT * DT, -30, 30); Q[o + k] = x; }
  }
  for (let it = 0; it < ITER; it++) {
    for (let s = 0; s < NS; s++) {
      if (CUT_AT[s] <= fnow) continue;
      const a = SA[s] * 3, b = SB[s] * 3;
      const dx = P[b] - P[a], dy = P[b + 1] - P[a + 1], dz = P[b + 2] - P[a + 2];
      const L = Math.sqrt(dx * dx + dy * dy + dz * dz) + 1e-9;
      const stiff = SK[s] === 2 ? 0.35 : 1;
      const k = (L - SR[s]) / L * stiff, pa = pinned(SA[s]), pb = pinned(SB[s]);
      if (pa && pb) continue;
      const wa = pa ? 0 : pb ? 1 : 0.5, wb = pb ? 0 : pa ? 1 : 0.5;
      P[a] += dx * k * wa; P[a + 1] += dy * k * wa; P[a + 2] += dz * k * wa;
      P[b] -= dx * k * wb; P[b + 1] -= dy * k * wb; P[b + 2] -= dz * k * wb;
    }
  }
}
const CK = 15, ckpt = [];
let simF = -1, maxF = -1;
const energy = new Float32Array(FRAMES);                      // mean speed per frame, for the soundtrack
function record(f) { let s = 0; for (let i = 0; i < NP * 3; i += 3) s += Math.hypot(P[i] - Q[i], P[i + 1] - Q[i + 1], P[i + 2] - Q[i + 2]); energy[f] = s / NP / DT; }
function saveCk(k) { const a = new Float64Array(NP * 6); a.set(P, 0); a.set(Q, NP * 3); ckpt[k] = a; }
function loadCk(k) { const a = ckpt[k]; P.set(a.subarray(0, NP * 3)); Q.set(a.subarray(NP * 3)); simF = k * CK; }
function simTo(f) {
  if (simF < 0) { initCloth(); saveCk(0); record(0); maxF = 0; simF = 0; }
  if (f < simF || f - simF > CK) {
    const k = Math.min(Math.floor(f / CK), Math.floor(maxF / CK));
    if (!(simF <= f && simF >= k * CK)) loadCk(k);
  }
  while (simF < f) {
    for (let s = 0; s < SUB; s++) step(simF, s);
    simF++;
    if (simF > maxF) { maxF = simF; record(simF); if (simF % CK === 0) saveCk(simF / CK); }
  }
}

// ---- the fabric: drawn once ------------------------------------------------------
const TW = 1050, TH = 690;
const tex = document.createElement('canvas'); tex.width = TW; tex.height = TH;
(function fabric() {
  const g = tex.getContext('2d', { willReadFrequently: true });   // CPU raster, like the vertical canvas it is drawn into
  g.fillStyle = '#E9E2D2'; g.fillRect(0, 0, TW, TH);
  // weave: fine static lines
  // the sorted-bars motif along the bottom, in dusk colours
  const DUSK = [[70, 74, 200], [180, 70, 170], [255, 110, 110], [245, 184, 61]];
  const n = 18;
  for (let k = 0; k < n; k++) {
    const t = k / (n - 1), s = t * 3, i = Math.min(2, Math.floor(s)), r = s - i;
    const c = DUSK[i].map((v, q) => Math.round(lerp(v, DUSK[i + 1][q], r)));
    const h = 70 + 250 * Math.pow(t, 1.3), x = 70 + k * 50;
    g.fillStyle = `rgb(${c.join(',')})`; g.fillRect(x, TH - 60 - h, 36, h);
  }
  g.fillStyle = C.navy; g.textBaseline = 'alphabetic';
  g.font = `850 118px ${FONT}`; g.letterSpacing = '-3px';
  g.fillText('drawn', 70, 170); g.fillText('in code', 70, 290);
  g.letterSpacing = '0px';
  g.fillStyle = C.amber; g.fillRect(70, 320, 120, 12);
  // hem along the pole side
  g.fillStyle = '#C9C0AE'; g.fillRect(0, 0, 18, TH);
})();

// ---- drawing ---------------------------------------------------------------------------
/** Cloth space -> screen: v = { ox, oy, s } (pole top at (ox, oy), scale s), with a gentle perspective. */
function proj(v, o, out) {
  const z = P[o + 2], k = 1600 / (1600 + z * v.s);
  out[0] = v.ox + P[o] * v.s * k; out[1] = v.oy + (P[o + 1] - (NY - 1) * SP * 0.5) * v.s * k + (NY - 1) * SP * 0.5 * v.s; out[2] = z;
}
const S = new Float64Array(NP * 3), VN = new Float64Array(NP * 3), tmp = [0, 0, 0];
const LIGHT = (() => { const l = [-0.45, -0.55, -0.7], n = Math.hypot(...l); return l.map(x => x / n); })();
function drawPole(g, v, alpha = 1) {
  const x = v.ox - 5 * v.s, top = v.oy - 40 * v.s, bot = v.oy + (v.pole || 820) * v.s;
  const gr = g.createLinearGradient(x - 9 * v.s, 0, x + 9 * v.s, 0);
  gr.addColorStop(0, '#6C6F7C'); gr.addColorStop(0.45, '#D9D6CF'); gr.addColorStop(1, '#4A4C57');
  g.globalAlpha = alpha; g.fillStyle = gr; g.fillRect(x - 8 * v.s, top, 16 * v.s, bot - top);
  g.fillStyle = C.amber; g.beginPath(); g.arc(x, top, 13 * v.s, 0, Math.PI * 2); g.fill(); g.globalAlpha = 1;
}
function drawCloth(g, f, v, { fabricK = 1, wireK = 0 } = {}) {
  for (let i = 0; i < NP; i++) { proj(v, i * 3, tmp); S[i * 3] = tmp[0]; S[i * 3 + 1] = tmp[1]; S[i * 3 + 2] = tmp[2]; }
  if (fabricK > 0.002) {
    const tris = [];
    for (const q of QUAD) {
      if (CUT_AT[q[4]] <= f || CUT_AT[q[5]] <= f || CUT_AT[q[6]] <= f || CUT_AT[q[7]] <= f) continue;
      tris.push([q[0], q[1], q[2]], [q[1], q[3], q[2]]);
    }
    // vertex normals (area-weighted face normals), so shading is smooth across triangles
    VN.fill(0);
    for (const t of tris) {
      const o0 = t[0] * 3, o1 = t[1] * 3, o2 = t[2] * 3;
      const ux = P[o1] - P[o0], uy = P[o1 + 1] - P[o0 + 1], uz = P[o1 + 2] - P[o0 + 2];
      const vx = P[o2] - P[o0], vy = P[o2 + 1] - P[o0 + 1], vz = P[o2 + 2] - P[o0 + 2];
      const nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
      for (const o of [o0, o1, o2]) { VN[o] += nx; VN[o + 1] += ny; VN[o + 2] += nz; }
    }
    const zs = tris.map(t => S[t[0] * 3 + 2] + S[t[1] * 3 + 2] + S[t[2] * 3 + 2]);
    const order = tris.map((t, k) => k).sort((a, b) => zs[b] - zs[a] || a - b);
    g.save(); g.globalAlpha = fabricK;
    for (const k of order) {
      const [a, b, c] = tris[k];
      const x0 = S[a * 3], y0 = S[a * 3 + 1], x1 = S[b * 3], y1 = S[b * 3 + 1], x2 = S[c * 3], y2 = S[c * 3 + 1];
      // texture coordinates
      const u0 = (a % NX) / (NX - 1) * TW, w0 = Math.floor(a / NX) / (NY - 1) * TH;
      const u1 = (b % NX) / (NX - 1) * TW, w1 = Math.floor(b / NX) / (NY - 1) * TH;
      const u2 = (c % NX) / (NX - 1) * TW, w2 = Math.floor(c / NX) / (NY - 1) * TH;
      const den = (u1 - u0) * (w2 - w0) - (u2 - u0) * (w1 - w0);
      if (Math.abs(den) < 1e-9) continue;
      const ma = ((x1 - x0) * (w2 - w0) - (x2 - x0) * (w1 - w0)) / den, mc = ((x2 - x0) * (u1 - u0) - (x1 - x0) * (u2 - u0)) / den;
      const mb = ((y1 - y0) * (w2 - w0) - (y2 - y0) * (w1 - w0)) / den, md = ((y2 - y0) * (u1 - u0) - (y1 - y0) * (u2 - u0)) / den;
      const me = x0 - ma * u0 - mc * w0, mf = y0 - mb * u0 - md * w0;
      // grow the triangle a hair about its centroid so neighbours overlap (no seams)
      const cx = (x0 + x1 + x2) / 3, cy = (y0 + y1 + y2) / 3, gr = 1.2;
      const ex = (x, y) => { const dx = x - cx, dy = y - cy, l = Math.hypot(dx, dy) + 1e-9; return [x + dx / l * gr, y + dy / l * gr]; };
      const e0 = ex(x0, y0), e1 = ex(x1, y1), e2 = ex(x2, y2);
      g.save();
      g.beginPath(); g.moveTo(e0[0], e0[1]); g.lineTo(e1[0], e1[1]); g.lineTo(e2[0], e2[1]); g.closePath(); g.clip();
      g.setTransform(ma, mb, mc, md, me, mf);
      const umin = Math.max(0, Math.min(u0, u1, u2) - 2), vmin = Math.max(0, Math.min(w0, w1, w2) - 2);
      const umax = Math.min(TW, Math.max(u0, u1, u2) + 2), vmax = Math.min(TH, Math.max(w0, w1, w2) + 2);
      g.drawImage(tex, umin, vmin, umax - umin, vmax - vmin, umin, vmin, umax - umin, vmax - vmin);
      g.setTransform(1, 0, 0, 1, 0, 0);
      // shade by the 3D normal (two-sided), plus a soft sheen
      const o0 = a * 3, o1 = b * 3, o2 = c * 3;
      let nx = 0, ny = 0, nz = 0;
      for (const o of [o0, o1, o2]) { const l = Math.hypot(VN[o], VN[o + 1], VN[o + 2]) + 1e-9; nx += VN[o] / l; ny += VN[o + 1] / l; nz += VN[o + 2] / l; }
      const nl = Math.hypot(nx, ny, nz) + 1e-9;
      nx /= nl; ny /= nl; nz /= nl; if (nz > 0) { nx = -nx; ny = -ny; nz = -nz; }
      const dif = nx * LIGHT[0] + ny * LIGHT[1] + nz * LIGHT[2];
      const lum = 0.35 + 0.75 * Math.max(0, dif);
      g.fillStyle = lum < 1 ? `rgba(4,5,12,${(1 - lum) * 0.95})` : `rgba(255,248,235,${Math.min(0.35, (lum - 1) * 1.4)})`;
      g.fill();
      g.restore();
    }
    g.restore();

// ---- sound: wind, flutter from the cloth's own speed, a rip ---------------------------------
async function renderAudio() {
  simTo(FRAMES - 1);

  const ac = new OfflineAudioContext(2, LEN, SR);

  const master = ac.createGain(); master.gain.value = 0.95; master.connect(comp).connect(ac.destination);

  const rnd = mulberry32(0xF1A6);

  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let k = 0; k < d.length; k++) d[k] = (rnd() * 2 - 1) * Math.pow(1 - k / d.length, 3.3); }

  const curve = fn => { const c = new Float32Array(FRAMES); for (let f = 0; f < FRAMES; f++) c[f] = fn(f); return c; };
  let eMax = 1e-6; for (let f = 0; f < FRAMES; f++) eMax = Math.max(eMax, energy[f]);
  // wind: band-passed noise that rises with the wind
  { const s = ac.createBufferSource(); s.buffer = noise;
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 0.9;
    bp.frequency.setValueCurveAtTime(curve(f => 250 + 900 * clamp(wind(f / FPS) / 900)), 0, dur);
    const g = ac.createGain(); g.gain.setValueCurveAtTime(curve(f => 0.03 + 0.34 * clamp(wind(f / FPS) / 900)), 0, dur);
    s.connect(bp).connect(g).connect(master); s.start(0); }
  // flutter: noise chopped at a rate and depth that follow the cloth's mean speed
  { const s = ac.createBufferSource(); s.buffer = noise; s.playbackRate.value = 1;
    const hp = ac.createBiquadFilter(); hp.type = 'bandpass'; hp.frequency.value = 1800; hp.Q.value = 0.7;

  const hit = (at, f0, f1, amp, len) => { const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.setValueAtTime(f0, at); o.frequency.exponentialRampToValueAtTime(f1, at + len * 0.6);
    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(amp, at + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, at + len);

  hit(T.cut / FPS, 180, 60, 0.4, 0.6);
  hit(T.cutEnd / FPS, 90, 36, 0.6, 1.6);
  const bell = (at, m, amp, pan) => { for (const [r2, a2, dec] of [[1, 1, 2.2], [2.76, 0.3, 0.9], [5.4, 0.1, 0.4]]) {
    const o = ac.createOscillator(); o.frequency.value = hz(m) * r2; const g = ac.createGain(), p = ac.createStereoPanner();

  [72, 76, 79, 84].forEach((m, i) => bell((T.end + 8 + i * 6) / FPS, m, 0.09, -0.45 + i * 0.3));

  const buf = await ac.startRendering();
  let peak = 0; for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let k = 0; k < d.length; k++) peak = Math.max(peak, Math.abs(d[k])); }
  if (peak > 0.89) for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let k = 0; k < d.length; k++) d[k] *= 0.89 / peak; }

/* ==========================================================================
   VERTICAL CUT — shared block, identical in every piece.
   1080x1920 for Reels, Shorts and TikTok (__motion.variants.vertical). The
   piece's own scene code is re-used and recomposed for a phone: everything a
   viewer must read stays inside the area no platform covers (x 60..900,
   y 230..1400); outside it there is only dimmed texture.

const VW = 1080, VH = 1920, SAFE = { x: 60, y: 230, w: 840, h: 1170, r: 900, b: 1400 };

const VL = 96, VR = 864;                                          // text column inside the safe area

  vx.setTransform(1, 0, 0, 1, 0, 0); vx.globalAlpha = 1; vx.globalCompositeOperation = 'source-over';
  vx.filter = 'none'; vx.shadowBlur = 0; vx.shadowColor = 'transparent'; vx.letterSpacing = '0px'; vx.setLineDash([]);
  vx.textAlign = 'left'; vx.textBaseline = 'alphabetic'; vx.lineCap = 'butt'; vx.lineJoin = 'miter';
}

  if (alpha <= 0.002 || !str) return size;
  vx.font = `${weight} ${size}px ${fam}`; vx.letterSpacing = spacing + 'px';
  if (max) { const w = vx.measureText(str).width; if (w > max) { size = size * max / w; vx.font = `${weight} ${size}px ${fam}`; } }
  vx.textAlign = align; vx.textBaseline = 'alphabetic';
  const a0 = vx.globalAlpha; vx.globalAlpha = a0 * alpha; vx.fillStyle = color;
  vx.fillText(str, x + (align === 'center' ? spacing / 2 : align === 'right' ? spacing : 0), y);   // tracking is added after the last glyph too
  vx.globalAlpha = a0; vx.letterSpacing = '0px';

}
/** Word-wraps with the given font; returns the lines. */
function vWrap(str, maxW, size, weight = 700, fam = FONT) {
  vx.font = `${weight} ${size}px ${fam}`; vx.letterSpacing = '0px';
  const words = str.split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (vx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }

function vSeg(segs, v) {

  const s = segs[k];

  vx.fillStyle = `rgba(${rgb},${a})`;

  strip(SAFE.r, 0, SAFE.r - feather, 0, SAFE.r - feather, SAFE.y, feather, SAFE.h);
  strip(0, SAFE.y, 0, SAFE.y + feather, SAFE.x, SAFE.y, SAFE.w, feather);
  strip(0, SAFE.b, 0, SAFE.b - feather, SAFE.x, SAFE.b - feather, SAFE.w, feather);

/** Series tag at the top of the safe area, e.g. MADE IN CODE · 04. */
function vTag(label, color, alpha = 1) {
  vText('MADE IN CODE', VL, 292, { size: 28, weight: 800, color, spacing: 5, alpha });
  vx.font = `800 28px ${FONT}`; vx.letterSpacing = '5px';
  const w = vx.measureText('MADE IN CODE').width; vx.letterSpacing = '0px';
  vText('·  ' + label, VL + w + 14, 292, { size: 28, weight: 600, color: 'rgba(255,255,255,0.72)', spacing: 3, alpha, max: VR - VL - w - 14 });

/** Big hook lines, left-aligned from y0; visible from frame 0, settles in a few frames. */

    const kk = E.outExpo(prog(v, -12 + i * 2, 8 + i * 2));

/** Closing card, the last 60 frames: piece title, "drawn in code · bytepatterns.com". l = frames into the card. */
function vEndCard(l, { title, line = '', ink = '#FFFFFF', dim = 'rgba(255,255,255,0.66)', accent = '#FFFFFF', scrim = '0,0,0', a = 0.84 }) {
  const k = E.outCubic(prog(l, 0, 12));

  const size = vText(title, VL, 850 + (1 - t1) * 40, { size: 92, weight: 800, color: ink, spacing: -2, alpha: t1, max: VR - VL });
  const y2 = 850 + Math.max(size, 60) * 0.25 + 70;
  vx.font = `600 44px ${FONT}`;
  const lead = 'drawn in code  ·  ', lw = vx.measureText(lead).width;
  vText(lead, VL, y2 + (1 - t2) * 24, { size: 44, weight: 600, color: dim, alpha: t2 });
  vText('bytepatterns.com', VL + lw, y2 + (1 - t2) * 24, { size: 44, weight: 800, color: accent, alpha: t2 });

/** Seeks a cut. The first frame a page draws is drawn twice: the very first read of a

let vWarm = false;
function vSeek(draw, i, frames) {

/** The soundtrack of a cut: the piece's own audio() spliced to the same segments as the picture. */
async function vAudio(segs, frames, { xf = 0.025, fadeOut = 0.6, extra = null } = {}) {

  const out = ac.createGain(); out.connect(ac.destination);
  out.gain.setValueAtTime(1, 0); out.gain.setValueAtTime(1, dur - fadeOut); out.gain.linearRampToValueAtTime(0, dur - 0.01);
  segs.forEach((s, k) => {
    const at = s.at / FPS, off = s.src / FPS, d = s.len / FPS;
    const pre = k === 0 ? 0 : Math.min(xf, off), post = k === segs.length - 1 ? 0 : xf;
    const b = ac.createBufferSource(), g = ac.createGain(); b.buffer = src;
    g.gain.setValueAtTime(pre ? 0 : 1, at - pre);
    if (pre) g.gain.linearRampToValueAtTime(1, at + pre);
    if (post) { g.gain.setValueAtTime(1, at + d - post); g.gain.linearRampToValueAtTime(0, at + d + post); }
    b.connect(g).connect(out); b.start(at - pre, off - pre, d + pre + post);
  });
  if (extra) extra(ac, out);
  const buf = await ac.startRendering();
  let peak = 0; for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) peak = Math.max(peak, Math.abs(d[i])); }
  if (peak > 0.9) for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] *= 0.9 / peak; }
  return buf;
}
/** A soft three-partial bell, for the closing card. */
function vChime(ac, dest, at, freq, vol = 0.08) {
  for (const [mul, v, dec] of [[1, 1, 1.8], [2.01, 0.35, 0.8], [3.02, 0.12, 0.4]]) {
    const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.value = freq * mul;
    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol * v, at + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, at + dec);
    o.connect(g).connect(dest); o.start(at); o.stop(at + dec + 0.05);
  }
}

/* VERTICAL CUT — this piece */
// The same simulation drawn smaller on the phone: the pole near the left of
// the safe area, the flag streaming right, the type above and below it.
const VSEG = [
  { at: 0, src: 0, len: 60 },                               // hook: the limp mesh
  { at: 60, src: T.fabric - 30, len: 120 },                 // the mesh becomes fabric
  { at: 180, src: T.gust - 60, len: 90 },                   // the gust
  { at: 270, src: T.cut - 12, len: 210 },                   // the cut, the tear
  { at: 480, src: T.end, len: 60 },                         // closing card
];
const VFR = 540, VEND = VFR - 60;
const VIEW_V = { ox: 150, oy: 640, s: 0.86, pole: 600 };
function vDraw(v) {
  const { k: seg, src } = vSeg(VSEG, v), f = Math.min(FRAMES - 1, src);
  simTo(f);
  vReset();
  backdrop(vx, VW, VH, f);
  const fk = E.inOutCubic(prog(f, T.fabric, T.fabricDone));
  drawPole(vx, VIEW_V);
  drawCloth(vx, f, VIEW_V, { fabricK: fk, wireK: 1 - fk });
  vShade(C.bgRGB, 0.82);
  vTag('HELD BY SPRINGS', C.amber);
  if (seg === 0) {
    vHook(v, ['No physics engine.', 'Just points.'], 400, { size: 80, color: C.paper, accent: C.amber });
  } else if (seg <= 2) {
    const [al, dy] = vEnv(v, 60, 270, 10, 8);
    vText('x′ = x + (x − x₀) + a·dt²', VL, 400 + dy, { size: 44, weight: 700, fam: MONO, color: C.paper, alpha: al, max: VR - VL });
    vText('then pull every spring back', VL, 460 + dy, { size: 36, weight: 500, color: C.dim, alpha: al, max: VR - VL });
    const [a1, d1] = vEnv(v, 150, 270, 10, 8);                   // once the flag has lifted clear of the type
    vText(`${NP} points · ${NS.toLocaleString('en-US')} springs`, VL, 1320 + d1, { size: 40, weight: 800, fam: MONO, color: C.teal, alpha: a1, max: VR - VL });
    const [a2] = vEnv(v, 184, 270, 10, 8);
    vText('wind pushes every triangle', VL, 1376, { size: 36, weight: 700, color: C.paper, alpha: a2, max: VR - VL });
  } else {
    const [al, dy] = vEnv(v, 272, VEND + 4, 10, 8);
    vText('Cut the springs', VL, 410 + dy, { size: 80, weight: 850, color: C.paper, spacing: -2, alpha: al, max: VR - VL });
    vText('and it tears.', VL, 500 + dy, { size: 80, weight: 850, color: C.coral, spacing: -2, alpha: al, max: VR - VL });
    vText(`${cutCount(f)} springs cut`, VL, 1360 + dy, { size: 40, weight: 700, fam: MONO, color: C.dim, alpha: al });
  }
  if (v >= VEND) vEndCard(v - VEND, { title: 'Held by Springs', line: `Verlet cloth · ${NP} points · ${NS.toLocaleString('en-US')} springs`,
    ink: C.paper, dim: 'rgba(241,236,227,0.72)', accent: C.amber, scrim: C.bgRGB, a: 0.8 });
  vReset();
}

window.__motion = {
  title: 'Held by Springs',
  description: `A flag of ${NP} Verlet points and ${NS.toLocaleString('en-US')} springs catches the wind, then a blade cuts ${TOTAL_CUT} springs and it tears.`,
  fps: FPS, width: W, height: H, frames: FRAMES,
  poster: 420,
  gifStart: 15.5,
  seek(i) { draw(Math.max(0, Math.min(FRAMES - 1, Math.floor(i)))); },
  audio: renderAudio,
  variants: {
    vertical: {
      width: VW, height: VH, frames: VFR, canvas: vcv,
      poster: 330, gifStart: 9,
      seek(i) { vSeek(vDraw, i, VFR); },
      audio: () => { simTo(FRAMES - 1); return vAudio(VSEG, VFR); },
    },
  },
};

/* ==========================================================================
   PLAYER — identical in every piece; keep as is.
   Autoplays and loops, starts sound on the first click, ?frame=N pauses on a
   frame, ?variant=vertical plays the vertical cut (if the piece has one).
   When the renderer sets window.__MOTION_RENDER__ it stays out of the way.
   ========================================================================== */
(function player() {
  const btn = document.getElementById('sound'), q = new URLSearchParams(location.search);
  let M = window.__motion;
  const V = !window.__MOTION_RENDER__ && M.variants && M.variants[q.get('variant')];
  if (V) {                                                // show the variant's own canvas instead
    M = Object.assign({}, M, V);
    V.canvas.style.cssText = `width:min(100vw,calc(100vh*${V.width}/${V.height}));height:auto;aspect-ratio:${V.width}/${V.height}`;
    document.querySelector('canvas').replaceWith(V.canvas);
  }
  const dur = M.frames / M.fps;
  if (window.__MOTION_RENDER__) { btn.hidden = true; M.seek(0); return; }
  if (q.has('frame')) { btn.hidden = true; M.seek(+q.get('frame') || 0); return; }
  let t0 = performance.now(), ac = null, src = null, buf = null, paused = false, pausedAt = 0;
  const clock = () => ac && src ? (ac.currentTime - t0) : (performance.now() - t0) / 1000;
  function loop() {
    if (!paused) M.seek(Math.floor(((clock() % dur) + dur) % dur * M.fps));
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  btn.addEventListener('click', async () => {
    if (src) { src.stop(); src = null; btn.textContent = 'Click for sound'; t0 = performance.now(); return; }
    btn.textContent = 'Loading sound…';
    ac = ac || new AudioContext({ sampleRate: 48000 });
    buf = buf || await M.audio();
    await ac.resume();
    src = ac.createBufferSource(); src.buffer = buf; src.loop = true; src.connect(ac.destination);
    t0 = ac.currentTime + 0.05; src.start(t0);        // picture restarts from frame 0 in sync with the sound
    btn.textContent = 'Sound on — click to mute';
  });
  addEventListener('keydown', e => {
    if (e.code !== 'Space') return;
    e.preventDefault(); paused = !paused;
    if (ac) paused ? ac.suspend() : ac.resume();
    if (!ac) { if (paused) pausedAt = performance.now(); else t0 += performance.now() - pausedAt; }
  });
})();
</script>
