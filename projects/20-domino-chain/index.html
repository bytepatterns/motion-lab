<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="teambytepatterns">
<meta name="description" content="One hundred dominoes, each 3% taller than the one before, topple in a chain until the last one is 18.7 times the height of the first.">
<title>Chain Reaction — motion-lab</title>
<style>
  /* Player chrome. The piece itself lives entirely in the canvas. */
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; font: 500 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; }
  canvas { display: block; width: min(100vw, calc(100vh * 16 / 9)); height: auto; aspect-ratio: 16 / 9; }
  #sound { position: fixed; left: 16px; bottom: 16px; padding: 8px 14px; border: 1px solid rgba(255,255,255,.35); border-radius: 999px;
           background: rgba(0,0,0,.55); color: #fff; font: inherit; cursor: pointer; }
  #sound[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080" aria-label="A row of one hundred growing dominoes toppling one after another, with the camera pulling back"></canvas>
<button id="sound" type="button">Click for sound</button>
<script>
'use strict';
/* ==========================================================================
   PIECE — Chain Reaction.
   100 dominoes, each 3% taller than the last. Each one is a rigid slab that
   pivots on its front bottom edge and falls under gravity:
     theta'' = g (h/2 sin theta - t/2 cos theta) / ((h^2 + t^2) / 3)
   When its top edge reaches the next domino it passes on part of its spin
   (70% of the speed at its tip) and from then on leans on it: its angle is
   solved from the contact geometry every frame. The last one falls flat.
   The simulation runs once at load (fixed step, 1 ms); the film shows it in
   slow motion, so the bigger ones visibly take longer. Every contact is a
   tick in the soundtrack, lower as the dominoes grow.
   Determinism: the simulation is fixed-step and sampled at frame times; the
   camera is a moving average over those samples. seek(i) only reads them.
   ========================================================================== */
const W = 1920, H = 1080, FPS = 30, FRAMES = 720;          // 24 s
const cv = document.getElementById('stage');
const ctx = cv.getContext('2d');
const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
const MONO = 'ui-monospace, "Cascadia Code", Consolas, Menlo, monospace';

// ---- helpers -------------------------------------------------------------
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (f, a, b) => clamp((f - a) / (b - a));
const smooth = t => t * t * (3 - 2 * t);
const E = {
  inCubic: t => t * t * t,
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inOutCubic: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outExpo: t => t === 1 ? 1 : 1 - Math.pow(2, -10 * t),
  inExpo: t => t === 0 ? 0 : Math.pow(2, 10 * t - 10),
  inOutExpo: t => t === 0 ? 0 : t === 1 ? 1 : t < .5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2,
  outBack: t => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2),
};
function text(g, str, x, y, { size = 40, weight = 600, color = '#fff', alpha = 1, spacing = 0, align = 'left', fam = FONT, base = 'alphabetic' } = {}) {
  if (alpha <= 0.002 || !str) return 0;
  g.font = `${weight} ${size}px ${fam}`; g.letterSpacing = spacing + 'px';
  g.textAlign = align; g.textBaseline = base;
  const a0 = g.globalAlpha; g.globalAlpha = a0 * alpha; g.fillStyle = color;
  g.fillText(str, x, y);
  const w = g.measureText(str).width;
  g.globalAlpha = a0; g.letterSpacing = '0px';
  return w;
}
const env = (f, a, b, fin = 12, fout = 10) => {
  const i = E.outCubic(prog(f, a, a + fin)), o = 1 - E.inCubic(prog(f, b - fout, b));
  return [Math.min(i, o), (1 - i) * 24 - (1 - o) * 10];
};

// ---- palette -------------------------------------------------------------
const C = { bg: '#0D0B12', bgRGB: '13,11,18', paper: '#F3EDE3', dim: 'rgba(243,237,227,0.64)', amber: '#F5B83D', coral: '#FF7A59', teal: '#58C4B8' };
const DUSK = [[88, 196, 184], [110, 120, 230], [190, 90, 190], [255, 112, 100], [245, 184, 61]];
function dusk(t) { const s = clamp(t) * (DUSK.length - 1), i = Math.min(DUSK.length - 2, Math.floor(s)), r = s - i;
  return DUSK[i].map((v, k) => Math.round(lerp(v, DUSK[i + 1][k], r))); }

// ---- the row ----------------------------------------------------------------------
const N = 100, GROW = 1.03, THICK = 0.17, GAP = 0.6, DEPTH = 0.5;
const Hd = [], Td = [], Xd = [];                             // height, thickness, x of the front bottom edge
{ let x = 0; for (let i = 0; i < N; i++) { const h = Math.pow(GROW, i), t = THICK * h; if (i) x += GAP * Hd[i - 1] + t; Hd.push(h); Td.push(t); Xd.push(x); } }
const RATIO = Hd[N - 1] / Hd[0], LENGTH = Xd[N - 1] + Hd[N - 1];
const T = { push: 60, end: 648 };

// ---- simulation --------------------------------------------------------------------
const G = 9.81, KAPPA = 0.7, DT = 0.001, OMEGA0 = 1.6;
const alpha = (i, th) => G * (Hd[i] / 2 * Math.sin(th) - Td[i] / 2 * Math.cos(th)) / ((Hd[i] * Hd[i] + Td[i] * Td[i]) / 3);
/** Runs the chain; calls rec(t, th, mode) after every step. Returns the time the last domino lands and each contact time. */
function simulate(rec) {
  const th = new Float64Array(N), om = new Float64Array(N), mode = new Uint8Array(N);   // 0 standing, 1 falling, 2 leaning, 3 flat
  const hit = new Array(N).fill(-1);
  mode[0] = 1; om[0] = OMEGA0;
  let t = 0;
  for (let s = 0; s < 400000; s++) {
    for (let i = 0; i < N; i++) {
      if (mode[i] !== 1) continue;
      om[i] += alpha(i, th[i]) * DT; th[i] += om[i] * DT;
      if (i < N - 1 && Hd[i] * Math.sin(th[i]) >= Xd[i + 1] - Td[i + 1] - Xd[i]) {     // tip reaches the next one's back face
        mode[i] = 2; hit[i] = t; mode[i + 1] = 1;
        om[i + 1] = KAPPA * om[i] * Hd[i] * Math.cos(th[i]) / Hd[i + 1];
      } else if (i === N - 1 && th[i] >= Math.PI / 2) { th[i] = Math.PI / 2; mode[i] = 3; hit[i] = t; }
    }
    t += DT;
    if (rec) rec(t, th, mode);
    if (mode[N - 1] === 3) return { tEnd: t, hit };
  }
  return { tEnd: t, hit };
}
const RUN = simulate(null);
const F1 = 548;                                              // frame the last domino lands
const simT = f => (f - T.push) / (F1 - T.push) * RUN.tEnd;
const HITF = RUN.hit.map(t => T.push + t / RUN.tEnd * (F1 - T.push));   // frame of each contact
// sample the angles at every frame of the cascade
const TH = [], MODE = [];
{
  let next = T.push;
  const snap = (th, mode) => { TH[next] = Float64Array.from(th); MODE[next] = Uint8Array.from(mode); next++; };
  const th0 = new Float64Array(N), m0 = new Uint8Array(N);
  for (let f = 0; f < T.push; f++) { TH[f] = th0; MODE[f] = m0; }
  simulate((t, th, mode) => { while (next < FRAMES && next <= F1 && simT(next) <= t) snap(th, mode); });
  for (let f = next; f < FRAMES; f++) { TH[f] = TH[next - 1]; MODE[f] = MODE[next - 1]; }
}
/** Angle of domino i when it leans on domino i+1 at angle a: its top front corner lies on i+1's back face. */
function leanAngle(i, a) {
  const Bx = Xd[i + 1] - Td[i + 1] * Math.cos(a), By = Td[i + 1] * Math.sin(a), ux = Math.sin(a), uy = Math.cos(a);
  const g = th => { const px = Xd[i] + Hd[i] * Math.sin(th), py = Hd[i] * Math.cos(th); return (px - Bx) * uy - (py - By) * ux; };
  let lo = 0, hi = Math.PI / 2;
  for (let k = 0; k < 40; k++) { const mid = (lo + hi) / 2; if (g(mid) < 0) lo = mid; else hi = mid; }
  return lo;
}
const ANG = [];                                              // final angles per frame, leaning ones solved right to left
for (let f = 0; f < FRAMES; f++) {
  if (f > 0 && TH[f] === TH[f - 1]) { ANG[f] = ANG[f - 1]; continue; }
  const a = Float64Array.from(TH[f]), m = MODE[f];
  for (let i = N - 2; i >= 0; i--) if (m[i] === 2) a[i] = leanAngle(i, a[i + 1]);
  ANG[f] = a;
}
const fallenAt = f => { let n = 0; for (let i = 0; i < N; i++) if (HITF[i] >= 0 && f >= HITF[i]) n++; return n; };
const frontAt = f => { const m = MODE[f]; let k = 0; for (let i = 0; i < N; i++) if (m[i]) k = i; return k; };

// ---- camera: follow the front, then pull back to see the whole row -------------------------
/** aspect = visible width / height of the stage; returns per-frame { cx, v } (centre x and view height, in domino units). */
function makeCam(aspect, lead, hookV, hookCx, { tall = 2.6, spans = 6, ovV = 1.9, ovX = 14 } = {}) {
  const raw = [];
  for (let f = 0; f < FRAMES; f++) {
    if (f < T.push + 6) { raw.push([hookCx, hookV]); continue; }
    const k = frontAt(f), h = Hd[Math.min(N - 1, k + 1)];
    const v = Math.max(hookV, Math.max(tall * h, spans * GAP * h / aspect));
    raw.push([Xd[k] + lead * v * aspect, v]);
  }
  const win = 26, cam = [];
  for (let f = 0; f < FRAMES; f++) {
    let sx = 0, sv = 0, n = 0;
    for (let q = f - win; q <= f + win; q++) { const r = raw[clamp(q, 0, FRAMES - 1)]; sx += r[0]; sv += Math.log(r[1]); n++; }
    cam.push({ cx: sx / n, v: Math.exp(sv / n) });
  }
  // the ending: the last fallen dominoes, and three of them stood up again side by side
  const ov = { cx: Xd[N - 1] + ovX, v: Hd[N - 1] * ovV };
  for (let f = 0; f < FRAMES; f++) {
    const u = E.inOutCubic(prog(f, F1 - 14, F1 + 56));
    if (u <= 0) continue;
    cam[f] = { cx: lerp(cam[f].cx, ov.cx, u), v: Math.exp(lerp(Math.log(cam[f].v), Math.log(ov.v), u)) };
  }
  return cam;
}

// ---- drawing --------------------------------------------------------------------------------
/** stage = { x, y, w, h, gy } in pixels (gy: where the ground is); cam = { cx, v }. */
function drawRow(g, f, stage, cam) {
  const s = stage.h * 0.62 / cam.v, ox = stage.x + stage.w / 2, gy = stage.gy;
  const X = x => ox + (x - cam.cx) * s, Y = y => gy - y * s;
  const dxp = 0.42 * s, dyp = -0.3 * s;                       // depth direction on screen, per unit of depth
  // ground
  const grd = g.createLinearGradient(0, gy, 0, gy + 200);
  grd.addColorStop(0, 'rgba(60,52,78,0.9)'); grd.addColorStop(1, 'rgba(13,11,18,0)');
  g.fillStyle = grd; g.fillRect(stage.x, gy, stage.w, stage.y + stage.h - gy);
  g.fillStyle = 'rgba(243,237,227,0.22)'; g.fillRect(stage.x, gy - 1, stage.w, 2);
  const a = ANG[f];
  const corners = i => {
    const c = Math.cos(a[i]), sn = Math.sin(a[i]), x0 = Xd[i], h = Hd[i], t = Td[i];
    const P = (px, py) => [X(x0 + px * c + py * sn), Y(-px * sn + py * c)];
    return [P(0, 0), P(-t, 0), P(-t, h), P(0, h)];           // front-bottom, back-bottom, back-top, front-top
  };
  const vis = [];
  for (let i = 0; i < N; i++) {
    const x0 = X(Xd[i] - Td[i]), x1 = X(Xd[i] + Hd[i] + DEPTH * Hd[i]);
    if (x1 < stage.x - 20 || x0 > stage.x + stage.w + 20) continue;
    vis.push(i);
  }
  // depth faces first (right to left), then the front faces
  for (let k = vis.length - 1; k >= 0; k--) {
    const i = vis[k], q = corners(i), d = DEPTH * Hd[i], col = dusk(i / (N - 1));
    const ex = d * dxp, ey = d * dyp;
    for (let e = 0; e < 4; e++) {
      const p0 = q[e], p1 = q[(e + 1) % 4];
      const nx = p1[1] - p0[1], ny = -(p1[0] - p0[0]);         // outward normal of this edge (screen space)
      const facing = nx * dxp + ny * dyp;                        // seen when it faces the depth direction
      if (facing <= 0) continue;
      const shade = e === 2 ? 0.75 : 0.5;
      g.fillStyle = `rgb(${col.map(v => Math.round(v * shade)).join(',')})`;
      g.beginPath(); g.moveTo(p0[0], p0[1]); g.lineTo(p1[0], p1[1]); g.lineTo(p1[0] + ex, p1[1] + ey); g.lineTo(p0[0] + ex, p0[1] + ey); g.closePath(); g.fill();
    }
  }
  for (const i of vis) {
    const q = corners(i), col = dusk(i / (N - 1));
    g.fillStyle = `rgb(${col.join(',')})`;
    g.beginPath(); g.moveTo(q[0][0], q[0][1]); for (let e = 1; e < 4; e++) g.lineTo(q[e][0], q[e][1]); g.closePath(); g.fill();
    const ph = Hd[i] * s;
    if (ph > 60) {                                            // the face of a domino: a divider and two pips
      const mid = (u, v) => [lerp(lerp(q[0][0], q[1][0], u), lerp(q[3][0], q[2][0], u), v), lerp(lerp(q[0][1], q[1][1], u), lerp(q[3][1], q[2][1], u), v)];
      const k = clamp((ph - 60) / 60);
      g.strokeStyle = `rgba(13,11,18,${0.5 * k})`; g.lineWidth = Math.max(1, ph * 0.012);
      const m0 = mid(0.1, 0.5), m1 = mid(0.9, 0.5); g.beginPath(); g.moveTo(m0[0], m0[1]); g.lineTo(m1[0], m1[1]); g.stroke();
      g.fillStyle = `rgba(13,11,18,${0.55 * k})`;
      for (const v of [0.25, 0.75]) { const p = mid(0.5, v); g.beginPath(); g.arc(p[0], p[1], Math.max(1.5, Td[i] * s * 0.16), 0, Math.PI * 2); g.fill(); }
    }
  }
  // the ending: #1, #50 and #100 stood up as outlines, to compare
  const ga = E.outCubic(prog(f, F1 + 50, F1 + 70));
  if (ga > 0.01) {
    let gx = Xd[N - 1] + Hd[N - 1] * (1 + 0.42 * DEPTH) + 3;
    [[0, 0], [49, 5], [N - 1, 8]].forEach(([i, gapU]) => {
      gx += gapU;
      const h = Hd[i], t = Td[i], col = dusk(i / (N - 1)).join(','), x0 = X(gx), x1 = X(gx + t), y1 = Y(h);
      g.save(); g.globalAlpha = ga;
      g.fillStyle = `rgba(${col},0.22)`; g.fillRect(x0, y1, x1 - x0, gy - y1);
      g.strokeStyle = `rgb(${col})`; g.lineWidth = 2.5; g.setLineDash([8, 6]); g.strokeRect(x0, y1, x1 - x0, gy - y1); g.setLineDash([]);
      g.restore();
      text(g, i === 0 ? '1×' : `${h.toFixed(1)}×`, (x0 + x1) / 2, y1 - 16, { size: 30, weight: 800, fam: MONO, color: `rgb(${col})`, align: 'center', alpha: ga });
      text(g, `#${i + 1}`, (x0 + x1) / 2, gy + 40, { size: 28, weight: 600, fam: MONO, color: C.dim, align: 'center', alpha: ga });
      gx += t;
    });
  }
  // the pusher: a small pendulum that swings into the first domino
  if (f < T.push + 70) {
    const piv = [-0.33 - Td[0], 2.75], L = 1.75, br = 0.18;
    const phi = f < T.push ? -1.15 * (1 - Math.sin(Math.PI / 2 * E.inCubic(prog(f, 8, T.push))))     // released, speeding up
      : -0.32 * Math.sin(Math.PI * prog(f, T.push, T.push + 34)) * Math.exp(-prog(f, T.push, T.push + 70) * 1.5);   // bounces back
    const bx = piv[0] + L * Math.sin(phi), by = piv[1] - L * Math.cos(phi);
    const al = 1 - prog(f, T.push + 40, T.push + 70);
    g.save(); g.globalAlpha = al;
    g.strokeStyle = 'rgba(243,237,227,0.6)'; g.lineWidth = 2; g.beginPath(); g.moveTo(X(piv[0]), Y(piv[1])); g.lineTo(X(bx), Y(by)); g.stroke();
    g.fillStyle = C.paper; g.beginPath(); g.arc(X(bx), Y(by), br * s, 0, Math.PI * 2); g.fill();
    g.fillStyle = C.amber; g.beginPath(); g.arc(X(piv[0]), Y(piv[1]), 5, 0, Math.PI * 2); g.fill();
    g.restore();
  }
}
function backdrop(g, w, h) {
  g.fillStyle = C.bg; g.fillRect(0, 0, w, h);
  const gr = g.createRadialGradient(w * 0.55, h * 0.4, 30, w * 0.55, h * 0.4, Math.max(w, h) * 0.75);
  gr.addColorStop(0, 'rgba(56,44,84,0.75)'); gr.addColorStop(1, 'rgba(13,11,18,0)');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
}

// ---- landscape picture ------------------------------------------------------------------
const STAGE_L = { x: 0, y: 0, w: W, h: H, gy: 860 };
const CAM_L = makeCam(W / H, 0.12, 5.2, 4.2, { tall: 2.6, spans: 6, ovV: 1.9, ovX: 23 });
function draw(f) {
  if (ctx.reset) ctx.reset();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none'; ctx.shadowBlur = 0;
  backdrop(ctx, W, H);
  drawRow(ctx, f, STAGE_L, CAM_L[f]);
  const endK = E.inOutCubic(prog(f, T.end, T.end + 20)), a = 1 - endK;
  text(ctx, 'PHYSICS  ·  CHAIN REACTION', 120, 104, { size: 26, weight: 600, color: C.dim, spacing: 5, alpha: a });
  text(ctx, 'BYTEPATTERNS', 1800, 104, { size: 26, weight: 600, color: C.dim, spacing: 5, align: 'right', alpha: a });
  // hook
  {
    const k = E.outExpo(prog(f, -20, 4)), k2 = E.outExpo(prog(f, -16, 8)), o = 1 - E.inCubic(prog(f, T.push + 30, T.push + 50));
    text(ctx, '100 dominoes.', 116, 300 + (1 - k) * 30, { size: 124, weight: 850, color: C.paper, spacing: -3, alpha: Math.min(k, o) });
    text(ctx, 'Each one 3% taller.', 120, 390 + (1 - k2) * 30, { size: 64, weight: 800, color: C.amber, spacing: -1, alpha: Math.min(k2, o) });
  }
  // counters while it falls
  {
    const [al, dy] = env(f, T.push + 34, F1 + 30, 14, 12);
    const n = fallenAt(f), k = Math.min(N - 1, frontAt(f));
    text(ctx, 'fallen', 122, 250 + dy, { size: 30, weight: 600, color: C.dim, spacing: 3, alpha: al * a });
    text(ctx, `${String(n).padStart(3)} / ${N}`, 114, 350 + dy, { size: 104, weight: 800, fam: MONO, color: C.paper, spacing: -3, alpha: al * a });
    text(ctx, `this one is ${Hd[k].toFixed(1)}× the first`, 122, 414 + dy, { size: 38, weight: 600, color: C.amber, alpha: al * a });
    text(ctx, 'each passes on 70% of its tip speed, then leans', 122, 466 + dy, { size: 30, weight: 500, color: C.dim, alpha: al * a * (1 - prog(f, 300, 320)) });
  }
  // the overview
  {
    const [al, dy] = env(f, F1 + 34, T.end + 4, 14, 12);
    text(ctx, 'The last one is', 116, 250 + dy, { size: 64, weight: 800, color: C.paper, spacing: -1, alpha: al * a });
    text(ctx, `${RATIO.toFixed(1)}× the first.`, 112, 380 + dy, { size: 132, weight: 850, color: C.amber, spacing: -4, alpha: al * a });
  }
  if (endK > 0) {
    ctx.fillStyle = `rgba(${C.bgRGB},${0.8 * endK})`; ctx.fillRect(0, 0, W, H);
    const k1 = E.outCubic(prog(f, T.end + 6, T.end + 28)), k2 = E.outCubic(prog(f, T.end + 16, T.end + 38)), k3 = E.outCubic(prog(f, T.end + 26, T.end + 48));
    text(ctx, 'Chain Reaction', W / 2, 500 + (1 - k1) * 30, { size: 140, weight: 850, color: C.paper, spacing: -3, align: 'center', alpha: k1 });
    text(ctx, `${N} dominoes  ·  3% taller each  ·  the last is ${RATIO.toFixed(1)}× the first`, W / 2, 580 + (1 - k2) * 20, { size: 42, weight: 500, color: C.amber, align: 'center', alpha: k2 });
    text(ctx, 'bytepatterns · motion lab', W / 2, 1000, { size: 32, weight: 600, color: C.paper, spacing: 3, align: 'center', alpha: k3 * 0.8 });
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.letterSpacing = '0px';
}

// ---- sound: one wooden tick per contact, lower as they grow; a thud at the end ------------------
async function renderAudio() {
  const SR = 48000, dur = FRAMES / FPS, LEN = Math.round(SR * dur);
  const ac = new OfflineAudioContext(2, LEN, SR);
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -14; comp.ratio.value = 3; comp.attack.value = 0.003; comp.release.value = 0.2;
  const master = ac.createGain(); master.gain.value = 0.95; master.connect(comp).connect(ac.destination);
  master.gain.setValueAtTime(0.95, dur - 0.8); master.gain.linearRampToValueAtTime(0.0001, dur - 0.02);
  const rnd = mulberry32(0xD0317);
  const ir = ac.createBuffer(2, SR * 2.4, SR);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let k = 0; k < d.length; k++) d[k] = (rnd() * 2 - 1) * Math.pow(1 - k / d.length, 3.4); }
  const verb = ac.createConvolver(); verb.buffer = ir; const vg = ac.createGain(); vg.gain.value = 0.3; verb.connect(vg).connect(master);
  const noise = ac.createBuffer(1, SR, SR); { const d = noise.getChannelData(0); for (let k = 0; k < d.length; k++) d[k] = rnd() * 2 - 1; }
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  // a low pad under it
  const pad = (fa, fb, notes, amp) => { const a = fa / FPS, b = Math.min(dur, fb / FPS), lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 800; lp.connect(master); lp.connect(verb);
    for (const m of notes) for (const det of [-6, 6]) {
      const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = hz(m); o.detune.value = det;
      const g = ac.createGain(); g.gain.setValueAtTime(0, a); g.gain.linearRampToValueAtTime(amp, a + (fa === 0 ? 0.1 : 1.4));
      g.gain.setValueAtTime(amp, Math.max(a + 1.4, b - 1)); g.gain.linearRampToValueAtTime(0, b);
      o.connect(g).connect(lp); o.start(a); o.stop(b + 0.05);
    } };
  pad(0, 330, [38, 45, 50, 57], 0.018); pad(300, F1 + 20, [36, 43, 48, 55, 60], 0.02); pad(F1, FRAMES, [41, 48, 53, 57, 64], 0.022);
  // wood: a filtered click plus a short body resonance; size sets pitch and weight
  const knock = (at, i, amp) => {
    const sz = Math.sqrt(Hd[i]), pan = clamp(-0.6 + i / N * 1.2, -0.8, 0.8);
    const s = ac.createBufferSource(); s.buffer = noise;
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 3400 / sz; bp.Q.value = 3;
    const g = ac.createGain(); g.gain.setValueAtTime(amp, at); g.gain.exponentialRampToValueAtTime(0.0001, at + 0.03 + 0.02 * sz);
    const p = ac.createStereoPanner(); p.pan.value = pan;
    s.connect(bp).connect(g).connect(p); p.connect(master); p.connect(verb); s.start(at, (i * 0.0137) % 0.9, 0.12);
    const o = ac.createOscillator(), og = ac.createGain(); o.frequency.value = 1150 / sz;
    og.gain.setValueAtTime(0.0001, at); og.gain.exponentialRampToValueAtTime(amp * 0.7, at + 0.003); og.gain.exponentialRampToValueAtTime(0.0001, at + 0.06 + 0.05 * sz);
    o.connect(og).connect(p); o.start(at); o.stop(at + 0.2 + 0.05 * sz);
  };
  // the pendulum's tap
  knock(T.push / FPS, 0, 0.3);
  for (let i = 0; i < N - 1; i++) if (HITF[i] >= 0) knock(HITF[i] / FPS, i + 1, 0.16 + 0.22 * (i / N));
  // the last one lands: a thud
  { const at = F1 / FPS, o = ac.createOscillator(), g = ac.createGain();
    o.frequency.setValueAtTime(90, at); o.frequency.exponentialRampToValueAtTime(34, at + 0.4);
    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(0.8, at + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, at + 1.4);
    o.connect(g).connect(master); o.start(at); o.stop(at + 1.5);
    knock(at, N - 1, 0.5); }
  const bell = (at, m, amp, pan) => { for (const [r2, a2, d2] of [[1, 1, 2.2], [2.76, 0.3, 0.9], [5.4, 0.1, 0.4]]) {
    const o = ac.createOscillator(); o.frequency.value = hz(m) * r2; const g = ac.createGain(), p = ac.createStereoPanner();
    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(amp * a2, at + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, at + d2);
    p.pan.value = pan; o.connect(g).connect(p); p.connect(master); p.connect(verb); o.start(at); o.stop(at + d2 + 0.05); } };
  [72, 77, 81].forEach((m, i) => bell((F1 + 40 + i * 5) / FPS, m, 0.07, -0.4 + i * 0.4));
  [69, 72, 76, 81].forEach((m, i) => bell((T.end + 8 + i * 6) / FPS, m, 0.08, -0.45 + i * 0.3));
  const buf = await ac.startRendering();
  let peak = 0; for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let k = 0; k < d.length; k++) peak = Math.max(peak, Math.abs(d[k])); }
  if (peak > 0.89) for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let k = 0; k < d.length; k++) d[k] *= 0.89 / peak; }
  return buf;
}

/* ==========================================================================
   VERTICAL CUT — shared block, identical in every piece.
   1080x1920 for Reels, Shorts and TikTok (__motion.variants.vertical). The
   piece's own scene code is re-used and recomposed for a phone: everything a
   viewer must read stays inside the area no platform covers (x 60..900,
   y 230..1400); outside it there is only dimmed texture.
   ========================================================================== */
const VW = 1080, VH = 1920, SAFE = { x: 60, y: 230, w: 840, h: 1170, r: 900, b: 1400 };
const vcv = document.createElement('canvas'); vcv.width = VW; vcv.height = VH;
const vx = vcv.getContext('2d', { willReadFrequently: true });   // CPU raster: identical pixels on every redraw
const VL = 96, VR = 864;                                          // text column inside the safe area

function vReset() {
  vx.setTransform(1, 0, 0, 1, 0, 0); vx.globalAlpha = 1; vx.globalCompositeOperation = 'source-over';
  vx.filter = 'none'; vx.shadowBlur = 0; vx.shadowColor = 'transparent'; vx.letterSpacing = '0px'; vx.setLineDash([]);
  vx.textAlign = 'left'; vx.textBaseline = 'alphabetic'; vx.lineCap = 'butt'; vx.lineJoin = 'miter';
}
/** Canvas text on the vertical frame; `max` shrinks the size until the line fits. */
function vText(str, x, y, { size = 40, weight = 700, color = '#FFFFFF', align = 'left', spacing = 0, alpha = 1, fam = FONT, max = 0 } = {}) {
  if (alpha <= 0.002 || !str) return size;
  vx.font = `${weight} ${size}px ${fam}`; vx.letterSpacing = spacing + 'px';
  if (max) { const w = vx.measureText(str).width; if (w > max) { size = size * max / w; vx.font = `${weight} ${size}px ${fam}`; } }
  vx.textAlign = align; vx.textBaseline = 'alphabetic';
  const a0 = vx.globalAlpha; vx.globalAlpha = a0 * alpha; vx.fillStyle = color;
  vx.fillText(str, x + (align === 'center' ? spacing / 2 : align === 'right' ? spacing : 0), y);   // tracking is added after the last glyph too
  vx.globalAlpha = a0; vx.letterSpacing = '0px';
  return size;
}
/** Word-wraps with the given font; returns the lines. */
function vWrap(str, maxW, size, weight = 700, fam = FONT) {
  vx.font = `${weight} ${size}px ${fam}`; vx.letterSpacing = '0px';
  const words = str.split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (vx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur);
  return lines;
}
/** Fade envelope with a small rise: [alpha, dy]. */
function vEnv(v, a, b, fin = 8, fout = 8) {
  const i = E.outCubic(prog(v, a, a + fin)), o = 1 - E.inCubic(prog(v, b - fout, b));
  return [Math.min(i, o), (1 - i) * 22 - (1 - o) * 10];
}
/** Which segment of a cut list a vertical frame is in: segs = [{ at, src, len }] in frames. */
function vSeg(segs, v) {
  let k = 0; while (k < segs.length - 1 && v >= segs[k + 1].at) k++;
  const s = segs[k];
  return { k, s, local: v - s.at, src: s.src + (v - s.at) };
}
/** Dims everything outside the safe area to a quiet texture (brightness x 0.2), with a soft inner edge. */
function vShade(rgb, a = 0.8, feather = 40) {
  vx.save(); vx.setTransform(1, 0, 0, 1, 0, 0); vx.globalAlpha = 1; vx.globalCompositeOperation = 'source-over';
  vx.fillStyle = `rgba(${rgb},${a})`;
  vx.beginPath(); vx.rect(0, 0, VW, VH); vx.rect(SAFE.x, SAFE.y, SAFE.w, SAFE.h); vx.fill('evenodd');
  const strip = (x0, y0, x1, y1, rx, ry, rw, rh) => {
    const g = vx.createLinearGradient(x0, y0, x1, y1);
    g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`);
    vx.fillStyle = g; vx.fillRect(rx, ry, rw, rh);
  };
  strip(SAFE.x, 0, SAFE.x + feather, 0, SAFE.x, SAFE.y, feather, SAFE.h);
  strip(SAFE.r, 0, SAFE.r - feather, 0, SAFE.r - feather, SAFE.y, feather, SAFE.h);
  strip(0, SAFE.y, 0, SAFE.y + feather, SAFE.x, SAFE.y, SAFE.w, feather);
  strip(0, SAFE.b, 0, SAFE.b - feather, SAFE.x, SAFE.b - feather, SAFE.w, feather);
  vx.restore();
}
/** Series tag at the top of the safe area, e.g. MADE IN CODE · 04. */
function vTag(label, color, alpha = 1) {
  vText('MADE IN CODE', VL, 292, { size: 28, weight: 800, color, spacing: 5, alpha });
  vx.font = `800 28px ${FONT}`; vx.letterSpacing = '5px';
  const w = vx.measureText('MADE IN CODE').width; vx.letterSpacing = '0px';
  vText('·  ' + label, VL + w + 14, 292, { size: 28, weight: 600, color: 'rgba(255,255,255,0.72)', spacing: 3, alpha, max: VR - VL - w - 14 });
}
/** Big hook lines, left-aligned from y0; visible from frame 0, settles in a few frames. */
function vHook(v, lines, y0, { size = 84, lh = 1.08, color = '#FFFFFF', accent = null, weight = 800, spacing = -1.5, alpha = 1 } = {}) {
  const k = E.outExpo(prog(v, -6, 12));
  lines.forEach((ln, i) => {
    const kk = E.outExpo(prog(v, -12 + i * 2, 8 + i * 2));
    vText(ln, VL, y0 + i * size * lh + (1 - kk) * 30, { size, weight, spacing, color: accent && i === lines.length - 1 ? accent : color, alpha: alpha * Math.max(0.25, kk), max: VR - VL });
  });
  return k;
}
/** Closing card, the last 60 frames: piece title, "drawn in code · bytepatterns.com". l = frames into the card. */
function vEndCard(l, { title, line = '', ink = '#FFFFFF', dim = 'rgba(255,255,255,0.66)', accent = '#FFFFFF', scrim = '0,0,0', a = 0.84 }) {
  const k = E.outCubic(prog(l, 0, 12));
  vx.save(); vx.setTransform(1, 0, 0, 1, 0, 0);
  vx.fillStyle = `rgba(${scrim},${a * k})`; vx.fillRect(0, 0, VW, VH);
  vx.restore();
  const t1 = E.outExpo(prog(l, 3, 19)), t2 = E.outExpo(prog(l, 11, 27)), t3 = E.outExpo(prog(l, 19, 35));
  vx.fillStyle = accent; vx.globalAlpha = t1; vx.fillRect(VL, 742, 88 * t1, 7); vx.globalAlpha = 1;
  const size = vText(title, VL, 850 + (1 - t1) * 40, { size: 92, weight: 800, color: ink, spacing: -2, alpha: t1, max: VR - VL });
  const y2 = 850 + Math.max(size, 60) * 0.25 + 70;
  vx.font = `600 44px ${FONT}`;
  const lead = 'drawn in code  ·  ', lw = vx.measureText(lead).width;
  vText(lead, VL, y2 + (1 - t2) * 24, { size: 44, weight: 600, color: dim, alpha: t2 });
  vText('bytepatterns.com', VL + lw, y2 + (1 - t2) * 24, { size: 44, weight: 800, color: accent, alpha: t2 });
  if (line) vText(line, VL, y2 + 72 + (1 - t3) * 18, { size: 32, weight: 500, color: dim, alpha: t3, max: VR - VL });
}
/** Seeks a cut. The first frame a page draws is drawn twice: the very first read of a
 *  GPU-backed source canvas can come out a shade different from every later one. */
let vWarm = false;
function vSeek(draw, i, frames) {
  const f = Math.max(0, Math.min(frames - 1, Math.floor(i)));
  if (!vWarm) { vWarm = true; draw(f); }
  draw(f);
}
/** The soundtrack of a cut: the piece's own audio() spliced to the same segments as the picture. */
async function vAudio(segs, frames, { xf = 0.025, fadeOut = 0.6, extra = null } = {}) {
  const src = await renderAudio();
  const SR = 48000, dur = frames / FPS, ac = new OfflineAudioContext(2, Math.round(SR * dur), SR);
  const out = ac.createGain(); out.connect(ac.destination);
  out.gain.setValueAtTime(1, 0); out.gain.setValueAtTime(1, dur - fadeOut); out.gain.linearRampToValueAtTime(0, dur - 0.01);
  segs.forEach((s, k) => {
    const at = s.at / FPS, off = s.src / FPS, d = s.len / FPS;
    const pre = k === 0 ? 0 : Math.min(xf, off), post = k === segs.length - 1 ? 0 : xf;
    const b = ac.createBufferSource(), g = ac.createGain(); b.buffer = src;
    g.gain.setValueAtTime(pre ? 0 : 1, at - pre);
    if (pre) g.gain.linearRampToValueAtTime(1, at + pre);
    if (post) { g.gain.setValueAtTime(1, at + d - post); g.gain.linearRampToValueAtTime(0, at + d + post); }
    b.connect(g).connect(out); b.start(at - pre, off - pre, d + pre + post);
  });
  if (extra) extra(ac, out);
  const buf = await ac.startRendering();
  let peak = 0; for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) peak = Math.max(peak, Math.abs(d[i])); }
  if (peak > 0.9) for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] *= 0.9 / peak; }
  return buf;
}
/** A soft three-partial bell, for the closing card. */
function vChime(ac, dest, at, freq, vol = 0.08) {
  for (const [mul, v, dec] of [[1, 1, 1.8], [2.01, 0.35, 0.8], [3.02, 0.12, 0.4]]) {
    const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.value = freq * mul;
    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol * v, at + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, at + dec);
    o.connect(g).connect(dest); o.start(at); o.stop(at + dec + 0.05);
  }
}

/* VERTICAL CUT — this piece */
// The same row and simulation through a portrait camera (it frames fewer
// dominoes, taller); the middle of the cascade is cut.
const VSEG = [
  { at: 0, src: 0, len: 60 },                                // hook and the push
  { at: 60, src: T.push, len: 190 },                         // the first half
  { at: 250, src: F1 - 150, len: 170 },                      // the big ones
  { at: 420, src: F1 + 20, len: 60 },                        // pull back
  { at: 480, src: T.end + 2, len: 60 },                      // closing card
];
const VFR = 540, VEND = VFR - 60;
const STAGE_V = { x: SAFE.x, y: SAFE.y, w: SAFE.w, h: SAFE.h, gy: 1200 };
const CAM_V = makeCam(SAFE.w / SAFE.h, 0.1, 4.2, 2.2, { tall: 2.2, spans: 3, ovV: 2.9, ovX: 29 });
function vDraw(v) {
  const { k: seg, src } = vSeg(VSEG, v), f = Math.min(FRAMES - 1, src);
  vReset();
  backdrop(vx, VW, VH);
  drawRow(vx, f, STAGE_V, CAM_V[f]);
  vShade(C.bgRGB, 0.84);
  vTag('CHAIN REACTION', C.amber);
  if (seg === 0) {
    vHook(v, ['100 dominoes.'], 440, { size: 108, color: C.paper });
    vText('Each one 3% taller.', VL, 530, { size: 58, weight: 800, color: C.amber });
  } else if (seg <= 2) {
    const [al, dy] = vEnv(v, 60, 420, 10, 8);
    const n = fallenAt(f), k = Math.min(N - 1, frontAt(f));
    vText('fallen', VL, 390 + dy, { size: 30, weight: 600, color: C.dim, spacing: 3, alpha: al });
    vText(`${String(n).padStart(3)} / ${N}`, VL - 8, 490 + dy, { size: 104, weight: 800, fam: MONO, color: C.paper, spacing: -3, alpha: al });
    vText(`${Hd[k].toFixed(1)}×`, VL - 8, 700 + dy, { size: 150, weight: 850, fam: MONO, color: C.amber, spacing: -6, alpha: al });
    vText('the first one’s height', VL, 756 + dy, { size: 36, weight: 600, color: C.dim, alpha: al });
  } else {
    const [al, dy] = vEnv(v, 420, VEND + 4, 10, 8);
    vText('The last one is', VL, 420 + dy, { size: 60, weight: 800, color: C.paper, alpha: al });
    vText(`${RATIO.toFixed(1)}× the first.`, VL, 530 + dy, { size: 104, weight: 850, color: C.amber, spacing: -3, alpha: al, max: VR - VL });
  }
  if (v >= VEND) vEndCard(v - VEND, { title: 'Chain Reaction', line: `${N} dominoes · 3% taller each · ${RATIO.toFixed(1)}×`,
    ink: C.paper, dim: 'rgba(243,237,227,0.72)', accent: C.amber, scrim: C.bgRGB, a: 0.84 });
  vReset();
}

window.__motion = {
  title: 'Chain Reaction',
  description: `One hundred dominoes, each 3% taller than the one before, topple in a chain until the last one is ${RATIO.toFixed(1)} times the height of the first.`,
  fps: FPS, width: W, height: H, frames: FRAMES,
  poster: 420,
  gifStart: 9,
  seek(i) { draw(Math.max(0, Math.min(FRAMES - 1, Math.floor(i)))); },
  audio: renderAudio,
  variants: {
    vertical: {
      width: VW, height: VH, frames: VFR, canvas: vcv,
      poster: 330, gifStart: 7,
      seek(i) { vSeek(vDraw, i, VFR); },
      audio: () => vAudio(VSEG, VFR),
    },
  },
};

/* ==========================================================================
   PLAYER — identical in every piece; keep as is.
   Autoplays and loops, starts sound on the first click, ?frame=N pauses on a
   frame, ?variant=vertical plays the vertical cut (if the piece has one).
   When the renderer sets window.__MOTION_RENDER__ it stays out of the way.
   ========================================================================== */
(function player() {
  const btn = document.getElementById('sound'), q = new URLSearchParams(location.search);
  let M = window.__motion;
  const V = !window.__MOTION_RENDER__ && M.variants && M.variants[q.get('variant')];
  if (V) {                                                // show the variant's own canvas instead
    M = Object.assign({}, M, V);
    V.canvas.style.cssText = `width:min(100vw,calc(100vh*${V.width}/${V.height}));height:auto;aspect-ratio:${V.width}/${V.height}`;
    document.querySelector('canvas').replaceWith(V.canvas);
  }
  const dur = M.frames / M.fps;
  if (window.__MOTION_RENDER__) { btn.hidden = true; M.seek(0); return; }
  if (q.has('frame')) { btn.hidden = true; M.seek(+q.get('frame') || 0); return; }
  let t0 = performance.now(), ac = null, src = null, buf = null, paused = false, pausedAt = 0;
  const clock = () => ac && src ? (ac.currentTime - t0) : (performance.now() - t0) / 1000;
  function loop() {
    if (!paused) M.seek(Math.floor(((clock() % dur) + dur) % dur * M.fps));
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  btn.addEventListener('click', async () => {
    if (src) { src.stop(); src = null; btn.textContent = 'Click for sound'; t0 = performance.now(); return; }
    btn.textContent = 'Loading sound…';
    ac = ac || new AudioContext({ sampleRate: 48000 });
    buf = buf || await M.audio();
    await ac.resume();
    src = ac.createBufferSource(); src.buffer = buf; src.loop = true; src.connect(ac.destination);
    t0 = ac.currentTime + 0.05; src.start(t0);        // picture restarts from frame 0 in sync with the sound
    btn.textContent = 'Sound on — click to mute';
  });
  addEventListener('keydown', e => {
    if (e.code !== 'Space') return;
    e.preventDefault(); paused = !paused;
    if (ac) paused ? ac.suspend() : ac.resume();
    if (!ac) { if (paused) pausedAt = performance.now(); else t0 += performance.now() - pausedAt; }
  });
})();
</script>
