<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="teambytepatterns">
<meta name="description" content="Twelve keys run through a real FNV-1a hash into eight buckets; collisions grow chains, the table doubles to sixteen and every key rehashes by one more bit.">
<title>Where Keys Go — motion-lab</title>
<style>
  /* Player chrome. The piece itself lives entirely in the canvas. */
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; font: 500 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; }
  canvas { display: block; width: min(100vw, calc(100vh * 16 / 9)); height: auto; aspect-ratio: 16 / 9; }
  #sound { position: fixed; left: 16px; bottom: 16px; padding: 8px 14px; border: 1px solid rgba(255,255,255,.35); border-radius: 999px;
           background: rgba(0,0,0,.55); color: #fff; font: inherit; cursor: pointer; }
  #sound[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080" aria-label="A hash table: keys are hashed, dropped into buckets, collide into chains, and are rehashed when the table doubles"></canvas>
<button id="sound" type="button">Click for sound</button>
<script>
'use strict';
/* ==========================================================================
   PIECE — Where Keys Go.
   A hash table with separate chaining, run for real. Each key goes through
   32-bit FNV-1a (h ^= byte; h *= 16777619), the last 3 bits of the hash pick
   one of 8 buckets, and the key is appended to that bucket's chain; when the
   bucket is already taken, that is a collision (you hear it as a tick). With
   12 keys in 8 buckets the table doubles to 16 and rehashes: one more bit
   decides, so every key either stays at bucket i or moves to i + 8. Then a
   lookup walks one chain.
   Determinism: every position is a closed-form function of the frame number
   and the insertion schedule; the only "randomness" (the scrambling hex
   digits) comes from mulberry32 seeded by the key and the frame.
   ========================================================================== */
const W = 1920, H = 1080, FPS = 30, FRAMES = 720;          // 24 s
const cv = document.getElementById('stage');
const ctx = cv.getContext('2d');
const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
const MONO = 'ui-monospace, "Cascadia Code", Consolas, Menlo, monospace';

// ---- helpers -------------------------------------------------------------
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (f, a, b) => clamp((f - a) / (b - a));
const smooth = t => t * t * (3 - 2 * t);
const E = {
  inCubic: t => t * t * t,
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inOutCubic: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outExpo: t => t === 1 ? 1 : 1 - Math.pow(2, -10 * t),
  inExpo: t => t === 0 ? 0 : Math.pow(2, 10 * t - 10),
  inOutExpo: t => t === 0 ? 0 : t === 1 ? 1 : t < .5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2,
  outBack: t => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2),
};
function text(g, str, x, y, { size = 40, weight = 600, color = '#fff', alpha = 1, spacing = 0, align = 'left', fam = FONT, base = 'alphabetic' } = {}) {
  if (alpha <= 0.002 || !str) return 0;
  g.font = `${weight} ${size}px ${fam}`; g.letterSpacing = spacing + 'px';
  g.textAlign = align; g.textBaseline = base;
  const a0 = g.globalAlpha; g.globalAlpha = a0 * alpha; g.fillStyle = color;
  g.fillText(str, x, y);
  const w = g.measureText(str).width;
  g.globalAlpha = a0; g.letterSpacing = '0px';
  return w;
}
const env = (f, a, b, fin = 12, fout = 10) => {
  const i = E.outCubic(prog(f, a, a + fin)), o = 1 - E.inCubic(prog(f, b - fout, b));
  return [Math.min(i, o), (1 - i) * 24 - (1 - o) * 10];
};

// ---- palette -------------------------------------------------------------
const C = { bg: '#0A0F1C', bgRGB: '10,15,28', paper: '#F1ECE3', dim: 'rgba(241,236,227,0.62)', faint: 'rgba(241,236,227,0.28)',
  amber: '#F5B83D', teal: '#58C4B8', coral: '#FF7A59', node: '#18223C', nodeRGB: '24,34,60', rail: 'rgba(241,236,227,0.10)' };

// ---- the hash function, and the keys -------------------------------------------
function fnv1a(s) {                                          // 32-bit FNV-1a
  let h = 0x811C9DC5;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
  return h >>> 0;
}
const KEYS = ['array', 'graph', 'class', 'string', 'int', 'buffer', 'set', 'search', 'column', 'char', 'token', 'chain'];
const hex8 = h => h.toString(16).padStart(8, '0');
const bin32 = h => h.toString(2).padStart(32, '0');
const T = { ins: 96, resize: 516, grow: 546, lookup: 600, end: 656 };
const INS = [];
{
  let t = T.ins;
  const fill8 = new Array(8).fill(0), fill16 = new Array(16).fill(0);
  KEYS.forEach((key, i) => {
    const d = i < 3 ? 64 : 24, h = fnv1a(key), b8 = h & 7, b16 = h & 15;
    const k = { i, key, h, a: t, d, b8, b16, p8: fill8[b8]++, p16: fill16[b16]++ };
    k.land = t + Math.round(d * 0.9);
    k.collide = k.p8 > 0;
    k.mv = T.grow + i * 3;                                    // rehash move: starts here, 22 frames
    t += d;
    INS.push(k);
  });
}
const COLLISIONS = INS.filter(k => k.collide).length;
const LOOK = INS.find(k => k.key === 'chain');                // get("chain")
const LOOKCHAIN = INS.filter(k => k.b16 === LOOK.b16).sort((a, b) => a.p16 - b.p16);
const LT = LOOKCHAIN.map((k, j) => T.lookup + 22 + j * 12);  // frame each chain node is compared
const EX = INS.find(k => k.key === 'int');                    // the rehash example: 6 -> 14

// ---- layouts: the same scene, placed for landscape or for the phone ---------------
const LAY_L = {
  px: 120, pw: 700,
  y: { lab1: 236, key: 306, lab2: 392, hex: 462, bin: 516, lab3: 600, idx: 668, lab4: 752, note: 812, stats: 968 },
  s: { key: 60, hex: 66, bin: 28, idx: 56, lab: 28, note: 40, stats: 30 },
  t: { ix: 980, iw: 66, nx: 1086, nw: 156, gap: 40, y0: 176, y1: 1010, rx: 1800, nh8: 64, nh16: 42, f8: 34, f16: 28 },
};
const LAY_V = {
  px: 96, pw: 768,
  y: { lab1: 360, key: 420, lab2: 0, hex: 492, bin: 540, lab3: 0, idx: 606, lab4: 0, note: 656, stats: 1376 },
  s: { key: 52, hex: 56, bin: 28, idx: 46, lab: 28, note: 34, stats: 28 },
  t: { ix: 96, iw: 58, nx: 170, nw: 196, gap: 34, y0: 690, y1: 1330, rx: 864, nh8: 58, nh16: 36, f8: 32, f16: 28 },
};
const growK = f => E.inOutCubic(prog(f, T.resize + 6, T.grow));      // 8 rows -> 16 rows
function rowGeom(L, k) {
  const t = L.t, h8 = (t.y1 - t.y0) / 8, h16 = (t.y1 - t.y0) / 16;
  return { rh: lerp(h8, h16, k), nh: lerp(t.nh8, t.nh16, k), fs: lerp(t.f8, t.f16, k) };
}
function slot(L, row, pos, k) {
  const g = rowGeom(L, k), t = L.t;
  return { x: t.nx + pos * (t.nw + t.gap), y: t.y0 + row * g.rh + g.rh / 2, w: t.nw, h: g.nh, fs: g.fs };
}
/** Where key k is at frame f, and how it looks. */
function keyState(L, k, f) {
  if (f < k.a + k.d * 0.62) return null;
  const gk = growK(f);
  if (f < k.land) {                                          // in flight from the pipeline
    const u = E.inOutCubic(prog(f, k.a + k.d * 0.62, k.land));
    const to = slot(L, k.b8, k.p8, gk);
    const fx = L.px + 60, fy = L.y.key - L.s.key * 0.34;
    return { x: lerp(fx, to.x, u), y: lerp(fy, to.y, u) - Math.sin(u * Math.PI) * 60, w: to.w, h: to.h, fs: to.fs, a: E.outCubic(prog(u, 0, 0.2)), fly: true };
  }
  const m = E.inOutCubic(prog(f, k.mv, k.mv + 22));
  const s0 = slot(L, k.b8, k.p8, gk), s1 = slot(L, k.b16, k.p16, gk);
  const moved = k.b16 !== k.b8 || k.p16 !== k.p8;
  return { x: lerp(s0.x, s1.x, m), y: lerp(s0.y, s1.y, m) - (moved ? Math.sin(m * Math.PI) * 26 : 0), w: s0.w, h: s0.h, fs: s0.fs, a: 1, m, moved };
}
function arrow(g, x0, y0, x1, y1, alpha, color = 'rgba(241,236,227,0.55)') {
  if (alpha <= 0.01) return;
  g.save(); g.globalAlpha *= alpha; g.strokeStyle = color; g.fillStyle = color; g.lineWidth = 3;
  g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1 - 10, y1); g.stroke();
  g.beginPath(); g.moveTo(x1, y1); g.lineTo(x1 - 12, y1 - 7); g.lineTo(x1 - 12, y1 + 7); g.closePath(); g.fill();
  g.restore();
}
function drawTable(g, L, f, alpha = 1) {
  if (alpha <= 0.002) return;
  const t = L.t, gk = growK(f), geo = rowGeom(L, gk), rows = gk > 0 ? 16 : 8;
  g.save(); g.globalAlpha = alpha;
  // rows: index box + rail
  for (let r = 0; r < rows; r++) {
    const ra = r < 8 ? 1 : E.outCubic(prog(gk, 0.25 + (r - 8) * 0.06, 0.6 + (r - 8) * 0.05));
    if (ra <= 0.01) continue;
    const y = t.y0 + r * geo.rh + geo.rh / 2, bh = geo.nh;
    g.globalAlpha = alpha * ra;
    g.fillStyle = C.rail; g.fillRect(t.nx - 14, y - 1, t.rx - t.nx + 14, 2);
    g.fillStyle = r >= 8 ? 'rgba(88,196,184,0.20)' : 'rgba(241,236,227,0.08)';
    g.beginPath(); g.roundRect(t.ix, y - bh / 2, t.iw, bh, 8); g.fill();
    text(g, String(r), t.ix + t.iw / 2, y + geo.fs * 0.36, { size: geo.fs, weight: 700, fam: MONO, color: r >= 8 ? C.teal : C.dim, align: 'center' });
  }
  g.globalAlpha = alpha;
  // chains: arrows between neighbours that are settled in the same bucket
  const st = INS.map(k => keyState(L, k, f));
  for (const [bk, pk, done] of [['b8', 'p8', s => s && !s.fly && s.m === 0], ['b16', 'p16', s => s && s.m === 1]]) {
    for (const k of INS) {
      const prev = INS.find(q => q[bk] === k[bk] && q[pk] === k[pk] - 1);
      if (!prev) continue;
      const a = st[prev.i], b = st[k.i];
      if (!done(a) || !done(b)) continue;
      arrow(g, a.x + a.w + 4, a.y, b.x - 4, b.y, 1);
    }
  }
  // the keys
  for (const k of INS) {
    const s = st[k.i]; if (!s) continue;
    let ring = null, ringK = 0;
    if (k.collide && f >= k.land) { ringK = 1 - prog(f, k.land, k.land + 26); if (ringK > 0) ring = C.coral; }
    const li = LOOKCHAIN.indexOf(k);
    if (li >= 0 && f >= LT[li] && f < T.end + 30) { ring = k === LOOK ? C.teal : C.coral; ringK = E.outCubic(prog(f, LT[li], LT[li] + 6)); }
    g.globalAlpha = alpha * s.a;
    g.fillStyle = s.moved && s.m > 0 && s.m < 1 ? 'rgba(88,196,184,0.30)' : C.node;
    g.beginPath(); g.roundRect(s.x, s.y - s.h / 2, s.w, s.h, 10); g.fill();
    g.lineWidth = 2; g.strokeStyle = 'rgba(241,236,227,0.30)'; g.stroke();
    if (ring && ringK > 0) {
      g.save(); g.globalAlpha = alpha * ringK; g.strokeStyle = ring; g.lineWidth = 5;
      g.beginPath(); g.roundRect(s.x - 5, s.y - s.h / 2 - 5, s.w + 10, s.h + 10, 14); g.stroke(); g.restore();
    }
    text(g, k.key, s.x + s.w / 2, s.y + s.fs * 0.34, { size: s.fs, weight: 700, fam: MONO, color: C.paper, align: 'center', alpha: s.a });
  }
  g.restore();
}
/** Scrambled hex while the hash is "computing": digits settle left to right. */
function hexAt(k, f, u0, u1) {
  const u = prog(f, k.a + k.d * u0, k.a + k.d * u1), settled = Math.floor(u * 8.999), r = mulberry32(k.i * 7919 + f * 31 + 5), s = hex8(k.h);
  let out = '';
  for (let j = 0; j < 8; j++) out += j < settled ? s[j] : '0123456789abcdef'[Math.floor(r() * 16)];
  return out;
}
/** The 32-bit binary, grouped in nibbles, with the low `bits` bits in colour (and bit `hot` in amber). */
function drawBin(g, L, h, x, y, bits, alpha, hot = -1) {
  if (alpha <= 0.002) return;
  const b = bin32(h), size = L.s.bin;
  g.font = `600 ${size}px ${MONO}`;
  const cw = g.measureText('0').width, gapw = cw * 0.55;
  let cx = x;
  for (let j = 0; j < 32; j++) {
    const fromLow = 31 - j, on = fromLow < bits;
    const col = fromLow === hot ? C.amber : on ? C.teal : 'rgba(241,236,227,0.42)';
    if (on) { g.save(); g.globalAlpha = alpha * 0.18; g.fillStyle = fromLow === hot ? C.amber : C.teal; g.fillRect(cx - 2, y - size * 0.86, cw + 4, size * 1.12); g.restore(); }
    text(g, b[j], cx, y, { size, weight: on ? 800 : 500, fam: MONO, color: col, alpha });
    cx += cw + ((j % 4 === 3) ? gapw : 0);
  }
}
function label(g, L, n, str, y, alpha) {
  if (!y || alpha <= 0.002) return;
  const w = text(g, String(n), L.px, y, { size: L.s.lab, weight: 800, fam: MONO, color: C.amber, alpha });
  text(g, str, L.px + w + 16, y, { size: L.s.lab, weight: 600, color: C.dim, alpha });
}
/** The pipeline for key k (or a get / rehash): key -> hash -> bits -> bucket. */
function drawPipe(g, L, f, alpha, vertical = false) {
  if (alpha <= 0.002) return;
  const Y = L.y, S = L.s;
  let k = null; for (const q of INS) if (f >= q.a) k = q;
  const mode = f >= T.lookup - 4 ? 'get' : f >= T.resize ? 'rehash' : 'put';
  if (mode !== 'put') k = mode === 'get' ? LOOK : EX;
  if (!k) return;
  const base = mode === 'put' ? k.a : mode === 'rehash' ? T.resize : T.lookup - 4, d = mode === 'put' ? k.d : 40;
  const kk = mode === 'put' ? k : { ...k, a: base, d };
  const u = f - base;
  const ai = E.outCubic(prog(u, 0, Math.max(4, d * 0.16)));
  const bits = mode === 'put' ? 3 : 4, m = mode === 'put' ? 8 : 16, idx = mode === 'put' ? k.b8 : k.b16;
  const slow = mode !== 'put' || k.i < 3;
  const lab = slow ? 1 : 0.55;
  if (!vertical) {
    label(g, L, 1, mode === 'get' ? 'look a key up' : mode === 'rehash' ? 'rehash every key' : 'a key comes in', Y.lab1, alpha * lab);
    label(g, L, 2, 'hash it: FNV-1a, 32 bits', Y.lab2, alpha * lab);
    label(g, L, 3, `keep the last ${bits} bits (${m} buckets)`, Y.lab3, alpha * lab);
  } else {
    text(g, mode === 'rehash' ? 'rehash, 16 buckets' : `FNV-1a  ·  last ${bits} bits  ·  ${m} buckets`, L.px, Y.lab1, { size: S.lab, weight: 600, color: C.dim, alpha });
  }
  const op = mode === 'get' ? 'get' : mode === 'rehash' ? 'rehash' : 'put';
  text(g, `${op}("${k.key}")`, L.px, Y.key + (1 - ai) * 16, { size: S.key, weight: 700, fam: MONO, color: C.paper, alpha: alpha * ai });
  const hk = prog(u, d * 0.16, d * 0.2);
  const hs = mode === 'put' ? hexAt(kk, f, 0.16, 0.44) : hex8(k.h);
  text(g, '0x' + hs, L.px, Y.hex, { size: S.hex, weight: 800, fam: MONO, color: C.amber, alpha: alpha * E.outCubic(hk) });
  const bk = E.outCubic(prog(u, d * 0.42, d * 0.52));
  drawBin(g, L, k.h, L.px, Y.bin, prog(u, d * 0.46, d * 0.5) > 0 ? bits : 0, alpha * bk, mode === 'rehash' ? 3 : -1);
  const ik = E.outCubic(prog(u, d * 0.5, d * 0.6));
  const lowBits = bin32(k.h).slice(32 - bits);
  const iw = text(g, `${lowBits} → `, L.px, Y.idx + (1 - ik) * 12, { size: S.idx, weight: 700, fam: MONO, color: C.teal, alpha: alpha * ik });
  text(g, `bucket ${idx}`, L.px + iw, Y.idx + (1 - ik) * 12, { size: S.idx, weight: 800, color: C.paper, alpha: alpha * ik });
  // the note under it: what happened to the key that landed last
  let kl = null; for (const q of INS) if (f >= q.land) kl = q;
  if (mode === 'put' && kl) {
    const nk = E.outCubic(prog(f, kl.land, kl.land + 5));
    const str = kl.collide ? `"${kl.key}": collision, bucket ${kl.b8} holds ${kl.p8 + 1}` : `"${kl.key}": bucket ${kl.b8} was empty`;
    text(g, str, L.px, Y.note, { size: S.note, weight: 800, color: kl.collide ? C.coral : C.dim, alpha: alpha * nk });
  } else if (mode === 'rehash') {
    const nk = E.outCubic(prog(u, 22, 32));
    if (!vertical) {
      text(g, 'One more bit decides:', L.px, Y.note, { size: S.note, weight: 800, color: C.paper, alpha: alpha * nk });
      text(g, `every key stays at i, or moves to i + 8`, L.px, Y.note + 52, { size: 34, weight: 500, color: C.dim, alpha: alpha * nk });
    } else text(g, 'every key stays at i, or moves to i + 8', L.px, Y.note, { size: S.note, weight: 800, color: C.paper, alpha: alpha * nk });
  } else if (mode === 'get') {
    const j = LT.findIndex((t, q) => f >= t && (q === LT.length - 1 || f < LT[q + 1]));
    if (j >= 0) {
      const hit = LOOKCHAIN[j] === LOOK;
      const str = hit ? `found in ${j + 1} steps` : `${LOOKCHAIN[j].key} ≠ ${LOOK.key}, next`;
      text(g, str, L.px, Y.note, { size: S.note, weight: 800, color: hit ? C.teal : C.coral, alpha: alpha * E.outCubic(prog(f, LT[j], LT[j] + 5)) });
      if (hit && !vertical) text(g, 'on average, a bucket or two: O(1)', L.px, Y.note + 52, { size: 34, weight: 500, color: C.dim, alpha: alpha * E.outCubic(prog(f, LT[j] + 6, LT[j] + 14)) });
    }
  }
}
function stats(f) {
  const n = INS.filter(k => f >= k.land).length, m = growK(f) > 0.5 ? 16 : 8;
  const col = INS.filter(k => k.collide && f >= k.land).length;
  const lens = new Array(16).fill(0); for (const k of INS) if (f >= k.land) lens[f >= k.mv + 11 ? k.b16 : k.b8]++;
  return { n, m, load: n / m, col, longest: Math.max(0, ...lens) };
}

// ---- landscape picture ------------------------------------------------------------------
function backdrop(g, w, h) {
  g.fillStyle = C.bg; g.fillRect(0, 0, w, h);
  const gr = g.createRadialGradient(w * 0.68, h * 0.5, 40, w * 0.68, h * 0.5, Math.max(w, h) * 0.7);
  gr.addColorStop(0, 'rgba(34,46,86,0.75)'); gr.addColorStop(1, 'rgba(10,15,28,0)');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
}
function draw(f) {
  if (ctx.reset) ctx.reset();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none'; ctx.shadowBlur = 0;
  backdrop(ctx, W, H);
  const endK = E.inOutCubic(prog(f, T.end, T.end + 20)), a = 1 - endK;
  text(ctx, 'DATA STRUCTURES  ·  HASH TABLE', 120, 104, { size: 26, weight: 600, color: C.dim, spacing: 5, alpha: a });
  text(ctx, 'BYTEPATTERNS', 1800, 104, { size: 26, weight: 600, color: C.dim, spacing: 5, align: 'right', alpha: a });
  drawTable(ctx, LAY_L, f, 0.35 + 0.65 * E.outCubic(prog(f, 40, 90)));
  // hook
  {
    const k = E.outExpo(prog(f, -6, 14)), k2 = E.outExpo(prog(f, 6, 24)), o = 1 - E.inCubic(prog(f, T.ins - 14, T.ins));
    text(ctx, 'Where does', 116, 380 + (1 - k) * 30, { size: 124, weight: 850, color: C.paper, spacing: -3, alpha: Math.min(k, o) });
    text(ctx, 'a key go?', 116, 510 + (1 - k2) * 30, { size: 124, weight: 850, color: C.amber, spacing: -3, alpha: Math.min(k2, o) });
    const [a3, d3] = env(f, 28, T.ins, 14, 14);
    text(ctx, 'A real hash function, eight buckets, twelve keys.', 120, 610 + d3, { size: 38, weight: 500, color: C.dim, alpha: a3 });
  }
  const pa = E.outCubic(prog(f, T.ins - 4, T.ins + 10)) * a;
  drawPipe(ctx, LAY_L, f, pa);
  // stats
  {
    const s = stats(f), sa = E.outCubic(prog(f, T.ins + 40, T.ins + 60)) * a;
    text(ctx, `keys ${String(s.n).padStart(2)}   buckets ${s.m}   load ${s.load.toFixed(2)}`, 120, LAY_L.y.stats, { size: 30, weight: 600, fam: MONO, color: C.paper, alpha: sa });
    text(ctx, `collisions ${s.col}   longest chain ${s.longest}`, 120, LAY_L.y.stats + 44, { size: 30, weight: 600, fam: MONO, color: s.col ? C.coral : C.dim, alpha: sa });
  }
  if (endK > 0) {
    ctx.fillStyle = `rgba(${C.bgRGB},${0.8 * endK})`; ctx.fillRect(0, 0, W, H);
    const k1 = E.outCubic(prog(f, T.end + 6, T.end + 28)), k2 = E.outCubic(prog(f, T.end + 16, T.end + 38)), k3 = E.outCubic(prog(f, T.end + 26, T.end + 48));
    text(ctx, 'Where Keys Go', W / 2, 500 + (1 - k1) * 30, { size: 136, weight: 850, color: C.paper, spacing: -3, align: 'center', alpha: k1 });
    text(ctx, `FNV-1a  ·  separate chaining  ·  ${KEYS.length} keys, ${COLLISIONS} collisions, one resize`, W / 2, 580 + (1 - k2) * 20, { size: 40, weight: 500, color: C.amber, align: 'center', alpha: k2 });
    text(ctx, 'bytepatterns · motion lab', W / 2, 1000, { size: 32, weight: 600, color: C.paper, spacing: 3, align: 'center', alpha: k3 * 0.8 });
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.letterSpacing = '0px';
}

// ---- sound: a pluck per bucket, a tick per collision, a sweep for the resize -------------
async function renderAudio() {
  const SR = 48000, dur = FRAMES / FPS, LEN = Math.round(SR * dur);
  const ac = new OfflineAudioContext(2, LEN, SR);
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -14; comp.ratio.value = 3; comp.attack.value = 0.005; comp.release.value = 0.2;
  const master = ac.createGain(); master.gain.value = 0.95; master.connect(comp).connect(ac.destination);
  master.gain.setValueAtTime(0.95, dur - 0.8); master.gain.linearRampToValueAtTime(0.0001, dur - 0.02);
  const rnd = mulberry32(0x4A5B1E);
  const ir = ac.createBuffer(2, SR * 2.2, SR);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let k = 0; k < d.length; k++) d[k] = (rnd() * 2 - 1) * Math.pow(1 - k / d.length, 3.6); }
  const verb = ac.createConvolver(); verb.buffer = ir; const vg = ac.createGain(); vg.gain.value = 0.3; verb.connect(vg).connect(master);
  const noise = ac.createBuffer(1, SR, SR); { const d = noise.getChannelData(0); for (let k = 0; k < d.length; k++) d[k] = rnd() * 2 - 1; }
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  // pad
  const pad = (fa, fb, notes, amp) => { const a = fa / FPS, b = Math.min(dur, fb / FPS), lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900; lp.connect(master); lp.connect(verb);
    for (const m of notes) for (const det of [-6, 6]) {
      const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = hz(m); o.detune.value = det;
      const g = ac.createGain(); g.gain.setValueAtTime(0, a); g.gain.linearRampToValueAtTime(amp, a + (fa === 0 ? 0.1 : 1.0));
      g.gain.setValueAtTime(amp, Math.max(a + 1, b - 0.8)); g.gain.linearRampToValueAtTime(0, b);
      o.connect(g).connect(lp); o.start(a); o.stop(b + 0.05);
    } };
  pad(0, 300, [45, 52, 57, 60, 64], 0.018); pad(280, 530, [41, 48, 53, 57, 60], 0.018); pad(510, FRAMES, [43, 50, 55, 59, 62], 0.018);
  const blip = (at, freq, amp, len = 0.05, type = 'sine', pan = 0) => { const o = ac.createOscillator(), g = ac.createGain(), p = ac.createStereoPanner();
    o.type = type; o.frequency.value = freq; p.pan.value = pan;
    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(amp, at + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, at + len);
    o.connect(g).connect(p); p.connect(master); p.connect(verb); o.start(at); o.stop(at + len + 0.03); };
  const pluck = (at, m, amp, pan = 0.25) => { blip(at, hz(m), amp, 0.5, 'triangle', pan); blip(at, hz(m + 12), amp * 0.35, 0.22, 'sine', pan); };
  const tick = (at, amp, pan) => {                              // the collision: a hard click with a woody top
    const s = ac.createBufferSource(); s.buffer = noise;
    const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 2200;
    const g = ac.createGain(); g.gain.setValueAtTime(amp, at); g.gain.exponentialRampToValueAtTime(0.0001, at + 0.03);
    const p = ac.createStereoPanner(); p.pan.value = pan;
    s.connect(hp).connect(g).connect(p).connect(master); s.start(at, (at * 7.3) % 0.8, 0.05);
    blip(at, 3150, amp * 0.5, 0.045, 'square', pan); blip(at, 1180, amp * 0.6, 0.07, 'sine', pan);
  };
  const SCALE = [57, 60, 62, 64, 67, 69, 72, 74, 76, 79, 81, 84, 86, 88, 91, 93];   // one pitch per bucket
  blip(0, 55, 0.5, 1.2, 'sine', 0);
  for (const k of INS) {
    const ticks = k.i < 3 ? 8 : 4;                                  // the hash "computing"
    for (let j = 0; j < ticks; j++) blip((k.a + k.d * (0.16 + 0.28 * j / ticks)) / FPS, 2400 + 300 * j, 0.025, 0.02, 'sine', -0.3);
    const at = k.land / FPS;
    pluck(at, SCALE[k.b8], 0.16, -0.2 + k.b8 * 0.06);
    if (k.collide) tick(at, 0.34 + 0.12 * k.p8, 0.3);
  }
  // resize: a rising sweep, then a pluck as each key lands in its new bucket
  { const s = ac.createBufferSource(); s.buffer = noise; s.loop = true;
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 4;
    const a = T.resize / FPS, b = T.grow / FPS + 0.3;
    bp.frequency.setValueAtTime(300, a); bp.frequency.exponentialRampToValueAtTime(4200, b);
    const g = ac.createGain(); g.gain.setValueAtTime(0.0001, a); g.gain.exponentialRampToValueAtTime(0.18, b - 0.1); g.gain.exponentialRampToValueAtTime(0.0001, b + 0.2);
    s.connect(bp).connect(g).connect(master); s.start(a); s.stop(b + 0.3); }
  for (const k of INS) pluck((k.mv + 22) / FPS, SCALE[k.b16], k.b16 !== k.b8 ? 0.12 : 0.06, -0.4 + k.b16 * 0.05);
  // lookup: a step tick per compared node, a chime on the hit
  LT.forEach((t, j) => { const hit = LOOKCHAIN[j] === LOOK; if (hit) [76, 81, 88].forEach((m, q) => blip(t / FPS + q * 0.07, hz(m), 0.12, 1.2, 'sine', -0.3 + q * 0.3)); else tick(t / FPS, 0.2, -0.2); });
  [69, 72, 76, 81].forEach((m, i) => blip((T.end + 8 + i * 6) / FPS, hz(m), 0.09, 1.8, 'sine', -0.45 + i * 0.3));

  const buf = await ac.startRendering();
  let peak = 0; for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let k = 0; k < d.length; k++) peak = Math.max(peak, Math.abs(d[k])); }
  if (peak > 0.89) for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let k = 0; k < d.length; k++) d[k] *= 0.89 / peak; }
  return buf;
}

/* ==========================================================================
   VERTICAL CUT — shared block, identical in every piece.
   1080x1920 for Reels, Shorts and TikTok (__motion.variants.vertical). The
   piece's own scene code is re-used and recomposed for a phone: everything a
   viewer must read stays inside the area no platform covers (x 60..900,
   y 230..1400); outside it there is only dimmed texture.
   ========================================================================== */
const VW = 1080, VH = 1920, SAFE = { x: 60, y: 230, w: 840, h: 1170, r: 900, b: 1400 };
const vcv = document.createElement('canvas'); vcv.width = VW; vcv.height = VH;
const vx = vcv.getContext('2d', { willReadFrequently: true });   // CPU raster: identical pixels on every redraw
const VL = 96, VR = 864;                                          // text column inside the safe area

function vReset() {
  vx.setTransform(1, 0, 0, 1, 0, 0); vx.globalAlpha = 1; vx.globalCompositeOperation = 'source-over';
  vx.filter = 'none'; vx.shadowBlur = 0; vx.shadowColor = 'transparent'; vx.letterSpacing = '0px'; vx.setLineDash([]);
  vx.textAlign = 'left'; vx.textBaseline = 'alphabetic'; vx.lineCap = 'butt'; vx.lineJoin = 'miter';
}
/** Canvas text on the vertical frame; `max` shrinks the size until the line fits. */
function vText(str, x, y, { size = 40, weight = 700, color = '#FFFFFF', align = 'left', spacing = 0, alpha = 1, fam = FONT, max = 0 } = {}) {
  if (alpha <= 0.002 || !str) return size;
  vx.font = `${weight} ${size}px ${fam}`; vx.letterSpacing = spacing + 'px';
  if (max) { const w = vx.measureText(str).width; if (w > max) { size = size * max / w; vx.font = `${weight} ${size}px ${fam}`; } }
  vx.textAlign = align; vx.textBaseline = 'alphabetic';
  const a0 = vx.globalAlpha; vx.globalAlpha = a0 * alpha; vx.fillStyle = color;
  vx.fillText(str, x + (align === 'center' ? spacing / 2 : align === 'right' ? spacing : 0), y);   // tracking is added after the last glyph too
  vx.globalAlpha = a0; vx.letterSpacing = '0px';
  return size;
}
/** Word-wraps with the given font; returns the lines. */
function vWrap(str, maxW, size, weight = 700, fam = FONT) {
  vx.font = `${weight} ${size}px ${fam}`; vx.letterSpacing = '0px';
  const words = str.split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (vx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur);
  return lines;
}
/** Fade envelope with a small rise: [alpha, dy]. */
function vEnv(v, a, b, fin = 8, fout = 8) {
  const i = E.outCubic(prog(v, a, a + fin)), o = 1 - E.inCubic(prog(v, b - fout, b));
  return [Math.min(i, o), (1 - i) * 22 - (1 - o) * 10];
}
/** Which segment of a cut list a vertical frame is in: segs = [{ at, src, len }] in frames. */
function vSeg(segs, v) {
  let k = 0; while (k < segs.length - 1 && v >= segs[k + 1].at) k++;
  const s = segs[k];
  return { k, s, local: v - s.at, src: s.src + (v - s.at) };
}
/** Dims everything outside the safe area to a quiet texture (brightness x 0.2), with a soft inner edge. */
function vShade(rgb, a = 0.8, feather = 40) {
  vx.save(); vx.setTransform(1, 0, 0, 1, 0, 0); vx.globalAlpha = 1; vx.globalCompositeOperation = 'source-over';
  vx.fillStyle = `rgba(${rgb},${a})`;
  vx.beginPath(); vx.rect(0, 0, VW, VH); vx.rect(SAFE.x, SAFE.y, SAFE.w, SAFE.h); vx.fill('evenodd');
  const strip = (x0, y0, x1, y1, rx, ry, rw, rh) => {
    const g = vx.createLinearGradient(x0, y0, x1, y1);
    g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`);
    vx.fillStyle = g; vx.fillRect(rx, ry, rw, rh);
  };
  strip(SAFE.x, 0, SAFE.x + feather, 0, SAFE.x, SAFE.y, feather, SAFE.h);
  strip(SAFE.r, 0, SAFE.r - feather, 0, SAFE.r - feather, SAFE.y, feather, SAFE.h);
  strip(0, SAFE.y, 0, SAFE.y + feather, SAFE.x, SAFE.y, SAFE.w, feather);
  strip(0, SAFE.b, 0, SAFE.b - feather, SAFE.x, SAFE.b - feather, SAFE.w, feather);
  vx.restore();
}
/** Series tag at the top of the safe area, e.g. MADE IN CODE · 04. */
function vTag(label, color, alpha = 1) {
  vText('MADE IN CODE', VL, 292, { size: 28, weight: 800, color, spacing: 5, alpha });
  vx.font = `800 28px ${FONT}`; vx.letterSpacing = '5px';
  const w = vx.measureText('MADE IN CODE').width; vx.letterSpacing = '0px';
  vText('·  ' + label, VL + w + 14, 292, { size: 28, weight: 600, color: 'rgba(255,255,255,0.72)', spacing: 3, alpha, max: VR - VL - w - 14 });
}
/** Big hook lines, left-aligned from y0; visible from frame 0, settles in a few frames. */
function vHook(v, lines, y0, { size = 84, lh = 1.08, color = '#FFFFFF', accent = null, weight = 800, spacing = -1.5, alpha = 1 } = {}) {
  const k = E.outExpo(prog(v, -6, 12));
  lines.forEach((ln, i) => {
    const kk = E.outExpo(prog(v, -12 + i * 2, 8 + i * 2));
    vText(ln, VL, y0 + i * size * lh + (1 - kk) * 30, { size, weight, spacing, color: accent && i === lines.length - 1 ? accent : color, alpha: alpha * Math.max(0.25, kk), max: VR - VL });
  });
  return k;
}
/** Closing card, the last 60 frames: piece title, "drawn in code · bytepatterns.com". l = frames into the card. */
function vEndCard(l, { title, line = '', ink = '#FFFFFF', dim = 'rgba(255,255,255,0.66)', accent = '#FFFFFF', scrim = '0,0,0', a = 0.84 }) {
  const k = E.outCubic(prog(l, 0, 12));
  vx.save(); vx.setTransform(1, 0, 0, 1, 0, 0);
  vx.fillStyle = `rgba(${scrim},${a * k})`; vx.fillRect(0, 0, VW, VH);
  vx.restore();
  const t1 = E.outExpo(prog(l, 3, 19)), t2 = E.outExpo(prog(l, 11, 27)), t3 = E.outExpo(prog(l, 19, 35));
  vx.fillStyle = accent; vx.globalAlpha = t1; vx.fillRect(VL, 742, 88 * t1, 7); vx.globalAlpha = 1;
  const size = vText(title, VL, 850 + (1 - t1) * 40, { size: 92, weight: 800, color: ink, spacing: -2, alpha: t1, max: VR - VL });
  const y2 = 850 + Math.max(size, 60) * 0.25 + 70;
  vx.font = `600 44px ${FONT}`;
  const lead = 'drawn in code  ·  ', lw = vx.measureText(lead).width;
  vText(lead, VL, y2 + (1 - t2) * 24, { size: 44, weight: 600, color: dim, alpha: t2 });
  vText('bytepatterns.com', VL + lw, y2 + (1 - t2) * 24, { size: 44, weight: 800, color: accent, alpha: t2 });
  if (line) vText(line, VL, y2 + 72 + (1 - t3) * 18, { size: 32, weight: 500, color: dim, alpha: t3, max: VR - VL });
}
/** Seeks a cut. The first frame a page draws is drawn twice: the very first read of a
 *  GPU-backed source canvas can come out a shade different from every later one. */
let vWarm = false;
function vSeek(draw, i, frames) {
  const f = Math.max(0, Math.min(frames - 1, Math.floor(i)));
  if (!vWarm) { vWarm = true; draw(f); }
  draw(f);
}
/** The soundtrack of a cut: the piece's own audio() spliced to the same segments as the picture. */
async function vAudio(segs, frames, { xf = 0.025, fadeOut = 0.6, extra = null } = {}) {
  const src = await renderAudio();
  const SR = 48000, dur = frames / FPS, ac = new OfflineAudioContext(2, Math.round(SR * dur), SR);
  const out = ac.createGain(); out.connect(ac.destination);
  out.gain.setValueAtTime(1, 0); out.gain.setValueAtTime(1, dur - fadeOut); out.gain.linearRampToValueAtTime(0, dur - 0.01);
  segs.forEach((s, k) => {
    const at = s.at / FPS, off = s.src / FPS, d = s.len / FPS;
    const pre = k === 0 ? 0 : Math.min(xf, off), post = k === segs.length - 1 ? 0 : xf;
    const b = ac.createBufferSource(), g = ac.createGain(); b.buffer = src;
    g.gain.setValueAtTime(pre ? 0 : 1, at - pre);
    if (pre) g.gain.linearRampToValueAtTime(1, at + pre);
    if (post) { g.gain.setValueAtTime(1, at + d - post); g.gain.linearRampToValueAtTime(0, at + d + post); }
    b.connect(g).connect(out); b.start(at - pre, off - pre, d + pre + post);
  });
  if (extra) extra(ac, out);
  const buf = await ac.startRendering();
  let peak = 0; for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) peak = Math.max(peak, Math.abs(d[i])); }
  if (peak > 0.9) for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] *= 0.9 / peak; }
  return buf;
}
/** A soft three-partial bell, for the closing card. */
function vChime(ac, dest, at, freq, vol = 0.08) {
  for (const [mul, v, dec] of [[1, 1, 1.8], [2.01, 0.35, 0.8], [3.02, 0.12, 0.4]]) {
    const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.value = freq * mul;
    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol * v, at + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, at + dec);
    o.connect(g).connect(dest); o.start(at); o.stop(at + dec + 0.05);
  }
}

/* VERTICAL CUT — this piece */
// The pipeline stacked on top, the table below it; the same state at the same
// source frames as the landscape piece.
const VSEG = [
  { at: 0, src: 0, len: 60 },                                // hook
  { at: 60, src: INS[1].a - 4, len: 140 },                   // keys two and three, the first collision
  { at: 200, src: INS[3].a + 12, len: 100 },                 // the rest, fast
  { at: 300, src: INS[11].a - 10, len: 180 },                // resize and lookup
  { at: 480, src: T.end, len: 60 },                          // closing card
];
const VFR = 540, VEND = VFR - 60;
function vDraw(v) {
  const { k: seg, src } = vSeg(VSEG, v), f = Math.min(FRAMES - 1, src);
  vReset();
  backdrop(vx, VW, VH);
  const ta = seg === 0 ? 0.3 + 0.7 * E.outCubic(prog(v, 30, 60)) : 1;
  drawTable(vx, LAY_V, f, ta);
  vShade(C.bgRGB, 0.82);
  vTag('HASH TABLE', C.amber);
  if (seg === 0) {
    const o = 1 - E.inCubic(prog(v, 50, 60));
    vHook(v, ['Where does', 'a key go?'], 440, { size: 104, color: C.paper, accent: C.amber, alpha: o });
    vText('A real hash, 8 buckets, 12 keys.', VL, 600, { size: 38, weight: 500, color: C.dim, alpha: o * E.outCubic(prog(v, 12, 26)), max: VR - VL });
  } else {
    drawPipe(vx, LAY_V, f, E.outCubic(prog(v, 60, 68)) * (1 - E.inCubic(prog(v, VEND - 6, VEND + 4))), true);
    const s = stats(f);
    vText(`load ${s.load.toFixed(2)}  ·  collisions ${s.col}`, VL, LAY_V.y.stats, { size: 30, weight: 700, fam: MONO, color: s.col ? C.coral : C.dim, alpha: 1 - prog(v, VEND - 6, VEND) });
  }
  if (v >= VEND) vEndCard(v - VEND, { title: 'Where Keys Go', line: `FNV-1a · separate chaining · ${COLLISIONS} collisions`,
    ink: C.paper, dim: 'rgba(241,236,227,0.72)', accent: C.amber, scrim: C.bgRGB, a: 0.84 });
  vReset();
}

window.__motion = {
  title: 'Where Keys Go',
  description: `Twelve keys run through a real FNV-1a hash into eight buckets; ${COLLISIONS} collisions grow chains, the table doubles to sixteen and every key rehashes by one more bit.`,
  fps: FPS, width: W, height: H, frames: FRAMES,
  poster: 500,
  gifStart: 9.5,
  seek(i) { draw(Math.max(0, Math.min(FRAMES - 1, Math.floor(i)))); },
  audio: renderAudio,
  variants: {
    vertical: {
      width: VW, height: VH, frames: VFR, canvas: vcv,
      poster: 300, gifStart: 7,
      seek(i) { vSeek(vDraw, i, VFR); },
      audio: () => vAudio(VSEG, VFR),
    },
  },
};

/* ==========================================================================
   PLAYER — identical in every piece; keep as is.
   Autoplays and loops, starts sound on the first click, ?frame=N pauses on a
   frame, ?variant=vertical plays the vertical cut (if the piece has one).
   When the renderer sets window.__MOTION_RENDER__ it stays out of the way.
   ========================================================================== */
(function player() {
  const btn = document.getElementById('sound'), q = new URLSearchParams(location.search);
  let M = window.__motion;
  const V = !window.__MOTION_RENDER__ && M.variants && M.variants[q.get('variant')];
  if (V) {                                                // show the variant's own canvas instead
    M = Object.assign({}, M, V);
    V.canvas.style.cssText = `width:min(100vw,calc(100vh*${V.width}/${V.height}));height:auto;aspect-ratio:${V.width}/${V.height}`;
    document.querySelector('canvas').replaceWith(V.canvas);
  }
  const dur = M.frames / M.fps;
  if (window.__MOTION_RENDER__) { btn.hidden = true; M.seek(0); return; }
  if (q.has('frame')) { btn.hidden = true; M.seek(+q.get('frame') || 0); return; }
  let t0 = performance.now(), ac = null, src = null, buf = null, paused = false, pausedAt = 0;
  const clock = () => ac && src ? (ac.currentTime - t0) : (performance.now() - t0) / 1000;
  function loop() {
    if (!paused) M.seek(Math.floor(((clock() % dur) + dur) % dur * M.fps));
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  btn.addEventListener('click', async () => {
    if (src) { src.stop(); src = null; btn.textContent = 'Click for sound'; t0 = performance.now(); return; }
    btn.textContent = 'Loading sound…';
    ac = ac || new AudioContext({ sampleRate: 48000 });
    buf = buf || await M.audio();
    await ac.resume();
    src = ac.createBufferSource(); src.buffer = buf; src.loop = true; src.connect(ac.destination);
    t0 = ac.currentTime + 0.05; src.start(t0);        // picture restarts from frame 0 in sync with the sound
    btn.textContent = 'Sound on — click to mute';
  });
  addEventListener('keydown', e => {
    if (e.code !== 'Space') return;
    e.preventDefault(); paused = !paused;
    if (ac) paused ? ac.suspend() : ac.resume();
    if (!ac) { if (paused) pausedAt = performance.now(); else t0 += performance.now() - pausedAt; }
  });
})();
</script>
