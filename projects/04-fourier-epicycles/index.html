<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fourier Epicycles — motion-lab</title>
<style>
  /* Player chrome. The piece itself lives entirely in the canvas. */
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; font: 500 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; }
  canvas { display: block; width: min(100vw, calc(100vh * 16 / 9)); height: auto; aspect-ratio: 16 / 9; }
  #sound { position: fixed; left: 16px; bottom: 16px; padding: 8px 14px; border: 1px solid rgba(255,255,255,.35); border-radius: 999px;
           background: rgba(0,0,0,.55); color: #fff; font: inherit; cursor: pointer; }
  #sound[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080" aria-label="Rotating circles add up to draw a square wave; the number of terms grows from 1 to 31"></canvas>
<button id="sound" type="button">Click for sound</button>
<script>
'use strict';
/* ==========================================================================
   PIECE — Fourier epicycles. A square wave is a sum of odd sines:
     f(t) = 4/pi * sum over odd k of sin(2*pi*k*t) / k
   Each term is a circle of radius 1/k spinning k times as fast. The terms
   fade in 1 -> 3 -> 7 -> 15 -> 31, and the soundtrack is the same sum,
   played as sine tones at 110 Hz * k.
   ========================================================================== */
const W = 1920, H = 1080, FPS = 30, FRAMES = 600;          // 20 s
const cv = document.getElementById('stage');
const ctx = cv.getContext('2d', { willReadFrequently: true });   // CPU raster: identical pixels on every redraw
const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
const MONO = 'ui-monospace, "Cascadia Code", Consolas, Menlo, monospace';

// ---- helpers -------------------------------------------------------------
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (f, a, b) => clamp((f - a) / (b - a));           // 0..1 progress of frame f through [a, b]
const E = {
  inCubic: t => t * t * t,
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inOutCubic: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outExpo: t => t === 1 ? 1 : 1 - Math.pow(2, -10 * t),
  inExpo: t => t === 0 ? 0 : Math.pow(2, 10 * t - 10),
  inOutExpo: t => t === 0 ? 0 : t === 1 ? 1 : t < .5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2,
  outBack: t => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2),
};

// ---- palette: blue circles, yellow pen, neutrals -------------------------
const C = { bg: '#0F1117', ink: '#ECEAE4', dim: '#80868F', faint: '#252A33', blue: '#58C4DD', yellow: '#FFD166' };
const rgba = (h, a) => `rgba(${parseInt(h.slice(1, 3), 16)},${parseInt(h.slice(3, 5), 16)},${parseInt(h.slice(5, 7), 16)},${a})`;

// ---- the series -----------------------------------------------------------
const MAXT = 31;                                   // terms: k = 1, 3, ..., 61
const STAGES = [ { n: 1, t: 0 }, { n: 3, t: 4.0 }, { n: 7, t: 7.0 }, { n: 15, t: 10.0 }, { n: 31, t: 13.0 } ];
const FINAL = 16.4;                                // seconds: the summary starts
const FADE = 0.6, STAGGER = 0.035;
const ON = [];                                     // second at which term m starts fading in
for (let m = 0; m < MAXT; m++) {
  const s = STAGES.findIndex(st => st.n > m), first = s ? STAGES[s - 1].n : 0;
  ON[m] = STAGES[s].t + (m - first) * STAGGER;
}
const weight = (m, t) => m === 0 ? (t >= 0 ? 1 : 0) : E.outCubic(clamp((t - ON[m]) / FADE));
const termsAt = t => { let n = 1; for (const st of STAGES) if (t >= st.t) n = st.n; return n; };

const A = 140;                                     // square-wave amplitude in px
const F0 = 0.5;                                    // drawing frequency, Hz
const CX = 600, CY = 560;                          // centre of the first circle
const X0 = 1150, X1 = 1820, PXS = 170;             // trace: start, end, px per second
const radius = m => A * 4 / (Math.PI * (2 * m + 1));
function value(t, wfn) {                           // y of the partial sum at time t (px, up = +)
  let y = 0;
  for (let m = 0; m < MAXT; m++) { const w = wfn(m, t); if (w <= 0) continue; const k = 2 * m + 1; y += radius(m) * w * Math.sin(2 * Math.PI * k * F0 * t); }
  return y;
}

// ---- text helpers ---------------------------------------------------------
function font(size, weight = 500, fam = FONT, style = '') { ctx.font = `${style} ${weight} ${size}px ${fam}`.trim(); }
function fitFont(txt, maxW, size, weight = 500) { let s = size; font(s, weight); while (ctx.measureText(txt).width > maxW && s > 28) font(--s, weight); return s; }
function reset() {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.shadowBlur = 0; ctx.filter = 'none'; ctx.letterSpacing = '0px'; ctx.setLineDash([]);
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.lineCap = 'butt'; ctx.lineJoin = 'miter';
}

// ---- formula: f(t) = 4/pi  SUM_k  sin(2 pi k t) / k ----------------------
function formula(f, t) {
  const a = E.outExpo(prog(f, 0, 20));
  ctx.save(); ctx.globalAlpha = a; ctx.translate(0, (1 - a) * -20);
  const y = 170; let x = 120;
  ctx.fillStyle = C.ink; ctx.textBaseline = 'alphabetic';
  font(60, 400, FONT, 'italic'); ctx.fillText('f', x, y + 20); x += ctx.measureText('f').width + 4;
  font(60, 400); ctx.fillText('(', x, y + 20); x += ctx.measureText('(').width;
  font(60, 400, FONT, 'italic'); ctx.fillText('t', x, y + 20); x += ctx.measureText('t').width;
  font(60, 400); ctx.fillText(') =', x, y + 20); x += ctx.measureText(') =').width + 26;
  const frac = (num, den, x, sz, numStyle = '') => {
    font(sz, 400, FONT, numStyle); const wn = ctx.measureText(num).width; font(sz, 400); const wd = ctx.measureText(den).width;
    const w = Math.max(wn, wd) + 16;
    ctx.fillRect(x, y - 2, w, 3);
    ctx.textAlign = 'center';
    font(sz, 400, FONT, numStyle); ctx.fillText(num, x + w / 2, y - 16);
    font(sz, 400); ctx.fillText(den, x + w / 2, y + sz * 0.95);
    ctx.textAlign = 'left';
    return w;
  };
  x += frac('4', 'π', x, 50) + 22;
  // sigma with a live upper index
  font(104, 300); ctx.fillText('Σ', x, y + 36);
  const sw = ctx.measureText('Σ').width;
  font(28, 500, MONO); ctx.fillStyle = C.dim; ctx.textAlign = 'center';
  const n = termsAt(t), kmax = 2 * n - 1;
  ctx.fillText('k odd', x + sw / 2, y + 78);
  ctx.fillStyle = C.yellow; ctx.fillText('≤ ' + kmax, x + sw / 2, y - 64);
  ctx.textAlign = 'left'; ctx.fillStyle = C.ink;
  x += sw + 22;
  frac('sin(2πkt)', 'k', x, 50);
  ctx.restore();
}

// ---- term counter (top right), rolls when it changes ---------------------
function counter(f, t) {
  const x = 1800, y = 238;
  ctx.save();
  ctx.globalAlpha = E.outExpo(prog(f, 4, 24));
  font(24, 600); ctx.letterSpacing = '5px'; ctx.fillStyle = C.dim; ctx.textAlign = 'right';
  ctx.fillText('TERMS', x, 96);
  ctx.letterSpacing = '-4px';
  ctx.beginPath(); ctx.rect(1300, 100, 560, 160); ctx.clip();
  let s = 0; for (let q = 1; q < STAGES.length; q++) if (t >= STAGES[q].t) s = q;
  const since = t - STAGES[s].t, u = s > 0 ? E.outExpo(clamp(since / 0.5)) : 1;
  font(150, 800); ctx.fillStyle = C.yellow;
  ctx.fillText(String(STAGES[s].n), x, y + (1 - u) * 150);
  if (s > 0 && u < 1) { ctx.globalAlpha *= 1 - u; ctx.fillStyle = C.dim; ctx.fillText(String(STAGES[s - 1].n), x, y - u * 150); }
  ctx.restore();
}

// ---- captions (bottom) ----------------------------------------------------
const CAPS = [
  { t: 2.2, txt: 'One term: a single circle traces a pure sine.' },
  { t: 4.0, txt: 'Add circles spinning 3× and 5× as fast, at 1/3 and 1/5 the size.' },
  { t: 7.0, txt: '7 terms: the corners start to form.' },
  { t: 10.0, txt: '15 terms: the tops go flat.' },
  { t: 13.0, txt: '31 terms: a sharp edge, and a ~9% overshoot that never goes away.' },
];
function captions(f, t) {
  ctx.save(); ctx.textAlign = 'center';
  // hook
  const hk = 1 - E.inCubic(prog(t, 1.7, 2.2));
  if (hk > 0) {
    const s = 1 + 0.06 * (1 - E.outExpo(prog(f, 0, 24)));
    ctx.globalAlpha = hk; ctx.fillStyle = C.ink;
    ctx.translate(W / 2, 960); ctx.scale(s, s);
    font(76, 800); ctx.letterSpacing = '-1px';
    ctx.fillText('Can circles draw a square?', 0, 0);
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.letterSpacing = '0px';
  }
  for (let q = 0; q < CAPS.length; q++) {
    const c = CAPS[q], end = q + 1 < CAPS.length ? CAPS[q + 1].t : FINAL;
    if (t < c.t - 0.01 || t > end + 0.5) continue;
    const i = E.outExpo(clamp((t - c.t) / 0.5)), o = E.inCubic(clamp((t - (end - 0.3)) / 0.3));
    ctx.globalAlpha = i * (1 - o); ctx.fillStyle = C.ink;
    fitFont(c.txt, 1680, 44, 500);
    ctx.fillText(c.txt, W / 2, 962 + (1 - i) * 26 - o * 16);
  }
  // final line
  const fi = E.outExpo(clamp((t - FINAL - 0.3) / 0.8));
  if (fi > 0) {
    ctx.globalAlpha = fi;
    font(92, 800); ctx.letterSpacing = '-2px'; ctx.textAlign = 'left';
    const a = 'More terms, ', b = 'sharper edge.';
    const wa = ctx.measureText(a).width, wb = ctx.measureText(b).width, xs = W / 2 - (wa + wb) / 2;
    ctx.fillStyle = C.ink; ctx.fillText(a, xs, 980 + (1 - fi) * 40);
    const fb = E.outExpo(clamp((t - FINAL - 0.6) / 0.8));
    ctx.globalAlpha = fb; ctx.fillStyle = C.yellow; ctx.fillText(b, xs + wa, 980 + (1 - fb) * 40);
  }
  ctx.restore();
}

// ---- the picture ----------------------------------------------------------
function guides(alpha) {
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.strokeStyle = C.faint; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(X0, CY); ctx.lineTo(X1, CY); ctx.stroke();
  ctx.setLineDash([6, 10]); ctx.strokeStyle = rgba(C.dim, 0.55);
  for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(X0, CY - s * A); ctx.lineTo(X1, CY - s * A); ctx.stroke(); }
  ctx.setLineDash([]);
  ctx.restore();
}
function idealSquare(alpha, t) {                 // the target, faint, scrolling with the trace
  ctx.save(); ctx.globalAlpha = alpha; ctx.strokeStyle = rgba(C.ink, 0.16); ctx.lineWidth = 2;
  ctx.beginPath();
  let started = false, prev = null;
  for (let x = X0; x <= X1; x += 1) {
    const tau = t - (x - X0) / PXS; if (tau < 0) break;
    const ph = ((tau * F0) % 1 + 1) % 1, y = CY - (ph < 0.5 ? A : -A);
    if (!started) { ctx.moveTo(x, y); started = true; } else if (prev !== y) { ctx.lineTo(x, prev); ctx.lineTo(x, y); } else ctx.lineTo(x, y);
    prev = y;
  }
  ctx.stroke(); ctx.restore();
}
function trace(t, alpha) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha;
  const g = ctx.createLinearGradient(X0, 0, X1, 0);
  g.addColorStop(0, rgba(C.yellow, 1)); g.addColorStop(0.7, rgba(C.yellow, 0.7)); g.addColorStop(1, rgba(C.yellow, 0.1));
  ctx.strokeStyle = g; ctx.lineWidth = 4; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.beginPath();
  let started = false;
  for (let x = X0; x <= X1; x += 0.5) {
    const tau = t - (x - X0) / PXS; if (tau < 0) break;
    const y = CY - value(tau, weight);
    if (!started) { ctx.moveTo(x, y); started = true; } else ctx.lineTo(x, y);
  }
  ctx.stroke(); ctx.restore();
}
function epicycles(f, t) {
  const draw0 = E.inOutCubic(prog(f, 0, 16));      // the first circle strokes itself on
  let px = CX, py = CY;
  ctx.save(); ctx.lineCap = 'round';
  for (let m = 0; m < MAXT; m++) {
    const w = weight(m, t); if (w <= 0) continue;
    const k = 2 * m + 1, r = radius(m) * w, th = 2 * Math.PI * k * F0 * t;
    if (r > 0.6 && (m > 0 || draw0 > 0.01)) {
      ctx.strokeStyle = rgba(C.blue, (m === 0 ? 0.75 : 0.55) * Math.min(1, w * 1.4));
      ctx.lineWidth = m < 3 ? 2.5 : 1.5;
      ctx.beginPath();
      if (m === 0) ctx.arc(px, py, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.max(0.001, draw0));
      else ctx.arc(px, py, r, 0, Math.PI * 2);
      ctx.stroke();
    }
    const nx = px + r * Math.cos(th), ny = py - r * Math.sin(th);
    ctx.strokeStyle = rgba(C.ink, 0.85); ctx.lineWidth = m < 3 ? 3 : 2;
    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(nx, ny); ctx.stroke();
    px = nx; py = ny;
  }
  ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(CX, CY, 6, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  return [px, py];
}
function pen(tip, t, alpha) {
  const [tx, ty] = tip;
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.strokeStyle = rgba(C.yellow, 0.5); ctx.lineWidth = 2; ctx.setLineDash([4, 8]);
  ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(X0, ty); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = C.yellow;
  ctx.shadowColor = rgba(C.yellow, 0.8); ctx.shadowBlur = 24;
  ctx.beginPath(); ctx.arc(tx, ty, 9, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(X0, ty, 7, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
// final: every partial sum over one window, stacked — the edge sharpens in place
function summary(t) {
  const a = clamp((t - FINAL - 0.2) / 0.9);
  if (a <= 0) return;
  const tw = (X1 - X0) / PXS;                    // seconds shown across the trace box
  const t0 = -0.25 / F0;
  const shades = [0.22, 0.34, 0.48, 0.66];
  STAGES.forEach((st, q) => {
    const u = E.outExpo(clamp((t - FINAL - 0.2 - q * 0.22) / 0.8));
    if (u <= 0) return;
    const wfn = (m) => m < st.n ? 1 : 0;
    ctx.save();
    ctx.globalAlpha = u;
    ctx.strokeStyle = q === STAGES.length - 1 ? C.yellow : rgba(C.blue, shades[q]);
    ctx.lineWidth = q === STAGES.length - 1 ? 4 : 2.5; ctx.lineJoin = 'round';
    ctx.beginPath();
    for (let x = X0; x <= X1; x += 0.5) {
      const tau = t0 + (x - X0) / (X1 - X0) * tw;
      const y = CY - value(tau, wfn) * u;
      x === X0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();
    // label at the first flat top
    const lx = X0 + (X1 - X0) * ((0.25 / F0 - t0) / tw);
    ctx.restore();
    void lx;
  });
  // legend
  ctx.save(); ctx.globalAlpha = E.outExpo(clamp((t - FINAL - 1.2) / 0.8));
  font(28, 500, MONO); ctx.textAlign = 'left';
  let lx = X0; const ly = CY + A + 110;
  STAGES.forEach((st, q) => {
    ctx.fillStyle = q === STAGES.length - 1 ? C.yellow : rgba(C.blue, shades[q] + 0.25);
    ctx.fillRect(lx, ly - 10, 26, 4);
    ctx.fillText(String(st.n), lx + 34, ly);
    lx += 34 + ctx.measureText(String(st.n)).width + 38;
  });
  ctx.fillStyle = C.dim; ctx.fillText('terms', lx - 6, ly);
  ctx.restore();
}

function draw(f) {
  reset();
  const t = f / FPS;
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  const live = 1 - E.inCubic(clamp((t - FINAL) / 0.5));          // scrolling trace hands over to the summary
  guides(E.outExpo(prog(f, 2, 26)));
  idealSquare(live, t);
  trace(t, live);
  summary(t);
  const tip = epicycles(f, t);
  pen(tip, t, live);
  formula(f, t);
  counter(f, t);
  captions(f, t);
  reset();
}

// ---- sound: the same sum, heard — sine partials at 110 Hz * k, level 1/k ----
function makeIR(ac, seconds, decay, seed) {
  const r = mulberry32(seed), len = Math.floor(seconds * ac.sampleRate), b = ac.createBuffer(2, len, ac.sampleRate);
  for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (r() * 2 - 1) * Math.pow(1 - i / len, decay); }
  return b;
}
async function renderAudio() {
  const SR = 48000, dur = FRAMES / FPS, BASE = 110;
  const ac = new OfflineAudioContext(2, Math.round(SR * dur), SR);
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -12; comp.knee.value = 8; comp.ratio.value = 3; comp.attack.value = 0.005; comp.release.value = 0.2;
  const master = ac.createGain();
  master.gain.setValueAtTime(0, 0); master.gain.linearRampToValueAtTime(1, 0.05);
  master.gain.setValueAtTime(1, dur - 0.5); master.gain.linearRampToValueAtTime(0, dur - 0.01);
  comp.connect(master).connect(ac.destination);
  const verb = ac.createConvolver(); verb.buffer = makeIR(ac, 2.2, 3, 7);
  const wet = ac.createGain(); wet.gain.value = 0.22; verb.connect(wet).connect(comp);
  const bus = ac.createGain(); bus.gain.value = 1; bus.connect(comp); bus.connect(verb);

  // partials: gain follows the same weight() that sizes each circle
  const RATE = 100, N = Math.round(dur * RATE) + 1, G = 0.26;
  for (let m = 0; m < MAXT; m++) {
    const k = 2 * m + 1, o = ac.createOscillator(), g = ac.createGain(), p = ac.createStereoPanner();
    o.type = 'sine'; o.frequency.value = BASE * k;
    p.pan.value = m === 0 ? 0 : (m % 2 ? -1 : 1) * Math.min(0.7, 0.1 + m * 0.03);
    const curve = new Float32Array(N);
    for (let i = 0; i < N; i++) {
      const t = i / RATE;
      const settle = t > FINAL ? 1 - 0.35 * E.inOutCubic(clamp((t - FINAL) / 2)) : 1;   // the tone relaxes under the final line
      curve[i] = G * weight(m, t) / k * settle;
    }
    g.gain.setValueAtTime(0, 0);
    g.gain.setValueCurveAtTime(curve, 0, dur);
    o.connect(g).connect(p).connect(bus); o.start(0); o.stop(dur);
  }
  // a soft bell each time terms are added (pitched to the new highest partial, folded down)
  const bell = (at, freq, vol) => {
    for (const [mul, v] of [[1, 1], [2.01, 0.35], [3.02, 0.12]]) {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'sine'; o.frequency.value = freq * mul;
      g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(vol * v, at + 0.006); g.gain.exponentialRampToValueAtTime(0.0003, at + 1.6);
      o.connect(g).connect(bus); o.start(at); o.stop(at + 1.7);
    }
  };
  STAGES.forEach((st, q) => { if (q) { let fr = BASE * (2 * st.n - 1); while (fr > 1400) fr /= 2; bell(st.t, fr, 0.06); } });
  bell(FINAL + 0.3, 440, 0.07); bell(FINAL + 0.6, 660, 0.05);
  return ac.startRendering();
}

window.__motion = {
  title: 'Fourier Epicycles',
  description: 'Spinning circles add up to a square wave as the series grows from 1 to 31 terms, and you hear the same sum.',
  fps: FPS, width: W, height: H, frames: FRAMES,
  poster: 450,
  gifStart: 11,
  seek(i) { draw(Math.max(0, Math.min(FRAMES - 1, Math.floor(i)))); },
  audio: renderAudio,
};

/* ==========================================================================
   PLAYER — identical in every piece; keep as is.
   Autoplays and loops, starts sound on the first click, ?frame=N pauses on a
   frame. When the renderer sets window.__MOTION_RENDER__ it stays out of the way.
   ========================================================================== */
(function player() {
  const M = window.__motion, btn = document.getElementById('sound');
  const dur = M.frames / M.fps;
  if (window.__MOTION_RENDER__) { btn.hidden = true; M.seek(0); return; }
  const q = new URLSearchParams(location.search);
  if (q.has('frame')) { btn.hidden = true; M.seek(+q.get('frame') || 0); return; }
  let t0 = performance.now(), ac = null, src = null, buf = null, paused = false, pausedAt = 0;
  const clock = () => ac && src ? (ac.currentTime - t0) : (performance.now() - t0) / 1000;
  function loop() {
    if (!paused) M.seek(Math.floor(((clock() % dur) + dur) % dur * M.fps));
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  btn.addEventListener('click', async () => {
    if (src) { src.stop(); src = null; btn.textContent = 'Click for sound'; t0 = performance.now(); return; }
    btn.textContent = 'Loading sound…';
    ac = ac || new AudioContext({ sampleRate: 48000 });
    buf = buf || await M.audio();
    await ac.resume();
    src = ac.createBufferSource(); src.buffer = buf; src.loop = true; src.connect(ac.destination);
    t0 = ac.currentTime + 0.05; src.start(t0);        // picture restarts from frame 0 in sync with the sound
    btn.textContent = 'Sound on — click to mute';
  });
  addEventListener('keydown', e => {
    if (e.code !== 'Space') return;
    e.preventDefault(); paused = !paused;
    if (ac) paused ? ac.suspend() : ac.resume();
    if (!ac) { if (paused) pausedAt = performance.now(); else t0 += performance.now() - pausedAt; }
  });
})();
</script>
</body>
</html>
