<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fourier Epicycles — motion-lab</title>
<style>
  /* Player chrome. The piece itself lives entirely in the canvas. */
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; font: 500 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; }
  canvas { display: block; width: min(100vw, calc(100vh * 16 / 9)); height: auto; aspect-ratio: 16 / 9; }
  #sound { position: fixed; left: 16px; bottom: 16px; padding: 8px 14px; border: 1px solid rgba(255,255,255,.35); border-radius: 999px;
           background: rgba(0,0,0,.55); color: #fff; font: inherit; cursor: pointer; }
  #sound[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080" aria-label="Rotating circles add up to draw a square wave; the number of terms grows from 1 to 31"></canvas>
<button id="sound" type="button">Click for sound</button>
<script>
'use strict';
/* ==========================================================================
   PIECE — Fourier epicycles. A square wave is a sum of odd sines:
     f(t) = 4/pi * sum over odd k of sin(2*pi*k*t) / k
   Each term is a circle of radius 1/k spinning k times as fast. The terms
   fade in 1 -> 3 -> 7 -> 15 -> 31, and the soundtrack is the same sum,
   played as sine tones at 110 Hz * k.
   ========================================================================== */
const W = 1920, H = 1080, FPS = 30, FRAMES = 600;          // 20 s
const cv = document.getElementById('stage');
let ctx = cv.getContext('2d', { willReadFrequently: true });     // CPU raster; the vertical cut points it at its own canvas
const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
const MONO = 'ui-monospace, "Cascadia Code", Consolas, Menlo, monospace';

// ---- helpers -------------------------------------------------------------
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (f, a, b) => clamp((f - a) / (b - a));           // 0..1 progress of frame f through [a, b]
const E = {
  inCubic: t => t * t * t,
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inOutCubic: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outExpo: t => t === 1 ? 1 : 1 - Math.pow(2, -10 * t),
  inExpo: t => t === 0 ? 0 : Math.pow(2, 10 * t - 10),
  inOutExpo: t => t === 0 ? 0 : t === 1 ? 1 : t < .5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2,
  outBack: t => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2),
};

// ---- palette: blue circles, yellow pen, neutrals -------------------------
const C = { bg: '#0F1117', ink: '#ECEAE4', dim: '#80868F', faint: '#252A33', blue: '#58C4DD', yellow: '#FFD166' };
const rgba = (h, a) => `rgba(${parseInt(h.slice(1, 3), 16)},${parseInt(h.slice(3, 5), 16)},${parseInt(h.slice(5, 7), 16)},${a})`;

// ---- the series -----------------------------------------------------------
const MAXT = 31;                                   // terms: k = 1, 3, ..., 61
const STAGES = [ { n: 1, t: 0 }, { n: 3, t: 4.0 }, { n: 7, t: 7.0 }, { n: 15, t: 10.0 }, { n: 31, t: 13.0 } ];
const FINAL = 16.4;                                // seconds: the summary starts
const FADE = 0.6, STAGGER = 0.035;
const ON = [];                                     // second at which term m starts fading in
for (let m = 0; m < MAXT; m++) {
  const s = STAGES.findIndex(st => st.n > m), first = s ? STAGES[s - 1].n : 0;
  ON[m] = STAGES[s].t + (m - first) * STAGGER;
}
const weight = (m, t) => m === 0 ? (t >= 0 ? 1 : 0) : E.outCubic(clamp((t - ON[m]) / FADE));
const termsAt = t => { let n = 1; for (const st of STAGES) if (t >= st.t) n = st.n; return n; };

const A = 140;                                     // square-wave amplitude in px
const F0 = 0.5;                                    // drawing frequency, Hz
const CX = 600, CY = 560;                          // centre of the first circle
let X0 = 1150, X1 = 1820; const PXS = 170;         // trace: start, end, px per second
const radius = m => A * 4 / (Math.PI * (2 * m + 1));
function value(t, wfn) {                           // y of the partial sum at time t (px, up = +)
  let y = 0;
  for (let m = 0; m < MAXT; m++) { const w = wfn(m, t); if (w <= 0) continue; const k = 2 * m + 1; y += radius(m) * w * Math.sin(2 * Math.PI * k * F0 * t); }
  return y;
}

// ---- text helpers ---------------------------------------------------------
function font(size, weight = 500, fam = FONT, style = '') { ctx.font = `${style} ${weight} ${size}px ${fam}`.trim(); }
function fitFont(txt, maxW, size, weight = 500) { let s = size; font(s, weight); while (ctx.measureText(txt).width > maxW && s > 28) font(--s, weight); return s; }
function reset() {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.shadowBlur = 0; ctx.filter = 'none'; ctx.letterSpacing = '0px'; ctx.setLineDash([]);
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.lineCap = 'butt'; ctx.lineJoin = 'miter';
}

// ---- formula: f(t) = 4/pi  SUM_k  sin(2 pi k t) / k ----------------------
function formula(f, t) {
  const a = E.outExpo(prog(f, 0, 20));
  ctx.save(); ctx.globalAlpha = a; ctx.translate(0, (1 - a) * -20);
  const y = 170; let x = 120;
  ctx.fillStyle = C.ink; ctx.textBaseline = 'alphabetic';
  font(60, 400, FONT, 'italic'); ctx.fillText('f', x, y + 20); x += ctx.measureText('f').width + 4;
  font(60, 400); ctx.fillText('(', x, y + 20); x += ctx.measureText('(').width;
  font(60, 400, FONT, 'italic'); ctx.fillText('t', x, y + 20); x += ctx.measureText('t').width;
  font(60, 400); ctx.fillText(') =', x, y + 20); x += ctx.measureText(') =').width + 26;
  const frac = (num, den, x, sz, numStyle = '') => {
    font(sz, 400, FONT, numStyle); const wn = ctx.measureText(num).width; font(sz, 400); const wd = ctx.measureText(den).width;
    const w = Math.max(wn, wd) + 16;
    ctx.fillRect(x, y - 2, w, 3);
    ctx.textAlign = 'center';
    font(sz, 400, FONT, numStyle); ctx.fillText(num, x + w / 2, y - 16);
    font(sz, 400); ctx.fillText(den, x + w / 2, y + sz * 0.95);
    ctx.textAlign = 'left';
    return w;
  };
  x += frac('4', 'π', x, 50) + 22;
  // sigma with a live upper index
  font(104, 300); ctx.fillText('Σ', x, y + 36);
  const sw = ctx.measureText('Σ').width;
  font(28, 500, MONO); ctx.fillStyle = C.dim; ctx.textAlign = 'center';
  const n = termsAt(t), kmax = 2 * n - 1;
  ctx.fillText('k odd', x + sw / 2, y + 78);
  ctx.fillStyle = C.yellow; ctx.fillText('≤ ' + kmax, x + sw / 2, y - 64);
  ctx.textAlign = 'left'; ctx.fillStyle = C.ink;
  x += sw + 22;
  frac('sin(2πkt)', 'k', x, 50);
  ctx.restore();
}

// ---- term counter (top right), rolls when it changes ---------------------
function counter(f, t) {
  const x = 1800, y = 238;
  ctx.save();
  ctx.globalAlpha = E.outExpo(prog(f, 4, 24));
  font(24, 600); ctx.letterSpacing = '5px'; ctx.fillStyle = C.dim; ctx.textAlign = 'right';
  ctx.fillText('TERMS', x, 96);
  ctx.letterSpacing = '-4px';
  ctx.beginPath(); ctx.rect(1300, 100, 560, 160); ctx.clip();
  let s = 0; for (let q = 1; q < STAGES.length; q++) if (t >= STAGES[q].t) s = q;
  const since = t - STAGES[s].t, u = s > 0 ? E.outExpo(clamp(since / 0.5)) : 1;
  font(150, 800); ctx.fillStyle = C.yellow;
  ctx.fillText(String(STAGES[s].n), x, y + (1 - u) * 150);
  if (s > 0 && u < 1) { ctx.globalAlpha *= 1 - u; ctx.fillStyle = C.dim; ctx.fillText(String(STAGES[s - 1].n), x, y - u * 150); }
  ctx.restore();
}

// ---- captions (bottom) ----------------------------------------------------
const CAPS = [
  { t: 2.2, txt: 'One term: a single circle traces a pure sine.' },
  { t: 4.0, txt: 'Add circles spinning 3× and 5× as fast, at 1/3 and 1/5 the size.' },
  { t: 7.0, txt: '7 terms: the corners start to form.' },
  { t: 10.0, txt: '15 terms: the tops go flat.' },
  { t: 13.0, txt: '31 terms: a sharp edge, and a ~9% overshoot that never goes away.' },
];
function captions(f, t) {
  ctx.save(); ctx.textAlign = 'center';
  // hook
  const hk = 1 - E.inCubic(prog(t, 1.7, 2.2));
  if (hk > 0) {
    const s = 1 + 0.06 * (1 - E.outExpo(prog(f, 0, 24)));
    ctx.globalAlpha = hk; ctx.fillStyle = C.ink;
    ctx.translate(W / 2, 960); ctx.scale(s, s);
    font(76, 800); ctx.letterSpacing = '-1px';
    ctx.fillText('Can circles draw a square?', 0, 0);
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.letterSpacing = '0px';
  }
  for (let q = 0; q < CAPS.length; q++) {
    const c = CAPS[q], end = q + 1 < CAPS.length ? CAPS[q + 1].t : FINAL;
    if (t < c.t - 0.01 || t > end + 0.5) continue;
    const i = E.outExpo(clamp((t - c.t) / 0.5)), o = E.inCubic(clamp((t - (end - 0.3)) / 0.3));
    ctx.globalAlpha = i * (1 - o); ctx.fillStyle = C.ink;
    fitFont(c.txt, 1680, 44, 500);
    ctx.fillText(c.txt, W / 2, 962 + (1 - i) * 26 - o * 16);
  }
  // final line
  const fi = E.outExpo(clamp((t - FINAL - 0.3) / 0.8));
  if (fi > 0) {
    ctx.globalAlpha = fi;
    font(92, 800); ctx.letterSpacing = '-2px'; ctx.textAlign = 'left';
    const a = 'More terms, ', b = 'sharper edge.';
    const wa = ctx.measureText(a).width, wb = ctx.measureText(b).width, xs = W / 2 - (wa + wb) / 2;
    ctx.fillStyle = C.ink; ctx.fillText(a, xs, 980 + (1 - fi) * 40);
    const fb = E.outExpo(clamp((t - FINAL - 0.6) / 0.8));
    ctx.globalAlpha = fb; ctx.fillStyle = C.yellow; ctx.fillText(b, xs + wa, 980 + (1 - fb) * 40);
  }
  ctx.restore();
}

// ---- the picture ----------------------------------------------------------
function guides(alpha) {
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.strokeStyle = C.faint; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(X0, CY); ctx.lineTo(X1, CY); ctx.stroke();
  ctx.setLineDash([6, 10]); ctx.strokeStyle = rgba(C.dim, 0.55);
  for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(X0, CY - s * A); ctx.lineTo(X1, CY - s * A); ctx.stroke(); }
  ctx.setLineDash([]);
  ctx.restore();
}
function idealSquare(alpha, t) {                 // the target, faint, scrolling with the trace
  ctx.save(); ctx.globalAlpha = alpha; ctx.strokeStyle = rgba(C.ink, 0.16); ctx.lineWidth = 2;
  ctx.beginPath();
  let started = false, prev = null;
  for (let x = X0; x <= X1; x += 1) {
    const tau = t - (x - X0) / PXS; if (tau < 0) break;
    const ph = ((tau * F0) % 1 + 1) % 1, y = CY - (ph < 0.5 ? A : -A);
    if (!started) { ctx.moveTo(x, y); started = true; } else if (prev !== y) { ctx.lineTo(x, prev); ctx.lineTo(x, y); } else ctx.lineTo(x, y);
    prev = y;
  }
  ctx.stroke(); ctx.restore();
}
function trace(t, alpha) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha;
  const g = ctx.createLinearGradient(X0, 0, X1, 0);
  g.addColorStop(0, rgba(C.yellow, 1)); g.addColorStop(0.7, rgba(C.yellow, 0.7)); g.addColorStop(1, rgba(C.yellow, 0.1));
  ctx.strokeStyle = g; ctx.lineWidth = 4; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.beginPath();
  let started = false;
  for (let x = X0; x <= X1; x += 0.5) {
    const tau = t - (x - X0) / PXS; if (tau < 0) break;
    const y = CY - value(tau, weight);
    if (!started) { ctx.moveTo(x, y); started = true; } else ctx.lineTo(x, y);
  }
  ctx.stroke(); ctx.restore();
}
function epicycles(f, t) {
  const draw0 = E.inOutCubic(prog(f, 0, 16));      // the first circle strokes itself on
  let px = CX, py = CY;
  ctx.save(); ctx.lineCap = 'round';
  for (let m = 0; m < MAXT; m++) {
    const w = weight(m, t); if (w <= 0) continue;
    const k = 2 * m + 1, r = radius(m) * w, th = 2 * Math.PI * k * F0 * t;
    if (r > 0.6 && (m > 0 || draw0 > 0.01)) {
      ctx.strokeStyle = rgba(C.blue, (m === 0 ? 0.75 : 0.55) * Math.min(1, w * 1.4));
      ctx.lineWidth = m < 3 ? 2.5 : 1.5;
      ctx.beginPath();
      if (m === 0) ctx.arc(px, py, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.max(0.001, draw0));
      else ctx.arc(px, py, r, 0, Math.PI * 2);
      ctx.stroke();
    }
    const nx = px + r * Math.cos(th), ny = py - r * Math.sin(th);
    ctx.strokeStyle = rgba(C.ink, 0.85); ctx.lineWidth = m < 3 ? 3 : 2;
    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(nx, ny); ctx.stroke();
    px = nx; py = ny;
  }
  ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(CX, CY, 6, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  return [px, py];
}
function pen(tip, t, alpha) {
  const [tx, ty] = tip;
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.strokeStyle = rgba(C.yellow, 0.5); ctx.lineWidth = 2; ctx.setLineDash([4, 8]);
  ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(X0, ty); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = C.yellow;
  ctx.shadowColor = rgba(C.yellow, 0.8); ctx.shadowBlur = 24;
  ctx.beginPath(); ctx.arc(tx, ty, 9, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(X0, ty, 7, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
// final: every partial sum over one window, stacked — the edge sharpens in place
function summary(t, legend = true) {
  const a = clamp((t - FINAL - 0.2) / 0.9);
  if (a <= 0) return;
  const tw = (X1 - X0) / PXS;                    // seconds shown across the trace box
  const t0 = -0.25 / F0;
  const shades = [0.22, 0.34, 0.48, 0.66];
  STAGES.forEach((st, q) => {
    const u = E.outExpo(clamp((t - FINAL - 0.2 - q * 0.22) / 0.8));
    if (u <= 0) return;
    const wfn = (m) => m < st.n ? 1 : 0;
    ctx.save();
    ctx.globalAlpha = u;
    ctx.strokeStyle = q === STAGES.length - 1 ? C.yellow : rgba(C.blue, shades[q]);
    ctx.lineWidth = q === STAGES.length - 1 ? 4 : 2.5; ctx.lineJoin = 'round';
    ctx.beginPath();
    for (let x = X0; x <= X1; x += 0.5) {
      const tau = t0 + (x - X0) / (X1 - X0) * tw;
      const y = CY - value(tau, wfn) * u;
      x === X0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();
    // label at the first flat top
    const lx = X0 + (X1 - X0) * ((0.25 / F0 - t0) / tw);
    ctx.restore();
    void lx;
  });
  if (!legend) return;
  // legend
  ctx.save(); ctx.globalAlpha = E.outExpo(clamp((t - FINAL - 1.2) / 0.8));
  font(28, 500, MONO); ctx.textAlign = 'left';
  let lx = X0; const ly = CY + A + 110;
  STAGES.forEach((st, q) => {
    ctx.fillStyle = q === STAGES.length - 1 ? C.yellow : rgba(C.blue, shades[q] + 0.25);
    ctx.fillRect(lx, ly - 10, 26, 4);
    ctx.fillText(String(st.n), lx + 34, ly);
    lx += 34 + ctx.measureText(String(st.n)).width + 38;
  });
  ctx.fillStyle = C.dim; ctx.fillText('terms', lx - 6, ly);
  ctx.restore();
}

function draw(f) {
  reset();
  const t = f / FPS;
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  const live = 1 - E.inCubic(clamp((t - FINAL) / 0.5));          // scrolling trace hands over to the summary
  guides(E.outExpo(prog(f, 2, 26)));
  idealSquare(live, t);
  trace(t, live);
  summary(t);
  const tip = epicycles(f, t);
  pen(tip, t, live);
  formula(f, t);
  counter(f, t);
  captions(f, t);
  reset();
}

// ---- sound: the same sum, heard — sine partials at 110 Hz * k, level 1/k ----
function makeIR(ac, seconds, decay, seed) {
  const r = mulberry32(seed), len = Math.floor(seconds * ac.sampleRate), b = ac.createBuffer(2, len, ac.sampleRate);
  for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (r() * 2 - 1) * Math.pow(1 - i / len, decay); }
  return b;
}
async function renderAudio() {
  const SR = 48000, dur = FRAMES / FPS, BASE = 110;
  const ac = new OfflineAudioContext(2, Math.round(SR * dur), SR);
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -12; comp.knee.value = 8; comp.ratio.value = 3; comp.attack.value = 0.005; comp.release.value = 0.2;
  const master = ac.createGain();
  master.gain.setValueAtTime(0, 0); master.gain.linearRampToValueAtTime(1, 0.05);
  master.gain.setValueAtTime(1, dur - 0.5); master.gain.linearRampToValueAtTime(0, dur - 0.01);
  comp.connect(master).connect(ac.destination);
  const verb = ac.createConvolver(); verb.buffer = makeIR(ac, 2.2, 3, 7);
  const wet = ac.createGain(); wet.gain.value = 0.22; verb.connect(wet).connect(comp);
  const bus = ac.createGain(); bus.gain.value = 1; bus.connect(comp); bus.connect(verb);

  // partials: gain follows the same weight() that sizes each circle
  const RATE = 100, N = Math.round(dur * RATE) + 1, G = 0.26;
  for (let m = 0; m < MAXT; m++) {
    const k = 2 * m + 1, o = ac.createOscillator(), g = ac.createGain(), p = ac.createStereoPanner();
    o.type = 'sine'; o.frequency.value = BASE * k;
    p.pan.value = m === 0 ? 0 : (m % 2 ? -1 : 1) * Math.min(0.7, 0.1 + m * 0.03);
    const curve = new Float32Array(N);
    for (let i = 0; i < N; i++) {
      const t = i / RATE;
      const settle = t > FINAL ? 1 - 0.35 * E.inOutCubic(clamp((t - FINAL) / 2)) : 1;   // the tone relaxes under the final line
      curve[i] = G * weight(m, t) / k * settle;
    }
    g.gain.setValueAtTime(0, 0);
    g.gain.setValueCurveAtTime(curve, 0, dur);
    o.connect(g).connect(p).connect(bus); o.start(0); o.stop(dur);
  }
  // a soft bell each time terms are added (pitched to the new highest partial, folded down)
  const bell = (at, freq, vol) => {
    for (const [mul, v] of [[1, 1], [2.01, 0.35], [3.02, 0.12]]) {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'sine'; o.frequency.value = freq * mul;
      g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(vol * v, at + 0.006); g.gain.exponentialRampToValueAtTime(0.0003, at + 1.6);
      o.connect(g).connect(bus); o.start(at); o.stop(at + 1.7);
    }
  };
  STAGES.forEach((st, q) => { if (q) { let fr = BASE * (2 * st.n - 1); while (fr > 1400) fr /= 2; bell(st.t, fr, 0.06); } });
  bell(FINAL + 0.3, 440, 0.07); bell(FINAL + 0.6, 660, 0.05);
  return ac.startRendering();
}

/* ==========================================================================
   VERTICAL CUT — shared block, identical in every piece.
   1080x1920 for Reels, Shorts and TikTok (__motion.variants.vertical). The
   piece's own scene code is re-used and recomposed for a phone: everything a
   viewer must read stays inside the area no platform covers (x 60..900,
   y 230..1400); outside it there is only dimmed texture.
   ========================================================================== */
const VW = 1080, VH = 1920, SAFE = { x: 60, y: 230, w: 840, h: 1170, r: 900, b: 1400 };
const vcv = document.createElement('canvas'); vcv.width = VW; vcv.height = VH;
const vx = vcv.getContext('2d', { willReadFrequently: true });   // CPU raster: identical pixels on every redraw
const VL = 96, VR = 864;                                          // text column inside the safe area

function vReset() {
  vx.setTransform(1, 0, 0, 1, 0, 0); vx.globalAlpha = 1; vx.globalCompositeOperation = 'source-over';
  vx.filter = 'none'; vx.shadowBlur = 0; vx.shadowColor = 'transparent'; vx.letterSpacing = '0px'; vx.setLineDash([]);
  vx.textAlign = 'left'; vx.textBaseline = 'alphabetic'; vx.lineCap = 'butt'; vx.lineJoin = 'miter';
}
/** Canvas text on the vertical frame; `max` shrinks the size until the line fits. */
function vText(str, x, y, { size = 40, weight = 700, color = '#FFFFFF', align = 'left', spacing = 0, alpha = 1, fam = FONT, max = 0 } = {}) {
  if (alpha <= 0.002 || !str) return size;
  vx.font = `${weight} ${size}px ${fam}`; vx.letterSpacing = spacing + 'px';
  if (max) { const w = vx.measureText(str).width; if (w > max) { size = size * max / w; vx.font = `${weight} ${size}px ${fam}`; } }
  vx.textAlign = align; vx.textBaseline = 'alphabetic';
  const a0 = vx.globalAlpha; vx.globalAlpha = a0 * alpha; vx.fillStyle = color;
  vx.fillText(str, x + (align === 'center' ? spacing / 2 : align === 'right' ? spacing : 0), y);   // tracking is added after the last glyph too
  vx.globalAlpha = a0; vx.letterSpacing = '0px';
  return size;
}
/** Word-wraps with the given font; returns the lines. */
function vWrap(str, maxW, size, weight = 700, fam = FONT) {
  vx.font = `${weight} ${size}px ${fam}`; vx.letterSpacing = '0px';
  const words = str.split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (vx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur);
  return lines;
}
/** Fade envelope with a small rise: [alpha, dy]. */
function vEnv(v, a, b, fin = 8, fout = 8) {
  const i = E.outCubic(prog(v, a, a + fin)), o = 1 - E.inCubic(prog(v, b - fout, b));
  return [Math.min(i, o), (1 - i) * 22 - (1 - o) * 10];
}
/** Which segment of a cut list a vertical frame is in: segs = [{ at, src, len }] in frames. */
function vSeg(segs, v) {
  let k = 0; while (k < segs.length - 1 && v >= segs[k + 1].at) k++;
  const s = segs[k];
  return { k, s, local: v - s.at, src: s.src + (v - s.at) };
}
/** Dims everything outside the safe area to a quiet texture (brightness x 0.2), with a soft inner edge. */
function vShade(rgb, a = 0.8, feather = 40) {
  vx.save(); vx.setTransform(1, 0, 0, 1, 0, 0); vx.globalAlpha = 1; vx.globalCompositeOperation = 'source-over';
  vx.fillStyle = `rgba(${rgb},${a})`;
  vx.beginPath(); vx.rect(0, 0, VW, VH); vx.rect(SAFE.x, SAFE.y, SAFE.w, SAFE.h); vx.fill('evenodd');
  const strip = (x0, y0, x1, y1, rx, ry, rw, rh) => {
    const g = vx.createLinearGradient(x0, y0, x1, y1);
    g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`);
    vx.fillStyle = g; vx.fillRect(rx, ry, rw, rh);
  };
  strip(SAFE.x, 0, SAFE.x + feather, 0, SAFE.x, SAFE.y, feather, SAFE.h);
  strip(SAFE.r, 0, SAFE.r - feather, 0, SAFE.r - feather, SAFE.y, feather, SAFE.h);
  strip(0, SAFE.y, 0, SAFE.y + feather, SAFE.x, SAFE.y, SAFE.w, feather);
  strip(0, SAFE.b, 0, SAFE.b - feather, SAFE.x, SAFE.b - feather, SAFE.w, feather);
  vx.restore();
}
/** Series tag at the top of the safe area, e.g. MADE IN CODE · 04. */
function vTag(label, color, alpha = 1) {
  vText('MADE IN CODE', VL, 292, { size: 28, weight: 800, color, spacing: 5, alpha });
  vx.font = `800 28px ${FONT}`; vx.letterSpacing = '5px';
  const w = vx.measureText('MADE IN CODE').width; vx.letterSpacing = '0px';
  vText('·  ' + label, VL + w + 14, 292, { size: 28, weight: 600, color: 'rgba(255,255,255,0.72)', spacing: 3, alpha, max: VR - VL - w - 14 });
}
/** Big hook lines, left-aligned from y0; visible from frame 0, settles in a few frames. */
function vHook(v, lines, y0, { size = 84, lh = 1.08, color = '#FFFFFF', accent = null, weight = 800, spacing = -1.5, alpha = 1 } = {}) {
  const k = E.outExpo(prog(v, -6, 12));
  lines.forEach((ln, i) => {
    const kk = E.outExpo(prog(v, -12 + i * 2, 8 + i * 2));
    vText(ln, VL, y0 + i * size * lh + (1 - kk) * 30, { size, weight, spacing, color: accent && i === lines.length - 1 ? accent : color, alpha: alpha * Math.max(0.25, kk), max: VR - VL });
  });
  return k;
}
/** Closing card, the last 60 frames: piece title, "drawn in code · bytepatterns.com". l = frames into the card. */
function vEndCard(l, { title, line = '', ink = '#FFFFFF', dim = 'rgba(255,255,255,0.66)', accent = '#FFFFFF', scrim = '0,0,0', a = 0.84 }) {
  const k = E.outCubic(prog(l, 0, 12));
  vx.save(); vx.setTransform(1, 0, 0, 1, 0, 0);
  vx.fillStyle = `rgba(${scrim},${a * k})`; vx.fillRect(0, 0, VW, VH);
  vx.restore();
  const t1 = E.outExpo(prog(l, 3, 19)), t2 = E.outExpo(prog(l, 11, 27)), t3 = E.outExpo(prog(l, 19, 35));
  vx.fillStyle = accent; vx.globalAlpha = t1; vx.fillRect(VL, 742, 88 * t1, 7); vx.globalAlpha = 1;
  const size = vText(title, VL, 850 + (1 - t1) * 40, { size: 92, weight: 800, color: ink, spacing: -2, alpha: t1, max: VR - VL });
  const y2 = 850 + Math.max(size, 60) * 0.25 + 70;
  vx.font = `600 44px ${FONT}`;
  const lead = 'drawn in code  ·  ', lw = vx.measureText(lead).width;
  vText(lead, VL, y2 + (1 - t2) * 24, { size: 44, weight: 600, color: dim, alpha: t2 });
  vText('bytepatterns.com', VL + lw, y2 + (1 - t2) * 24, { size: 44, weight: 800, color: accent, alpha: t2 });
  if (line) vText(line, VL, y2 + 72 + (1 - t3) * 18, { size: 32, weight: 500, color: dim, alpha: t3, max: VR - VL });
}
/** Seeks a cut. The first frame a page draws is drawn twice: the very first read of a
 *  GPU-backed source canvas can come out a shade different from every later one. */
let vWarm = false;
function vSeek(draw, i, frames) {
  const f = Math.max(0, Math.min(frames - 1, Math.floor(i)));
  if (!vWarm) { vWarm = true; draw(f); }
  draw(f);
}
/** The soundtrack of a cut: the piece's own audio() spliced to the same segments as the picture. */
async function vAudio(segs, frames, { xf = 0.025, fadeOut = 0.6, extra = null } = {}) {
  const src = await renderAudio();
  const SR = 48000, dur = frames / FPS, ac = new OfflineAudioContext(2, Math.round(SR * dur), SR);
  const out = ac.createGain(); out.connect(ac.destination);
  out.gain.setValueAtTime(1, 0); out.gain.setValueAtTime(1, dur - fadeOut); out.gain.linearRampToValueAtTime(0, dur - 0.01);
  segs.forEach((s, k) => {
    const at = s.at / FPS, off = s.src / FPS, d = s.len / FPS;
    const pre = k === 0 ? 0 : Math.min(xf, off), post = k === segs.length - 1 ? 0 : xf;
    const b = ac.createBufferSource(), g = ac.createGain(); b.buffer = src;
    g.gain.setValueAtTime(pre ? 0 : 1, at - pre);
    if (pre) g.gain.linearRampToValueAtTime(1, at + pre);
    if (post) { g.gain.setValueAtTime(1, at + d - post); g.gain.linearRampToValueAtTime(0, at + d + post); }
    b.connect(g).connect(out); b.start(at - pre, off - pre, d + pre + post);
  });
  if (extra) extra(ac, out);
  const buf = await ac.startRendering();
  let peak = 0; for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) peak = Math.max(peak, Math.abs(d[i])); }
  if (peak > 0.9) for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] *= 0.9 / peak; }
  return buf;
}
/** A soft three-partial bell, for the closing card. */
function vChime(ac, dest, at, freq, vol = 0.08) {
  for (const [mul, v, dec] of [[1, 1, 1.8], [2.01, 0.35, 0.8], [3.02, 0.12, 0.4]]) {
    const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.value = freq * mul;
    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol * v, at + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, at + dec);
    o.connect(g).connect(dest); o.start(at); o.stop(at + dec + 0.05);
  }
}

/* VERTICAL CUT — this piece */
// The graph turns 90°: the circles sit on top and the trace runs down the phone.
// Cut: one term -> 3 and 7 terms -> 31 terms and the summary -> closing card.
const VSEG = [{ at: 0, src: 0, len: 75 }, { at: 75, src: 120, len: 180 }, { at: 255, src: 390, len: 198 }];
const VFR = 453, VEND = VFR - 60;
const VG = { ox: 400, oy: 700, s: 0.9, gap: 440 };      // first circle on the phone, scale, circle-to-trace distance (unscaled px)
const VCAPS = [
  [44, 75, 'One circle traces a pure sine.'],
  [75, 165, 'Add circles spinning 3× and 5× as fast, at 1/3 and 1/5 the size.'],
  [165, 255, '7 terms: corners start to form.'],
  [255, 364, '31 terms: a sharp edge, and a ~9% overshoot that never goes away.'],
];
function vCounter(t) {
  let s = 0; for (let q = 1; q < STAGES.length; q++) if (t >= STAGES[q].t) s = q;
  const u = s > 0 ? E.outExpo(clamp((t - STAGES[s].t) / 0.5)) : 1, y = 790;
  vText('TERMS', VR, 628, { size: 28, weight: 700, color: C.dim, align: 'right', spacing: 5 });
  vx.save(); vx.beginPath(); vx.rect(560, 640, 340, 170); vx.clip();
  vText(String(STAGES[s].n), VR, y + (1 - u) * 160, { size: 160, weight: 800, color: C.yellow, align: 'right', spacing: -4 });
  if (s > 0 && u < 1) vText(String(STAGES[s - 1].n), VR, y - u * 160, { size: 160, weight: 800, color: C.dim, align: 'right', spacing: -4, alpha: 1 - u });
  vx.restore();
}
function vDraw(v) {
  const { src } = vSeg(VSEG, v), f = Math.min(FRAMES - 1, src), t = f / FPS;
  vReset();
  vx.fillStyle = C.bg; vx.fillRect(0, 0, VW, VH);
  // the landscape graph code, drawn through a quarter-turn: landscape "up" is phone "right"
  const main = ctx, keep = [X0, X1];
  X0 = CX + VG.gap; X1 = X0 + 760; ctx = vx;
  try {
    vx.save();
    vx.beginPath(); vx.rect(SAFE.x, 330, SAFE.w, SAFE.b - 340); vx.clip();
    const s = VG.s;
    vx.setTransform(0, s, -s, 0, VG.ox + s * CY, VG.oy - s * CX);
    const live = 1 - E.inCubic(clamp((t - FINAL) / 0.5));
    guides(E.outExpo(prog(f, 2, 26)));
    idealSquare(live, t);
    trace(t, live);
    summary(t, false);
    pen(epicycles(f, t), t, live);
    vx.restore();
  } finally { ctx = main; [X0, X1] = keep; }
  vReset();
  vShade('15,17,23');
  vTag('FOURIER SERIES', C.yellow);
  // top band: the hook, then one caption per stage, then the last line
  if (v < 48) vHook(v, ['Can circles', 'draw a square?'], 392, { size: 88, color: C.ink, accent: C.yellow, alpha: 1 - E.inCubic(prog(v, 40, 48)) });
  for (const [a, b, str] of VCAPS) {
    const [al, dy] = vEnv(v, a, b);
    if (al <= 0) continue;
    vWrap(str, VR - VL, 52, 700).forEach((ln, i) => vText(ln, VL, 380 + i * 64 + dy, { size: 52, weight: 700, color: C.ink, alpha: al }));
  }
  const fl = E.outExpo(prog(v, 364, 380));
  if (fl > 0) {
    vText('More terms,', VL, 392 + (1 - fl) * 30, { size: 88, weight: 800, color: C.ink, spacing: -1.5, alpha: fl });
    const f2 = E.outExpo(prog(v, 370, 386));
    vText('sharper edge.', VL, 487 + (1 - f2) * 30, { size: 88, weight: 800, color: C.yellow, spacing: -1.5, alpha: f2 });
  }
  if (v >= 44) vCounter(t);
  if (v >= VEND) vEndCard(v - VEND, { title: 'Fourier Epicycles', line: 'spinning circles, added up, draw a square wave',
    ink: C.ink, dim: rgba(C.ink, 0.66), accent: C.yellow, scrim: '15,17,23' });
  vReset();
}

window.__motion = {
  title: 'Fourier Epicycles',
  description: 'Spinning circles add up to a square wave as the series grows from 1 to 31 terms, and you hear the same sum.',
  fps: FPS, width: W, height: H, frames: FRAMES,
  poster: 450,
  gifStart: 11,
  seek(i) { draw(Math.max(0, Math.min(FRAMES - 1, Math.floor(i)))); },
  audio: renderAudio,
  variants: {
    vertical: {
      width: VW, height: VH, frames: VFR, canvas: vcv,
      poster: 300, gifStart: 7,
      seek(i) { vSeek(vDraw, i, VFR); },
      audio: () => vAudio(VSEG, VFR),
    },
  },
};

/* ==========================================================================
   PLAYER — identical in every piece; keep as is.
   Autoplays and loops, starts sound on the first click, ?frame=N pauses on a
   frame, ?variant=vertical plays the vertical cut (if the piece has one).
   When the renderer sets window.__MOTION_RENDER__ it stays out of the way.
   ========================================================================== */
(function player() {
  const btn = document.getElementById('sound'), q = new URLSearchParams(location.search);
  let M = window.__motion;
  const V = !window.__MOTION_RENDER__ && M.variants && M.variants[q.get('variant')];
  if (V) {                                                // show the variant's own canvas instead
    M = Object.assign({}, M, V);
    V.canvas.style.cssText = `width:min(100vw,calc(100vh*${V.width}/${V.height}));height:auto;aspect-ratio:${V.width}/${V.height}`;
    document.querySelector('canvas').replaceWith(V.canvas);
  }
  const dur = M.frames / M.fps;
  if (window.__MOTION_RENDER__) { btn.hidden = true; M.seek(0); return; }
  if (q.has('frame')) { btn.hidden = true; M.seek(+q.get('frame') || 0); return; }
  let t0 = performance.now(), ac = null, src = null, buf = null, paused = false, pausedAt = 0;
  const clock = () => ac && src ? (ac.currentTime - t0) : (performance.now() - t0) / 1000;
  function loop() {
    if (!paused) M.seek(Math.floor(((clock() % dur) + dur) % dur * M.fps));
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  btn.addEventListener('click', async () => {
    if (src) { src.stop(); src = null; btn.textContent = 'Click for sound'; t0 = performance.now(); return; }
    btn.textContent = 'Loading sound…';
    ac = ac || new AudioContext({ sampleRate: 48000 });
    buf = buf || await M.audio();
    await ac.resume();
    src = ac.createBufferSource(); src.buffer = buf; src.loop = true; src.connect(ac.destination);
    t0 = ac.currentTime + 0.05; src.start(t0);        // picture restarts from frame 0 in sync with the sound
    btn.textContent = 'Sound on — click to mute';
  });
  addEventListener('keydown', e => {
    if (e.code !== 'Space') return;
    e.preventDefault(); paused = !paused;
    if (ac) paused ? ac.suspend() : ac.resume();
    if (!ac) { if (paused) pausedAt = performance.now(); else t0 += performance.now() - pausedAt; }
  });
})();
</script>
