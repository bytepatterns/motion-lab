<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="teambytepatterns">
<meta name="description" content="Dijkstra and A* search the same maze at the same speed: both find the same 62-step path, A* after exploring a third of the cells.">
<title>Two Ways Out — motion-lab</title>
<style>
  /* Player chrome. The piece itself lives entirely in the canvas. */
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; font: 500 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; }
  canvas { display: block; width: min(100vw, calc(100vh * 16 / 9)); height: auto; aspect-ratio: 16 / 9; }
  #sound { position: fixed; left: 16px; bottom: 16px; padding: 8px 14px; border: 1px solid rgba(255,255,255,.35); border-radius: 999px;
           background: rgba(0,0,0,.55); color: #fff; font: inherit; cursor: pointer; }
  #sound[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080" aria-label="Dijkstra and A* searching the same maze side by side"></canvas>
<button id="sound" type="button">Click for sound</button>
<script>
'use strict';
/* ==========================================================================
   PIECE — Two Ways Out.
   One maze (a seeded depth-first carve plus a few extra openings, so there
   is more than one route), searched twice at the same pace: Dijkstra, which
   always expands the nearest open cell, and A*, which adds a guess of the
   distance still to go (|dx| + |dy|). Both searches run once, at load, and
   record the order in which they open and close every cell; seek(i) only
   reads those records, so any frame can be drawn on its own.
   ========================================================================== */
const W = 1920, H = 1080, FPS = 30, FRAMES = 660;          // 22 s
const cv = document.getElementById('stage');
const ctx = cv.getContext('2d');
const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
const MONO = 'ui-monospace, "Cascadia Code", Consolas, Menlo, monospace';

// ---- helpers -------------------------------------------------------------
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (f, a, b) => clamp((f - a) / (b - a));
const E = {
  inCubic: t => t * t * t,
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inOutCubic: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outExpo: t => t === 1 ? 1 : 1 - Math.pow(2, -10 * t),
  inExpo: t => t === 0 ? 0 : Math.pow(2, 10 * t - 10),
  inOutExpo: t => t === 0 ? 0 : t === 1 ? 1 : t < .5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2,
  outBack: t => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2),
};
function text(g, str, x, y, { size = 40, weight = 600, color = '#fff', alpha = 1, spacing = 0, align = 'left', fam = FONT, base = 'alphabetic' } = {}) {
  if (alpha <= 0.002 || !str) return 0;
  g.font = `${weight} ${size}px ${fam}`; g.letterSpacing = spacing + 'px';
  g.textAlign = align; g.textBaseline = base;
  const a0 = g.globalAlpha; g.globalAlpha = a0 * alpha; g.fillStyle = color;
  g.fillText(str, x, y);
  const w = g.measureText(str).width;
  g.globalAlpha = a0; g.letterSpacing = '0px';
  return w;
}
const env = (f, a, b, fin = 12, fout = 10) => {
  const i = E.outCubic(prog(f, a, a + fin)), o = 1 - E.inCubic(prog(f, b - fout, b));
  return [Math.min(i, o), (1 - i) * 24 - (1 - o) * 10];
};

// ---- palette -------------------------------------------------------------
const C = {
  bg: '#0C0E13', panel: '#11141B', wall: 'rgba(237,233,225,0.82)',
  paper: '#EDE9E1', dim: 'rgba(237,233,225,0.58)', faint: 'rgba(237,233,225,0.32)',
  teal: '#58C4B8', amber: '#F5B83D',
};
// explored cells are shaded by their distance from the start: near = dark, far = bright
const RAMP = {
  dij: [[22, 52, 60], [88, 196, 184]],
  ast: [[70, 44, 14], [245, 184, 61]],
};

// ---- timeline (frames) ---------------------------------------------------
const T = { carve: 4, carved: 64, search: 90, rate: 2.5, pathLen: 30, results: 330, end: 590 };

// ---- the maze ---------------------------------------------------------------
const MW = 28, MH = 20, NC = MW * MH;
const WALL_E = new Uint8Array(NC).fill(1), WALL_S = new Uint8Array(NC).fill(1);
const CARVE = [];                                           // [cell, dir] in the order the carve opened them
(function carve() {
  const r = mulberry32(7), seen = new Uint8Array(NC), stack = [0];
  seen[0] = 1;
  while (stack.length) {
    const c = stack[stack.length - 1], x = c % MW, y = (c / MW) | 0, nb = [];
    if (x > 0 && !seen[c - 1]) nb.push([c - 1, 'W']); if (x < MW - 1 && !seen[c + 1]) nb.push([c + 1, 'E']);
    if (y > 0 && !seen[c - MW]) nb.push([c - MW, 'N']); if (y < MH - 1 && !seen[c + MW]) nb.push([c + MW, 'S']);
    if (!nb.length) { stack.pop(); continue; }
    const [n, d] = nb[Math.floor(r() * nb.length)];
    if (d === 'E') { WALL_E[c] = 0; CARVE.push([c, 'E']); } else if (d === 'W') { WALL_E[n] = 0; CARVE.push([n, 'E']); }
    else if (d === 'S') { WALL_S[c] = 0; CARVE.push([c, 'S']); } else { WALL_S[n] = 0; CARVE.push([n, 'S']); }
    seen[n] = 1; stack.push(n);
  }
  // a few extra openings: loops, so there is more than one way through
  for (let k = 0; k < NC * 0.1; k++) {
    const c = Math.floor(r() * NC), x = c % MW, y = (c / MW) | 0;
    if (r() < 0.5) { if (x < MW - 1 && WALL_E[c]) { WALL_E[c] = 0; CARVE.push([c, 'E']); } }
    else if (y < MH - 1 && WALL_S[c]) { WALL_S[c] = 0; CARVE.push([c, 'S']); }
  }
})();
const START = 0, GOAL = NC - 1;
function neighbours(c) {
  const x = c % MW, y = (c / MW) | 0, o = [];
  if (y > 0 && !WALL_S[c - MW]) o.push(c - MW); if (x < MW - 1 && !WALL_E[c]) o.push(c + 1);
  if (y < MH - 1 && !WALL_S[c]) o.push(c + MW); if (x > 0 && !WALL_E[c - 1]) o.push(c - 1);
  return o;
}
/** Best-first search; h = 0 is Dijkstra (every step costs 1), h = Manhattan distance is A*.
 *  Records, for every cell, the expansion step at which it was first seen and when it was closed. */
function search(astar) {
  const gx = MW - 1, gy = MH - 1, h = c => astar ? Math.abs(c % MW - gx) + Math.abs(((c / MW) | 0) - gy) : 0;
  const g = new Int32Array(NC).fill(-1), parent = new Int32Array(NC).fill(-1);
  const seenAt = new Int32Array(NC).fill(1e9), closedAt = new Int32Array(NC).fill(1e9), order = [];
  const heap = []; let seq = 0;
  const less = (a, b) => a.f - b.f || b.g - a.g || a.s - b.s;
  const push = n => { heap.push(n); let i = heap.length - 1; while (i > 0) { const p = (i - 1) >> 1; if (less(heap[i], heap[p]) >= 0) break; [heap[i], heap[p]] = [heap[p], heap[i]]; i = p; } };
  const pop = () => { const top = heap[0], last = heap.pop(); if (heap.length) { heap[0] = last; let i = 0;
      for (;;) { const l = 2 * i + 1, r = l + 1; let m = i; if (l < heap.length && less(heap[l], heap[m]) < 0) m = l; if (r < heap.length && less(heap[r], heap[m]) < 0) m = r; if (m === i) break; [heap[i], heap[m]] = [heap[m], heap[i]]; i = m; } }
    return top; };
  g[START] = 0; seenAt[START] = 0; push({ c: START, f: h(START), g: 0, s: seq++ });
  while (heap.length) {
    const cur = pop();
    if (closedAt[cur.c] < 1e9) continue;
    closedAt[cur.c] = order.length; order.push(cur.c);
    if (cur.c === GOAL) break;
    for (const n of neighbours(cur.c)) {
      const ng = cur.g + 1;
      if (g[n] < 0 || ng < g[n]) { g[n] = ng; parent[n] = cur.c; if (seenAt[n] === 1e9) seenAt[n] = order.length; push({ c: n, f: ng + h(n), g: ng, s: seq++ }); }
    }
  }
  const path = []; for (let c = GOAL; c >= 0; c = parent[c]) path.push(c);
  path.reverse();
  return { g, order, seenAt, closedAt, path, total: order.length };
}
const DIJ = search(false), AST = search(true);
const LEN = DIJ.path.length - 1;                            // steps; A* finds a path of the same length
const RUNS = [
  { key: 'dij', R: DIJ, name: 'Dijkstra', year: '1959', rule: 'open the nearest cell first', color: C.teal },
  { key: 'ast', R: AST, name: 'A*', year: '1968', rule: 'nearest + a guess of the way left', color: C.amber },
];
const expandedAt = (run, f) => clamp(Math.floor((f - T.search) * T.rate), 0, run.R.total);
const doneAt = run => T.search + Math.ceil(run.R.total / T.rate);   // the frame the goal is closed

// ---- drawing ---------------------------------------------------------------
/** One maze panel. tr = true draws it transposed (x <-> y), for the portrait cut. */
function drawPanel(g, run, f, px, py, cs, { tr = false, alpha = 1 } = {}) {
  const cw = tr ? MH : MW, ch = tr ? MW : MH, R = run.R;
  const pos = c => { const x = c % MW, y = (c / MW) | 0; return tr ? [px + y * cs, py + x * cs] : [px + x * cs, py + y * cs]; };
  g.save(); g.globalAlpha = alpha;
  g.fillStyle = C.panel; g.beginPath(); g.roundRect(px - 10, py - 10, cw * cs + 20, ch * cs + 20, 14); g.fill();
  // explored cells
  const n = expandedAt(run, f), [c0, c1] = RAMP[run.key];
  for (let k = 0; k < n; k++) {
    const c = R.order[k], t = clamp(R.g[c] / LEN), [x, y] = pos(c);
    const fresh = clamp((n - k) / 10);                      // the last few flash
    const col = c0.map((v, i) => Math.round(lerp(lerp(v, c1[i], t), 255, (1 - fresh) * 0.55)));
    g.fillStyle = `rgb(${col.join(',')})`; g.fillRect(x + 1, y + 1, cs - 2, cs - 2);
  }
  // frontier: seen, not yet closed
  g.strokeStyle = run.color; g.lineWidth = 2.5; g.beginPath();
  if (n > 0 && n < R.total) for (let c = 0; c < NC; c++) {
    if (R.seenAt[c] <= n - 1 && R.closedAt[c] >= n) { const [x, y] = pos(c); g.rect(x + 4, y + 4, cs - 8, cs - 8); }
  }
  g.stroke();
  // walls
  const carved = Math.floor(CARVE.length * E.inOutCubic(prog(f, T.carve, T.carved)));
  const open = new Uint8Array(NC * 2);
  for (let k = 0; k < carved; k++) { const [c, d] = CARVE[k]; open[c * 2 + (d === 'E' ? 0 : 1)] = 1; }
  g.strokeStyle = C.wall; g.lineWidth = Math.max(2, cs * 0.1); g.lineCap = 'round'; g.beginPath();
  for (let c = 0; c < NC; c++) {
    const x = c % MW, y = (c / MW) | 0;
    if (x < MW - 1 && !open[c * 2]) { const [ax, ay] = tr ? [px + y * cs, py + (x + 1) * cs] : [px + (x + 1) * cs, py + y * cs]; g.moveTo(ax, ay); tr ? g.lineTo(ax + cs, ay) : g.lineTo(ax, ay + cs); }
    if (y < MH - 1 && !open[c * 2 + 1]) { const [ax, ay] = tr ? [px + (y + 1) * cs, py + x * cs] : [px + x * cs, py + (y + 1) * cs]; g.moveTo(ax, ay); tr ? g.lineTo(ax, ay + cs) : g.lineTo(ax + cs, ay); }
  }
  g.rect(px, py, cw * cs, ch * cs);
  g.stroke();
  // start and goal
  const pop = E.outBack(prog(f, T.carved - 6, T.carved + 10));
  if (pop > 0) {
    const [sx, sy] = pos(START), [gx, gy] = pos(GOAL);
    g.fillStyle = C.paper; g.beginPath(); g.arc(sx + cs / 2, sy + cs / 2, cs * 0.3 * pop, 0, Math.PI * 2); g.fill();
    g.strokeStyle = C.paper; g.lineWidth = 3; g.beginPath(); g.arc(gx + cs / 2, gy + cs / 2, cs * 0.32 * pop, 0, Math.PI * 2); g.stroke();
    g.beginPath(); g.arc(gx + cs / 2, gy + cs / 2, cs * 0.12 * pop, 0, Math.PI * 2); g.fillStyle = C.paper; g.fill();
  }
  // the path, drawn back from the goal once it is reached, then a runner along it
  const d0 = doneAt(run), pk = E.inOutCubic(prog(f, d0, d0 + T.pathLen));
  if (pk > 0) {
    const P = R.path, m = pk * (P.length - 1);
    const pt = k => { const [x, y] = pos(P[k]); return [x + cs / 2, y + cs / 2]; };
    g.lineJoin = 'round'; g.lineCap = 'round';
    for (const [lw, col] of [[cs * 0.52, 'rgba(12,14,19,0.55)'], [cs * 0.26, C.paper]]) {
      g.strokeStyle = col; g.lineWidth = lw; g.beginPath();
      const k0 = P.length - 1; g.moveTo(...pt(k0));
      for (let k = k0 - 1; k >= k0 - Math.floor(m); k--) g.lineTo(...pt(k));
      const kf = k0 - Math.floor(m), fr = m - Math.floor(m);
      if (kf > 0 && fr > 0) { const [ax, ay] = pt(kf), [bx, by] = pt(kf - 1); g.lineTo(lerp(ax, bx, fr), lerp(ay, by, fr)); }
      g.stroke();
    }
    if (f > T.results) {                                     // a runner, start to goal, over and over
      const u = ((f - T.results) % 75) / 75, q = E.inOutCubic(u) * (P.length - 1), k = Math.floor(q);
      const [ax, ay] = pt(k), [bx, by] = pt(Math.min(P.length - 1, k + 1));
      const x = lerp(ax, bx, q - k), y = lerp(ay, by, q - k);
      g.fillStyle = run.color; g.beginPath(); g.arc(x, y, cs * 0.3, 0, Math.PI * 2); g.fill();
      g.strokeStyle = '#0C0E13'; g.lineWidth = 3; g.stroke();
    }
  }
  g.restore();
}

function headline(f) {
  const lines = [
    [-10, T.search + 4, 'Same maze. Same speed.'],
    [T.search, T.results + 4, 'Who reaches the exit first?'],
    [T.results, T.end + 10, 'Same path. A third of the work.'],
  ];
  for (const [a, b, s] of lines) {
    const [al, dy] = env(f, a, b, 12, 10);
    text(ctx, s, 116, 222 + dy, { size: 80, weight: 850, color: C.paper, spacing: -2, alpha: al });
  }
}

// ---- landscape picture -------------------------------------------------------
const CS = 29, PY = 300, PX = [120, 988];
function draw(f) {
  if (ctx.reset) ctx.reset();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none'; ctx.shadowBlur = 0;
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  const endK = E.inOutCubic(prog(f, T.end, T.end + 20));
  const a = 1 - endK * 0.82;
  text(ctx, 'PATHFINDING  ·  DIJKSTRA vs A*', 120, 104, { size: 26, weight: 600, color: C.dim, spacing: 5, alpha: a });
  text(ctx, 'BYTEPATTERNS', 1800, 104, { size: 26, weight: 600, color: C.dim, spacing: 5, align: 'right', alpha: a });
  ctx.globalAlpha = a; headline(f); ctx.globalAlpha = 1;
  const rk0 = E.outCubic(prog(f, T.results + 10, T.results + 34)), rk = rk0 * (1 - endK);
  RUNS.forEach((run, i) => {
    const x = PX[i];
    drawPanel(ctx, run, f, x, PY, CS, { alpha: a });
    const la = a * E.outCubic(prog(f, T.carved - 10, T.carved + 8)) * (1 - rk0);
    const n = expandedAt(run, f), done = f >= doneAt(run);
    const w1 = text(ctx, run.name, x, 960, { size: 52, weight: 850, color: run.color, alpha: la });
    text(ctx, run.year, x + w1 + 16, 960, { size: 30, weight: 600, fam: MONO, color: C.faint, alpha: la });
    text(ctx, run.rule, x, 1008, { size: 30, weight: 500, color: C.dim, alpha: la });
    text(ctx, String(n), x + 812, 962, { size: 52, weight: 800, fam: MONO, color: C.paper, align: 'right', alpha: la });
    text(ctx, done ? `${LEN}-step path` : 'cells opened', x + 812, 1006, { size: 28, weight: 500, fam: MONO, color: done ? run.color : C.faint, align: 'right', alpha: la });
    // a "first" badge on the winner
    if (i === 1) {
      const b = E.outBack(prog(f, doneAt(run) + 6, doneAt(run) + 20));
      if (b > 0.01) {
        ctx.save(); ctx.globalAlpha = a; ctx.translate(x + 812 - 70, PY - 34); ctx.scale(b, b);
        ctx.fillStyle = C.amber; ctx.beginPath(); ctx.roundRect(-72, -26, 144, 52, 26); ctx.fill();
        text(ctx, 'FIRST', 0, 2, { size: 28, weight: 850, color: '#1B1E26', spacing: 3, align: 'center', base: 'middle' });
        ctx.restore();
      }
    }
  });
  // results: the work, as two bars where the labels were
  if (rk > 0) {
    RUNS.forEach((run, i) => {
      const y = 946 + i * 58, bx = 330;
      const w = 1040 * (run.R.total / DIJ.total) * E.outCubic(prog(f, T.results + 20 + i * 10, T.results + 60 + i * 10));
      text(ctx, run.name, 120, y + 4, { size: 44, weight: 850, color: run.color, alpha: rk });
      ctx.globalAlpha = rk; ctx.fillStyle = run.color; ctx.beginPath(); ctx.roundRect(bx, y - 30, Math.max(1, w), 38, 6); ctx.fill(); ctx.globalAlpha = 1;
      text(ctx, `${run.R.total} cells`, bx + w + 18, y, { size: 32, weight: 700, fam: MONO, color: C.paper, alpha: rk });
    });
    text(ctx, `${Math.round(100 * AST.total / DIJ.total)}%`, 1800, 1000, { size: 110, weight: 850, color: C.amber, align: 'right', alpha: rk });
  }
  if (endK > 0) {
    const k1 = E.outCubic(prog(f, T.end + 6, T.end + 30)), k2 = E.outCubic(prog(f, T.end + 18, T.end + 42)), k3 = E.outCubic(prog(f, T.end + 30, T.end + 54));
    text(ctx, 'Two Ways Out', W / 2, 500 + (1 - k1) * 30, { size: 136, weight: 850, color: C.paper, spacing: -3, align: 'center', alpha: k1 });
    text(ctx, `Dijkstra ${DIJ.total} cells  ·  A* ${AST.total} cells  ·  one ${LEN}-step path`, W / 2, 580 + (1 - k2) * 20, { size: 42, weight: 500, color: C.amber, align: 'center', alpha: k2 });
    text(ctx, 'bytepatterns · motion lab', W / 2, 1000, { size: 32, weight: 600, color: C.paper, spacing: 3, align: 'center', alpha: k3 * 0.8 });
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.letterSpacing = '0px';
}

// ---- sound: every opened cell is a note, higher the further it is from the start ----
async function renderAudio() {
  const SR = 48000, dur = FRAMES / FPS, LEN_S = Math.round(SR * dur);
  const ac = new OfflineAudioContext(2, LEN_S, SR);
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -16; comp.ratio.value = 3; comp.attack.value = 0.005; comp.release.value = 0.2;
  const master = ac.createGain(); master.gain.value = 0.9; master.connect(comp).connect(ac.destination);
  master.gain.setValueAtTime(0.9, dur - 0.8); master.gain.linearRampToValueAtTime(0.0001, dur - 0.02);
  const rnd = mulberry32(0xA57A12);
  const ir = ac.createBuffer(2, SR * 2.2, SR);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let k = 0; k < d.length; k++) d[k] = (rnd() * 2 - 1) * Math.pow(1 - k / d.length, 3); }
  const verb = ac.createConvolver(); verb.buffer = ir; const vg = ac.createGain(); vg.gain.value = 0.3; verb.connect(vg).connect(master);
  const noise = ac.createBuffer(1, SR, SR); { const d = noise.getChannelData(0); for (let k = 0; k < d.length; k++) d[k] = rnd() * 2 - 1; }
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  const SCALE = [0, 2, 4, 7, 9];
  const note = k => 57 + 12 * Math.floor(k / 5) + SCALE[k % 5];     // A minor pentatonic from A3
  const blip = (at, m, amp, pan, type = 'sine', dec = 0.18) => {
    const o = ac.createOscillator(); o.type = type; o.frequency.value = hz(m);
    const g = ac.createGain(); g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(amp, at + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, at + dec);
    const p = ac.createStereoPanner(); p.pan.value = pan;
    o.connect(g).connect(p); p.connect(master); p.connect(verb); o.start(at); o.stop(at + dec + 0.05);
  };
  const tick = (at, freq, amp, pan, len = 0.03) => {
    const s = ac.createBufferSource(); s.buffer = noise;
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = 5;
    const g = ac.createGain(); g.gain.setValueAtTime(amp, at); g.gain.exponentialRampToValueAtTime(0.0001, at + len);
    const p = ac.createStereoPanner(); p.pan.value = pan;
    s.connect(bp).connect(g).connect(p).connect(master); s.start(at, (at * 7.9) % 0.9, len + 0.02);
  };
  const boom = (at, f0, f1, amp, len) => {
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.setValueAtTime(f0, at); o.frequency.exponentialRampToValueAtTime(f1, at + len * 0.6);
    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(amp, at + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, at + len);
    o.connect(g).connect(master); o.start(at); o.stop(at + len + 0.05);
  };
  // pad
  for (const [fa, fb, notes] of [[0, T.search, [45, 52, 57, 64]], [T.search, T.results, [41, 48, 57, 60, 64]], [T.results, FRAMES, [43, 50, 55, 59, 62]]]) {
    const a = fa / FPS, b = fb / FPS, lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900; lp.connect(master); lp.connect(verb);
    for (const m of notes) for (const det of [-6, 6]) {
      const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = hz(m); o.detune.value = det;
      const g = ac.createGain(); g.gain.setValueAtTime(0, a); g.gain.linearRampToValueAtTime(0.02, a + (fa === 0 ? 0.05 : 0.6));
      g.gain.setValueAtTime(0.02, Math.max(a + 0.6, b - 0.4)); g.gain.linearRampToValueAtTime(0, b + 0.3);
      o.connect(g).connect(lp); o.start(a); o.stop(b + 0.35);
    }
  }
  boom(0, 120, 42, 0.6, 1.1);
  // the carve: a dry rattle that speeds up and stops when the maze is done
  for (let f = T.carve; f < T.carved; f++) {
    const k0 = Math.floor(CARVE.length * E.inOutCubic(prog(f, T.carve, T.carved))), k1 = Math.floor(CARVE.length * E.inOutCubic(prog(f + 1, T.carve, T.carved)));
    if (k1 > k0) tick(f / FPS, 2200 + 30 * Math.min(60, k1 - k0), 0.05 + 0.004 * Math.min(40, k1 - k0), Math.sin(f) * 0.4);
  }
  tick(T.carved / FPS, 900, 0.5, 0, 0.08);
  // the searches: one note every other frame per side, pitched by the furthest cell opened
  RUNS.forEach((run, i) => {
    const pan = i ? 0.6 : -0.6, end = doneAt(run);
    for (let f = T.search; f < end; f += 2) {
      const a0 = expandedAt(run, f), a1 = expandedAt(run, f + 2); let gmax = 0;
      for (let k = a0; k < a1; k++) gmax = Math.max(gmax, run.R.g[run.R.order[k]]);
      blip(f / FPS, note(Math.round(clamp(gmax / LEN) * 11)), 0.07, pan, i ? 'triangle' : 'sine');
    }
    // found: a hit and the path as a rising run
    const at = end / FPS;
    boom(at, 150, 60, 0.45, 0.6);
    for (let k = 0; k < 8; k++) blip(at + 0.06 + k * (T.pathLen / FPS / 8), note(4 + k + (i ? 2 : 0)), 0.1, pan, 'triangle', 0.5);
  });
  // results: a chord, then the runners tick along
  [57, 64, 69, 72, 76].forEach((m, k) => blip((T.results + 24) / FPS + k * 0.05, m, 0.08, -0.4 + k * 0.2, 'triangle', 1.6));
  for (let f = T.results; f < T.end; f += 75) { blip(f / FPS, 81, 0.05, -0.5, 'sine', 0.3); blip(f / FPS + 0.01, 88, 0.04, 0.5, 'sine', 0.3); }
  [69, 73, 76, 81].forEach((m, k) => blip((T.end + 8 + k * 6) / FPS, m, 0.1, -0.45 + k * 0.3, 'triangle', 1.8));

  const buf = await ac.startRendering();
  let peak = 0; for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let k = 0; k < d.length; k++) peak = Math.max(peak, Math.abs(d[k])); }
  if (peak > 0.89) for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let k = 0; k < d.length; k++) d[k] *= 0.89 / peak; }
  return buf;
}

/* ==========================================================================
   VERTICAL CUT — shared block, identical in every piece.
   1080x1920 for Reels, Shorts and TikTok (__motion.variants.vertical). The
   piece's own scene code is re-used and recomposed for a phone: everything a
   viewer must read stays inside the area no platform covers (x 60..900,
   y 230..1400); outside it there is only dimmed texture.
   ========================================================================== */
const VW = 1080, VH = 1920, SAFE = { x: 60, y: 230, w: 840, h: 1170, r: 900, b: 1400 };
const vcv = document.createElement('canvas'); vcv.width = VW; vcv.height = VH;
const vx = vcv.getContext('2d', { willReadFrequently: true });   // CPU raster: identical pixels on every redraw
const VL = 96, VR = 864;                                          // text column inside the safe area

function vReset() {
  vx.setTransform(1, 0, 0, 1, 0, 0); vx.globalAlpha = 1; vx.globalCompositeOperation = 'source-over';
  vx.filter = 'none'; vx.shadowBlur = 0; vx.shadowColor = 'transparent'; vx.letterSpacing = '0px'; vx.setLineDash([]);
  vx.textAlign = 'left'; vx.textBaseline = 'alphabetic'; vx.lineCap = 'butt'; vx.lineJoin = 'miter';
}
/** Canvas text on the vertical frame; `max` shrinks the size until the line fits. */
function vText(str, x, y, { size = 40, weight = 700, color = '#FFFFFF', align = 'left', spacing = 0, alpha = 1, fam = FONT, max = 0 } = {}) {
  if (alpha <= 0.002 || !str) return size;
  vx.font = `${weight} ${size}px ${fam}`; vx.letterSpacing = spacing + 'px';
  if (max) { const w = vx.measureText(str).width; if (w > max) { size = size * max / w; vx.font = `${weight} ${size}px ${fam}`; } }
  vx.textAlign = align; vx.textBaseline = 'alphabetic';
  const a0 = vx.globalAlpha; vx.globalAlpha = a0 * alpha; vx.fillStyle = color;
  vx.fillText(str, x + (align === 'center' ? spacing / 2 : align === 'right' ? spacing : 0), y);   // tracking is added after the last glyph too
  vx.globalAlpha = a0; vx.letterSpacing = '0px';
  return size;
}
/** Word-wraps with the given font; returns the lines. */
function vWrap(str, maxW, size, weight = 700, fam = FONT) {
  vx.font = `${weight} ${size}px ${fam}`; vx.letterSpacing = '0px';
  const words = str.split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (vx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur);
  return lines;
}
/** Fade envelope with a small rise: [alpha, dy]. */
function vEnv(v, a, b, fin = 8, fout = 8) {
  const i = E.outCubic(prog(v, a, a + fin)), o = 1 - E.inCubic(prog(v, b - fout, b));
  return [Math.min(i, o), (1 - i) * 22 - (1 - o) * 10];
}
/** Which segment of a cut list a vertical frame is in: segs = [{ at, src, len }] in frames. */
function vSeg(segs, v) {
  let k = 0; while (k < segs.length - 1 && v >= segs[k + 1].at) k++;
  const s = segs[k];
  return { k, s, local: v - s.at, src: s.src + (v - s.at) };
}
/** Dims everything outside the safe area to a quiet texture (brightness x 0.2), with a soft inner edge. */
function vShade(rgb, a = 0.8, feather = 40) {
  vx.save(); vx.setTransform(1, 0, 0, 1, 0, 0); vx.globalAlpha = 1; vx.globalCompositeOperation = 'source-over';
  vx.fillStyle = `rgba(${rgb},${a})`;
  vx.beginPath(); vx.rect(0, 0, VW, VH); vx.rect(SAFE.x, SAFE.y, SAFE.w, SAFE.h); vx.fill('evenodd');
  const strip = (x0, y0, x1, y1, rx, ry, rw, rh) => {
    const g = vx.createLinearGradient(x0, y0, x1, y1);
    g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`);
    vx.fillStyle = g; vx.fillRect(rx, ry, rw, rh);
  };
  strip(SAFE.x, 0, SAFE.x + feather, 0, SAFE.x, SAFE.y, feather, SAFE.h);
  strip(SAFE.r, 0, SAFE.r - feather, 0, SAFE.r - feather, SAFE.y, feather, SAFE.h);
  strip(0, SAFE.y, 0, SAFE.y + feather, SAFE.x, SAFE.y, SAFE.w, feather);
  strip(0, SAFE.b, 0, SAFE.b - feather, SAFE.x, SAFE.b - feather, SAFE.w, feather);
  vx.restore();
}
/** Series tag at the top of the safe area, e.g. MADE IN CODE · 04. */
function vTag(label, color, alpha = 1) {
  vText('MADE IN CODE', VL, 292, { size: 28, weight: 800, color, spacing: 5, alpha });
  vx.font = `800 28px ${FONT}`; vx.letterSpacing = '5px';
  const w = vx.measureText('MADE IN CODE').width; vx.letterSpacing = '0px';
  vText('·  ' + label, VL + w + 14, 292, { size: 28, weight: 600, color: 'rgba(255,255,255,0.72)', spacing: 3, alpha, max: VR - VL - w - 14 });
}
/** Big hook lines, left-aligned from y0; visible from frame 0, settles in a few frames. */
function vHook(v, lines, y0, { size = 84, lh = 1.08, color = '#FFFFFF', accent = null, weight = 800, spacing = -1.5, alpha = 1 } = {}) {
  const k = E.outExpo(prog(v, -6, 12));
  lines.forEach((ln, i) => {
    const kk = E.outExpo(prog(v, -12 + i * 2, 8 + i * 2));
    vText(ln, VL, y0 + i * size * lh + (1 - kk) * 30, { size, weight, spacing, color: accent && i === lines.length - 1 ? accent : color, alpha: alpha * Math.max(0.25, kk), max: VR - VL });
  });
  return k;
}
/** Closing card, the last 60 frames: piece title, "drawn in code · bytepatterns.com". l = frames into the card. */
function vEndCard(l, { title, line = '', ink = '#FFFFFF', dim = 'rgba(255,255,255,0.66)', accent = '#FFFFFF', scrim = '0,0,0', a = 0.84 }) {
  const k = E.outCubic(prog(l, 0, 12));
  vx.save(); vx.setTransform(1, 0, 0, 1, 0, 0);
  vx.fillStyle = `rgba(${scrim},${a * k})`; vx.fillRect(0, 0, VW, VH);
  vx.restore();
  const t1 = E.outExpo(prog(l, 3, 19)), t2 = E.outExpo(prog(l, 11, 27)), t3 = E.outExpo(prog(l, 19, 35));
  vx.fillStyle = accent; vx.globalAlpha = t1; vx.fillRect(VL, 742, 88 * t1, 7); vx.globalAlpha = 1;
  const size = vText(title, VL, 850 + (1 - t1) * 40, { size: 92, weight: 800, color: ink, spacing: -2, alpha: t1, max: VR - VL });
  const y2 = 850 + Math.max(size, 60) * 0.25 + 70;
  vx.font = `600 44px ${FONT}`;
  const lead = 'drawn in code  ·  ', lw = vx.measureText(lead).width;
  vText(lead, VL, y2 + (1 - t2) * 24, { size: 44, weight: 600, color: dim, alpha: t2 });
  vText('bytepatterns.com', VL + lw, y2 + (1 - t2) * 24, { size: 44, weight: 800, color: accent, alpha: t2 });
  if (line) vText(line, VL, y2 + 72 + (1 - t3) * 18, { size: 32, weight: 500, color: dim, alpha: t3, max: VR - VL });
}
/** Seeks a cut. The first frame a page draws is drawn twice: the very first read of a
 *  GPU-backed source canvas can come out a shade different from every later one. */
let vWarm = false;
function vSeek(draw, i, frames) {
  const f = Math.max(0, Math.min(frames - 1, Math.floor(i)));
  if (!vWarm) { vWarm = true; draw(f); }
  draw(f);
}
/** The soundtrack of a cut: the piece's own audio() spliced to the same segments as the picture. */
async function vAudio(segs, frames, { xf = 0.025, fadeOut = 0.6, extra = null } = {}) {
  const src = await renderAudio();
  const SR = 48000, dur = frames / FPS, ac = new OfflineAudioContext(2, Math.round(SR * dur), SR);
  const out = ac.createGain(); out.connect(ac.destination);
  out.gain.setValueAtTime(1, 0); out.gain.setValueAtTime(1, dur - fadeOut); out.gain.linearRampToValueAtTime(0, dur - 0.01);
  segs.forEach((s, k) => {
    const at = s.at / FPS, off = s.src / FPS, d = s.len / FPS;
    const pre = k === 0 ? 0 : Math.min(xf, off), post = k === segs.length - 1 ? 0 : xf;
    const b = ac.createBufferSource(), g = ac.createGain(); b.buffer = src;
    g.gain.setValueAtTime(pre ? 0 : 1, at - pre);
    if (pre) g.gain.linearRampToValueAtTime(1, at + pre);
    if (post) { g.gain.setValueAtTime(1, at + d - post); g.gain.linearRampToValueAtTime(0, at + d + post); }
    b.connect(g).connect(out); b.start(at - pre, off - pre, d + pre + post);
  });
  if (extra) extra(ac, out);
  const buf = await ac.startRendering();
  let peak = 0; for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) peak = Math.max(peak, Math.abs(d[i])); }
  if (peak > 0.9) for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] *= 0.9 / peak; }
  return buf;
}
/** A soft three-partial bell, for the closing card. */
function vChime(ac, dest, at, freq, vol = 0.08) {
  for (const [mul, v, dec] of [[1, 1, 1.8], [2.01, 0.35, 0.8], [3.02, 0.12, 0.4]]) {
    const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.value = freq * mul;
    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol * v, at + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, at + dec);
    o.connect(g).connect(dest); o.start(at); o.stop(at + dec + 0.05);
  }
}

/* VERTICAL CUT — this piece */
// The same maze turned on its side (20 wide, 28 tall) so both searches fit
// next to each other on a phone, at the same pace as the landscape piece.
const VSEG = [
  { at: 0, src: 0, len: 80 },                               // hook: the maze carves itself
  { at: 80, src: T.search - 10, len: 250 },                 // both searches, both paths
  { at: 330, src: T.results, len: 150 },                    // the result
  { at: 480, src: T.end, len: 60 },                          // closing card
];
const VFR = 540, VEND = VFR - 60, VCS = 19, VPY = 610, VPX = [VL - 4, VL + MH * VCS + 30];
function vDraw(v) {
  const { k: seg, src } = vSeg(VSEG, v), f = Math.min(FRAMES - 1, src);
  vReset();
  vx.fillStyle = C.bg; vx.fillRect(0, 0, VW, VH);
  vTag('TWO WAYS OUT', C.amber);
  const lines = seg === 0 ? ['Same maze.', 'Same speed.'] : seg === 1 ? ['Who gets out', 'first?'] : ['Same path.', 'A third of the work.'];
  const segStart = VSEG[seg].at;
  if (seg === 0) vHook(v, lines, 420, { size: 92, color: C.paper, accent: C.amber });
  else {
    lines.forEach((ln, i) => { const [a, dy] = vEnv(v, segStart + i * 3, segStart + VSEG[seg].len + 6, 10, 8);
      vText(ln, VL, 420 + i * 96 + dy, { size: 88, weight: 850, spacing: -2, color: i ? C.amber : C.paper, alpha: a, max: VR - VL }); });
  }
  RUNS.forEach((run, i) => {
    drawPanel(vx, run, f, VPX[i], VPY, VCS, { tr: true });
    const la = E.outCubic(prog(f, T.carved - 10, T.carved + 8)), x = VPX[i];
    vText(run.name, x, 1210, { size: 46, weight: 850, color: run.color, alpha: la });
    vText(String(expandedAt(run, f)), x, 1272, { size: 46, weight: 800, fam: MONO, color: C.paper, alpha: la });
    vText(f >= doneAt(run) ? `cells · ${LEN} steps` : 'cells opened', x, 1312, { size: 28, weight: 500, fam: MONO, color: f >= doneAt(run) ? run.color : C.faint, alpha: la });
  });
  if (seg >= 2) {
    const rk = E.outCubic(prog(v, 350, 380));
    vText(`A* opened ${Math.round(100 * AST.total / DIJ.total)}% of the cells`, VL, 1376, { size: 36, weight: 700, color: C.amber, alpha: rk, max: VR - VL });
  }
  vShade('12,14,19');
  if (v >= VEND) vEndCard(v - VEND, { title: 'Two Ways Out', line: `Dijkstra ${DIJ.total} cells · A* ${AST.total} cells · one path`,
    ink: C.paper, dim: 'rgba(237,233,225,0.7)', accent: C.amber, scrim: '12,14,19', a: 0.84 });
  vReset();
}

window.__motion = {
  title: 'Two Ways Out',
  description: `Dijkstra and A* search the same maze at the same speed: one ${LEN}-step path, and A* opens a third of the cells to find it.`,
  fps: FPS, width: W, height: H, frames: FRAMES,
  poster: 250,
  gifStart: 2.5,
  seek(i) { draw(Math.max(0, Math.min(FRAMES - 1, Math.floor(i)))); },
  audio: renderAudio,
  variants: {
    vertical: {
      width: VW, height: VH, frames: VFR, canvas: vcv,
      poster: 200, gifStart: 2.5,
      seek(i) { vSeek(vDraw, i, VFR); },
      audio: () => vAudio(VSEG, VFR),
    },
  },
};

/* ==========================================================================
   PLAYER — identical in every piece; keep as is.
   Autoplays and loops, starts sound on the first click, ?frame=N pauses on a
   frame, ?variant=vertical plays the vertical cut (if the piece has one).
   When the renderer sets window.__MOTION_RENDER__ it stays out of the way.
   ========================================================================== */
(function player() {
  const btn = document.getElementById('sound'), q = new URLSearchParams(location.search);
  let M = window.__motion;
  const V = !window.__MOTION_RENDER__ && M.variants && M.variants[q.get('variant')];
  if (V) {                                                // show the variant's own canvas instead
    M = Object.assign({}, M, V);
    V.canvas.style.cssText = `width:min(100vw,calc(100vh*${V.width}/${V.height}));height:auto;aspect-ratio:${V.width}/${V.height}`;
    document.querySelector('canvas').replaceWith(V.canvas);
  }
  const dur = M.frames / M.fps;
  if (window.__MOTION_RENDER__) { btn.hidden = true; M.seek(0); return; }
  if (q.has('frame')) { btn.hidden = true; M.seek(+q.get('frame') || 0); return; }
  let t0 = performance.now(), ac = null, src = null, buf = null, paused = false, pausedAt = 0;
  const clock = () => ac && src ? (ac.currentTime - t0) : (performance.now() - t0) / 1000;
  function loop() {
    if (!paused) M.seek(Math.floor(((clock() % dur) + dur) % dur * M.fps));
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  btn.addEventListener('click', async () => {
    if (src) { src.stop(); src = null; btn.textContent = 'Click for sound'; t0 = performance.now(); return; }
    btn.textContent = 'Loading sound…';
    ac = ac || new AudioContext({ sampleRate: 48000 });
    buf = buf || await M.audio();
    await ac.resume();
    src = ac.createBufferSource(); src.buffer = buf; src.loop = true; src.connect(ac.destination);
    t0 = ac.currentTime + 0.05; src.start(t0);        // picture restarts from frame 0 in sync with the sound
    btn.textContent = 'Sound on — click to mute';
  });
  addEventListener('keydown', e => {
    if (e.code !== 'Space') return;
    e.preventDefault(); paused = !paused;
    if (ac) paused ? ac.suspend() : ac.resume();
    if (!ac) { if (paused) pausedAt = performance.now(); else t0 += performance.now() - pausedAt; }
  });
})();
</script>
