<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="teambytepatterns">
<meta name="description" content="A neon Breakout level that plays itself: deterministic ball physics, multi-ball, a fire-ball and every brick cleared in under fifteen seconds.">
<title>Neon Breakout — motion-lab</title>
<style>
  /* Player chrome. The piece itself lives entirely in the canvas. */
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; font: 500 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; }
  canvas { display: block; width: min(100vw, calc(100vh * 16 / 9)); height: auto; aspect-ratio: 16 / 9; }
  #sound { position: fixed; left: 16px; bottom: 16px; padding: 8px 14px; border: 1px solid rgba(255,255,255,.35); border-radius: 999px;
           background: rgba(0,0,0,.55); color: #fff; font: inherit; cursor: pointer; }
  #sound[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080" aria-label="A neon Breakout game playing itself"></canvas>
<button id="sound" type="button">Click for sound</button>
<script>
'use strict';
/* ==========================================================================
   PIECE — Neon Breakout.
   The level is simulated once, up front, with a fixed timestep (8 substeps a
   frame) and a paddle controller that aims for the lowest brick. Every frame
   stores paddle + balls; every hit is an event. seek(i) reads frame i and
   draws particles, pop-ups and shake analytically from the events before i,
   so any frame can be drawn in any order. The soundtrack is scheduled from
   the same events: brick pitch = brick row.
   Arrow keys (or A / D) take over the paddle in the browser; Esc returns to
   the demo. The rendered video is always the auto-play run.
   ========================================================================== */
const W = 1920, H = 1080, FPS = 30, FRAMES = 600;          // 20 s
const cv = document.getElementById('stage');
let ctx = cv.getContext('2d');                                   // the vertical cut points it at its own canvas
const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';

// ---- helpers -------------------------------------------------------------
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (f, a, b) => clamp((f - a) / (b - a));
const E = {
  inCubic: t => t * t * t,
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inOutCubic: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outExpo: t => t === 1 ? 1 : 1 - Math.pow(2, -10 * t),
  inExpo: t => t === 0 ? 0 : Math.pow(2, 10 * t - 10),
  outBack: t => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2),
};

// ---- palette: magenta → cyan rows, amber for power-ups, ink + white -------
const C = { bg: '#07060F', ink: '#0E0B1C', paper: '#F3F0FF', dim: '#8C86B3', amber: '#FFB547', magenta: '#FF3FD0', cyan: '#3FF0FF' };
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const ROWC = Array.from({ length: 7 }, (_, r) => { const a = hex(C.magenta), b = hex(C.cyan), t = r / 6;
  return `rgb(${Math.round(lerp(a[0], b[0], t))},${Math.round(lerp(a[1], b[1], t))},${Math.round(lerp(a[2], b[2], t))})`; });

// ---- game (pure, deterministic) --------------------------------------------
const G = {
  L: 540, R: 1380, T: 64, PY: 972, PH: 18, PW: 176, BR: 11,
  cols: 12, rows: 7, bx0: 552, by0: 206, bw: 64, bh: 28, bpx: 70, bpy: 38,
  SUB: 8, vmax: 3200,
};
const LEVEL = {                                            // tuned so the run clears with no ball lost
  speed0: 1242.0944951878373, speedUp: 5.962836589025793, speedMax: 1427.0480318877599,
  launch: -0.020628741906425496, aimBias: 0.09162457049691486,
  splits: ['4,2', '4,9', '5,5', '5,6'], fires: ['3,5'], fireLen: 71, maxBalls: 3,
  lowW: 1.0775817513314099, xW: 0.197710859612729,
};

function makeGame(O) {
  const SPLITS = new Set(O.splits), FIRES = new Set(O.fires);
  let fireUntil = -1;
  const dt = 1 / (FPS * G.SUB);
  const bricks = [];
  for (let r = 0; r < G.rows; r++) for (let c = 0; c < G.cols; c++)
    bricks.push({ r, c, x: G.bx0 + c * G.bpx, y: G.by0 + r * G.bpy, alive: true, dead: Infinity, split: SPLITS.has(r + ',' + c), fire: FIRES.has(r + ',' + c) && !SPLITS.has(r + ',' + c) });
  const S = { bricks, alive: bricks.length, balls: [], px: (G.L + G.R) / 2, speed: O.speed0, score: 0, combo: 0, clearedAt: -1, lost: 0, f: 0, frames: [], events: [] };
  const addBall = (x, y, vx, vy, f) => S.balls.push({ x, y, vx, vy, on: true, born: f });
  addBall(S.px + 30, G.PY - G.BR - 1, Math.sin(O.launch) * O.speed0, -Math.cos(O.launch) * O.speed0, 0);
  const target = { x: S.px };
  function aim(ballX) {
    let best = null, bs = -1e9;
    for (const b of bricks) if (b.alive) {
      const cx = b.x + G.bw / 2, cy = b.y + G.bh / 2;
      const s = cy * O.lowW - Math.abs(cx - ballX) * O.xW + (b.split ? 60 : 0);
      if (s > bs) { bs = s; best = b; }
    }
    return best;
  }
  function predict(b) {
    if (b.vy <= 0) return null;
    const t = (G.PY - G.BR - b.y) / b.vy;
    if (t < 0) return null;
    const w = G.R - G.L - 2 * G.BR;
    let x = b.x - G.L - G.BR + b.vx * t;
    x = ((x % (2 * w)) + 2 * w) % (2 * w); if (x > w) x = 2 * w - x;
    return { x: x + G.L + G.BR, t };
  }
  // one frame; keys = null for auto-play, or -1/0/1 for the player
  S.step = function (keys) {
    const f = S.f, ev = S.events, balls = S.balls;
    if (S.clearedAt < 0) for (let s = 0; s < G.SUB; s++) {
      if (keys === null || keys === undefined) {
        let pick = null;
        for (const b of balls) if (b.on) { const p = predict(b); if (p && (!pick || p.t < pick.t)) pick = { ...p, b }; }
        if (pick) {
          const tb = aim(pick.x);
          let off = 0;
          if (tb) {
            const dx = tb.x + G.bw / 2 - pick.x, dy = (G.PY - G.BR) - (tb.y + G.bh / 2);
            off = Math.max(-0.85, Math.min(0.85, Math.atan2(dx, dy) / (62 * Math.PI / 180) + O.aimBias));
          }
          const want = pick.x - off * G.PW / 2;
          target.x = Math.abs(want - S.px) <= G.vmax * pick.t ? want : pick.x;
        } else {
          let lo = null; for (const b of balls) if (b.on && (!lo || b.y > lo.y)) lo = b;
          if (lo) target.x = lo.x;
        }
      } else target.x = S.px + keys * 1500 * dt * 1.0001;
      target.x = Math.max(G.L + G.PW / 2, Math.min(G.R - G.PW / 2, target.x));
      S.px += Math.max(-G.vmax * dt, Math.min(G.vmax * dt, target.x - S.px));
      for (let bi = 0; bi < balls.length; bi++) {
        const b = balls[bi]; if (!b.on) continue;
        b.x += b.vx * dt; b.y += b.vy * dt;
        if (b.x < G.L + G.BR) { b.x = 2 * (G.L + G.BR) - b.x; b.vx = Math.abs(b.vx); ev.push({ f, k: 'wall', x: G.L, y: b.y }); }
        if (b.x > G.R - G.BR) { b.x = 2 * (G.R - G.BR) - b.x; b.vx = -Math.abs(b.vx); ev.push({ f, k: 'wall', x: G.R, y: b.y }); }
        if (b.y < G.T + G.BR) { b.y = 2 * (G.T + G.BR) - b.y; b.vy = Math.abs(b.vy); ev.push({ f, k: 'wall', x: b.x, y: G.T }); }
        if (b.vy > 0 && b.y + G.BR >= G.PY && b.y + G.BR <= G.PY + G.PH + 14 && Math.abs(b.x - S.px) <= G.PW / 2 + G.BR) {
          const off = Math.max(-1, Math.min(1, (b.x - S.px) / (G.PW / 2)));
          const a = off * 62 * Math.PI / 180;
          b.vx = Math.sin(a) * S.speed; b.vy = -Math.cos(a) * S.speed; b.y = G.PY - G.BR;
          S.combo = 0; ev.push({ f, k: 'paddle', x: b.x, y: G.PY, bi });
        }
        if (b.y > 1100) { b.on = false; S.lost++; ev.push({ f, k: 'lost', x: b.x, y: 1080 }); continue; }
        const burning = f < fireUntil;
        for (const k of bricks) {
          if (!k.alive) continue;
          const nx = Math.max(k.x, Math.min(b.x, k.x + G.bw)), ny = Math.max(k.y, Math.min(b.y, k.y + G.bh));
          const dx = b.x - nx, dy = b.y - ny;
          if (dx * dx + dy * dy > G.BR * G.BR) continue;
          const ox = Math.min(b.x + G.BR - k.x, k.x + G.bw - (b.x - G.BR)), oy = Math.min(b.y + G.BR - k.y, k.y + G.bh - (b.y - G.BR));
          if (burning) { /* plough on */ } else if (ox < oy) { b.vx = b.x < k.x + G.bw / 2 ? -Math.abs(b.vx) : Math.abs(b.vx); }
          else { b.vy = b.y < k.y + G.bh / 2 ? -Math.abs(b.vy) : Math.abs(b.vy); }
          k.alive = false; k.dead = f; S.alive--; S.combo++;
          const pts = (G.rows - k.r) * 10 * Math.min(S.combo, 8);
          S.score += pts;
          ev.push({ f, k: 'brick', x: k.x + G.bw / 2, y: k.y + G.bh / 2, r: k.r, c: k.c, pts, combo: S.combo, bi, split: k.split, fire: k.fire, burning });
          S.speed = Math.min(O.speedMax, S.speed + O.speedUp);
          const m = Math.hypot(b.vx, b.vy); b.vx *= S.speed / m; b.vy *= S.speed / m;
          if (k.split && balls.filter(q => q.on).length < O.maxBalls) {
            for (const a of [-0.55, 0.55]) {
              const ang = Math.atan2(b.vx, -b.vy) + a;
              addBall(k.x + G.bw / 2, k.y + G.bh / 2, Math.sin(ang) * S.speed, -Math.abs(Math.cos(ang) * S.speed), f);
            }
            ev.push({ f, k: 'split', x: k.x + G.bw / 2, y: k.y + G.bh / 2 });
          }
          if (k.fire) { fireUntil = f + O.fireLen; ev.push({ f, k: 'fire', x: k.x + G.bw / 2, y: k.y + G.bh / 2 }); }
          if (!burning) break;
        }
      }
      if (S.alive === 0 && S.clearedAt < 0) { S.clearedAt = f; ev.push({ f, k: 'clear' }); }
    }
    S.frames.push({ px: S.px, fire: f < fireUntil, balls: balls.map(b => b.on && S.clearedAt < 0 ? [b.x, b.y] : null), score: S.score, alive: S.alive, combo: S.combo, clearedAt: S.clearedAt });
    S.f++;
  };
  return S;
}

// the demo run, simulated once
const RUN = makeGame(LEVEL);
for (let f = 0; f < FRAMES; f++) RUN.step(null);
const CLEAR = RUN.clearedAt;                               // 444 with this level
const byFrame = new Map(); RUN.events.forEach((e, i) => { e.id = i; if (e.k !== 'wall') { if (!byFrame.has(e.f)) byFrame.set(e.f, []); byFrame.get(e.f).push(e); } });
const bricksEv = RUN.events.filter(e => e.k === 'brick');

// ---- glow sprites (drawn once) ----------------------------------------------
function glowSprite(color, w, h, blur) {
  const c = document.createElement('canvas'); c.width = w + blur * 4; c.height = h + blur * 4;
  const g = c.getContext('2d'); g.filter = `blur(${blur}px)`; g.fillStyle = color;
  g.beginPath(); g.roundRect(blur * 2, blur * 2, w, h, 8); g.fill(); return c;
}
const BRICK_GLOW = ROWC.map(c => glowSprite(c, G.bw, G.bh, 12));
const AMBER_GLOW = glowSprite(C.amber, G.bw, G.bh, 14);
const PADDLE_GLOW = glowSprite(C.cyan, G.PW, G.PH, 16);
const dot = (color, r, blur) => { const c = document.createElement('canvas'); c.width = c.height = (r + blur * 2) * 2;
  const g = c.getContext('2d'); g.filter = `blur(${blur}px)`; g.fillStyle = color; g.beginPath(); g.arc(c.width / 2, c.height / 2, r, 0, Math.PI * 2); g.fill(); return c; };
const BALL_GLOW = dot(C.cyan, 16, 12), FIRE_GLOW = dot(C.amber, 22, 16);

// ---- drawing ---------------------------------------------------------------
function text(str, x, y, size, weight, color, alpha = 1, spacing = 0, align = 'left') {
  if (alpha <= 0.002) return;
  ctx.globalAlpha = alpha; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
  ctx.font = `${weight} ${size}px ${FONT}`; ctx.letterSpacing = spacing + 'px';
  ctx.fillText(str, x, y);
  ctx.globalAlpha = 1; ctx.letterSpacing = '0px';
}
// soft neon glow without shadowBlur (blur paths can differ by a bit between a fresh and a warm canvas)
function glowText(str, x, y, size, weight, color, glow, alpha, spacing = 0, align = 'left') {
  if (alpha <= 0.002) return;
  ctx.save(); ctx.font = `${weight} ${size}px ${FONT}`; ctx.letterSpacing = spacing + 'px'; ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
  ctx.lineJoin = 'round'; ctx.strokeStyle = glow;
  for (const [w, a] of [[30, 0.07], [18, 0.11], [9, 0.18]]) { ctx.globalAlpha = alpha * a; ctx.lineWidth = w; ctx.strokeText(str, x, y); }
  ctx.restore();
  text(str, x, y, size, weight, color, alpha, spacing, align);
}
const fmtScore = n => String(Math.round(n)).padStart(6, '0');

function displayScore(run, f) {                            // each hit rolls in over 8 frames
  let s = 0;
  for (const e of run.bricksEv) { if (e.f > f) break; s += e.pts * E.outCubic(clamp((f - e.f + 1) / 8)); }
  return s;
}
function shake(run, f) {
  let a = 0;
  for (let k = Math.max(0, f - 14); k <= f; k++) { const list = run.byFrame.get(k); if (!list) continue;
    for (const e of list) a += (e.k === 'split' || e.k === 'fire' ? 16 : e.k === 'brick' ? (e.burning ? 3 : 2.2) : e.k === 'clear' ? 22 : 0) * Math.exp(-(f - k) * 0.35); }
  a = Math.min(a, 24);
  return [Math.sin(f * 2.7) * a, Math.cos(f * 3.3) * a * 0.7];
}

function background(f) {
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  // horizon-less grid floor, slowly scrolling, very dim
  ctx.save(); ctx.globalAlpha = 0.16; ctx.strokeStyle = '#5b3fa8'; ctx.lineWidth = 1;
  ctx.beginPath();
  const off = (f * 1.2) % 60;
  for (let x = -60 + off; x < W + 60; x += 60) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = -60 + off; y < H + 60; y += 60) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke(); ctx.restore();
  const g = ctx.createRadialGradient(W / 2, H / 2, 200, W / 2, H / 2, 1100);
  g.addColorStop(0, 'rgba(40,20,80,0.35)'); g.addColorStop(1, 'rgba(0,0,0,0.6)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

function arena(f, fire) {
  const pulse = 0.55 + 0.1 * Math.sin(f * 0.2);
  ctx.save();
  ctx.fillStyle = 'rgba(8,6,20,0.85)'; ctx.fillRect(G.L - 6, G.T - 6, G.R - G.L + 12, 1080 - G.T + 6);
  ctx.strokeStyle = fire ? C.amber : C.cyan; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(G.L - 6, 1080); ctx.lineTo(G.L - 6, G.T - 6); ctx.lineTo(G.R + 6, G.T - 6); ctx.lineTo(G.R + 6, 1080);
  for (const [w, a] of [[16, 0.08], [8, 0.16], [3, 1]]) { ctx.globalAlpha = pulse * a; ctx.lineWidth = w; ctx.stroke(); }
  ctx.restore();
}

function brickShape(x, y, color, alpha, special) {
  ctx.globalAlpha = alpha;
  const g = ctx.createLinearGradient(0, y, 0, y + G.bh);
  g.addColorStop(0, '#ffffff'); g.addColorStop(0.18, color); g.addColorStop(1, color);
  ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect(x, y, G.bw, G.bh, 6); ctx.fill();
  ctx.fillStyle = 'rgba(7,6,15,0.55)'; ctx.beginPath(); ctx.roundRect(x + 4, y + 9, G.bw - 8, G.bh - 13, 4); ctx.fill();
  if (special === 'split') { ctx.fillStyle = '#fff'; for (const d of [-12, 0, 12]) { ctx.beginPath(); ctx.arc(x + G.bw / 2 + d, y + G.bh / 2 + 2, 3.2, 0, Math.PI * 2); ctx.fill(); } }
  if (special === 'fire') { ctx.fillStyle = '#fff'; ctx.beginPath(); const cx = x + G.bw / 2, cy = y + G.bh / 2 + 2;
    ctx.moveTo(cx, cy - 9); ctx.quadraticCurveTo(cx + 9, cy, cx, cy + 7); ctx.quadraticCurveTo(cx - 9, cy, cx, cy - 9); ctx.fill(); }
  ctx.globalAlpha = 1;
}

function bricks(run, f) {
  // intro: rows drop in during the first 10 frames (the hook), staggered
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const b of run.bricks) {
    if (b.dead <= f) continue;
    const intro = E.outBack(clamp((f - b.r * 0.7 + 3) / 7)), y = b.y - (1 - intro) * 60;
    const special = b.split || b.fire;
    const spr = special ? AMBER_GLOW : BRICK_GLOW[b.r];
    ctx.globalAlpha = (special ? 0.75 + 0.25 * Math.sin(f * 0.3 + b.c) : 0.45) * clamp(intro);
    ctx.drawImage(spr, b.x - 24, y - 24);
  }
  ctx.restore();
  for (const b of run.bricks) {
    if (b.dead <= f) continue;
    const intro = E.outBack(clamp((f - b.r * 0.7 + 3) / 7)), y = b.y - (1 - intro) * 60;
    brickShape(b.x, y, b.split || b.fire ? C.amber : ROWC[b.r], clamp(intro), b.split ? 'split' : b.fire ? 'fire' : null);
  }
}

function particles(run, f) {
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const e of run.bricksEv) {
    const age = f - e.f; if (age < 0) break; if (age > 42) continue;
    const r = mulberry32(e.id * 7919 + 13), col = e.split || e.fire ? C.amber : ROWC[e.r];
    // shock ring
    if (age < 14) { const k = E.outCubic(age / 14); ctx.globalAlpha = (1 - k) * 0.8; ctx.strokeStyle = col; ctx.lineWidth = 3 * (1 - k) + 1;
      ctx.beginPath(); ctx.ellipse(e.x, e.y, 20 + k * 70, 10 + k * 40, 0, 0, Math.PI * 2); ctx.stroke(); }
    // shards
    ctx.fillStyle = col;
    const n = e.split || e.fire ? 26 : 16;
    for (let k = 0; k < n; k++) {
      const a = r() * Math.PI * 2, sp = 160 + r() * 520, life = 0.5 + r() * 0.9, sz = 2 + r() * 5;
      const t = age / FPS; if (t > life) continue;
      const x = e.x + Math.cos(a) * sp * t, y = e.y + Math.sin(a) * sp * t + 900 * t * t;
      ctx.globalAlpha = (1 - t / life) * 0.95;
      ctx.fillRect(x - sz / 2, y - sz / 2, sz, sz);
    }
  }
  ctx.restore();
  // score pop-ups
  // (during a fire-ball rampage only every fourth hit gets one, or they pile up)
  for (const e of run.bricksEv) {
    const age = f - e.f; if (age < 0) break; if (age > 22) continue;
    if (e.burning && e.combo % 4 !== 0) continue;
    const k = age / 22;
    text('+' + e.pts, e.x, e.y - 10 - E.outCubic(k) * 46, e.combo >= 4 ? 34 : 28, 800, C.paper, (1 - E.inCubic(k)) * 0.95, 0, 'center');
  }
}

function paddle(run, f, fr) {
  const x = fr.px - G.PW / 2, y = G.PY;
  let hit = 0; for (let k = Math.max(0, f - 6); k <= f; k++) { const l = run.byFrame.get(k); if (l && l.some(e => e.k === 'paddle')) hit = Math.max(hit, 1 - (f - k) / 7); }
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.6 + 0.4 * hit; ctx.drawImage(PADDLE_GLOW, x - 32, y - 32); ctx.restore();
  const g = ctx.createLinearGradient(0, y, 0, y + G.PH);
  g.addColorStop(0, '#ffffff'); g.addColorStop(0.35, C.cyan); g.addColorStop(1, '#1aa6c0');
  ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect(x, y - hit * 3, G.PW, G.PH, 9); ctx.fill();
}

function balls(run, f) {
  const fr = run.frames[f];
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let bi = 0; bi < fr.balls.length; bi++) {
    const p = fr.balls[bi]; if (!p) continue;
    // trail from earlier frames of the same ball
    const burning = fr.fire;
    let prev = p;
    for (let k = 1; k <= (burning ? 7 : 5); k++) {
      const q = f - k >= 0 ? run.frames[f - k].balls[bi] : null; if (!q) break;
      const dx = q[0] - prev[0], dy = q[1] - prev[1]; if (dx * dx + dy * dy > 200 * 200) break;   // bounced off-screen jump guard
      ctx.globalAlpha = (1 - k / 8) * (burning ? 0.7 : 0.45);
      ctx.strokeStyle = burning ? C.amber : C.cyan; ctx.lineWidth = G.BR * 2 * (1 - k / 9); ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(prev[0], prev[1]); ctx.lineTo(q[0], q[1]); ctx.stroke();
      prev = q;
    }
    ctx.globalAlpha = 1;
    const spr = burning ? FIRE_GLOW : BALL_GLOW; ctx.drawImage(spr, p[0] - spr.width / 2, p[1] - spr.height / 2);
  }
  ctx.restore();
  for (const p of fr.balls) { if (!p) continue; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(p[0], p[1], G.BR, 0, Math.PI * 2); ctx.fill(); }
}

function callouts(run, f) {
  for (const e of run.events) {
    if (e.k !== 'split' && e.k !== 'fire') continue;
    const age = f - e.f; if (age < 0 || age > 36) continue;
    const k = E.outBack(clamp(age / 10)), o = 1 - E.inCubic(clamp((age - 24) / 12));
    ctx.save(); ctx.translate((G.L + G.R) / 2, 640); ctx.scale(k, k);
    glowText(e.k === 'split' ? 'MULTI-BALL' : 'FIRE-BALL', 0, 0, 96, 900, C.amber, C.amber, o, 6, 'center');
    ctx.restore();
  }
}

function hud(run, f, live) {
  const fr = run.frames[f];
  const k = E.outExpo(clamp((f + 3) / 12));
  // left: title + score
  text('NEON', 96, 160 - (1 - k) * 30, 68, 900, C.magenta, k, 5);
  text('BREAKOUT', 96, 234 - (1 - k) * 30, 68, 900, C.paper, k, 5);
  text('SCORE', 100, 404, 30, 700, C.dim, k, 6);
  text(fmtScore(run.live ? fr.score : displayScore(run, f)), 96, 506, 100, 800, C.paper, k, 1);
  text('BRICKS', 100, 620, 30, 700, C.dim, k, 6);
  text(String(fr.alive).padStart(2, '0'), 96, 716, 96, 800, fr.alive === 0 ? C.amber : C.cyan, k, 2);
  const tSec = (fr.clearedAt >= 0 ? fr.clearedAt : f) / FPS;
  text('TIME', 100, 818, 30, 700, C.dim, k, 6);
  text(tSec.toFixed(1) + ' s', 96, 900, 72, 800, C.paper, k, 1);
  // right: mode, level, balls, combo
  const blink = 0.55 + 0.45 * Math.sin(f * 0.35);
  ctx.globalAlpha = k * blink; ctx.fillStyle = live ? C.amber : C.magenta; ctx.beginPath(); ctx.arc(1478, 158, 11, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;
  text(live ? 'PLAYER' : 'AUTO-PLAY', 1502, 172, 44, 800, C.paper, k, 4);
  text('LEVEL', 1462, 266, 30, 700, C.dim, k, 6);
  text('01', 1458, 358, 96, 800, C.paper, k, 2);
  text('BALLS', 1462, 460, 30, 700, C.dim, k, 6);
  const nb = fr.balls.filter(Boolean).length;
  for (let i = 0; i < 3; i++) { ctx.globalAlpha = k * (i < nb ? 1 : 0.18); ctx.fillStyle = i < nb ? '#fff' : C.dim;
    ctx.beginPath(); ctx.arc(1480 + i * 46, 508, 14, 0, Math.PI * 2); ctx.fill(); }
  ctx.globalAlpha = 1;
  if (fr.combo >= 3 && fr.clearedAt < 0) {
    text('COMBO', 1462, 640, 30, 700, C.dim, 1, 6);
    text('×' + fr.combo, 1458, 736, 96, 900, C.amber, 1, 2);
  }
  if (fr.fire) text('FIRE-BALL', 1462, 830, 44, 900, C.amber, 0.6 + 0.4 * Math.sin(f * 0.8), 3);
  text(live ? 'Esc — back to the demo' : '← →  take over', 1462, 1000, 30, 600, C.dim, k * 0.9, 1);
}

function levelClear(run, f) {
  if (run.clearedAt < 0 || f < run.clearedAt) return;
  const a = f - run.clearedAt;
  // full-screen dim, then fireworks and the card
  ctx.fillStyle = `rgba(7,6,15,${0.86 * E.outCubic(clamp(a / 12))})`; ctx.fillRect(0, 0, W, H);
  // fireworks from the cleared grid
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let n = 0; n < 7; n++) {
    const t0 = n * 9, age = a - t0; if (age < 0 || age > 60) continue;
    const r = mulberry32(900 + n), cx = lerp(G.L + 120, G.R - 120, r()), cy = 220 + r() * 260, col = [C.magenta, C.cyan, C.amber][n % 3];
    ctx.fillStyle = col;
    for (let k = 0; k < 40; k++) { const ang = k / 40 * Math.PI * 2 + r() * 0.1, sp = 380 + r() * 160, t = age / FPS;
      const x = cx + Math.cos(ang) * sp * t, y = cy + Math.sin(ang) * sp * t + 260 * t * t; ctx.globalAlpha = Math.max(0, 1 - t / 2); ctx.fillRect(x - 2.5, y - 2.5, 5, 5); }
  }
  ctx.restore();
  const k = E.outBack(clamp(a / 14)), s = lerp(1.35, 1, E.outExpo(clamp(a / 14)));
  ctx.save(); ctx.translate(W / 2, 430); ctx.scale(s, s);
  glowText('LEVEL CLEAR', 0, 0, 170, 900, C.paper, C.magenta, clamp(k), 14, 'center');
  ctx.restore();
  const k1 = E.outCubic(clamp((a - 12) / 16));
  text('FINAL SCORE', W / 2, 540 + (1 - k1) * 20, 32, 700, C.dim, k1, 8, 'center');
  text(fmtScore(run.score), W / 2, 650 + (1 - k1) * 20, 110, 800, C.cyan, k1, 4, 'center');
  const k2 = E.outCubic(clamp((a - 26) / 16));
  const secs = (run.clearedAt / FPS).toFixed(1);
  text(`${run.bricks.length} bricks  ·  ${secs} s  ·  no ball lost`, W / 2, 740 + (1 - k2) * 20, 44, 600, C.amber, k2, 1, 'center');
  const k3 = E.outCubic(clamp((a - 70) / 20));
  text('bytepatterns · motion lab', W / 2, 1000, 32, 600, C.paper, k3 * 0.85, 3, 'center');
}

function drawRun(run, f, live) {
  const fr = run.frames[f];
  if (ctx.reset) ctx.reset();                              // every frame starts from a clean context state
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none'; ctx.shadowBlur = 0;
  background(f);
  const [sx, sy] = shake(run, f);
  ctx.setTransform(1, 0, 0, 1, sx, sy);
  arena(f, fr.fire);
  bricks(run, f);
  particles(run, f);
  paddle(run, f, fr);
  balls(run, f);
  callouts(run, f);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  hud(run, f, live);
  levelClear(run, f);
  // a soft fade at the very end, for the loop
  const fo = E.inCubic(prog(f, 588, 599)) * 0.6;
  if (!live && fo > 0) { ctx.fillStyle = `rgba(7,6,15,${fo})`; ctx.fillRect(0, 0, W, H); }
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.shadowBlur = 0; ctx.letterSpacing = '0px'; ctx.globalCompositeOperation = 'source-over';

RUN.byFrame = byFrame; RUN.bricksEv = bricksEv;

// ---- keyboard take-over (browser only; never in the renderer) ---------------
let LIVE = null, liveLast = -1;

    const k = e.key;
    if (k === 'Escape') { LIVE = null; return; }
    const left = k === 'ArrowLeft' || k === 'a' || k === 'A', right = k === 'ArrowRight' || k === 'd' || k === 'D';
    if (!left && !right) return;
    e.preventDefault();
    if (left) keys.l = true; if (right) keys.r = true;
    if (!LIVE) newLive();

  addEventListener('keyup', e => { const k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.l = false; if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.r = false; });
}
function newLive() {
  LIVE = makeGame(Object.assign({}, LEVEL, { maxBalls: 3 }));
  LIVE.live = true; LIVE.byFrame = new Map(); LIVE.bricksEv = []; LIVE.seen = 0; LIVE.relaunch = -1; liveLast = -1;
  LIVE.step(0); indexLive();
}
function indexLive() {
  const L = LIVE;
  for (; L.seen < L.events.length; L.seen++) { const e = L.events[L.seen]; e.id = L.seen; if (e.k === 'wall') continue;
    if (!L.byFrame.has(e.f)) L.byFrame.set(e.f, []); L.byFrame.get(e.f).push(e); if (e.k === 'brick') L.bricksEv.push(e); }

  const d = liveLast < 0 ? 1 : (i - liveLast + FRAMES) % FRAMES; liveLast = i;
  for (let n = 0; n < Math.min(d, 4); n++) {
    const L = LIVE;
    if (L.clearedAt >= 0 && L.f - L.clearedAt > 150) { newLive(); return; }
    if (L.clearedAt < 0 && !L.balls.some(b => b.on)) {       // missed: serve a new ball after a beat
      if (L.relaunch < 0) L.relaunch = L.f + 24;
      if (L.f >= L.relaunch) { L.balls.push({ x: L.px, y: G.PY - G.BR - 1, vx: 0.25 * L.speed, vy: -0.97 * L.speed, on: true, born: L.f }); L.relaunch = -1; }
    }
    L.step((keys.r ? 1 : 0) - (keys.l ? 1 : 0));
    indexLive();

  drawRun(LIVE, LIVE.f - 1, true);
}

function draw(f) {
  if (LIVE) { liveTick(f); return; }
  drawRun(RUN, f, false);
}

    const g = ac.createGain(); g.gain.setValueAtTime(0.0001, 0); g.gain.exponentialRampToValueAtTime(0.14, 0.02); g.gain.exponentialRampToValueAtTime(0.0001, 0.24);

      const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t2); g.gain.exponentialRampToValueAtTime(0.045, t2 + 0.3); g.gain.setValueAtTime(0.045, end - 1.2); g.gain.exponentialRampToValueAtTime(0.0001, end);

  strip(SAFE.r, 0, SAFE.r - feather, 0, SAFE.r - feather, SAFE.y, feather, SAFE.h);
  strip(0, SAFE.y, 0, SAFE.y + feather, SAFE.x, SAFE.y, SAFE.w, feather);
  strip(0, SAFE.b, 0, SAFE.b - feather, SAFE.x, SAFE.b - feather, SAFE.w, feather);
  vx.restore();
}
/** Series tag at the top of the safe area, e.g. MADE IN CODE · 04. */
function vTag(label, color, alpha = 1) {
  vText('MADE IN CODE', VL, 292, { size: 28, weight: 800, color, spacing: 5, alpha });
  vx.font = `800 28px ${FONT}`; vx.letterSpacing = '5px';
  const w = vx.measureText('MADE IN CODE').width; vx.letterSpacing = '0px';
  vText('·  ' + label, VL + w + 14, 292, { size: 28, weight: 600, color: 'rgba(255,255,255,0.72)', spacing: 3, alpha, max: VR - VL - w - 14 });
}
/** Big hook lines, left-aligned from y0; visible from frame 0, settles in a few frames. */
function vHook(v, lines, y0, { size = 84, lh = 1.08, color = '#FFFFFF', accent = null, weight = 800, spacing = -1.5, alpha = 1 } = {}) {
  const k = E.outExpo(prog(v, -6, 12));
  lines.forEach((ln, i) => {
    const kk = E.outExpo(prog(v, -12 + i * 2, 8 + i * 2));
    vText(ln, VL, y0 + i * size * lh + (1 - kk) * 30, { size, weight, spacing, color: accent && i === lines.length - 1 ? accent : color, alpha: alpha * Math.max(0.25, kk), max: VR - VL });
  });
  return k;
}
/** Closing card, the last 60 frames: piece title, "drawn in code · bytepatterns.com". l = frames into the card. */
function vEndCard(l, { title, line = '', ink = '#FFFFFF', dim = 'rgba(255,255,255,0.66)', accent = '#FFFFFF', scrim = '0,0,0', a = 0.84 }) {
  const k = E.outCubic(prog(l, 0, 12));
  vx.save(); vx.setTransform(1, 0, 0, 1, 0, 0);
  vx.fillStyle = `rgba(${scrim},${a * k})`; vx.fillRect(0, 0, VW, VH);
  vx.restore();
  const t1 = E.outExpo(prog(l, 3, 19)), t2 = E.outExpo(prog(l, 11, 27)), t3 = E.outExpo(prog(l, 19, 35));
  vx.fillStyle = accent; vx.globalAlpha = t1; vx.fillRect(VL, 742, 88 * t1, 7); vx.globalAlpha = 1;
  const size = vText(title, VL, 850 + (1 - t1) * 40, { size: 92, weight: 800, color: ink, spacing: -2, alpha: t1, max: VR - VL });
  const y2 = 850 + Math.max(size, 60) * 0.25 + 70;
  vx.font = `600 44px ${FONT}`;
  const lead = 'drawn in code  ·  ', lw = vx.measureText(lead).width;
  vText(lead, VL, y2 + (1 - t2) * 24, { size: 44, weight: 600, color: dim, alpha: t2 });
  vText('bytepatterns.com', VL + lw, y2 + (1 - t2) * 24, { size: 44, weight: 800, color: accent, alpha: t2 });
  if (line) vText(line, VL, y2 + 72 + (1 - t3) * 18, { size: 32, weight: 500, color: dim, alpha: t3, max: VR - VL });
}
/** Seeks a cut. The first frame a page draws is drawn twice: the very first read of a
 *  GPU-backed source canvas can come out a shade different from every later one. */
let vWarm = false;
function vSeek(draw, i, frames) {
  const f = Math.max(0, Math.min(frames - 1, Math.floor(i)));
  if (!vWarm) { vWarm = true; draw(f); }
  draw(f);
}
/** The soundtrack of a cut: the piece's own audio() spliced to the same segments as the picture. */
async function vAudio(segs, frames, { xf = 0.025, fadeOut = 0.6, extra = null } = {}) {
  const src = await renderAudio();
  const SR = 48000, dur = frames / FPS, ac = new OfflineAudioContext(2, Math.round(SR * dur), SR);
  const out = ac.createGain(); out.connect(ac.destination);
  out.gain.setValueAtTime(1, 0); out.gain.setValueAtTime(1, dur - fadeOut); out.gain.linearRampToValueAtTime(0, dur - 0.01);
  segs.forEach((s, k) => {
    const at = s.at / FPS, off = s.src / FPS, d = s.len / FPS;
    const pre = k === 0 ? 0 : Math.min(xf, off), post = k === segs.length - 1 ? 0 : xf;
    const b = ac.createBufferSource(), g = ac.createGain(); b.buffer = src;
    g.gain.setValueAtTime(pre ? 0 : 1, at - pre);
    if (pre) g.gain.linearRampToValueAtTime(1, at + pre);
    if (post) { g.gain.setValueAtTime(1, at + d - post); g.gain.linearRampToValueAtTime(0, at + d + post); }
    b.connect(g).connect(out); b.start(at - pre, off - pre, d + pre + post);
  });
  if (extra) extra(ac, out);
  const buf = await ac.startRendering();
  let peak = 0; for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) peak = Math.max(peak, Math.abs(d[i])); }
  if (peak > 0.9) for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] *= 0.9 / peak; }
  return buf;
}
/** A soft three-partial bell, for the closing card. */
function vChime(ac, dest, at, freq, vol = 0.08) {
  for (const [mul, v, dec] of [[1, 1, 1.8], [2.01, 0.35, 0.8], [3.02, 0.12, 0.4]]) {
    const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.value = freq * mul;
    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol * v, at + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, at + dec);
    o.connect(g).connect(dest); o.start(at); o.stop(at + dec + 0.05);
  }
}

/* VERTICAL CUT — this piece */
// One continuous take: the arena (840 px wide in the landscape piece, too) fills
// the phone under a score line; LEVEL CLEAR at 14.8 s, then the closing card.
const VFR = 540, VEND = VFR - 60;
const VA = { s: 0.85, x: 110, y: 520, L: G.L - 16, T: G.T - 6, W: G.R - G.L + 32 };   // arena crop (landscape px), its scale and where it lands
// the vignette is drawn once: a radial gradient filled fresh every frame can come out
// a level different depending on what the page drew before
const VGLOW = (() => { const c = document.createElement('canvas'); c.width = VW; c.height = VH;
  const g = c.getContext('2d', { willReadFrequently: true }), r = g.createRadialGradient(480, 900, 200, 480, 900, 1100);
  r.addColorStop(0, 'rgba(40,20,80,0.35)'); r.addColorStop(1, 'rgba(0,0,0,0.6)'); g.fillStyle = r; g.fillRect(0, 0, VW, VH); return c; })();
function vBackground(f) {
  vx.fillStyle = C.bg; vx.fillRect(0, 0, VW, VH);
  // the landscape grid, as pixel-aligned rects (anti-aliased hairlines drift by a level between redraws)
  vx.save(); vx.fillStyle = 'rgba(91,63,168,0.16)';
  const off = Math.round((f * 1.2) % 60);
  for (let x = off - 60; x < VW + 60; x += 60) vx.fillRect(x, 0, 1, VH);
  for (let y = off - 60; y < VH + 60; y += 60) vx.fillRect(0, y, VW, 1);
  vx.restore();
  vx.drawImage(VGLOW, 0, 0);
}
function vHud(v, f) {
  const fr = RUN.frames[f], k = E.outCubic(prog(v, 56, 70));
  if (k <= 0) return;
  const tSec = (fr.clearedAt >= 0 ? fr.clearedAt : f) / FPS, dy = (1 - k) * 20;
  vText('SCORE', VL, 372 + dy, { size: 28, weight: 700, color: C.dim, spacing: 6, alpha: k });
  vText(fmtScore(displayScore(RUN, f)), VL - 4, 462 + dy, { size: 80, weight: 800, color: C.paper, spacing: 1, alpha: k });
  vText('TIME', 470, 372 + dy, { size: 28, weight: 700, color: C.dim, spacing: 6, alpha: k });
  vText(tSec.toFixed(1) + ' s', 466, 462 + dy, { size: 80, weight: 800, color: C.paper, spacing: 1, alpha: k });
  vText('BRICKS', VR, 372 + dy, { size: 28, weight: 700, color: C.dim, spacing: 6, align: 'right', alpha: k });
  vText(String(fr.alive).padStart(2, '0'), VR, 462 + dy, { size: 80, weight: 800, color: fr.alive === 0 ? C.amber : C.cyan, spacing: 2, align: 'right', alpha: k });
}
function vClear(f) {
  const a = f - RUN.clearedAt;
  if (RUN.clearedAt < 0 || a < 0) return;
  vx.fillStyle = `rgba(7,6,15,${0.8 * E.outCubic(clamp(a / 12))})`; vx.fillRect(SAFE.x, 500, SAFE.w, SAFE.b - 500);
  vx.save();
  vx.setTransform(VA.s, 0, 0, VA.s, VA.x - VA.s * VA.L, VA.y - VA.s * VA.T);
  vx.globalCompositeOperation = 'lighter';
  for (let n = 0; n < 7; n++) {                            // the same fireworks as the landscape card
    const t0 = n * 9, age = a - t0; if (age < 0 || age > 60) continue;
    const r = mulberry32(900 + n), cx = lerp(G.L + 120, G.R - 120, r()), cy = 220 + r() * 260;
    vx.fillStyle = [C.magenta, C.cyan, C.amber][n % 3];
    for (let k = 0; k < 40; k++) { const ang = k / 40 * Math.PI * 2 + r() * 0.1, sp = 380 + r() * 160, t = age / FPS;
      vx.globalAlpha = Math.max(0, 1 - t / 2); vx.fillRect(cx + Math.cos(ang) * sp * t - 2.5, cy + Math.sin(ang) * sp * t + 260 * t * t - 2.5, 5, 5); }
  }
  vx.restore();
  const gone = 1 - E.inCubic(prog(f, VEND - 4, VEND + 8));        // makes room for the closing card
  const k = clamp(E.outBack(clamp(a / 14))) * gone, s = lerp(1.3, 1, E.outExpo(clamp(a / 14)));
  vx.save(); vx.translate(480, 860); vx.scale(s, s);
  glowText('LEVEL', 0, -70, 150, 900, C.paper, C.magenta, k, 12, 'center');
  glowText('CLEAR', 0, 80, 150, 900, C.paper, C.magenta, k, 12, 'center');
  vx.restore();
  const k1 = E.outCubic(clamp((a - 10) / 14)) * gone;
  vText(`${RUN.bricks.length} bricks  ·  ${(RUN.clearedAt / FPS).toFixed(1)} s  ·  no ball lost`, 480, 1060 + (1 - k1) * 20, { size: 38, weight: 600, color: C.amber, align: 'center', alpha: k1, max: VR - VL });
}
function vDraw(v) {
  const f = Math.min(FRAMES - 1, v), fr = RUN.frames[f];
  // the arena exactly as the landscape piece draws it, on the landscape canvas ...
  if (ctx.reset) ctx.reset();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none'; ctx.shadowBlur = 0;
  background(f);
  const [sx, sy] = shake(RUN, f);
  ctx.setTransform(1, 0, 0, 1, sx, sy);
  arena(f, fr.fire); bricks(RUN, f); particles(RUN, f); paddle(RUN, f, fr); balls(RUN, f); callouts(RUN, f);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  // ... then scaled onto the phone
  vReset();
  vBackground(f);
  vx.save();
  vx.beginPath(); vx.rect(SAFE.x, 500, SAFE.w, SAFE.b - 500); vx.clip();
  vx.drawImage(cv, VA.L, VA.T, VA.W, H - VA.T, VA.x, VA.y, VA.W * VA.s, (H - VA.T) * VA.s);
  vx.restore();
  vShade('7,6,15');
  vTag('NEON BREAKOUT', C.magenta);
  if (v < 70) vHook(v, ['This game', 'plays itself.'], 388, { size: 88, color: C.paper, accent: C.cyan, alpha: 1 - E.inCubic(prog(v, 56, 70)) });
  vHud(v, f);
  const main = ctx; ctx = vx;
  try { vClear(f); } finally { ctx = main; }
  if (v >= VEND) vEndCard(v - VEND, { title: 'Neon Breakout', line: 'deterministic physics, every brick cleared, no ball lost',
    ink: C.paper, dim: 'rgba(243,240,255,0.66)', accent: C.cyan, scrim: '7,6,15' });
  vReset();
}

window.__motion = {
  title: 'Neon Breakout',
  description: 'A neon Breakout level that plays itself: deterministic physics, multi-ball, a fire-ball and every brick cleared.',
  fps: FPS, width: W, height: H, frames: FRAMES,
  poster: 214,
  gifStart: 5,
  seek(i) { draw(Math.max(0, Math.min(FRAMES - 1, Math.floor(i)))); },
  audio: renderAudio,
  variants: {
    vertical: {
      width: VW, height: VH, frames: VFR, canvas: vcv,
      poster: 214, gifStart: 5,
      seek(i) { vSeek(vDraw, i, VFR); },
      audio: () => vAudio([{ at: 0, src: 0, len: VFR }], VFR, { fadeOut: 1.0 }),
    },
  },
  stats: { clearedAt: RUN.clearedAt, lost: RUN.lost, score: RUN.score },
};

/* ==========================================================================
   PLAYER — identical in every piece; keep as is.
   Autoplays and loops, starts sound on the first click, ?frame=N pauses on a
   frame, ?variant=vertical plays the vertical cut (if the piece has one).
   When the renderer sets window.__MOTION_RENDER__ it stays out of the way.
   ========================================================================== */
(function player() {
  const btn = document.getElementById('sound'), q = new URLSearchParams(location.search);
  let M = window.__motion;
  const V = !window.__MOTION_RENDER__ && M.variants && M.variants[q.get('variant')];
  if (V) {                                                // show the variant's own canvas instead
    M = Object.assign({}, M, V);
    V.canvas.style.cssText = `width:min(100vw,calc(100vh*${V.width}/${V.height}));height:auto;aspect-ratio:${V.width}/${V.height}`;
    document.querySelector('canvas').replaceWith(V.canvas);
  }
  const dur = M.frames / M.fps;
  if (window.__MOTION_RENDER__) { btn.hidden = true; M.seek(0); return; }
  if (q.has('frame')) { btn.hidden = true; M.seek(+q.get('frame') || 0); return; }
  let t0 = performance.now(), ac = null, src = null, buf = null, paused = false, pausedAt = 0;
  const clock = () => ac && src ? (ac.currentTime - t0) : (performance.now() - t0) / 1000;
  function loop() {
    if (!paused) M.seek(Math.floor(((clock() % dur) + dur) % dur * M.fps));
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  btn.addEventListener('click', async () => {
    if (src) { src.stop(); src = null; btn.textContent = 'Click for sound'; t0 = performance.now(); return; }
    btn.textContent = 'Loading sound…';
    ac = ac || new AudioContext({ sampleRate: 48000 });
    buf = buf || await M.audio();
    await ac.resume();
    src = ac.createBufferSource(); src.buffer = buf; src.loop = true; src.connect(ac.destination);
    t0 = ac.currentTime + 0.05; src.start(t0);        // picture restarts from frame 0 in sync with the sound
    btn.textContent = 'Sound on — click to mute';
  });
  addEventListener('keydown', e => {
    if (e.code !== 'Space') return;
    e.preventDefault(); paused = !paused;
    if (ac) paused ? ac.suspend() : ac.resume();
    if (!ac) { if (paused) pausedAt = performance.now(); else t0 += performance.now() - pausedAt; }
  });
})();
</script>
