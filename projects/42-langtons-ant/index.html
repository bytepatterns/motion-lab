<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="teambytepatterns">
<meta name="description" content="Langton's ant, run for real: one ant, two rules, about ten thousand steps of chaos, and then a diagonal highway that repeats every 104 steps forever.">
<title>Langton's Ant — motion-lab</title>
<style>
  /* Player chrome. The piece itself lives entirely in the canvas. */
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; font: 500 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; }
  canvas { display: block; width: min(100vw, calc(100vh * 16 / 9)); height: auto; aspect-ratio: 16 / 9; }
  #sound { position: fixed; left: 16px; bottom: 16px; padding: 8px 14px; border: 1px solid rgba(255,255,255,.35); border-radius: 999px;
           background: rgba(0,0,0,.55); color: #fff; font: inherit; cursor: pointer; }
  #sound[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080" aria-label="A single ant walks on a dark grid, lighting and unlighting squares; the camera pulls back as a chaotic blob of lit squares grows for thousands of steps, until the ant suddenly starts building a straight diagonal road"></canvas>
<button id="sound" type="button">Click for sound</button>
<script>
'use strict';
/* ==========================================================================
   PIECE — Langton's Ant.
   One ant on an unbounded grid of squares, facing up. Every step:
     on an unlit square it turns 90 degrees right, on a lit square 90 degrees
     left; it flips the square it stands on and steps forward one square.
   Nothing else. For about ten thousand steps the lit squares grow into a
   blob with no visible order; then the ant falls into a cycle of 104 steps
   that moves it two squares diagonally, and it builds that "highway" forever.
   The run is simulated once (16,000 steps on a 400 x 400 grid, far from any
   edge). The step where the highway starts is not typed in: it is found in
   the log, as the first step after which every turn repeats 104 steps later.
   Each frame replays the log up to its own step count, so seek(i) is pure.
   ========================================================================== */
const W = 1920, H = 1080, FPS = 30;
const cv = document.getElementById('stage');
const ctx = cv.getContext('2d', { willReadFrequently: true });   // CPU raster: identical pixels on every redraw
const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
const MONO = 'ui-monospace, "Cascadia Code", Consolas, Menlo, monospace';

// ---- helpers -------------------------------------------------------------
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (f, a, b) => clamp((f - a) / (b - a));
const smooth = t => t * t * (3 - 2 * t);
const E = {
  inCubic: t => t * t * t,
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inOutCubic: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outExpo: t => t === 1 ? 1 : 1 - Math.pow(2, -10 * t),
  inExpo: t => t === 0 ? 0 : Math.pow(2, 10 * t - 10),
  inOutExpo: t => t === 0 ? 0 : t === 1 ? 1 : t < .5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2,
  outBack: t => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2),
};
/** Canvas text; `max` shrinks the size until the line fits. Returns the width drawn. */
function text(g, str, x, y, { size = 40, weight = 600, color = '#fff', alpha = 1, spacing = 0, align = 'left', fam = FONT, base = 'alphabetic', max = 0 } = {}) {
  if (alpha <= 0.002 || !str) return 0;
  g.font = `${weight} ${size}px ${fam}`; g.letterSpacing = spacing + 'px';
  if (max) { const w0 = g.measureText(str).width; if (w0 > max) { size *= max / w0; g.font = `${weight} ${size}px ${fam}`; } }
  g.textAlign = align; g.textBaseline = base;
  const a0 = g.globalAlpha; g.globalAlpha = a0 * alpha; g.fillStyle = color;
  g.fillText(str, x, y);
  const w = g.measureText(str).width;
  g.globalAlpha = a0; g.letterSpacing = '0px';
  return w;
}
const measure = (g, str, size, weight = 800, fam = FONT, spacing = 0) => { g.font = `${weight} ${size}px ${fam}`; g.letterSpacing = spacing + 'px'; const w = g.measureText(str).width; g.letterSpacing = '0px'; return w; };
const env = (f, a, b, fin = 12, fout = 10) => {
  const i = E.outCubic(prog(f, a, a + fin)), o = 1 - E.inCubic(prog(f, b - fout, b));
  return [Math.min(i, o), (1 - i) * 24 - (1 - o) * 10];
};

// ---- palette -------------------------------------------------------------
const C = {
  bg: '#0B0E14', bgRGB: '11,14,20', paper: '#F1EEE6', dim: 'rgba(241,238,230,0.62)', faint: 'rgba(241,238,230,0.14)',
  trail: 'rgba(241,238,230,0.07)', old: '#2F9E96', warm: '#5CD6CB', hot: '#F4FFFD', road: '#FFC857', ant: '#FF5E6C', antRGB: '255,94,108',
};

// ---- the simulation, run once --------------------------------------------------------------
const N = 400, MAXS = 16000, PERIOD = 104;
const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];          // up, right, down, left (screen y points down)
const SIM = (() => {
  const grid = new Uint8Array(N * N), cell = new Int32Array(MAXS), right = new Uint8Array(MAXS);
  const ax = new Int16Array(MAXS + 1), ay = new Int16Array(MAXS + 1), ad = new Uint8Array(MAXS + 1);
  const first = new Int32Array(N * N).fill(-1), order = [];
  let x = N >> 1, y = N >> 1, d = 0;
  ax[0] = x; ay[0] = y; ad[0] = d;
  for (let k = 0; k < MAXS; k++) {
    const o = y * N + x, lit = grid[o];
    d = lit ? (d + 3) & 3 : (d + 1) & 3;                 // unlit: right, lit: left
    grid[o] ^= 1; cell[k] = o; right[k] = lit ? 0 : 1;
    if (first[o] < 0) { first[o] = k; order.push(o); }
    x += DX[d]; y += DY[d];
    ax[k + 1] = x; ay[k + 1] = y; ad[k + 1] = d;
  }
  // the highway: the first step from which every turn equals the turn 104 steps later
  let h = MAXS - PERIOD;
  while (h > 0 && right[h - 1] === right[h - 1 + PERIOD]) h--;
  return { cell, right, ax, ay, ad, first, order: Int32Array.from(order), highway: h,
    shift: [ax[h + PERIOD] - ax[h], ay[h + PERIOD] - ay[h]] };
})();
const HW = SIM.highway;
const fmt = n => Math.floor(n).toLocaleString('en-US');

/** Lit squares and last-flip steps after s whole steps (replayed from the log). */
const LIT = new Uint8Array(N * N), LAST = new Int32Array(N * N);
function stateAt(s) {
  const ord = SIM.order;
  for (let q = 0; q < ord.length; q++) { LIT[ord[q]] = 0; LAST[ord[q]] = -1; }
  let lit = 0;
  for (let k = 0; k < s; k++) { const o = SIM.cell[k]; LIT[o] ^= 1; lit += LIT[o] ? 1 : -1; LAST[o] = k; }
  return lit;
}
/** Bounding box (in cells) of every square visited before step s. */
function bboxAt(s) {
  let x0 = N, y0 = N, x1 = 0, y1 = 0;
  for (let k = 0; k <= s; k++) { const x = SIM.ax[k], y = SIM.ay[k]; if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  return { x0, y0, x1: x1 + 1, y1: y1 + 1 };
}

// ---- timeline -------------------------------------------------------------------------------
// rule0: the first step; fast: steps start to accelerate; road: the step count reaches the
// highway; ramp: frames for the road speed to settle; calm: the finale; end: the closing card.
function buildTL(o) {
  const TL = Object.assign({ slowRate: 3, roadRate: PERIOD / 6, ramp: 16 }, o);
  TL.s0 = (TL.fast - TL.rule0) / TL.slowRate;
  TL.caps = [
    [TL.rule0 - 6, TL.rule0 + 96, 'Unlit square: turn right.|Lit square: turn left.'],
    [TL.rule0 + 90, TL.fast + 12, 'Flip the square,|step forward. Repeat.'],
    [TL.fast + 8, TL.road - 4, `${fmt(Math.round(HW / 1000) * 1000)} steps|of pure chaos.`],
    [TL.road, TL.calm, 'Then it builds a road|and never stops.'],
  ];
  return TL;
}
/** Steps done by frame f, as a float (the fraction animates the slow steps). */
function stepsAt(TL, f) {
  if (f < TL.rule0) return 0;
  if (f < TL.fast) return (f - TL.rule0) / TL.slowRate;
  if (f < TL.road) {
    const p = prog(f, TL.fast, TL.road), q = 1 - (1 - p) * (1 - p);
    return Math.exp(lerp(Math.log(TL.s0), Math.log(HW), q));
  }
  const x = f - TL.road, R = TL.ramp, v = TL.roadRate;
  return Math.min(MAXS - 1, HW + (x < R ? v * x * x / (2 * R) : v * (x - R / 2)));
}
/** The frame at which step count s is reached (for the soundtrack). */
function frameOfStep(TL, s) {
  if (s <= TL.s0) return TL.rule0 + s * TL.slowRate;
  if (s < HW) { const q = Math.log(s / TL.s0) / Math.log(HW / TL.s0), p = 1 - Math.sqrt(1 - q); return TL.fast + p * (TL.road - TL.fast); }
  const R = TL.ramp, v = TL.roadRate, d = s - HW;
  return TL.road + (d < v * R / 2 ? Math.sqrt(2 * R * d / v) : d / v + R / 2);
}

// ---- camera: three fitted views, eased in log scale ---------------------------------------------
function fit(G, b) {
  const cs = Math.min(G.view.w / (b.x1 - b.x0), G.view.h / (b.y1 - b.y0));
  return { cs, cx: (b.x0 + b.x1) / 2, cy: (b.y0 + b.y1) / 2 };
}
function camFor(G) {
  const TL = G.TL;
  return {
    K0: { cs: G.cs0, cx: N / 2 + 0.5, cy: N / 2 + 0.5 },
    K1: fit(G, bboxAt(HW)),
    K2: fit(G, bboxAt(Math.floor(stepsAt(TL, TL.end)))),
  };
}
function camAt(G, f) {
  const TL = G.TL, K = G.K || (G.K = camFor(G));
  const mix = (A, B, t) => ({ cs: Math.exp(lerp(Math.log(A.cs), Math.log(B.cs), t)), cx: lerp(A.cx, B.cx, t), cy: lerp(A.cy, B.cy, t) });
  const a = E.inOutCubic(prog(f, TL.fast - 10, TL.road - 20)), b = E.inOutCubic(prog(f, TL.road + 10, TL.calm + 10));
  return mix(mix(K.K0, K.K1, a), K.K2, b);
}

// ---- drawing ------------------------------------------------------------------------------
function board(g, G, f) {
  const TL = G.TL, s = stepsAt(TL, f), slow = f < TL.fast;
  const k = Math.floor(s), fr = s - k;
  const done = slow ? k + (fr >= 0.45 ? 1 : 0) : k;           // in the slow phase the flip lands mid-step
  const lit = stateAt(done);
  const cam = camAt(G, f), cs = cam.cs, ox = G.view.cx - cam.cx * cs, oy = G.view.cy - cam.cy * cs;
  const speed = Math.max(1, stepsAt(TL, f + 1) - s), heat = Math.max(2, speed * 10);
  // faint grid while the squares are big
  const ga = clamp((cs - 11) / 12);
  if (ga > 0.01) {
    g.save(); g.strokeStyle = C.faint; g.globalAlpha = ga; g.lineWidth = 1;
    const i0 = Math.floor(-ox / cs), i1 = Math.ceil((G.w - ox) / cs), j0 = Math.floor(-oy / cs), j1 = Math.ceil((G.h - oy) / cs);
    g.beginPath();
    for (let i = i0; i <= i1; i++) { const x = Math.round(ox + i * cs) + 0.5; g.moveTo(x, 0); g.lineTo(x, G.h); }
    for (let j = j0; j <= j1; j++) { const y = Math.round(oy + j * cs) + 0.5; g.moveTo(0, y); g.lineTo(G.w, y); }
    g.stroke(); g.restore();
  }
  // squares: visited-but-unlit (faint), lit old, lit recent, just flipped, road
  const P = [new Path2D(), new Path2D(), new Path2D(), new Path2D(), new Path2D()];
  const ins = cs >= 7 ? Math.max(1, cs * 0.08) : 0, sz = cs - 2 * ins;
  const ord = SIM.order, first = SIM.first;
  for (let q = 0; q < ord.length; q++) {
    const o = ord[q]; if (first[o] >= done) break;
    const i = o % N, j = (o - i) / N, x = ox + i * cs + ins, y = oy + j * cs + ins;
    if (x > G.w || y > G.h || x + sz < 0 || y + sz < 0) continue;
    let b;
    if (!LIT[o]) b = 0;
    else if (LAST[o] >= HW) b = 4;
    else { const age = done - 1 - LAST[o]; b = age < heat ? 3 : age < heat * 30 ? 2 : 1; }
    P[b].rect(x, y, sz, sz);
  }
  g.save();
  g.fillStyle = C.trail; g.fill(P[0]);
  g.fillStyle = C.old; g.fill(P[1]);
  g.fillStyle = C.warm; g.fill(P[2]);
  g.fillStyle = C.hot; g.fill(P[3]);
  g.fillStyle = C.road; g.fill(P[4]);
  g.restore();
  // the ant: turns, then moves, while the steps are slow; a glowing dot once they are fast
  let px, py, ang;
  if (slow) {
    const t = E.inOutCubic(prog(fr, 0.5, 1)), r = E.inOutCubic(prog(fr, 0, 0.4));
    const d0 = SIM.ad[k], d1 = SIM.ad[k + 1], turn = ((d1 - d0 + 4) % 4) === 1 ? 1 : -1;
    px = lerp(SIM.ax[k], SIM.ax[k + 1], t); py = lerp(SIM.ay[k], SIM.ay[k + 1], t);
    ang = (d0 + (k === 0 && f < TL.rule0 ? 0 : turn * r)) * Math.PI / 2;
  } else { px = SIM.ax[k]; py = SIM.ay[k]; ang = SIM.ad[k] * Math.PI / 2; }
  const sx = ox + (px + 0.5) * cs, sy = oy + (py + 0.5) * cs;
  g.save();
  const glow = g.createRadialGradient(sx, sy, 0, sx, sy, Math.max(18, cs * 1.6));
  glow.addColorStop(0, `rgba(${C.antRGB},0.55)`); glow.addColorStop(1, `rgba(${C.antRGB},0)`);
  g.fillStyle = glow; g.fillRect(sx - 60, sy - 60, 120, 120);
  const r0 = Math.max(4.5, cs * 0.36);
  g.translate(sx, sy); g.rotate(ang);
  g.fillStyle = C.ant; g.beginPath();
  if (cs >= 9) { g.moveTo(0, -r0 * 1.15); g.lineTo(r0 * 0.9, r0 * 0.8); g.lineTo(0, r0 * 0.4); g.lineTo(-r0 * 0.9, r0 * 0.8); g.closePath(); }
  else g.arc(0, 0, r0, 0, Math.PI * 2);
  g.fill(); g.restore();
  return { s, done, lit, cs };
}
function caption(g, G, f) {
  for (const [t0, t1, str] of G.TL.caps) {
    const [a, dy] = env(f, t0, t1, 12, 10); if (a <= 0) continue;
    const [p1, p2] = str.split('|');
    if (G.capTwo) {
      text(g, p1, G.capX, G.capY + dy, { size: G.cap, weight: 850, color: C.paper, spacing: -1, alpha: a, max: G.capMax });
      text(g, p2, G.capX, G.capY + G.cap * 1.14 + dy, { size: G.cap, weight: 850, color: C.road, spacing: -1, alpha: a, max: G.capMax });
    } else {
      const w1 = text(g, p1 + ' ', G.capX, G.capY + dy, { size: G.cap, weight: 850, color: C.paper, spacing: -1, alpha: a });
      text(g, p2, G.capX + w1, G.capY + dy, { size: G.cap, weight: 850, color: C.road, spacing: -1, alpha: a });
    }
  }
}
function plate(g, x, y, w, size, alpha) {
  g.save(); g.globalAlpha = alpha; g.fillStyle = `rgba(${C.bgRGB},0.78)`; g.fillRect(x - 16, y - size * 1.05, w + 32, size * 1.5); g.restore();
}
function readout(g, G, f, st) {
  const TL = G.TL, [a] = env(f, TL.rule0 - 10, TL.end + 10, 12, 12);
  if (a <= 0) return;
  const s1 = 'step ', s2 = fmt(st.done), w1 = measure(g, s1, G.fo, 700, MONO), w2 = measure(g, s2, G.fo, 800, MONO);
  plate(g, G.foX, G.foY, w1 + w2, G.fo, a);
  text(g, s1, G.foX, G.foY, { size: G.fo, weight: 700, color: C.dim, fam: MONO, alpha: a });
  text(g, s2, G.foX + w1, G.foY, { size: G.fo, weight: 800, color: C.paper, fam: MONO, alpha: a });
  const road = E.outCubic(prog(f, TL.road + 30, TL.road + 50));
  const r1 = `${fmt(st.lit)} lit squares`, r2 = `repeats every ${PERIOD} steps`;
  for (const [str, al, col] of [[r1, a * (1 - road), C.paper], [r2, a * road, C.road]]) {
    if (al <= 0.01) continue;
    const w = measure(g, str, G.fo, 700, MONO), x = G.pcAlign === 'right' ? G.pcX - w : G.pcX;
    plate(g, x, G.pcY, w, G.fo, al);
    text(g, str, x, G.pcY, { size: G.fo, weight: 700, color: col, fam: MONO, alpha: al });
  }
}
function finale(g, G, f) {
  const TL = G.TL, k1 = E.outCubic(prog(f, TL.calm, TL.calm + 18)), k2 = E.outCubic(prog(f, TL.calm + 10, TL.calm + 28));
  if (k1 <= 0) return;
  const out = 1 - E.inCubic(prog(f, TL.end - 6, TL.end + 12));
  g.save(); g.fillStyle = `rgba(${C.bgRGB},${0.62 * k1 * out})`; g.fillRect(0, G.fnY - G.fn * 1.15, G.w, G.fn * 2.7); g.restore();
  text(g, 'Two rules.', G.fnX, G.fnY, { size: G.fn, weight: 900, color: C.paper, spacing: -2, align: G.fnAlign, alpha: k1 * out, max: G.fnMax });
  text(g, G.fnTwo, G.fnX, G.fnY + G.fn * 1.1, { size: G.fn, weight: 900, color: C.road, spacing: -2, align: G.fnAlign, alpha: k2 * out, max: G.fnMax });
}
function scene(g, G, f) {
  const st = board(g, G, f);
  for (const [y0, y1] of G.scrims) {
    const gr = g.createLinearGradient(0, y0, 0, y1);
    gr.addColorStop(0, `rgba(${C.bgRGB},0.9)`); gr.addColorStop(1, `rgba(${C.bgRGB},0)`);
    g.fillStyle = gr; g.fillRect(0, Math.min(y0, y1), G.w, Math.abs(y1 - y0));
  }
  caption(g, G, f); readout(g, G, f, st); finale(g, G, f);
}

// ---- landscape picture ------------------------------------------------------------------
const TLL = buildTL({ rule0: 60, fast: 240, road: 540, calm: 680, end: 730 });
const FRAMES = TLL.end + 72;
const GL = { TL: TLL, w: W, h: H, cs0: 34, view: { cx: 960, cy: 600, w: 1560, h: 600 }, scrims: [[0, 300], [H, 930]],
  capX: 120, capY: 216, cap: 52, capTwo: false, capMax: 1680,
  fo: 30, foX: 120, foY: 1004, pcX: 1800, pcY: 1004, pcAlign: 'right',
  fn: 96, fnX: W / 2, fnY: 520, fnAlign: 'center', fnMax: 1680, fnTwo: 'Chaos, then a highway.' };
function hookL(f) {
  const o = 1 - E.inCubic(prog(f, TLL.rule0 - 12, TLL.rule0 + 4));
  if (o <= 0) return;
  const k = E.outExpo(prog(f, -8, 10)), k2 = E.outBack(prog(f, -6, 12));
  ctx.save(); ctx.fillStyle = `rgba(${C.bgRGB},${0.72 * o})`; ctx.fillRect(0, 400, W, 330); ctx.restore();
  text(ctx, 'One ant. Two rules.', W / 2, 540 + (1 - k) * 30, { size: 108, weight: 900, color: C.paper, spacing: -3, align: 'center', alpha: o * Math.max(0.3, k) });
  text(ctx, 'Chaos, then a highway.', W / 2, 670 + (1 - clamp(k2)) * 30, { size: 108, weight: 900, color: C.road, spacing: -3, align: 'center', alpha: o * Math.max(0.3, clamp(k2)) });
}
function draw(f) {
  if (ctx.reset) ctx.reset();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none'; ctx.shadowBlur = 0;
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  const T = TLL, endK = E.inOutCubic(prog(f, T.end, T.end + 20)), a = 1 - endK;
  scene(ctx, GL, f);
  text(ctx, 'COMPUTATION  ·  LANGTON’S ANT', 120, 104, { size: 26, weight: 600, color: C.dim, spacing: 5, alpha: a });
  text(ctx, 'BYTEPATTERNS', 1800, 104, { size: 26, weight: 600, color: C.dim, spacing: 5, align: 'right', alpha: a });
  hookL(f);
  if (endK > 0) {
    ctx.fillStyle = `rgba(${C.bgRGB},${0.86 * endK})`; ctx.fillRect(0, 0, W, H);
    const k1 = E.outCubic(prog(f, T.end + 6, T.end + 28)), k2 = E.outCubic(prog(f, T.end + 16, T.end + 38)), k3 = E.outCubic(prog(f, T.end + 26, T.end + 48));
    text(ctx, 'Langton’s Ant', W / 2, 500 + (1 - k1) * 30, { size: 140, weight: 850, color: C.paper, spacing: -3, align: 'center', alpha: k1 });
    text(ctx, `two rules  ·  ${fmt(HW)} steps of chaos  ·  then a highway`, W / 2, 580 + (1 - k2) * 20, { size: 42, weight: 500, color: C.road, align: 'center', alpha: k2 });
    text(ctx, 'drawn in code  ·  bytepatterns.com', W / 2, 1000, { size: 32, weight: 600, color: C.paper, spacing: 3, align: 'center', alpha: k3 * 0.8 });
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.letterSpacing = '0px';
}

// ---- sound: a tick per step while they are slow, a rising hiss through the chaos, a beat per highway cycle ----
async function renderAudio(TL = TLL, frames = FRAMES) {
  const SR = 48000, dur = frames / FPS, LEN = Math.round(SR * dur);
  const ac = new OfflineAudioContext(2, LEN, SR);
  const at = fr => fr / FPS;
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -16; comp.ratio.value = 3; comp.attack.value = 0.005; comp.release.value = 0.25;
  const master = ac.createGain(); master.gain.value = 0.9; master.connect(comp).connect(ac.destination);
  master.gain.setValueAtTime(0.9, dur - 1.0); master.gain.linearRampToValueAtTime(0.0001, dur - 0.02);
  const rnd = mulberry32(0x42A11);
  const ir = ac.createBuffer(2, SR * 2.2, SR);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let k = 0; k < d.length; k++) d[k] = (rnd() * 2 - 1) * Math.pow(1 - k / d.length, 2.8); }
  const verb = ac.createConvolver(); verb.buffer = ir; const vg = ac.createGain(); vg.gain.value = 0.3; verb.connect(vg).connect(master);
  const noise = ac.createBuffer(1, SR * 2, SR); { const d = noise.getChannelData(0); for (let k = 0; k < d.length; k++) d[k] = rnd() * 2 - 1; }
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  const pluck = (t0, m, amp, pan, dec = 0.35, type = 'triangle') => {
    const o = ac.createOscillator(), g = ac.createGain(), p = ac.createStereoPanner(); o.type = type; o.frequency.value = hz(m);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(amp, t0 + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dec);
    p.pan.value = pan; o.connect(g).connect(p); p.connect(master); p.connect(verb); o.start(t0); o.stop(t0 + dec + 0.05);
  };
  const pad = (t0, t1, notes, amp, cutoff) => {
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = cutoff; lp.Q.value = 1.2; lp.connect(master); lp.connect(verb);
    notes.forEach((m, i) => { for (const det of [-7, 7]) {
      const o = ac.createOscillator(), g = ac.createGain(), p = ac.createStereoPanner(); o.type = 'sawtooth'; o.frequency.value = hz(m); o.detune.value = det;
      p.pan.value = (i / Math.max(1, notes.length - 1) - 0.5) * 0.9 * Math.sign(det);
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(amp, t0 + 1.2); g.gain.setValueAtTime(amp, Math.max(t0 + 1.2, t1 - 0.8)); g.gain.exponentialRampToValueAtTime(0.0001, t1 + 0.4);
      o.connect(g).connect(p).connect(lp); o.start(t0); o.stop(t1 + 0.45); } });
  };
  // pads: an unresolved cluster under the chaos, a plain major chord under the road
  pad(at(TL.rule0 - 20), at(TL.road + 6), [50, 57, 60, 64], 0.014, 900);
  pad(at(TL.road), at(TL.end + 50), [50, 57, 62, 66, 69], 0.016, 1600);
  // slow steps: a right turn rings high, a left turn low
  for (let k = 0; ; k++) {
    const fr = frameOfStep(TL, k + 0.45); if (fr >= TL.fast) break;
    pluck(at(fr), SIM.right[k] ? 81 : 74, 0.07, SIM.right[k] ? 0.25 : -0.25, 0.3);
  }
  // fast steps: one tick per frame whose pitch is the share of right turns in that frame, and a rising hiss
  const PENTA = [0, 2, 4, 7, 9];
  for (let fr = TL.fast; fr < TL.road; fr++) {
    const s0 = Math.floor(stepsAt(TL, fr)), s1 = Math.max(s0 + 1, Math.floor(stepsAt(TL, fr + 1)));
    let r = 0; for (let k = s0; k < s1; k++) r += SIM.right[k];
    const idx = clamp(Math.floor(r / (s1 - s0) * 10), 0, 9), m = 69 + 12 * Math.floor(idx / 5) + PENTA[idx % 5];
    pluck(at(fr), m, 0.028 + 0.012 * prog(fr, TL.fast, TL.road), (rnd() - 0.5) * 1.2, 0.12, 'sine');
  }
  { const s = ac.createBufferSource(); s.buffer = noise; s.loop = true; const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.1;
    bp.frequency.setValueAtTime(400, at(TL.fast)); bp.frequency.exponentialRampToValueAtTime(4200, at(TL.road - 30)); bp.frequency.exponentialRampToValueAtTime(900, at(TL.road));
    const g = ac.createGain(); g.gain.setValueAtTime(0.0001, at(TL.fast)); g.gain.exponentialRampToValueAtTime(0.05, at(TL.road - 40)); g.gain.exponentialRampToValueAtTime(0.0001, at(TL.road + 4));
    s.connect(bp).connect(g).connect(master); s.start(at(TL.fast)); s.stop(at(TL.road + 6)); }
  // the road: every 104-step cycle is one beat; a two-note figure, and a low note every fourth cycle
  for (let c = 0; ; c++) {
    const fr = frameOfStep(TL, HW + c * PERIOD); if (fr >= TL.end + 20) break;
    const t0 = at(fr);
    pluck(t0, c % 2 ? 78 : 81, 0.05, c % 2 ? 0.3 : -0.3, 0.25);
    if (c % 4 === 0) {
      const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.setValueAtTime(hz(38) * 2, t0); o.frequency.exponentialRampToValueAtTime(hz(38), t0 + 0.08);
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.22, t0 + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.4);
      o.connect(g).connect(master); o.start(t0); o.stop(t0 + 0.45);
    }
  }
  [74, 78, 81, 86].forEach((m, i) => pluck(at(TL.calm) + i * 0.09, m, 0.06, -0.3 + i * 0.2, 1.6, 'sine'));
  [81, 86, 90, 93].forEach((m, i) => pluck(at(TL.end + 10 + i * 6), m, 0.055, -0.45 + i * 0.3, 1.8, 'sine'));
  const buf = await ac.startRendering();
  let peak = 0; for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let k = 0; k < d.length; k++) peak = Math.max(peak, Math.abs(d[k])); }
  const norm = 0.85 / Math.max(peak, 1e-6);                          // every piece peaks at the same level
  for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let k = 0; k < d.length; k++) d[k] *= norm; }
  return buf;
}

/* ==========================================================================
   VERTICAL CUT — shared block, identical in every piece.
   1080x1920 for Reels, Shorts and TikTok (__motion.variants.vertical). The
   piece's own scene code is re-used and recomposed for a phone: everything a
   viewer must read stays inside the area no platform covers (x 60..900,
   y 230..1400); outside it there is only dimmed texture.
   ========================================================================== */
const VW = 1080, VH = 1920, SAFE = { x: 60, y: 230, w: 840, h: 1170, r: 900, b: 1400 };
const vcv = document.createElement('canvas'); vcv.width = VW; vcv.height = VH;
const vx = vcv.getContext('2d', { willReadFrequently: true });   // CPU raster: identical pixels on every redraw
const VL = 96, VR = 864;                                          // text column inside the safe area

function vReset() {
  vx.setTransform(1, 0, 0, 1, 0, 0); vx.globalAlpha = 1; vx.globalCompositeOperation = 'source-over';
  vx.filter = 'none'; vx.shadowBlur = 0; vx.shadowColor = 'transparent'; vx.letterSpacing = '0px'; vx.setLineDash([]);
  vx.textAlign = 'left'; vx.textBaseline = 'alphabetic'; vx.lineCap = 'butt'; vx.lineJoin = 'miter';
}
/** Canvas text on the vertical frame; `max` shrinks the size until the line fits. */
function vText(str, x, y, { size = 40, weight = 700, color = '#FFFFFF', align = 'left', spacing = 0, alpha = 1, fam = FONT, max = 0 } = {}) {
  if (alpha <= 0.002 || !str) return size;
  vx.font = `${weight} ${size}px ${fam}`; vx.letterSpacing = spacing + 'px';
  if (max) { const w = vx.measureText(str).width; if (w > max) { size = size * max / w; vx.font = `${weight} ${size}px ${fam}`; } }
  vx.textAlign = align; vx.textBaseline = 'alphabetic';
  const a0 = vx.globalAlpha; vx.globalAlpha = a0 * alpha; vx.fillStyle = color;
  vx.fillText(str, x + (align === 'center' ? spacing / 2 : align === 'right' ? spacing : 0), y);   // tracking is added after the last glyph too
  vx.globalAlpha = a0; vx.letterSpacing = '0px';
  return size;
}
/** Word-wraps with the given font; returns the lines. */
function vWrap(str, maxW, size, weight = 700, fam = FONT) {
  vx.font = `${weight} ${size}px ${fam}`; vx.letterSpacing = '0px';
  const words = str.split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (vx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur);
  return lines;
}
/** Fade envelope with a small rise: [alpha, dy]. */
function vEnv(v, a, b, fin = 8, fout = 8) {
  const i = E.outCubic(prog(v, a, a + fin)), o = 1 - E.inCubic(prog(v, b - fout, b));
  return [Math.min(i, o), (1 - i) * 22 - (1 - o) * 10];
}
/** Which segment of a cut list a vertical frame is in: segs = [{ at, src, len }] in frames. */
function vSeg(segs, v) {
  let k = 0; while (k < segs.length - 1 && v >= segs[k + 1].at) k++;
  const s = segs[k];
  return { k, s, local: v - s.at, src: s.src + (v - s.at) };
}
/** Dims everything outside the safe area to a quiet texture (brightness x 0.2), with a soft inner edge. */
function vShade(rgb, a = 0.8, feather = 40) {
  vx.save(); vx.setTransform(1, 0, 0, 1, 0, 0); vx.globalAlpha = 1; vx.globalCompositeOperation = 'source-over';
  vx.fillStyle = `rgba(${rgb},${a})`;
  vx.beginPath(); vx.rect(0, 0, VW, VH); vx.rect(SAFE.x, SAFE.y, SAFE.w, SAFE.h); vx.fill('evenodd');
  const strip = (x0, y0, x1, y1, rx, ry, rw, rh) => {
    const g = vx.createLinearGradient(x0, y0, x1, y1);
    g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`);
    vx.fillStyle = g; vx.fillRect(rx, ry, rw, rh);
  };
  strip(SAFE.x, 0, SAFE.x + feather, 0, SAFE.x, SAFE.y, feather, SAFE.h);
  strip(SAFE.r, 0, SAFE.r - feather, 0, SAFE.r - feather, SAFE.y, feather, SAFE.h);
  strip(0, SAFE.y, 0, SAFE.y + feather, SAFE.x, SAFE.y, SAFE.w, feather);
  strip(0, SAFE.b, 0, SAFE.b - feather, SAFE.x, SAFE.b - feather, SAFE.w, feather);
  vx.restore();
}
/** Series tag at the top of the safe area, e.g. MADE IN CODE · 04. */
function vTag(label, color, alpha = 1) {
  vText('MADE IN CODE', VL, 292, { size: 28, weight: 800, color, spacing: 5, alpha });
  vx.font = `800 28px ${FONT}`; vx.letterSpacing = '5px';
  const w = vx.measureText('MADE IN CODE').width; vx.letterSpacing = '0px';
  vText('·  ' + label, VL + w + 14, 292, { size: 28, weight: 600, color: 'rgba(255,255,255,0.72)', spacing: 3, alpha, max: VR - VL - w - 14 });
}
/** Big hook lines, left-aligned from y0; visible from frame 0, settles in a few frames. */
function vHook(v, lines, y0, { size = 84, lh = 1.08, color = '#FFFFFF', accent = null, weight = 800, spacing = -1.5, alpha = 1 } = {}) {
  const k = E.outExpo(prog(v, -6, 12));
  lines.forEach((ln, i) => {
    const kk = E.outExpo(prog(v, -12 + i * 2, 8 + i * 2));
    vText(ln, VL, y0 + i * size * lh + (1 - kk) * 30, { size, weight, spacing, color: accent && i === lines.length - 1 ? accent : color, alpha: alpha * Math.max(0.25, kk), max: VR - VL });
  });
  return k;
}
/** Closing card, the last 60 frames: piece title, "drawn in code · bytepatterns.com". l = frames into the card. */
function vEndCard(l, { title, line = '', ink = '#FFFFFF', dim = 'rgba(255,255,255,0.66)', accent = '#FFFFFF', scrim = '0,0,0', a = 0.84 }) {
  const k = E.outCubic(prog(l, 0, 12));
  vx.save(); vx.setTransform(1, 0, 0, 1, 0, 0);
  vx.fillStyle = `rgba(${scrim},${a * k})`; vx.fillRect(0, 0, VW, VH);
  vx.restore();
  const t1 = E.outExpo(prog(l, 3, 19)), t2 = E.outExpo(prog(l, 11, 27)), t3 = E.outExpo(prog(l, 19, 35));
  vx.fillStyle = accent; vx.globalAlpha = t1; vx.fillRect(VL, 742, 88 * t1, 7); vx.globalAlpha = 1;
  const size = vText(title, VL, 850 + (1 - t1) * 40, { size: 92, weight: 800, color: ink, spacing: -2, alpha: t1, max: VR - VL });
  const y2 = 850 + Math.max(size, 60) * 0.25 + 70;
  vx.font = `600 44px ${FONT}`;
  const lead = 'drawn in code  ·  ', lw = vx.measureText(lead).width;
  vText(lead, VL, y2 + (1 - t2) * 24, { size: 44, weight: 600, color: dim, alpha: t2 });
  vText('bytepatterns.com', VL + lw, y2 + (1 - t2) * 24, { size: 44, weight: 800, color: accent, alpha: t2 });
  if (line) vText(line, VL, y2 + 72 + (1 - t3) * 18, { size: 32, weight: 500, color: dim, alpha: t3, max: VR - VL });
}
/** Seeks a cut. The first frame a page draws is drawn twice: the very first read of a
 *  GPU-backed source canvas can come out a shade different from every later one. */
let vWarm = false;
function vSeek(draw, i, frames) {
  const f = Math.max(0, Math.min(frames - 1, Math.floor(i)));
  if (!vWarm) { vWarm = true; draw(f); }
  draw(f);
}
/** The soundtrack of a cut: the piece's own audio() spliced to the same segments as the picture. */
async function vAudio(segs, frames, { xf = 0.025, fadeOut = 0.6, extra = null } = {}) {
  const src = await renderAudio();
  const SR = 48000, dur = frames / FPS, ac = new OfflineAudioContext(2, Math.round(SR * dur), SR);
  const out = ac.createGain(); out.connect(ac.destination);
  out.gain.setValueAtTime(1, 0); out.gain.setValueAtTime(1, dur - fadeOut); out.gain.linearRampToValueAtTime(0, dur - 0.01);
  segs.forEach((s, k) => {
    const at = s.at / FPS, off = s.src / FPS, d = s.len / FPS;
    const pre = k === 0 ? 0 : Math.min(xf, off), post = k === segs.length - 1 ? 0 : xf;
    const b = ac.createBufferSource(), g = ac.createGain(); b.buffer = src;
    g.gain.setValueAtTime(pre ? 0 : 1, at - pre);
    if (pre) g.gain.linearRampToValueAtTime(1, at + pre);
    if (post) { g.gain.setValueAtTime(1, at + d - post); g.gain.linearRampToValueAtTime(0, at + d + post); }
    b.connect(g).connect(out); b.start(at - pre, off - pre, d + pre + post);
  });
  if (extra) extra(ac, out);
  const buf = await ac.startRendering();
  let peak = 0; for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) peak = Math.max(peak, Math.abs(d[i])); }
  if (peak > 0.9) for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] *= 0.9 / peak; }
  return buf;
}
/** A soft three-partial bell, for the closing card. */
function vChime(ac, dest, at, freq, vol = 0.08) {
  for (const [mul, v, dec] of [[1, 1, 1.8], [2.01, 0.35, 0.8], [3.02, 0.12, 0.4]]) {
    const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.value = freq * mul;
    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol * v, at + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, at + dec);
    o.connect(g).connect(dest); o.start(at); o.stop(at + dec + 0.05);
  }
}

/* VERTICAL CUT — this piece */
// The same run on a 1080 x 1920 stage and a shorter clock: fewer slow steps,
// the same chaos and the same road; the board is framed inside the safe area.
const TLV = buildTL({ rule0: 40, fast: 160, road: 350, calm: 450, end: 500 });
const VFR = TLV.end + 60, VEND = VFR - 60;
const GV = { TL: TLV, w: VW, h: VH, cs0: 40, view: { cx: 480, cy: 860, w: 760, h: 760 }, scrims: [[230, 520], [1420, 1230]],
  capX: VL, capY: 380, cap: 50, capTwo: true, capMax: VR - VL,
  fo: 30, foX: VL, foY: 1300, pcX: VL, pcY: 1360, pcAlign: 'left',
  fn: 84, fnX: VL, fnY: 800, fnAlign: 'left', fnMax: VR - VL, fnTwo: 'Chaos, then a road.' };
function hookV(v) {
  const o = 1 - E.inCubic(prog(v, TLV.rule0 - 10, TLV.rule0 + 4));
  if (o <= 0) return;
  vx.save(); vx.fillStyle = `rgba(${C.bgRGB},${0.72 * o})`; vx.fillRect(SAFE.x, 400, SAFE.w, 560); vx.restore();
  vHook(v, ['One ant.', 'Two rules.', 'Chaos, then', 'a highway.'], 500, { size: 104, accent: C.road, color: C.paper, weight: 900, spacing: -2, alpha: o });
}
function vDraw(v) {
  if (vx.reset) vx.reset();
  vReset();
  vx.fillStyle = C.bg; vx.fillRect(0, 0, VW, VH);
  scene(vx, GV, v);
  hookV(v);
  vReset();
  vShade(C.bgRGB, 0.86);
  vTag('LANGTON’S ANT', C.road);
  if (v >= VEND) vEndCard(v - VEND, { title: 'Langton’s Ant', line: `two rules  ·  ${fmt(HW)} steps of chaos  ·  a highway`,
    ink: C.paper, dim: 'rgba(241,238,230,0.72)', accent: C.road, scrim: C.bgRGB, a: 0.88 });
  vReset();
}

// The player asks for a frame on every display refresh; at 30 fps on a 60 Hz screen every other call
// asks for the frame already on the canvas, which is then left as it is (same frame, same pixels).
const shown = { L: -1, V: -1 };
window.__motion = {
  title: "Langton's Ant",
  description: `Langton's ant, run for real on a grid: turn right on an unlit square, left on a lit one, flip it, step. ${fmt(HW)} steps of chaos, then a highway that repeats every ${PERIOD} steps and moves 2 squares diagonally, found in the log rather than typed in; one tick per step, one beat per cycle.`,
  fps: FPS, width: W, height: H, frames: FRAMES,
  poster: TLL.road + 110,
  gifStart: Math.floor((TLL.road - 90) / FPS),
  seek(i) { const f = Math.max(0, Math.min(FRAMES - 1, Math.floor(i))); if (f !== shown.L) { shown.L = f; draw(f); } },
  audio: () => renderAudio(TLL, FRAMES),
  variants: {
    vertical: {
      width: VW, height: VH, frames: VFR, canvas: vcv,
      poster: TLV.road + 80, gifStart: Math.floor((TLV.road - 80) / FPS),
      seek(i) { const v = Math.max(0, Math.min(VFR - 1, Math.floor(i))); if (v !== shown.V) { shown.V = v; vSeek(vDraw, v, VFR); } },
      audio: () => renderAudio(TLV, VFR),
    },
  },
};

/* ==========================================================================
   PLAYER — identical in every piece; keep as is.
   Autoplays and loops, starts sound on the first click, ?frame=N pauses on a
   frame, ?variant=vertical plays the vertical cut (if the piece has one).
   When the renderer sets window.__MOTION_RENDER__ it stays out of the way.
   ========================================================================== */
(function player() {
  const btn = document.getElementById('sound'), q = new URLSearchParams(location.search);
  let M = window.__motion;
  const V = !window.__MOTION_RENDER__ && M.variants && M.variants[q.get('variant')];
  if (V) {                                                // show the variant's own canvas instead
    M = Object.assign({}, M, V);
    V.canvas.style.cssText = `width:min(100vw,calc(100vh*${V.width}/${V.height}));height:auto;aspect-ratio:${V.width}/${V.height}`;
    document.querySelector('canvas').replaceWith(V.canvas);
  }
  const dur = M.frames / M.fps;
  if (window.__MOTION_RENDER__) { btn.hidden = true; M.seek(0); return; }
  if (q.has('frame')) { btn.hidden = true; M.seek(+q.get('frame') || 0); return; }
  let t0 = performance.now(), ac = null, src = null, buf = null, paused = false, pausedAt = 0;
  const clock = () => ac && src ? (ac.currentTime - t0) : (performance.now() - t0) / 1000;
  function loop() {
    if (!paused) M.seek(Math.floor(((clock() % dur) + dur) % dur * M.fps));
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  btn.addEventListener('click', async () => {
    if (src) { src.stop(); src = null; btn.textContent = 'Click for sound'; t0 = performance.now(); return; }
    btn.textContent = 'Loading sound…';
    ac = ac || new AudioContext({ sampleRate: 48000 });
    buf = buf || await M.audio();
    await ac.resume();
    src = ac.createBufferSource(); src.buffer = buf; src.loop = true; src.connect(ac.destination);
    t0 = ac.currentTime + 0.05; src.start(t0);        // picture restarts from frame 0 in sync with the sound
    btn.textContent = 'Sound on — click to mute';
  });
  addEventListener('keydown', e => {
    if (e.code !== 'Space') return;
    e.preventDefault(); paused = !paused;
    if (ac) paused ? ac.suspend() : ac.resume();
    if (!ac) { if (paused) pausedAt = performance.now(); else t0 += performance.now() - pausedAt; }
  });
})();
