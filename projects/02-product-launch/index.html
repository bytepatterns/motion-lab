<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BytePatterns Launch Film — motion-lab</title>
<style>
  /* Player chrome. The piece itself lives entirely in the canvas. */
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; font: 500 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; }
  canvas { display: block; width: min(100vw, calc(100vh * 16 / 9)); height: auto; aspect-ratio: 16 / 9; }
  #sound { position: fixed; left: 16px; bottom: 16px; padding: 8px 14px; border: 1px solid rgba(255,255,255,.35); border-radius: 999px;
           background: rgba(0,0,0,.55); color: #fff; font: inherit; cursor: pointer; }
  #sound[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080" aria-label="A 24-second launch film for BytePatterns, 324 free animated lessons"></canvas>
<button id="sound" type="button">Click for sound</button>
<script>
'use strict';
/* ==========================================================================
   BYTEPATTERNS LAUNCH FILM — 24 s, 100 BPM (one beat = 18 frames, bar = 72).
   0    "Stop reading."  a paragraph turns into bars, the bars sort themselves
   108  wordmark         the sorted bars become the underline of "BytePatterns"
   216  product          lesson card, animation card, quiz card slide in and play
   468  proof            324 tiles light up as the counter reaches 324
   612  end card         tagline + bytepatterns.com
   Every claim is true of the live site: 324 lessons, 31 modules, free, no account.
   ========================================================================== */
const W = 1920, H = 1080, FPS = 30, FRAMES = 720, BEAT = 18, BAR = 72;
const cv = document.getElementById('stage');
let ctx = cv.getContext('2d');                                   // the vertical cut points it at its own canvas
const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
const MONO = 'ui-monospace, "Cascadia Code", Consolas, Menlo, monospace';

// Brand tokens (dark theme) — the only colours in this piece.
const BP = {
  canvas: '#0B0D10', surface: '#12161B', surfaceRaised: '#1B222A', border: '#2B333D',
  text1: '#F7FAFC', text2: '#C7D0D9', text3: '#9AA7B4', text4: '#7B8896',
  primary: '#FF6B4A', primaryInk: '#1A0E0A', secondary: '#B69CFF', secondaryInk: '#160F2D',
};
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; };

// ---- helpers -------------------------------------------------------------
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (f, a, b) => clamp((f - a) / (b - a));
const E = {
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inCubic: t => t * t * t,
  inOutCubic: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outExpo: t => t === 1 ? 1 : 1 - Math.pow(2, -10 * t),
  inExpo: t => t === 0 ? 0 : Math.pow(2, 10 * t - 10),
  inOutExpo: t => t === 0 ? 0 : t === 1 ? 1 : t < .5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2,
  outBack: t => 1 + 1.70158 * 1.2 * Math.pow(t - 1, 3) + 1.70158 * 1.2 * Math.pow(t - 1, 2) - 0.0 * t,
};
function font(size, weight = 800, fam = FONT) { ctx.font = `${weight} ${size}px ${fam}`; }
function resetCtx() {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.filter = 'none'; ctx.shadowBlur = 0; ctx.shadowColor = 'transparent'; ctx.shadowOffsetY = 0;
  ctx.letterSpacing = '0px'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.lineCap = 'butt';
}
function wrap(text, maxW) {
  const words = text.split(' '), lines = []; let line = '';
  for (const w of words) { const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; }
  if (line) lines.push(line);
  return lines;
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

// ---- background ----------------------------------------------------------
function background(f) {
  ctx.fillStyle = BP.canvas; ctx.fillRect(0, 0, W, H);
  // two slow brand glows
  const gx = W * 0.25 + Math.sin(f / 90) * 120, gy = H * 0.3;
  let g = ctx.createRadialGradient(gx, gy, 0, gx, gy, 900);
  g.addColorStop(0, rgba(BP.secondary, 0.07)); g.addColorStop(1, rgba(BP.secondary, 0));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const hx = W * 0.8 + Math.cos(f / 110) * 100, hy = H * 0.8;
  g = ctx.createRadialGradient(hx, hy, 0, hx, hy, 800);
  g.addColorStop(0, rgba(BP.primary, 0.06)); g.addColorStop(1, rgba(BP.primary, 0));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // dot grid
  ctx.fillStyle = rgba(BP.border, 0.55);
  for (let y = 30; y < H; y += 60) for (let x = 30; x < W; x += 60) ctx.fillRect(x - 1, y - 1, 2, 2);
}

// ---- wordmark ------------------------------------------------------------
const WORD = 'BytePatterns';
function wordmark(x, y, size, alpha = 1, rise = null) {
  font(size, 800); ctx.letterSpacing = (-size * 0.025) + 'px'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = BP.text1;
  if (!rise) { ctx.globalAlpha = alpha; ctx.fillText(WORD, x, y); ctx.globalAlpha = 1; ctx.letterSpacing = '0px'; return; }
  let cx = x;
  for (let i = 0; i < WORD.length; i++) {
    const ch = WORD[i], t = rise(i);
    const w = ctx.measureText(ch).width + (-size * 0.025);
    if (t > 0) {
      ctx.save(); ctx.beginPath(); ctx.rect(cx - 20, y - size * 1.1, w + 40, size * 1.35); ctx.clip();
      ctx.globalAlpha = alpha; ctx.fillText(ch, cx, y + (1 - t) * size * 1.1); ctx.restore();
    }
    cx += w;
  }
  ctx.letterSpacing = '0px';
}
function wordmarkWidth(size) { font(size, 800); ctx.letterSpacing = (-size * 0.025) + 'px'; const w = ctx.measureText(WORD).width; ctx.letterSpacing = '0px'; return w; }

// ---- 0  stop reading -----------------------------------------------------
const PARA = 'Bubble sort steps through the list again and again. On every pass it compares each pair of neighbours and swaps them ' +
  'when they are out of order, so the largest remaining value drifts to the end, one position per comparison. After the first ' +
  'pass the last element is in its final place; after the second pass, the last two are. The algorithm stops when a full pass ' +
  'makes no swaps. In the worst case a list of n elements needs about n²/2 comparisons, which is why the method is taught far ' +
  'more often than it is used. Reading this takes longer than watching it happen.';
const PARA_X = 300, PARA_Y = 380, PARA_LH = 66, PARA_W = 1320;
const READ = { x: PARA_X, y: PARA_Y, lh: PARA_LH, w: PARA_W, fs: 40, hy: 230, hs: 120 };   // layout of the opening scene
const paraCache = {};
function paragraph(L = READ) {
  const key = L.w + '/' + L.fs;
  if (!paraCache[key]) { font(L.fs, 400); paraCache[key] = wrap(PARA, L.w); }   // pure: depends only on the font
  return paraCache[key];
}
function barOrder(n) {                     // a seeded shuffle of target widths
  const r = mulberry32(42), a = Array.from({ length: n }, (_, i) => i);
  for (let i = n - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;                                 // a[line] = rank (0 = shortest)
}
function sceneRead(f, L = READ) {
  const lines = paragraph(L), n = lines.length, rank = barOrder(n), hk = L.hs / 120;
  const toBar = E.inOutCubic(prog(f, 34, 54));
  const out = E.inExpo(prog(f, 100, 116));
  // text lines -> bars -> sorted bars
  for (let i = 0; i < n; i++) {
    const y0 = L.y + i * L.lh;
    font(L.fs, 400);
    const lw = ctx.measureText(lines[i]).width;
    const targetW = 220 + (rank[i] / (n - 1)) * (L.w - 220);
    const sortT = E.outExpo(prog(f, 62 + rank[i] * 2.4, 80 + rank[i] * 2.4));
    const y = lerp(y0, L.y + rank[i] * L.lh, sortT);
    // text, dissolving
    if (toBar < 1) {
      ctx.globalAlpha = (1 - toBar) * (0.85 + 0.15 * prog(f, 0, 10));
      ctx.fillStyle = BP.text4; ctx.textBaseline = 'middle'; ctx.fillText(lines[i], L.x, y0 + (f < 34 ? -f * 0.4 : -13.6));
      ctx.globalAlpha = 1;
    }
    if (toBar > 0) {
      const bw = lerp(lw, targetW, toBar), bh = lerp(6, 34, toBar);
      const moving = sortT > 0 && sortT < 0.98;
      let col = BP.text4;
      if (f >= 62) col = moving ? BP.primary : sortT >= 0.98 ? BP.secondary : BP.text4;
      // collapse into the wordmark underline
      const cy = lerp(y, 596, out), cx = lerp(L.x, W / 2 - 330, out), cw = lerp(bw, 660, out), ch = lerp(bh, 8, out);
      ctx.globalAlpha = toBar;
      ctx.fillStyle = out > 0 ? BP.primary : col;
      rr(cx, cy - ch / 2, cw, ch, ch / 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }
  // headline: "Stop reading." -> "Start seeing."
  const hy = L.hy;
  const swap = E.inOutExpo(prog(f, 52, 66));
  font(L.hs, 800); ctx.letterSpacing = '-3px'; ctx.textBaseline = 'middle';
  ctx.save(); ctx.beginPath(); ctx.rect(0, hy - 90 * hk, W, 180 * hk); ctx.clip();
  const enter = E.outExpo(prog(f, L.e0 || 0, 16));
  ctx.globalAlpha = lerp(0.35, 1, enter) * (1 - swap);
  ctx.fillStyle = BP.text1; ctx.fillText('Stop reading.', L.x, hy + (1 - enter) * 40 - swap * 180 * hk);
  const strike = E.outExpo(prog(f, 40, 52));
  if (strike > 0 && swap < 1) {
    const sw = ctx.measureText('Stop reading.').width;
    ctx.fillStyle = BP.primary; ctx.fillRect(L.x - 10, hy + 4 - swap * 180 * hk, (sw + 20) * strike, 10);
  }
  ctx.globalAlpha = 1 - out;
  ctx.fillStyle = BP.primary; ctx.fillText('Start seeing.', L.x, hy + 180 * hk - swap * 180 * hk - out * 120);
  ctx.restore(); ctx.letterSpacing = '0px'; ctx.globalAlpha = 1;
}

// ---- 108  wordmark -------------------------------------------------------
function sceneWordmark(f) {
  const l = f - 108;
  const shrink = E.inOutCubic(prog(f, 188, 214));
  const big = 180, small = 40;
  const size = lerp(big, small, shrink);
  const wBig = wordmarkWidth(big);
  const x = lerp(W / 2 - wBig / 2, 96, shrink), y = lerp(560, 88, shrink);
  const riseT = (i) => E.outExpo(prog(l, 4 + i * 1.6, 20 + i * 1.6));
  wordmark(x, y, size, 1, shrink > 0 ? null : riseT);
  // underline (the sorted bars, collapsed)
  const ul = 1 - E.inCubic(prog(f, 170, 190));
  if (ul > 0) {
    const uw = lerp(660, wBig, E.outExpo(prog(l, 0, 20))) * ul;
    ctx.fillStyle = BP.primary; rr(W / 2 - uw / 2, 592, uw, 8, 4); ctx.fill();
  }
  // subline
  const sub = E.outCubic(prog(l, 26, 44)) * (1 - E.inCubic(prog(f, 176, 192)));
  if (sub > 0) {
    font(44, 500); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = BP.text2; ctx.globalAlpha = sub;
    ctx.fillText('Algorithms, data structures and system design — animated.', W / 2, 700 + (1 - sub) * 20);
    ctx.globalAlpha = 1; ctx.textAlign = 'left';
  }
}
function header(f, alpha) {
  if (alpha <= 0) return;
  wordmark(96, 88, 40, alpha);
  font(28, 600); ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = BP.text3; ctx.globalAlpha = alpha;
  ctx.fillText('bytepatterns.com', W - 96, 86); ctx.globalAlpha = 1; ctx.textAlign = 'left';
}

// ---- 216  product cards --------------------------------------------------
const CARD_W = 540, CARD_H = 620, CARD_Y = 290, GAP = 48;
const CARD_X = (W - (3 * CARD_W + 2 * GAP)) / 2;
function cardShell(k, f, draw) {
  const start = 222 + k * 30;
  const t = E.outExpo(prog(f, start, start + 26));
  const leave = E.inExpo(prog(f, 440 + k * 4, 462 + k * 4));
  if (t <= 0 || leave >= 1) return;
  const x = CARD_X + k * (CARD_W + GAP), y = CARD_Y + (1 - t) * 760 - leave * 900;
  const float = Math.sin((f - start) / 26 + k) * 5;
  ctx.save();
  ctx.translate(x + CARD_W / 2, y + CARD_H / 2 + float);
  ctx.rotate((1 - t) * (k - 1) * 0.12 + leave * (k - 1) * -0.06);
  ctx.translate(-CARD_W / 2, -CARD_H / 2);
  ctx.shadowColor = 'rgba(0,0,0,0.55)'; ctx.shadowBlur = 60; ctx.shadowOffsetY = 24;
  ctx.fillStyle = BP.surface; rr(0, 0, CARD_W, CARD_H, 28); ctx.fill();
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
  ctx.strokeStyle = BP.border; ctx.lineWidth = 2; rr(1, 1, CARD_W - 2, CARD_H - 2, 27); ctx.stroke();
  draw(f - start);
  ctx.restore();
}
function eyebrow(text, y, col = BP.text3) {
  font(22, 700); ctx.letterSpacing = '3px'; ctx.fillStyle = col; ctx.textBaseline = 'alphabetic'; ctx.fillText(text, 40, y); ctx.letterSpacing = '0px';
}
function title(text, y) { font(52, 800); ctx.letterSpacing = '-1px'; ctx.fillStyle = BP.text1; ctx.fillText(text, 40, y); ctx.letterSpacing = '0px'; }
function pill(x, y, w, h, fill, stroke) { rr(x, y, w, h, h / 2); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.stroke(); } }

// card 1 — a lesson, with bubble sort running in it
const BS = (() => {
  const a = [5, 2, 7, 1, 6, 3, 8, 4], steps = [];
  let pos = a.map((_, i) => i);          // pos[slot] = bar id
  const vals = a.slice();
  const n = a.length;
  for (let p = 0; p < n - 1; p++) for (let j = 0; j < n - 1 - p; j++) {
    const sw = vals[pos[j]] > vals[pos[j + 1]];
    steps.push({ order: pos.slice(), j, swap: sw, locked: n - p });
    if (sw) [pos[j], pos[j + 1]] = [pos[j + 1], pos[j]];
  }
  return { vals, steps, final: pos.slice() };
})();
const BS_START = 34, BS_STEP = 4.2;
function lessonCard(l) {
  eyebrow('SORTING · LESSON 2', 64);
  title('Bubble Sort', 128);
  font(26, 500); ctx.fillStyle = BP.text3; ctx.fillText('4 min  ·  animated  ·  quiz', 40, 172);
  // stage
  ctx.fillStyle = BP.canvas; rr(40, 206, CARD_W - 80, 250, 18); ctx.fill();
  const s = Math.floor((l - BS_START) / BS_STEP), lt = ((l - BS_START) % BS_STEP) / BS_STEP;
  const done = s >= BS.steps.length;
  const st = l < BS_START ? { order: BS.steps[0].order, j: -1, swap: false, locked: 99 } : done ? null : BS.steps[s];
  const order = done ? BS.final : st.order;
  const n = order.length, bw = 42, gap = (CARD_W - 80 - 40 - n * bw) / (n - 1);
  const slotX = (k) => 60 + k * (bw + gap);
  for (let k = 0; k < n; k++) {
    const id = order[k];
    let x = slotX(k), lift = 0;
    const active = !done && st.j >= 0 && (k === st.j || k === st.j + 1);
    if (active && st.swap) {
      const e = E.inOutCubic(clamp(lt * 1.4));
      x = lerp(slotX(k), slotX(k === st.j ? st.j + 1 : st.j), e);
      lift = Math.sin(e * Math.PI) * (k === st.j ? -18 : 18);
    }
    const h = 26 * BS.vals[id];
    const locked = done || k >= st.locked;
    ctx.fillStyle = active ? BP.primary : locked ? BP.secondary : BP.text4;
    rr(x, 436 - h + lift, bw, h, 8); ctx.fill();
  }
  // progress + button
  const p = clamp((l - BS_START) / (BS.steps.length * BS_STEP));
  pill(40, 490, CARD_W - 80, 10, BP.surfaceRaised); if (p > 0) pill(40, 490, (CARD_W - 80) * p, 10, BP.primary);
  font(24, 600); ctx.fillStyle = BP.text3; ctx.fillText(done ? 'Sorted in 7 passes' : `Comparisons: ${Math.max(0, Math.min(BS.steps.length, s + 1))}`, 40, 540);
  pill(CARD_W - 40 - 200, 522, 200, 60, BP.primary);
  font(26, 700); ctx.fillStyle = BP.primaryInk; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('Continue →', CARD_W - 140, 553); ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
}

// card 2 — an animation: binary search, step by step
const BIN = [3, 8, 12, 19, 23, 31, 40, 47, 56], TARGET = 47;
const BIN_STEPS = (() => { const s = []; let lo = 0, hi = BIN.length - 1;
  while (lo <= hi) { const mid = (lo + hi) >> 1; s.push({ lo, hi, mid }); if (BIN[mid] === TARGET) break; if (BIN[mid] < TARGET) lo = mid + 1; else hi = mid - 1; }
  return s; })();
function animationCard(l) {
  eyebrow('SEARCHING · ANIMATION', 64);
  title('Binary Search', 128);
  font(26, 500); ctx.fillStyle = BP.text3; ctx.fillText(`Find ${TARGET} in a sorted array`, 40, 172);
  const k = clamp(Math.floor((l - 30) / 26), -1, BIN_STEPS.length - 1);
  const found = l >= 30 + BIN_STEPS.length * 26 - 6;
  const st = k >= 0 ? BIN_STEPS[k] : { lo: 0, hi: BIN.length - 1, mid: -1 };
  const cw = 48, cg = 4, x0 = 40 + (CARD_W - 80 - (BIN.length * cw + (BIN.length - 1) * cg)) / 2, cy = 250;
  for (let i = 0; i < BIN.length; i++) {
    const x = x0 + i * (cw + cg);
    const inRange = i >= st.lo && i <= st.hi;
    const isMid = i === st.mid;
    const hit = found && isMid;
    ctx.globalAlpha = inRange ? 1 : 0.28;
    ctx.fillStyle = hit ? BP.secondary : isMid ? BP.primary : BP.surfaceRaised;
    rr(x, cy, cw, 64, 10); ctx.fill();
    if (!isMid) { ctx.strokeStyle = BP.border; ctx.lineWidth = 2; rr(x + 1, cy + 1, cw - 2, 62, 9); ctx.stroke(); }
    font(26, 700, MONO); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = hit ? BP.secondaryInk : isMid ? BP.primaryInk : BP.text1;
    ctx.fillText(String(BIN[i]), x + cw / 2, cy + 33);
    ctx.globalAlpha = 1;
  }
  // pointers
  const pt = (i, label, col, row) => {
    const x = x0 + i * (cw + cg) + cw / 2;
    ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(x, cy + 76); ctx.lineTo(x - 9, cy + 90); ctx.lineTo(x + 9, cy + 90); ctx.fill();
    font(24, 700, MONO); ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.fillText(label, x, cy + 96 + row * 30);
  };
  if (k >= 0) {
    pt(st.lo, 'lo', BP.text2, 0); pt(st.hi, 'hi', BP.text2, st.hi === st.lo ? 1 : 0);
    pt(st.mid, 'mid', found ? BP.secondary : BP.primary, st.mid === st.lo || st.mid === st.hi ? 1 : 0);
  }
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  // caption
  font(28, 600); ctx.fillStyle = found ? BP.secondary : BP.text2;
  const cap = k < 0 ? 'lo = 0, hi = 8' : found ? `Found ${TARGET} in ${BIN_STEPS.length} steps` :
    `${BIN[st.mid]} ${BIN[st.mid] < TARGET ? '<' : '>'} ${TARGET}: drop the ${BIN[st.mid] < TARGET ? 'left' : 'right'} half`;
  ctx.fillText(cap, 40, 440);
  // player controls
  const p = clamp(l / (30 + BIN_STEPS.length * 26));
  ctx.fillStyle = BP.surfaceRaised; ctx.beginPath(); ctx.arc(70, 540, 30, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = BP.text1;
  if (found) { ctx.fillRect(60, 527, 7, 26); ctx.fillRect(74, 527, 7, 26); }
  else { ctx.beginPath(); ctx.moveTo(62, 524); ctx.lineTo(86, 540); ctx.lineTo(62, 556); ctx.fill(); }
  pill(120, 535, CARD_W - 160 - 90, 10, BP.surfaceRaised); pill(120, 535, (CARD_W - 250) * p, 10, BP.primary);
  ctx.fillStyle = BP.text1; ctx.beginPath(); ctx.arc(120 + (CARD_W - 250) * p, 540, 12, 0, Math.PI * 2); ctx.fill();
  font(24, 600, MONO); ctx.fillStyle = BP.text3; ctx.textAlign = 'right'; ctx.fillText(`${Math.max(0, k + 1)}/${BIN_STEPS.length}`, CARD_W - 40, 549);
  ctx.textAlign = 'left';
}

// card 3 — a quiz question, answered
const QUIZ_CLICK = 120;
function quizCard(l) {
  eyebrow('QUICK CHECK · 1 OF 3', 64, BP.secondary);
  font(36, 700); ctx.fillStyle = BP.text1;
  const q = wrap('Binary search on 1,000,000 sorted items. At most how many steps?', CARD_W - 80);
  q.forEach((line, i) => ctx.fillText(line, 40, 124 + i * 46));
  const opts = ['1,000', '20', '500,000'];
  const answered = l >= QUIZ_CLICK;
  const oy = (i) => 124 + q.length * 46 + 30 + i * 86;
  opts.forEach((o, i) => {
    const right = i === 1, y = oy(i);
    const sel = answered && right;
    const e = sel ? E.outBack(prog(l, QUIZ_CLICK, QUIZ_CLICK + 12)) : 0;
    ctx.save(); ctx.translate(CARD_W / 2, y + 34); ctx.scale(1 + 0.03 * Math.sin(e * Math.PI), 1 + 0.03 * Math.sin(e * Math.PI)); ctx.translate(-CARD_W / 2, -(y + 34));
    rr(40, y, CARD_W - 80, 68, 16);
    ctx.fillStyle = sel ? rgba(BP.secondary, 0.16) : BP.surfaceRaised; ctx.fill();
    ctx.strokeStyle = sel ? BP.secondary : BP.border; ctx.lineWidth = sel ? 3 : 2; ctx.stroke();
    font(30, 700, MONO); ctx.fillStyle = sel ? BP.secondary : BP.text1; ctx.textBaseline = 'middle';
    ctx.fillText(o, 70, y + 35);
    if (sel) {                                           // check mark, drawn on
      const c = prog(l, QUIZ_CLICK + 2, QUIZ_CLICK + 12);
      ctx.strokeStyle = BP.secondary; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.beginPath();
      const px = CARD_W - 90, py = y + 35;

// ---- 468  proof: 324 ----------------------------------------------------
const LESSONS = 324, MODULES = 31;                               // the live site's numbers
const COLS = 27, ROWS = 12, TILE = 22, TGAP = 5;                 // COLS * ROWS === LESSONS
function sceneProof(f) {
  header(f, 1);
  const l = f - 468;
  const count = Math.round(LESSONS * E.inOutCubic(prog(l, 10, 76)));
  const enter = E.outExpo(prog(l, 0, 20));

  font(300, 800); ctx.letterSpacing = '-10px'; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = BP.primary;
  ctx.save(); ctx.beginPath(); ctx.rect(0, 250, 1000, 330); ctx.clip();
  ctx.fillText(String(count), 150, 540 + (1 - enter) * 300); ctx.restore();
  ctx.letterSpacing = '-1.5px';
  const t2 = E.outExpo(prog(l, 8, 28));
  font(76, 800); ctx.fillStyle = BP.text1; ctx.globalAlpha = (1 - leave) * t2;
  ctx.fillText('free animated lessons', 150 + (1 - t2) * 40, 660);
  ctx.letterSpacing = '0px';
  const t3 = E.outExpo(prog(l, 40, 60));
  font(38, 600); ctx.fillStyle = BP.text2; ctx.globalAlpha = (1 - leave) * t3;
  ctx.fillText(MODULES + ' modules  ·  no account needed', 150 + (1 - t3) * 40, 740);
  ctx.globalAlpha = 1 - leave;
  // tiles
  const gx = 1048, gy = 381;                                     // right edge 1772, centre line 541, as the earlier grids
  for (let i = 0; i < LESSONS; i++) {
    const c = i % COLS, r = Math.floor(i / COLS);
    const x = gx + c * (TILE + TGAP), y = gy + r * (TILE + TGAP);
    const appear = E.outCubic(prog(l, 2 + (c + r) * 0.5, 14 + (c + r) * 0.5));
    if (appear <= 0) continue;
    const lit = i < count;
    const fresh = lit && i >= count - COLS && l < 78;
    const s = TILE * (0.6 + 0.4 * appear);

}

// ---- frame ---------------------------------------------------------------
function draw(f) {
  resetCtx();

}
/** Big hook lines, left-aligned from y0; visible from frame 0, settles in a few frames. */
function vHook(v, lines, y0, { size = 84, lh = 1.08, color = '#FFFFFF', accent = null, weight = 800, spacing = -1.5, alpha = 1 } = {}) {
  const k = E.outExpo(prog(v, -6, 12));
  lines.forEach((ln, i) => {
    const kk = E.outExpo(prog(v, -12 + i * 2, 8 + i * 2));
    vText(ln, VL, y0 + i * size * lh + (1 - kk) * 30, { size, weight, spacing, color: accent && i === lines.length - 1 ? accent : color, alpha: alpha * Math.max(0.25, kk), max: VR - VL });
  });
  return k;
}
/** Closing card, the last 60 frames: piece title, "drawn in code · bytepatterns.com". l = frames into the card. */
function vEndCard(l, { title, line = '', ink = '#FFFFFF', dim = 'rgba(255,255,255,0.66)', accent = '#FFFFFF', scrim = '0,0,0', a = 0.84 }) {
  const k = E.outCubic(prog(l, 0, 12));
  vx.save(); vx.setTransform(1, 0, 0, 1, 0, 0);
  vx.fillStyle = `rgba(${scrim},${a * k})`; vx.fillRect(0, 0, VW, VH);
  vx.restore();
  const t1 = E.outExpo(prog(l, 3, 19)), t2 = E.outExpo(prog(l, 11, 27)), t3 = E.outExpo(prog(l, 19, 35));
  vx.fillStyle = accent; vx.globalAlpha = t1; vx.fillRect(VL, 742, 88 * t1, 7); vx.globalAlpha = 1;
  const size = vText(title, VL, 850 + (1 - t1) * 40, { size: 92, weight: 800, color: ink, spacing: -2, alpha: t1, max: VR - VL });
  const y2 = 850 + Math.max(size, 60) * 0.25 + 70;
  vx.font = `600 44px ${FONT}`;
  const lead = 'drawn in code  ·  ', lw = vx.measureText(lead).width;
  vText(lead, VL, y2 + (1 - t2) * 24, { size: 44, weight: 600, color: dim, alpha: t2 });
  vText('bytepatterns.com', VL + lw, y2 + (1 - t2) * 24, { size: 44, weight: 800, color: accent, alpha: t2 });
  if (line) vText(line, VL, y2 + 72 + (1 - t3) * 18, { size: 32, weight: 500, color: dim, alpha: t3, max: VR - VL });

/** Seeks a cut. The first frame a page draws is drawn twice: the very first read of a
 *  GPU-backed source canvas can come out a shade different from every later one. */
let vWarm = false;
function vSeek(draw, i, frames) {
  const f = Math.max(0, Math.min(frames - 1, Math.floor(i)));
  if (!vWarm) { vWarm = true; draw(f); }
  draw(f);
}
/** The soundtrack of a cut: the piece's own audio() spliced to the same segments as the picture. */
async function vAudio(segs, frames, { xf = 0.025, fadeOut = 0.6, extra = null } = {}) {
  const src = await renderAudio();
  const SR = 48000, dur = frames / FPS, ac = new OfflineAudioContext(2, Math.round(SR * dur), SR);
  const out = ac.createGain(); out.connect(ac.destination);
  out.gain.setValueAtTime(1, 0); out.gain.setValueAtTime(1, dur - fadeOut); out.gain.linearRampToValueAtTime(0, dur - 0.01);
  segs.forEach((s, k) => {
    const at = s.at / FPS, off = s.src / FPS, d = s.len / FPS;
    const pre = k === 0 ? 0 : Math.min(xf, off), post = k === segs.length - 1 ? 0 : xf;
    const b = ac.createBufferSource(), g = ac.createGain(); b.buffer = src;
    g.gain.setValueAtTime(pre ? 0 : 1, at - pre);
    if (pre) g.gain.linearRampToValueAtTime(1, at + pre);
    if (post) { g.gain.setValueAtTime(1, at + d - post); g.gain.linearRampToValueAtTime(0, at + d + post); }
    b.connect(g).connect(out); b.start(at - pre, off - pre, d + pre + post);
  });
  if (extra) extra(ac, out);
  const buf = await ac.startRendering();
  let peak = 0; for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) peak = Math.max(peak, Math.abs(d[i])); }
  if (peak > 0.9) for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] *= 0.9 / peak; }
  return buf;
}
/** A soft three-partial bell, for the closing card. */
function vChime(ac, dest, at, freq, vol = 0.08) {
  for (const [mul, v, dec] of [[1, 1, 1.8], [2.01, 0.35, 0.8], [3.02, 0.12, 0.4]]) {
    const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.value = freq * mul;
    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol * v, at + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, at + dec);
    o.connect(g).connect(dest); o.start(at); o.stop(at + dec + 0.05);
  }
}

/* VERTICAL CUT — this piece */
// "Stop reading." -> the three product cards one at a time, full width, like a
// phone carousel -> 324 tiles -> closing card. The cards are the landscape card
// code drawn through a scale, so every lesson still plays for real.
const VSEG = [
  { at: 0, src: 0, len: 100 },                          // paragraph -> bars -> sorted
  { at: 100, src: 262, len: 95 },                       // lesson card, bubble sort running (card time 40..135)
  { at: 195, src: 292, len: 95 },                       // animation card, binary search (40..135)
  { at: 290, src: 352, len: 95 },                       // quiz card, answered (70..165)
  { at: 385, src: 468, len: 92 },                       // 324 lessons
  { at: 477, src: 612, len: 60 },                       // closing card
];
const VFR = 537, VEND = VFR - 60;
const VREAD = { x: VL, y: 640, lh: 50, w: VR - VL, fs: 32, hy: 440, hs: 108, e0: -12 };   // e0: the hook is up at frame 0
const VCARD = { s: 1.35, x: 480 - CARD_W * 1.35 / 2, y: 536 };
function vBackground(f) {
  vx.fillStyle = BP.canvas; vx.fillRect(0, 0, VW, VH);
  let gx = 300 + Math.sin(f / 90) * 100, gy = 560;
  let g = vx.createRadialGradient(gx, gy, 0, gx, gy, 800);
  g.addColorStop(0, rgba(BP.secondary, 0.07)); g.addColorStop(1, rgba(BP.secondary, 0));
  vx.fillStyle = g; vx.fillRect(0, 0, VW, VH);
  gx = 760 + Math.cos(f / 110) * 90; gy = 1250;
  g = vx.createRadialGradient(gx, gy, 0, gx, gy, 700);
  g.addColorStop(0, rgba(BP.primary, 0.06)); g.addColorStop(1, rgba(BP.primary, 0));
  vx.fillStyle = g; vx.fillRect(0, 0, VW, VH);
  vx.fillStyle = rgba(BP.border, 0.55);
  for (let y = 30; y < VH; y += 60) for (let x = 30; x < VW; x += 60) vx.fillRect(x - 1, y - 1, 2, 2);
}
function vCard(k, l, local, len) {
  const draw = [lessonCard, animationCard, quizCard][k];
  const inn = E.outExpo(prog(local, 0, 14)), out = E.inExpo(prog(local, len - 9, len));
  const x = VCARD.x + (1 - inn) * 700 - out * 760, rot = (1 - inn) * 0.05 - out * 0.04;
  vx.save();
  vx.translate(x + CARD_W * VCARD.s / 2, VCARD.y + CARD_H * VCARD.s / 2); vx.rotate(rot); vx.scale(VCARD.s, VCARD.s);
  vx.translate(-CARD_W / 2, -CARD_H / 2);
  vx.shadowColor = 'rgba(0,0,0,0.55)'; vx.shadowBlur = 50; vx.shadowOffsetY = 18;
  vx.fillStyle = BP.surface; vx.beginPath(); vx.roundRect(0, 0, CARD_W, CARD_H, 28); vx.fill();
  vx.shadowColor = 'transparent'; vx.shadowBlur = 0; vx.shadowOffsetY = 0;
  vx.strokeStyle = BP.border; vx.lineWidth = 2; vx.beginPath(); vx.roundRect(1, 1, CARD_W - 2, CARD_H - 2, 27); vx.stroke();
  draw(l);
  vx.restore();
}
function vProof(l) {
  const count = Math.round(LESSONS * E.inOutCubic(prog(l, 10, 76))), enter = E.outExpo(prog(l, 0, 20));
  vx.save(); vx.beginPath(); vx.rect(SAFE.x, 440, SAFE.w, 300); vx.clip();
  vText(String(count), VL - 12, 700 + (1 - enter) * 260, { size: 280, weight: 800, color: BP.primary, spacing: -10 });
  vx.restore();
  const t2 = E.outExpo(prog(l, 8, 28)), t3 = E.outExpo(prog(l, 30, 50));
  vText('free animated lessons', VL + (1 - t2) * 40, 800, { size: 68, weight: 800, color: BP.text1, spacing: -1.5, alpha: t2 });
  vText(MODULES + ' modules  ·  no account needed', VL + (1 - t3) * 40, 866, { size: 38, weight: 600, color: BP.text2, alpha: t3 });
  const T = 23, G = 5, gx = VL + (VR - VL - (COLS * (T + G) - G)) / 2, gy = 900;
  for (let i = 0; i < LESSONS; i++) {
    const c = i % COLS, r = Math.floor(i / COLS), x = gx + c * (T + G), y = gy + r * (T + G);
    const appear = E.outCubic(prog(l, 2 + (c + r) * 0.5, 14 + (c + r) * 0.5));
    if (appear <= 0) continue;
    const lit = i < count, fresh = lit && i >= count - COLS && l < 78, s = T * (0.6 + 0.4 * appear);
    vx.globalAlpha = appear;
    if (lit) { vx.fillStyle = fresh ? BP.primary : BP.secondary; vx.beginPath(); vx.roundRect(x + (T - s) / 2, y + (T - s) / 2, s, s, 6); vx.fill(); }
    else { vx.strokeStyle = BP.border; vx.lineWidth = 2; vx.beginPath(); vx.roundRect(x + 1 + (T - s) / 2, y + 1 + (T - s) / 2, s - 2, s - 2, 6); vx.stroke(); }
  }
  vx.globalAlpha = 1;
}
function vDraw(v) {
  const { k, s, local, src } = vSeg(VSEG, v), f = Math.min(FRAMES - 1, src);
  vReset();
  vBackground(f);
  const main = ctx; ctx = vx;
  try {
    if (k === 0) sceneRead(f, VREAD);
    else if (k <= 3) {
      const h = E.outExpo(prog(v, 100, 112));
      vText('Every lesson is an', VL, 386 + (1 - h) * 20, { size: 64, weight: 800, color: BP.text1, spacing: -1.5, alpha: h });
      vText('animation you can play.', VL, 462 + (1 - h) * 20, { size: 64, weight: 800, color: BP.primary, spacing: -1.5, alpha: h, max: VR - VL });
      vCard(k - 1, f - (222 + (k - 1) * 30), local, s.len);
    } else if (k === 4) vProof(f - 468);
    else vProof(90);
  } finally { ctx = main; }
  vReset();
  vShade('11,13,16');
  vTag('LAUNCH FILM', BP.primary);
  if (v >= VEND) vEndCard(v - VEND, { title: 'BytePatterns Launch Film', line: 'Stop reading. Start seeing. ' + LESSONS + ' free animated lessons.',
    ink: BP.text1, dim: BP.text3, accent: BP.primary, scrim: '11,13,16', a: 0.9 });
  vReset();
}

window.__motion = {
  title: 'BytePatterns Launch Film',
  description: 'A 24-second launch film: a paragraph turns into sorted bars, product cards play their own lessons, and 324 tiles light up.',
  fps: FPS, width: W, height: H, frames: FRAMES,
  poster: 425,
  gifStart: 0,
  seek(i) { draw(Math.max(0, Math.min(FRAMES - 1, Math.floor(i)))); },
  audio: renderAudio,
  variants: {
    vertical: {
      width: VW, height: VH, frames: VFR, canvas: vcv,
      poster: 150, gifStart: 3.2,
      seek(i) { vSeek(vDraw, i, VFR); },
      audio: () => vAudio(VSEG, VFR),
    },
  },
};

/* ==========================================================================
   PLAYER — identical in every piece; keep as is.
   Autoplays and loops, starts sound on the first click, ?frame=N pauses on a
   frame, ?variant=vertical plays the vertical cut (if the piece has one).
   When the renderer sets window.__MOTION_RENDER__ it stays out of the way.
   ========================================================================== */
(function player() {
  const btn = document.getElementById('sound'), q = new URLSearchParams(location.search);
  let M = window.__motion;
  const V = !window.__MOTION_RENDER__ && M.variants && M.variants[q.get('variant')];
  if (V) {                                                // show the variant's own canvas instead
    M = Object.assign({}, M, V);
    V.canvas.style.cssText = `width:min(100vw,calc(100vh*${V.width}/${V.height}));height:auto;aspect-ratio:${V.width}/${V.height}`;
    document.querySelector('canvas').replaceWith(V.canvas);
  }
  const dur = M.frames / M.fps;
  if (window.__MOTION_RENDER__) { btn.hidden = true; M.seek(0); return; }
  if (q.has('frame')) { btn.hidden = true; M.seek(+q.get('frame') || 0); return; }
  let t0 = performance.now(), ac = null, src = null, buf = null, paused = false, pausedAt = 0;
  const clock = () => ac && src ? (ac.currentTime - t0) : (performance.now() - t0) / 1000;
  function loop() {
    if (!paused) M.seek(Math.floor(((clock() % dur) + dur) % dur * M.fps));
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  btn.addEventListener('click', async () => {
    if (src) { src.stop(); src = null; btn.textContent = 'Click for sound'; t0 = performance.now(); return; }
    btn.textContent = 'Loading sound…';
    ac = ac || new AudioContext({ sampleRate: 48000 });
    buf = buf || await M.audio();
    await ac.resume();
    src = ac.createBufferSource(); src.buffer = buf; src.loop = true; src.connect(ac.destination);
    t0 = ac.currentTime + 0.05; src.start(t0);        // picture restarts from frame 0 in sync with the sound
    btn.textContent = 'Sound on — click to mute';
  });
  addEventListener('keydown', e => {
    if (e.code !== 'Space') return;
    e.preventDefault(); paused = !paused;
    if (ac) paused ? ac.suspend() : ac.resume();
    if (!ac) { if (paused) pausedAt = performance.now(); else t0 += performance.now() - pausedAt; }
  });
})();
