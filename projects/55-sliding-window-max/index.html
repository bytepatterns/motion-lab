<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="teambytepatterns">
<meta name="description" content="A window of six slides across twenty-eight numbers; a deque keeps only the values that could still become the maximum, so every window's maximum is read off its front and the whole pass needs far fewer comparisons than rescanning each window.">
<title>Sliding Window Maximum — motion-lab</title>
<style>
  /* Player chrome. The piece itself lives entirely in the canvas. */
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; font: 500 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; }
  canvas { display: block; width: min(100vw, calc(100vh * 16 / 9)); height: auto; aspect-ratio: 16 / 9; }
  #sound { position: fixed; left: 16px; bottom: 16px; padding: 8px 14px; border: 1px solid rgba(255,255,255,.35); border-radius: 999px;
           background: rgba(0,0,0,.55); color: #fff; font: inherit; cursor: pointer; }
  #sound[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080" aria-label="A row of bars with a bracket sliding along it; below, a short row of numbered chips that grows on the right, loses chips from the right when a taller bar arrives and from the left when they leave the bracket; a row of yellow marks records the tallest bar in every position of the bracket"></canvas>
<button id="sound" type="button">Click for sound</button>
<script>
'use strict';
/* ==========================================================================
   PIECE — Sliding Window Maximum.
   Report the maximum of every run of K consecutive numbers. Rescanning each
   window costs K − 1 comparisons per window. A monotonic deque does it in
   one pass: it holds indices whose values fall from front to back. A new
   value first pops every smaller-or-equal value off the back (they sit
   before it and are no bigger, so they can never be a window's maximum
   again), then joins at the back; an index that has slid out of the window
   leaves from the front. The front is always the current maximum. Every
   index is pushed once and popped at most once.
   The numbers come from a fixed seed; the whole pass (every comparison,
   push, pop and maximum) is run once at load and each result is checked
   against rescanning. A frame maps to a step of that record, so seek(i) is
   pure in i.
   ========================================================================== */
const W = 1920, H = 1080, FPS = 30;
const cv = document.getElementById('stage');
const ctx = cv.getContext('2d', { willReadFrequently: true });   // CPU raster: identical pixels on every redraw
const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
const MONO = 'ui-monospace, "Cascadia Code", Consolas, Menlo, monospace';

// ---- helpers -------------------------------------------------------------
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (f, a, b) => clamp((f - a) / (b - a));
const smooth = t => t * t * (3 - 2 * t);
const E = {
  inCubic: t => t * t * t,
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inOutCubic: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outExpo: t => t === 1 ? 1 : 1 - Math.pow(2, -10 * t),
  inExpo: t => t === 0 ? 0 : Math.pow(2, 10 * t - 10),
  inOutExpo: t => t === 0 ? 0 : t === 1 ? 1 : t < .5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2,
  outBack: t => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2),
};
/** Canvas text; `max` shrinks the size until the line fits. Returns the width drawn. */
function text(g, str, x, y, { size = 40, weight = 600, color = '#fff', alpha = 1, spacing = 0, align = 'left', fam = FONT, base = 'alphabetic', max = 0 } = {}) {
  if (alpha <= 0.002 || !str) return 0;
  g.font = `${weight} ${size}px ${fam}`; g.letterSpacing = spacing + 'px';
  if (max) { const w0 = g.measureText(str).width; if (w0 > max) { size *= max / w0; g.font = `${weight} ${size}px ${fam}`; } }
  g.textAlign = align; g.textBaseline = base;
  const a0 = g.globalAlpha; g.globalAlpha = a0 * alpha; g.fillStyle = color;
  g.fillText(str, x, y);
  const w = g.measureText(str).width;
  g.globalAlpha = a0; g.letterSpacing = '0px';
  return w;
}
const measure = (g, str, size, weight = 800, fam = FONT, spacing = 0) => { g.font = `${weight} ${size}px ${fam}`; g.letterSpacing = spacing + 'px'; const w = g.measureText(str).width; g.letterSpacing = '0px'; return w; };
const env = (f, a, b, fin = 12, fout = 10) => {
  const i = E.outCubic(prog(f, a, a + fin)), o = 1 - E.inCubic(prog(f, b - fout, b));
  return [Math.min(i, o), (1 - i) * 24 - (1 - o) * 10];
};

// ---- palette -------------------------------------------------------------
const C = {
  bg: '#0B0D14', bgRGB: '11,13,20', paper: '#F1EEE6', paperRGB: '241,238,230', dim: 'rgba(241,238,230,0.62)', faint: 'rgba(241,238,230,0.16)',
  accent: '#FFC857', accentRGB: '255,200,87', fresh: '#5CD6CB', freshRGB: '92,214,203', pop: '#FF5E6C', popRGB: '255,94,108', node: '#151A28',
};

// ---- the numbers and the pass, run once --------------------------------------------------
const N = 28, K = 6, NW = N - K + 1;
const A = (function () { const R = mulberry32(0x55D0E); return Array.from({ length: N }, () => 8 + Math.floor(R() * 91)); })();
const EV = [];                                    // one entry per step of the pass, with the deque after it
let CMP = 0, POPB = 0, POPF = 0;
const OUT = new Array(N).fill(-1);
{
  const dq = [];
  const rec = (o) => EV.push(Object.assign({ dq: dq.slice(), cmp: CMP, popb: POPB, popf: POPF }, o));
  for (let i = 0; i < N; i++) {
    rec({ t: 'slide', i });
    while (dq.length && dq[0] <= i - K) { const j = dq.shift(); POPF++; rec({ t: 'expire', i, j }); }
    while (dq.length) {
      const j = dq[dq.length - 1]; CMP++;
      if (A[j] <= A[i]) { dq.pop(); POPB++; rec({ t: 'pop', i, j }); }
      else { rec({ t: 'keep', i, j }); break; }
    }
    dq.push(i); rec({ t: 'push', i });
    if (i >= K - 1) { OUT[i] = dq[0]; rec({ t: 'out', i, j: dq[0] }); }
  }
}
const NAIVE = NW * (K - 1);
const OK = OUT.every((j, i) => i < K - 1 || A[j] === Math.max(...A.slice(i - K + 1, i + 1)));
const POPS = POPB + POPF, MAXDQ = Math.max(...EV.map(e => e.dq.length));
EV.forEach((e, n) => { e.before = n ? EV[n - 1].dq : []; });
// screen time: the first steps are taught slowly, the rest run
const WT = { slide: 0.7, expire: 1, pop: 0.9, keep: 0.6, push: 0.75, out: 0.8 };
const CUMW = [0];
for (const e of EV) CUMW.push(CUMW[CUMW.length - 1] + WT[e.t] * (e.i < 3 ? 2.3 : e.i < 7 ? 1.5 : e.i < 11 ? 1.1 : 0.8));
const stepStart = i => EV.findIndex(e => e.i === i);

// ---- timeline -------------------------------------------------------------------------------
// s0..s1: the pass; calm: the verdict; end: the closing card.
function buildTL(o) {
  const TL = Object.assign({}, o);
  TL.evF = n => TL.s0 + (TL.s1 - TL.s0) * CUMW[n] / CUMW[EV.length];
  const at = i => TL.evF(stepStart(i));
  const firstPop = EV.findIndex(e => e.t === 'pop'), firstExp = EV.findIndex(e => e.t === 'expire');
  TL.caps = [
    [TL.s0 - 4, TL.evF(firstPop) - 4, `A window of ${K} slides along.|Report its maximum, ${NW} times.`],
    [TL.evF(firstPop) - 4, TL.evF(firstExp) - 4, 'A bigger value pops smaller ones off the back:|they can never be the maximum again.'],
    [TL.evF(firstExp) - 4, at(Math.min(N - 1, EV[firstExp].i + 5)), 'The front is always the maximum.|When it slides out, it leaves.'],
    [at(Math.min(N - 1, EV[firstExp].i + 5)), TL.calm - 2, 'Every index goes in once|and comes out at most once.'],
  ];
  return TL;
}
/** The step a frame is in: event index n and progress p through it. */
function evAt(TL, f) {
  if (f < TL.s0) return { n: -1, p: 0 };
  if (f >= TL.s1) return { n: EV.length - 1, p: 1 };
  const u = (f - TL.s0) / (TL.s1 - TL.s0) * CUMW[EV.length];
  let n = 0; while (n < EV.length - 1 && CUMW[n + 1] <= u) n++;
  return { n, p: clamp((u - CUMW[n]) / (CUMW[n + 1] - CUMW[n])) };
}

// ---- drawing ------------------------------------------------------------------------------
const colX = (G, i) => G.bx + (i + 0.5) * G.cw;
const barH = (G, v) => G.bh * v / 100;
/** Window [lo, hi] at frame f, eased while it slides. */
function windowAt(TL, st) {
  const e = st.n >= 0 ? EV[st.n] : null;
  if (!e) return [0, -1];
  const hi = e.i, lo = Math.max(0, hi - K + 1);
  if (e.t !== 'slide') return [lo, hi];
  const k = E.inOutCubic(st.p), plo = Math.max(0, hi - K), phi = hi - 1;
  return [lerp(plo, lo, k), lerp(phi, hi, k)];
}
function bars(g, G, f, st) {
  const TL = G.TL, [a] = env(f, TL.s0 - 24, TL.end + 10, 18, 12);
  if (a <= 0) return;
  const e = st.n >= 0 ? EV[st.n] : null, [lo, hi] = windowAt(TL, st);
  const inDq = new Set(e ? (st.p > 0.5 ? e.dq : e.before) : []);
  const front = e && e.dq.length ? e.dq[0] : -1;
  // the window bracket
  if (e && hi >= lo) {
    const x0 = G.bx + lo * G.cw + 3, x1 = G.bx + (hi + 1) * G.cw - 3, y0 = G.by - G.bh - 22, y1 = G.by + G.valGap + 14;
    g.save(); g.globalAlpha = a; g.fillStyle = 'rgba(241,238,230,0.06)'; g.beginPath(); g.roundRect(x0, y0, x1 - x0, y1 - y0, 14); g.fill();
    g.strokeStyle = 'rgba(241,238,230,0.55)'; g.lineWidth = 3; g.stroke(); g.restore();
  }
  for (let i = 0; i < N; i++) {
    const x = colX(G, i), h = barH(G, A[i]), inW = e && i >= Math.round(lo) && i <= Math.round(hi);
    const k = E.outCubic(prog(f, TL.s0 - 24 + i * 0.6, TL.s0 - 6 + i * 0.6));
    let col = C.paper, al = inW ? 0.9 : 0.34;
    if (e && i === e.i && e.t !== 'slide') { col = C.fresh; al = 1; }
    else if (e && e.t === 'slide' && i === e.i) { col = C.fresh; al = 0.34 + 0.66 * st.p; }
    if (e && i === front && e.t === 'out' && st.p > 0.3) col = C.accent;
    if (i > (e ? e.i : -1) && !(e && e.t === 'slide' && i === e.i)) al = 0.22;
    g.save(); g.globalAlpha = a * al; g.fillStyle = col;
    g.fillRect(x - G.bw / 2, G.by - h * k, G.bw, h * k);
    if (inDq.has(i) && e) { g.globalAlpha = a; g.strokeStyle = C.accent; g.lineWidth = 3; g.strokeRect(x - G.bw / 2 - 4, G.by - h * k - 4, G.bw + 8, h * k + 4); }
    g.restore();
    if (G.vals) text(g, String(A[i]), x, G.by + G.valGap, { size: G.val, weight: 700, color: col === C.paper ? C.dim : col, align: 'center', fam: MONO, alpha: a * Math.max(al, 0.5) * k });
  }
  // the maxima so far: one mark per finished window, under its last column
  text(g, 'max', G.bx + (K - 1.5) * G.cw, G.oy, { size: 28, weight: 800, color: C.accent, align: 'right', alpha: a * E.outCubic(prog(f, TL.evF(stepStart(K - 1)), TL.evF(stepStart(K - 1)) + 10)) });
  for (let i = K - 1; i < N; i++) {
    const n = EV.findIndex(q => q.t === 'out' && q.i === i), t0 = TL.evF(n), t1 = TL.evF(n + 1);
    const k = E.outBack(prog(f, t0 + (t1 - t0) * 0.3, t1 + 2)); if (k <= 0) continue;
    const x = colX(G, i), v = A[OUT[i]], hh = G.oh * v / 100 * clamp(k, 0, 1.2);
    g.save(); g.globalAlpha = a; g.fillStyle = C.accent; g.fillRect(x - G.ow / 2, G.oy - hh, G.ow, hh); g.restore();
    if (G.vals) text(g, String(v), x, G.oy + G.valGap, { size: G.val, weight: 800, color: C.accent, align: 'center', fam: MONO, alpha: a * clamp(k) });
  }
}
/** The deque: chips from front (left) to back (right), animated between the before and after states of a step. */
function deque(g, G, f, st) {
  const TL = G.TL, [a] = env(f, TL.s0 - 10, TL.end + 10, 14, 12);
  if (a <= 0) return;
  text(g, 'deque', G.dx, G.dy - 22, { size: 28, weight: 800, color: C.paper, alpha: a });
  const w0 = measure(g, 'deque  ', 28, 800);
  text(g, 'front → back', G.dx + w0, G.dy - 22, { size: 28, weight: 600, color: C.dim, alpha: a });
  g.save(); g.globalAlpha = a * 0.9; g.strokeStyle = C.faint; g.lineWidth = 2; g.setLineDash([8, 8]);
  for (let s = 0; s < K; s++) { g.beginPath(); g.roundRect(G.dx + s * G.chip + 4, G.dy, G.chip - 8, G.chipH, 12); g.stroke(); }
  g.setLineDash([]); g.restore();
  if (st.n < 0) return;
  const e = EV[st.n], p = st.p, B = e.before, Aft = e.dq;
  const chipAt = (s) => G.dx + s * G.chip + 4;
  const draw1 = (j, x, y, { alpha = 1, col = C.paper, ring = null, scale = 1 } = {}) => {
    if (alpha <= 0.01) return;
    const w = (G.chip - 8) * scale, h = G.chipH * scale, cx = x + (G.chip - 8) / 2, cy = y + G.chipH / 2;
    g.save(); g.globalAlpha = a * alpha; g.fillStyle = C.node; g.beginPath(); g.roundRect(cx - w / 2, cy - h / 2, w, h, 12); g.fill();
    g.strokeStyle = ring || col; g.lineWidth = ring ? 4 : 2.5; g.stroke(); g.restore();
    text(g, String(A[j]), cx, cy - h * 0.1, { size: G.chipV * scale, weight: 850, color: col, align: 'center', base: 'middle', fam: MONO, alpha: a * alpha });
    text(g, `i=${j}`, cx, cy + h * 0.39, { size: G.chipI * scale, weight: 700, color: C.dim, align: 'center', fam: MONO, alpha: a * alpha });
  };
  const k = E.inOutCubic(p);
  if (e.t === 'expire') {
    B.forEach((j, s) => { if (s === 0) draw1(j, chipAt(0) - G.chip * 0.9 * k, G.dy, { alpha: 1 - k, col: C.dim }); else draw1(j, lerp(chipAt(s), chipAt(s - 1), k), G.dy); });
  } else if (e.t === 'pop') {
    B.forEach((j, s) => { if (s === B.length - 1) draw1(j, chipAt(s) + 30 * k, G.dy - 70 * k, { alpha: 1 - E.inCubic(k), col: C.pop, ring: C.pop }); else draw1(j, chipAt(s), G.dy); });
  } else if (e.t === 'push') {
    B.forEach((j, s) => draw1(j, chipAt(s), G.dy));
    const s = Aft.length - 1, x0 = colX(G, e.i) - (G.chip - 8) / 2, y0 = G.by - barH(G, A[e.i]) * 0.5 - G.chipH / 2;
    const x = lerp(x0, chipAt(s), k), y = lerp(y0, G.dy, k) - Math.sin(Math.PI * k) * 60;
    draw1(e.i, x, y, { col: C.fresh, alpha: E.outCubic(prog(p, 0, 0.3)), scale: lerp(0.7, 1, k) });
  } else {
    Aft.forEach((j, s) => draw1(j, chipAt(s), G.dy, {
      col: e.t === 'out' && s === 0 ? C.accent : j === e.i && e.t !== 'slide' ? C.fresh : C.paper,
      ring: e.t === 'out' && s === 0 ? C.accent : e.t === 'keep' && j === e.j ? C.fresh : null }));
  }
  // the comparison being made
  if (e.t === 'pop' || e.t === 'keep') {
    const pop = e.t === 'pop', lab = `${A[e.j]} ${pop ? '≤' : '>'} ${A[e.i]}  ${pop ? 'pop' : 'keep'}`, col = pop ? C.pop : C.fresh;
    const al = Math.min(E.outCubic(prog(p, 0, 0.25)), 1 - E.inCubic(prog(p, 0.8, 1)));
    const w = measure(g, lab, G.cmpS, 800, MONO) + 28, h = G.cmpS + 18, x = G.cmpX, y = G.cmpY;
    g.save(); g.globalAlpha = a * al; g.fillStyle = C.node; g.beginPath(); g.roundRect(x, y - h / 2, w, h, h / 2); g.fill();
    g.strokeStyle = col; g.lineWidth = 2.5; g.stroke(); g.restore();
    text(g, lab, x + 14, y + 1, { size: G.cmpS, weight: 800, color: col, base: 'middle', fam: MONO, alpha: a * al });
  }
}
function counters(g, G, f, st) {
  const TL = G.TL, [a] = env(f, TL.s0 - 10, TL.calm, 12, 10);
  if (a <= 0 || st.n < 0) return;
  const e = EV[st.n], done = st.p > 0.5 ? e : (st.n ? EV[st.n - 1] : { cmp: 0, popb: 0, popf: 0 });
  const nOut = OUT.filter((j, i) => j >= 0 && EV.findIndex(q => q.t === 'out' && q.i === i) < st.n + (st.p > 0.5 ? 1 : 0)).length;
  const lines = [
    [`comparisons`, `${done.cmp}`, C.paper],
    [`rescanning`, `${nOut * (K - 1)}`, C.pop],
    [`pops`, `${done.popb + done.popf}`, C.dim],
  ];
  lines.forEach(([l, v, col], q) => {
    const y = G.ky + q * G.kl;
    text(g, l, G.kx - G.kw, y, { size: G.ks, weight: 700, color: C.dim, align: 'left', alpha: a });
    text(g, v, G.kx, y, { size: G.ks, weight: 800, color: col, align: 'right', fam: MONO, alpha: a });
  });
}
function caption(g, G, f) {
  for (const [t0, t1, str] of G.TL.caps) {
    const [a, dy] = env(f, t0, t1, 10, 8); if (a <= 0) continue;
    const [p1, p2] = str.split('|');
    if (G.capTwo) {
      text(g, p1, G.capX, G.capY + dy, { size: G.cap, weight: 850, color: C.paper, spacing: -1, alpha: a, max: G.capMax });
      text(g, p2, G.capX, G.capY + G.cap * 1.14 + dy, { size: G.cap, weight: 850, color: C.accent, spacing: -1, alpha: a, max: G.capMax });
    } else {
      const w1 = measure(g, p1 + ' ', G.cap, 850, FONT, -1), w2 = measure(g, p2, G.cap, 850, FONT, -1), sc = Math.min(1, G.capMax / (w1 + w2));
      const w = text(g, p1 + ' ', G.capX, G.capY + dy, { size: G.cap * sc, weight: 850, color: C.paper, spacing: -1, alpha: a });
      text(g, p2, G.capX + w, G.capY + dy, { size: G.cap * sc, weight: 850, color: C.accent, spacing: -1, alpha: a });
    }
  }
}
function readout(g, G, f, st) {
  const TL = G.TL, [a] = env(f, TL.s0 - 10, TL.calm, 12, 10);
  if (a <= 0 || st.n < 0) return;
  const e = EV[st.n], lo = Math.max(0, e.i - K + 1), dq = st.p > 0.5 ? e.dq : e.before;
  const l1 = `i = ${String(e.i).padStart(2, ' ')}  ·  window [${lo}..${e.i}]`;
  const l2 = `deque holds ${dq.length} of ${Math.min(K, e.i + 1)}`;
  text(g, l1, G.foX, G.foY, { size: G.fo, weight: 700, color: C.paper, fam: MONO, alpha: a, align: G.foAlign });
  text(g, l2, G.foX2, G.foY2, { size: G.fo, weight: 700, color: C.dim, fam: MONO, alpha: a, align: G.foAlign2 });
}
function finale(g, G, f) {
  const TL = G.TL, k1 = E.outCubic(prog(f, TL.calm, TL.calm + 18)), k2 = E.outCubic(prog(f, TL.calm + 10, TL.calm + 28));
  if (k1 <= 0) return;
  const out = 1 - E.inCubic(prog(f, TL.end - 6, TL.end + 12));
  g.save(); g.fillStyle = `rgba(${C.bgRGB},${0.86 * k1 * out})`; g.fillRect(0, G.fnY - G.fn * 1.2, G.w, G.fn * 2.9); g.restore();
  text(g, `${CMP} comparisons, not ${NAIVE}.`, G.fnX, G.fnY, { size: G.fn, weight: 900, color: C.paper, spacing: -2, align: G.fnAlign, alpha: k1 * out, max: G.fnMax });
  text(g, `${N} pushes  ·  ${POPS} pops  ·  ${OK ? 'every maximum checked' : 'maxima differ'}`, G.fnX, G.fnY + G.fn * 1.05, { size: G.fn * 0.56, weight: 850, color: C.accent, spacing: -1, align: G.fnAlign, alpha: k2 * out, max: G.fnMax });
}
function scene(g, G, f) {
  const st = evAt(G.TL, f);
  bars(g, G, f, st); deque(g, G, f, st); counters(g, G, f, st);
  caption(g, G, f); readout(g, G, f, st); finale(g, G, f);
  return st;
}

// ---- landscape picture ------------------------------------------------------------------
const TLL = buildTL({ s0: 56, s1: 650, calm: 664, end: 736 });
const FRAMES = TLL.end + 72;
const GL = { TL: TLL, w: W, h: H, bx: 150, cw: 1620 / N, bw: 40, by: 590, bh: 280, vals: true, val: 28, valGap: 34,
  oy: 748, oh: 70, ow: 40,
  dx: 150, dy: 846, chip: 124, chipH: 108, chipV: 44, chipI: 26, cmpX: 930, cmpY: 900, cmpS: 32,
  kx: 1800, kw: 330, ky: 850, kl: 44, ks: 32,
  capX: 120, capY: 216, cap: 50, capTwo: false, capMax: 1680,
  fo: 30, foX: 120, foY: 1004, foAlign: 'left', foX2: 1800, foY2: 1004, foAlign2: 'right',
  fn: 100, fnX: W / 2, fnY: 560, fnAlign: 'center', fnMax: 1680 };
function hookL(f) {
  const o = 1 - E.inCubic(prog(f, TLL.s0 - 14, TLL.s0 + 4));
  if (o <= 0) return;

// ---- sound: a tick per slide, a note per push (pitched by value), a drop per pop, a bell per maximum ----
async function renderAudio(TL = TLL, frames = FRAMES) {
  const SR = 48000, dur = frames / FPS, LEN = Math.round(SR * dur);
  const ac = new OfflineAudioContext(2, LEN, SR);
  const at = fr => fr / FPS;
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -16; comp.ratio.value = 3; comp.attack.value = 0.005; comp.release.value = 0.25;
  const master = ac.createGain(); master.gain.value = 0.9; master.connect(comp).connect(ac.destination);
  master.gain.setValueAtTime(0.9, dur - 1.0); master.gain.linearRampToValueAtTime(0.0001, dur - 0.02);
  const rnd = mulberry32(0x55A0D);
  const ir = ac.createBuffer(2, SR * 2, SR);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let k = 0; k < d.length; k++) d[k] = (rnd() * 2 - 1) * Math.pow(1 - k / d.length, 3); }
  const verb = ac.createConvolver(); verb.buffer = ir; const vg = ac.createGain(); vg.gain.value = 0.3; verb.connect(vg).connect(master);
  const noise = ac.createBuffer(1, SR, SR); { const d = noise.getChannelData(0); for (let k = 0; k < d.length; k++) d[k] = rnd() * 2 - 1; }
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  const pluck = (t0, m, amp, pan, dec = 0.35, type = 'triangle') => {
    const o = ac.createOscillator(), g = ac.createGain(), p = ac.createStereoPanner(); o.type = type; o.frequency.value = hz(m);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(amp, t0 + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dec);
    p.pan.value = pan; o.connect(g).connect(p); p.connect(master); p.connect(verb); o.start(t0); o.stop(t0 + dec + 0.05);
  };
  const pad = (t0, t1, notes, amp, cutoff) => {
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = cutoff; lp.Q.value = 1; lp.connect(master); lp.connect(verb);
    notes.forEach((m, i) => { for (const det of [-6, 6]) {
      const o = ac.createOscillator(), g = ac.createGain(), p = ac.createStereoPanner(); o.type = 'sawtooth'; o.frequency.value = hz(m); o.detune.value = det;
      p.pan.value = (i / Math.max(1, notes.length - 1) - 0.5) * 0.8 * Math.sign(det);
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(amp, t0 + 0.8); g.gain.setValueAtTime(amp, Math.max(t0 + 0.8, t1 - 0.6)); g.gain.exponentialRampToValueAtTime(0.0001, t1 + 0.4);

  };
  const PENTA = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24, 26, 28];
  const note = v => 57 + PENTA[Math.min(12, Math.floor(v / 100 * 13))];
  const mid = TL.evF(stepStart(Math.floor(N / 2)));
  pad(0, at(mid), [45, 52, 57, 59], 0.012, 850);
  pad(at(mid) - 0.1, at(TL.calm + 4), [43, 50, 55, 59, 62], 0.012, 1100);
  pad(at(TL.calm), at(TL.end + 50), [48, 55, 60, 64, 67], 0.014, 1400);
  EV.forEach((e, n) => {
    const t = at(TL.evF(n) + (TL.evF(n + 1) - TL.evF(n)) * 0.3), pan = (e.i / N - 0.5) * 1.2;
    if (e.t === 'slide') pluck(t, 93, 0.015, pan, 0.05, 'sine');
    else if (e.t === 'push') pluck(t, note(A[e.i]), 0.05, pan, 0.3);
    else if (e.t === 'pop') { const o = ac.createOscillator(), g = ac.createGain(), p = ac.createStereoPanner(); o.type = 'triangle';
      o.frequency.setValueAtTime(hz(note(A[e.j]) + 12), t); o.frequency.exponentialRampToValueAtTime(hz(note(A[e.j])), t + 0.14);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.045, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
      p.pan.value = pan; o.connect(g).connect(p).connect(master); o.start(t); o.stop(t + 0.2); }
    else if (e.t === 'keep') pluck(t, 86, 0.02, pan, 0.06, 'sine');
    else if (e.t === 'expire') { const s = ac.createBufferSource(); s.buffer = noise; const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1800; bp.Q.value = 2;
      const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.05, t + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
      s.connect(bp).connect(g).connect(master); s.start(t, rnd() * 0.5); s.stop(t + 0.22); }
    else if (e.t === 'out') { pluck(t, note(A[e.j]) + 12, 0.045, pan, 0.6, 'sine'); pluck(t + 0.015, note(A[e.j]) + 19, 0.015, pan, 0.4, 'sine'); }
  });
  [69, 72, 76, 81].forEach((m, i) => pluck(at(TL.calm) + i * 0.09, m, 0.06, -0.3 + i * 0.2, 1.6, 'sine'));
  [76, 81, 84, 88].forEach((m, i) => pluck(at(TL.end + 10 + i * 6), m, 0.05, -0.45 + i * 0.3, 1.8, 'sine'));
  const buf = await ac.startRendering();
  let peak = 0; for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let k = 0; k < d.length; k++) peak = Math.max(peak, Math.abs(d[k])); }
  const norm = 0.85 / Math.max(peak, 1e-6);                          // every piece peaks at the same level
  for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let k = 0; k < d.length; k++) d[k] *= norm; }
  return buf;
}

/* ==========================================================================
   VERTICAL CUT — shared block, identical in every piece.
   1080x1920 for Reels, Shorts and TikTok (__motion.variants.vertical). The
   piece's own scene code is re-used and recomposed for a phone: everything a
   viewer must read stays inside the area no platform covers (x 60..900,
   y 230..1400); outside it there is only dimmed texture.
   ========================================================================== */
const VW = 1080, VH = 1920, SAFE = { x: 60, y: 230, w: 840, h: 1170, r: 900, b: 1400 };
const vcv = document.createElement('canvas'); vcv.width = VW; vcv.height = VH;
const vx = vcv.getContext('2d', { willReadFrequently: true });   // CPU raster: identical pixels on every redraw
const VL = 96, VR = 864;                                          // text column inside the safe area

function vReset() {
  vx.setTransform(1, 0, 0, 1, 0, 0); vx.globalAlpha = 1; vx.globalCompositeOperation = 'source-over';
  vx.filter = 'none'; vx.shadowBlur = 0; vx.shadowColor = 'transparent'; vx.letterSpacing = '0px'; vx.setLineDash([]);
  vx.textAlign = 'left'; vx.textBaseline = 'alphabetic'; vx.lineCap = 'butt'; vx.lineJoin = 'miter';
}
/** Canvas text on the vertical frame; `max` shrinks the size until the line fits. */
function vText(str, x, y, { size = 40, weight = 700, color = '#FFFFFF', align = 'left', spacing = 0, alpha = 1, fam = FONT, max = 0 } = {}) {
  if (alpha <= 0.002 || !str) return size;
  vx.font = `${weight} ${size}px ${fam}`; vx.letterSpacing = spacing + 'px';
  if (max) { const w = vx.measureText(str).width; if (w > max) { size = size * max / w; vx.font = `${weight} ${size}px ${fam}`; } }
  vx.textAlign = align; vx.textBaseline = 'alphabetic';
  const a0 = vx.globalAlpha; vx.globalAlpha = a0 * alpha; vx.fillStyle = color;
  vx.fillText(str, x + (align === 'center' ? spacing / 2 : align === 'right' ? spacing : 0), y);   // tracking is added after the last glyph too
  vx.globalAlpha = a0; vx.letterSpacing = '0px';
  return size;
}
/** Word-wraps with the given font; returns the lines. */
function vWrap(str, maxW, size, weight = 700, fam = FONT) {
  vx.font = `${weight} ${size}px ${fam}`; vx.letterSpacing = '0px';
  const words = str.split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (vx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur);
  return lines;
}
/** Fade envelope with a small rise: [alpha, dy]. */
function vEnv(v, a, b, fin = 8, fout = 8) {
  const i = E.outCubic(prog(v, a, a + fin)), o = 1 - E.inCubic(prog(v, b - fout, b));
  return [Math.min(i, o), (1 - i) * 22 - (1 - o) * 10];
}
/** Which segment of a cut list a vertical frame is in: segs = [{ at, src, len }] in frames. */
function vSeg(segs, v) {
  let k = 0; while (k < segs.length - 1 && v >= segs[k + 1].at) k++;
  const s = segs[k];
  return { k, s, local: v - s.at, src: s.src + (v - s.at) };
}
/** Dims everything outside the safe area to a quiet texture (brightness x 0.2), with a soft inner edge. */
function vShade(rgb, a = 0.8, feather = 40) {
  vx.save(); vx.setTransform(1, 0, 0, 1, 0, 0); vx.globalAlpha = 1; vx.globalCompositeOperation = 'source-over';
  vx.fillStyle = `rgba(${rgb},${a})`;

  strip(SAFE.r, 0, SAFE.r - feather, 0, SAFE.r - feather, SAFE.y, feather, SAFE.h);
  strip(0, SAFE.y, 0, SAFE.y + feather, SAFE.x, SAFE.y, SAFE.w, feather);

/** Series tag at the top of the safe area, e.g. MADE IN CODE · 04. */
function vTag(label, color, alpha = 1) {
  vText('MADE IN CODE', VL, 292, { size: 28, weight: 800, color, spacing: 5, alpha });
  vx.font = `800 28px ${FONT}`; vx.letterSpacing = '5px';
  const w = vx.measureText('MADE IN CODE').width; vx.letterSpacing = '0px';

/** Big hook lines, left-aligned from y0; visible from frame 0, settles in a few frames. */

  lines.forEach((ln, i) => {
    const kk = E.outExpo(prog(v, -12 + i * 2, 8 + i * 2));
    vText(ln, VL, y0 + i * size * lh + (1 - kk) * 30, { size, weight, spacing, color: accent && i === lines.length - 1 ? accent : color, alpha: alpha * Math.max(0.25, kk), max: VR - VL });
  });

}
/** Closing card, the last 60 frames: piece title, "drawn in code · bytepatterns.com". l = frames into the card. */
function vEndCard(l, { title, line = '', ink = '#FFFFFF', dim = 'rgba(255,255,255,0.66)', accent = '#FFFFFF', scrim = '0,0,0', a = 0.84 }) {

  vx.fillStyle = accent; vx.globalAlpha = t1; vx.fillRect(VL, 742, 88 * t1, 7); vx.globalAlpha = 1;
  const size = vText(title, VL, 850 + (1 - t1) * 40, { size: 92, weight: 800, color: ink, spacing: -2, alpha: t1, max: VR - VL });
  const y2 = 850 + Math.max(size, 60) * 0.25 + 70;
  vx.font = `600 44px ${FONT}`;
  const lead = 'drawn in code  ·  ', lw = vx.measureText(lead).width;
  vText(lead, VL, y2 + (1 - t2) * 24, { size: 44, weight: 600, color: dim, alpha: t2 });
  vText('bytepatterns.com', VL + lw, y2 + (1 - t2) * 24, { size: 44, weight: 800, color: accent, alpha: t2 });

/** Seeks a cut. The first frame a page draws is drawn twice: the very first read of a
 *  GPU-backed source canvas can come out a shade different from every later one. */
let vWarm = false;
function vSeek(draw, i, frames) {
  const f = Math.max(0, Math.min(frames - 1, Math.floor(i)));
  if (!vWarm) { vWarm = true; draw(f); }
  draw(f);
}
/** The soundtrack of a cut: the piece's own audio() spliced to the same segments as the picture. */
async function vAudio(segs, frames, { xf = 0.025, fadeOut = 0.6, extra = null } = {}) {
  const src = await renderAudio();
  const SR = 48000, dur = frames / FPS, ac = new OfflineAudioContext(2, Math.round(SR * dur), SR);
  const out = ac.createGain(); out.connect(ac.destination);
  out.gain.setValueAtTime(1, 0); out.gain.setValueAtTime(1, dur - fadeOut); out.gain.linearRampToValueAtTime(0, dur - 0.01);

/* VERTICAL CUT — this piece */
// The same numbers and the same pass on a 1080 x 1920 stage and a faster clock; the bars are
// too narrow for their values here, so the values live on the deque's chips.
const TLV = buildTL({ s0: 40, s1: 470, calm: 480, end: 534 });
const VFR = TLV.end + 60, VEND = VFR - 60;
const GV = { TL: TLV, w: VW, h: VH, bx: VL, cw: (VR - VL) / N, bw: 18, by: 860, bh: 300, vals: false, val: 28, valGap: 20,
  oy: 990, oh: 70, ow: 18,
  dx: VL, dy: 1068, chip: 128, chipH: 108, chipV: 44, chipI: 26, cmpX: VL, cmpY: 1224, cmpS: 30,
  kx: VR, kw: 300, ky: 1236, kl: 40, ks: 30,
  capX: VL, capY: 390, cap: 46, capTwo: true, capMax: VR - VL,
  fo: 28, foX: VL, foY: 1346, foAlign: 'left', foX2: VL, foY2: 1384, foAlign2: 'left',
  fn: 76, fnX: VL, fnY: 800, fnAlign: 'left', fnMax: VR - VL };

  vHook(v, ['The max of', `every ${K}`, 'in a row.', 'No rescans.'], 510, { size: 104, accent: C.accent, color: C.paper, weight: 900, spacing: -2, alpha: o });

function vDraw(v) {

  scene(vx, GV, v);
  hookV(v);
  vReset();
  vShade(C.bgRGB, 0.86);
  vTag('MONOTONIC DEQUE', C.accent);
  if (v >= VEND) vEndCard(v - VEND, { title: 'Sliding Window Maximum', line: `${N} numbers  ·  window ${K}  ·  ${CMP} comparisons, not ${NAIVE}`,
    ink: C.paper, dim: 'rgba(241,238,230,0.72)', accent: C.accent, scrim: C.bgRGB, a: 0.88 });

// The player asks for a frame on every display refresh; at 30 fps on a 60 Hz screen every other call
// asks for the frame already on the canvas, which is then left as it is (same frame, same pixels).
const shown = { L: -1, V: -1 };
window.__motion = {
  title: 'Sliding Window Maximum',
  description: `A window of ${K} slides across ${N} numbers and a monotonic deque, never holding more than ${MAXDQ} of them, hands over all ${NW} window maxima from its front with ${CMP} comparisons instead of the ${NAIVE} that rescanning every window costs, each index pushed once and ${POPS} popped (${POPB} off the back by a bigger value, ${POPF} off the front by the window), ${OK ? 'every maximum matching a rescan' : 'though some maxima differ from a rescan'}.`,
  fps: FPS, width: W, height: H, frames: FRAMES,
  poster: Math.round(TLL.evF(stepStart(9)) + 4),
  gifStart: Math.floor(TLL.evF(stepStart(5)) / FPS),
  seek(i) { const f = Math.max(0, Math.min(FRAMES - 1, Math.floor(i))); if (f !== shown.L) { shown.L = f; draw(f); } },
  audio: () => renderAudio(TLL, FRAMES),
  variants: {
    vertical: {
      width: VW, height: VH, frames: VFR, canvas: vcv,
      poster: Math.round(TLV.evF(stepStart(9)) + 4), gifStart: Math.floor(TLV.evF(stepStart(5)) / FPS),
      seek(i) { const v = Math.max(0, Math.min(VFR - 1, Math.floor(i))); if (v !== shown.V) { shown.V = v; vSeek(vDraw, v, VFR); } },
      audio: () => renderAudio(TLV, VFR),
    },
  },
};

/* ==========================================================================
   PLAYER — identical in every piece; keep as is.
   Autoplays and loops, starts sound on the first click, ?frame=N pauses on a

   When the renderer sets window.__MOTION_RENDER__ it stays out of the way.

  const dur = M.frames / M.fps;
  if (window.__MOTION_RENDER__) { btn.hidden = true; M.seek(0); return; }
  if (q.has('frame')) { btn.hidden = true; M.seek(+q.get('frame') || 0); return; }
  let t0 = performance.now(), ac = null, src = null, buf = null, paused = false, pausedAt = 0;
  const clock = () => ac && src ? (ac.currentTime - t0) : (performance.now() - t0) / 1000;
  function loop() {
    if (!paused) M.seek(Math.floor(((clock() % dur) + dur) % dur * M.fps));
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  btn.addEventListener('click', async () => {
    if (src) { src.stop(); src = null; btn.textContent = 'Click for sound'; t0 = performance.now(); return; }
    btn.textContent = 'Loading sound…';
    ac = ac || new AudioContext({ sampleRate: 48000 });
    buf = buf || await M.audio();
    await ac.resume();
    src = ac.createBufferSource(); src.buffer = buf; src.loop = true; src.connect(ac.destination);
    t0 = ac.currentTime + 0.05; src.start(t0);        // picture restarts from frame 0 in sync with the sound
    btn.textContent = 'Sound on — click to mute';
  });
  addEventListener('keydown', e => {
    if (e.code !== 'Space') return;
    e.preventDefault(); paused = !paused;
    if (ac) paused ? ac.suspend() : ac.resume();
    if (!ac) { if (paused) pausedAt = performance.now(); else t0 += performance.now() - pausedAt; }
  });
})();
</script>
