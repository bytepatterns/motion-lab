<title>B-Tree Page Splits — motion-lab</title>
<style>
  /* Player chrome. The piece itself lives entirely in the canvas. */

  body { display: grid; place-items: center; font: 500 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; }

<body>
<canvas id="stage" width="1920" height="1080" aria-label="Rounded pages of numbered cells connected as a tree; a number drops from above, walks down to a leaf page and slots in; when a page holds four numbers it turns red, splits in two and its middle number rises into the page above, until a new root appears at the top"></canvas>
<button id="sound" type="button">Click for sound</button>
<script>
'use strict';
/* ==========================================================================
   PIECE — B-Tree Page Splits.
   A B-tree keeps sorted keys in pages. Here a page holds at most 3 keys (so
   up to 4 children). To insert a key: walk down from the root, at each page
   taking the child between the two keys that bracket it, and put the key
   into the leaf in order. If the leaf now holds 4 keys it splits: the two
   smaller keys stay, the largest moves to a new page, and the third key
   moves up into the parent, which may overflow and split in turn. When the
   root splits, a new root appears above it: the tree grows at the top, so
   every leaf is always at the same depth.
   The 18 keys are a seeded shuffle of 10..99. The inserts are run once and
   every intermediate state (key hovering over a page, key landed, page
   split) is kept; each frame lays out the state before and after its own
   step and blends them, so seek(i) is pure. Splits, pages, height and
   comparisons are counted by that run, not typed in, and so is the
   capacity of three levels of 500-key pages in the closing line.
   ========================================================================== */
const W = 1920, H = 1080, FPS = 30;
const cv = document.getElementById('stage');
const ctx = cv.getContext('2d', { willReadFrequently: true });   // CPU raster: identical pixels on every redraw
const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
const MONO = 'ui-monospace, "Cascadia Code", Consolas, Menlo, monospace';

// ---- helpers -------------------------------------------------------------
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));

const smooth = t => t * t * (3 - 2 * t);
const E = {
  inCubic: t => t * t * t,

  inOutCubic: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outExpo: t => t === 1 ? 1 : 1 - Math.pow(2, -10 * t),

/** Canvas text; `max` shrinks the size until the line fits. Returns the width drawn. */

  if (max) { const w0 = g.measureText(str).width; if (w0 > max) { size *= max / w0; g.font = `${weight} ${size}px ${fam}`; } }

  const a0 = g.globalAlpha; g.globalAlpha = a0 * alpha; g.fillStyle = color;
  g.fillText(str, x, y);

}
const measure = (g, str, size, weight = 800, fam = FONT, spacing = 0) => { g.font = `${weight} ${size}px ${fam}`; g.letterSpacing = spacing + 'px'; const w = g.measureText(str).width; g.letterSpacing = '0px'; return w; };

  const i = E.outCubic(prog(f, a, a + fin)), o = 1 - E.inCubic(prog(f, b - fout, b));
  return [Math.min(i, o), (1 - i) * 24 - (1 - o) * 10];

// ---- palette -------------------------------------------------------------
const C = {
  bg: '#0A0D14', bgRGB: '10,13,20', paper: '#EFF1EA', dim: 'rgba(239,241,234,0.62)', faint: 'rgba(239,241,234,0.14)',
  page: '#141A26', edge: 'rgba(239,241,234,0.3)', accent: '#7EE0D3', accentRGB: '126,224,211', over: '#FF6B6B', overRGB: '255,107,107',
  up: '#FFC857', upRGB: '255,200,87', key: '#EFF1EA',

// ---- the B-tree, run once ----------------------------------------------------------------
const MAXK = 3, NKEYS = 18, BIG = 500;
const KEYS = (() => {
  const r = mulberry32(3 * 7919), pool = [];

  for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }

/** Every state of the run: { nodes (id -> {keys, kids}), root, float, at, over, kind, ins, born, cmp, splits }. */
const STEPS = (() => {
  const nodes = [{ keys: [], kids: [] }], out = [];

  snap({ kind: 'start', ins: -1 });
  KEYS.forEach((x, ins) => {
    const path = []; let n = root;
    for (;;) {
      path.push(n);
      const nd = nodes[n]; let i = 0;
      while (i < nd.keys.length && nd.keys[i] < x) { i++; cmp++; }
      if (i < nd.keys.length) cmp++;
      snap({ kind: 'visit', ins, float: x, at: n, slot: i });
      if (!nd.kids.length) break;
      n = nd.kids[i];
    }
    const leaf = nodes[n]; let i = 0; while (i < leaf.keys.length && leaf.keys[i] < x) i++;
    leaf.keys.splice(i, 0, x);

    snap({ kind: 'land', ins, over: leaf.keys.length > MAXK ? n : -1 });
    while (nodes[path[d]].keys.length > MAXK) {
      const id = path[d], nd = nodes[id], m = 2, upKey = nd.keys[m];
      const right = { keys: nd.keys.slice(m + 1), kids: nd.kids.slice(m + 1) };
      nd.keys = nd.keys.slice(0, m); nd.kids = nd.kids.slice(0, m + 1);

      par.keys.splice(j, 0, upKey); par.kids.splice(j + 1, 0, rid);

      snap({ kind: 'split', ins, born, upKey, over: par.keys.length > MAXK ? path[d] : -1 });

})();
function heightOf(S) { let h = 1, n = S.root; while (S.nodes[n].kids.length) { n = S.nodes[n].kids[0]; h++; } return h; }
function pagesOf(S) { let c = 0; const walk = n => { c++; for (const k of S.nodes[n].kids) walk(k); }; walk(S.root); return c; }

const FINAL = STEPS[STEPS.length - 1];
const SPLITS = FINAL.splits, HEIGHT = heightOf(FINAL), PAGES = pagesOf(FINAL), CMPS = FINAL.cmp;
const ROOTSPLITS = STEPS.filter(s => s.kind === 'rootsplit').length;
const FIRST_SPLIT = STEPS.findIndex(s => s.kind === 'rootsplit' || s.kind === 'split');
const SECOND_ROOT = STEPS.findIndex((s, i) => s.kind === 'rootsplit' && i > FIRST_SPLIT);
const CAP3 = (BIG + 1) ** 3 - 1;                                          // keys in 3 full levels of 500-key pages
const fmt = n => Math.floor(n).toLocaleString('en-US');

// ---- timeline -------------------------------------------------------------------------------
// Each state gets its own number of frames; the first inserts (up to the first split) are slow.
function buildTL(o) {
  const TL = Object.assign({}, o);
  const slowIns = STEPS[FIRST_SPLIT].ins;
  TL.at = []; let f = TL.rule0;
  STEPS.forEach((s, k) => {
    const slow = s.ins <= slowIns, D = slow ? TL.slow : TL.fast;
    const d = k === 0 ? 0 : s.kind === 'visit' ? D.visit : s.kind === 'land' ? D.land : s.kind === 'hold' ? D.land : D.split;
    f += d; TL.at.push(f);                                               // frame at which state k is fully reached
  });

  const insStart = ins => TL.at[STEPS.findIndex(s => s.ins === ins)] - 10;
  const sec = STEPS[SECOND_ROOT].ins;
  TL.caps = [
    [TL.rule0 - 4, TL.at[FIRST_SPLIT] - 40, `A page holds|at most ${MAXK} keys.`],
    [TL.at[FIRST_SPLIT] - 36, insStart(slowIns + 2), `${MAXK + 1} keys? Split the page,|the middle key moves up.`],
    [insStart(slowIns + 2) + 4, insStart(sec) - 4, 'Keys walk down,|splits push keys up.'],
    [insStart(sec), TL.at[SECOND_ROOT] + 40, 'The root splits:|the tree grows at the top.'],
    [TL.at[SECOND_ROOT] + 44, TL.calm, 'Every leaf is|at the same depth.'],

}
/** State index k and blend e (0..1) from state k - 1 to state k at frame f. */
function stepAt(TL, f) {
  if (f <= TL.at[0]) return { k: 0, e: 1 };
  let k = 1; while (k < TL.at.length - 1 && f > TL.at[k]) k++;
  if (f > TL.at[k]) return { k: TL.at.length - 1, e: 1 };
  const d = TL.at[k] - TL.at[k - 1], p = clamp((f - TL.at[k - 1]) / d);
  return { k, e: E.inOutCubic(clamp(p / 0.8)), p };

// ---- layout: leaves left to right, parents centred over their children, leaves on one line ----
function layout(G, S) {
  const cell = G.cell, pad = G.pad, gap = G.gap, h = heightOf(S);
  const rect = {}, keyPos = {};
  let x = 0;
  const widthOf = n => Math.max(1, S.nodes[n].keys.length) * cell + 2 * pad;
  const place = (n, depth) => {
    const nd = S.nodes[n], w = widthOf(n);
    if (!nd.kids.length) { rect[n] = { x, w, depth }; x += w + gap; return; }
    for (const c of nd.kids) place(c, depth + 1);
    const a = rect[nd.kids[0]], b = rect[nd.kids[nd.kids.length - 1]], cx = (a.x + b.x + b.w) / 2;
    rect[n] = { x: cx - w / 2, w, depth };

  for (const id in rect) { x0 = Math.min(x0, rect[id].x); x1 = Math.max(x1, rect[id].x + rect[id].w); }

    R[id] = { x: ox + r.x * s, y: y - G.cellH * s / 2, w: r.w * s, h: G.cellH * s, s };
    S.nodes[id].keys.forEach((kk, i) => { keyPos[kk] = { x: R[id].x + (pad + (i + 0.5) * cell) * s, y, s }; });
  }

const LAY = new Map();
function lay(G, k) { const key = G.id + ':' + k; if (!LAY.has(key)) LAY.set(key, layout(G, STEPS[k])); return LAY.get(key); }

// ---- drawing ------------------------------------------------------------------------------
function rrect(g, x, y, w, h, r) {

// ---- landscape picture ------------------------------------------------------------------
const TLL = buildTL({ rule0: 60, slow: { visit: 16, land: 26, split: 40 }, fast: { visit: 4, land: 8, split: 15 }, calm: 0, end: 0 });

const FRAMES = TLL.end + 72;
const GL = { id: 'L', TL: TLL, w: W, h: H, cell: 84, cellH: 88, pad: 12, gap: 34, keySize: 42, treeX: 960, treeW: 1600, treeBot: 840, levH: 210, rootLabel: true,
  capX: 120, capY: 216, cap: 52, capTwo: false, capMax: 1680,
  fo: 30, foX: 120, foY: 1004, foX2: 1800, foY2: 1004, foAlign2: 'right', foMax: 1000,
  insX: 1800, insY: 216, insSize: 44, insAlign: 'right',
  fn: 88, fnX: W / 2, fnY: 226, fnAlign: 'center', fnMax: 1680,
  fnOne: `${NKEYS} keys, ${SPLITS} splits, ${HEIGHT} levels.`, fnTwo: `Pages of ${BIG} keys: ${HEIGHT} levels hold ${fmt(CAP3)}.` };
function hookL(f) {
  const o = 1 - E.inCubic(prog(f, TLL.rule0 - 12, TLL.rule0 + 4));
  if (o <= 0) return;
  const k = E.outExpo(prog(f, -8, 10)), k2 = E.outBack(prog(f, -6, 12));
  ctx.save(); ctx.fillStyle = `rgba(${C.bgRGB},${0.8 * o})`; ctx.fillRect(0, 400, W, 330); ctx.restore();
  text(ctx, `${NKEYS} keys. Pages of ${MAXK}.`, W / 2, 540 + (1 - k) * 30, { size: 108, weight: 900, color: C.paper, spacing: -3, align: 'center', alpha: o * Math.max(0.3, k) });
  text(ctx, 'A tree that grows upward.', W / 2, 670 + (1 - clamp(k2)) * 30, { size: 108, weight: 900, color: C.up, spacing: -3, align: 'center', alpha: o * Math.max(0.3, clamp(k2)) });
}
function draw(f) {
  if (ctx.reset) ctx.reset();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none'; ctx.shadowBlur = 0;
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  const T = TLL, endK = E.inOutCubic(prog(f, T.end, T.end + 20)), a = 1 - endK;
  scene(ctx, GL, f);
  text(ctx, 'DATA STRUCTURES  ·  B-TREE', 120, 104, { size: 26, weight: 600, color: C.dim, spacing: 5, alpha: a });
  text(ctx, 'BYTEPATTERNS', 1800, 104, { size: 26, weight: 600, color: C.dim, spacing: 5, align: 'right', alpha: a });
  hookL(f);
  if (endK > 0) {
    ctx.fillStyle = `rgba(${C.bgRGB},${0.86 * endK})`; ctx.fillRect(0, 0, W, H);
    const k1 = E.outCubic(prog(f, T.end + 6, T.end + 28)), k2 = E.outCubic(prog(f, T.end + 16, T.end + 38)), k3 = E.outCubic(prog(f, T.end + 26, T.end + 48));
    text(ctx, 'B-Tree Page Splits', W / 2, 500 + (1 - k1) * 30, { size: 140, weight: 850, color: C.paper, spacing: -3, align: 'center', alpha: k1, max: 1680 });
    text(ctx, `${NKEYS} inserts  ·  ${SPLITS} splits  ·  ${ROOTSPLITS} new roots  ·  every leaf at depth ${HEIGHT}`, W / 2, 580 + (1 - k2) * 20, { size: 42, weight: 500, color: C.up, align: 'center', alpha: k2 });

// ---- sound: a tick per page visited (higher near the root), a click per landing, a thump and a rising pair per split ----
async function renderAudio(TL = TLL, frames = FRAMES) {
  const SR = 48000, dur = frames / FPS, LEN = Math.round(SR * dur);
  const ac = new OfflineAudioContext(2, LEN, SR);
  const at = fr => fr / FPS;
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -16; comp.ratio.value = 3; comp.attack.value = 0.005; comp.release.value = 0.25;
  const master = ac.createGain(); master.gain.value = 0.9; master.connect(comp).connect(ac.destination);
  master.gain.setValueAtTime(0.9, dur - 1.0); master.gain.linearRampToValueAtTime(0.0001, dur - 0.02);
  const rnd = mulberry32(0x45B7EE);
  const ir = ac.createBuffer(2, SR * 2, SR);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let k = 0; k < d.length; k++) d[k] = (rnd() * 2 - 1) * Math.pow(1 - k / d.length, 3); }
  const verb = ac.createConvolver(); verb.buffer = ir; const vg = ac.createGain(); vg.gain.value = 0.3; verb.connect(vg).connect(master);
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  const pluck = (t0, m, amp, pan, dec = 0.35, type = 'triangle') => {
    const o = ac.createOscillator(), g = ac.createGain(), p = ac.createStereoPanner(); o.type = type; o.frequency.value = hz(m);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(amp, t0 + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dec);
    p.pan.value = pan; o.connect(g).connect(p); p.connect(master); p.connect(verb); o.start(t0); o.stop(t0 + dec + 0.05);
  };
  const thump = (t0, m, amp) => {
    const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine';
    o.frequency.setValueAtTime(hz(m) * 2, t0); o.frequency.exponentialRampToValueAtTime(hz(m), t0 + 0.09);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(amp, t0 + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.45);
    o.connect(g).connect(master); o.start(t0); o.stop(t0 + 0.5);
  };
  const pad = (t0, t1, notes, amp, cutoff) => {
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = cutoff; lp.Q.value = 1; lp.connect(master); lp.connect(verb);
    notes.forEach((m, i) => { for (const det of [-6, 6]) {
      const o = ac.createOscillator(), g = ac.createGain(), p = ac.createStereoPanner(); o.type = 'sawtooth'; o.frequency.value = hz(m); o.detune.value = det;
      p.pan.value = (i / Math.max(1, notes.length - 1) - 0.5) * 0.8 * Math.sign(det);
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(amp, t0 + 1.0); g.gain.setValueAtTime(amp, Math.max(t0 + 1.0, t1 - 0.8)); g.gain.exponentialRampToValueAtTime(0.0001, t1 + 0.4);
      o.connect(g).connect(p).connect(lp); o.start(t0); o.stop(t1 + 0.45); } });
  };
  const second = TL.at[SECOND_ROOT];
  pad(at(Math.max(0, TL.rule0 - 40)), at(TL.at[FIRST_SPLIT] + 10), [50, 57, 62, 64], 0.013, 900);
  pad(at(TL.at[FIRST_SPLIT]), at(second + 6), [46, 53, 58, 62], 0.012, 1000);
  pad(at(second), at(TL.end + 50), [43, 50, 55, 59, 62], 0.014, 1400);
  const PENTA = [0, 2, 4, 7, 9];
  STEPS.forEach((s, k) => {
    if (k === 0 || s.kind === 'hold') return;
    const t0 = at(TL.at[k - 1] + 0.5 * (TL.at[k] - TL.at[k - 1]));
    if (s.kind === 'visit') {
      const h = heightOf(s), d = h - 1 - (() => { let dd = 0, n = s.root; while (n !== s.at) { const nd = s.nodes[n]; let i = 0; while (i < nd.keys.length && nd.keys[i] < s.float) i++; n = nd.kids[i]; dd++; } return dd; })();
      pluck(t0, 76 + PENTA[Math.min(4, d)] + (d > 4 ? 12 : 0), 0.05, (s.slot / MAXK - 0.5) * 0.8, 0.2, 'sine');
    } else if (s.kind === 'land') {
      pluck(t0, 69 + PENTA[(KEYS[s.ins] * 7) % 5], s.over >= 0 ? 0.08 : 0.06, 0, 0.35);
    } else {
      const root = s.kind === 'rootsplit';
      thump(t0, root ? 33 : 38, root ? 0.28 : 0.2);
      pluck(t0 + 0.02, root ? 74 : 72, 0.06, -0.25, 0.6); pluck(t0 + 0.11, root ? 81 : 79, 0.06, 0.25, 0.8);
      if (root) pluck(t0 + 0.2, 86, 0.05, 0, 1.2, 'sine');
    }
  });
  [67, 71, 74, 79].forEach((m, i) => pluck(at(TL.calm) + i * 0.09, m, 0.06, -0.3 + i * 0.2, 1.6, 'sine'));
  [74, 79, 83, 86].forEach((m, i) => pluck(at(TL.end + 10 + i * 6), m, 0.05, -0.45 + i * 0.3, 1.8, 'sine'));
  const buf = await ac.startRendering();
  let peak = 0; for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let k = 0; k < d.length; k++) peak = Math.max(peak, Math.abs(d[k])); }
  const norm = 0.85 / Math.max(peak, 1e-6);                          // every piece peaks at the same level
  for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let k = 0; k < d.length; k++) d[k] *= norm; }
  return buf;
}

/* ==========================================================================
   VERTICAL CUT — shared block, identical in every piece.
   1080x1920 for Reels, Shorts and TikTok (__motion.variants.vertical). The
   piece's own scene code is re-used and recomposed for a phone: everything a
   viewer must read stays inside the area no platform covers (x 60..900,
   y 230..1400); outside it there is only dimmed texture.
   ========================================================================== */
const VW = 1080, VH = 1920, SAFE = { x: 60, y: 230, w: 840, h: 1170, r: 900, b: 1400 };
const vcv = document.createElement('canvas'); vcv.width = VW; vcv.height = VH;
const vx = vcv.getContext('2d', { willReadFrequently: true });   // CPU raster: identical pixels on every redraw
const VL = 96, VR = 864;                                          // text column inside the safe area

function vReset() {
  vx.setTransform(1, 0, 0, 1, 0, 0); vx.globalAlpha = 1; vx.globalCompositeOperation = 'source-over';
  vx.filter = 'none'; vx.shadowBlur = 0; vx.shadowColor = 'transparent'; vx.letterSpacing = '0px'; vx.setLineDash([]);
  vx.textAlign = 'left'; vx.textBaseline = 'alphabetic'; vx.lineCap = 'butt'; vx.lineJoin = 'miter';
}
/** Canvas text on the vertical frame; `max` shrinks the size until the line fits. */
function vText(str, x, y, { size = 40, weight = 700, color = '#FFFFFF', align = 'left', spacing = 0, alpha = 1, fam = FONT, max = 0 } = {}) {
  if (alpha <= 0.002 || !str) return size;
  vx.font = `${weight} ${size}px ${fam}`; vx.letterSpacing = spacing + 'px';
  if (max) { const w = vx.measureText(str).width; if (w > max) { size = size * max / w; vx.font = `${weight} ${size}px ${fam}`; } }
  vx.textAlign = align; vx.textBaseline = 'alphabetic';
  const a0 = vx.globalAlpha; vx.globalAlpha = a0 * alpha; vx.fillStyle = color;
  vx.fillText(str, x + (align === 'center' ? spacing / 2 : align === 'right' ? spacing : 0), y);   // tracking is added after the last glyph too
  vx.globalAlpha = a0; vx.letterSpacing = '0px';
  return size;
}
/** Word-wraps with the given font; returns the lines. */
function vWrap(str, maxW, size, weight = 700, fam = FONT) {
  vx.font = `${weight} ${size}px ${fam}`; vx.letterSpacing = '0px';
  const words = str.split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (vx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur);
  return lines;
}
/** Fade envelope with a small rise: [alpha, dy]. */
function vEnv(v, a, b, fin = 8, fout = 8) {
  const i = E.outCubic(prog(v, a, a + fin)), o = 1 - E.inCubic(prog(v, b - fout, b));
  return [Math.min(i, o), (1 - i) * 22 - (1 - o) * 10];
}
/** Which segment of a cut list a vertical frame is in: segs = [{ at, src, len }] in frames. */
function vSeg(segs, v) {
  let k = 0; while (k < segs.length - 1 && v >= segs[k + 1].at) k++;
  const s = segs[k];
  return { k, s, local: v - s.at, src: s.src + (v - s.at) };
}
/** Dims everything outside the safe area to a quiet texture (brightness x 0.2), with a soft inner edge. */
function vShade(rgb, a = 0.8, feather = 40) {
  vx.save(); vx.setTransform(1, 0, 0, 1, 0, 0); vx.globalAlpha = 1; vx.globalCompositeOperation = 'source-over';
  vx.fillStyle = `rgba(${rgb},${a})`;
  vx.beginPath(); vx.rect(0, 0, VW, VH); vx.rect(SAFE.x, SAFE.y, SAFE.w, SAFE.h); vx.fill('evenodd');
  const strip = (x0, y0, x1, y1, rx, ry, rw, rh) => {
    const g = vx.createLinearGradient(x0, y0, x1, y1);
    g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`);
    vx.fillStyle = g; vx.fillRect(rx, ry, rw, rh);
  };
  strip(SAFE.x, 0, SAFE.x + feather, 0, SAFE.x, SAFE.y, feather, SAFE.h);
  strip(SAFE.r, 0, SAFE.r - feather, 0, SAFE.r - feather, SAFE.y, feather, SAFE.h);
  strip(0, SAFE.y, 0, SAFE.y + feather, SAFE.x, SAFE.y, SAFE.w, feather);
  strip(0, SAFE.b, 0, SAFE.b - feather, SAFE.x, SAFE.b - feather, SAFE.w, feather);
  vx.restore();
}
/** Series tag at the top of the safe area, e.g. MADE IN CODE · 04. */
function vTag(label, color, alpha = 1) {
  vText('MADE IN CODE', VL, 292, { size: 28, weight: 800, color, spacing: 5, alpha });
  vx.font = `800 28px ${FONT}`; vx.letterSpacing = '5px';
  const w = vx.measureText('MADE IN CODE').width; vx.letterSpacing = '0px';
  vText('·  ' + label, VL + w + 14, 292, { size: 28, weight: 600, color: 'rgba(255,255,255,0.72)', spacing: 3, alpha, max: VR - VL - w - 14 });
}
/** Big hook lines, left-aligned from y0; visible from frame 0, settles in a few frames. */
function vHook(v, lines, y0, { size = 84, lh = 1.08, color = '#FFFFFF', accent = null, weight = 800, spacing = -1.5, alpha = 1 } = {}) {
  const k = E.outExpo(prog(v, -6, 12));
  lines.forEach((ln, i) => {
    const kk = E.outExpo(prog(v, -12 + i * 2, 8 + i * 2));
    vText(ln, VL, y0 + i * size * lh + (1 - kk) * 30, { size, weight, spacing, color: accent && i === lines.length - 1 ? accent : color, alpha: alpha * Math.max(0.25, kk), max: VR - VL });
  });
  return k;
}
/** Closing card, the last 60 frames: piece title, "drawn in code · bytepatterns.com". l = frames into the card. */
function vEndCard(l, { title, line = '', ink = '#FFFFFF', dim = 'rgba(255,255,255,0.66)', accent = '#FFFFFF', scrim = '0,0,0', a = 0.84 }) {
  const k = E.outCubic(prog(l, 0, 12));
  vx.save(); vx.setTransform(1, 0, 0, 1, 0, 0);
  vx.fillStyle = `rgba(${scrim},${a * k})`; vx.fillRect(0, 0, VW, VH);
  vx.restore();
  const t1 = E.outExpo(prog(l, 3, 19)), t2 = E.outExpo(prog(l, 11, 27)), t3 = E.outExpo(prog(l, 19, 35));
  vx.fillStyle = accent; vx.globalAlpha = t1; vx.fillRect(VL, 742, 88 * t1, 7); vx.globalAlpha = 1;
  const size = vText(title, VL, 850 + (1 - t1) * 40, { size: 92, weight: 800, color: ink, spacing: -2, alpha: t1, max: VR - VL });
  const y2 = 850 + Math.max(size, 60) * 0.25 + 70;
  vx.font = `600 44px ${FONT}`;
  const lead = 'drawn in code  ·  ', lw = vx.measureText(lead).width;
  vText(lead, VL, y2 + (1 - t2) * 24, { size: 44, weight: 600, color: dim, alpha: t2 });
  vText('bytepatterns.com', VL + lw, y2 + (1 - t2) * 24, { size: 44, weight: 800, color: accent, alpha: t2 });
  if (line) vText(line, VL, y2 + 72 + (1 - t3) * 18, { size: 32, weight: 500, color: dim, alpha: t3, max: VR - VL });
}
/** Seeks a cut. The first frame a page draws is drawn twice: the very first read of a
 *  GPU-backed source canvas can come out a shade different from every later one. */
let vWarm = false;
function vSeek(draw, i, frames) {
  const f = Math.max(0, Math.min(frames - 1, Math.floor(i)));
  if (!vWarm) { vWarm = true; draw(f); }
  draw(f);
}
/** The soundtrack of a cut: the piece's own audio() spliced to the same segments as the picture. */
async function vAudio(segs, frames, { xf = 0.025, fadeOut = 0.6, extra = null } = {}) {
  const src = await renderAudio();
  const SR = 48000, dur = frames / FPS, ac = new OfflineAudioContext(2, Math.round(SR * dur), SR);
  const out = ac.createGain(); out.connect(ac.destination);
  out.gain.setValueAtTime(1, 0); out.gain.setValueAtTime(1, dur - fadeOut); out.gain.linearRampToValueAtTime(0, dur - 0.01);
  segs.forEach((s, k) => {
    const at = s.at / FPS, off = s.src / FPS, d = s.len / FPS;
    const pre = k === 0 ? 0 : Math.min(xf, off), post = k === segs.length - 1 ? 0 : xf;
    const b = ac.createBufferSource(), g = ac.createGain(); b.buffer = src;
    g.gain.setValueAtTime(pre ? 0 : 1, at - pre);
    if (pre) g.gain.linearRampToValueAtTime(1, at + pre);
    if (post) { g.gain.setValueAtTime(1, at + d - post); g.gain.linearRampToValueAtTime(0, at + d + post); }
    b.connect(g).connect(out); b.start(at - pre, off - pre, d + pre + post);
  });
  if (extra) extra(ac, out);
  const buf = await ac.startRendering();
  let peak = 0; for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) peak = Math.max(peak, Math.abs(d[i])); }
  if (peak > 0.9) for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] *= 0.9 / peak; }
  return buf;
}
/** A soft three-partial bell, for the closing card. */
function vChime(ac, dest, at, freq, vol = 0.08) {
  for (const [mul, v, dec] of [[1, 1, 1.8], [2.01, 0.35, 0.8], [3.02, 0.12, 0.4]]) {
    const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.value = freq * mul;
    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol * v, at + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, at + dec);
    o.connect(g).connect(dest); o.start(at); o.stop(at + dec + 0.05);
  }
}

/* VERTICAL CUT — this piece */
// The same run on a 1080 x 1920 stage and a shorter clock; the tree is laid out
// inside the safe area with smaller cells, the readout below it.
const TLV = buildTL({ rule0: 40, slow: { visit: 10, land: 16, split: 26 }, fast: { visit: 3, land: 6, split: 11 }, calm: 0, end: 0 });
TLV.calm = TLV.last + 10; TLV.end = TLV.calm + 44;
const VFR = TLV.end + 60, VEND = VFR - 60;
const GV = { id: 'V', TL: TLV, w: VW, h: VH, cell: 60, cellH: 70, pad: 8, gap: 16, keySize: 34, treeX: 480, treeW: 780, treeBot: 1180, levH: 205, rootLabel: false,
  capX: VL, capY: 390, cap: 50, capTwo: true, capMax: VR - VL,
  fo: 30, foX: VL, foY: 1290, foX2: VL, foY2: 1340, foAlign2: 'left', foMax: VR - VL,
  insX: VL, insY: 560, insSize: 40, insAlign: 'left',
  fn: 80, fnX: VL, fnY: 560, fnAlign: 'left', fnMax: VR - VL,
  fnOne: `${SPLITS} splits, ${HEIGHT} levels.`, fnTwo: `${BIG}-key pages: ${HEIGHT} levels|hold ${fmt(CAP3)} keys.` };
GV.fnTwo = GV.fnTwo.replace('|', ' ');
function hookV(v) {
  const o = 1 - E.inCubic(prog(v, TLV.rule0 - 10, TLV.rule0 + 4));
  if (o <= 0) return;
  vx.save(); vx.fillStyle = `rgba(${C.bgRGB},${0.84 * o})`; vx.fillRect(SAFE.x, 400, SAFE.w, 560); vx.restore();
  vHook(v, [`Pages of ${MAXK} keys.`, `${NKEYS} inserts.`, 'The tree grows', 'from the top.'], 510, { size: 100, accent: C.up, color: C.paper, weight: 900, spacing: -2, alpha: o });
}
function vDraw(v) {
  if (vx.reset) vx.reset();
  vReset();
  vx.fillStyle = C.bg; vx.fillRect(0, 0, VW, VH);
  scene(vx, GV, v);
  hookV(v);
  vReset();
  vShade(C.bgRGB, 0.86);
  vTag('B-TREE', C.up);
  if (v >= VEND) vEndCard(v - VEND, { title: 'B-Tree Page Splits', line: `${NKEYS} inserts  ·  ${SPLITS} splits  ·  ${HEIGHT} levels`,
    ink: C.paper, dim: 'rgba(239,241,234,0.72)', accent: C.up, scrim: C.bgRGB, a: 0.88 });
  vReset();
}

// The player asks for a frame on every display refresh; at 30 fps on a 60 Hz screen every other call
// asks for the frame already on the canvas, which is then left as it is (same frame, same pixels).
const shown = { L: -1, V: -1 };
window.__motion = {
  title: 'B-Tree Page Splits',
  description: `A real B-tree with pages of at most ${MAXK} keys takes ${NKEYS} shuffled inserts: each key walks down from the root to a leaf (${CMPS} comparisons in all), a page that reaches ${MAXK + 1} keys splits and pushes its middle key up, ${SPLITS} splits in all, ${ROOTSPLITS} of them at the root, so the tree grows at the top to ${HEIGHT} levels and ${PAGES} pages with every leaf at the same depth; with ${BIG}-key pages, ${HEIGHT} levels would hold ${fmt(CAP3)} keys.`,
  fps: FPS, width: W, height: H, frames: FRAMES,
  poster: TLL.at[SECOND_ROOT] + 6,
  gifStart: Math.floor(TLL.at[SECOND_ROOT - 4] / FPS) - 3,
  seek(i) { const f = Math.max(0, Math.min(FRAMES - 1, Math.floor(i))); if (f !== shown.L) { shown.L = f; draw(f); } },
  audio: () => renderAudio(TLL, FRAMES),
  variants: {
    vertical: {
      width: VW, height: VH, frames: VFR, canvas: vcv,
      poster: TLV.at[SECOND_ROOT] + 4, gifStart: Math.floor(TLV.at[SECOND_ROOT - 4] / FPS) - 3,
      seek(i) { const v = Math.max(0, Math.min(VFR - 1, Math.floor(i))); if (v !== shown.V) { shown.V = v; vSeek(vDraw, v, VFR); } },
      audio: () => renderAudio(TLV, VFR),
    },
  },
};

/* ==========================================================================
   PLAYER — identical in every piece; keep as is.
   Autoplays and loops, starts sound on the first click, ?frame=N pauses on a
   frame, ?variant=vertical plays the vertical cut (if the piece has one).
   When the renderer sets window.__MOTION_RENDER__ it stays out of the way.
   ========================================================================== */
(function player() {
  const btn = document.getElementById('sound'), q = new URLSearchParams(location.search);
  let M = window.__motion;
  const V = !window.__MOTION_RENDER__ && M.variants && M.variants[q.get('variant')];
  if (V) {                                                // show the variant's own canvas instead
    M = Object.assign({}, M, V);
    V.canvas.style.cssText = `width:min(100vw,calc(100vh*${V.width}/${V.height}));height:auto;aspect-ratio:${V.width}/${V.height}`;
    document.querySelector('canvas').replaceWith(V.canvas);
  }
  const dur = M.frames / M.fps;
  if (window.__MOTION_RENDER__) { btn.hidden = true; M.seek(0); return; }
  if (q.has('frame')) { btn.hidden = true; M.seek(+q.get('frame') || 0); return; }
  let t0 = performance.now(), ac = null, src = null, buf = null, paused = false, pausedAt = 0;
  const clock = () => ac && src ? (ac.currentTime - t0) : (performance.now() - t0) / 1000;
  function loop() {
    if (!paused) M.seek(Math.floor(((clock() % dur) + dur) % dur * M.fps));
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  btn.addEventListener('click', async () => {
    if (src) { src.stop(); src = null; btn.textContent = 'Click for sound'; t0 = performance.now(); return; }
    btn.textContent = 'Loading sound…';
    ac = ac || new AudioContext({ sampleRate: 48000 });
    buf = buf || await M.audio();
    await ac.resume();
    src = ac.createBufferSource(); src.buffer = buf; src.loop = true; src.connect(ac.destination);
    t0 = ac.currentTime + 0.05; src.start(t0);        // picture restarts from frame 0 in sync with the sound
    btn.textContent = 'Sound on — click to mute';
  });
  addEventListener('keydown', e => {
    if (e.code !== 'Space') return;
    e.preventDefault(); paused = !paused;
    if (ac) paused ? ac.suspend() : ac.resume();
    if (!ac) { if (paused) pausedAt = performance.now(); else t0 += performance.now() - pausedAt; }
  });
})();
</script>
