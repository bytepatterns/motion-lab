<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="teambytepatterns">
<meta name="description" content="Forty points and every link to their nearest neighbours: Kruskal's algorithm takes the links shortest first, keeps one only when union-find says it joins two groups, and stops when a single tree connects all forty.">
<title>Kruskal’s Spanning Tree — motion-lab</title>
<style>
  /* Player chrome. The piece itself lives entirely in the canvas. */
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; font: 500 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; }
  canvas { display: block; width: min(100vw, calc(100vh * 16 / 9)); height: auto; aspect-ratio: 16 / 9; }
  #sound { position: fixed; left: 16px; bottom: 16px; padding: 8px 14px; border: 1px solid rgba(255,255,255,.35); border-radius: 999px;
           background: rgba(0,0,0,.55); color: #fff; font: inherit; cursor: pointer; }
  #sound[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080" aria-label="Forty dots scattered on a dark field, joined by faint grey lines; a row of bars sorted by height runs along the bottom; one by one the lines light up in colour or flash red and vanish, coloured groups of dots grow and merge until one coloured tree joins every dot"></canvas>
<button id="sound" type="button">Click for sound</button>
<script>
'use strict';
/* ==========================================================================
   PIECE — Kruskal's Spanning Tree.
   Forty points, each linked to its five nearest neighbours: those are the
   candidate edges, weighted by length. Kruskal's algorithm sorts them,
   shortest first, and walks the list: an edge whose two ends are in
   different groups is kept and the groups are merged; an edge whose ends
   are already in the same group would close a loop and is skipped. A
   union-find (disjoint-set) structure answers "same group?" with union by
   size and path halving. After n - 1 kept edges every point is in one group
   and the walk stops: the kept edges are a minimum spanning tree.
   Points, edges, the sort, every step, group colours and all totals are
   computed once at load (per stage); a frame only reads the step it is in,
   so seek(i) is pure in i.
   ========================================================================== */
const W = 1920, H = 1080, FPS = 30;
const cv = document.getElementById('stage');
const ctx = cv.getContext('2d', { willReadFrequently: true });   // CPU raster: identical pixels on every redraw
const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
const MONO = 'ui-monospace, "Cascadia Code", Consolas, Menlo, monospace';

// ---- helpers -------------------------------------------------------------
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (f, a, b) => clamp((f - a) / (b - a));
const smooth = t => t * t * (3 - 2 * t);
const E = {
  inCubic: t => t * t * t,
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inOutCubic: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outExpo: t => t === 1 ? 1 : 1 - Math.pow(2, -10 * t),
  inExpo: t => t === 0 ? 0 : Math.pow(2, 10 * t - 10),
  inOutExpo: t => t === 0 ? 0 : t === 1 ? 1 : t < .5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2,
  outBack: t => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2),
};
/** Canvas text; `max` shrinks the size until the line fits. Returns the width drawn. */
function text(g, str, x, y, { size = 40, weight = 600, color = '#fff', alpha = 1, spacing = 0, align = 'left', fam = FONT, base = 'alphabetic', max = 0 } = {}) {
  if (alpha <= 0.002 || !str) return 0;
  g.font = `${weight} ${size}px ${fam}`; g.letterSpacing = spacing + 'px';
  if (max) { const w0 = g.measureText(str).width; if (w0 > max) { size *= max / w0; g.font = `${weight} ${size}px ${fam}`; } }
  g.textAlign = align; g.textBaseline = base;
  const a0 = g.globalAlpha; g.globalAlpha = a0 * alpha; g.fillStyle = color;
  g.fillText(str, x, y);
  const w = g.measureText(str).width;
  g.globalAlpha = a0; g.letterSpacing = '0px';
  return w;
}
const measure = (g, str, size, weight = 800, fam = FONT, spacing = 0) => { g.font = `${weight} ${size}px ${fam}`; g.letterSpacing = spacing + 'px'; const w = g.measureText(str).width; g.letterSpacing = '0px'; return w; };
const env = (f, a, b, fin = 12, fout = 10) => {
  const i = E.outCubic(prog(f, a, a + fin)), o = 1 - E.inCubic(prog(f, b - fout, b));
  return [Math.min(i, o), (1 - i) * 24 - (1 - o) * 10];
};

// ---- palette -------------------------------------------------------------
const C = {
  bg: '#0A0D12', bgRGB: '10,13,18', paper: '#F1EEE6', dim: 'rgba(241,238,230,0.62)', faint: 'rgba(241,238,230,0.16)',
  accent: '#FFC857', accentRGB: '255,200,87', keep: '#4BE38A', keepRGB: '75,227,138', skip: '#FF5E6C', skipRGB: '255,94,108',
  groups: ['#5CD6CB', '#FFC857', '#8FA8FF', '#FF8FA3', '#B8F07A', '#C49BFF', '#FF9F6B', '#7FD1FF'],
};
const fmt = n => Math.round(n).toLocaleString('en-US');

// ---- the graph and the walk, computed once per stage ----------------------------------------
const NPTS = 40, K = 5;
function makeGraph(G) {
  const r = mulberry32(G.seed), P = [];
  for (let guard = 0; P.length < NPTS && guard < 40000; guard++) {
    const x = lerp(G.bx0, G.bx1, r()), y = lerp(G.by0, G.by1, r());
    if (P.every(p => Math.hypot(p[0] - x, p[1] - y) >= G.dmin)) P.push([x, y]);
  }
  const N = P.length, seen = new Set(), EDG = [];
  const add = (a, b) => { if (a > b) [a, b] = [b, a]; const key = a * 1000 + b; if (seen.has(key)) return;
    seen.add(key); EDG.push({ a, b, len: Math.hypot(P[a][0] - P[b][0], P[a][1] - P[b][1]) }); };
  for (let i = 0; i < N; i++) {
    const d = P.map((p, j) => [Math.hypot(p[0] - P[i][0], p[1] - P[i][1]), j]).filter(q => q[1] !== i).sort((u, v) => u[0] - v[0] || u[1] - v[1]);
    for (let q = 0; q < K; q++) add(i, d[q][1]);
  }
  // union-find with union by size and path halving
  const UF = n => { const par = Int16Array.from({ length: n }, (_, i) => i), size = new Int16Array(n).fill(1);
    const find = x => { while (par[x] !== x) { par[x] = par[par[x]]; x = par[x]; } return x; };
    return { par, size, find, union(a, b) { a = find(a); b = find(b); if (a === b) return -1; if (size[a] < size[b]) [a, b] = [b, a]; par[b] = a; size[a] += size[b]; return a; } }; };
  // the candidate graph must be connected: join any stray group by its shortest link
  for (;;) {
    const u = UF(N); for (const e of EDG) u.union(e.a, e.b);
    const r0 = u.find(0), out = []; for (let i = 0; i < N; i++) if (u.find(i) !== r0) out.push(i);
    if (!out.length) break;
    let best = null; for (let i = 0; i < N; i++) if (u.find(i) === r0) for (const j of out) { const d = Math.hypot(P[i][0] - P[j][0], P[i][1] - P[j][1]); if (!best || d < best[0]) best = [d, i, j]; }
    add(best[1], best[2]);
  }
  for (const e of EDG) e.w = Math.round(e.len / G.unit);
  EDG.sort((u, v) => u.w - v.w || u.len - v.len || u.a - v.a || u.b - v.b);
  const NE = EDG.length, ALL = EDG.reduce((s, e) => s + e.w, 0), WMAX = EDG[NE - 1].w, WMIN = EDG[0].w;
  // Kruskal: one step per edge looked at; after each step, the colour of every point's group
  const u = UF(N), gcol = new Int8Array(N).fill(-1);
  let nextCol = 0, acc = 0, rej = 0, total = 0, comps = N;
  const steps = [], PC0 = new Int8Array(N).fill(-1);
  for (let k = 0; k < NE && acc < N - 1; k++) {
    const e = EDG[k], ra = u.find(e.a), rb = u.find(e.b), keep = ra !== rb;
    if (keep) {
      const ca = gcol[ra], cb = gcol[rb], big = u.size[ra] >= u.size[rb] ? ra : rb, small = big === ra ? rb : ra;
      const col = gcol[big] >= 0 ? gcol[big] : gcol[small] >= 0 ? gcol[small] : (nextCol++ % C.groups.length);
      const root = u.union(ra, rb); gcol[root] = col; void ca; void cb;
      acc++; total += e.w; comps--;
    } else rej++;
    const pc = new Int8Array(N); for (let i = 0; i < N; i++) { const q = u.find(i); pc[i] = u.size[q] > 1 ? gcol[q] : -1; }
    steps.push({ k, keep, acc, rej, total, comps, pc, size: keep ? u.size[u.find(e.a)] : 0 });
  }
  const S = steps.length, firstSkip = steps.findIndex(s => !s.keep);
  return { P, N, EDG, NE, ALL, WMAX, WMIN, steps, S, PC0, total, rej, firstSkip };
}

// ---- timeline -------------------------------------------------------------------------------
// pop0: the points appear; lines0: the candidate links; bars0: the sorted list; scan0..scan1: the walk
// (the first slowN steps at slowD frames each, the rest share what is left); calm: the verdict; end: the card.
function buildTL(o, Gr) {
  const TL = Object.assign({}, o);
  TL.fastD = (TL.scan1 - TL.scan0 - TL.slowN * TL.slowD) / (Gr.S - TL.slowN);
  TL.start = k => TL.scan0 + (k < TL.slowN ? k * TL.slowD : TL.slowN * TL.slowD + (k - TL.slowN) * TL.fastD);
  const s = TL.start, fs = Gr.firstSkip, fsAt = Math.max(s(fs), s(TL.slowN) + 4);
  TL.caps = [
    [TL.lines0 - 4, TL.scan0 - 2, 'Every link to a near neighbour,|sorted shortest first.'],
    [TL.scan0, fsAt - 2, 'Take the shortest one left.|Keep it if it joins two groups.'],
    [fsAt, fsAt + TL.skipCap, 'Both ends in one group already?|Skip it: it would close a loop.'],
    [fsAt + TL.skipCap + 2, TL.scan1 + 2, 'Union-find answers “same group?”|in near-constant time.'],
    [TL.scan1 + 4, TL.calm - 2, `${Gr.N - 1} links join all ${Gr.N} points.|The last ${Gr.NE - Gr.S} are never checked.`],
  ];
  return TL;
}
/** The step in progress at frame f (-1 before the walk) and how far through it (0..1). */
function stepAt(TL, Gr, f) {
  if (f < TL.scan0) return { k: -1, p: 1 };
  if (f >= TL.scan1) return { k: Gr.S - 1, p: 1 };
  const b = TL.start(TL.slowN);
  let k = f < b ? Math.floor((f - TL.scan0) / TL.slowD) : TL.slowN + Math.floor((f - b) / TL.fastD);
  k = Math.min(Gr.S - 1, k);
  return { k, p: clamp((f - TL.start(k)) / (TL.start(k + 1) - TL.start(k))) };
}
const DEC = 0.4;                                          // fraction of a step at which the decision lands

// ---- drawing ------------------------------------------------------------------------------
function graph(g, G, f) {
  const TL = G.TL, Gr = G.Gr, { P, N, EDG, steps } = Gr, { k, p } = stepAt(TL, Gr, f);
  const decided = k >= 0 && p >= DEC, cur = k >= 0 ? steps[k] : null;
  const snap = k < 0 ? null : decided ? steps[k] : (k > 0 ? steps[k - 1] : null);
  const pc = snap ? snap.pc : Gr.PC0;
  const linesA = E.outCubic(prog(f, TL.lines0, TL.lines0 + 24));
  const rest = 1 - E.inOutCubic(prog(f, TL.scan1, TL.scan1 + 26));          // unchecked links fade once the tree is done
  g.save(); g.lineCap = 'round';
  // candidate links: faint until looked at; skipped ones flash red and are gone
  for (let q = 0; q < EDG.length; q++) {
    const e = EDG[q], [ax, ay] = P[e.a], [bx, by] = P[e.b];
    if (k >= 0 && q < k) { if (!steps[q].keep) continue; }
    else if (k >= 0 && q === k) continue;
    else { g.globalAlpha = linesA * 0.2 * (q >= Gr.S ? rest : 1); if (g.globalAlpha < 0.01) continue; g.strokeStyle = C.paper; g.lineWidth = 1.6;
      g.beginPath(); g.moveTo(ax, ay); g.lineTo(bx, by); g.stroke(); continue; }
    // a kept link, coloured by its group now
    const col = pc[e.a] >= 0 ? C.groups[pc[e.a]] : C.keep;
    g.globalAlpha = 1; g.strokeStyle = col; g.lineWidth = G.lw; g.beginPath(); g.moveTo(ax, ay); g.lineTo(bx, by); g.stroke();
  }
  // the link being looked at
  if (cur && f < TL.scan1) {
    const e = EDG[cur.k], [ax, ay] = P[e.a], [bx, by] = P[e.b], grow = E.outCubic(prog(p, 0, DEC));
    const mx = lerp(ax, bx, 0.5), my = lerp(ay, by, 0.5), hx = (bx - ax) / 2 * grow, hy = (by - ay) / 2 * grow;
    if (!decided) {
      g.globalAlpha = 1; g.strokeStyle = C.accent; g.lineWidth = G.lw + 1;
      g.beginPath(); g.moveTo(mx - hx, my - hy); g.lineTo(mx + hx, my + hy); g.stroke();
    } else if (cur.keep) {
      const q = prog(p, DEC, 1), col = pc[e.a] >= 0 ? C.groups[pc[e.a]] : C.keep;
      g.globalAlpha = 1 - q * 0.7; g.strokeStyle = `rgba(${C.keepRGB},0.5)`; g.lineWidth = G.lw + 12 * (1 - q); g.beginPath(); g.moveTo(ax, ay); g.lineTo(bx, by); g.stroke();
      g.globalAlpha = 1; g.strokeStyle = col; g.lineWidth = G.lw; g.beginPath(); g.moveTo(ax, ay); g.lineTo(bx, by); g.stroke();
    } else {
      const q = prog(p, DEC, 1);
      g.globalAlpha = 1 - E.inCubic(q); g.strokeStyle = C.skip; g.lineWidth = G.lw; g.setLineDash([10, 8]);
      g.beginPath(); g.moveTo(ax, ay); g.lineTo(bx, by); g.stroke(); g.setLineDash([]);
      // an x at the middle
      const s = 11 * (1 + 0.4 * (1 - q)); g.lineWidth = 4; g.beginPath(); g.moveTo(mx - s, my - s); g.lineTo(mx + s, my + s); g.moveTo(mx + s, my - s); g.lineTo(mx - s, my + s); g.stroke();
    }
  }
  g.restore();
  // points
  for (let i = 0; i < N; i++) {
    const t0 = TL.pop0 + i * TL.popD, s = clamp(E.outBack(prog(f, t0, t0 + 10)), 0, 1.3);
    if (s <= 0.01) continue;
    const [x, y] = P[i], col = pc[i] >= 0 ? C.groups[pc[i]] : C.paper;
    let ring = 0;
    if (cur && f < TL.scan1) { const e = EDG[cur.k]; if (i === e.a || i === e.b) ring = decided ? 1 - prog(p, DEC, 1) : E.outCubic(prog(p, 0, 0.2)); }
    g.save();
    if (ring > 0.01) { g.globalAlpha = ring; g.strokeStyle = decided && !cur.keep ? C.skip : C.accent; g.lineWidth = 3; g.beginPath(); g.arc(x, y, G.pr + 9, 0, Math.PI * 2); g.stroke(); }
    g.globalAlpha = 1; g.fillStyle = C.bg; g.beginPath(); g.arc(x, y, G.pr * s + 3, 0, Math.PI * 2); g.fill();
    g.fillStyle = col; g.beginPath(); g.arc(x, y, G.pr * s, 0, Math.PI * 2); g.fill();
    g.restore();
  }
  return { k, p, decided, snap };
}
/** The sorted list as bars, shortest first; a cursor walks it. */
function bars(g, G, f, st) {
  const TL = G.TL, Gr = G.Gr, { EDG, NE, WMAX, WMIN, steps } = Gr, [a] = env(f, TL.bars0, TL.end + 10, 14, 12);
  if (a <= 0) return;
  const bw = G.barW / NE, rest = 1 - E.inOutCubic(prog(f, TL.scan1, TL.scan1 + 26));
  g.save();
  for (let q = 0; q < NE; q++) {
    const h = G.barH * (0.14 + 0.86 * (EDG[q].w - WMIN) / Math.max(1, WMAX - WMIN)) * E.outCubic(prog(f, TL.bars0 + q * 0.2, TL.bars0 + q * 0.2 + 14));
    if (h <= 0.5) continue;
    let col = 'rgba(241,238,230,0.3)', al = a;
    if (st.k >= 0 && (q < st.k || (q === st.k && st.decided))) { col = steps[q].keep ? C.keep : C.skip; al = a * (steps[q].keep ? 1 : 0.55); }
    else if (st.k >= 0 && q === st.k && f < TL.scan1) col = C.accent;
    else if (q >= Gr.S) al = a * lerp(0.3, 1, rest);
    g.globalAlpha = al; g.fillStyle = col; g.fillRect(G.barX + q * bw + bw * 0.12, G.barY - h, Math.max(1, bw * 0.76), h);
  }
  // the cursor
  if (st.k >= 0 && f < TL.scan1 + 10) {
    const x = G.barX + (st.k + 0.5) * bw, ca = 1 - prog(f, TL.scan1, TL.scan1 + 10);
    g.globalAlpha = a * ca; g.fillStyle = C.accent; g.beginPath(); g.moveTo(x, G.barY + 6); g.lineTo(x - 9, G.barY + 20); g.lineTo(x + 9, G.barY + 20); g.closePath(); g.fill();
  }
  // where the walk stopped
  if (f >= TL.scan1) {
    const k2 = E.outCubic(prog(f, TL.scan1 + 6, TL.scan1 + 26)), x = G.barX + Gr.S * bw;
    g.globalAlpha = a * k2; g.strokeStyle = C.paper; g.lineWidth = 2; g.setLineDash([6, 6]);
    g.beginPath(); g.moveTo(x, G.barY - G.barH - 10); g.lineTo(x, G.barY + 4); g.stroke(); g.setLineDash([]);
    g.globalAlpha = 1;
    text(g, 'never checked', x + 14, G.barY - G.barH + 18, { size: 28, weight: 700, color: C.dim, alpha: a * k2 });
  }
  g.restore();
}
function caption(g, G, f) {
  for (const [t0, t1, str] of G.TL.caps) {
    const [a, dy] = env(f, t0, t1, 12, 10); if (a <= 0) continue;
    const [p1, p2] = str.split('|');
    if (G.capTwo) {
      text(g, p1, G.capX, G.capY + dy, { size: G.cap, weight: 850, color: C.paper, spacing: -1, alpha: a, max: G.capMax });
      text(g, p2, G.capX, G.capY + G.cap * 1.14 + dy, { size: G.cap, weight: 850, color: C.accent, spacing: -1, alpha: a, max: G.capMax });
    } else {
      const w1 = text(g, p1 + ' ', G.capX, G.capY + dy, { size: G.cap, weight: 850, color: C.paper, spacing: -1, alpha: a });
      text(g, p2, G.capX + w1, G.capY + dy, { size: G.cap, weight: 850, color: C.accent, spacing: -1, alpha: a });
    }
  }
}
function readout(g, G, f, st) {
  const TL = G.TL, Gr = G.Gr, [a] = env(f, TL.lines0 - 4, TL.end + 10, 12, 12);
  if (a <= 0) return;
  const s = st.snap, acc = s ? s.acc : 0, rej = s ? s.rej : 0, comps = s ? s.comps : Gr.N, total = s ? s.total : 0;
  const seen = st.k < 0 ? 0 : st.k + (st.decided ? 1 : 0);
  const l1 = `link ${seen} of ${Gr.NE}  ·  kept ${acc}  ·  skipped ${rej}`;
  const l2 = `${comps} group${comps === 1 ? '' : 's'}  ·  length ${fmt(total)}`;
  text(g, l1, G.foX, G.foY, { size: G.fo, weight: 700, color: C.paper, fam: MONO, alpha: a, align: G.foAlign, max: G.foMax });
  text(g, l2, G.foX2, G.foY2, { size: G.fo, weight: 700, color: C.dim, fam: MONO, alpha: a, align: G.foAlign2, max: G.foMax });
}
function finale(g, G, f) {
  const TL = G.TL, Gr = G.Gr, k1 = E.outCubic(prog(f, TL.calm, TL.calm + 18)), k2 = E.outCubic(prog(f, TL.calm + 10, TL.calm + 28));
  if (k1 <= 0) return;
  const out = 1 - E.inCubic(prog(f, TL.end - 6, TL.end + 12));
  g.save(); g.fillStyle = `rgba(${C.bgRGB},${0.8 * k1 * out})`; g.fillRect(0, G.fnY - G.fn * 1.2, G.w, G.fn * 2.9); g.restore();
  text(g, `${Gr.N - 1} links, length ${fmt(Gr.total)}.`, G.fnX, G.fnY, { size: G.fn, weight: 900, color: C.paper, spacing: -2, align: G.fnAlign, alpha: k1 * out, max: G.fnMax });
  text(g, `All ${Gr.NE} links: ${fmt(Gr.ALL)}.  The tree needs ${Math.round(100 * Gr.total / Gr.ALL)}%.`, G.fnX, G.fnY + G.fn * 1.05, { size: G.fn * 0.6, weight: 850, color: C.accent, spacing: -1, align: G.fnAlign, alpha: k2 * out, max: G.fnMax });
}
function scene(g, G, f) {
  const st = graph(g, G, f);
  bars(g, G, f, st);
  caption(g, G, f); readout(g, G, f, st); finale(g, G, f);
  return st;
}

// ---- landscape picture ------------------------------------------------------------------
const GL = { w: W, h: H, seed: 0x50C0FE, bx0: 170, bx1: 1750, by0: 300, by1: 790, dmin: 118, unit: 10, lw: 5, pr: 11,
  capX: 120, capY: 216, cap: 52, capTwo: false, capMax: 1680,
  barX: 120, barW: 1680, barY: 942, barH: 92,
  fo: 30, foX: 120, foY: 1004, foAlign: 'left', foX2: 1800, foY2: 1004, foAlign2: 'right', foMax: 900,
  fn: 96, fnX: W / 2, fnY: 560, fnAlign: 'center', fnMax: 1680 };
GL.Gr = makeGraph(GL);
const TLL = GL.TL = buildTL({ pop0: 40, popD: 1, lines0: 84, bars0: 104, scan0: 146, slowN: 8, slowD: 22, scan1: 612, skipCap: 72, calm: 668, end: 736 }, GL.Gr);
const FRAMES = TLL.end + 72;
function hookL(f) {
  const o = 1 - E.inCubic(prog(f, TLL.pop0 - 6, TLL.pop0 + 12));
  if (o <= 0) return;
  const k = E.outExpo(prog(f, -8, 10)), k2 = E.outBack(prog(f, -6, 12));
  ctx.save(); ctx.fillStyle = `rgba(${C.bgRGB},${0.8 * o})`; ctx.fillRect(0, 400, W, 330); ctx.restore();
  text(ctx, `${GL.Gr.N} points. Join them all.`, W / 2, 540 + (1 - k) * 30, { size: 108, weight: 900, color: C.paper, spacing: -3, align: 'center', alpha: o * Math.max(0.3, k) });

// ---- sound: a plink per point, a rising note per kept link (higher as groups grow), a dull knock per skip ----

  pad(at(TL.scan0), at(TL.scan1 + 6), [41, 48, 53, 57, 60], 0.012, 1100);

    const g = ac.createGain(); g.gain.setValueAtTime(0.0001, at(TL.lines0)); g.gain.exponentialRampToValueAtTime(0.045, at(TL.bars0 + 28)); g.gain.exponentialRampToValueAtTime(0.0001, at(TL.bars0 + 40));

/* ==========================================================================
   VERTICAL CUT — shared block, identical in every piece.
   1080x1920 for Reels, Shorts and TikTok (__motion.variants.vertical). The
   piece's own scene code is re-used and recomposed for a phone: everything a
   viewer must read stays inside the area no platform covers (x 60..900,
   y 230..1400); outside it there is only dimmed texture.
   ========================================================================== */
const VW = 1080, VH = 1920, SAFE = { x: 60, y: 230, w: 840, h: 1170, r: 900, b: 1400 };
const vcv = document.createElement('canvas'); vcv.width = VW; vcv.height = VH;
const vx = vcv.getContext('2d', { willReadFrequently: true });   // CPU raster: identical pixels on every redraw
const VL = 96, VR = 864;                                          // text column inside the safe area

function vReset() {
  vx.setTransform(1, 0, 0, 1, 0, 0); vx.globalAlpha = 1; vx.globalCompositeOperation = 'source-over';
  vx.filter = 'none'; vx.shadowBlur = 0; vx.shadowColor = 'transparent'; vx.letterSpacing = '0px'; vx.setLineDash([]);
  vx.textAlign = 'left'; vx.textBaseline = 'alphabetic'; vx.lineCap = 'butt'; vx.lineJoin = 'miter';
}
/** Canvas text on the vertical frame; `max` shrinks the size until the line fits. */
function vText(str, x, y, { size = 40, weight = 700, color = '#FFFFFF', align = 'left', spacing = 0, alpha = 1, fam = FONT, max = 0 } = {}) {
  if (alpha <= 0.002 || !str) return size;
  vx.font = `${weight} ${size}px ${fam}`; vx.letterSpacing = spacing + 'px';
  if (max) { const w = vx.measureText(str).width; if (w > max) { size = size * max / w; vx.font = `${weight} ${size}px ${fam}`; } }
  vx.textAlign = align; vx.textBaseline = 'alphabetic';
  const a0 = vx.globalAlpha; vx.globalAlpha = a0 * alpha; vx.fillStyle = color;
  vx.fillText(str, x + (align === 'center' ? spacing / 2 : align === 'right' ? spacing : 0), y);   // tracking is added after the last glyph too
  vx.globalAlpha = a0; vx.letterSpacing = '0px';

}
/** Word-wraps with the given font; returns the lines. */
function vWrap(str, maxW, size, weight = 700, fam = FONT) {
  vx.font = `${weight} ${size}px ${fam}`; vx.letterSpacing = '0px';
  const words = str.split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (vx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur);

}
/** Fade envelope with a small rise: [alpha, dy]. */
function vEnv(v, a, b, fin = 8, fout = 8) {
  const i = E.outCubic(prog(v, a, a + fin)), o = 1 - E.inCubic(prog(v, b - fout, b));
  return [Math.min(i, o), (1 - i) * 22 - (1 - o) * 10];

/** Which segment of a cut list a vertical frame is in: segs = [{ at, src, len }] in frames. */
function vSeg(segs, v) {
  let k = 0; while (k < segs.length - 1 && v >= segs[k + 1].at) k++;
  const s = segs[k];
  return { k, s, local: v - s.at, src: s.src + (v - s.at) };

  vx.save(); vx.setTransform(1, 0, 0, 1, 0, 0); vx.globalAlpha = 1; vx.globalCompositeOperation = 'source-over';
  vx.fillStyle = `rgba(${rgb},${a})`;

  strip(0, SAFE.y, 0, SAFE.y + feather, SAFE.x, SAFE.y, SAFE.w, feather);

/** Series tag at the top of the safe area, e.g. MADE IN CODE · 04. */
function vTag(label, color, alpha = 1) {
  vText('MADE IN CODE', VL, 292, { size: 28, weight: 800, color, spacing: 5, alpha });
  vx.font = `800 28px ${FONT}`; vx.letterSpacing = '5px';
  const w = vx.measureText('MADE IN CODE').width; vx.letterSpacing = '0px';

/** Big hook lines, left-aligned from y0; visible from frame 0, settles in a few frames. */

  lines.forEach((ln, i) => {
    const kk = E.outExpo(prog(v, -12 + i * 2, 8 + i * 2));

/** Closing card, the last 60 frames: piece title, "drawn in code · bytepatterns.com". l = frames into the card. */
function vEndCard(l, { title, line = '', ink = '#FFFFFF', dim = 'rgba(255,255,255,0.66)', accent = '#FFFFFF', scrim = '0,0,0', a = 0.84 }) {
  const k = E.outCubic(prog(l, 0, 12));

  vx.fillStyle = accent; vx.globalAlpha = t1; vx.fillRect(VL, 742, 88 * t1, 7); vx.globalAlpha = 1;

  const y2 = 850 + Math.max(size, 60) * 0.25 + 70;

/** Seeks a cut. The first frame a page draws is drawn twice: the very first read of a

let vWarm = false;
function vSeek(draw, i, frames) {
  const f = Math.max(0, Math.min(frames - 1, Math.floor(i)));

/** The soundtrack of a cut: the piece's own audio() spliced to the same segments as the picture. */
async function vAudio(segs, frames, { xf = 0.025, fadeOut = 0.6, extra = null } = {}) {
  const src = await renderAudio();

/* VERTICAL CUT — this piece */
// Forty points of its own, scattered over a portrait field on a 1080 x 1920 stage, and a
// faster clock; its links, sort, walk and totals are computed for it the same way.
const GV = { w: VW, h: VH, seed: 0x50C0FE, bx0: 120, bx1: 840, by0: 560, by1: 1110, dmin: 76, unit: 10, lw: 4, pr: 9,
  capX: VL, capY: 390, cap: 48, capTwo: true, capMax: VR - VL,

  fn: 80, fnX: VL, fnY: 800, fnAlign: 'left', fnMax: VR - VL };
GV.Gr = makeGraph(GV);

// The player asks for a frame on every display refresh; at 30 fps on a 60 Hz screen every other call

  fps: FPS, width: W, height: H, frames: FRAMES,

  audio: () => renderAudio(GL, FRAMES),

      poster: Math.round(TLV.start(Math.floor(GV.Gr.S * 0.6))), gifStart: Math.floor(TLV.start(TLV.slowN + 4) / FPS),

  },
};

/* ==========================================================================

  if (V) {                                                // show the variant's own canvas instead
    M = Object.assign({}, M, V);
    V.canvas.style.cssText = `width:min(100vw,calc(100vh*${V.width}/${V.height}));height:auto;aspect-ratio:${V.width}/${V.height}`;
    document.querySelector('canvas').replaceWith(V.canvas);
  }
  const dur = M.frames / M.fps;
  if (window.__MOTION_RENDER__) { btn.hidden = true; M.seek(0); return; }
  if (q.has('frame')) { btn.hidden = true; M.seek(+q.get('frame') || 0); return; }
  let t0 = performance.now(), ac = null, src = null, buf = null, paused = false, pausedAt = 0;
  const clock = () => ac && src ? (ac.currentTime - t0) : (performance.now() - t0) / 1000;
  function loop() {
    if (!paused) M.seek(Math.floor(((clock() % dur) + dur) % dur * M.fps));
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  btn.addEventListener('click', async () => {
    if (src) { src.stop(); src = null; btn.textContent = 'Click for sound'; t0 = performance.now(); return; }
    btn.textContent = 'Loading sound…';
    ac = ac || new AudioContext({ sampleRate: 48000 });
    buf = buf || await M.audio();
    await ac.resume();
    src = ac.createBufferSource(); src.buffer = buf; src.loop = true; src.connect(ac.destination);
    t0 = ac.currentTime + 0.05; src.start(t0);        // picture restarts from frame 0 in sync with the sound
    btn.textContent = 'Sound on — click to mute';
  });
  addEventListener('keydown', e => {
    if (e.code !== 'Space') return;
    e.preventDefault(); paused = !paused;
    if (ac) paused ? ac.suspend() : ac.resume();
    if (!ac) { if (paused) pausedAt = performance.now(); else t0 += performance.now() - pausedAt; }
  });
})();
</script>
