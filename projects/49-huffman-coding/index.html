<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="teambytepatterns">
<meta name="description" content="A sentence of 37 letters is counted, its eleven symbols are queued rarest first and joined two at a time into one tree, and the paths through that tree become codes that spell the sentence in 114 bits instead of 296.">
<title>Huffman Coding — motion-lab</title>
<style>
  /* Player chrome. The piece itself lives entirely in the canvas. */
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; font: 500 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; }
  canvas { display: block; width: min(100vw, calc(100vh * 16 / 9)); height: auto; aspect-ratio: 16 / 9; }
  #sound { position: fixed; left: 16px; bottom: 16px; padding: 8px 14px; border: 1px solid rgba(255,255,255,.35); border-radius: 999px;
           background: rgba(0,0,0,.55); color: #fff; font: inherit; cursor: pointer; }
  #sound[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080" aria-label="A line of capital letters at the top; circles with letters appear in a row, slide into order and are joined two at a time under new circles until one tree hangs from a single root; zeros and ones appear on its branches and two strips of coloured cells grow at the bottom, the lower one much shorter"></canvas>
<button id="sound" type="button">Click for sound</button>
<script>
'use strict';
/* ==========================================================================
   PIECE — Huffman Coding.
   Count how often every symbol occurs, put one leaf per symbol in a
   priority queue ordered by count, then repeat: take the two lightest trees,
   join them under a new node whose weight is their sum, and put it back.
   When one tree is left, the path from the root to a leaf is that symbol's
   code (left = 0, right = 1). Frequent symbols end up near the root with
   short codes, rare ones deep down with long codes, and no code is the
   prefix of another, so the bit string decodes without separators.
   The counts, every merge, every layout of the forest, the codes, the bit
   totals, the saving and the entropy bound are all computed at load from
   the sentence; each frame interpolates between two of those states, so

const W = 1920, H = 1080, FPS = 30;
const cv = document.getElementById('stage');
const ctx = cv.getContext('2d', { willReadFrequently: true });   // CPU raster: identical pixels on every redraw
const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';

/** Canvas text; `max` shrinks the size until the line fits. Returns the width drawn. */

// ---- palette -------------------------------------------------------------
const C = {
  bg: '#0B0D14', bgRGB: '11,13,20', paper: '#F1EEE6', dim: 'rgba(241,238,230,0.62)', faint: 'rgba(241,238,230,0.16)',
  accent: '#FFC857', accentRGB: '255,200,87', node: '#151A28', edge: 'rgba(241,238,230,0.34)',
  sym: ['#FFC857', '#5CD6CB', '#FF8FA3', '#8FA8FF', '#B8F07A', '#C49BFF', '#FF9F6B', '#7FD1FF', '#F2E394', '#9EE6B8', '#FFB3E6'],

// ---- the code, built once from the sentence ------------------------------------------------

    [TL.count0 - 6, TL.sort0 + 2, 'Count every letter:|common ones should cost less.'],
    [TL.sort0 + 2, TL.ms[1], 'Queue them rarest first,|join the two lightest.'],
    [TL.ms[1], TL.ms[NM] + 4, 'Their sum goes back in the queue.|Repeat.'],
    [TL.code0, TL.enc0 - 2, 'Left is 0, right is 1:|the path to a letter is its code.'],

}
/** The two layouts a frame lies between, how far, and the merge in progress. */
function stateAt(TL, f) {
  if (f < TL.sort0) return { A: LAY[0], B: LAY[0], e: 0, k: -1, p: 0 };
  if (f < TL.merge0) return { A: LAY[0], B: LAY[1], e: E.inOutCubic(prog(f, TL.sort0, TL.sort1)), k: -1, p: 0 };

// ---- drawing ------------------------------------------------------------------------------
/** A symbol; the space is drawn as an open box. */

  code0: 378, code1: 430, enc0: 436, enc1: 494, calm: 500, end: 534 });
const VFR = TLV.end + 60, VEND = VFR - 60;
const GV = { TL: TLV, w: VW, h: VH, capX: VL, capY: 390, cap: 48, capTwo: true, capMax: VR - VL,
  phX: 480, phY: 540, ph: 34, phCW: 20.6,
  x0: 480 - (NS - 1) * 38, u: 76, rowY: 648, gap: 86, rL: 27, rI: 23, lbl: 28, lblGap: 30, stack: true, sum: 28, bitSize: 28, bitOff: 14,
  tapeX: VL, tapeW: VR - VL, tapeY: 1306, tapeGap: 58, tapeH: 12, tapeLab: 28, tapeLabX: VL, tapeLabDY: -10, tapeLabAlign: 'left', tapeNumX: VR, tapeNumAlign: 'right',
  fo: 30, foX: VL, foY: 1300, foAlign: 'left', foX2: VL, foY2: 1350, foAlign2: 'left',
  fn: 84, fnX: VL, fnY: 800, fnAlign: 'left', fnMax: VR - VL };
function hookV(v) {
  const o = 1 - E.inCubic(prog(v, TLV.count0 - 12, TLV.count0 + 2));
  if (o <= 0) return;
  vx.save(); vx.fillStyle = `rgba(${C.bgRGB},${0.84 * o})`; vx.fillRect(SAFE.x, 400, SAFE.w, 560); vx.restore();
  vHook(v, [`${NCH} letters.`, `${ASCII} bits.`, 'Can we spend', 'fewer?'], 510, { size: 104, accent: C.accent, color: C.paper, weight: 900, spacing: -2, alpha: o });
}
function vDraw(v) {
  if (vx.reset) vx.reset();
  vReset();
  vx.fillStyle = C.bg; vx.fillRect(0, 0, VW, VH);
  scene(vx, GV, v);
  hookV(v);
  vReset();
  vShade(C.bgRGB, 0.86);
  vTag('HUFFMAN CODING', C.accent);
  if (v >= VEND) vEndCard(v - VEND, { title: 'Huffman Coding', line: `${NCH} letters  ·  ${NS} symbols  ·  ${ASCII} bits → ${HUFF}`,
    ink: C.paper, dim: 'rgba(241,238,230,0.72)', accent: C.accent, scrim: C.bgRGB, a: 0.88 });
  vReset();
}

// The player asks for a frame on every display refresh; at 30 fps on a 60 Hz screen every other call
// asks for the frame already on the canvas, which is then left as it is (same frame, same pixels).
const shown = { L: -1, V: -1 };
window.__motion = {
  title: 'Huffman Coding',
  description: `The sentence "${PHRASE}" is counted into ${NS} symbols, queued rarest first and joined two at a time in ${NM} merges into one tree whose paths become codes of ${MINL} to ${MAXL} bits, which spell its ${NCH} letters in ${HUFF} bits instead of ${ASCII} in 8-bit ASCII or ${FIXED} in a fixed ${FIXED / NCH}-bit code (entropy bound ${ENTROPY.toFixed(1)}).`,
  fps: FPS, width: W, height: H, frames: FRAMES,
  poster: TLL.ms[7] + 20,
  gifStart: Math.floor(TLL.ms[4] / FPS),
  seek(i) { const f = Math.max(0, Math.min(FRAMES - 1, Math.floor(i))); if (f !== shown.L) { shown.L = f; draw(f); } },
  audio: () => renderAudio(TLL, FRAMES),
  variants: {
    vertical: {
      width: VW, height: VH, frames: VFR, canvas: vcv,
      poster: TLV.enc0 + 30, gifStart: Math.floor(TLV.ms[6] / FPS),
      seek(i) { const v = Math.max(0, Math.min(VFR - 1, Math.floor(i))); if (v !== shown.V) { shown.V = v; vSeek(vDraw, v, VFR); } },
      audio: () => renderAudio(TLV, VFR),
    },
  },
};

/* ==========================================================================
   PLAYER — identical in every piece; keep as is.
   Autoplays and loops, starts sound on the first click, ?frame=N pauses on a
   frame, ?variant=vertical plays the vertical cut (if the piece has one).
   When the renderer sets window.__MOTION_RENDER__ it stays out of the way.
   ========================================================================== */
(function player() {
  const btn = document.getElementById('sound'), q = new URLSearchParams(location.search);
  let M = window.__motion;
  const V = !window.__MOTION_RENDER__ && M.variants && M.variants[q.get('variant')];
  if (V) {                                                // show the variant's own canvas instead
    M = Object.assign({}, M, V);
    V.canvas.style.cssText = `width:min(100vw,calc(100vh*${V.width}/${V.height}));height:auto;aspect-ratio:${V.width}/${V.height}`;
    document.querySelector('canvas').replaceWith(V.canvas);
  }
  const dur = M.frames / M.fps;
  if (window.__MOTION_RENDER__) { btn.hidden = true; M.seek(0); return; }
  if (q.has('frame')) { btn.hidden = true; M.seek(+q.get('frame') || 0); return; }
  let t0 = performance.now(), ac = null, src = null, buf = null, paused = false, pausedAt = 0;
  const clock = () => ac && src ? (ac.currentTime - t0) : (performance.now() - t0) / 1000;
  function loop() {
    if (!paused) M.seek(Math.floor(((clock() % dur) + dur) % dur * M.fps));
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  btn.addEventListener('click', async () => {
    if (src) { src.stop(); src = null; btn.textContent = 'Click for sound'; t0 = performance.now(); return; }
    btn.textContent = 'Loading sound…';
    ac = ac || new AudioContext({ sampleRate: 48000 });
    buf = buf || await M.audio();
    await ac.resume();
    src = ac.createBufferSource(); src.buffer = buf; src.loop = true; src.connect(ac.destination);
    t0 = ac.currentTime + 0.05; src.start(t0);        // picture restarts from frame 0 in sync with the sound
    btn.textContent = 'Sound on — click to mute';
  });
  addEventListener('keydown', e => {
    if (e.code !== 'Space') return;
    e.preventDefault(); paused = !paused;
    if (ac) paused ? ac.suspend() : ac.resume();
    if (!ac) { if (paused) pausedAt = performance.now(); else t0 += performance.now() - pausedAt; }
  });
})();
</script>
</body>
