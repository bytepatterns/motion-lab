<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="teambytepatterns">
<meta name="description" content="A thousand seeds are placed by one rule, turn by a fixed angle and step outwards; simple fractions of a turn leave spokes and gaps, the golden angle packs the disc evenly, its seeds line up in Fibonacci-numbered spirals, and a fifth of a degree off opens the gaps again.">
<title>The Golden Angle — motion-lab</title>
<style>
  /* Player chrome. The piece itself lives entirely in the canvas. */
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; font: 500 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; }
  canvas { display: block; width: min(100vw, calc(100vh * 16 / 9)); height: auto; aspect-ratio: 16 / 9; }
  #sound { position: fixed; left: 16px; bottom: 16px; padding: 8px 14px; border: 1px solid rgba(255,255,255,.35); border-radius: 999px;
           background: rgba(0,0,0,.55); color: #fff; font: inherit; cursor: pointer; }
  #sound[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080" aria-label="Warm dots grow outwards from a centre in two straight lines, then three, then five spokes; the spokes twist into spirals and close up into an evenly packed sunflower head; coloured curves trace its spiral arms one way and the other; the pattern briefly opens into spokes again and closes"></canvas>
<button id="sound" type="button">Click for sound</button>
<script>
'use strict';
/* ==========================================================================
   PIECE — The Golden Angle (phyllotaxis).
   Seed n sits at angle n·θ and radius c·√n: turn by a fixed fraction of a
   circle, step out so every seed gets the same area, repeat. If θ is p/q of
   a turn, every q-th seed lands on the same ray and the disc is q spokes
   with empty wedges between them. The golden angle, 360°/φ² ≈ 137.508°, is
   the angle worst approximated by fractions, so no ray ever repeats and the
   seeds pack evenly. Their nearest neighbours sit a Fibonacci number of
   seeds apart, which is why a sunflower shows two families of spirals with
   consecutive Fibonacci counts.
   The positions for each angle, the spokes, the widest empty gap (a grid of
   probe points against a spatial hash), and the neighbour spacings that
   pick out the spiral families are all computed at load; each frame places
   the seeds for the angle of that frame, so seek(i) is pure in i.
   ========================================================================== */
const W = 1920, H = 1080, FPS = 30;
const cv = document.getElementById('stage');
const ctx = cv.getContext('2d', { willReadFrequently: true });   // CPU raster: identical pixels on every redraw
const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
const MONO = 'ui-monospace, "Cascadia Code", Consolas, Menlo, monospace';

// ---- helpers -------------------------------------------------------------
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (f, a, b) => clamp((f - a) / (b - a));
const smooth = t => t * t * (3 - 2 * t);
const E = {
  inCubic: t => t * t * t,
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inOutCubic: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outExpo: t => t === 1 ? 1 : 1 - Math.pow(2, -10 * t),
  inExpo: t => t === 0 ? 0 : Math.pow(2, 10 * t - 10),
  inOutExpo: t => t === 0 ? 0 : t === 1 ? 1 : t < .5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2,
  outBack: t => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2),
};
/** Canvas text; `max` shrinks the size until the line fits. Returns the width drawn. */
function text(g, str, x, y, { size = 40, weight = 600, color = '#fff', alpha = 1, spacing = 0, align = 'left', fam = FONT, base = 'alphabetic', max = 0 } = {}) {
  if (alpha <= 0.002 || !str) return 0;
  g.font = `${weight} ${size}px ${fam}`; g.letterSpacing = spacing + 'px';
  if (max) { const w0 = g.measureText(str).width; if (w0 > max) { size *= max / w0; g.font = `${weight} ${size}px ${fam}`; } }
  g.textAlign = align; g.textBaseline = base;
  const a0 = g.globalAlpha; g.globalAlpha = a0 * alpha; g.fillStyle = color;
  g.fillText(str, x, y);
  const w = g.measureText(str).width;
  g.globalAlpha = a0; g.letterSpacing = '0px';
  return w;
}
const measure = (g, str, size, weight = 800, fam = FONT, spacing = 0) => { g.font = `${weight} ${size}px ${fam}`; g.letterSpacing = spacing + 'px'; const w = g.measureText(str).width; g.letterSpacing = '0px'; return w; };
const env = (f, a, b, fin = 12, fout = 10) => {
  const i = E.outCubic(prog(f, a, a + fin)), o = 1 - E.inCubic(prog(f, b - fout, b));
  return [Math.min(i, o), (1 - i) * 24 - (1 - o) * 10];
};

// ---- palette -------------------------------------------------------------
const C = {
  bg: '#0B0D14', bgRGB: '11,13,20', paper: '#F1EEE6', paperRGB: '241,238,230', dim: 'rgba(241,238,230,0.62)', faint: 'rgba(241,238,230,0.16)',
  accent: '#FFC857', accentRGB: '255,200,87', warm: [255, 143, 90], fam: ['#5CD6CB', '#FF8FA3', '#8FA8FF'], gap: '#FF5E6C',
};

// ---- the seeds and the measurements, computed once -----------------------------------------
const NS = 1000, PHI = (1 + Math.sqrt(5)) / 2, GOLD = 2 - PHI;          // golden angle, in turns (0.381966…)
const GOLDDEG = 360 * GOLD, OFFDEG = Math.round((GOLDDEG + 1) * 10) / 10, OFF = OFFDEG / 360;   // one degree off
const SEED_R = 0.8;                                                  // seed radius, in units of c
const gcd = (a, b) => b ? gcd(b, a % b) : a;
const RATIONAL = [[1, 2], [1, 3], [2, 5]];
function place(turn) { const P = new Float64Array(NS * 2); for (let n = 0; n < NS; n++) { const a = 2 * Math.PI * turn * n, r = Math.sqrt(n + 0.5); P[2 * n] = r * Math.cos(a); P[2 * n + 1] = r * Math.sin(a); } return P; }
/** A spatial hash of the seeds, for nearest-seed queries. */
function hash(P) {
  const cs = 2, M = new Map();
  for (let n = 0; n < NS; n++) { const k = Math.floor(P[2 * n] / cs) + ',' + Math.floor(P[2 * n + 1] / cs); if (!M.has(k)) M.set(k, []); M.get(k).push(n); }
  return (x, y, skip = -1) => {
    let best = Infinity, bi = -1; const gx = Math.floor(x / cs), gy = Math.floor(y / cs);
    for (let rad = 0; rad <= 4; rad++) {
      for (let i = gx - rad; i <= gx + rad; i++) for (let j = gy - rad; j <= gy + rad; j++) {
        if (Math.max(Math.abs(i - gx), Math.abs(j - gy)) < rad) continue;       // only the new ring of cells
        const L = M.get(i + ',' + j); if (!L) continue;
        for (const n of L) { if (n === skip) continue; const d = Math.hypot(P[2 * n] - x, P[2 * n + 1] - y); if (d < best) { best = d; bi = n; } }
      }
      if (best <= rad * cs) return [best, bi];
    }
    for (let n = 0; n < NS; n++) { if (n === skip) continue; const d = Math.hypot(P[2 * n] - x, P[2 * n + 1] - y); if (d < best) { best = d; bi = n; } }   // far from every seed: ask them all
    return [best, bi];
  };
}
/** The widest empty gap between seeds (as a count of seed widths) inside a ring of the disc. */
function widestGap(turn) {
  const P = place(turn), near = hash(P), R = Math.sqrt(NS), step = 0.35;
  let worst = 0;
  for (let x = -R; x <= R; x += step) for (let y = -R; y <= R; y += step) {
    const r = Math.hypot(x, y); if (r < 0.2 * R || r > 0.88 * R) continue;
    worst = Math.max(worst, near(x, y)[0]);
  }
  return Math.max(0, 2 * (worst - SEED_R)) / (2 * SEED_R);
}

const GAPS = { half: widestGap(1 / 2), third: widestGap(1 / 3), twofifths: widestGap(2 / 5), gold: widestGap(GOLD), off: widestGap(OFF) };
// neighbour spacings of the golden disc: how many seeds apart each seed's nearest neighbour is
const GP = place(GOLD), GNEAR = hash(GP), NND = new Float64Array(NS), NNK = new Int32Array(NS);
for (let n = 0; n < NS; n++) { const [d, m] = GNEAR(GP[2 * n], GP[2 * n + 1], n); NND[n] = d; NNK[n] = Math.abs(m - n); }
const FAMS = (function () {
  const cnt = new Map(); for (let n = 20; n < NS; n++) cnt.set(NNK[n], (cnt.get(NNK[n]) || 0) + 1);
  return [...cnt.entries()].sort((a, b) => b[1] - a[1]).slice(0, 3).map(e => e[0]).sort((a, b) => a - b);
})();
const FIB = [1, 2]; while (FIB[FIB.length - 1] < 10000) FIB.push(FIB[FIB.length - 1] + FIB[FIB.length - 2]);
const ALLFIB = FAMS.every(F => FIB.includes(F)), CONSEC = ALLFIB && FAMS.every((F, i) => i === 0 || FIB.indexOf(F) === FIB.indexOf(FAMS[i - 1]) + 1);
/** The segments of one spiral family: seed n - F to seed n wherever they are (almost) nearest neighbours. */
const SEGS = FAMS.map(F => { const s = []; for (let n = F; n < NS; n++) { const d = Math.hypot(GP[2 * n] - GP[2 * (n - F)], GP[2 * n + 1] - GP[2 * (n - F) + 1]); if (d < 1.2 * Math.max(NND[n], NND[n - F])) s.push(n); } return s; });
const fmtG = g => g.toFixed(1);

// ---- timeline -------------------------------------------------------------------------------
// segs: [start, arrive, turn], an eased move to a new angle (the first angle is 1/2 turn); grow0..grow1: the seeds appear;
// fam[k] = [a, b]: spiral family k is traced; calm: the verdict; end: the closing card.
function buildTL(o) {
  const TL = Object.assign({}, o);
  TL.caps = [
    [TL.grow0 - 4, TL.segs[0][0] - 2, 'Turn by an angle, step out a little.|Repeat a thousand times.'],
    [TL.segs[0][0], TL.segs[2][0] - 2, 'Simple fractions of a turn|pile the seeds up into spokes.'],
    [TL.segs[2][0], TL.gold0 - 2, 'Between the fractions,|the spokes twist into spirals.'],
    [TL.gold0, TL.fam[0][0] - 2, `The golden angle, 360° / φ²:|no spokes, no gaps.`],
    [TL.fam[0][0], TL.off0 - 2, `Nearest neighbours sit ${FAMS.join(', ')} seeds apart:|${CONSEC ? 'consecutive Fibonacci numbers.' : ALLFIB ? 'Fibonacci numbers.' : 'the spiral counts.'}`],
    [TL.off0, TL.calm - 2, `${Math.abs(OFFDEG - GOLDDEG).toFixed(1)}° off,|and the gaps come back.`],
  ];
  return TL;
}
/** The angle (in turns) at frame f. */
function turnAt(TL, f) {
  let t = 1 / 2;
  for (const [f0, f1, t1] of TL.segs) { if (f < f0) return t; if (f < f1) return lerp(t, t1, E.inOutCubic(prog(f, f0, f1))); t = t1; }
  return t;
}
/** What the angle is at frame f, for the readouts: a named stage, or null while moving. */
function stageAt(TL, f) {
  const t = turnAt(TL, f), near = (a, b) => Math.abs(a - b) < 1e-9;
  if (near(t, 1 / 2)) return { name: '1/2 turn', spokes: 2, gap: GAPS.half };
  if (near(t, 1 / 3)) return { name: '1/3 turn', spokes: 3, gap: GAPS.third };
  if (near(t, 2 / 5)) return { name: '2/5 turn', spokes: 5, gap: GAPS.twofifths };
  if (near(t, GOLD)) return { name: 'golden', spokes: 0, gap: GAPS.gold };
  if (near(t, OFF)) return { name: 'off', spokes: 0, gap: GAPS.off };
  return null;
}

// ---- drawing ------------------------------------------------------------------------------
const NB = 10;                                                       // colour bands, one path each
function seeds(g, G, f) {
  const TL = G.TL, [a] = env(f, TL.grow0 - 4, TL.end + 10, 4, 12);
  if (a <= 0) return;
  const turn = turnAt(TL, f), s = G.R / Math.sqrt(NS), cx = G.cx, cy = G.cy;
  const shown = NS * E.outCubic(prog(f, TL.grow0, TL.grow1)), famOn = TL.fam.some(([f0, f1]) => f >= f0 - 6 && f < f1 + 6);
  const dimK = Math.max(...TL.fam.map(([f0, f1]) => Math.min(E.outCubic(prog(f, f0 - 6, f0 + 10)), 1 - E.inCubic(prog(f, f1 - 4, f1 + 12)))), 0);
  const paths = Array.from({ length: NB }, () => new Path2D());
  const rot = -Math.PI / 2;
  for (let n = 0; n < NS; n++) {
    const k = clamp(shown - n, 0, 1); if (k <= 0) break;
    const ang = 2 * Math.PI * turn * n + rot, r = Math.sqrt(n + 0.5) * s, x = cx + r * Math.cos(ang), y = cy + r * Math.sin(ang);
    const rad = SEED_R * s * (0.55 + 0.45 * Math.sqrt((n + 1) / NS)) * (0.4 + 0.6 * k);
    const p = paths[Math.min(NB - 1, Math.floor(n / NS * NB))]; p.moveTo(x + rad, y); p.arc(x, y, rad, 0, Math.PI * 2);
  }
  g.save();
  for (let b = 0; b < NB; b++) {
    const u = b / (NB - 1), rgb = [lerp(C.warm[0], 241, u), lerp(C.warm[1], 238, u), lerp(C.warm[2], 230, u)].map(Math.round);
    g.globalAlpha = a * (0.95 - 0.55 * dimK); g.fillStyle = `rgb(${rgb.join(',')})`; g.fill(paths[b]);
  }
  g.restore();
  return famOn;
}
/** The spiral families: a line from seed n − F to seed n, traced outwards over the family's time. */
function families(g, G, f) {
  const TL = G.TL, s = G.R / Math.sqrt(NS), rot = -Math.PI / 2;
  const at = n => { const ang = 2 * Math.PI * GOLD * n + rot, r = Math.sqrt(n + 0.5) * s; return [G.cx + r * Math.cos(ang), G.cy + r * Math.sin(ang)]; };
  TL.fam.forEach(([f0, f1], k) => {
    const al = Math.min(E.outCubic(prog(f, f0, f0 + 8)), 1 - E.inCubic(prog(f, f1 - 4, f1 + 10)));
    if (al <= 0) return;
    const grow = NS * E.inOutCubic(prog(f, f0, f0 + (f1 - f0) * 0.6));
    const p = new Path2D();
    for (const n of SEGS[k]) { if (n > grow) break; const [x0, y0] = at(n - FAMS[k]), [x1, y1] = at(n); p.moveTo(x0, y0); p.lineTo(x1, y1); }
    g.save(); g.globalAlpha = al; g.strokeStyle = C.fam[k]; g.lineWidth = G.famW; g.lineCap = 'round'; g.stroke(p); g.restore();
    // the count, next to the disc
    text(g, `${FAMS[k]} spirals`, G.famX, G.famY + k * G.famL, { size: G.famS, weight: 850, color: C.fam[k], fam: MONO, alpha: al, align: G.famAlign });
  });
}
function dial(g, G, f) {
  const TL = G.TL, [a] = env(f, TL.grow0 - 6, TL.calm + 6, 10, 10);
  if (a <= 0) return;
  const t = turnAt(TL, f), deg = 360 * t, st = stageAt(TL, f);
  text(g, `${deg.toFixed(3)}°`, G.dX, G.dY, { size: G.dS, weight: 800, color: C.paper, fam: MONO, alpha: a });
  text(g, `${t.toFixed(5)} of a turn`, G.dX, G.dY + G.dS * 0.72, { size: G.dS2, weight: 700, color: C.dim, fam: MONO, alpha: a });
  let l1 = '', col = C.accent;
  if (st && st.spokes) { l1 = `${st.spokes} spokes  ·  gap ${fmtG(st.gap)} seeds wide`; col = C.gap; }
  else if (st && st.name === 'golden') l1 = `no spokes  ·  gap ${fmtG(st.gap)} seeds wide`;
  else if (st && st.name === 'off') { l1 = `gap ${fmtG(st.gap)} seeds wide`; col = C.gap; }
  else l1 = 'turning…';
  text(g, l1, G.dX, G.dY + G.dS * 0.72 + G.dS2 * 1.5, { size: G.dS2, weight: 800, color: st ? col : C.dim, fam: MONO, alpha: a, max: G.dMax });
}
function caption(g, G, f) {
  for (const [t0, t1, str] of G.TL.caps) {
    const [a, dy] = env(f, t0, t1, 10, 8); if (a <= 0) continue;
    const [p1, p2] = str.split('|');
    text(g, p1, G.capX, G.capY + dy, { size: G.cap, weight: 850, color: C.paper, spacing: -1, alpha: a, max: G.capMax });
    text(g, p2, G.capX, G.capY + G.cap * 1.14 + dy, { size: G.cap, weight: 850, color: C.accent, spacing: -1, alpha: a, max: G.capMax });
  }
}
function readout(g, G, f) {
  const TL = G.TL, [a] = env(f, TL.grow0 - 6, TL.calm, 10, 10);
  if (a <= 0) return;
  const n = Math.round(NS * E.outCubic(prog(f, TL.grow0, TL.grow1)));
  if (G.foX !== null) text(g, `seed n: angle n·θ, radius c·√n`, G.foX, G.foY, { size: G.fo, weight: 700, color: C.paper, fam: MONO, alpha: a, align: G.foAlign });
  text(g, `${n} of ${NS} seeds`, G.foX2, G.foY2, { size: G.fo, weight: 700, color: C.dim, fam: MONO, alpha: a, align: G.foAlign2 });
}
function finale(g, G, f) {
  const TL = G.TL, k1 = E.outCubic(prog(f, TL.calm, TL.calm + 18)), k2 = E.outCubic(prog(f, TL.calm + 10, TL.calm + 28));
  if (k1 <= 0) return;
  const out = 1 - E.inCubic(prog(f, TL.end - 6, TL.end + 12));
  g.save(); g.fillStyle = `rgba(${C.bgRGB},${0.84 * k1 * out})`; g.fillRect(0, G.fnY - G.fn * 1.2, G.w, G.fn * 2.9); g.restore();
  text(g, `360° / φ² = ${GOLDDEG.toFixed(3)}°`, G.fnX, G.fnY, { size: G.fn, weight: 900, color: C.paper, spacing: -2, align: G.fnAlign, alpha: k1 * out, max: G.fnMax });
  text(g, `gap ${fmtG(GAPS.gold)} seeds wide, against ${fmtG(GAPS.off)} at ${OFFDEG}° and ${fmtG(GAPS.twofifths)} at 2/5`, G.fnX, G.fnY + G.fn * 1.05, { size: G.fn * 0.5, weight: 850, color: C.accent, spacing: -1, align: G.fnAlign, alpha: k2 * out, max: G.fnMax });
}
function scene(g, G, f) {
  seeds(g, G, f); families(g, G, f); dial(g, G, f);
  caption(g, G, f); readout(g, G, f); finale(g, G, f);
}

// ---- landscape picture ------------------------------------------------------------------
const TLL = buildTL({ grow0: 54, grow1: 104,
  segs: [[106, 120, 1 / 3], [148, 160, 2 / 5], [196, 300, GOLD], [606, 638, OFF], [652, 664, GOLD]], gold0: 300,
  fam: [[372, 452], [452, 532], [532, 604]], off0: 604,
  calm: 666, end: 736 });
const FRAMES = TLL.end + 72;
const GL = { TL: TLL, w: W, h: H, cx: 1300, cy: 590, R: 405, famW: 3, famX: 1800, famY: 880, famL: 50, famS: 34, famAlign: 'right',
  dX: 120, dY: 600, dS: 88, dS2: 32, dMax: 700,
  capX: 120, capY: 300, cap: 50, capMax: 720,
  fo: 30, foX: 120, foY: 1004, foAlign: 'left', foX2: 1800, foY2: 1004, foAlign2: 'right',
  fn: 100, fnX: W / 2, fnY: 560, fnAlign: 'center', fnMax: 1680 };
function hookL(f) {
  const o = 1 - E.inCubic(prog(f, TLL.grow0 - 14, TLL.grow0 + 4));
  if (o <= 0) return;
  const k = E.outExpo(prog(f, -8, 10)), k2 = E.outBack(prog(f, -6, 12));
  ctx.save(); ctx.fillStyle = `rgba(${C.bgRGB},${0.8 * o})`; ctx.fillRect(0, 400, W, 330); ctx.restore();
  text(ctx, `${NS} seeds, one angle.`, W / 2, 540 + (1 - k) * 30, { size: 108, weight: 900, color: C.paper, spacing: -3, align: 'center', alpha: o * Math.max(0.3, k) });
  text(ctx, 'Which one packs a sunflower?', W / 2, 670 + (1 - clamp(k2)) * 30, { size: 108, weight: 900, color: C.accent, spacing: -3, align: 'center', alpha: o * Math.max(0.3, clamp(k2)) });
}
function draw(f) {
  if (ctx.reset) ctx.reset();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none'; ctx.shadowBlur = 0;
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  const T = TLL, endK = E.inOutCubic(prog(f, T.end, T.end + 20)), a = 1 - endK;
  scene(ctx, GL, f);
  text(ctx, 'GENERATIVE  ·  PHYLLOTAXIS', 120, 104, { size: 26, weight: 600, color: C.dim, spacing: 5, alpha: a });
  text(ctx, 'BYTEPATTERNS', 1800, 104, { size: 26, weight: 600, color: C.dim, spacing: 5, align: 'right', alpha: a });
  hookL(f);
  if (endK > 0) {
    ctx.fillStyle = `rgba(${C.bgRGB},${0.86 * endK})`; ctx.fillRect(0, 0, W, H);
    const k1 = E.outCubic(prog(f, T.end + 6, T.end + 28)), k2 = E.outCubic(prog(f, T.end + 16, T.end + 38)), k3 = E.outCubic(prog(f, T.end + 26, T.end + 48));
    text(ctx, 'The Golden Angle', W / 2, 500 + (1 - k1) * 30, { size: 140, weight: 850, color: C.paper, spacing: -3, align: 'center', alpha: k1, max: 1680 });
    text(ctx, `${NS} seeds  ·  ${GOLDDEG.toFixed(3)}°  ·  ${FAMS.join(' / ')} spirals  ·  no images`, W / 2, 580 + (1 - k2) * 20, { size: 42, weight: 500, color: C.accent, align: 'center', alpha: k2, max: 1680 });
    text(ctx, 'drawn in code  ·  bytepatterns.com', W / 2, 1000, { size: 32, weight: 600, color: C.paper, spacing: 3, align: 'center', alpha: k3 * 0.8 });
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.letterSpacing = '0px';
}

// ---- sound: plucks as seeds appear, a gliding tone that follows the angle, a chord at the golden angle, a note per spiral ----
async function renderAudio(TL = TLL, frames = FRAMES) {
  const SR = 48000, dur = frames / FPS, LEN = Math.round(SR * dur);
  const ac = new OfflineAudioContext(2, LEN, SR);
  const at = fr => fr / FPS;
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -16; comp.ratio.value = 3; comp.attack.value = 0.005; comp.release.value = 0.25;
  const master = ac.createGain(); master.gain.value = 0.9; master.connect(comp).connect(ac.destination);
  master.gain.setValueAtTime(0.9, dur - 1.0); master.gain.linearRampToValueAtTime(0.0001, dur - 0.02);
  const rnd = mulberry32(0x57F1B);
  const ir = ac.createBuffer(2, SR * 2, SR);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let k = 0; k < d.length; k++) d[k] = (rnd() * 2 - 1) * Math.pow(1 - k / d.length, 3); }
  const verb = ac.createConvolver(); verb.buffer = ir; const vg = ac.createGain(); vg.gain.value = 0.35; verb.connect(vg).connect(master);
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  const pluck = (t0, m, amp, pan, dec = 0.35, type = 'triangle') => {
    const o = ac.createOscillator(), g = ac.createGain(), p = ac.createStereoPanner(); o.type = type; o.frequency.value = hz(m);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(amp, t0 + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dec);
    p.pan.value = pan; o.connect(g).connect(p); p.connect(master); p.connect(verb); o.start(t0); o.stop(t0 + dec + 0.05);
  };
  const pad = (t0, t1, notes, amp, cutoff) => {
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = cutoff; lp.Q.value = 1; lp.connect(master); lp.connect(verb);
    notes.forEach((m, i) => { for (const det of [-6, 6]) {
      const o = ac.createOscillator(), g = ac.createGain(), p = ac.createStereoPanner(); o.type = 'sawtooth'; o.frequency.value = hz(m); o.detune.value = det;
      p.pan.value = (i / Math.max(1, notes.length - 1) - 0.5) * 0.8 * Math.sign(det);
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(amp, t0 + 1.0); g.gain.setValueAtTime(amp, Math.max(t0 + 1.0, t1 - 0.8)); g.gain.exponentialRampToValueAtTime(0.0001, t1 + 0.5);
      o.connect(g).connect(p).connect(lp); o.start(t0); o.stop(t1 + 0.55); } });
  };
  const PENTA = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24, 26, 28];
  pad(0, at(TL.gold0), [45, 52, 57, 60], 0.012, 800);
  pad(at(TL.gold0) - 0.2, at(TL.off0 + 4), [41, 48, 53, 57, 60, 64], 0.013, 1300);
  pad(at(TL.off0), at(TL.end + 50), [43, 50, 55, 59, 62], 0.013, 1200);
  // the seeds appearing: a pluck every 40 seeds, rising
  for (let q = 0; q < NS; q += 40) { const u = Math.sqrt(q / NS); pluck(at(TL.grow0 + (TL.grow1 - TL.grow0) * (1 - Math.cbrt(1 - q / NS))), 60 + PENTA[Math.min(12, Math.floor(u * 13))], 0.035, Math.sin(q * 2.4) * 0.6, 0.4); }
  // a tone gliding with the angle through every move
  { const o = ac.createOscillator(), g = ac.createGain(), lp = ac.createBiquadFilter(); o.type = 'triangle'; lp.type = 'lowpass'; lp.frequency.value = 1800;
    const toHz = t => 110 * Math.pow(2, t * 4.2);
    o.frequency.setValueAtTime(toHz(turnAt(TL, 0)), 0);
    for (let fr = 0; fr < frames; fr += 2) o.frequency.linearRampToValueAtTime(toHz(turnAt(TL, fr)), at(fr));
    g.gain.setValueAtTime(0.0001, 0); g.gain.setValueAtTime(0.0001, at(TL.grow0));
    let moving = false;
    for (let fr = TL.grow0; fr < TL.calm; fr++) { const m = Math.abs(turnAt(TL, fr + 1) - turnAt(TL, fr)) > 1e-7; if (m !== moving) { g.gain.setTargetAtTime(m ? 0.05 : 0.0001, at(fr), 0.08); moving = m; } }
    g.gain.setTargetAtTime(0.0001, at(TL.calm), 0.1);
    o.connect(lp).connect(g); g.connect(master); g.connect(verb); o.start(0); o.stop(dur); }
  // arrivals: a note per named stage
  TL.segs.forEach(([, fr, t], i) => { const m = t === GOLD ? [67, 71, 74, 79] : [62 + i * 2, 69 + i * 2]; m.forEach((n, q) => pluck(at(fr) + q * 0.07, n, 0.05, -0.3 + q * 0.2, 1.2, 'sine')); });
  // spiral families: a quick run of F / 4 notes as each family is traced
  TL.fam.forEach(([f0, f1], k) => { const n = Math.round(FAMS[k] / 4); for (let q = 0; q < n; q++) pluck(at(f0 + (f1 - f0) * 0.6 * q / n), 72 + PENTA[(q + k * 2) % 13], 0.03, (q / n - 0.5) * 1.2, 0.5, 'sine'); });
  [69, 72, 76, 81].forEach((m, i) => pluck(at(TL.calm) + i * 0.09, m, 0.06, -0.3 + i * 0.2, 1.6, 'sine'));
  [76, 81, 84, 88].forEach((m, i) => pluck(at(TL.end + 10 + i * 6), m, 0.05, -0.45 + i * 0.3, 1.8, 'sine'));
  const buf = await ac.startRendering();
  let peak = 0; for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let k = 0; k < d.length; k++) peak = Math.max(peak, Math.abs(d[k])); }
  const norm = 0.85 / Math.max(peak, 1e-6);                          // every piece peaks at the same level
  for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let k = 0; k < d.length; k++) d[k] *= norm; }
  return buf;
}

/* ==========================================================================
   VERTICAL CUT — shared block, identical in every piece.
   1080x1920 for Reels, Shorts and TikTok (__motion.variants.vertical). The
   piece's own scene code is re-used and recomposed for a phone: everything a
   viewer must read stays inside the area no platform covers (x 60..900,
   y 230..1400); outside it there is only dimmed texture.
   ========================================================================== */
const VW = 1080, VH = 1920, SAFE = { x: 60, y: 230, w: 840, h: 1170, r: 900, b: 1400 };
const vcv = document.createElement('canvas'); vcv.width = VW; vcv.height = VH;
const vx = vcv.getContext('2d', { willReadFrequently: true });   // CPU raster: identical pixels on every redraw
const VL = 96, VR = 864;                                          // text column inside the safe area

function vReset() {
  vx.setTransform(1, 0, 0, 1, 0, 0); vx.globalAlpha = 1; vx.globalCompositeOperation = 'source-over';
  vx.filter = 'none'; vx.shadowBlur = 0; vx.shadowColor = 'transparent'; vx.letterSpacing = '0px'; vx.setLineDash([]);
  vx.textAlign = 'left'; vx.textBaseline = 'alphabetic'; vx.lineCap = 'butt'; vx.lineJoin = 'miter';
}
/** Canvas text on the vertical frame; `max` shrinks the size until the line fits. */
function vText(str, x, y, { size = 40, weight = 700, color = '#FFFFFF', align = 'left', spacing = 0, alpha = 1, fam = FONT, max = 0 } = {}) {
  if (alpha <= 0.002 || !str) return size;
  vx.font = `${weight} ${size}px ${fam}`; vx.letterSpacing = spacing + 'px';
  if (max) { const w = vx.measureText(str).width; if (w > max) { size = size * max / w; vx.font = `${weight} ${size}px ${fam}`; } }
  vx.textAlign = align; vx.textBaseline = 'alphabetic';
  const a0 = vx.globalAlpha; vx.globalAlpha = a0 * alpha; vx.fillStyle = color;
  vx.fillText(str, x + (align === 'center' ? spacing / 2 : align === 'right' ? spacing : 0), y);   // tracking is added after the last glyph too
  vx.globalAlpha = a0; vx.letterSpacing = '0px';
  return size;
}
/** Word-wraps with the given font; returns the lines. */
function vWrap(str, maxW, size, weight = 700, fam = FONT) {
  vx.font = `${weight} ${size}px ${fam}`; vx.letterSpacing = '0px';
  const words = str.split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (vx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur);
  return lines;
}
/** Fade envelope with a small rise: [alpha, dy]. */
function vEnv(v, a, b, fin = 8, fout = 8) {
  const i = E.outCubic(prog(v, a, a + fin)), o = 1 - E.inCubic(prog(v, b - fout, b));
  return [Math.min(i, o), (1 - i) * 22 - (1 - o) * 10];
}
/** Which segment of a cut list a vertical frame is in: segs = [{ at, src, len }] in frames. */
function vSeg(segs, v) {
  let k = 0; while (k < segs.length - 1 && v >= segs[k + 1].at) k++;
  const s = segs[k];
  return { k, s, local: v - s.at, src: s.src + (v - s.at) };
}
/** Dims everything outside the safe area to a quiet texture (brightness x 0.2), with a soft inner edge. */
function vShade(rgb, a = 0.8, feather = 40) {
  vx.save(); vx.setTransform(1, 0, 0, 1, 0, 0); vx.globalAlpha = 1; vx.globalCompositeOperation = 'source-over';
  vx.fillStyle = `rgba(${rgb},${a})`;
  vx.beginPath(); vx.rect(0, 0, VW, VH); vx.rect(SAFE.x, SAFE.y, SAFE.w, SAFE.h); vx.fill('evenodd');
  const strip = (x0, y0, x1, y1, rx, ry, rw, rh) => {
    const g = vx.createLinearGradient(x0, y0, x1, y1);
    g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`);
    vx.fillStyle = g; vx.fillRect(rx, ry, rw, rh);
  };
  strip(SAFE.x, 0, SAFE.x + feather, 0, SAFE.x, SAFE.y, feather, SAFE.h);
  strip(SAFE.r, 0, SAFE.r - feather, 0, SAFE.r - feather, SAFE.y, feather, SAFE.h);
  strip(0, SAFE.y, 0, SAFE.y + feather, SAFE.x, SAFE.y, SAFE.w, feather);
  strip(0, SAFE.b, 0, SAFE.b - feather, SAFE.x, SAFE.b - feather, SAFE.w, feather);
  vx.restore();
}
/** Series tag at the top of the safe area, e.g. MADE IN CODE · 04. */
function vTag(label, color, alpha = 1) {
  vText('MADE IN CODE', VL, 292, { size: 28, weight: 800, color, spacing: 5, alpha });
  vx.font = `800 28px ${FONT}`; vx.letterSpacing = '5px';
  const w = vx.measureText('MADE IN CODE').width; vx.letterSpacing = '0px';
  vText('·  ' + label, VL + w + 14, 292, { size: 28, weight: 600, color: 'rgba(255,255,255,0.72)', spacing: 3, alpha, max: VR - VL - w - 14 });
}
/** Big hook lines, left-aligned from y0; visible from frame 0, settles in a few frames. */
function vHook(v, lines, y0, { size = 84, lh = 1.08, color = '#FFFFFF', accent = null, weight = 800, spacing = -1.5, alpha = 1 } = {}) {
  const k = E.outExpo(prog(v, -6, 12));
  lines.forEach((ln, i) => {
    const kk = E.outExpo(prog(v, -12 + i * 2, 8 + i * 2));
    vText(ln, VL, y0 + i * size * lh + (1 - kk) * 30, { size, weight, spacing, color: accent && i === lines.length - 1 ? accent : color, alpha: alpha * Math.max(0.25, kk), max: VR - VL });
  });
  return k;
}
/** Closing card, the last 60 frames: piece title, "drawn in code · bytepatterns.com". l = frames into the card. */
function vEndCard(l, { title, line = '', ink = '#FFFFFF', dim = 'rgba(255,255,255,0.66)', accent = '#FFFFFF', scrim = '0,0,0', a = 0.84 }) {
  const k = E.outCubic(prog(l, 0, 12));
  vx.save(); vx.setTransform(1, 0, 0, 1, 0, 0);
  vx.fillStyle = `rgba(${scrim},${a * k})`; vx.fillRect(0, 0, VW, VH);
  vx.restore();
  const t1 = E.outExpo(prog(l, 3, 19)), t2 = E.outExpo(prog(l, 11, 27)), t3 = E.outExpo(prog(l, 19, 35));
  vx.fillStyle = accent; vx.globalAlpha = t1; vx.fillRect(VL, 742, 88 * t1, 7); vx.globalAlpha = 1;
  const size = vText(title, VL, 850 + (1 - t1) * 40, { size: 92, weight: 800, color: ink, spacing: -2, alpha: t1, max: VR - VL });
  const y2 = 850 + Math.max(size, 60) * 0.25 + 70;
  vx.font = `600 44px ${FONT}`;
  const lead = 'drawn in code  ·  ', lw = vx.measureText(lead).width;
  vText(lead, VL, y2 + (1 - t2) * 24, { size: 44, weight: 600, color: dim, alpha: t2 });
  vText('bytepatterns.com', VL + lw, y2 + (1 - t2) * 24, { size: 44, weight: 800, color: accent, alpha: t2 });
  if (line) vText(line, VL, y2 + 72 + (1 - t3) * 18, { size: 32, weight: 500, color: dim, alpha: t3, max: VR - VL });
}
/** Seeks a cut. The first frame a page draws is drawn twice: the very first read of a
 *  GPU-backed source canvas can come out a shade different from every later one. */
let vWarm = false;
function vSeek(draw, i, frames) {
  const f = Math.max(0, Math.min(frames - 1, Math.floor(i)));
  if (!vWarm) { vWarm = true; draw(f); }
  draw(f);
}
/** The soundtrack of a cut: the piece's own audio() spliced to the same segments as the picture. */
async function vAudio(segs, frames, { xf = 0.025, fadeOut = 0.6, extra = null } = {}) {
  const src = await renderAudio();
  const SR = 48000, dur = frames / FPS, ac = new OfflineAudioContext(2, Math.round(SR * dur), SR);
  const out = ac.createGain(); out.connect(ac.destination);
  out.gain.setValueAtTime(1, 0); out.gain.setValueAtTime(1, dur - fadeOut); out.gain.linearRampToValueAtTime(0, dur - 0.01);
  segs.forEach((s, k) => {
    const at = s.at / FPS, off = s.src / FPS, d = s.len / FPS;
    const pre = k === 0 ? 0 : Math.min(xf, off), post = k === segs.length - 1 ? 0 : xf;
    const b = ac.createBufferSource(), g = ac.createGain(); b.buffer = src;
    g.gain.setValueAtTime(pre ? 0 : 1, at - pre);
    if (pre) g.gain.linearRampToValueAtTime(1, at + pre);
    if (post) { g.gain.setValueAtTime(1, at + d - post); g.gain.linearRampToValueAtTime(0, at + d + post); }
    b.connect(g).connect(out); b.start(at - pre, off - pre, d + pre + post);
  });
  if (extra) extra(ac, out);
  const buf = await ac.startRendering();
  let peak = 0; for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) peak = Math.max(peak, Math.abs(d[i])); }
  if (peak > 0.9) for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] *= 0.9 / peak; }
  return buf;
}
/** A soft three-partial bell, for the closing card. */
function vChime(ac, dest, at, freq, vol = 0.08) {
  for (const [mul, v, dec] of [[1, 1, 1.8], [2.01, 0.35, 0.8], [3.02, 0.12, 0.4]]) {
    const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.value = freq * mul;
    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol * v, at + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, at + dec);
    o.connect(g).connect(dest); o.start(at); o.stop(at + dec + 0.05);
  }
}

/* VERTICAL CUT — this piece */
// The same seeds, angles and spirals on a 1080 x 1920 stage and a faster clock: the disc in the
// middle of the safe area, the angle underneath.
const TLV = buildTL({ grow0: 40, grow1: 76,
  segs: [[78, 88, 1 / 3], [106, 116, 2 / 5], [134, 202, GOLD], [406, 434, OFF], [458, 472, GOLD]], gold0: 202,
  fam: [[248, 300], [300, 352], [352, 404]], off0: 404,
  calm: 484, end: 534 });
const VFR = TLV.end + 60, VEND = VFR - 60;
const GV = { TL: TLV, w: VW, h: VH, cx: 480, cy: 820, R: 342, famW: 2.5, famX: VR, famY: 1272, famL: 42, famS: 30, famAlign: 'right',
  dX: VL, dY: 1232, dS: 56, dS2: 28, dMax: VR - VL,
  capX: VL, capY: 390, cap: 46, capMax: VR - VL,
  fo: 28, foX: null, foY: 0, foAlign: 'left', foX2: VL, foY2: 1370, foAlign2: 'left',
  fn: 64, fnX: VL, fnY: 800, fnAlign: 'left', fnMax: VR - VL };
function hookV(v) {
  const o = 1 - E.inCubic(prog(v, TLV.grow0 - 10, TLV.grow0 + 4));
  if (o <= 0) return;
  vx.save(); vx.fillStyle = `rgba(${C.bgRGB},${0.86 * o})`; vx.fillRect(SAFE.x, 400, SAFE.w, 560); vx.restore();
  vHook(v, [`${NS} seeds.`, 'One angle.', 'Which one', 'packs best?'], 510, { size: 104, accent: C.accent, color: C.paper, weight: 900, spacing: -2, alpha: o });
}
function vDraw(v) {
  if (vx.reset) vx.reset();
  vReset();
  vx.fillStyle = C.bg; vx.fillRect(0, 0, VW, VH);
  scene(vx, GV, v);
  hookV(v);
  vReset();
  vShade(C.bgRGB, 0.9);
  vTag('PHYLLOTAXIS', C.accent);
  if (v >= VEND) vEndCard(v - VEND, { title: 'The Golden Angle', line: `${NS} seeds  ·  ${GOLDDEG.toFixed(3)}°  ·  ${FAMS.join(' / ')} spirals`,
    ink: C.paper, dim: 'rgba(241,238,230,0.72)', accent: C.accent, scrim: C.bgRGB, a: 0.88 });
  vReset();
}

// The player asks for a frame on every display refresh; at 30 fps on a 60 Hz screen every other call
// asks for the frame already on the canvas, which is then left as it is (same frame, same pixels).
const shown = { L: -1, V: -1 };
window.__motion = {
  title: 'The Golden Angle',
  description: `Generative: ${NS} seeds at angle n·θ and radius c·√n form ${RATIONAL.map(([p, q]) => q / gcd(p, q)).join(', ')} spokes with gaps up to ${fmtG(GAPS.half)} seeds wide at ${RATIONAL.map(([p, q]) => p + '/' + q).join(', ')} of a turn, pack evenly (widest gap ${fmtG(GAPS.gold)} seeds) at the golden angle of ${GOLDDEG.toFixed(3)}°, where nearest neighbours sit ${FAMS.join(', ')} seeds apart and trace ${FAMS.join(', ')} spirals, and open to a ${fmtG(GAPS.off)}-seed gap at ${OFFDEG}°.`,
  fps: FPS, width: W, height: H, frames: FRAMES,
  poster: TLL.fam[1][0] + 40,
  gifStart: Math.floor(TLL.segs[2][0] / FPS),
  seek(i) { const f = Math.max(0, Math.min(FRAMES - 1, Math.floor(i))); if (f !== shown.L) { shown.L = f; draw(f); } },
  audio: () => renderAudio(TLL, FRAMES),
  variants: {
    vertical: {
      width: VW, height: VH, frames: VFR, canvas: vcv,
      poster: TLV.fam[1][0] + 30, gifStart: Math.floor(TLV.segs[2][0] / FPS),
      seek(i) { const v = Math.max(0, Math.min(VFR - 1, Math.floor(i))); if (v !== shown.V) { shown.V = v; vSeek(vDraw, v, VFR); } },
      audio: () => renderAudio(TLV, VFR),
    },
  },
};

/* ==========================================================================
   PLAYER — identical in every piece; keep as is.
   Autoplays and loops, starts sound on the first click, ?frame=N pauses on a
   frame, ?variant=vertical plays the vertical cut (if the piece has one).
   When the renderer sets window.__MOTION_RENDER__ it stays out of the way.
   ========================================================================== */
(function player() {
  const btn = document.getElementById('sound'), q = new URLSearchParams(location.search);
  let M = window.__motion;
  const V = !window.__MOTION_RENDER__ && M.variants && M.variants[q.get('variant')];
  if (V) {                                                // show the variant's own canvas instead
    M = Object.assign({}, M, V);
    V.canvas.style.cssText = `width:min(100vw,calc(100vh*${V.width}/${V.height}));height:auto;aspect-ratio:${V.width}/${V.height}`;
    document.querySelector('canvas').replaceWith(V.canvas);
  }
  const dur = M.frames / M.fps;
  if (window.__MOTION_RENDER__) { btn.hidden = true; M.seek(0); return; }
  if (q.has('frame')) { btn.hidden = true; M.seek(+q.get('frame') || 0); return; }
  let t0 = performance.now(), ac = null, src = null, buf = null, paused = false, pausedAt = 0;
  const clock = () => ac && src ? (ac.currentTime - t0) : (performance.now() - t0) / 1000;
  function loop() {
    if (!paused) M.seek(Math.floor(((clock() % dur) + dur) % dur * M.fps));
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  btn.addEventListener('click', async () => {
    if (src) { src.stop(); src = null; btn.textContent = 'Click for sound'; t0 = performance.now(); return; }
    btn.textContent = 'Loading sound…';
    ac = ac || new AudioContext({ sampleRate: 48000 });
    buf = buf || await M.audio();
    await ac.resume();
    src = ac.createBufferSource(); src.buffer = buf; src.loop = true; src.connect(ac.destination);
    t0 = ac.currentTime + 0.05; src.start(t0);        // picture restarts from frame 0 in sync with the sound
    btn.textContent = 'Sound on — click to mute';
  });
  addEventListener('keydown', e => {
    if (e.code !== 'Space') return;
    e.preventDefault(); paused = !paused;
    if (ac) paused ? ac.suspend() : ac.resume();
    if (!ac) { if (paused) pausedAt = performance.now(); else t0 += performance.now() - pausedAt; }
  });
})();
