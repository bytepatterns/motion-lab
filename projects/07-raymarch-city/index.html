<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="teambytepatterns">
<meta name="description" content="A camera flight through a neon city that exists only as a distance function in one fragment shader, with wet streets, fog and a synthwave score.">
<title>Raymarch City — motion-lab</title>
<style>
  /* Player chrome. The piece itself lives entirely in the canvas. */
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; font: 500 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; }
  canvas { display: block; width: min(100vw, calc(100vh * 16 / 9)); height: auto; aspect-ratio: 16 / 9; }
  #sound { position: fixed; left: 16px; bottom: 16px; padding: 8px 14px; border: 1px solid rgba(255,255,255,.35); border-radius: 999px;
           background: rgba(0,0,0,.55); color: #fff; font: inherit; cursor: pointer; }
  #sound[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080" aria-label="Camera flight through a procedural neon city"></canvas>
<button id="sound" type="button">Click for sound</button>
<script>
'use strict';
/* ==========================================================================
   PIECE — Raymarch City.
   No meshes: the whole city is one signed distance function evaluated per
   pixel in a WebGL2 fragment shader (repeated domain, a box per cell).
   Pass 1 marches the scene into a half-float target; pass 2 adds bloom from
   its mip chain, chromatic aberration, tone mapping and grain; the result is
   copied into the 2D stage canvas where the type is drawn.
   Everything is a function of the frame number: camera keys, beat pulses,
   grain seed.
   ========================================================================== */
const W = 1920, H = 1080, FPS = 30, FRAMES = 600;          // 20 s
const cv = document.getElementById('stage');
let ctx = cv.getContext('2d');                                   // the vertical cut points it at its own canvas
const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';

// ---- helpers -------------------------------------------------------------
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (f, a, b) => clamp((f - a) / (b - a));
const E = {
  inCubic: t => t * t * t,
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inOutCubic: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outExpo: t => t === 1 ? 1 : 1 - Math.pow(2, -10 * t),
  inExpo: t => t === 0 ? 0 : Math.pow(2, 10 * t - 10),
  inOutExpo: t => t === 0 ? 0 : t === 1 ? 1 : t < .5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2,
  outBack: t => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2),
};
const C = { paper: '#F4F1FF', cyan: '#5CF2FF', magenta: '#FF4FD8' };

// ---- music clock (shared by picture and sound) ---------------------------
const BPM = 96, BEAT = 60 / BPM;                           // 0.625 s, 8 bars in 20 s
const BAR = BEAT * 4;
const kickOn = b => { const bar = Math.floor(b / 4); return bar !== 4 && b < 30; };   // bar 4 is the breakdown, the last bar rings out
function kickEnv(t) {                                      // 1 on a kick, decaying
  const b = Math.floor(t / BEAT), ph = t - b * BEAT;
  return kickOn(b) ? Math.exp(-ph * 7) : 0;
}

// ---- camera keys: t, x, y, z, look-height offset, roll ---------------------
const KEYS = [
  [0,    0.0,  2.1,   0,   0.25,  0.00],
  [2,    0.9,  2.3,  64,   0.35, -0.035],
  [5,   -1.3,  2.9, 130,   0.60,  0.045],
  [8,    1.0,  4.6, 190,   1.60, -0.05],
  [10.5, 0.0, 19.0, 246,  -1.80,  0.07],
  [12.6, 1.9,  1.6, 300,   0.10, -0.06],
  [15.5,-1.5,  2.4, 360,   0.60,  0.03],
  [17.5, 0.0, 12.0, 392,   0.40,  0.00],
  [20,   0.0, 64.0, 404,  -3.60,  0.00],
];
function camAt(t) {
  let k = 0; while (k < KEYS.length - 2 && t > KEYS[k + 1][0]) k++;
  const p0 = KEYS[Math.max(0, k - 1)], p1 = KEYS[k], p2 = KEYS[k + 1], p3 = KEYS[Math.min(KEYS.length - 1, k + 2)];
  const u = clamp((t - p1[0]) / (p2[0] - p1[0]));
  const cr = (a, b, c, d) => 0.5 * ((2 * b) + (-a + c) * u + (2 * a - 5 * b + 4 * c - d) * u * u + (-a + 3 * b - 3 * c + d) * u * u * u);
  const v = []; for (let j = 1; j < 6; j++) v.push(cr(p0[j], p1[j], p2[j], p3[j]));
  return v;                                                // x, y, z, lookY, roll
}

// ---- WebGL -----------------------------------------------------------------

const VS = `#version 300 es
in vec2 a; out vec2 v_uv;
void main(){ v_uv = a * 0.5 + 0.5; gl_Position = vec4(a, 0.0, 1.0); }`;

const SCENE_FS = `#version 300 es
precision highp float;
precision highp int;
in vec2 v_uv; out vec4 o;
uniform vec2 u_res; uniform float u_time; uniform vec3 u_ro; uniform vec3 u_ta; uniform float u_roll; uniform float u_kick; uniform float u_fl;
uniform int u_steps; uniform int u_rsteps;   // uniforms, so the compiler keeps the loops as loops

const float CS = 10.0;        // city cell size
const float HMAX = 54.0;      // tallest possible roof
const float MARGIN = 1.05;    // every box keeps at least this gap to its cell border
const vec3 CYAN = vec3(0.20, 0.90, 1.00);
const vec3 MAGENTA = vec3(1.00, 0.22, 0.78);
const vec3 AMBER = vec3(1.00, 0.62, 0.30);
const vec3 SUN_DIR = normalize(vec3(0.0, 0.075, 1.0));

uint hu(uint x){ x ^= x >> 16; x *= 0x7feb352du; x ^= x >> 15; x *= 0x846ca68bu; x ^= x >> 16; return x; }
float h2(vec2 v){ ivec2 i = ivec2(floor(v)); return float(hu(uint(i.x) * 1973u ^ hu(uint(i.y) * 9277u + 26699u))) * (1.0 / 4294967295.0); }
float h3(vec3 v){ ivec3 i = ivec3(floor(v)); return float(hu(uint(i.x) * 1973u ^ hu(uint(i.y) * 9277u ^ hu(uint(i.z) * 26699u + 7u)))) * (1.0 / 4294967295.0); }
float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(h2(i), h2(i + vec2(1, 0)), f.x), mix(h2(i + vec2(0, 1)), h2(i + vec2(1, 1)), f.x), f.y); }

float sdBox(vec3 p, vec3 b){ vec3 q = abs(p) - b; return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0); }

// cell kind: 0 building, 1 avenue, 2 cross street
float cellKind(vec2 id){ if (abs(id.x) < 0.5) return 1.0; if (mod(id.y, 5.0) < 0.5) return 2.0; return 0.0; }
vec3 cellBox(vec2 id){
  float s = h2(id), s2 = h2(id + vec2(17.0, 3.0)), s3 = h2(id + vec2(91.0, 41.0));
  float hgt = 5.0 + 20.0 * s * s + (s3 > 0.86 ? 26.0 * s2 : 0.0);
  hgt *= mix(1.0, 0.55, clamp((abs(id.x) - 1.0) / 6.0, 0.0, 1.0)) * 0.6 + 0.4;   // shorter away from the avenue
  return vec3(2.6 + 1.3 * s2, hgt * 0.5, 2.6 + 1.3 * s3);
}

float lamps(vec3 p){
  vec3 q = vec3(abs(p.x) - 5.6, p.y, mod(p.z, 18.0) - 9.0);
  float d = sdBox(q - vec3(0.0, 2.9, 0.0), vec3(0.07, 2.9, 0.07));
  d = min(d, sdBox(q - vec3(-0.65, 5.78, 0.0), vec3(0.7, 0.045, 0.06)));
  return min(d, sdBox(q - vec3(-1.25, 5.7, 0.0), vec3(0.38, 0.06, 0.13)));
}

float map(vec3 p){
  vec2 id = floor(p.xz / CS + 0.5);
  vec2 lp = p.xz - id * CS;
  vec2 e = CS * 0.5 - abs(lp);
  float k = cellKind(id);
  float d;
  if (k > 1.5) d = e.y + MARGIN;                 // cross street: buildings only across the z border
  else if (k > 0.5) d = e.x + MARGIN;            // avenue: buildings only across the x border
  else { vec3 b = cellBox(id); d = min(sdBox(vec3(lp.x, p.y - b.y, lp.y), b), min(e.x, e.y) + MARGIN); }
  d = max(d, p.y - HMAX);
  return min(d, lamps(p));
}

float march(vec3 ro, vec3 rd, float tmax, int steps){
  float t = 0.05;
  for (int i = 0; i < steps; i++) {
    float d = map(ro + rd * t);
    if (d < 0.0012 * t + 0.001) return t;
    t += d;
    if (t > tmax) break;
  }
  return -1.0;
}

vec3 sky(vec3 rd){
  float y = rd.y;
  vec3 col = mix(vec3(0.20, 0.03, 0.20), vec3(0.008, 0.007, 0.03), smoothstep(-0.02, 0.40, y));
  float sd = dot(rd, SUN_DIR);
  col += MAGENTA * 0.35 * pow(max(sd, 0.0), 14.0) + AMBER * 0.25 * pow(max(sd, 0.0), 90.0);
  // striped synthwave sun
  vec3 sx = normalize(cross(SUN_DIR, vec3(0, 1, 0))), sy = cross(sx, SUN_DIR);
  vec2 sp = vec2(dot(rd, sx), dot(rd, sy)) / 0.13;
  float r = length(sp);
  if (r < 1.0 && sd > 0.0) {
    float band = sp.y < 0.15 ? step(0.5 + 0.45 * (0.15 - sp.y), fract(sp.y * 7.0 + 0.2)) : 1.0;
    col = mix(col, mix(MAGENTA * 1.4, AMBER * 2.2, smoothstep(-0.9, 0.9, sp.y)), band * smoothstep(1.0, 0.97, r));
  }
  // a few stars
  vec2 g = vec2(atan(rd.x, rd.z), rd.y) * 260.0;
  float st = h2(floor(g)); vec2 gf = fract(g) - 0.5;
  col += vec3(0.8, 0.85, 1.0) * step(0.9965, st) * smoothstep(0.2, 0.0, length(gf)) * smoothstep(0.08, 0.35, y) * 0.8;
  return col;
}

vec3 fogCol(vec3 rd){
  return mix(vec3(0.040, 0.011, 0.070), vec3(0.34, 0.06, 0.24), pow(max(dot(rd, SUN_DIR), 0.0), 8.0));
}
vec3 applyFog(vec3 col, vec3 rd, float t, float y){
  float f = 1.0 - exp(-t * 0.0088);
  f = max(f, (1.0 - exp(-t * 0.03)) * exp(-max(y, 0.0) * 0.12) * 0.35);   // low ground haze
  return mix(col, fogCol(rd), clamp(f, 0.0, 1.0));
}

// emissive + a little ambient for a hit at p
vec3 shade(vec3 p, vec3 rd){
  float dl = lamps(p);
  vec2 id = floor(p.xz / CS + 0.5);
  vec2 lp = p.xz - id * CS;
  bool isLamp = cellKind(id) > 0.5 || dl < 0.01;
  if (isLamp) {
    vec3 q = vec3(abs(p.x) - 5.6, p.y, mod(p.z, 18.0) - 9.0);
    float head = step(abs(q.x + 1.25), 0.4) * step(5.6, p.y) * step(p.y, 5.66);
    return mix(vec3(0.02, 0.02, 0.03), CYAN * 6.0, head);
  }
  vec3 b = cellBox(id);
  vec3 q = vec3(lp.x, p.y - b.y, lp.y);
  vec3 a = abs(q) - b;
  // face normal, branchless (the D3D11 shader compiler rejects the ternary form of this)
  float nx = step(a.y, a.x) * step(a.z, a.x), nz = (1.0 - nx) * step(a.y, a.z);
  vec3 n = vec3(nx * (q.x < 0.0 ? -1.0 : 1.0), 1.0 - nx - nz, nz * (q.z < 0.0 ? -1.0 : 1.0));
  float s = h2(id), s2 = h2(id + vec2(17.0, 3.0)), pick = h2(id + vec2(5.0, 77.0));
  vec3 pal = pick < 0.45 ? CYAN : pick < 0.82 ? MAGENTA : AMBER;
  vec3 col = vec3(0.006, 0.006, 0.013) + max(n.y, 0.0) * 0.01;
  col += 0.012 * pal * (0.5 + 0.5 * n.y);
  if (n.y < 0.5) {
    float u = abs(n.x) > 0.5 ? q.z : q.x;
    float face = abs(n.x) > 0.5 ? (n.x > 0.0 ? 1.0 : 2.0) : (n.z > 0.0 ? 3.0 : 4.0);
    vec2 g = vec2(u, p.y) / vec2(0.52, 0.74);
    vec2 wi = floor(g), wf = fract(g);
    float inWin = step(0.16, wf.x) * step(wf.x, 0.84) * step(0.24, wf.y) * step(wf.y, 0.80) * step(1.0, p.y);
    float hw = h3(vec3(wi, s * 997.0 + face * 13.0));
    float on = step(0.7, hw);
    if (hw > 0.975) on *= step(0.45, fract(u_time * 0.37 + hw * 9.0));          // a few flicker
    vec3 wc = mix(pal, AMBER, step(0.8, h3(vec3(wi.yx, face)))) ;
    col += inWin * on * wc * (0.5 + 1.3 * fract(hw * 31.0));
    col += inWin * (1.0 - on) * vec3(0.012, 0.014, 0.03);
    // neon: vertical edge strips and a crown for about half the towers
    float edge = abs(n.x) > 0.5 ? b.z - abs(q.z) : b.x - abs(q.x);   // distance to the vertical corner
    if (s2 > 0.45) {
      float glow = (1.2 + 1.2 * u_kick);
      col += pal * 5.0 * glow * smoothstep(0.10, 0.02, edge);
      col += pal * 4.0 * glow * smoothstep(0.14, 0.04, abs(q.y - b.y + 0.35));
    }
    // vertical signs on the faces that look onto the avenue
    float toAve = -sign(id.x) * n.x;
    if (toAve > 0.5 && s > 0.35) {
      float z0 = (fract(s * 7.3) - 0.5) * 2.0 * (b.z - 1.0), y0 = 3.0 + 6.0 * fract(s * 3.1);
      float inSign = step(abs(q.z - z0), 0.55) * step(y0, p.y) * step(p.y, y0 + 7.0);
      float seg = step(0.28, fract((p.y - y0) * 1.35));
      vec3 sc = fract(s * 11.0) > 0.5 ? MAGENTA : CYAN;
      col += inSign * mix(vec3(0.05), sc * (4.0 + 3.0 * u_kick), seg);
    }
  } else {
    // roof: a thin rim
    float rim = min(b.x - abs(q.x), b.z - abs(q.z));
    col += pal * 2.0 * smoothstep(0.12, 0.03, rim) * step(0.45, s2);
  }
  return col;
}

// the street: wet asphalt reflecting the city
vec3 ground(vec3 p, vec3 rd, float t){
  float wet = smoothstep(0.30, 0.65, vnoise(p.xz * vec2(0.22, 0.12)));
  float road = step(abs(p.x), 5.0);
  vec3 base = mix(vec3(0.010, 0.009, 0.015), vec3(0.005, 0.005, 0.008), road);
  // markings
  float dash = step(abs(p.x), 0.07) * step(fract(p.z / 6.0), 0.45);
  float edges = step(abs(abs(p.x) - 4.65), 0.06);
  base += road * (AMBER * 0.45 * dash + vec3(0.5) * 0.3 * edges);
  // lamp pools
  float lz = (floor(p.z / 18.0) + 0.5) * 18.0;
  float dl = min(length(vec2(p.x - 4.35, p.z - lz)), length(vec2(p.x + 4.35, p.z - lz)));
  base += CYAN * 0.16 * exp(-dl * dl * 0.12);
  // bumpy wet normal: stretched noise gives vertical streaks in the reflections
  float bx = vnoise(p.xz * vec2(2.3, 0.35)) - 0.5, bz = vnoise(p.xz * vec2(0.4, 3.1) + 7.0) - 0.5;
  vec3 n = normalize(vec3(bx * mix(0.09, 0.02, wet), 1.0, bz * mix(0.12, 0.03, wet)));
  vec3 rr = reflect(rd, n);
  float fres = 0.04 + 0.96 * pow(1.0 - max(dot(-rd, n), 0.0), 5.0);
  vec3 refl;
  float tr = march(p + n * 0.02, rr, 150.0, u_rsteps);
  if (tr > 0.0) { vec3 hp = p + rr * tr; refl = applyFog(shade(hp, rr), rr, tr + t * 0.4, hp.y); }
  else refl = sky(rr);
  float k = mix(0.10, 0.75, wet) * mix(0.35, 1.0, fres);
  return base * (1.0 - k * 0.5) + refl * k;
}

void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5 * u_res) / u_res.y;
  vec3 cw = normalize(u_ta - u_ro);
  vec3 cp = vec3(sin(u_roll), cos(u_roll), 0.0);
  vec3 cu = normalize(cross(cw, cp)), cvv = cross(cu, cw);
  vec3 rd = normalize(uv.x * cu + uv.y * cvv + u_fl * cw);
  vec3 ro = u_ro;
  float tg = rd.y < 0.0 ? -ro.y / rd.y : 1e9;
  float tmax = min(tg, 320.0);
  float t = march(ro, rd, tmax, u_steps);
  vec3 col;
  if (t > 0.0) { vec3 p = ro + rd * t; col = applyFog(shade(p, rd), rd, t, p.y); }
  else if (tg < 320.0) { vec3 p = ro + rd * tg; col = applyFog(ground(p, rd, tg), rd, tg, 0.0); }
  else col = sky(rd);
  o = vec4(col, 1.0);
}`;

const POST_FS = `#version 300 es
precision highp float;
in vec2 v_uv; out vec4 o;
uniform sampler2D u_scene; uniform float u_frame; uniform float u_ca; uniform float u_fade; uniform float u_flash;
uint hu(uint x){ x ^= x >> 16; x *= 0x7feb352du; x ^= x >> 15; x *= 0x846ca68bu; x ^= x >> 16; return x; }
vec3 aces(vec3 x){ return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0); }
void main(){
  vec2 uv = v_uv, d = uv - 0.5;
  float r2 = dot(d, d);
  vec2 off = d * u_ca * (0.4 + 2.2 * r2);
  vec3 col = vec3(texture(u_scene, uv - off).r, texture(u_scene, uv).g, texture(u_scene, uv + off).b);
  vec3 bloom = textureLod(u_scene, uv, 2.0).rgb * 0.20 + textureLod(u_scene, uv, 4.0).rgb * 0.28
             + textureLod(u_scene, uv, 5.5).rgb * 0.30 + textureLod(u_scene, uv, 7.0).rgb * 0.30;
  col += bloom * 0.22;
  col = aces(col * 0.95);
  col *= 1.0 - 0.55 * smoothstep(0.18, 0.75, r2 * 1.6);                                  // vignette
  col = pow(col, vec3(1.0 / 2.2));
  uvec2 px = uvec2(gl_FragCoord.xy);
  float g = float(hu(px.x * 73856093u ^ px.y * 19349663u ^ hu(uint(u_frame) + 1u))) * (1.0 / 4294967295.0);
  col += (g - 0.5) * 0.012;                                                           // grain, seeded by frame
  col = mix(col, vec3(1.0, 0.85, 0.97), u_flash);
  o = vec4(col * u_fade, 1.0);
}`;

// One renderer per output size: the landscape frame, and (only when it is asked
// for) the vertical cut. Same shaders, same uniforms; only the target size differs.
function makeCity(w, h) {
  const gcv = document.createElement('canvas'); gcv.width = w; gcv.height = h;
  const gl = gcv.getContext('webgl2', { preserveDrawingBuffer: true, antialias: false, alpha: false, premultipliedAlpha: false });
  const HALF = !!(gl && gl.getExtension('EXT_color_buffer_float'));
  function compile(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
  function program(fs) { const p = gl.createProgram(); gl.attachShader(p, compile(gl.VERTEX_SHADER, VS)); gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
    gl.bindAttribLocation(p, 0, 'a'); gl.linkProgram(p); if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    const u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for (let k = 0; k < n; k++) { const nm = gl.getActiveUniform(p, k).name; u[nm] = gl.getUniformLocation(p, nm); }
    return { p, u }; }

  let GLX = null;
  function initGL() {
    if (GLX || !gl) return GLX;
    const scene = program(SCENE_FS), post = program(POST_FS);
    const vb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vb);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
    const levels = Math.floor(Math.log2(Math.max(w, h))) + 1;
    gl.texStorage2D(gl.TEXTURE_2D, levels, HALF ? gl.RGBA16F : gl.RGBA8, w, h);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    const fb = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    GLX = { scene, post, tex, fb };
    return GLX;
  }

  function renderGL(f) {
    const X = initGL();
    const t = f / FPS;
    const [x, y, z, ly, roll] = camAt(t);
    const [x2, , z2] = camAt(Math.min(20, t + 0.2));
    const speed = Math.hypot(x2 - x, z2 - z) / 0.2;                                 // units per second
    const flash = 0.55 * (1 - E.outCubic(prog(f, 0, 9)));          // hook: a neon flash that clears in 0.3 s
    const fade = 1 - 0.75 * E.inCubic(prog(f, 585, 599));
    gl.viewport(0, 0, w, h);
    gl.bindFramebuffer(gl.FRAMEBUFFER, X.fb);
    gl.useProgram(X.scene.p);

  vx.fillStyle = accent; vx.globalAlpha = t1; vx.fillRect(VL, 742, 88 * t1, 7); vx.globalAlpha = 1;
  const size = vText(title, VL, 850 + (1 - t1) * 40, { size: 92, weight: 800, color: ink, spacing: -2, alpha: t1, max: VR - VL });
  const y2 = 850 + Math.max(size, 60) * 0.25 + 70;
  vx.font = `600 44px ${FONT}`;
  const lead = 'drawn in code  ·  ', lw = vx.measureText(lead).width;
  vText(lead, VL, y2 + (1 - t2) * 24, { size: 44, weight: 600, color: dim, alpha: t2 });
  vText('bytepatterns.com', VL + lw, y2 + (1 - t2) * 24, { size: 44, weight: 800, color: accent, alpha: t2 });
  if (line) vText(line, VL, y2 + 72 + (1 - t3) * 18, { size: 32, weight: 500, color: dim, alpha: t3, max: VR - VL });
}
/** Seeks a cut. The first frame a page draws is drawn twice: the very first read of a
 *  GPU-backed source canvas can come out a shade different from every later one. */
let vWarm = false;
function vSeek(draw, i, frames) {
  const f = Math.max(0, Math.min(frames - 1, Math.floor(i)));
  if (!vWarm) { vWarm = true; draw(f); }
  draw(f);
}
/** The soundtrack of a cut: the piece's own audio() spliced to the same segments as the picture. */
async function vAudio(segs, frames, { xf = 0.025, fadeOut = 0.6, extra = null } = {}) {
  const src = await renderAudio();
  const SR = 48000, dur = frames / FPS, ac = new OfflineAudioContext(2, Math.round(SR * dur), SR);
  const out = ac.createGain(); out.connect(ac.destination);
  out.gain.setValueAtTime(1, 0); out.gain.setValueAtTime(1, dur - fadeOut); out.gain.linearRampToValueAtTime(0, dur - 0.01);
  segs.forEach((s, k) => {
    const at = s.at / FPS, off = s.src / FPS, d = s.len / FPS;
    const pre = k === 0 ? 0 : Math.min(xf, off), post = k === segs.length - 1 ? 0 : xf;
    const b = ac.createBufferSource(), g = ac.createGain(); b.buffer = src;
    g.gain.setValueAtTime(pre ? 0 : 1, at - pre);
    if (pre) g.gain.linearRampToValueAtTime(1, at + pre);
    if (post) { g.gain.setValueAtTime(1, at + d - post); g.gain.linearRampToValueAtTime(0, at + d + post); }
    b.connect(g).connect(out); b.start(at - pre, off - pre, d + pre + post);
  });
  if (extra) extra(ac, out);
  const buf = await ac.startRendering();
  let peak = 0; for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) peak = Math.max(peak, Math.abs(d[i])); }
  if (peak > 0.9) for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] *= 0.9 / peak; }
  return buf;
}
/** A soft three-partial bell, for the closing card. */
function vChime(ac, dest, at, freq, vol = 0.08) {
  for (const [mul, v, dec] of [[1, 1, 1.8], [2.01, 0.35, 0.8], [3.02, 0.12, 0.4]]) {
    const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.value = freq * mul;
    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol * v, at + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, at + dec);
    o.connect(g).connect(dest); o.start(at); o.stop(at + dec + 0.05);
  }
}

/* VERTICAL CUT — this piece */
// The same shader rendered at the phone's own size (840 x 1170, the safe area),
// not cropped from the landscape frame. Cuts sit on bar lines of the 96 BPM
// track: the first flight, the climb, the drop into the wet streets, the last bar.
const VSEG = [{ at: 0, src: 0, len: 150 }, { at: 150, src: 225, len: 225 }, { at: 375, src: 525, len: 75 }];
const VFR = 450, VEND = VFR - 60;
let VCITY = null;                                          // created on first use: the landscape page never pays for it
const VLOW = [
  [76, 148, ['EVERY PIXEL', 'MARCHES A RAY'], 'up to 120 steps through a distance field'],
  [156, 290, ['ONE BOX,', 'REPEATED'], 'a hash per cell decides height, width and neon'],
  [300, 380, ['WET STREETS'], 'a second ray bounces off the asphalt'],
];
function vScrim(y0, y1, a, up = false) {
  const g = vx.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(up ? 1 : 0, 'rgba(6,2,14,0)'); g.addColorStop(up ? 0 : 1, `rgba(6,2,14,${a})`);
  vx.fillStyle = g; vx.fillRect(SAFE.x, y0, SAFE.w, y1 - y0);
}
function vDraw(v) {
  const { src } = vSeg(VSEG, v), f = Math.min(FRAMES - 1, src);
  vReset();
  vx.fillStyle = '#07030d'; vx.fillRect(0, 0, VW, VH);
  if (gl) {
    if (!VCITY) VCITY = makeCity(SAFE.w, SAFE.h);
    VCITY.render(f);
    vx.save(); vx.beginPath(); vx.roundRect(SAFE.x, SAFE.y, SAFE.w, SAFE.h, 26); vx.clip();
    vx.drawImage(VCITY.canvas, SAFE.x, SAFE.y);
    vx.restore();
  }
  vShade('7,3,13');
  vScrim(SAFE.y, 420, 0.65, true);
  vTag('RAYMARCH CITY', C.cyan);
  const main = ctx; ctx = vx;
  try {
    const k = E.outExpo(prog(v, -12, 8)), o = 1 - E.inCubic(prog(v, 60, 74)), a = Math.min(k, o);
    if (a > 0) {
      vScrim(SAFE.y, 760, 0.72 * a, true);
      glowText('RAYMARCH', VL - 4, 470 + (1 - k) * 30, 112, 900, C.paper, C.magenta, a, 12);
      glowText('CITY', VL - 4, 588 + (1 - k) * 40, 112, 900, C.cyan, C.magenta, a, 12);
      vText('one fragment shader · zero polygons', VL, 660, { size: 40, weight: 500, color: C.paper, alpha: a * 0.92, max: VR - VL });
    }
    for (const [a0, b0, big, small] of VLOW) {
      const [al, dy] = vEnv(v, a0, b0, 10, 10);
      if (al <= 0) continue;
      vx.globalAlpha = al; vScrim(1020, SAFE.b, 0.72); vx.globalAlpha = 1;
      const y1 = 1340 - (big.length - 1) * 70;
      big.forEach((ln, i) => vText(ln, VL, y1 - 58 + i * 70 + dy, { size: 64, weight: 850, color: C.paper, spacing: 3, alpha: al, max: VR - VL }));
      vText(small, VL + 2, 1360 + dy, { size: 34, weight: 500, color: C.cyan, alpha: al * 0.95, max: VR - VL });
    }
  } finally { ctx = main; }
  if (v >= VEND) vEndCard(v - VEND, { title: 'Raymarch City', line: 'one shader · no meshes · no textures',
    ink: C.paper, dim: 'rgba(244,241,255,0.7)', accent: C.cyan, scrim: '7,3,13', a: 0.7 });
  vReset();
}

window.__motion = {
  title: 'Raymarch City',
  description: 'A camera flight through a neon city that exists only as a distance function in one fragment shader.',
  fps: FPS, width: W, height: H, frames: FRAMES,
  poster: 400,
  gifStart: 11,
  seek(i) { draw(Math.max(0, Math.min(FRAMES - 1, Math.floor(i)))); },
  audio: renderAudio,
  variants: {
    vertical: {
      width: VW, height: VH, frames: VFR, canvas: vcv,
      poster: 250, gifStart: 7,
      seek(i) { vSeek(vDraw, i, VFR); },
      audio: () => vAudio(VSEG, VFR, { fadeOut: 0.8 }),
    },
  },
};

/* ==========================================================================
   PLAYER — identical in every piece; keep as is.
   Autoplays and loops, starts sound on the first click, ?frame=N pauses on a
   frame, ?variant=vertical plays the vertical cut (if the piece has one).
   When the renderer sets window.__MOTION_RENDER__ it stays out of the way.
   ========================================================================== */
(function player() {
  const btn = document.getElementById('sound'), q = new URLSearchParams(location.search);
  let M = window.__motion;
  const V = !window.__MOTION_RENDER__ && M.variants && M.variants[q.get('variant')];
  if (V) {                                                // show the variant's own canvas instead
    M = Object.assign({}, M, V);
    V.canvas.style.cssText = `width:min(100vw,calc(100vh*${V.width}/${V.height}));height:auto;aspect-ratio:${V.width}/${V.height}`;
    document.querySelector('canvas').replaceWith(V.canvas);
  }
  const dur = M.frames / M.fps;
  if (window.__MOTION_RENDER__) { btn.hidden = true; M.seek(0); return; }
  if (q.has('frame')) { btn.hidden = true; M.seek(+q.get('frame') || 0); return; }
  let t0 = performance.now(), ac = null, src = null, buf = null, paused = false, pausedAt = 0;
  const clock = () => ac && src ? (ac.currentTime - t0) : (performance.now() - t0) / 1000;
  function loop() {
    if (!paused) M.seek(Math.floor(((clock() % dur) + dur) % dur * M.fps));
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  btn.addEventListener('click', async () => {
    if (src) { src.stop(); src = null; btn.textContent = 'Click for sound'; t0 = performance.now(); return; }
    btn.textContent = 'Loading sound…';
    ac = ac || new AudioContext({ sampleRate: 48000 });
    buf = buf || await M.audio();
    await ac.resume();
    src = ac.createBufferSource(); src.buffer = buf; src.loop = true; src.connect(ac.destination);
    t0 = ac.currentTime + 0.05; src.start(t0);        // picture restarts from frame 0 in sync with the sound
    btn.textContent = 'Sound on — click to mute';
  });
  addEventListener('keydown', e => {
    if (e.code !== 'Space') return;
    e.preventDefault(); paused = !paused;
    if (ac) paused ? ac.suspend() : ac.resume();
    if (!ac) { if (paused) pausedAt = performance.now(); else t0 += performance.now() - pausedAt; }
  });
})();
</script>
