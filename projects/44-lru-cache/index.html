<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="teambytepatterns">
<meta name="description" content="An LRU cache with four slots serves thirty requests: every hit moves its entry to the front, every miss pushes the least recently used entry out the back, and a FIFO cache of the same size serves the same requests underneath.">
<title>Least Recently Used — motion-lab</title>
<style>
  /* Player chrome. The piece itself lives entirely in the canvas. */
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; font: 500 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; }
  canvas { display: block; width: min(100vw, calc(100vh * 16 / 9)); height: auto; aspect-ratio: 16 / 9; }
  #sound { position: fixed; left: 16px; bottom: 16px; padding: 8px 14px; border: 1px solid rgba(255,255,255,.35); border-radius: 999px;
           background: rgba(0,0,0,.55); color: #fff; font: inherit; cursor: pointer; }
  #sound[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080" aria-label="A row of four lettered tiles under a scrolling tape of requests; on a hit a tile hops to the front of the row, on a miss a new tile drops in at the front and the tile at the back falls away, while a smaller row underneath keeps its tiles in arrival order"></canvas>
<button id="sound" type="button">Click for sound</button>
<script>
'use strict';
/* ==========================================================================
   PIECE — Least Recently Used (an LRU cache).
   A cache with room for four entries serves a stream of 30 requests. On a
   hit the entry moves to the front of the list; on a miss the new entry goes
   in at the front and, when the cache is full, the entry at the back (the
   least recently used one) is evicted. A hash map points at every node of a
   doubly linked list, so lookup, move-to-front and evict are all O(1).
   Underneath, a FIFO cache of the same size serves the same stream: it keeps
   entries in arrival order and a hit changes nothing, so it can evict a key
   that is still hot just because it came in early.
   Both caches are simulated once. The hit counts, rates and the request of
   the first eviction are read from those runs, never typed in; each frame
   places the tiles between the state before and after its own request, so
   seek(i) is pure in i.
   ========================================================================== */
const W = 1920, H = 1080, FPS = 30;
const cv = document.getElementById('stage');
const ctx = cv.getContext('2d', { willReadFrequently: true });   // CPU raster: identical pixels on every redraw
const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
const MONO = 'ui-monospace, "Cascadia Code", Consolas, Menlo, monospace';

// ---- helpers -------------------------------------------------------------
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (f, a, b) => clamp((f - a) / (b - a));
const smooth = t => t * t * (3 - 2 * t);
const E = {
  inCubic: t => t * t * t,
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inOutCubic: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outExpo: t => t === 1 ? 1 : 1 - Math.pow(2, -10 * t),
  inExpo: t => t === 0 ? 0 : Math.pow(2, 10 * t - 10),
  inOutExpo: t => t === 0 ? 0 : t === 1 ? 1 : t < .5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2,
  outBack: t => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2),
};
/** Canvas text; `max` shrinks the size until the line fits. Returns the width drawn. */
function text(g, str, x, y, { size = 40, weight = 600, color = '#fff', alpha = 1, spacing = 0, align = 'left', fam = FONT, base = 'alphabetic', max = 0 } = {}) {
  if (alpha <= 0.002 || !str) return 0;
  g.font = `${weight} ${size}px ${fam}`; g.letterSpacing = spacing + 'px';
  if (max) { const w0 = g.measureText(str).width; if (w0 > max) { size *= max / w0; g.font = `${weight} ${size}px ${fam}`; } }
  g.textAlign = align; g.textBaseline = base;
  const a0 = g.globalAlpha; g.globalAlpha = a0 * alpha; g.fillStyle = color;
  g.fillText(str, x, y);
  const w = g.measureText(str).width;
  g.globalAlpha = a0; g.letterSpacing = '0px';
  return w;
}
const measure = (g, str, size, weight = 800, fam = FONT, spacing = 0) => { g.font = `${weight} ${size}px ${fam}`; g.letterSpacing = spacing + 'px'; const w = g.measureText(str).width; g.letterSpacing = '0px'; return w; };
const env = (f, a, b, fin = 12, fout = 10) => {
  const i = E.outCubic(prog(f, a, a + fin)), o = 1 - E.inCubic(prog(f, b - fout, b));
  return [Math.min(i, o), (1 - i) * 24 - (1 - o) * 10];
};

// ---- palette -------------------------------------------------------------
const C = {
  bg: '#0B0D14', bgRGB: '11,13,20', paper: '#F1EEE6', dim: 'rgba(241,238,230,0.62)', faint: 'rgba(241,238,230,0.14)',
  hit: '#4BE38A', hitRGB: '75,227,138', miss: '#FF9F43', missRGB: '255,159,67', evict: '#FF5E6C', evictRGB: '255,94,108', accent: '#FFC857',
  keys: { A: '#5CD6CB', B: '#FFC857', C: '#8FA8FF', D: '#FF8FA3', E: '#B8F07A', F: '#C49BFF', G: '#FF9F6B', H: '#7FD1FF' },
};

// ---- the two caches, simulated once ----------------------------------------------------------
const CAP = 4;
const REQ = 'ABCDABEABFACBGABHACBDAEBACFABG'.split('');
const N = REQ.length;
/** states[k] is the list before request k (front first); hit[k], out[k] (evicted key or null). */
function simulate(lru) {
  const states = [[]], hit = [], out = [];
  let L = [];
  for (const key of REQ) {
    const i = L.indexOf(key); let ev = null;
    L = L.slice();
    if (i >= 0) { if (lru) { L.splice(i, 1); L.unshift(key); } }
    else { L.unshift(key); if (L.length > CAP) ev = L.pop(); }
    states.push(L); hit.push(i >= 0); out.push(ev);
  }
  const cum = [0]; for (const h of hit) cum.push(cum[cum.length - 1] + (h ? 1 : 0));
  return { states, hit, out, cum, hits: cum[N] };
}
const LRU = simulate(true), FIFO = simulate(false);
const FIRST_EV = LRU.out.findIndex(e => e);            // the request that first evicts
const pct = (h, n) => n ? Math.round(100 * h / n) : 0;
const KEYIDX = k => 'ABCDEFGH'.indexOf(k);

// ---- timeline ----------------------------------------------------------------------------------
// rule0: the first request; slowD / fastD: frames per request before and after the first eviction;
// calm: the verdict; end: the closing card.
const LOOK = 0.32;                                       // fraction of a request at which the lookup lands
function buildTL(o) {
  const TL = Object.assign({}, o);
  TL.slowN = FIRST_EV + 1;
  TL.start = k => TL.rule0 + (k < TL.slowN ? k * TL.slowD : TL.slowN * TL.slowD + (k - TL.slowN) * TL.fastD);
  TL.last = TL.start(N);
  const s = TL.start, hit0 = LRU.hit.indexOf(true);
  TL.caps = [
    [s(0) - 6, s(hit0) - 2, 'Miss: fetch it,|put it at the front.'],
    [s(hit0), s(FIRST_EV) - 2, 'Hit: move it|to the front.'],
    [s(FIRST_EV), s(FIRST_EV + 1) + 14, 'Full: evict the back,|the least recently used.'],
    [s(FIRST_EV + 1) + 16, s(FIRST_EV + 1) + Math.round((TL.last - s(FIRST_EV + 1)) * 0.5), 'FIFO evicts the oldest arrival,|hot or not.'],
    [s(FIRST_EV + 1) + Math.round((TL.last - s(FIRST_EV + 1)) * 0.5) + 4, TL.calm, `Same ${N} requests,|same ${CAP} slots.`],
  ];
  return TL;
}
/** The request in progress at frame f and how far through it is (0..1). */
function reqAt(TL, f) {
  if (f < TL.rule0) return { k: -1, p: 1 };
  if (f >= TL.last) return { k: N - 1, p: 1 };
  const b = TL.start(TL.slowN);
  let k = f < b ? Math.floor((f - TL.rule0) / TL.slowD) : TL.slowN + Math.floor((f - b) / TL.fastD);
  k = Math.min(N - 1, k);
  const s = TL.start(k), d = TL.start(k + 1) - s;
  return { k, p: clamp((f - s) / d) };
}

// ---- drawing ------------------------------------------------------------------------------
function rrect(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r); g.lineTo(x + w, y + h - r);
  g.quadraticCurveTo(x + w, y + h, x + w - r, y + h); g.lineTo(x + r, y + h); g.quadraticCurveTo(x, y + h, x, y + h - r);
  g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y); g.closePath();
}
/** One cache entry: a tile with its letter. ring = [rgb, alpha] for a hit / miss / evict glow. */
function tile(g, x, y, sz, key, { alpha = 1, scale = 1, ring = null, rot = 0 } = {}) {
  if (alpha <= 0.01 || scale <= 0.01) return;
  const s = sz * scale, col = C.keys[key];
  g.save(); g.globalAlpha = alpha; g.translate(x, y); if (rot) g.rotate(rot);
  if (ring && ring[1] > 0.01) {
    g.globalAlpha = alpha * ring[1];
    g.fillStyle = `rgba(${ring[0]},0.22)`; rrect(g, -s / 2 - 14, -s / 2 - 14, s + 28, s + 28, s * 0.2); g.fill();
    g.strokeStyle = `rgb(${ring[0]})`; g.lineWidth = 4; rrect(g, -s / 2 - 9, -s / 2 - 9, s + 18, s + 18, s * 0.18); g.stroke();
    g.globalAlpha = alpha;
  }
  g.fillStyle = '#141824'; rrect(g, -s / 2, -s / 2, s, s, s * 0.14); g.fill();
  g.fillStyle = col; g.globalAlpha = alpha * 0.16; g.fill(); g.globalAlpha = alpha;
  g.strokeStyle = col; g.lineWidth = Math.max(2, s * 0.025); g.stroke();
  g.fillStyle = C.paper; g.font = `850 ${Math.round(s * 0.52)}px ${FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(key, 0, s * 0.03);
  g.fillStyle = col; g.fillRect(-s * 0.2, s * 0.3, s * 0.4, Math.max(3, s * 0.035));
  g.restore();
}
const slotX = (R, i) => R.x0 + i * (R.sz + R.gap);
/** One cache row at request (k, p). */
function row(g, G, R, S, k, p, token) {
  const before = k < 0 ? S.states[0] : S.states[k], after = k < 0 ? S.states[0] : S.states[k + 1];
  const look = k >= 0 && p >= LOOK, e = k < 0 ? 1 : E.inOutCubic(prog(p, 0.38, 0.9));
  const flash = look ? 1 - E.inCubic(prog(p, LOOK, 1)) : 0;
  const hit = k >= 0 && S.hit[k], ev = k >= 0 ? S.out[k] : null, key = k >= 0 ? REQ[k] : null;
  // empty slots and the links between filled ones
  const filled = Math.max(before.length, after.length);
  g.save();
  for (let i = 0; i < CAP; i++) {
    g.strokeStyle = C.faint; g.lineWidth = 2; g.setLineDash([10, 8]);
    rrect(g, slotX(R, i) - R.sz / 2, R.y - R.sz / 2, R.sz, R.sz, R.sz * 0.14); g.stroke();
  }
  g.setLineDash([]);
  if (R.links) for (let i = 0; i < Math.min(CAP, filled) - 1; i++) {
    const xa = slotX(R, i) + R.sz / 2 + 8, xb = slotX(R, i + 1) - R.sz / 2 - 8, dy = R.sz * 0.12;
    g.strokeStyle = 'rgba(241,238,230,0.34)'; g.fillStyle = 'rgba(241,238,230,0.34)'; g.lineWidth = 2.5;
    for (const [y, dir] of [[R.y - dy, 1], [R.y + dy, -1]]) {
      g.beginPath(); g.moveTo(xa, y); g.lineTo(xb, y); g.stroke();
      const tx = dir > 0 ? xb : xa;
      g.beginPath(); g.moveTo(tx, y); g.lineTo(tx - dir * 10, y - 6); g.lineTo(tx - dir * 10, y + 6); g.closePath(); g.fill();
    }
  }
  g.restore();
  // tiles: everything in either state
  const keys = [...new Set([...before, ...after])];
  const later = [];
  for (const kk of keys) {
    const ib = before.indexOf(kk), ia = after.indexOf(kk);
    let x, y, alpha = 1, scale = 1, ring = null, rot = 0;
    if (ib >= 0 && ia >= 0) {
      x = lerp(slotX(R, ib), slotX(R, ia), e); y = R.y;
      if (ib !== ia && kk === key) y -= Math.sin(Math.PI * e) * R.sz * 0.62;       // the hit hops over the others
      if (kk === key && hit) ring = [C.hitRGB, flash];
    } else if (ia >= 0) {                                                       // arrives on a miss
      const k0 = E.outBack(prog(p, LOOK - 0.04, LOOK + 0.08));
      x = slotX(R, 0); y = lerp(R.y - R.stage, R.y, e);
      scale = lerp(0.72, 1, e) * clamp(k0, 0, 1.2); alpha = clamp(k0 * 1.5);
      ring = [C.missRGB, Math.max(flash, 0.35 * (1 - e))];
    } else {                                                                    // evicted
      const q = E.inCubic(prog(p, 0.4, 0.95));
      x = slotX(R, ib) + R.evDX * q; y = R.y + R.evDY * q; alpha = 1 - q; rot = R.evRot * q;
      ring = [C.evictRGB, Math.min(1, look ? 1 : 0) * (1 - q)];
    }
    const drawIt = () => tile(g, x, y, R.sz, kk, { alpha, scale, ring, rot });
    if (kk === key && hit && ib !== ia) later.push(drawIt); else drawIt();
  }
  for (const d of later) d();
  // the evicted label
  if (ev && look) {
    const q = prog(p, LOOK, 1), a = Math.min(E.outCubic(prog(q, 0, 0.2)), 1 - E.inCubic(prog(q, 0.7, 1)));
    const ib = before.indexOf(ev);
    text(g, 'evicted', slotX(R, ib) + R.evLX, R.y + R.evLY, { size: R.lab, weight: 800, color: C.evict, align: R.evAlign, alpha: a });
  }
  // the token flying from the tape
  if (token && k >= 0 && p < LOOK + 0.02) {
    const q = E.inOutCubic(prog(p, 0.04, LOOK));
    const ib = before.indexOf(key), tx = ib >= 0 ? slotX(R, ib) : slotX(R, 0), ty = ib >= 0 ? R.y : R.y - R.stage;
    const x = lerp(G.tapeX, tx, q), y = lerp(G.tapeY, ty, q) - Math.sin(Math.PI * q) * 40;
    tile(g, x, y, R.sz, key, { scale: lerp(G.tapeTile / R.sz, 0.72, q), alpha: 1 - prog(p, LOOK - 0.02, LOOK + 0.02) });
  }
}
/** The request tape: past, current and next requests; marks under each past one (LRU hit / miss). */
function tape(g, G, k, p) {
  const pos = k < 0 ? 0 : k + E.inOutCubic(prog(p, 0.88, 1));
  const done = k < 0 ? 0 : k + (p >= LOOK ? 1 : 0);
  g.save();
  g.strokeStyle = 'rgba(241,238,230,0.5)'; g.lineWidth = 3;
  rrect(g, G.tapeX - G.tapeTile / 2 - 8, G.tapeY - G.tapeTile / 2 - 8, G.tapeTile + 16, G.tapeTile + 16, 14); g.stroke();
  g.restore();
  for (let j = 0; j < N; j++) {
    const x = G.tapeX + (j - pos) * G.tapeSp, dx = Math.abs(x - G.tapeX);
    if (dx > G.tapeHalf) continue;
    let a = 1 - smooth(clamp((dx - (G.tapeHalf - G.tapeFade)) / G.tapeFade));
    if (j < done) a *= 0.6;
    const flying = j === k && p < LOOK + 0.02;
    if (flying) a *= 0.25;
    text(g, REQ[j], x, G.tapeY + G.tapeSize * 0.36, { size: G.tapeSize, weight: 850, color: C.keys[REQ[j]], align: 'center', alpha: a });
    if (j < done) {
      g.save(); g.globalAlpha = a; g.fillStyle = LRU.hit[j] ? C.hit : C.miss;
      g.beginPath(); g.arc(x, G.tapeY + G.tapeTile / 2 + 22, 7, 0, Math.PI * 2); g.fill(); g.restore();
    }
  }
}
function caption(g, G, f) {
  for (const [t0, t1, str] of G.TL.caps) {
    const [a, dy] = env(f, t0, t1, 12, 10); if (a <= 0) continue;
    const [p1, p2] = str.split('|');
    if (G.capTwo) {
      text(g, p1, G.capX, G.capY + dy, { size: G.cap, weight: 850, color: C.paper, spacing: -1, alpha: a, max: G.capMax });
      text(g, p2, G.capX, G.capY + G.cap * 1.14 + dy, { size: G.cap, weight: 850, color: C.accent, spacing: -1, alpha: a, max: G.capMax });
    } else {
      const w1 = text(g, p1 + ' ', G.capX, G.capY + dy, { size: G.cap, weight: 850, color: C.paper, spacing: -1, alpha: a });
      text(g, p2, G.capX + w1, G.capY + dy, { size: G.cap, weight: 850, color: C.accent, spacing: -1, alpha: a });
    }
  }
}
function counters(g, G, R, S, name, done, a, big) {
  const h = S.cum[done], m = done - h;
  const l1 = `hits ${h}  ·  misses ${m}`, l2 = `hit rate ${pct(h, done)}%`;
  const al = R.cntAlign;
  text(g, l1, R.cntX, R.cntY, { size: G.fo, weight: 700, color: C.paper, fam: MONO, align: al, alpha: a * (big ? 1 : 0.8) });
  text(g, l2, R.cntX, R.cntY + G.fo * 1.35, { size: G.fo, weight: 800, color: big ? C.hit : C.dim, fam: MONO, align: al, alpha: a });
}
function finale(g, G, f) {
  const TL = G.TL, k1 = E.outCubic(prog(f, TL.calm, TL.calm + 18)), k2 = E.outCubic(prog(f, TL.calm + 10, TL.calm + 28));
  if (k1 <= 0) return;
  const out = 1 - E.inCubic(prog(f, TL.end - 6, TL.end + 12));
  g.save(); g.fillStyle = `rgba(${C.bgRGB},${0.8 * k1 * out})`; g.fillRect(0, G.fnY - G.fn * 1.2, G.w, G.fn * 2.8); g.restore();
  text(g, `LRU: ${LRU.hits} of ${N} hits.`, G.fnX, G.fnY, { size: G.fn, weight: 900, color: C.paper, spacing: -2, align: G.fnAlign, alpha: k1 * out, max: G.fnMax });
  text(g, `FIFO: ${FIFO.hits}.`, G.fnX, G.fnY + G.fn * 1.1, { size: G.fn, weight: 900, color: C.accent, spacing: -2, align: G.fnAlign, alpha: k2 * out, max: G.fnMax });
}
function scene(g, G, f) {
  const TL = G.TL, { k, p } = reqAt(TL, f);
  const done = k < 0 ? 0 : k + (p >= LOOK ? 1 : 0);
  const [a] = env(f, TL.rule0 - 14, TL.end + 10, 14, 12);
  tape(g, G, k, p);
  // row labels
  text(g, 'LRU', G.lru.labX, G.lru.labY, { size: G.lab, weight: 900, color: C.accent, spacing: 2, align: G.labAlign });
  text(g, 'FIFO', G.fifo.labX, G.fifo.labY, { size: G.lab, weight: 900, color: C.dim, spacing: 2, align: G.labAlign });
  const R = G.lru;
  text(g, 'front', slotX(R, 0) - R.sz / 2, R.y + R.sz / 2 + G.hint, { size: 28, weight: 600, color: C.dim });
  text(g, 'back', slotX(R, CAP - 1) + R.sz / 2, R.y + R.sz / 2 + G.hint, { size: 28, weight: 600, color: C.dim, align: 'right' });
  row(g, G, G.fifo, FIFO, k, p, false);
  row(g, G, G.lru, LRU, k, p, true);
  counters(g, G, G.lru, LRU, 'LRU ', done, a, true);
  counters(g, G, G.fifo, FIFO, 'FIFO', done, a, false);
  caption(g, G, f); finale(g, G, f);
}

// ---- landscape picture ------------------------------------------------------------------
const TLL = buildTL({ rule0: 60, slowD: 42, fastD: 13, calm: 0, end: 0 });
TLL.calm = TLL.last + 10; TLL.end = TLL.calm + 60;
const FRAMES = TLL.end + 72;
const GL = { TL: TLL, w: W, h: H,
  capX: 120, capY: 216, cap: 52, capTwo: false, capMax: 1680,
  tapeX: 960, tapeY: 330, tapeSp: 78, tapeSize: 52, tapeTile: 76, tapeHalf: 840, tapeFade: 220,
  lab: 44, labAlign: 'left', hint: 44, fo: 30,
  lru: { x0: 651, y: 640, sz: 150, gap: 56, stage: 170, links: true, evDX: 150, evDY: 90, evRot: 0.5, evLX: 150, evLY: -96, evAlign: 'center', lab: 30,
    labX: 120, labY: 656, cntX: 120, cntY: 710, cntAlign: 'left' },
  fifo: { x0: 762, y: 906, sz: 96, gap: 36, stage: 110, links: false, evDX: 110, evDY: 60, evRot: 0.5, evLX: 100, evLY: -60, evAlign: 'center', lab: 28,
    labX: 120, labY: 904, cntX: 120, cntY: 950, cntAlign: 'left' },
  fn: 104, fnX: W / 2, fnY: 610, fnAlign: 'center', fnMax: 1680 };
function hookL(f) {
  const o = 1 - E.inCubic(prog(f, TLL.rule0 - 12, TLL.rule0 + 4));
  if (o <= 0) return;
  const k = E.outExpo(prog(f, -8, 10)), k2 = E.outBack(prog(f, -6, 12));
  ctx.save(); ctx.fillStyle = `rgba(${C.bgRGB},${0.8 * o})`; ctx.fillRect(0, 400, W, 330); ctx.restore();
  text(ctx, `${CAP} slots. ${N} requests.`, W / 2, 540 + (1 - k) * 30, { size: 108, weight: 900, color: C.paper, spacing: -3, align: 'center', alpha: o * Math.max(0.3, k) });
  text(ctx, 'Who gets evicted?', W / 2, 670 + (1 - clamp(k2)) * 30, { size: 108, weight: 900, color: C.accent, spacing: -3, align: 'center', alpha: o * Math.max(0.3, clamp(k2)) });
}
function draw(f) {
  if (ctx.reset) ctx.reset();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none'; ctx.shadowBlur = 0;
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  const T = TLL, endK = E.inOutCubic(prog(f, T.end, T.end + 20)), a = 1 - endK;
  scene(ctx, GL, f);
  text(ctx, 'SYSTEMS  ·  LRU CACHE', 120, 104, { size: 26, weight: 600, color: C.dim, spacing: 5, alpha: a });
  text(ctx, 'BYTEPATTERNS', 1800, 104, { size: 26, weight: 600, color: C.dim, spacing: 5, align: 'right', alpha: a });
  hookL(f);

    ctx.fillStyle = `rgba(${C.bgRGB},${0.86 * endK})`; ctx.fillRect(0, 0, W, H);

    text(ctx, 'Least Recently Used', W / 2, 500 + (1 - k1) * 30, { size: 140, weight: 850, color: C.paper, spacing: -3, align: 'center', alpha: k1, max: 1680 });
    text(ctx, `${CAP} slots  ·  ${N} requests  ·  LRU ${pct(LRU.hits, N)}% hits, FIFO ${pct(FIFO.hits, N)}%`, W / 2, 580 + (1 - k2) * 20, { size: 42, weight: 500, color: C.accent, align: 'center', alpha: k2 });

// ---- sound: a bright note per hit, a low one and a fetch per miss, a fall per eviction ----
async function renderAudio(TL = TLL, frames = FRAMES) {
  const SR = 48000, dur = frames / FPS, LEN = Math.round(SR * dur);
  const ac = new OfflineAudioContext(2, LEN, SR);
  const at = fr => fr / FPS;
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -16; comp.ratio.value = 3; comp.attack.value = 0.005; comp.release.value = 0.25;
  const master = ac.createGain(); master.gain.value = 0.9; master.connect(comp).connect(ac.destination);
  master.gain.setValueAtTime(0.9, dur - 1.0); master.gain.linearRampToValueAtTime(0.0001, dur - 0.02);
  const rnd = mulberry32(0x44C4C3);
  const ir = ac.createBuffer(2, SR * 2, SR);

  const noise = ac.createBuffer(1, SR, SR); { const d = noise.getChannelData(0); for (let k = 0; k < d.length; k++) d[k] = rnd() * 2 - 1; }
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  const pluck = (t0, m, amp, pan, dec = 0.35, type = 'triangle') => {
    const o = ac.createOscillator(), g = ac.createGain(), p = ac.createStereoPanner(); o.type = type; o.frequency.value = hz(m);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(amp, t0 + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dec);
    p.pan.value = pan; o.connect(g).connect(p); p.connect(master); p.connect(verb); o.start(t0); o.stop(t0 + dec + 0.05);
  };
  const pad = (t0, t1, notes, amp, cutoff) => {
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = cutoff; lp.Q.value = 1; lp.connect(master); lp.connect(verb);
    notes.forEach((m, i) => { for (const det of [-6, 6]) {
      const o = ac.createOscillator(), g = ac.createGain(), p = ac.createStereoPanner(); o.type = 'sawtooth'; o.frequency.value = hz(m); o.detune.value = det;
      p.pan.value = (i / Math.max(1, notes.length - 1) - 0.5) * 0.8 * Math.sign(det);
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(amp, t0 + 1.0); g.gain.setValueAtTime(amp, Math.max(t0 + 1.0, t1 - 0.8)); g.gain.exponentialRampToValueAtTime(0.0001, t1 + 0.4);

  };
  const PENTA = [0, 2, 4, 7, 9, 12, 14, 16];
  pad(at(Math.max(0, TL.rule0 - 40)), at(TL.start(TL.slowN)), [45, 52, 57, 60], 0.013, 900);
  pad(at(TL.start(TL.slowN) - 4), at(TL.calm + 4), [41, 48, 53, 57, 60], 0.012, 1100);
  pad(at(TL.calm), at(TL.end + 50), [45, 52, 57, 61, 64], 0.015, 1500);
  for (let k = 0; k < N; k++) {
    const s = TL.start(k), d = TL.start(k + 1) - s, t0 = at(s + LOOK * d), m = 72 + PENTA[KEYIDX(REQ[k])];
    if (LRU.hit[k]) { pluck(t0, m + 12, 0.075, -0.2, 0.4); pluck(t0 + 0.05, m + 19, 0.03, -0.1, 0.3, 'sine'); }
    else {
      pluck(t0, m - 12, 0.08, -0.15, 0.3);
      const src = ac.createBufferSource(); src.buffer = noise; const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 2;
      bp.frequency.setValueAtTime(700, t0 - 0.12); bp.frequency.exponentialRampToValueAtTime(2600, t0);
      const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t0 - 0.12); g.gain.exponentialRampToValueAtTime(0.05, t0 - 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.08);
      src.connect(bp).connect(g).connect(master); src.start(t0 - 0.12); src.stop(t0 + 0.1);
    }
    if (LRU.out[k]) {                                                   // the evicted entry falls away
      const t1 = at(s + 0.5 * d), o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine';
      o.frequency.setValueAtTime(hz(64), t1); o.frequency.exponentialRampToValueAtTime(hz(40), t1 + 0.28);
      g.gain.setValueAtTime(0.0001, t1); g.gain.exponentialRampToValueAtTime(0.07, t1 + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t1 + 0.32);
      o.connect(g).connect(master); o.start(t1); o.stop(t1 + 0.35);

  }
  [69, 73, 76, 81].forEach((m, i) => pluck(at(TL.calm) + i * 0.09, m, 0.06, -0.3 + i * 0.2, 1.6, 'sine'));
  [76, 81, 85, 88].forEach((m, i) => pluck(at(TL.end + 10 + i * 6), m, 0.05, -0.45 + i * 0.3, 1.8, 'sine'));
  const buf = await ac.startRendering();
  let peak = 0; for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let k = 0; k < d.length; k++) peak = Math.max(peak, Math.abs(d[k])); }
  const norm = 0.85 / Math.max(peak, 1e-6);                          // every piece peaks at the same level
  for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let k = 0; k < d.length; k++) d[k] *= norm; }
  return buf;
}

/* ==========================================================================
   VERTICAL CUT — shared block, identical in every piece.
   1080x1920 for Reels, Shorts and TikTok (__motion.variants.vertical). The
   piece's own scene code is re-used and recomposed for a phone: everything a
   viewer must read stays inside the area no platform covers (x 60..900,
   y 230..1400); outside it there is only dimmed texture.
   ========================================================================== */
const VW = 1080, VH = 1920, SAFE = { x: 60, y: 230, w: 840, h: 1170, r: 900, b: 1400 };
const vcv = document.createElement('canvas'); vcv.width = VW; vcv.height = VH;
const vx = vcv.getContext('2d', { willReadFrequently: true });   // CPU raster: identical pixels on every redraw
const VL = 96, VR = 864;                                          // text column inside the safe area

function vReset() {
  vx.setTransform(1, 0, 0, 1, 0, 0); vx.globalAlpha = 1; vx.globalCompositeOperation = 'source-over';
  vx.filter = 'none'; vx.shadowBlur = 0; vx.shadowColor = 'transparent'; vx.letterSpacing = '0px'; vx.setLineDash([]);
  vx.textAlign = 'left'; vx.textBaseline = 'alphabetic'; vx.lineCap = 'butt'; vx.lineJoin = 'miter';
}
/** Canvas text on the vertical frame; `max` shrinks the size until the line fits. */
function vText(str, x, y, { size = 40, weight = 700, color = '#FFFFFF', align = 'left', spacing = 0, alpha = 1, fam = FONT, max = 0 } = {}) {
  if (alpha <= 0.002 || !str) return size;
  vx.font = `${weight} ${size}px ${fam}`; vx.letterSpacing = spacing + 'px';
  if (max) { const w = vx.measureText(str).width; if (w > max) { size = size * max / w; vx.font = `${weight} ${size}px ${fam}`; } }
  vx.textAlign = align; vx.textBaseline = 'alphabetic';
  const a0 = vx.globalAlpha; vx.globalAlpha = a0 * alpha; vx.fillStyle = color;
  vx.fillText(str, x + (align === 'center' ? spacing / 2 : align === 'right' ? spacing : 0), y);   // tracking is added after the last glyph too
  vx.globalAlpha = a0; vx.letterSpacing = '0px';
  return size;
}
/** Word-wraps with the given font; returns the lines. */
function vWrap(str, maxW, size, weight = 700, fam = FONT) {
  vx.font = `${weight} ${size}px ${fam}`; vx.letterSpacing = '0px';
  const words = str.split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (vx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur);
  return lines;
}
/** Fade envelope with a small rise: [alpha, dy]. */
function vEnv(v, a, b, fin = 8, fout = 8) {
  const i = E.outCubic(prog(v, a, a + fin)), o = 1 - E.inCubic(prog(v, b - fout, b));
  return [Math.min(i, o), (1 - i) * 22 - (1 - o) * 10];
}
/** Which segment of a cut list a vertical frame is in: segs = [{ at, src, len }] in frames. */
function vSeg(segs, v) {
  let k = 0; while (k < segs.length - 1 && v >= segs[k + 1].at) k++;
  const s = segs[k];
  return { k, s, local: v - s.at, src: s.src + (v - s.at) };
}
/** Dims everything outside the safe area to a quiet texture (brightness x 0.2), with a soft inner edge. */
function vShade(rgb, a = 0.8, feather = 40) {
  vx.save(); vx.setTransform(1, 0, 0, 1, 0, 0); vx.globalAlpha = 1; vx.globalCompositeOperation = 'source-over';
  vx.fillStyle = `rgba(${rgb},${a})`;
  vx.beginPath(); vx.rect(0, 0, VW, VH); vx.rect(SAFE.x, SAFE.y, SAFE.w, SAFE.h); vx.fill('evenodd');
  const strip = (x0, y0, x1, y1, rx, ry, rw, rh) => {
    const g = vx.createLinearGradient(x0, y0, x1, y1);
    g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`);
    vx.fillStyle = g; vx.fillRect(rx, ry, rw, rh);

  strip(SAFE.r, 0, SAFE.r - feather, 0, SAFE.r - feather, SAFE.y, feather, SAFE.h);
  strip(0, SAFE.y, 0, SAFE.y + feather, SAFE.x, SAFE.y, SAFE.w, feather);
  strip(0, SAFE.b, 0, SAFE.b - feather, SAFE.x, SAFE.b - feather, SAFE.w, feather);

}
/** Series tag at the top of the safe area, e.g. MADE IN CODE · 04. */
function vTag(label, color, alpha = 1) {
  vText('MADE IN CODE', VL, 292, { size: 28, weight: 800, color, spacing: 5, alpha });
  vx.font = `800 28px ${FONT}`; vx.letterSpacing = '5px';
  const w = vx.measureText('MADE IN CODE').width; vx.letterSpacing = '0px';
  vText('·  ' + label, VL + w + 14, 292, { size: 28, weight: 600, color: 'rgba(255,255,255,0.72)', spacing: 3, alpha, max: VR - VL - w - 14 });
}
/** Big hook lines, left-aligned from y0; visible from frame 0, settles in a few frames. */
function vHook(v, lines, y0, { size = 84, lh = 1.08, color = '#FFFFFF', accent = null, weight = 800, spacing = -1.5, alpha = 1 } = {}) {
  const k = E.outExpo(prog(v, -6, 12));
  lines.forEach((ln, i) => {
    const kk = E.outExpo(prog(v, -12 + i * 2, 8 + i * 2));
    vText(ln, VL, y0 + i * size * lh + (1 - kk) * 30, { size, weight, spacing, color: accent && i === lines.length - 1 ? accent : color, alpha: alpha * Math.max(0.25, kk), max: VR - VL });
  });
  return k;
}
/** Closing card, the last 60 frames: piece title, "drawn in code · bytepatterns.com". l = frames into the card. */
function vEndCard(l, { title, line = '', ink = '#FFFFFF', dim = 'rgba(255,255,255,0.66)', accent = '#FFFFFF', scrim = '0,0,0', a = 0.84 }) {
  const k = E.outCubic(prog(l, 0, 12));
  vx.save(); vx.setTransform(1, 0, 0, 1, 0, 0);
  vx.fillStyle = `rgba(${scrim},${a * k})`; vx.fillRect(0, 0, VW, VH);
  vx.restore();
  const t1 = E.outExpo(prog(l, 3, 19)), t2 = E.outExpo(prog(l, 11, 27)), t3 = E.outExpo(prog(l, 19, 35));
  vx.fillStyle = accent; vx.globalAlpha = t1; vx.fillRect(VL, 742, 88 * t1, 7); vx.globalAlpha = 1;
  const size = vText(title, VL, 850 + (1 - t1) * 40, { size: 92, weight: 800, color: ink, spacing: -2, alpha: t1, max: VR - VL });
  const y2 = 850 + Math.max(size, 60) * 0.25 + 70;
  vx.font = `600 44px ${FONT}`;
  const lead = 'drawn in code  ·  ', lw = vx.measureText(lead).width;
  vText(lead, VL, y2 + (1 - t2) * 24, { size: 44, weight: 600, color: dim, alpha: t2 });
  vText('bytepatterns.com', VL + lw, y2 + (1 - t2) * 24, { size: 44, weight: 800, color: accent, alpha: t2 });
  if (line) vText(line, VL, y2 + 72 + (1 - t3) * 18, { size: 32, weight: 500, color: dim, alpha: t3, max: VR - VL });

/** Seeks a cut. The first frame a page draws is drawn twice: the very first read of a
 *  GPU-backed source canvas can come out a shade different from every later one. */
let vWarm = false;
function vSeek(draw, i, frames) {
  const f = Math.max(0, Math.min(frames - 1, Math.floor(i)));
  if (!vWarm) { vWarm = true; draw(f); }
  draw(f);
}
/** The soundtrack of a cut: the piece's own audio() spliced to the same segments as the picture. */
async function vAudio(segs, frames, { xf = 0.025, fadeOut = 0.6, extra = null } = {}) {
  const src = await renderAudio();
  const SR = 48000, dur = frames / FPS, ac = new OfflineAudioContext(2, Math.round(SR * dur), SR);
  const out = ac.createGain(); out.connect(ac.destination);
  out.gain.setValueAtTime(1, 0); out.gain.setValueAtTime(1, dur - fadeOut); out.gain.linearRampToValueAtTime(0, dur - 0.01);
  segs.forEach((s, k) => {
    const at = s.at / FPS, off = s.src / FPS, d = s.len / FPS;
    const pre = k === 0 ? 0 : Math.min(xf, off), post = k === segs.length - 1 ? 0 : xf;
    const b = ac.createBufferSource(), g = ac.createGain(); b.buffer = src;
    g.gain.setValueAtTime(pre ? 0 : 1, at - pre);
    if (pre) g.gain.linearRampToValueAtTime(1, at + pre);
    if (post) { g.gain.setValueAtTime(1, at + d - post); g.gain.linearRampToValueAtTime(0, at + d + post); }
    b.connect(g).connect(out); b.start(at - pre, off - pre, d + pre + post);

  let peak = 0; for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) peak = Math.max(peak, Math.abs(d[i])); }
  if (peak > 0.9) for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] *= 0.9 / peak; }

/** A soft three-partial bell, for the closing card. */

  for (const [mul, v, dec] of [[1, 1, 1.8], [2.01, 0.35, 0.8], [3.02, 0.12, 0.4]]) {

/* VERTICAL CUT — this piece */
// The same two caches on a 1080 x 1920 stage and a shorter clock; the rows are stacked
// inside the safe area and evicted tiles fall straight down instead of off to the side.
const TLV = buildTL({ rule0: 40, slowD: 28, fastD: 10, calm: 0, end: 0 });
TLV.calm = TLV.last + 8; TLV.end = TLV.calm + 42;
const VFR = TLV.end + 60, VEND = VFR - 60;
const GV = { TL: TLV, w: VW, h: VH,
  capX: VL, capY: 390, cap: 50, capTwo: true, capMax: VR - VL,
  tapeX: 480, tapeY: 560, tapeSp: 72, tapeSize: 48, tapeTile: 70, tapeHalf: 380, tapeFade: 150,
  lab: 40, labAlign: 'right', hint: 42, fo: 30,
  lru: { x0: 189, y: 850, sz: 156, gap: 38, stage: 172, links: true, evDX: 0, evDY: 150, evRot: 0.35, evLX: 0, evLY: -104, evAlign: 'center', lab: 30,
    labX: VR, labY: 700, cntX: VL, cntY: 1034, cntAlign: 'left' },
  fifo: { x0: 264, y: 1250, sz: 108, gap: 36, stage: 110, links: false, evDX: 0, evDY: 70, evRot: 0.35, evLX: 0, evLY: -72, evAlign: 'center', lab: 28,
    labX: VR, labY: 1150, cntX: VL, cntY: 1338, cntAlign: 'left' },
  fn: 90, fnX: VL, fnY: 800, fnAlign: 'left', fnMax: VR - VL };
function hookV(v) {
  const o = 1 - E.inCubic(prog(v, TLV.rule0 - 10, TLV.rule0 + 4));
  if (o <= 0) return;
  vx.save(); vx.fillStyle = `rgba(${C.bgRGB},${0.84 * o})`; vx.fillRect(SAFE.x, 400, SAFE.w, 560); vx.restore();
  vHook(v, [`${CAP} slots.`, `${N} requests.`, 'Who gets', 'evicted?'], 510, { size: 104, accent: C.accent, color: C.paper, weight: 900, spacing: -2, alpha: o });
}
function vDraw(v) {
  if (vx.reset) vx.reset();
  vReset();
  vx.fillStyle = C.bg; vx.fillRect(0, 0, VW, VH);
  scene(vx, GV, v);
  hookV(v);
  vReset();
  vShade(C.bgRGB, 0.86);
  vTag('LRU CACHE', C.accent);
  if (v >= VEND) vEndCard(v - VEND, { title: 'Least Recently Used', line: `${N} requests  ·  LRU ${LRU.hits} hits  ·  FIFO ${FIFO.hits}`,
    ink: C.paper, dim: 'rgba(241,238,230,0.72)', accent: C.accent, scrim: C.bgRGB, a: 0.88 });
  vReset();
}

// The player asks for a frame on every display refresh; at 30 fps on a 60 Hz screen every other call
// asks for the frame already on the canvas, which is then left as it is (same frame, same pixels).
const shown = { L: -1, V: -1 };
window.__motion = {
  title: 'Least Recently Used',
  description: `An LRU cache with ${CAP} slots serves ${N} requests: a hit moves its entry to the front, a miss puts the new entry there and, once the cache is full, evicts the one at the back. Request ${FIRST_EV + 1} is the first eviction; by the end LRU has ${LRU.hits} hits (${pct(LRU.hits, N)}%), while a FIFO cache of the same size on the same requests has ${FIFO.hits} (${pct(FIFO.hits, N)}%), because it evicts by arrival, hot or not.`,
  fps: FPS, width: W, height: H, frames: FRAMES,
  poster: TLL.start(FIRST_EV) + 22,
  gifStart: Math.floor(TLL.start(FIRST_EV - 2) / FPS),
  seek(i) { const f = Math.max(0, Math.min(FRAMES - 1, Math.floor(i))); if (f !== shown.L) { shown.L = f; draw(f); } },
  audio: () => renderAudio(TLL, FRAMES),
  variants: {
    vertical: {
      width: VW, height: VH, frames: VFR, canvas: vcv,
      poster: TLV.start(FIRST_EV) + 16, gifStart: Math.floor(TLV.start(FIRST_EV - 1) / FPS),
      seek(i) { const v = Math.max(0, Math.min(VFR - 1, Math.floor(i))); if (v !== shown.V) { shown.V = v; vSeek(vDraw, v, VFR); } },
      audio: () => renderAudio(TLV, VFR),
    },
  },
};

/* ==========================================================================
   PLAYER — identical in every piece; keep as is.
   Autoplays and loops, starts sound on the first click, ?frame=N pauses on a
   frame, ?variant=vertical plays the vertical cut (if the piece has one).
   When the renderer sets window.__MOTION_RENDER__ it stays out of the way.
   ========================================================================== */
(function player() {

    V.canvas.style.cssText = `width:min(100vw,calc(100vh*${V.width}/${V.height}));height:auto;aspect-ratio:${V.width}/${V.height}`;
    document.querySelector('canvas').replaceWith(V.canvas);

    btn.textContent = 'Loading sound…';
    ac = ac || new AudioContext({ sampleRate: 48000 });
    buf = buf || await M.audio();
    await ac.resume();
    src = ac.createBufferSource(); src.buffer = buf; src.loop = true; src.connect(ac.destination);
    t0 = ac.currentTime + 0.05; src.start(t0);        // picture restarts from frame 0 in sync with the sound
    btn.textContent = 'Sound on — click to mute';
  });
  addEventListener('keydown', e => {
    if (e.code !== 'Space') return;
    e.preventDefault(); paused = !paused;
    if (ac) paused ? ac.suspend() : ac.resume();
    if (!ac) { if (paused) pausedAt = performance.now(); else t0 += performance.now() - pausedAt; }
  });
})();
</script>
</body>
