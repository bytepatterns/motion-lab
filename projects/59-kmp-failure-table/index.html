<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="teambytepatterns">
<meta name="description" content="A nine-letter pattern builds its failure table from its own borders, then it is searched for in a 44-letter text twice: the naive search slides one letter and starts over, KMP slides by the table and its text pointer never moves back, and both find the same three matches, KMP with about half the comparisons.">
<title>KMP: Never Step Back — motion-lab</title>
<style>
  /* Player chrome. The piece itself lives entirely in the canvas. */
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; font: 500 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; }
  canvas { display: block; width: min(100vw, calc(100vh * 16 / 9)); height: auto; aspect-ratio: 16 / 9; }
  #sound { position: fixed; left: 16px; bottom: 16px; padding: 8px 14px; border: 1px solid rgba(255,255,255,.35); border-radius: 999px;
           background: rgba(0,0,0,.55); color: #fff; font: inherit; cursor: pointer; }
  #sound[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080" aria-label="A row of nine lettered tiles and a copy of it that slides underneath while a row of small numbers fills in; then two long rows of letters, each with the tiles sliding along under it: the upper tiles step one place at a time and keep going back, the lower tiles jump ahead and finish first; yellow bars mark where the word was found"></canvas>
<button id="sound" type="button">Click for sound</button>
<script>
'use strict';
/* ==========================================================================
   PIECE — KMP: Never Step Back.
   Knuth-Morris-Pratt string search. Before searching, the pattern is
   compared with itself: fail[i] is the length of the longest proper prefix
   of P[0..i] that is also a suffix of it (its border). The table is built
   with the same walk it will later be used for: on a mismatch the matched
   length falls back to fail[len - 1] instead of to zero.
   The search compares T[i] with P[j]; on a match both advance, on a
   mismatch with j > 0 only j falls back to fail[j - 1] (the pattern slides
   right by j - fail[j - 1]), with j = 0 only i advances. i never decreases.
   The naive search runs beside it: for every shift, compare from the first
   letter until a mismatch, then slide by one and start over.
   The text comes from a fixed seed; the table, every comparison of both
   searches, every match and every backward step of the text pointer are
   computed once at load. A frame maps to a step of that record, so seek(i)
   is pure in i.
   ========================================================================== */
const W = 1920, H = 1080, FPS = 30;
const cv = document.getElementById('stage');
const ctx = cv.getContext('2d', { willReadFrequently: true });   // CPU raster: identical pixels on every redraw
const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
const MONO = 'ui-monospace, "Cascadia Code", Consolas, Menlo, monospace';

// ---- helpers -------------------------------------------------------------
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (f, a, b) => clamp((f - a) / (b - a));
const smooth = t => t * t * (3 - 2 * t);
const E = {
  inCubic: t => t * t * t,
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inOutCubic: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outExpo: t => t === 1 ? 1 : 1 - Math.pow(2, -10 * t),
  inExpo: t => t === 0 ? 0 : Math.pow(2, 10 * t - 10),
  inOutExpo: t => t === 0 ? 0 : t === 1 ? 1 : t < .5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2,
  outBack: t => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2),

/** Canvas text; `max` shrinks the size until the line fits. Returns the width drawn. */
function text(g, str, x, y, { size = 40, weight = 600, color = '#fff', alpha = 1, spacing = 0, align = 'left', fam = FONT, base = 'alphabetic', max = 0 } = {}) {
  if (alpha <= 0.002 || !str) return 0;
  g.font = `${weight} ${size}px ${fam}`; g.letterSpacing = spacing + 'px';
  if (max) { const w0 = g.measureText(str).width; if (w0 > max) { size *= max / w0; g.font = `${weight} ${size}px ${fam}`; } }

  const a0 = g.globalAlpha; g.globalAlpha = a0 * alpha; g.fillStyle = color;

}
const measure = (g, str, size, weight = 800, fam = FONT, spacing = 0) => { g.font = `${weight} ${size}px ${fam}`; g.letterSpacing = spacing + 'px'; const w = g.measureText(str).width; g.letterSpacing = '0px'; return w; };
const env = (f, a, b, fin = 12, fout = 10) => {
  const i = E.outCubic(prog(f, a, a + fin)), o = 1 - E.inCubic(prog(f, b - fout, b));
  return [Math.min(i, o), (1 - i) * 24 - (1 - o) * 10];
};


// ---- palette -------------------------------------------------------------
const C = {
  bg: '#0B0D14', bgRGB: '11,13,20', paper: '#F1EEE6', paperRGB: '241,238,230', dim: 'rgba(241,238,230,0.62)', faint: 'rgba(241,238,230,0.16)',
  accent: '#FFC857', accentRGB: '255,200,87', go: '#5CD6CB', goRGB: '92,214,203', no: '#FF5E6C', noRGB: '255,94,108', node: '#151A28',
  naive: '#8FA8FF', naiveRGB: '143,168,255',

// ---- the pattern, the text, the table and both searches, computed once ----------------------
const P = 'ABABCABAB', M = P.length, N = 44;
const TXT = (function () {
  // pieces of the pattern's own prefixes, so the text is full of near misses
  const R = mulberry32(0x59D6); let s = '';
  while (s.length < N) { const r = R(); if (r < 0.16) s += P; else if (r < 0.8) s += P.slice(0, 2 + Math.floor(R() * (M - 3))); else s += 'ABC'[Math.floor(R() * 3)]; }
  return s.slice(0, N);
})();
// the failure table, one comparison at a time: { i, len, ok, set?, jump? }
const FAIL = new Array(M).fill(0), BUILD = [];
(function () {

  while (i < M) {
    const e = { i, len, ok: P[i] === P[len] };
    if (e.ok) { len++; FAIL[i] = len; e.set = len; i++; }
    else if (len > 0) { e.jump = FAIL[len - 1]; len = e.jump; }

})();
const BUILD_JUMPS = BUILD.filter(e => e.jump !== undefined).length;
// KMP: one event per comparison { ti, pj, ok, shift, next shift, match?, via? (the table entry used after) }
function runKMP() {
  const ev = [], found = []; let i = 0, j = 0;
  while (i < N) {
    const e = { ti: i, pj: j, ok: TXT[i] === P[j], shift: i - j };
    if (e.ok) { i++; j++; if (j === M) { e.match = i - M; found.push(i - M); e.via = M - 1; j = FAIL[M - 1]; } }
    else if (j > 0) { e.via = j - 1; j = FAIL[j - 1]; }

}

    for (let k = 0; k < M; k++) {

      ev.push(e);

const KMP = runKMP(), NAI = runNaive();
const backSteps = ev => { let b = 0; for (let q = 1; q < ev.length; q++) b += Math.max(0, ev[q - 1].ti - ev[q].ti); return b; };
KMP.back = backSteps(KMP.ev); NAI.back = backSteps(NAI.ev);
const KC = KMP.ev.length, NC = NAI.ev.length, MK = KMP.found;
const SAME = MK.length === NAI.found.length && MK.every((x, q) => x === NAI.found[q]);
const OVERLAP = MK.some((x, q) => q > 0 && x - MK[q - 1] < M);
const WORDS = ['no', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten'];
const word = n => WORDS[n] || String(n);

// ---- timeline -------------------------------------------------------------------------------
// hook until a0; the pattern appears at p0; the table is built one event per `step` from a0;
// it moves into place (a1..r0); both searches run one comparison per `tick` from r0 to r1.
function buildTL(o) {
  const TL = Object.assign({}, o);
  TL.a1 = TL.a0 + BUILD.length * TL.step;
  TL.m0 = TL.a1 + TL.holdA; TL.r0 = TL.m0 + TL.moveT;
  TL.k1 = TL.r0 + KC * TL.tick; TL.r1 = TL.r0 + NC * TL.tick;
  TL.calm = TL.r1 + TL.hold; TL.end = Math.round(TL.calm + TL.calmT);
  const firstJump = BUILD.findIndex(e => e.jump !== undefined);
  const cj = TL.a0 + Math.max(firstJump, 2) * TL.step;
  const mid = Math.round(TL.r0 + Math.min(KC * 0.55, NC * 0.4) * TL.tick);
  TL.caps = [
    [TL.p0, cj - 2, `The failure table: for each prefix of ${P},|the longest start that is also its end.`],
    [cj, TL.a1 + 4, `On a mismatch, never back to zero:|fall back to fail[len − 1] and compare again.`],
    [TL.a1 + 6, TL.r0 - 2, `fail = ${FAIL.join(' ')}|${BUILD.length} comparisons to build it.`],
    [TL.r0, mid - 2, `Search a ${N}-letter text. Naive:|on a mismatch, slide one and start over.`],
    [mid, TL.r1 + 2, `KMP slides by the table instead:|its text pointer never moves back.`],
    [TL.r1 + 4, TL.calm - 2, `Same ${word(MK.length)} matches, at ${MK.join(', ')}.|${KC} comparisons against ${NC}.`],
  ];
  return TL;
}

// ---- drawing ------------------------------------------------------------------------------
function cell(g, x, y, w, h, ch, { size = 30, fill = C.node, stroke = C.faint, lw = 2, ink = C.paper, alpha = 1, ring = null, r = 8 } = {}) {
  if (alpha <= 0.01) return;
  g.save(); g.globalAlpha = alpha; g.fillStyle = fill; g.beginPath(); g.roundRect(x - w / 2, y - h / 2, w, h, r); g.fill();
  g.strokeStyle = ring || stroke; g.lineWidth = ring ? Math.max(3.5, lw) : lw; g.stroke(); g.restore();
  if (ch !== null && ch !== undefined) text(g, String(ch), x, y + size * 0.04, { size, weight: 800, color: ink, align: 'center', base: 'middle', fam: MONO, alpha });
}
function pill(g, str, x, y, size, col, alpha, align = 'left') {
  if (alpha <= 0.01) return;
  const w = measure(g, str, size, 800, MONO) + 28, h = size + 18, x0 = align === 'right' ? x - w : x;
  g.save(); g.globalAlpha = alpha; g.fillStyle = C.bg; g.beginPath(); g.roundRect(x0, y - h / 2, w, h, h / 2); g.fill(); g.strokeStyle = col; g.lineWidth = 2.5; g.stroke(); g.restore();
  text(g, str, x0 + 14, y + 1, { size, weight: 800, color: col, base: 'middle', fam: MONO, alpha });
}
/** Phase A: the pattern against a sliding copy of itself, and the table filling in. */
function tableBuild(g, G, f) {

  const [a] = env(f, TL.p0, TL.r0 + 4, 14, 22);

  const X = k => A.x0 + (k + 0.5) * A.cw;

  const e = u < 0 ? null : u >= BUILD.length ? null : BUILD[q];

  const offOf = k => k < 0 ? 1 : k >= BUILD.length ? BUILD[BUILD.length - 1].ni - BUILD[BUILD.length - 1].nlen : BUILD[k].i - BUILD[k].len;
  let off = offOf(0);

  const ia = E.outCubic(prog(f, TL.p0, TL.p0 + 16));

  for (let k = 0; k < M; k++) {
    text(g, String(k), X(k), A.yA - A.ch / 2 - 18 + lift, { size: 28, weight: 700, color: C.dim, align: 'center', fam: MONO, alpha: aa * ia });
    const cmp = e && e.i === k && p < 0.7, done = u >= 0 && (k < (e ? e.i : M) || u >= BUILD.length);
    const border = e && k >= e.i - e.len && k < e.i && p < 0.7;
    cell(g, X(k), A.yA + lift + (1 - ia) * 30, A.cw - 12, A.ch, P[k], { size: A.letter, alpha: aa * ia, fill: border ? `rgba(${C.goRGB},0.2)` : C.node,
      stroke: done ? 'rgba(241,238,230,0.4)' : C.faint, ring: cmp ? (e.ok ? C.go : C.no) : null });
  }
  text(g, 'pattern', A.x0 - 24, A.yA + lift + 10, { size: 30, weight: 700, color: C.dim, align: 'right', alpha: aa * ia });

  const ca = aa * E.outCubic(prog(f, TL.a0 - 16, TL.a0 + 2));
  if (ca > 0) {
    g.save(); g.beginPath(); g.rect(A.x0 - 8, A.yB - A.ch, M * A.cw + 2, A.ch * 2); g.clip();
    for (let k = 0; k < M; k++) {
      const x = X(k + off); if (x > A.x0 + M * A.cw + A.cw) continue;
      const inB = e && k < e.len && p < 0.7, cmp = e && k === e.len && p < 0.7;
      cell(g, x, A.yB + lift, A.cw - 12, A.ch, P[k], { size: A.letter, alpha: ca * (x > A.x0 + M * A.cw ? 0.3 : 1), fill: inB ? `rgba(${C.goRGB},0.2)` : 'rgba(255,200,87,0.08)',
        stroke: 'rgba(255,200,87,0.45)', ring: cmp ? (e.ok ? C.go : C.no) : null });
    }
    g.restore();
    text(g, 'itself', A.x0 - 24, A.yB + lift + 10, { size: 30, weight: 700, color: C.dim, align: 'right', alpha: ca });
  }

    const lab = e.ok ? `P[${e.i}] = P[${e.len}]  →  fail[${e.i}] = ${e.set}` : e.jump !== undefined ? `P[${e.i}] ≠ P[${e.len}]  →  len = fail[${e.len - 1}] = ${e.jump}` : `P[${e.i}] ≠ P[0]  →  fail[${e.i}] = 0`;
    const al = ca * Math.min(E.outCubic(prog(p, 0, 0.2)), 1 - E.inCubic(prog(p, 0.85, 1)));

}
/** The table itself: in phase A under the pattern, then moved next to the KMP lane. */
function failRow(g, G, f, used) {
  const TL = G.TL, A = G.A, F = G.F;

  if (a <= 0) return;

  for (let k = 0; k < M; k++) {
    // fail[0] = 0 by definition; fail[i] appears when the event that sets it lands
    let at = k === 0 ? TL.a0 - 6 : TL.a0 + (BUILD.findIndex(e => e.i === k && e.set !== undefined) + 0.5) * TL.step;
    const k2 = E.outBack(prog(f, at, at + 10)), x = x0 + (k + 0.5) * cw;

    if (mv > 0) text(g, P[k], x, y - ch / 2 - 16, { size: 28, weight: 800, color: C.dim, align: 'center', fam: MONO, alpha: a * mv });
    if (k2 > 0) text(g, String(FAIL[k]), x, y + 2 + (1 - clamp(k2)) * -20, { size: size * (0.6 + 0.4 * k2), weight: 850, color: C.accent, align: 'center', base: 'middle', fam: MONO, alpha: a * clamp(k2) });

/** Where a search is at frame f: the event index, its progress and the shift and camera, eased. */
function laneState(G, S, f) {

function lane(g, G, f, S, L, name, col, colRGB) {

    S.ev.forEach((e, q) => {

}
/** A soft three-partial bell, for the closing card. */
function vChime(ac, dest, at, freq, vol = 0.08) {
  for (const [mul, v, dec] of [[1, 1, 1.8], [2.01, 0.35, 0.8], [3.02, 0.12, 0.4]]) {
    const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.value = freq * mul;
    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol * v, at + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, at + dec);
    o.connect(g).connect(dest); o.start(at); o.stop(at + dec + 0.05);
  }
}

/* VERTICAL CUT — this piece */
// The same table and the same two searches on a 1080 x 1920 stage and a faster clock; the text
// is too long for a phone's width, so each lane shows a window of it that follows its own pointer.
const TLV = buildTL({ p0: 34, a0: 52, step: 13, holdA: 18, moveT: 24, tick: 2.0, hold: 16, calmT: 52 });
const VFR = TLV.end + 60, VEND = VFR - 60;
const GV = { TL: TLV, w: VW, h: VH, pill: 28,
  A: { x0: VR - M * 72, cw: 72, ch: 80, yA: 640, yB: 760, yF: 900, py: 1030, letter: 48, px: VL, pAlign: 'left' },
  F: { x0: VR - M * 60, cw: 60, ch: 52, y: 1236, size: 30 },
  tx0: VL, cw: 54, ch: 58, letter: 32, win: 14, clip: [VL - 6, VR + 6], cx: VR,
  L: [{ ly: 560, y: 640, py: 706, px: VL, pyL: 790 }, { ly: 870, y: 950, py: 1016, px: VL, pyL: 1100 }],
  pAlign: 'left',
  capX: VL, capY: 390, cap: 46, capTwo: true, capMax: VR - VL,
  fo: 28, foX: VL, foY: 1346, foAlign: 'left', foX2: VL, foY2: 1384, foAlign2: 'left',
  fn: 72, fnX: VL, fnY: 800, fnAlign: 'left', fnMax: VR - VL };
function hookV(v) {
  const o = 1 - E.inCubic(prog(v, TLV.p0 - 10, TLV.p0 + 4));
  if (o <= 0) return;
  vx.save(); vx.fillStyle = `rgba(${C.bgRGB},${0.86 * o})`; vx.fillRect(SAFE.x, 400, SAFE.w, 560); vx.restore();
  vHook(v, ['Find a word', 'in a text', 'and never', 'step back.'], 510, { size: 104, accent: C.accent, color: C.paper, weight: 900, spacing: -2, alpha: o });
}
function vDraw(v) {
  if (vx.reset) vx.reset();
  vReset();
  vx.fillStyle = C.bg; vx.fillRect(0, 0, VW, VH);
  scene(vx, GV, v);
  hookV(v);
  vReset();
  vShade(C.bgRGB, 0.86);
  vTag('KMP STRING SEARCH', C.accent);
  if (v >= VEND) vEndCard(v - VEND, { title: 'KMP: Never Step Back', line: `pattern ${M}  ·  text ${N}  ·  ${KC} comparisons, not ${NC}`,
    ink: C.paper, dim: 'rgba(241,238,230,0.72)', accent: C.accent, scrim: C.bgRGB, a: 0.88 });
  vReset();
}

// The player asks for a frame on every display refresh; at 30 fps on a 60 Hz screen every other call
// asks for the frame already on the canvas, which is then left as it is (same frame, same pixels).
const shown = { L: -1, V: -1 };
window.__motion = {
  title: 'KMP: Never Step Back',
  description: `The ${M}-letter pattern ${P} builds its failure table (${FAIL.join(' ')}) in ${BUILD.length} comparisons, then both searches scan a ${N}-letter text: naive slides one letter and starts over, stepping its text pointer back ${NAI.back} letters in ${NC} comparisons, while KMP slides by the table, never steps back and ${SAME ? 'finds the same' : 'finds'} ${word(MK.length)} matches (at ${MK.join(', ')}${OVERLAP ? ', two of them overlapping' : ''}) in ${KC}.`,
  fps: FPS, width: W, height: H, frames: FRAMES,
  poster: Math.round(TLL.r0 + TLL.tick * KC * 0.62),
  gifStart: Math.floor(TLL.r0 / FPS),
  seek(i) { const f = Math.max(0, Math.min(FRAMES - 1, Math.floor(i))); if (f !== shown.L) { shown.L = f; draw(f); } },
  audio: () => renderAudio(TLL, FRAMES),
  variants: {
    vertical: {
      width: VW, height: VH, frames: VFR, canvas: vcv,
      poster: Math.round(TLV.r0 + TLV.tick * KC * 0.62), gifStart: Math.floor(TLV.r0 / FPS),
      seek(i) { const v = Math.max(0, Math.min(VFR - 1, Math.floor(i))); if (v !== shown.V) { shown.V = v; vSeek(vDraw, v, VFR); } },
      audio: () => renderAudio(TLV, VFR),
    },
  },
};


/* ==========================================================================
   PLAYER — identical in every piece; keep as is.
   Autoplays and loops, starts sound on the first click, ?frame=N pauses on a
   frame, ?variant=vertical plays the vertical cut (if the piece has one).
   When the renderer sets window.__MOTION_RENDER__ it stays out of the way.
   ========================================================================== */
(function player() {
  const btn = document.getElementById('sound'), q = new URLSearchParams(location.search);
  let M = window.__motion;
  const V = !window.__MOTION_RENDER__ && M.variants && M.variants[q.get('variant')];
  if (V) {                                                // show the variant's own canvas instead
    M = Object.assign({}, M, V);
    V.canvas.style.cssText = `width:min(100vw,calc(100vh*${V.width}/${V.height}));height:auto;aspect-ratio:${V.width}/${V.height}`;
    document.querySelector('canvas').replaceWith(V.canvas);
  }
  const dur = M.frames / M.fps;
  if (window.__MOTION_RENDER__) { btn.hidden = true; M.seek(0); return; }
  if (q.has('frame')) { btn.hidden = true; M.seek(+q.get('frame') || 0); return; }
  let t0 = performance.now(), ac = null, src = null, buf = null, paused = false, pausedAt = 0;
  const clock = () => ac && src ? (ac.currentTime - t0) : (performance.now() - t0) / 1000;
  function loop() {
    if (!paused) M.seek(Math.floor(((clock() % dur) + dur) % dur * M.fps));
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  btn.addEventListener('click', async () => {
    if (src) { src.stop(); src = null; btn.textContent = 'Click for sound'; t0 = performance.now(); return; }
    btn.textContent = 'Loading sound…';
    ac = ac || new AudioContext({ sampleRate: 48000 });
    buf = buf || await M.audio();
    await ac.resume();
    src = ac.createBufferSource(); src.buffer = buf; src.loop = true; src.connect(ac.destination);
    t0 = ac.currentTime + 0.05; src.start(t0);        // picture restarts from frame 0 in sync with the sound
    btn.textContent = 'Sound on — click to mute';
  });
  addEventListener('keydown', e => {
    if (e.code !== 'Space') return;
    e.preventDefault(); paused = !paused;
    if (ac) paused ? ac.suspend() : ac.resume();
    if (!ac) { if (paused) pausedAt = performance.now(); else t0 += performance.now() - pausedAt; }
  });
})();
</script>
