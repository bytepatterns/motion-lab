<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Same Start, Different Fate — motion-lab</title>
<style>
  /* Player chrome. The piece itself lives entirely in the canvas. */
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; font: 500 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; }
  canvas { display: block; width: min(100vw, calc(100vh * 16 / 9)); height: auto; aspect-ratio: 16 / 9; }
  #sound { position: fixed; left: 16px; bottom: 16px; padding: 8px 14px; border: 1px solid rgba(255,255,255,.35); border-radius: 999px;
           background: rgba(0,0,0,.55); color: #fff; font: inherit; cursor: pointer; }
  #sound[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080" aria-label="Three double pendulums released 0.001 radians apart move together, then split apart after about twelve seconds"></canvas>
<button id="sound" type="button">Click for sound</button>
<script>
'use strict';
/* ==========================================================================
   PIECE — three double pendulums, starting angles 0.001 rad apart.
   Integrated once at load with fixed-step RK4 (40 steps per frame), so every
   frame is a lookup: seek(i) is pure in i. The split around t = 12 s is not
   scripted; it is what the equations do with these starting angles.
   ========================================================================== */
const W = 1920, H = 1080, FPS = 30, FRAMES = 720;          // 24 s
const cv = document.getElementById('stage');
let ctx = cv.getContext('2d', { willReadFrequently: true });     // CPU raster; the vertical cut points it at its own canvas
const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
const MONO = 'ui-monospace, "Cascadia Code", Consolas, Menlo, monospace';

// ---- helpers -------------------------------------------------------------
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (f, a, b) => clamp((f - a) / (b - a));           // 0..1 progress of frame f through [a, b]
const E = {
  inCubic: t => t * t * t,
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inOutCubic: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outExpo: t => t === 1 ? 1 : 1 - Math.pow(2, -10 * t),
  inExpo: t => t === 0 ? 0 : Math.pow(2, 10 * t - 10),
  inOutExpo: t => t === 0 ? 0 : t === 1 ? 1 : t < .5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2,
  outBack: t => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2),
};

// ---- palette: one colour per pendulum + neutrals --------------------------
const C = { bg: '#0D0F14', ink: '#EEEBE4', dim: '#858A94', faint: '#232833' };
const COLS = [[255, 107, 91], [46, 196, 182], [255, 194, 71]];          // coral, teal, amber
const col = (q, a) => `rgba(${COLS[q][0]},${COLS[q][1]},${COLS[q][2]},${a})`;

// ---- physics ----------------------------------------------------------------
const G = 9.81, L1 = 1, L2 = 1, M1 = 1, M2 = 1;
const START = [1.700, 1.650];                     // theta1, theta2 (rad, from straight down)
const DELTA = 0.001;                               // pendulum q starts at theta1 + q * DELTA
const SUB = 40, TRAIL_SUB = 4;                     // RK4 steps per frame; trail samples per frame
function deriv(s) {
  const a1 = s[0], a2 = s[1], w1 = s[2], w2 = s[3], d = a2 - a1, cd = Math.cos(d), sd = Math.sin(d);
  const den1 = (M1 + M2) * L1 - M2 * L1 * cd * cd, den2 = (L2 / L1) * den1;
  return [w1, w2,
    (M2 * L1 * w1 * w1 * sd * cd + M2 * G * Math.sin(a2) * cd + M2 * L2 * w2 * w2 * sd - (M1 + M2) * G * Math.sin(a1)) / den1,
    (-M2 * L2 * w2 * w2 * sd * cd + (M1 + M2) * (G * Math.sin(a1) * cd - L1 * w1 * w1 * sd - G * Math.sin(a2))) / den2];
}
function rk4(s, h) {
  const k1 = deriv(s);
  const k2 = deriv([s[0] + h / 2 * k1[0], s[1] + h / 2 * k1[1], s[2] + h / 2 * k1[2], s[3] + h / 2 * k1[3]]);
  const k3 = deriv([s[0] + h / 2 * k2[0], s[1] + h / 2 * k2[1], s[2] + h / 2 * k2[2], s[3] + h / 2 * k2[3]]);
  const k4 = deriv([s[0] + h * k3[0], s[1] + h * k3[1], s[2] + h * k3[2], s[3] + h * k3[3]]);
  return s.map((v, i) => v + h / 6 * (k1[i] + 2 * k2[i] + 2 * k3[i] + k4[i]));
}
const tipOf = s => [L1 * Math.sin(s[0]) + L2 * Math.sin(s[1]), L1 * Math.cos(s[0]) + L2 * Math.cos(s[1])];
const speedOf = s => Math.hypot(L1 * s[2] * Math.cos(s[0]) + L2 * s[3] * Math.cos(s[1]), L1 * s[2] * Math.sin(s[0]) + L2 * s[3] * Math.sin(s[1]));

// integrate once: per-frame states, trail samples, separation, speed
const SIM = (() => {
  const h = 1 / (FPS * SUB), n = FRAMES;
  const st = [0, 1, 2].map(q => [START[0] + q * DELTA, START[1], 0, 0]);
  const frame = [], trail = [[], [], []], gap = [], speed = [[], [], []];
  for (let f = 0; f < n; f++) {
    frame.push(st.map(s => s.slice()));
    const tp = st.map(tipOf);
    gap.push([Math.hypot(tp[1][0] - tp[0][0], tp[1][1] - tp[0][1]), Math.hypot(tp[2][0] - tp[0][0], tp[2][1] - tp[0][1])]);
    st.forEach((s, q) => speed[q].push(speedOf(s)));
    for (let k = 0; k < SUB; k++) {
      if (k % (SUB / TRAIL_SUB) === 0) st.forEach((s, q) => trail[q].push(tipOf(s)));
      for (let q = 0; q < 3; q++) st[q] = rk4(st[q], h);
    }
  }
  // first frame where the tips are visibly apart (0.3 of an arm length)
  let split = gap.findIndex(g => Math.max(g[0], g[1]) > 0.3);
  if (split < 0) split = Math.round(n * 0.55);
  return { frame, trail, gap, speed, split };
})();

// ---- layout ------------------------------------------------------------------
const PX = 1270, PY = 450, ARM = 196;               // pivot and arm length in px
const toPx = (x, y) => [PX + x * ARM, PY + y * ARM];
const SPLIT = SIM.split;                            // frame (about 12.2 s)

// ---- text helpers ---------------------------------------------------------
function font(size, weight = 500, fam = FONT) { ctx.font = `${weight} ${size}px ${fam}`; }
function reset() {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.shadowBlur = 0; ctx.filter = 'none'; ctx.letterSpacing = '0px'; ctx.setLineDash([]);
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.lineCap = 'butt'; ctx.lineJoin = 'miter';
}
function wrap(txt, maxW) {
  const words = txt.split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur);
  return lines;
}

// ---- pendulums ------------------------------------------------------------
function pendulums(f) {
  const t = f / FPS;
  const trailSec = lerp(1.4, 3.6, E.inOutCubic(prog(t, 12, 20)));
  const nT = Math.round(trailSec * FPS * TRAIL_SUB), end = f * TRAIL_SUB;   // trail sample index of this frame
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'butt'; ctx.lineJoin = 'round';             // butt caps: bucket joins must not double up
  // trails: short segments, older = thinner and fainter
  for (let q = 0; q < 3; q++) {
    const tr = SIM.trail[q];
    const s0 = Math.max(0, end - nT), BUCKETS = 16;
    for (let b = 0; b < BUCKETS; b++) {                 // oldest -> newest, one path per fade step
      const i0 = Math.max(s0, Math.round(end - nT * (1 - b / BUCKETS))), i1 = Math.round(end - nT * (1 - (b + 1) / BUCKETS));
      if (i1 <= i0) continue;
      const a = Math.pow((b + 0.5) / BUCKETS, 1.6);
      ctx.strokeStyle = col(q, 0.75 * a); ctx.lineWidth = 1 + 4 * a;
      ctx.beginPath();
      for (let i = i0; i <= i1; i++) { const [x, y] = toPx(tr[i][0], tr[i][1]); i === i0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
      ctx.stroke();
    }
  }
  // arms and bobs
  ctx.lineCap = 'round';
  for (let q = 0; q < 3; q++) {
    const s = SIM.frame[f][q];
    const [x1, y1] = toPx(L1 * Math.sin(s[0]), L1 * Math.cos(s[0]));
    const [x2, y2] = toPx(L1 * Math.sin(s[0]) + L2 * Math.sin(s[1]), L1 * Math.cos(s[0]) + L2 * Math.cos(s[1]));
    ctx.strokeStyle = col(q, 0.7); ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(PX, PY); ctx.lineTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.fillStyle = col(q, 0.85);
    ctx.beginPath(); ctx.arc(x1, y1, 12, 0, Math.PI * 2); ctx.fill();
    const glow = ctx.createRadialGradient(x2, y2, 10, x2, y2, 46);
    glow.addColorStop(0, col(q, 0.35)); glow.addColorStop(1, col(q, 0));
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(x2, y2, 46, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = col(q, 0.85);
    ctx.beginPath(); ctx.arc(x2, y2, 17, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
  // pivot
  ctx.save();
  ctx.fillStyle = C.ink;
  ctx.beginPath(); ctx.arc(PX, PY, 8, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = C.bg; ctx.beginPath(); ctx.arc(PX, PY, 3, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// ---- divergence plot: log of the gap between tips -------------------------
const PLOT = { x: 120, y: 800, w: 620, h: 170, lo: -5, hi: 0.5 };
function plot(f) {
  const a = E.outExpo(prog(f, 18, 44));
  if (a <= 0) return;
  const { x, y, w, h, lo, hi } = PLOT;
  const X = i => x + (i / (FRAMES - 1)) * w, Y = g => y + h - (clamp((Math.log10(Math.max(g, 1e-9)) - lo) / (hi - lo))) * h;
  ctx.save(); ctx.globalAlpha = a;
  ctx.strokeStyle = C.faint; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + h); ctx.lineTo(x + w, y + h); ctx.stroke();
  font(22, 500, MONO); ctx.fillStyle = C.dim; ctx.textAlign = 'left';
  // decade ticks
  for (const d of [-4, -2, 0]) {
    const yy = Y(Math.pow(10, d));
    ctx.fillStyle = C.faint; ctx.fillRect(x - 8, yy - 1, 8, 2);
  }
  ctx.fillStyle = C.dim;
  ctx.fillText('gap between tips, log scale', x + 14, y - 14);
  ctx.textAlign = 'right'; ctx.fillText('24 s', x + w, y + h + 32);
  ctx.textAlign = 'left'; ctx.fillText('0', x, y + h + 32);
  // split marker
  const sx = X(SPLIT);
  ctx.setLineDash([4, 6]); ctx.strokeStyle = 'rgba(238,235,228,0.35)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(sx, y); ctx.lineTo(sx, y + h); ctx.stroke(); ctx.setLineDash([]);
  ctx.textAlign = 'center'; ctx.fillStyle = C.dim; ctx.fillText((SPLIT / FPS).toFixed(1) + ' s', sx, y + h + 32);
  // curves: pendulum 2 and 3 measured against pendulum 1
  ctx.lineWidth = 3; ctx.lineJoin = 'round';
  for (const q of [0, 1]) {
    ctx.strokeStyle = col(q + 1, 0.95);
    ctx.beginPath();
    for (let i = 0; i <= f; i++) { const px = X(i), py = Y(SIM.gap[i][q]); i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
    ctx.stroke();
  }
  ctx.restore();
}

// ---- words ------------------------------------------------------------------
const NARR = [
  { t: 0.4, txt: 'Three double pendulums, released 0.001 rad apart.' },
  { t: 4.5, txt: 'For now, they move as one.' },
  { t: 10.4, txt: 'Then the tiny gap explodes.' },
  { t: 15.0, txt: 'Chaos: the future depends on the smallest detail of the start.' },
];
function words(f) {
  const t = f / FPS, splitT = SPLIT / FPS;
  ctx.save();
  // header
  font(22, 600); ctx.letterSpacing = '4px'; ctx.fillStyle = C.dim;
  ctx.fillText('DOUBLE PENDULUM · RK4', 120, 104);
  ctx.textAlign = 'right'; ctx.fillText('BYTEPATTERNS', 1800, 104);
  ctx.textAlign = 'left'; ctx.letterSpacing = '-2px';
  // title: "Same start," is there from frame 0; "different fate." lands at the split
  ctx.globalAlpha = 1;
  const s1 = E.outExpo(prog(f, 0, 18));
  font(104, 800); ctx.fillStyle = C.ink;
  ctx.fillText('Same start,', 116, 262 + (1 - s1) * 30);
  const d = E.outExpo(clamp((t - splitT + 0.1) / 0.8));
  if (d > 0) {
    ctx.globalAlpha = d;
    ctx.fillText('different fate.', 116, 380 + (1 - d) * 40);
  }
  ctx.globalAlpha = 1;
  // three underlines: one line until the split, then they fan out
  const fan = E.outBack(clamp((t - splitT) / 0.9));
  ctx.globalCompositeOperation = 'lighter';
  for (let q = 0; q < 3; q++) {
    ctx.fillStyle = col(q, 0.95);
    const yy = (d > 0 ? 406 + (1 - d) * 40 : 288 + (1 - s1) * 30) + (q - 1) * 14 * clamp(fan, 0, 1.3);
    const len = 180 + (d > 0 ? q * 70 * fan : 0);
    ctx.fillRect(122, yy, len, 5);
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.letterSpacing = '0px';
  // narrative (wraps inside the left column)
  font(38, 500);
  for (let k = 0; k < NARR.length; k++) {
    const n = NARR[k], end = k + 1 < NARR.length ? NARR[k + 1].t : 99;
    if (t < n.t || t > end + 0.4) continue;
    const i = E.outExpo(clamp((t - n.t) / 0.6)), o = E.inCubic(clamp((t - end + 0.35) / 0.35));
    ctx.globalAlpha = i * (1 - o); ctx.fillStyle = k === 3 ? C.ink : C.dim;
    wrap(n.txt, 640).forEach((ln, j) => ctx.fillText(ln, 120, 506 + j * 50 + (1 - i) * 20));
  }
  // starting angles + clock
  ctx.globalAlpha = E.outExpo(prog(f, 8, 30));
  font(28, 500, MONO);
  for (let q = 0; q < 3; q++) {
    const yy = 650 + q * 42;
    ctx.fillStyle = col(q, 1); ctx.beginPath(); ctx.arc(130, yy - 9, 8, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = C.ink;
    ctx.fillText(`θ₁ = ${(START[0] + q * DELTA).toFixed(3)} rad`, 152, yy);
  }
  ctx.fillStyle = C.dim; ctx.textAlign = 'right';
  ctx.fillText(`t = ${t.toFixed(1).padStart(4, '0')} s`, 740, 650);
  ctx.restore();
}

// ---- picture -------------------------------------------------------------
function draw(f) {
  reset();
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  // faint reach circle for scale
  ctx.strokeStyle = C.faint; ctx.lineWidth = 2; ctx.setLineDash([2, 10]);
  ctx.beginPath(); ctx.arc(PX, PY, 2 * ARM, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
  pendulums(f);
  plot(f);
  words(f);
  reset();
}

// ---- sound: each pendulum sings its tip speed (faster = higher) -----------
function makeIR(ac, seconds, decay, seed) {
  const r = mulberry32(seed), len = Math.floor(seconds * ac.sampleRate), b = ac.createBuffer(2, len, ac.sampleRate);
  for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (r() * 2 - 1) * Math.pow(1 - i / len, decay); }
  return b;
}
async function renderAudio() {
  const SR = 48000, dur = FRAMES / FPS;
  const ac = new OfflineAudioContext(2, Math.round(SR * dur), SR);
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -12; comp.knee.value = 8; comp.ratio.value = 3; comp.attack.value = 0.01; comp.release.value = 0.25;
  const master = ac.createGain();
  master.gain.setValueAtTime(0, 0); master.gain.linearRampToValueAtTime(1.05, 0.08);
  master.gain.setValueAtTime(1.05, dur - 0.5); master.gain.linearRampToValueAtTime(0, dur - 0.01);
  comp.connect(master).connect(ac.destination);
  const verb = ac.createConvolver(); verb.buffer = makeIR(ac, 3.2, 3.5, 21);
  const wet = ac.createGain(); wet.gain.value = 0.35; verb.connect(wet).connect(comp);
  const bus = ac.createGain(); bus.connect(comp); bus.connect(verb);

  // three voices; pitch and level follow each tip's speed, frame by frame
  const N = FRAMES;
  for (let q = 0; q < 3; q++) {
    const fr = new Float32Array(N), gn = new Float32Array(N);
    for (let i = 0; i < N; i++) {
      const v = SIM.speed[q][i];
      fr[i] = 196 * Math.pow(2, clamp(v / 4.2, 0, 2));             // G3 .. two octaves up
      gn[i] = 0.035 + 0.05 * clamp(v / 6);
    }
    const pan = ac.createStereoPanner(); pan.pan.value = [-0.6, 0, 0.6][q];
    const g = ac.createGain(); g.gain.setValueAtTime(0, 0); g.gain.setValueCurveAtTime(gn, 0, dur);
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400;
    g.connect(lp).connect(pan).connect(bus);
    for (const [mul, lvl, type] of [[1, 1, 'sine'], [2, 0.22, 'sine'], [1, 0.12, 'triangle']]) {
      const o = ac.createOscillator(), og = ac.createGain();
      o.type = type; og.gain.value = lvl;
      const curve = mul === 1 ? fr : fr.map(x => x * mul);
      o.frequency.setValueAtTime(curve[0], 0); o.frequency.setValueCurveAtTime(curve, 0, dur);
      o.connect(og).connect(g); o.start(0); o.stop(dur);
    }
  }
  // low drone, and a soft swell into the split
  const drone = (freq, vol) => {
    const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0, 0); g.gain.linearRampToValueAtTime(vol, 2); g.gain.setValueAtTime(vol, dur - 1.2); g.gain.linearRampToValueAtTime(0, dur);
    o.connect(g).connect(bus); o.start(0); o.stop(dur);
  };
  drone(49, 0.07); drone(73.4, 0.035);
  const sT = SPLIT / FPS;
  {
    const len = 2.4, nb = ac.createBuffer(1, Math.floor(len * SR), SR), r = mulberry32(5), d = nb.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = r() * 2 - 1;
    const src = ac.createBufferSource(), bp = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = nb; bp.type = 'bandpass'; bp.Q.value = 0.9;
    bp.frequency.setValueAtTime(300, sT - 1.8); bp.frequency.exponentialRampToValueAtTime(2400, sT);
    g.gain.setValueAtTime(0, sT - 1.8); g.gain.linearRampToValueAtTime(0.06, sT - 0.05); g.gain.linearRampToValueAtTime(0, sT + 0.6);
    src.connect(bp).connect(g).connect(bus); src.start(sT - 1.8);
    const o = ac.createOscillator(), og = ac.createGain();
    o.frequency.setValueAtTime(90, sT); o.frequency.exponentialRampToValueAtTime(40, sT + 0.8);
    og.gain.setValueAtTime(0, sT); og.gain.linearRampToValueAtTime(0.22, sT + 0.01); og.gain.exponentialRampToValueAtTime(0.001, sT + 1.4);
    o.connect(og).connect(bus); o.start(sT); o.stop(sT + 1.5);
  }
  return ac.startRendering();
}

/* ==========================================================================
   VERTICAL CUT — shared block, identical in every piece.
   1080x1920 for Reels, Shorts and TikTok (__motion.variants.vertical). The
   piece's own scene code is re-used and recomposed for a phone: everything a
   viewer must read stays inside the area no platform covers (x 60..900,
   y 230..1400); outside it there is only dimmed texture.
   ========================================================================== */
const VW = 1080, VH = 1920, SAFE = { x: 60, y: 230, w: 840, h: 1170, r: 900, b: 1400 };
const vcv = document.createElement('canvas'); vcv.width = VW; vcv.height = VH;
const vx = vcv.getContext('2d', { willReadFrequently: true });   // CPU raster: identical pixels on every redraw
const VL = 96, VR = 864;                                          // text column inside the safe area

function vReset() {
  vx.setTransform(1, 0, 0, 1, 0, 0); vx.globalAlpha = 1; vx.globalCompositeOperation = 'source-over';
  vx.filter = 'none'; vx.shadowBlur = 0; vx.shadowColor = 'transparent'; vx.letterSpacing = '0px'; vx.setLineDash([]);
  vx.textAlign = 'left'; vx.textBaseline = 'alphabetic'; vx.lineCap = 'butt'; vx.lineJoin = 'miter';
}
/** Canvas text on the vertical frame; `max` shrinks the size until the line fits. */
function vText(str, x, y, { size = 40, weight = 700, color = '#FFFFFF', align = 'left', spacing = 0, alpha = 1, fam = FONT, max = 0 } = {}) {
  if (alpha <= 0.002 || !str) return size;
  vx.font = `${weight} ${size}px ${fam}`; vx.letterSpacing = spacing + 'px';
  if (max) { const w = vx.measureText(str).width; if (w > max) { size = size * max / w; vx.font = `${weight} ${size}px ${fam}`; } }
  vx.textAlign = align; vx.textBaseline = 'alphabetic';
  const a0 = vx.globalAlpha; vx.globalAlpha = a0 * alpha; vx.fillStyle = color;
  vx.fillText(str, x + (align === 'center' ? spacing / 2 : align === 'right' ? spacing : 0), y);   // tracking is added after the last glyph too
  vx.globalAlpha = a0; vx.letterSpacing = '0px';
  return size;
}
/** Word-wraps with the given font; returns the lines. */
function vWrap(str, maxW, size, weight = 700, fam = FONT) {
  vx.font = `${weight} ${size}px ${fam}`; vx.letterSpacing = '0px';
  const words = str.split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (vx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur);
  return lines;
}
/** Fade envelope with a small rise: [alpha, dy]. */
function vEnv(v, a, b, fin = 8, fout = 8) {
  const i = E.outCubic(prog(v, a, a + fin)), o = 1 - E.inCubic(prog(v, b - fout, b));
  return [Math.min(i, o), (1 - i) * 22 - (1 - o) * 10];
}
/** Which segment of a cut list a vertical frame is in: segs = [{ at, src, len }] in frames. */
function vSeg(segs, v) {
  let k = 0; while (k < segs.length - 1 && v >= segs[k + 1].at) k++;
  const s = segs[k];
  return { k, s, local: v - s.at, src: s.src + (v - s.at) };
}
/** Dims everything outside the safe area to a quiet texture (brightness x 0.2), with a soft inner edge. */
function vShade(rgb, a = 0.8, feather = 40) {
  vx.save(); vx.setTransform(1, 0, 0, 1, 0, 0); vx.globalAlpha = 1; vx.globalCompositeOperation = 'source-over';
  vx.fillStyle = `rgba(${rgb},${a})`;
  vx.beginPath(); vx.rect(0, 0, VW, VH); vx.rect(SAFE.x, SAFE.y, SAFE.w, SAFE.h); vx.fill('evenodd');
  const strip = (x0, y0, x1, y1, rx, ry, rw, rh) => {
    const g = vx.createLinearGradient(x0, y0, x1, y1);
    g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`);
    vx.fillStyle = g; vx.fillRect(rx, ry, rw, rh);
  };
  strip(SAFE.x, 0, SAFE.x + feather, 0, SAFE.x, SAFE.y, feather, SAFE.h);
  strip(SAFE.r, 0, SAFE.r - feather, 0, SAFE.r - feather, SAFE.y, feather, SAFE.h);
  strip(0, SAFE.y, 0, SAFE.y + feather, SAFE.x, SAFE.y, SAFE.w, feather);
  strip(0, SAFE.b, 0, SAFE.b - feather, SAFE.x, SAFE.b - feather, SAFE.w, feather);
  vx.restore();
}
/** Series tag at the top of the safe area, e.g. MADE IN CODE · 04. */
function vTag(label, color, alpha = 1) {
  vText('MADE IN CODE', VL, 292, { size: 28, weight: 800, color, spacing: 5, alpha });
  vx.font = `800 28px ${FONT}`; vx.letterSpacing = '5px';
  const w = vx.measureText('MADE IN CODE').width; vx.letterSpacing = '0px';
  vText('·  ' + label, VL + w + 14, 292, { size: 28, weight: 600, color: 'rgba(255,255,255,0.72)', spacing: 3, alpha, max: VR - VL - w - 14 });
}
/** Big hook lines, left-aligned from y0; visible from frame 0, settles in a few frames. */
function vHook(v, lines, y0, { size = 84, lh = 1.08, color = '#FFFFFF', accent = null, weight = 800, spacing = -1.5, alpha = 1 } = {}) {
  const k = E.outExpo(prog(v, -6, 12));
  lines.forEach((ln, i) => {
    const kk = E.outExpo(prog(v, -12 + i * 2, 8 + i * 2));
    vText(ln, VL, y0 + i * size * lh + (1 - kk) * 30, { size, weight, spacing, color: accent && i === lines.length - 1 ? accent : color, alpha: alpha * Math.max(0.25, kk), max: VR - VL });
  });
  return k;
}
/** Closing card, the last 60 frames: piece title, "drawn in code · bytepatterns.com". l = frames into the card. */
function vEndCard(l, { title, line = '', ink = '#FFFFFF', dim = 'rgba(255,255,255,0.66)', accent = '#FFFFFF', scrim = '0,0,0', a = 0.84 }) {
  const k = E.outCubic(prog(l, 0, 12));
  vx.save(); vx.setTransform(1, 0, 0, 1, 0, 0);
  vx.fillStyle = `rgba(${scrim},${a * k})`; vx.fillRect(0, 0, VW, VH);
  vx.restore();
  const t1 = E.outExpo(prog(l, 3, 19)), t2 = E.outExpo(prog(l, 11, 27)), t3 = E.outExpo(prog(l, 19, 35));
  vx.fillStyle = accent; vx.globalAlpha = t1; vx.fillRect(VL, 742, 88 * t1, 7); vx.globalAlpha = 1;
  const size = vText(title, VL, 850 + (1 - t1) * 40, { size: 92, weight: 800, color: ink, spacing: -2, alpha: t1, max: VR - VL });
  const y2 = 850 + Math.max(size, 60) * 0.25 + 70;
  vx.font = `600 44px ${FONT}`;
  const lead = 'drawn in code  ·  ', lw = vx.measureText(lead).width;
  vText(lead, VL, y2 + (1 - t2) * 24, { size: 44, weight: 600, color: dim, alpha: t2 });
  vText('bytepatterns.com', VL + lw, y2 + (1 - t2) * 24, { size: 44, weight: 800, color: accent, alpha: t2 });
  if (line) vText(line, VL, y2 + 72 + (1 - t3) * 18, { size: 32, weight: 500, color: dim, alpha: t3, max: VR - VL });
}
/** Seeks a cut. The first frame a page draws is drawn twice: the very first read of a
 *  GPU-backed source canvas can come out a shade different from every later one. */
let vWarm = false;
function vSeek(draw, i, frames) {
  const f = Math.max(0, Math.min(frames - 1, Math.floor(i)));
  if (!vWarm) { vWarm = true; draw(f); }
  draw(f);
}
/** The soundtrack of a cut: the piece's own audio() spliced to the same segments as the picture. */
async function vAudio(segs, frames, { xf = 0.025, fadeOut = 0.6, extra = null } = {}) {
  const src = await renderAudio();
  const SR = 48000, dur = frames / FPS, ac = new OfflineAudioContext(2, Math.round(SR * dur), SR);
  const out = ac.createGain(); out.connect(ac.destination);
  out.gain.setValueAtTime(1, 0); out.gain.setValueAtTime(1, dur - fadeOut); out.gain.linearRampToValueAtTime(0, dur - 0.01);
  segs.forEach((s, k) => {
    const at = s.at / FPS, off = s.src / FPS, d = s.len / FPS;
    const pre = k === 0 ? 0 : Math.min(xf, off), post = k === segs.length - 1 ? 0 : xf;
    const b = ac.createBufferSource(), g = ac.createGain(); b.buffer = src;
    g.gain.setValueAtTime(pre ? 0 : 1, at - pre);
    if (pre) g.gain.linearRampToValueAtTime(1, at + pre);
    if (post) { g.gain.setValueAtTime(1, at + d - post); g.gain.linearRampToValueAtTime(0, at + d + post); }
    b.connect(g).connect(out); b.start(at - pre, off - pre, d + pre + post);
  });
  if (extra) extra(ac, out);
  const buf = await ac.startRendering();
  let peak = 0; for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) peak = Math.max(peak, Math.abs(d[i])); }
  if (peak > 0.9) for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] *= 0.9 / peak; }
  return buf;
}
/** A soft three-partial bell, for the closing card. */
function vChime(ac, dest, at, freq, vol = 0.08) {
  for (const [mul, v, dec] of [[1, 1, 1.8], [2.01, 0.35, 0.8], [3.02, 0.12, 0.4]]) {
    const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.value = freq * mul;
    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol * v, at + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, at + dec);
    o.connect(g).connect(dest); o.start(at); o.stop(at + dec + 0.05);
  }
}

/* VERTICAL CUT — this piece */
// One continuous take of the first 17.5 s (the split happens at ~12.2 s), the
// pendulums centred under the title, the divergence plot across the bottom.
const VFR = 525, VEND = VFR - 60;
const VP = { x: 480, y: 895, s: 0.8 };                 // pivot on the phone, scale
const VNARR = [
  [-10, 130, 'Three pendulums, 0.001 rad apart.'],
  [135, 305, 'For now, they move as one.'],
  [312, 392, 'Then the tiny gap explodes.'],
  [398, 480, 'Chaos: the smallest detail decides.'],
];
const VPLOT = { x: VL, y: 1316, w: VR - VL, h: 72, lo: -5, hi: 0.5 };
function vPlot(f) {
  const { x, y, w, h, lo, hi } = VPLOT;
  const X = i => x + (i / (VFR - 1)) * w, Y = g => y + h - clamp((Math.log10(Math.max(g, 1e-9)) - lo) / (hi - lo)) * h;
  const a = E.outExpo(prog(f, 6, 30));
  vx.save(); vx.globalAlpha = a;
  vx.strokeStyle = C.faint; vx.lineWidth = 2;
  vx.beginPath(); vx.moveTo(x, y); vx.lineTo(x, y + h); vx.lineTo(x + w, y + h); vx.stroke();
  vText('gap between tips, log scale', x, y - 16, { size: 28, weight: 500, color: C.dim, fam: MONO, alpha: a });
  const sx = X(SPLIT);
  vx.setLineDash([4, 6]); vx.strokeStyle = 'rgba(238,235,228,0.35)';
  vx.beginPath(); vx.moveTo(sx, y); vx.lineTo(sx, y + h); vx.stroke(); vx.setLineDash([]);
  if (f >= SPLIT) vText((SPLIT / FPS).toFixed(1) + ' s', sx + 10, y + 26, { size: 28, weight: 600, color: C.ink, fam: MONO, alpha: a * E.outCubic(prog(f, SPLIT, SPLIT + 10)) });
  vx.lineWidth = 3; vx.lineJoin = 'round';
  for (const q of [0, 1]) {
    vx.strokeStyle = col(q + 1, 0.95); vx.beginPath();
    for (let i = 0; i <= f; i++) { const px = X(i), py = Y(SIM.gap[i][q]); i ? vx.lineTo(px, py) : vx.moveTo(px, py); }
    vx.stroke();
  }
  vx.restore();
}
function vDraw(v) {
  const f = Math.min(FRAMES - 1, v), t = f / FPS, splitT = SPLIT / FPS;
  vReset();
  vx.fillStyle = C.bg; vx.fillRect(0, 0, VW, VH);
  // the pendulums, drawn by the landscape code through a scale and a move
  const main = ctx; ctx = vx;
  try {
    vx.save();
    vx.beginPath(); vx.rect(SAFE.x, 540, SAFE.w, 700); vx.clip();
    vx.setTransform(VP.s, 0, 0, VP.s, VP.x - VP.s * PX, VP.y - VP.s * PY);
    vx.strokeStyle = C.faint; vx.lineWidth = 2; vx.setLineDash([2, 10]);
    vx.beginPath(); vx.arc(PX, PY, 2 * ARM, 0, Math.PI * 2); vx.stroke(); vx.setLineDash([]);
    pendulums(f);
    vx.restore();
  } finally { ctx = main; }
  vReset();
  vShade('13,15,20');
  vTag('DOUBLE PENDULUM', col(0, 1));
  // title: "Same start," from frame 0, "different fate." at the split, three underlines that fan out
  const s1 = E.outExpo(prog(v, -8, 10));
  vText('Same start,', VL, 384 + (1 - s1) * 30, { size: 88, weight: 800, color: C.ink, spacing: -2 });
  const d = E.outExpo(clamp((t - splitT + 0.1) / 0.8));
  if (d > 0) vText('different fate.', VL, 478 + (1 - d) * 40, { size: 88, weight: 800, color: C.ink, spacing: -2, alpha: d });
  const fan = E.outBack(clamp((t - splitT) / 0.9));
  vx.globalCompositeOperation = 'lighter';
  for (let q = 0; q < 3; q++) {
    vx.fillStyle = col(q, 0.95);
    const yy = (d > 0 ? 500 + (1 - d) * 40 : 406 + (1 - s1) * 30) + (q - 1) * 14 * clamp(fan, 0, 1.3);
    vx.fillRect(VL + 4, yy, 180 + (d > 0 ? q * 70 * fan : 0), 5);
  }
  vx.globalCompositeOperation = 'source-over';
  // starting angles and the clock
  const ra = E.outExpo(prog(v, -10, 8));
  let x = VL;
  for (let q = 0; q < 3; q++) {
    vx.globalAlpha = ra; vx.fillStyle = col(q, 1); vx.beginPath(); vx.arc(x + 9, 566, 9, 0, Math.PI * 2); vx.fill(); vx.globalAlpha = 1;
    const s = (START[0] + q * DELTA).toFixed(3);
    vText(s, x + 26, 576, { size: 30, weight: 600, color: C.ink, fam: MONO, alpha: ra });
    vx.font = `600 30px ${MONO}`; x += 26 + vx.measureText(s).width + 26;
  }
  vText('rad', x - 10, 576, { size: 30, weight: 500, color: C.dim, fam: MONO, alpha: ra });
  vText(`t = ${t.toFixed(1).padStart(4, '0')} s`, VR, 576, { size: 30, weight: 500, color: C.dim, fam: MONO, align: 'right', alpha: ra });
  // narrative line + divergence plot along the bottom
  for (const [a, b, str] of VNARR) {
    const [al, dy] = vEnv(v, a, b);
    if (al > 0) vText(str, VL, 1262 + dy, { size: 42, weight: 600, color: a >= 398 ? C.ink : C.dim, alpha: al, max: VR - VL });
  }
  vPlot(f);
  if (v >= VEND) vEndCard(v - VEND, { title: 'Same Start, Different Fate', line: 'three double pendulums, released 0.001 rad apart',
    ink: C.ink, dim: 'rgba(238,235,228,0.66)', accent: col(0, 1), scrim: '13,15,20' });
  vReset();
}

window.__motion = {
  title: 'Same Start, Different Fate',
  description: 'Three double pendulums released 0.001 rad apart move as one, then split apart around the twelve-second mark.',
  fps: FPS, width: W, height: H, frames: FRAMES,
  poster: 560,
  gifStart: 10,
  seek(i) { draw(Math.max(0, Math.min(FRAMES - 1, Math.floor(i)))); },
  audio: renderAudio,
  variants: {
    vertical: {
      width: VW, height: VH, frames: VFR, canvas: vcv,
      poster: 420, gifStart: 9,
      seek(i) { vSeek(vDraw, i, VFR); },
      audio: () => vAudio([{ at: 0, src: 0, len: VFR }], VFR, { fadeOut: 1.2 }),
    },
  },
};

/* ==========================================================================
   PLAYER — identical in every piece; keep as is.
   Autoplays and loops, starts sound on the first click, ?frame=N pauses on a
   frame, ?variant=vertical plays the vertical cut (if the piece has one).
   When the renderer sets window.__MOTION_RENDER__ it stays out of the way.
   ========================================================================== */
(function player() {
  const btn = document.getElementById('sound'), q = new URLSearchParams(location.search);
  let M = window.__motion;
  const V = !window.__MOTION_RENDER__ && M.variants && M.variants[q.get('variant')];
  if (V) {                                                // show the variant's own canvas instead
    M = Object.assign({}, M, V);
    V.canvas.style.cssText = `width:min(100vw,calc(100vh*${V.width}/${V.height}));height:auto;aspect-ratio:${V.width}/${V.height}`;
    document.querySelector('canvas').replaceWith(V.canvas);
  }
  const dur = M.frames / M.fps;
  if (window.__MOTION_RENDER__) { btn.hidden = true; M.seek(0); return; }
  if (q.has('frame')) { btn.hidden = true; M.seek(+q.get('frame') || 0); return; }
  let t0 = performance.now(), ac = null, src = null, buf = null, paused = false, pausedAt = 0;
  const clock = () => ac && src ? (ac.currentTime - t0) : (performance.now() - t0) / 1000;
  function loop() {
    if (!paused) M.seek(Math.floor(((clock() % dur) + dur) % dur * M.fps));
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  btn.addEventListener('click', async () => {
    if (src) { src.stop(); src = null; btn.textContent = 'Click for sound'; t0 = performance.now(); return; }
    btn.textContent = 'Loading sound…';
    ac = ac || new AudioContext({ sampleRate: 48000 });
    buf = buf || await M.audio();
    await ac.resume();
    src = ac.createBufferSource(); src.buffer = buf; src.loop = true; src.connect(ac.destination);
    t0 = ac.currentTime + 0.05; src.start(t0);        // picture restarts from frame 0 in sync with the sound
    btn.textContent = 'Sound on — click to mute';
  });
  addEventListener('keydown', e => {
    if (e.code !== 'Space') return;
    e.preventDefault(); paused = !paused;
    if (ac) paused ? ac.suspend() : ac.resume();
    if (!ac) { if (paused) pausedAt = performance.now(); else t0 += performance.now() - pausedAt; }
  });
})();
</script>
