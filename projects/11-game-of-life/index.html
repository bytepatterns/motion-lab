<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="teambytepatterns">
<meta name="description" content="Conway's Game of Life: four rules, a random soup, the R-pentomino step by step, and a Gosper gun firing a glider every 30 generations.">
<title>The Glider Gun — motion-lab</title>
<style>
  /* Player chrome. The piece itself lives entirely in the canvas. */
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; font: 500 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; }
  canvas { display: block; width: min(100vw, calc(100vh * 16 / 9)); height: auto; aspect-ratio: 16 / 9; }
  #sound { position: fixed; left: 16px; bottom: 16px; padding: 8px 14px; border: 1px solid rgba(255,255,255,.35); border-radius: 999px;
           background: rgba(0,0,0,.55); color: #fff; font: inherit; cursor: pointer; }
  #sound[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080" aria-label="Conway's Game of Life: a random soup, the four rules on the R-pentomino and a Gosper glider gun"></canvas>
<button id="sound" type="button">Click for sound</button>
<script>
'use strict';
/* ==========================================================================
   PIECE — The Glider Gun.
   Conway's Game of Life (B3/S23), run for real on three worlds:
     1. a random soup, one generation every two frames;
     2. the R-pentomino, one generation at a time, every cell labelled with
        its neighbour count and the rule that decides its fate;
     3. Bill Gosper's glider gun (1970), one generation per frame, while the
        camera pulls back to show the stream of gliders it fires.
   Determinism: a world stores every generation it has computed; generation g
   is a pure function of g (the start pattern is fixed), so frames can be
   drawn in any order. The soundtrack reads the same birth counts.
   ========================================================================== */
const W = 1920, H = 1080, FPS = 30, FRAMES = 720;          // 24 s
const cv = document.getElementById('stage');
const ctx = cv.getContext('2d');
const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
const MONO = 'ui-monospace, "Cascadia Code", Consolas, Menlo, monospace';

// ---- helpers -------------------------------------------------------------
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (f, a, b) => clamp((f - a) / (b - a));
const E = {
  inCubic: t => t * t * t,
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inOutCubic: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outExpo: t => t === 1 ? 1 : 1 - Math.pow(2, -10 * t),
  inExpo: t => t === 0 ? 0 : Math.pow(2, 10 * t - 10),
  inOutExpo: t => t === 0 ? 0 : t === 1 ? 1 : t < .5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2,
  outBack: t => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2),
};

// ---- palette -------------------------------------------------------------
const C = {
  bg: '#0C0E13', panel: '#12151C', line: 'rgba(237,233,225,0.08)',
  paper: '#EDE9E1', dim: 'rgba(237,233,225,0.58)', faint: 'rgba(237,233,225,0.30)',
  amber: '#F5B83D', red: '#FF6B5B', teal: '#58C4B8', tealRGB: '88,196,184',
};

// ---- timeline (frames) ---------------------------------------------------
const T = {
  soup: 0, rules: 150, gun: 366, end: 636,
  step: 27, hold: 18,                     // rules: one generation every 27 frames, the last 9 animate the change
};

// ---- Life ------------------------------------------------------------------
// A world keeps one Uint8Array per generation: 0 = alive, 1..254 = generations
// since the cell died (254 = long dead), 255 = never alive. Cells beyond the
// edge are dead (no wrap); every world is big enough that nothing reaches it.
function makeWorld(w, h, cells) {
  const g0 = new Uint8Array(w * h).fill(255);
  for (const [x, y] of cells) g0[y * w + x] = 0;
  const gens = [g0], births = [0], deaths = [0], alive = [cells.length];
  function step() {
    const cur = gens[gens.length - 1], nx = new Uint8Array(w * h);
    let b = 0, d = 0, al = 0;
    for (let y = 0; y < h; y++) {
      const y0 = y > 0 ? -1 : 0, y1 = y < h - 1 ? 1 : 0;
      for (let x = 0; x < w; x++) {
        const x0 = x > 0 ? -1 : 0, x1 = x < w - 1 ? 1 : 0;
        let n = 0;
        for (let dy = y0; dy <= y1; dy++) { const row = (y + dy) * w + x; for (let dx = x0; dx <= x1; dx++) if (cur[row + dx] === 0) n++; }
        const i = y * w + x, was = cur[i] === 0;
        if (was) n--;
        if (n === 3 || (was && n === 2)) { nx[i] = 0; al++; if (!was) b++; }
        else { nx[i] = was ? 1 : cur[i] >= 254 ? cur[i] : cur[i] + 1; if (was) d++; }
      }
    }
    gens.push(nx); births.push(b); deaths.push(d); alive.push(al);
  }
  const world = {
    w, h, gens, births, deaths, alive,
    at(g) { while (gens.length <= g) step(); return gens[g]; },
    nbrs(g, x, y) {                                        // live neighbours of (x, y) in generation g
      const a = world.at(g); let n = 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        if (!dx && !dy) continue; const xx = x + dx, yy = y + dy;
        if (xx >= 0 && yy >= 0 && xx < w && yy < h && a[yy * w + xx] === 0) n++;
      }
      return n;
    },
  };
  return world;
}
function parseRLE(s, ox = 0, oy = 0) {
  const cells = []; let x = 0, y = 0, num = '';
  for (const ch of s) {
    if (ch >= '0' && ch <= '9') { num += ch; continue; }
    const k = num ? +num : 1; num = '';
    if (ch === 'b') x += k;
    else if (ch === 'o') { for (let j = 0; j < k; j++) cells.push([ox + x + j, oy + y]); x += k; }
    else if (ch === '$') { y += k; x = 0; }
    else if (ch === '!') break;
  }
  return cells;
}

// world 1: a soup, denser in a few soft blobs
const SOUP = (() => {
  const w = 168, h = 96, r = mulberry32(0x11FE), cells = [];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const blob = 0.5 + 0.5 * Math.sin(x * 0.083 + 1.7 * Math.sin(y * 0.061)) * Math.cos(y * 0.097 - 0.8 * Math.cos(x * 0.052));
    if (r() < 0.07 + 0.36 * blob * blob) cells.push([x, y]);
  }
  return makeWorld(w, h, cells);
})();
const SOUP_VIEW = { cx: 84, cy: 48, cs: 12 };
const soupGen = f => Math.floor(f / 2);

// world 2: the R-pentomino, in the middle of a 32 x 26 board
const RP = { w: 32, h: 26, ox: 15, oy: 11 };
const RPENT = makeWorld(RP.w, RP.h, parseRLE('b2o$2o$bo!', RP.ox, RP.oy));
const RULES_STEPS = 8;

// world 3: the Gosper glider gun
const GUN = { x: 20, y: 16, w: 36, h: 9 };
const GUNW = makeWorld(260, 170, parseRLE(
  '24bo$22bobo$12b2o6b2o12b2o$11bo3bo4b2o12b2o$2o8bo5bo3b2o$2o8bo3bob2o4bobo$10bo5bo7bo$11bo3bo$12b2o!', GUN.x, GUN.y));
const gunGen = f => Math.max(0, f - T.gun);
function glidersOut(g) {                                   // cells beyond the gun's own box, five per glider
  const a = GUNW.at(g), w = GUNW.w; let n = 0;
  for (let y = 0; y < GUNW.h; y++) for (let x = 0; x < w; x++) {
    if (a[y * w + x] !== 0) continue;
    if (x > GUN.x + GUN.w + 1 || y > GUN.y + GUN.h + 1) n++;
  }
  return Math.floor(n / 5);
}

// ---- drawing ---------------------------------------------------------------
function text(g, str, x, y, { size = 40, weight = 600, color = C.paper, alpha = 1, spacing = 0, align = 'left', fam = FONT, base = 'alphabetic' } = {}) {
  if (alpha <= 0.002 || !str) return 0;
  g.font = `${weight} ${size}px ${fam}`; g.letterSpacing = spacing + 'px';
  g.textAlign = align; g.textBaseline = base;
  const a0 = g.globalAlpha; g.globalAlpha = a0 * alpha; g.fillStyle = color;
  g.fillText(str, x, y);
  const w = g.measureText(str).width;
  g.globalAlpha = a0; g.letterSpacing = '0px';
  return w;
}
const env = (f, a, b, fin = 12, fout = 10) => {
  const i = E.outCubic(prog(f, a, a + fin)), o = 1 - E.inCubic(prog(f, b - fout, b));
  return [Math.min(i, o), (1 - i) * 24 - (1 - o) * 10];
};

/** Draws generation gen of a world into rect r, sim point (cx, cy) at the rect centre, cs px per cell. */
function drawWorld(g, world, gen, r, cx, cy, cs, { ghost = 6, alpha = 1, fresh = true } = {}) {
  const a = world.at(gen), prev = gen > 0 ? world.at(gen - 1) : a, w = world.w;
  const x0 = Math.max(0, Math.floor(cx - r.w / 2 / cs) - 1), x1 = Math.min(w - 1, Math.ceil(cx + r.w / 2 / cs) + 1);
  const y0 = Math.max(0, Math.floor(cy - r.h / 2 / cs) - 1), y1 = Math.min(world.h - 1, Math.ceil(cy + r.h / 2 / cs) + 1);
  const px = x => r.x + r.w / 2 + (x - cx) * cs, py = y => r.y + r.h / 2 + (y - cy) * cs;
  const gap = Math.max(1, cs * 0.12), s = cs - gap;
  g.save(); g.beginPath(); g.rect(r.x, r.y, r.w, r.h); g.clip();
  g.globalAlpha = alpha;
  // ghosts of cells that died in the last few generations
  for (let age = ghost; age >= 1; age--) {
    g.beginPath(); let any = false;
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) if (a[y * w + x] === age) { g.rect(px(x) + gap / 2, py(y) + gap / 2, s, s); any = true; }
    if (any) { g.fillStyle = `rgba(${C.tealRGB},${(0.36 * Math.pow(1 - (age - 1) / ghost, 1.6)).toFixed(3)})`; g.fill(); }
  }
  // the living: newborns in amber, the rest in paper
  for (const born of [false, true]) {
    g.beginPath();
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      const i = y * w + x; if (a[i] !== 0) continue;
      if (fresh && (prev[i] !== 0) !== born) continue;
      if (!fresh && born) continue;
      g.rect(px(x) + gap / 2, py(y) + gap / 2, s, s);
    }
    g.fillStyle = born ? C.amber : C.paper; g.fill();
  }
  g.restore();
}

function header(g, f, alpha = 1) {
  text(g, 'CELLULAR AUTOMATON  ·  B3/S23', 120, 104, { size: 26, weight: 600, color: C.dim, spacing: 5, alpha });
  text(g, 'BYTEPATTERNS', 1800, 104, { size: 26, weight: 600, color: C.dim, spacing: 5, align: 'right', alpha });
}

// --- scene 1: the soup ------------------------------------------------------
function sceneSoup(g, f, r, alpha = 1) {
  drawWorld(g, SOUP, soupGen(f), r, SOUP_VIEW.cx, SOUP_VIEW.cy, SOUP_VIEW.cs, { alpha });
}

// --- scene 2: the rules on the R-pentomino ---------------------------------
const RULES = [
  { key: 'lonely', lhs: 'fewer than 2', rhs: 'dies', color: C.red },
  { key: 'stay', lhs: '2 or 3', rhs: 'lives on', color: C.paper },
  { key: 'crowd', lhs: 'more than 3', rhs: 'dies', color: C.red },
  { key: 'born', lhs: 'exactly 3', rhs: 'is born', color: C.amber },
];
function fateOf(world, gen, x, y) {
  const a = world.at(gen), alive = a[y * world.w + x] === 0, n = world.nbrs(gen, x, y);
  if (alive) return { n, alive, fate: n < 2 ? 'lonely' : n > 3 ? 'crowd' : 'stay' };
  return { n, alive, fate: n === 3 ? 'born' : null };
}
function rulesState(l) {                                   // l: frames into the rules scene
  const s = clamp(Math.floor(l / T.step), 0, RULES_STEPS - 1), p = l - s * T.step;
  return { s, p, k: E.inOutCubic(prog(p, T.hold, T.step)) };
}
function tallies(gen) {
  const t = { lonely: 0, stay: 0, crowd: 0, born: 0 };
  for (let y = 0; y < RP.h; y++) for (let x = 0; x < RP.w; x++) { const q = fateOf(RPENT, gen, x, y); if (q.fate) t[q.fate]++; }
  return t;
}
/** The board: every cell with its neighbour count; the fate animates in the last frames of a step. */
function drawRulesBoard(g, l, r, cs, cx = RP.ox + 1.5, cy = RP.oy + 1.5, alpha = 1) {
  const { s, k } = rulesState(l), w = RPENT.w;
  const px = x => r.x + r.w / 2 + (x - cx) * cs, py = y => r.y + r.h / 2 + (y - cy) * cs;
  g.save(); g.beginPath(); g.rect(r.x, r.y, r.w, r.h); g.clip(); g.globalAlpha = alpha;
  // board lines
  g.strokeStyle = C.line; g.lineWidth = 1.5; g.beginPath();
  for (let x = 0; x <= w; x++) { const X = Math.round(px(x)) + 0.5; g.moveTo(X, r.y); g.lineTo(X, r.y + r.h); }
  for (let y = 0; y <= RP.h; y++) { const Y = Math.round(py(y)) + 0.5; g.moveTo(r.x, Y); g.lineTo(r.x + r.w, Y); }
  g.stroke();
  const pad = cs * 0.08;
  for (let y = 0; y < RP.h; y++) for (let x = 0; x < w; x++) {
    const X = px(x), Y = py(y); if (X < r.x - cs || X > r.x + r.w || Y < r.y - cs || Y > r.y + r.h) continue;
    const q = fateOf(RPENT, s, x, y);
    if (!q.alive && q.n === 0) continue;
    const cxp = X + cs / 2, cyp = Y + cs / 2;
    if (q.alive) {
      const dying = q.fate !== 'stay', sc = dying ? 1 - k : 1;
      if (sc > 0.01) {
        const sz = (cs - 2 * pad) * sc;
        g.fillStyle = dying && k > 0 ? mixHex(C.paper, C.red, Math.min(1, k * 2.2)) : C.paper;
        g.beginPath(); g.roundRect(cxp - sz / 2, cyp - sz / 2, sz, sz, cs * 0.12); g.fill();
      }
      if (k < 0.5) {
        text(g, String(q.n), cxp, cyp + 2, { size: cs * 0.42, weight: 800, fam: MONO, align: 'center', base: 'middle',
          color: dying ? '#B3261E' : '#1B1E26', alpha: 1 - k * 2 });
      }
      if (dying && k < 0.6) {                               // a red ring: this one goes
        g.strokeStyle = C.red; g.lineWidth = 3; g.globalAlpha = alpha * (1 - k / 0.6);
        g.beginPath(); g.roundRect(X + pad * 0.3, Y + pad * 0.3, cs - pad * 0.6, cs - pad * 0.6, cs * 0.16); g.stroke(); g.globalAlpha = alpha;
      }
    } else {
      if (q.fate === 'born') {
        const sz = (cs - 2 * pad) * E.outBack(k);
        g.strokeStyle = C.amber; g.lineWidth = 3;
        g.beginPath(); g.roundRect(X + pad * 0.3, Y + pad * 0.3, cs - pad * 0.6, cs - pad * 0.6, cs * 0.16); g.stroke();
        if (k > 0) { g.fillStyle = C.amber; g.beginPath(); g.roundRect(cxp - sz / 2, cyp - sz / 2, sz, sz, cs * 0.12); g.fill(); }
        if (k < 0.5) text(g, '3', cxp, cyp + 2, { size: cs * 0.42, weight: 800, fam: MONO, align: 'center', base: 'middle', color: k > 0.2 ? '#1B1E26' : C.amber, alpha: 1 - k * 2 });
      } else if (k < 0.5) {
        text(g, String(q.n), cxp, cyp + 2, { size: cs * 0.36, weight: 600, fam: MONO, align: 'center', base: 'middle', color: C.faint, alpha: 1 - k * 2 });
      }
    }
  }
  g.restore();
}
function mixHex(a, b, t) {
  const pa = [1, 3, 5].map(i => parseInt(a.slice(i, i + 2), 16)), pb = [1, 3, 5].map(i => parseInt(b.slice(i, i + 2), 16));
  return `rgb(${pa.map((v, i) => Math.round(lerp(v, pb[i], t))).join(',')})`;
}
/** Rule list: a mini 3x3 icon, the rule, and how many cells it decides this generation. */
function drawRuleList(g, l, x, y, { rowH = 104, size = 40, alpha = 1, counts = true } = {}) {
  const { s } = rulesState(l), t = tallies(s);
  RULES.forEach((ru, i) => {
    const [al, dy] = env(l, 8 + i * 8, 1e9, 14, 1);
    const Y = y + i * rowH + dy, active = t[ru.key] > 0;
    const a = alpha * al * (active ? 1 : 0.45);
    if (a <= 0.002) return;
    // icon: a dot for the cell, ticks for its neighbours
    g.globalAlpha = a;
    g.fillStyle = ru.color; g.beginPath(); g.roundRect(x, Y - size * 0.72, size * 0.62, size * 0.62, 5); g.fill();
    g.globalAlpha = 1;
    const w1 = text(g, ru.lhs, x + size * 0.95, Y - size * 0.18, { size, weight: 700, color: C.paper, alpha: a });
    const w2 = text(g, ' neighbours → ', x + size * 0.95 + w1, Y - size * 0.18, { size: size * 0.8, weight: 500, color: C.dim, alpha: a });
    text(g, ru.rhs, x + size * 0.95 + w1 + w2, Y - size * 0.18, { size, weight: 800, color: ru.color, alpha: a });
    if (counts) text(g, '× ' + t[ru.key], x + size * 0.95, Y + size * 0.62, { size: size * 0.62, weight: 600, fam: MONO, color: active ? ru.color : C.faint, alpha: a * 0.9 });
  });
}

// --- scene 3: the gun -----------------------------------------------------------
function gunCam(l) {                                        // l: frames into the gun scene
  const k = E.inOutCubic(prog(l, 36, 200));
  return { cx: lerp(GUN.x + GUN.w / 2, 48.6, k), cy: lerp(GUN.y + GUN.h / 2, 27.4, k), cs: lerp(34, 14, k) };
}

// ---- landscape picture -------------------------------------------------------
const FULL = { x: 0, y: 0, w: W, h: H };
function draw(f) {
  if (ctx.reset) ctx.reset();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none'; ctx.shadowBlur = 0;
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);

  // 1. soup with the title
  if (f < T.rules + 10) {
    const out = 1 - E.inCubic(prog(f, T.rules - 8, T.rules + 10));
    sceneSoup(ctx, f, FULL, out);
    const g = ctx.createLinearGradient(0, 0, 1100, 0);
    g.addColorStop(0, 'rgba(12,14,19,0.92)'); g.addColorStop(0.55, 'rgba(12,14,19,0.78)'); g.addColorStop(1, 'rgba(12,14,19,0)');
    ctx.globalAlpha = out; ctx.fillStyle = g; ctx.fillRect(0, 0, 1100, H); ctx.globalAlpha = 1;
    const k = E.outExpo(prog(f, -6, 16)), o = 1 - E.inCubic(prog(f, 124, 146));
    ctx.save(); ctx.translate(116, 520); ctx.scale(lerp(1.06, 1, k), lerp(1.06, 1, k));
    text(ctx, 'Game of Life', 0, 0, { size: 150, weight: 850, color: C.paper, spacing: -3, alpha: Math.min(k, o) });
    ctx.restore();
    const [a2, d2] = env(f, 12, 146, 16, 18);
    text(ctx, 'Four rules. No player.', 120, 618 + d2, { size: 56, weight: 600, color: C.amber, alpha: a2 });
    const [a3, d3] = env(f, 30, 146, 16, 18);
    text(ctx, `generation ${soupGen(f)}   ·   ${SOUP.alive[soupGen(f)] ?? SOUP.alive[SOUP.gens.length - 1]} cells alive`, 122, 700 + d3,
      { size: 30, weight: 500, fam: MONO, color: C.dim, alpha: a3 });
    header(ctx, f, 1);
  }

  // 2. the rules
  if (f >= T.rules - 4 && f < T.gun + 10) {
    const l = f - T.rules;
    const inA = E.outCubic(prog(f, T.rules - 4, T.rules + 14)), outA = 1 - E.inCubic(prog(f, T.gun - 10, T.gun + 10)), a = Math.min(inA, outA);
    header(ctx, f, a);
    const [h1, hd] = env(l, 0, 1e9, 14, 1);
    text(ctx, 'Four rules', 116, 250 + hd, { size: 96, weight: 850, color: C.paper, spacing: -2, alpha: a * h1 });
    text(ctx, 'count the eight neighbours of every cell, then:', 120, 318 + hd, { size: 32, weight: 500, color: C.dim, alpha: a * h1 });
    drawRuleList(ctx, l, 120, 450, { alpha: a });
    const { s } = rulesState(l);
    text(ctx, `R-pentomino  ·  generation ${s} → ${s + 1}`, 120, 900, { size: 30, weight: 600, fam: MONO, color: C.dim, alpha: a * E.outCubic(prog(l, 20, 34)) });
    text(ctx, '5 cells that take 1,103 generations to settle', 120, 948, { size: 30, weight: 500, color: C.faint, alpha: a * E.outCubic(prog(l, 40, 54)) });
    const board = { x: 884, y: 170, w: 936, h: 780 };
    const zoom = lerp(0.82, 1, E.outCubic(prog(l, -4, 24)));
    drawRulesBoard(ctx, l, board, 66 * zoom, RP.ox + 1.5, RP.oy + 1.5, a);
  }

  // 3. the gun, and the end card over it
  if (f >= T.gun - 10) {
    const l = f - T.gun, gen = gunGen(f), cam = gunCam(l);
    const inA = E.outCubic(prog(f, T.gun - 10, T.gun + 12));
    const endK = E.inOutCubic(prog(f, T.end, T.end + 22));
    drawWorld(ctx, GUNW, gen, FULL, cam.cx, cam.cy, cam.cs, { alpha: inA * (1 - 0.72 * endK), ghost: 3 });
    const ta = inA * (1 - endK);
    header(ctx, f, ta);
    const [t1, d1] = env(l, 8, 1e9, 16, 1);
    text(ctx, 'The glider gun', 116, 236 + d1, { size: 96, weight: 850, color: C.paper, spacing: -2, alpha: ta * t1 });
    const [t2, d2] = env(l, 22, 1e9, 16, 1);
    text(ctx, 'Bill Gosper, 1970: a pattern that never stops growing', 120, 300 + d2, { size: 34, weight: 500, color: C.dim, alpha: ta * t2 });
    const [t3, d3] = env(l, 120, 1e9, 16, 1);
    text(ctx, 'a new glider every 30 generations, forever', 120, 900 + d3, { size: 40, weight: 700, color: C.amber, alpha: ta * t3 });
    const [t4] = env(l, 60, 1e9, 16, 1);
    text(ctx, `generation ${String(gen).padStart(3, ' ')}   ·   gliders ${glidersOut(gen)}   ·   ${GUNW.alive[gen]} cells alive`, 122, 960,
      { size: 30, weight: 500, fam: MONO, color: C.dim, alpha: ta * t4 });
    if (endK > 0) {
      const k1 = E.outCubic(prog(f, T.end + 6, T.end + 30)), k2 = E.outCubic(prog(f, T.end + 18, T.end + 42)), k3 = E.outCubic(prog(f, T.end + 30, T.end + 54));
      text(ctx, 'Game of Life', W / 2, 500 + (1 - k1) * 30, { size: 136, weight: 850, color: C.paper, spacing: -3, align: 'center', alpha: k1 });
      text(ctx, 'four rules  ·  John Conway, 1970', W / 2, 580 + (1 - k2) * 20, { size: 44, weight: 500, color: C.amber, align: 'center', alpha: k2 });

// ---- sound: every generation ticks, every glider plucks ------------------------
async function renderAudio() {
  const SR = 48000, dur = FRAMES / FPS, LEN = Math.round(SR * dur);
  const ac = new OfflineAudioContext(2, LEN, SR);
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -16; comp.ratio.value = 3; comp.attack.value = 0.005; comp.release.value = 0.2;
  const master = ac.createGain(); master.gain.value = 0.9;
  master.connect(comp).connect(ac.destination);
  master.gain.setValueAtTime(0.9, dur - 0.8); master.gain.linearRampToValueAtTime(0.0001, dur - 0.02);
  const rnd = mulberry32(0xA0D11);
  const ir = ac.createBuffer(2, SR * 2.4, SR);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let k = 0; k < d.length; k++) d[k] = (rnd() * 2 - 1) * Math.pow(1 - k / d.length, 3); }
  const verb = ac.createConvolver(); verb.buffer = ir; const vg = ac.createGain(); vg.gain.value = 0.28; verb.connect(vg).connect(master);
  const noise = ac.createBuffer(1, SR, SR); { const d = noise.getChannelData(0); for (let k = 0; k < d.length; k++) d[k] = rnd() * 2 - 1; }
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  const tick = (at, freq, amp, pan, len = 0.035) => {
    const s = ac.createBufferSource(); s.buffer = noise;
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = 4;
    const g = ac.createGain(); g.gain.setValueAtTime(amp, at); g.gain.exponentialRampToValueAtTime(0.0001, at + len);
    const p = ac.createStereoPanner(); p.pan.value = pan;
    s.connect(bp).connect(g).connect(p).connect(master); s.start(at, (at * 13.7) % 0.9, len + 0.02);
  };
  const pluck = (at, m, amp, pan, dec = 0.9) => {
    for (const [mul, type, a2] of [[1, 'triangle', 1], [2, 'sine', 0.35]]) {
      const o = ac.createOscillator(); o.type = type; o.frequency.value = hz(m) * mul;
      const g = ac.createGain(); g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(amp * a2, at + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, at + dec);
      const p = ac.createStereoPanner(); p.pan.value = pan;
      o.connect(g).connect(p); p.connect(master); p.connect(verb); o.start(at); o.stop(at + dec + 0.05);
    }
  };
  const boom = (at, f0, f1, amp, len) => {
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.setValueAtTime(f0, at); o.frequency.exponentialRampToValueAtTime(f1, at + len * 0.6);
    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(amp, at + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, at + len);
    o.connect(g).connect(master); o.start(at); o.stop(at + len + 0.05);
  };
  // a low pad under everything: A minor, opening up for the gun
  const pad = [[0, T.rules, [45, 52, 57, 60]], [T.rules, T.gun, [41, 48, 57, 60, 64]], [T.gun, T.end, [45, 52, 59, 60, 64]], [T.end, FRAMES, [45, 52, 57, 61, 64, 69]]];
  for (const [fa, fb, notes] of pad) {
    const a = fa / FPS, b = fb / FPS;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = fa >= T.gun ? 1400 : 800; lp.connect(master); lp.connect(verb);
    for (const m of notes) for (const det of [-6, 5]) {
      const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = hz(m); o.detune.value = det;
      const g = ac.createGain(); g.gain.setValueAtTime(0, a); g.gain.linearRampToValueAtTime(0.022, a + (fa === 0 ? 0.05 : 0.5));
      g.gain.setValueAtTime(0.022, Math.max(a + 0.5, b - 0.4)); g.gain.linearRampToValueAtTime(0, b + 0.3);
      o.connect(g).connect(lp); o.start(a); o.stop(b + 0.35);
    }
  }
  boom(0, 110, 40, 0.6, 1.2);
  // soup: a tick per generation, louder and brighter with more births
  const g1 = soupGen(T.rules);
  SOUP.at(g1);
  let maxB = 1; for (let g = 1; g <= g1; g++) maxB = Math.max(maxB, SOUP.births[g]);
  for (let g = 1; g < g1; g++) {
    const b = SOUP.births[g] / maxB;
    tick((g * 2) / FPS, 1400 + 3200 * b, 0.05 + 0.3 * Math.sqrt(b), Math.sin(g * 1.9) * 0.55);
  }
  // rules: one step per generation — a wood tock, a pluck per birth, a thud per death
  const pent = [69, 72, 74, 76, 79, 81, 84, 86];
  for (let s = 0; s < RULES_STEPS; s++) {
    const at = (T.rules + s * T.step + T.hold) / FPS, t = tallies(s);
    tick(at, 950, 0.5, 0, 0.06);
    for (let k = 0; k < Math.min(t.born, 6); k++) pluck(at + 0.03 + k * 0.045, pent[(s + k) % pent.length], 0.12, -0.5 + k * 0.2, 0.7);
    if (t.lonely + t.crowd > 0) boom(at, 90, 55, 0.28 + 0.03 * Math.min(6, t.lonely + t.crowd), 0.35);
  }
  // gun: a soft click each generation, a pluck and a bass note for every glider it fires
  let prev = 0;
  const bass = [45, 41, 48, 43];
  for (let f = T.gun; f < FRAMES; f++) {
    const gen = gunGen(f), at = f / FPS, n = glidersOut(gen);
    if (gen % 2 === 0) tick(at, 5200, 0.035 * (f < T.end ? 1 : 1 - prog(f, T.end, FRAMES)), (gen % 4 ? 0.3 : -0.3), 0.02);
    if (n > prev) {
      const amp = f < T.end ? 1 : 0.5;
      pluck(at, pent[(n * 3) % pent.length], 0.16 * amp, clamp((n % 5) * 0.3 - 0.6, -0.7, 0.7), 1.1);
      pluck(at + 0.12, pent[(n * 3 + 2) % pent.length] + 12, 0.06 * amp, 0.4, 0.8);
      boom(at, hz(bass[n % 4]) * 2, hz(bass[n % 4]), 0.32 * amp, 0.9);
      prev = n;
    }
  }
  // end card
  [69, 73, 76, 81].forEach((m, k) => pluck((T.end + 8 + k * 6) / FPS, m, 0.1, -0.45 + k * 0.3, 1.8));

  const buf = await ac.startRendering();
  let peak = 0; for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let k = 0; k < d.length; k++) peak = Math.max(peak, Math.abs(d[k])); }
  if (peak > 0.89) for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let k = 0; k < d.length; k++) d[k] *= 0.89 / peak; }
  return buf;
}

/* ==========================================================================
   VERTICAL CUT — shared block, identical in every piece.
   1080x1920 for Reels, Shorts and TikTok (__motion.variants.vertical). The
   piece's own scene code is re-used and recomposed for a phone: everything a
   viewer must read stays inside the area no platform covers (x 60..900,
   y 230..1400); outside it there is only dimmed texture.
   ========================================================================== */
const VW = 1080, VH = 1920, SAFE = { x: 60, y: 230, w: 840, h: 1170, r: 900, b: 1400 };
const vcv = document.createElement('canvas'); vcv.width = VW; vcv.height = VH;
const vx = vcv.getContext('2d', { willReadFrequently: true });   // CPU raster: identical pixels on every redraw
const VL = 96, VR = 864;                                          // text column inside the safe area

function vReset() {
  vx.setTransform(1, 0, 0, 1, 0, 0); vx.globalAlpha = 1; vx.globalCompositeOperation = 'source-over';
  vx.filter = 'none'; vx.shadowBlur = 0; vx.shadowColor = 'transparent'; vx.letterSpacing = '0px'; vx.setLineDash([]);
  vx.textAlign = 'left'; vx.textBaseline = 'alphabetic'; vx.lineCap = 'butt'; vx.lineJoin = 'miter';
}
/** Canvas text on the vertical frame; `max` shrinks the size until the line fits. */
function vText(str, x, y, { size = 40, weight = 700, color = '#FFFFFF', align = 'left', spacing = 0, alpha = 1, fam = FONT, max = 0 } = {}) {
  if (alpha <= 0.002 || !str) return size;
  vx.font = `${weight} ${size}px ${fam}`; vx.letterSpacing = spacing + 'px';
  if (max) { const w = vx.measureText(str).width; if (w > max) { size = size * max / w; vx.font = `${weight} ${size}px ${fam}`; } }
  vx.textAlign = align; vx.textBaseline = 'alphabetic';
  const a0 = vx.globalAlpha; vx.globalAlpha = a0 * alpha; vx.fillStyle = color;
  vx.fillText(str, x + (align === 'center' ? spacing / 2 : align === 'right' ? spacing : 0), y);   // tracking is added after the last glyph too
  vx.globalAlpha = a0; vx.letterSpacing = '0px';
  return size;
}
/** Word-wraps with the given font; returns the lines. */
function vWrap(str, maxW, size, weight = 700, fam = FONT) {
  vx.font = `${weight} ${size}px ${fam}`; vx.letterSpacing = '0px';
  const words = str.split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (vx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur);
  return lines;
}
/** Fade envelope with a small rise: [alpha, dy]. */
function vEnv(v, a, b, fin = 8, fout = 8) {
  const i = E.outCubic(prog(v, a, a + fin)), o = 1 - E.inCubic(prog(v, b - fout, b));
  return [Math.min(i, o), (1 - i) * 22 - (1 - o) * 10];
}
/** Which segment of a cut list a vertical frame is in: segs = [{ at, src, len }] in frames. */
function vSeg(segs, v) {
  let k = 0; while (k < segs.length - 1 && v >= segs[k + 1].at) k++;
  const s = segs[k];
  return { k, s, local: v - s.at, src: s.src + (v - s.at) };
}
/** Dims everything outside the safe area to a quiet texture (brightness x 0.2), with a soft inner edge. */
function vShade(rgb, a = 0.8, feather = 40) {
  vx.save(); vx.setTransform(1, 0, 0, 1, 0, 0); vx.globalAlpha = 1; vx.globalCompositeOperation = 'source-over';
  vx.fillStyle = `rgba(${rgb},${a})`;
  vx.beginPath(); vx.rect(0, 0, VW, VH); vx.rect(SAFE.x, SAFE.y, SAFE.w, SAFE.h); vx.fill('evenodd');
  const strip = (x0, y0, x1, y1, rx, ry, rw, rh) => {
    const g = vx.createLinearGradient(x0, y0, x1, y1);
    g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`);
    vx.fillStyle = g; vx.fillRect(rx, ry, rw, rh);
  };
  strip(SAFE.x, 0, SAFE.x + feather, 0, SAFE.x, SAFE.y, feather, SAFE.h);
  strip(SAFE.r, 0, SAFE.r - feather, 0, SAFE.r - feather, SAFE.y, feather, SAFE.h);
  strip(0, SAFE.y, 0, SAFE.y + feather, SAFE.x, SAFE.y, SAFE.w, feather);
  strip(0, SAFE.b, 0, SAFE.b - feather, SAFE.x, SAFE.b - feather, SAFE.w, feather);
  vx.restore();
}
/** Series tag at the top of the safe area, e.g. MADE IN CODE · 04. */
function vTag(label, color, alpha = 1) {
  vText('MADE IN CODE', VL, 292, { size: 28, weight: 800, color, spacing: 5, alpha });
  vx.font = `800 28px ${FONT}`; vx.letterSpacing = '5px';
  const w = vx.measureText('MADE IN CODE').width; vx.letterSpacing = '0px';
  vText('·  ' + label, VL + w + 14, 292, { size: 28, weight: 600, color: 'rgba(255,255,255,0.72)', spacing: 3, alpha, max: VR - VL - w - 14 });
}
/** Big hook lines, left-aligned from y0; visible from frame 0, settles in a few frames. */
function vHook(v, lines, y0, { size = 84, lh = 1.08, color = '#FFFFFF', accent = null, weight = 800, spacing = -1.5, alpha = 1 } = {}) {
  const k = E.outExpo(prog(v, -6, 12));
  lines.forEach((ln, i) => {
    const kk = E.outExpo(prog(v, -12 + i * 2, 8 + i * 2));
    vText(ln, VL, y0 + i * size * lh + (1 - kk) * 30, { size, weight, spacing, color: accent && i === lines.length - 1 ? accent : color, alpha: alpha * Math.max(0.25, kk), max: VR - VL });
  });
  return k;
}
/** Closing card, the last 60 frames: piece title, "drawn in code · bytepatterns.com". l = frames into the card. */
function vEndCard(l, { title, line = '', ink = '#FFFFFF', dim = 'rgba(255,255,255,0.66)', accent = '#FFFFFF', scrim = '0,0,0', a = 0.84 }) {
  const k = E.outCubic(prog(l, 0, 12));
  vx.save(); vx.setTransform(1, 0, 0, 1, 0, 0);
  vx.fillStyle = `rgba(${scrim},${a * k})`; vx.fillRect(0, 0, VW, VH);
  vx.restore();
  const t1 = E.outExpo(prog(l, 3, 19)), t2 = E.outExpo(prog(l, 11, 27)), t3 = E.outExpo(prog(l, 19, 35));
  vx.fillStyle = accent; vx.globalAlpha = t1; vx.fillRect(VL, 742, 88 * t1, 7); vx.globalAlpha = 1;
  const size = vText(title, VL, 850 + (1 - t1) * 40, { size: 92, weight: 800, color: ink, spacing: -2, alpha: t1, max: VR - VL });
  const y2 = 850 + Math.max(size, 60) * 0.25 + 70;
  vx.font = `600 44px ${FONT}`;
  const lead = 'drawn in code  ·  ', lw = vx.measureText(lead).width;
  vText(lead, VL, y2 + (1 - t2) * 24, { size: 44, weight: 600, color: dim, alpha: t2 });
  vText('bytepatterns.com', VL + lw, y2 + (1 - t2) * 24, { size: 44, weight: 800, color: accent, alpha: t2 });
  if (line) vText(line, VL, y2 + 72 + (1 - t3) * 18, { size: 32, weight: 500, color: dim, alpha: t3, max: VR - VL });
}
/** Seeks a cut. The first frame a page draws is drawn twice: the very first read of a
 *  GPU-backed source canvas can come out a shade different from every later one. */
let vWarm = false;
function vSeek(draw, i, frames) {
  const f = Math.max(0, Math.min(frames - 1, Math.floor(i)));
  if (!vWarm) { vWarm = true; draw(f); }
  draw(f);
}
/** The soundtrack of a cut: the piece's own audio() spliced to the same segments as the picture. */
async function vAudio(segs, frames, { xf = 0.025, fadeOut = 0.6, extra = null } = {}) {
  const src = await renderAudio();
  const SR = 48000, dur = frames / FPS, ac = new OfflineAudioContext(2, Math.round(SR * dur), SR);
  const out = ac.createGain(); out.connect(ac.destination);
  out.gain.setValueAtTime(1, 0); out.gain.setValueAtTime(1, dur - fadeOut); out.gain.linearRampToValueAtTime(0, dur - 0.01);
  segs.forEach((s, k) => {
    const at = s.at / FPS, off = s.src / FPS, d = s.len / FPS;
    const pre = k === 0 ? 0 : Math.min(xf, off), post = k === segs.length - 1 ? 0 : xf;
    const b = ac.createBufferSource(), g = ac.createGain(); b.buffer = src;
    g.gain.setValueAtTime(pre ? 0 : 1, at - pre);
    if (pre) g.gain.linearRampToValueAtTime(1, at + pre);
    if (post) { g.gain.setValueAtTime(1, at + d - post); g.gain.linearRampToValueAtTime(0, at + d + post); }
    b.connect(g).connect(out); b.start(at - pre, off - pre, d + pre + post);
  });
  if (extra) extra(ac, out);
  const buf = await ac.startRendering();
  let peak = 0; for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) peak = Math.max(peak, Math.abs(d[i])); }
  if (peak > 0.9) for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] *= 0.9 / peak; }
  return buf;
}
/** A soft three-partial bell, for the closing card. */
function vChime(ac, dest, at, freq, vol = 0.08) {
  for (const [mul, v, dec] of [[1, 1, 1.8], [2.01, 0.35, 0.8], [3.02, 0.12, 0.4]]) {
    const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.value = freq * mul;
    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol * v, at + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, at + dec);
    o.connect(g).connect(dest); o.start(at); o.stop(at + dec + 0.05);
  }
}

/* VERTICAL CUT — this piece */
// The same three worlds, drawn into a phone-sized window: the soup under the
// hook, six steps of the rules, the gun pulling back, and the closing card.
const VSEG = [
  { at: 0, src: 0, len: 66 },                              // hook: the soup
  { at: 66, src: T.rules, len: 6 * T.step },               // the rules, six generations
  { at: 228, src: T.gun, len: 252 },                        // the gun
  { at: 480, src: T.end, len: 60 },                         // closing card over the running gun
];
const VFR = 540, VEND = VFR - 60;
function vDraw(v) {
  const { k: seg, src } = vSeg(VSEG, v), f = Math.min(FRAMES - 1, src);
  vReset();
  vx.fillStyle = C.bg; vx.fillRect(0, 0, VW, VH);
  if (seg === 0) {
    // soup behind the whole safe area, hook on top
    drawWorld(vx, SOUP, soupGen(f), { x: SAFE.x, y: SAFE.y, w: SAFE.w, h: SAFE.h }, 84, 50, 14);
    const g = vx.createLinearGradient(0, SAFE.y, 0, 900);
    g.addColorStop(0, 'rgba(12,14,19,0.95)'); g.addColorStop(0.75, 'rgba(12,14,19,0.82)'); g.addColorStop(1, 'rgba(12,14,19,0)');
    vx.fillStyle = g; vx.fillRect(SAFE.x, SAFE.y, SAFE.w, 900 - SAFE.y);
    vShade('12,14,19');
    vTag('GAME OF LIFE', C.amber);
    const o = 1 - E.inCubic(prog(v, 54, 66));
    vHook(v, ['Four rules.', 'No player.'], 452, { size: 104, color: C.paper, accent: C.amber, alpha: o });
    vText(`generation ${soupGen(f)}`, VL, 640, { size: 34, weight: 500, fam: MONO, color: C.dim, alpha: o * E.outCubic(prog(v, 10, 24)) });
  } else if (seg === 1) {
    const l = f - T.rules, a = E.outCubic(prog(v, 66, 78));
    vTag('GAME OF LIFE', C.amber);
    vText('Count the 8 neighbours:', VL, 400, { size: 52, weight: 800, color: C.paper, alpha: a, max: VR - VL });
    drawRuleList(vx, l, VL, 488, { rowH: 70, size: 36, alpha: a, counts: false });
    const board = { x: SAFE.x, y: 790, w: SAFE.w, h: 560 };
    drawRulesBoard(vx, l, board, 80, RP.ox + 1.5, RP.oy + 1.5, a);
    const { s } = rulesState(l);
    vText(`R-pentomino · generation ${s} → ${s + 1}`, VL, 1384, { size: 30, weight: 600, fam: MONO, color: C.dim, alpha: a, max: VR - VL });
    vShade('12,14,19');
  } else {
    const l = f - T.gun, gen = gunGen(f);
    const win = { x: SAFE.x, y: 560, w: SAFE.w, h: 720 };
    // the landscape camera, a little tighter for the narrow window
    const kz = E.inOutCubic(prog(l, 36, 200));              // its own camera: the gun top-left, the stream down the window
    drawWorld(vx, GUNW, gen, win, lerp(GUN.x + GUN.w / 2, 52.5, kz), lerp(GUN.y + GUN.h / 2, 43.5, kz), lerp(22, 12, kz), { ghost: 3 });
    vShade('12,14,19');
    vTag('GAME OF LIFE', C.amber);
    const [a1, d1] = vEnv(v, 228, 1e9, 10, 1);
    vText('The glider gun', VL, 410 + d1, { size: 92, weight: 850, color: C.paper, spacing: -2, alpha: a1, max: VR - VL });
    vText('Bill Gosper, 1970', VL, 480 + d1, { size: 40, weight: 500, color: C.dim, alpha: a1 });
    const [a2] = vEnv(v, 262, 1e9, 10, 1);
    vText('a glider every 30 generations', VL, 1336, { size: 40, weight: 700, color: C.amber, alpha: a2, max: VR - VL });
    vText(`gen ${gen} · gliders ${glidersOut(gen)} · ${GUNW.alive[gen]} alive`, VL, 1386, { size: 28, weight: 500, fam: MONO, color: C.dim, alpha: a2, max: VR - VL });
  }
  if (v >= VEND) vEndCard(v - VEND, { title: 'Game of Life', line: 'four rules · no player · John Conway, 1970',
    ink: C.paper, dim: 'rgba(237,233,225,0.7)', accent: C.amber, scrim: '12,14,19', a: 0.8 });
  vReset();
}

    },
  },
};

/* ==========================================================================
   PLAYER — identical in every piece; keep as is.
   Autoplays and loops, starts sound on the first click, ?frame=N pauses on a
   frame, ?variant=vertical plays the vertical cut (if the piece has one).
   When the renderer sets window.__MOTION_RENDER__ it stays out of the way.
   ========================================================================== */
(function player() {
  const btn = document.getElementById('sound'), q = new URLSearchParams(location.search);
  let M = window.__motion;
  const V = !window.__MOTION_RENDER__ && M.variants && M.variants[q.get('variant')];
  if (V) {                                                // show the variant's own canvas instead
    M = Object.assign({}, M, V);
    V.canvas.style.cssText = `width:min(100vw,calc(100vh*${V.width}/${V.height}));height:auto;aspect-ratio:${V.width}/${V.height}`;
    document.querySelector('canvas').replaceWith(V.canvas);
  }
  const dur = M.frames / M.fps;
  if (window.__MOTION_RENDER__) { btn.hidden = true; M.seek(0); return; }
  if (q.has('frame')) { btn.hidden = true; M.seek(+q.get('frame') || 0); return; }
  let t0 = performance.now(), ac = null, src = null, buf = null, paused = false, pausedAt = 0;
  const clock = () => ac && src ? (ac.currentTime - t0) : (performance.now() - t0) / 1000;
  function loop() {
    if (!paused) M.seek(Math.floor(((clock() % dur) + dur) % dur * M.fps));
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  btn.addEventListener('click', async () => {
    if (src) { src.stop(); src = null; btn.textContent = 'Click for sound'; t0 = performance.now(); return; }
    btn.textContent = 'Loading sound…';
    ac = ac || new AudioContext({ sampleRate: 48000 });
    buf = buf || await M.audio();
    await ac.resume();
    src = ac.createBufferSource(); src.buffer = buf; src.loop = true; src.connect(ac.destination);
    t0 = ac.currentTime + 0.05; src.start(t0);        // picture restarts from frame 0 in sync with the sound
    btn.textContent = 'Sound on — click to mute';
  });
  addEventListener('keydown', e => {
    if (e.code !== 'Space') return;
    e.preventDefault(); paused = !paused;
    if (ac) paused ? ac.suspend() : ac.resume();
    if (!ac) { if (paused) pausedAt = performance.now(); else t0 += performance.now() - pausedAt; }
  });
})();
</script>
