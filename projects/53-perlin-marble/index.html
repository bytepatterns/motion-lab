<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="teambytepatterns">
<meta name="description" content="Straight stripes from one sine wave are bent by Perlin noise, octave after octave, into turbulent marble veins; three colour ramps turn the same field into three stones, every pixel computed each frame.">
<title>Marble from One Sine — motion-lab</title>
<style>
  /* Player chrome. The piece itself lives entirely in the canvas. */
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; font: 500 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; }
  canvas { display: block; width: min(100vw, calc(100vh * 16 / 9)); height: auto; aspect-ratio: 16 / 9; }
  #sound { position: fixed; left: 16px; bottom: 16px; padding: 8px 14px; border: 1px solid rgba(255,255,255,.35); border-radius: 999px;
           background: rgba(0,0,0,.55); color: #fff; font: inherit; cursor: pointer; }
  #sound[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080" aria-label="Soft parallel stripes drift across the frame; they begin to bend and wobble, grow finer and finer swirling veins until the whole frame looks like polished stone; the stone turns from dark blue with pale veins to white marble with grey veins and then to black marble with gold veins"></canvas>
<button id="sound" type="button">Click for sound</button>
<script>
'use strict';
/* ==========================================================================
   PIECE — Marble from One Sine.
   Ken Perlin's marble: colour = ramp( sin( x + power * turbulence(x, y) ) ).
   Without noise the sine is a set of straight stripes. Turbulence is a sum
   of octaves of Perlin gradient noise, each twice as fine and half as
   strong as the one before, taking the absolute value of each; added to
   the sine's phase it pushes the stripes sideways by different amounts in
   different places, and the stripes become veins. The colour ramp decides
   the stone.
   The noise is seeded and sampled once at load, one running sum per octave
   on a half-resolution grid; each frame evaluates the sine for every pixel
   from the frame number alone (power, octaves, phase, angle, ramp), so
   seek(i) is pure in i. The sample counts, octaves and power on screen are
   the ones used.
   ========================================================================== */
const W = 1920, H = 1080, FPS = 30;
const cv = document.getElementById('stage');
const ctx = cv.getContext('2d', { willReadFrequently: true });   // CPU raster: identical pixels on every redraw
const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
const MONO = 'ui-monospace, "Cascadia Code", Consolas, Menlo, monospace';

// ---- helpers -------------------------------------------------------------
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (f, a, b) => clamp((f - a) / (b - a));
const smooth = t => t * t * (3 - 2 * t);
const E = {
  inCubic: t => t * t * t,
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inOutCubic: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outExpo: t => t === 1 ? 1 : 1 - Math.pow(2, -10 * t),
  inExpo: t => t === 0 ? 0 : Math.pow(2, 10 * t - 10),
  inOutExpo: t => t === 0 ? 0 : t === 1 ? 1 : t < .5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2,
  outBack: t => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2),
};
/** Canvas text; `max` shrinks the size until the line fits. Returns the width drawn. */
function text(g, str, x, y, { size = 40, weight = 600, color = '#fff', alpha = 1, spacing = 0, align = 'left', fam = FONT, base = 'alphabetic', max = 0 } = {}) {
  if (alpha <= 0.002 || !str) return 0;
  g.font = `${weight} ${size}px ${fam}`; g.letterSpacing = spacing + 'px';
  if (max) { const w0 = g.measureText(str).width; if (w0 > max) { size *= max / w0; g.font = `${weight} ${size}px ${fam}`; } }
  g.textAlign = align; g.textBaseline = base;
  const a0 = g.globalAlpha; g.globalAlpha = a0 * alpha; g.fillStyle = color;
  g.fillText(str, x, y);
  const w = g.measureText(str).width;
  g.globalAlpha = a0; g.letterSpacing = '0px';
  return w;
}
const measure = (g, str, size, weight = 800, fam = FONT, spacing = 0) => { g.font = `${weight} ${size}px ${fam}`; g.letterSpacing = spacing + 'px'; const w = g.measureText(str).width; g.letterSpacing = '0px'; return w; };
const env = (f, a, b, fin = 12, fout = 10) => {
  const i = E.outCubic(prog(f, a, a + fin)), o = 1 - E.inCubic(prog(f, b - fout, b));
  return [Math.min(i, o), (1 - i) * 24 - (1 - o) * 10];
};

// ---- palette -------------------------------------------------------------
const C = { bg: '#0B0D14', bgRGB: '11,13,20', paper: '#F1EEE6', dim: 'rgba(241,238,230,0.7)', accent: '#FFC857', accentRGB: '255,200,87' };
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
// three stones: [vein, middle, body] and how thin the veins are (smaller = thinner)
const STONES = [
  { name: 'Night', ramp: ['#BDEBFF', '#27405A', '#0D1422'].map(hex), sharp: 0.42 },
  { name: 'Carrara', ramp: ['#46505F', '#B6BAC1', '#EFECE5'].map(hex), sharp: 0.36 },
  { name: 'Nero', ramp: ['#FFD27A', '#5A4526', '#0B0A0D'].map(hex), sharp: 0.3 },
];

// ---- Perlin noise with a seeded permutation -----------------------------------------------------
const PERM = (() => { const r = mulberry32(0x53A4B1E), p = new Uint8Array(512), a = [];
  for (let i = 0; i < 256; i++) a.push(i);
  for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  for (let i = 0; i < 512; i++) p[i] = a[i & 255]; return p; })();
const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
function grad(h, x, y) { switch (h & 7) { case 0: return x + y; case 1: return -x + y; case 2: return x - y; case 3: return -x - y;
  case 4: return x; case 5: return -x; case 6: return y; default: return -y; } }
function perlin(x, y) {
  const X = Math.floor(x), Y = Math.floor(y), xf = x - X, yf = y - Y, xi = X & 255, yi = Y & 255;
  const u = fade(xf), v = fade(yf), P = PERM;
  const aa = P[P[xi] + yi], ab = P[P[xi] + yi + 1], ba = P[P[xi + 1] + yi], bb = P[P[xi + 1] + yi + 1];
  return lerp(lerp(grad(aa, xf, yf), grad(ba, xf - 1, yf), u), lerp(grad(ab, xf, yf - 1), grad(bb, xf - 1, yf - 1), u), v);
}
const OCT = 5;
/** Turbulence on an nx x ny grid: SUM[o] holds the running sum of |noise| over the first o + 1 octaves. */
function buildField(G) {
  const { nx, ny } = G, N = nx * ny, s = G.cells / ny, SUM = [];
  let prev = null;
  for (let o = 0; o < OCT; o++) {
    const cur = new Float32Array(N), fq = Math.pow(2, o), amp = 1 / fq;
    for (let j = 0, k = 0; j < ny; j++) for (let i = 0; i < nx; i++, k++)
      cur[k] = (prev ? prev[k] : 0) + amp * Math.abs(perlin((G.ox + i * s) * fq, (G.oy + j * s) * fq));
    SUM.push(cur); prev = cur;
  }
  G.SUM = SUM; G.samples = N * OCT;
  G.img = new ImageData(nx, ny); G.u32 = new Uint32Array(G.img.data.buffer);
  G.cv = document.createElement('canvas'); G.cv.width = nx; G.cv.height = ny;
  G.cx = G.cv.getContext('2d', { willReadFrequently: true });
  G.colP = new Float32Array(nx);
}
const fmt = n => Math.round(n).toLocaleString('en-US');

// ---- timeline -------------------------------------------------------------------------------
// push0..push1: the power of the noise grows (one octave); oct0..oct1: octaves 1 -> 6;
// deep0..deep1: more power, and the drift eases to a stop; stone1, stone2: a new ramp wipes across
// (WIPE frames), then a glint of light passes over the polished stone; calm: the verdict; end: the card.
const WIPE = 44, GLINT = 46;
function buildTL(o) {
  const TL = Object.assign({}, o);
  TL.caps = [
    [TL.cap0, TL.push0 - 2, 'Start with stripes:|one sine wave.'],
    [TL.push0, TL.oct0 - 2, 'Push them sideways|by Perlin noise.'],
    [TL.oct0, TL.deep0 - 2, 'Add octaves: each twice as fine|and half as strong.'],
    [TL.deep0, TL.stone1 - 2, 'Turn up the power:|the veins fold over.'],
    [TL.stone1, TL.stone2 - 2, 'Swap the colour ramp:|Carrara.'],
    [TL.stone2, TL.calm - 2, 'The same field, a dark ramp:|Nero Marquina.'],
  ];
  // the drift: 0.03 rad a frame, easing to a stop over deep0..deep1 (a running sum, so the phase is smooth)
  TL.PH = new Float64Array(1200); for (let k = 1; k < TL.PH.length; k++) TL.PH[k] = TL.PH[k - 1] + 0.03 * (1 - E.inOutCubic(prog(k - 0.5, TL.deep0, TL.deep1)));
  return TL;
}
/** Everything the picture depends on at frame f. */
function params(TL, f) {
  const power = lerp(0, TL.p1, E.inOutCubic(prog(f, TL.push0, TL.push1))) + (TL.p2 - TL.p1) * E.inOutCubic(prog(f, TL.deep0, TL.deep1));
  // octaves arrive one by one, each easing in
  let oct = 1; const step = (TL.oct1 - TL.oct0) / (OCT - 1);
  for (let q = 1; q < OCT; q++) oct += E.inOutCubic(prog(f, TL.oct0 + (q - 1) * step, TL.oct0 + (q - 1) * step + step * 0.8));
  const w1 = E.inOutCubic(prog(f, TL.stone1, TL.stone1 + WIPE)), w2 = E.inOutCubic(prog(f, TL.stone2, TL.stone2 + WIPE));
  const g1 = prog(f, TL.stone1 + WIPE + 4, TL.stone1 + WIPE + 4 + GLINT), g2 = prog(f, TL.stone2 + WIPE + 4, TL.stone2 + WIPE + 4 + GLINT);
  const phase = TL.PH[Math.max(0, Math.min(TL.PH.length - 1, f))];
  const ang = 0.35 + 0.25 * E.inOutCubic(prog(f, TL.deep0, TL.deep1));
  return { power, oct, w1, w2, g1, g2, phase, ang };
}

// ---- drawing ------------------------------------------------------------------------------
const LUTN = 4096, TAU = Math.PI * 2;
function stoneRGB(S, t) {
  const v = Math.pow(t, S.sharp), P = S.ramp, s = v * 2, i = Math.min(1, Math.floor(s)), u = s - i;
  return [0, 1, 2].map(c => lerp(P[i][c], P[i + 1][c], u));
}
/** For each stone, the colour of every phase of the sine (4096 steps), packed as RGBA. */
const LUTS = STONES.map(S => Uint32Array.from({ length: LUTN }, (_, k) => {
  const c = stoneRGB(S, (1 + Math.sin(k / LUTN * TAU)) / 2);
  return (255 << 24 | (c[2] & 255) << 16 | (c[1] & 255) << 8 | (c[0] & 255)) >>> 0; }));
const SLANT = 0.35;                                               // the wipe edge leans this far per row
const edgeAt = (G, w, j) => w * (G.nx + G.ny * SLANT) - j * SLANT;
function marble(g, G, f) {
  const TL = G.TL, st = params(TL, f), { nx, ny, SUM, u32, colP } = G;
  // phase = stripes across a tilted axis + power * turbulence
  const fq = TAU * G.stripes / nx, ca = Math.cos(st.ang) * fq, sa = Math.sin(st.ang) * fq, K = LUTN / TAU;
  for (let i = 0; i < nx; i++) colP[i] = i * ca;
  const o0 = Math.min(OCT - 1, Math.floor(st.oct) - 1), fr = st.oct - 1 - o0, A = SUM[o0], B = SUM[Math.min(OCT - 1, o0 + 1)], P = st.power;
  for (let j = 0; j < ny; j++) {
    const row = j * sa + st.phase, base = j * nx;
    // left of the second edge: Nero; left of the first: Carrara; the rest: Night
    const e2 = Math.max(0, Math.min(nx, Math.round(edgeAt(G, st.w2, j)))), e1 = Math.max(e2, Math.min(nx, Math.round(edgeAt(G, st.w1, j))));
    for (const [i0, i1, LUT] of [[0, e2, LUTS[2]], [e2, e1, LUTS[1]], [e1, nx, LUTS[0]]]) {
      if (i1 <= i0) continue;
      if (fr < 1e-6) for (let i = i0, k = base + i0; i < i1; i++, k++) u32[k] = LUT[((colP[i] + row + P * A[k]) * K | 0) & (LUTN - 1)];
      else for (let i = i0, k = base + i0; i < i1; i++, k++) { const T = A[k] + fr * (B[k] - A[k]); u32[k] = LUT[((colP[i] + row + P * T) * K | 0) & (LUTN - 1)]; }
    }
  }
  G.cx.putImageData(G.img, 0, 0);
  scrims(G.cx, G, nx / G.w);                                  // darkened under the type, on the small grid (4x fewer pixels)
  g.save(); g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'low'; g.drawImage(G.cv, 0, 0, G.w, G.h); g.restore();
  const sc = G.w / nx;
  // the wipe edge: a thin bright line
  for (const w of [st.w1, st.w2]) {
    if (w <= 0 || w >= 1) continue;
    const x0 = edgeAt(G, w, 0) * sc, x1 = edgeAt(G, w, ny) * sc;
    g.save(); g.strokeStyle = `rgba(${C.accentRGB},${0.85 * Math.sin(Math.PI * w)})`; g.lineWidth = 3;
    g.beginPath(); g.moveTo(x0, 0); g.lineTo(x1, G.h); g.stroke(); g.restore();
  }
  // a glint of light across the polished stone
  for (const q of [st.g1, st.g2]) {
    if (q <= 0 || q >= 1) continue;
    const u = E.inOutCubic(q), span = G.w + G.h * SLANT + 2 * G.glint, x0 = -G.glint + u * span, x1 = x0 - G.h * SLANT;
    const gr = g.createLinearGradient(x0 - G.glint, 0, x0 + G.glint, 0), a = 0.16 * Math.sin(Math.PI * q);
    gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(0.5, `rgba(255,255,255,${a})`); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.save(); g.fillStyle = gr; g.beginPath(); g.moveTo(x0 - G.glint, 0); g.lineTo(x0 + G.glint, 0); g.lineTo(x1 + G.glint, G.h); g.lineTo(x1 - G.glint, G.h); g.closePath();
    g.fill(); g.restore();
  }
  return st;
}
function caption(g, G, f) {
  for (const [t0, t1, str] of G.TL.caps) {
    const [a, dy] = env(f, t0, t1, 12, 10); if (a <= 0) continue;
    const [p1, p2] = str.split('|');
    if (G.capTwo) {
      text(g, p1, G.capX, G.capY + dy, { size: G.cap, weight: 850, color: C.paper, spacing: -1, alpha: a, max: G.capMax });
      text(g, p2, G.capX, G.capY + G.cap * 1.14 + dy, { size: G.cap, weight: 850, color: C.accent, spacing: -1, alpha: a, max: G.capMax });
    } else {
      const w1 = text(g, p1 + ' ', G.capX, G.capY + dy, { size: G.cap, weight: 850, color: C.paper, spacing: -1, alpha: a });
      text(g, p2, G.capX + w1, G.capY + dy, { size: G.cap, weight: 850, color: C.accent, spacing: -1, alpha: a });
    }
  }
}
function readout(g, G, f, st) {
  const TL = G.TL, [a] = env(f, TL.cap0, TL.end + 10, 12, 12);
  if (a <= 0) return;
  const l1 = `sin( x + ${st.power.toFixed(2)} · turbulence )`;
  const oc = Math.round(st.oct * 10) / 10;
  const l2 = `${oc.toFixed(oc % 1 ? 1 : 0)} octave${oc === 1 ? '' : 's'}  ·  ${G.nx} × ${G.ny} samples each`;
  text(g, l1, G.foX, G.foY, { size: G.fo, weight: 800, color: C.paper, fam: MONO, alpha: a, align: G.foAlign, max: G.foMax });
  text(g, l2, G.foX2, G.foY2, { size: G.fo2, weight: 700, color: C.dim, fam: MONO, alpha: a, align: G.foAlign2, max: G.foMax });
}
function finale(g, G, f) {
  const TL = G.TL, k1 = E.outCubic(prog(f, TL.calm, TL.calm + 18)), k2 = E.outCubic(prog(f, TL.calm + 10, TL.calm + 28));
  if (k1 <= 0) return;
  const out = 1 - E.inCubic(prog(f, TL.end - 6, TL.end + 12));
  g.save(); g.fillStyle = `rgba(${C.bgRGB},${0.78 * k1 * out})`; g.fillRect(0, G.fnY - G.fn * 1.2, G.w, G.fn * 2.9); g.restore();
  text(g, `1 sine, ${OCT} octaves, no images.`, G.fnX, G.fnY, { size: G.fn, weight: 900, color: C.paper, spacing: -2, align: G.fnAlign, alpha: k1 * out, max: G.fnMax });
  text(g, `${fmt(G.samples)} noise samples, ${fmt(G.nx * G.ny)} sines a frame`, G.fnX, G.fnY + G.fn * 1.05, { size: G.fn * 0.56, weight: 850, color: C.accent, spacing: -1, align: G.fnAlign, alpha: k2 * out, max: G.fnMax });
}
function scrims(g, G, k = 1) {
  for (let [y0, y1, a] of G.scrims) {
    y0 *= k; y1 *= k;
    const gr = g.createLinearGradient(0, y0, 0, y1);
    gr.addColorStop(0, `rgba(${C.bgRGB},${a})`); gr.addColorStop(0.55, `rgba(${C.bgRGB},${a * 0.8})`); gr.addColorStop(1, `rgba(${C.bgRGB},0)`);
    g.fillStyle = gr; g.fillRect(0, Math.min(y0, y1), G.w * k, Math.abs(y1 - y0));
  }
}
function scene(g, G, f) {
  const st = marble(g, G, f);
  caption(g, G, f); readout(g, G, f, st); finale(g, G, f);
  return st;
}

// ---- landscape picture ------------------------------------------------------------------
const TLL = buildTL({ cap0: 48, push0: 112, push1: 192, p1: 2.6, oct0: 204, oct1: 344, deep0: 354, deep1: 434, p2: 7.5, stone1: 450, stone2: 562, calm: 668, end: 736 });
const FRAMES = TLL.end + 72;
const GL = { TL: TLL, w: W, h: H, nx: 960, ny: 540, cells: 2.6, ox: 0.37, oy: 0.71, stripes: 7, glint: 220,
  scrims: [[0, 330, 0.9], [H, 900, 0.92]],
  capX: 120, capY: 216, cap: 52, capTwo: false, capMax: 1680,
  fo: 34, fo2: 30, foX: 120, foY: 1004, foAlign: 'left', foX2: 1800, foY2: 1004, foAlign2: 'right', foMax: 900,
  fn: 100, fnX: W / 2, fnY: 560, fnAlign: 'center', fnMax: 1680 };
buildField(GL);
function hookL(f) {
  const o = 1 - E.inCubic(prog(f, TLL.cap0 - 14, TLL.cap0 + 4));
  if (o <= 0) return;
  const k = E.outExpo(prog(f, -8, 10)), k2 = E.outBack(prog(f, -6, 12));
  ctx.save(); ctx.fillStyle = `rgba(${C.bgRGB},${0.78 * o})`; ctx.fillRect(0, 400, W, 330); ctx.restore();
  text(ctx, 'One sine wave.', W / 2, 540 + (1 - k) * 30, { size: 108, weight: 900, color: C.paper, spacing: -3, align: 'center', alpha: o * Math.max(0.3, k) });
  text(ctx, 'Add noise. Get marble.', W / 2, 670 + (1 - clamp(k2)) * 30, { size: 108, weight: 900, color: C.accent, spacing: -3, align: 'center', alpha: o * Math.max(0.3, clamp(k2)) });
}
function draw(f) {
  if (ctx.reset) ctx.reset();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none'; ctx.shadowBlur = 0;
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  const T = TLL, endK = E.inOutCubic(prog(f, T.end, T.end + 20)), a = 1 - endK;
  scene(ctx, GL, f);
  text(ctx, 'GENERATIVE  ·  PERLIN MARBLE', 120, 104, { size: 26, weight: 600, color: C.dim, spacing: 5, alpha: a });
  text(ctx, 'BYTEPATTERNS', 1800, 104, { size: 26, weight: 600, color: C.dim, spacing: 5, align: 'right', alpha: a });
  hookL(f);
  if (endK > 0) {
    ctx.fillStyle = `rgba(${C.bgRGB},${0.86 * endK})`; ctx.fillRect(0, 0, W, H);
    const k1 = E.outCubic(prog(f, T.end + 6, T.end + 28)), k2 = E.outCubic(prog(f, T.end + 16, T.end + 38)), k3 = E.outCubic(prog(f, T.end + 26, T.end + 48));
    text(ctx, 'Marble from One Sine', W / 2, 500 + (1 - k1) * 30, { size: 140, weight: 850, color: C.paper, spacing: -3, align: 'center', alpha: k1, max: 1680 });
    text(ctx, `sin( x + ${TLL.p2.toFixed(1)} · turbulence )  ·  ${OCT} octaves of Perlin noise  ·  ${STONES.length} colour ramps`, W / 2, 580 + (1 - k2) * 20, { size: 42, weight: 500, color: C.accent, align: 'center', alpha: k2, max: 1680 });
    text(ctx, 'drawn in code  ·  bytepatterns.com', W / 2, 1000, { size: 32, weight: 600, color: C.paper, spacing: 3, align: 'center', alpha: k3 * 0.8 });
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.letterSpacing = '0px';
}

// ---- sound: a pure sine for the stripes, noise that swells with the power, a note one octave up per noise octave ----
async function renderAudio(TL = TLL, frames = FRAMES) {
  const SR = 48000, dur = frames / FPS, LEN = Math.round(SR * dur);
  const ac = new OfflineAudioContext(2, LEN, SR);
  const at = fr => fr / FPS;
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -16; comp.ratio.value = 3; comp.attack.value = 0.005; comp.release.value = 0.25;
  const master = ac.createGain(); master.gain.value = 0.9; master.connect(comp).connect(ac.destination);
  master.gain.setValueAtTime(0.9, dur - 1.0); master.gain.linearRampToValueAtTime(0.0001, dur - 0.02);
  const rnd = mulberry32(0x53A0D1);
  const ir = ac.createBuffer(2, SR * 3, SR);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let k = 0; k < d.length; k++) d[k] = (rnd() * 2 - 1) * Math.pow(1 - k / d.length, 2.4); }
  const verb = ac.createConvolver(); verb.buffer = ir; const vg = ac.createGain(); vg.gain.value = 0.4; verb.connect(vg).connect(master);
  const noise = ac.createBuffer(2, SR * 2, SR); for (let c = 0; c < 2; c++) { const d = noise.getChannelData(c); for (let k = 0; k < d.length; k++) d[k] = rnd() * 2 - 1; }
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  const pluck = (t0, m, amp, pan, dec = 0.35, type = 'triangle') => {
    const o = ac.createOscillator(), g = ac.createGain(), p = ac.createStereoPanner(); o.type = type; o.frequency.value = hz(m);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(amp, t0 + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dec);
    p.pan.value = pan; o.connect(g).connect(p); p.connect(master); p.connect(verb); o.start(t0); o.stop(t0 + dec + 0.05);
  };
  const pad = (t0, t1, notes, amp, cutoff) => {
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = cutoff; lp.Q.value = 1; lp.connect(master); lp.connect(verb);
    notes.forEach((m, i) => { for (const det of [-6, 6]) {
      const o = ac.createOscillator(), g = ac.createGain(), p = ac.createStereoPanner(); o.type = 'sawtooth'; o.frequency.value = hz(m); o.detune.value = det;
      p.pan.value = (i / Math.max(1, notes.length - 1) - 0.5) * 0.8 * Math.sign(det);
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(amp, t0 + 1.2); g.gain.setValueAtTime(amp, Math.max(t0 + 1.2, t1 - 1.0)); g.gain.exponentialRampToValueAtTime(0.0001, t1 + 0.6);
      o.connect(g).connect(p).connect(lp); o.start(t0); o.stop(t1 + 0.65); } });
  };
  // the one sine wave
  { const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.value = hz(57);
    g.gain.setValueAtTime(0.0001, 0); g.gain.exponentialRampToValueAtTime(0.07, 1.0); g.gain.setValueAtTime(0.07, at(TL.oct0)); g.gain.exponentialRampToValueAtTime(0.02, at(TL.deep0)); g.gain.exponentialRampToValueAtTime(0.0001, at(TL.end + 20));
    o.connect(g).connect(master); g.connect(verb); o.start(0); o.stop(at(TL.end + 22)); }
  // turbulence you can hear: filtered noise, louder and brighter with the power
  { const s = ac.createBufferSource(); s.buffer = noise; s.loop = true; const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.2;
    bp.frequency.setValueAtTime(300, at(TL.push0)); bp.frequency.exponentialRampToValueAtTime(900, at(TL.push1)); bp.frequency.exponentialRampToValueAtTime(2600, at(TL.deep1));
    const g = ac.createGain(); g.gain.setValueAtTime(0.0001, at(TL.push0)); g.gain.exponentialRampToValueAtTime(0.03, at(TL.push1)); g.gain.exponentialRampToValueAtTime(0.06, at(TL.deep1));
    g.gain.setValueAtTime(0.06, at(TL.calm - 30)); g.gain.exponentialRampToValueAtTime(0.0001, at(TL.end + 10));
    s.connect(bp).connect(g).connect(master); s.start(at(TL.push0)); s.stop(at(TL.end + 12)); }
  // each noise octave: a bell one musical octave higher
  const step = (TL.oct1 - TL.oct0) / (OCT - 1);
  for (let q = 0; q < OCT; q++) { const t0 = q === 0 ? at(TL.push0) : at(TL.oct0 + (q - 1) * step + step * 0.4);
    pluck(t0, 45 + 12 * Math.min(q, 4) + (q > 4 ? 7 : 0), 0.07, (q / OCT - 0.5) * 1.2, 1.8, 'sine'); pluck(t0 + 0.01, 52 + 12 * Math.min(q, 3), 0.03, -(q / OCT - 0.5), 1.4, 'sine'); }
  pad(at(TL.push0), at(TL.stone1 + 10), [45, 52, 57, 60, 64], 0.011, 900);
  pad(at(TL.stone1), at(TL.stone2 + 10), [48, 55, 60, 64, 67], 0.012, 1500);
  pad(at(TL.stone2), at(TL.end + 50), [41, 48, 53, 57, 60, 65], 0.013, 1100);
  [69, 72, 76, 81].forEach((m, i) => pluck(at(TL.calm) + i * 0.09, m, 0.06, -0.3 + i * 0.2, 1.6, 'sine'));
  [76, 81, 84, 88].forEach((m, i) => pluck(at(TL.end + 10 + i * 6), m, 0.05, -0.45 + i * 0.3, 1.8, 'sine'));
  const buf = await ac.startRendering();
  let peak = 0; for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let k = 0; k < d.length; k++) peak = Math.max(peak, Math.abs(d[k])); }
  const norm = 0.85 / Math.max(peak, 1e-6);                          // every piece peaks at the same level
  for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let k = 0; k < d.length; k++) d[k] *= norm; }
  return buf;
}

/* ==========================================================================
   VERTICAL CUT — shared block, identical in every piece.
   1080x1920 for Reels, Shorts and TikTok (__motion.variants.vertical). The
   piece's own scene code is re-used and recomposed for a phone: everything a
   viewer must read stays inside the area no platform covers (x 60..900,
   y 230..1400); outside it there is only dimmed texture.
   ========================================================================== */
const VW = 1080, VH = 1920, SAFE = { x: 60, y: 230, w: 840, h: 1170, r: 900, b: 1400 };
const vcv = document.createElement('canvas'); vcv.width = VW; vcv.height = VH;
const vx = vcv.getContext('2d', { willReadFrequently: true });   // CPU raster: identical pixels on every redraw
const VL = 96, VR = 864;                                          // text column inside the safe area

function vReset() {
  vx.setTransform(1, 0, 0, 1, 0, 0); vx.globalAlpha = 1; vx.globalCompositeOperation = 'source-over';
  vx.filter = 'none'; vx.shadowBlur = 0; vx.shadowColor = 'transparent'; vx.letterSpacing = '0px'; vx.setLineDash([]);
  vx.textAlign = 'left'; vx.textBaseline = 'alphabetic'; vx.lineCap = 'butt'; vx.lineJoin = 'miter';
}
/** Canvas text on the vertical frame; `max` shrinks the size until the line fits. */
function vText(str, x, y, { size = 40, weight = 700, color = '#FFFFFF', align = 'left', spacing = 0, alpha = 1, fam = FONT, max = 0 } = {}) {
  if (alpha <= 0.002 || !str) return size;
  vx.font = `${weight} ${size}px ${fam}`; vx.letterSpacing = spacing + 'px';
  if (max) { const w = vx.measureText(str).width; if (w > max) { size = size * max / w; vx.font = `${weight} ${size}px ${fam}`; } }
  vx.textAlign = align; vx.textBaseline = 'alphabetic';
  const a0 = vx.globalAlpha; vx.globalAlpha = a0 * alpha; vx.fillStyle = color;
  vx.fillText(str, x + (align === 'center' ? spacing / 2 : align === 'right' ? spacing : 0), y);   // tracking is added after the last glyph too
  vx.globalAlpha = a0; vx.letterSpacing = '0px';
  return size;
}
/** Word-wraps with the given font; returns the lines. */
function vWrap(str, maxW, size, weight = 700, fam = FONT) {
  vx.font = `${weight} ${size}px ${fam}`; vx.letterSpacing = '0px';
  const words = str.split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (vx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur);
  return lines;
}
/** Fade envelope with a small rise: [alpha, dy]. */
function vEnv(v, a, b, fin = 8, fout = 8) {
  const i = E.outCubic(prog(v, a, a + fin)), o = 1 - E.inCubic(prog(v, b - fout, b));
  return [Math.min(i, o), (1 - i) * 22 - (1 - o) * 10];
}
/** Which segment of a cut list a vertical frame is in: segs = [{ at, src, len }] in frames. */
function vSeg(segs, v) {
  let k = 0; while (k < segs.length - 1 && v >= segs[k + 1].at) k++;
  const s = segs[k];
  return { k, s, local: v - s.at, src: s.src + (v - s.at) };
}
/** Dims everything outside the safe area to a quiet texture (brightness x 0.2), with a soft inner edge. */
function vShade(rgb, a = 0.8, feather = 40) {
  vx.save(); vx.setTransform(1, 0, 0, 1, 0, 0); vx.globalAlpha = 1; vx.globalCompositeOperation = 'source-over';
  vx.fillStyle = `rgba(${rgb},${a})`;
  vx.beginPath(); vx.rect(0, 0, VW, VH); vx.rect(SAFE.x, SAFE.y, SAFE.w, SAFE.h); vx.fill('evenodd');
  const strip = (x0, y0, x1, y1, rx, ry, rw, rh) => {
    const g = vx.createLinearGradient(x0, y0, x1, y1);
    g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`);
    vx.fillStyle = g; vx.fillRect(rx, ry, rw, rh);
  };
  strip(SAFE.x, 0, SAFE.x + feather, 0, SAFE.x, SAFE.y, feather, SAFE.h);
  strip(SAFE.r, 0, SAFE.r - feather, 0, SAFE.r - feather, SAFE.y, feather, SAFE.h);
  strip(0, SAFE.y, 0, SAFE.y + feather, SAFE.x, SAFE.y, SAFE.w, feather);
  strip(0, SAFE.b, 0, SAFE.b - feather, SAFE.x, SAFE.b - feather, SAFE.w, feather);
  vx.restore();
}
/** Series tag at the top of the safe area, e.g. MADE IN CODE · 04. */
function vTag(label, color, alpha = 1) {
  vText('MADE IN CODE', VL, 292, { size: 28, weight: 800, color, spacing: 5, alpha });
  vx.font = `800 28px ${FONT}`; vx.letterSpacing = '5px';
  const w = vx.measureText('MADE IN CODE').width; vx.letterSpacing = '0px';
  vText('·  ' + label, VL + w + 14, 292, { size: 28, weight: 600, color: 'rgba(255,255,255,0.72)', spacing: 3, alpha, max: VR - VL - w - 14 });
}
/** Big hook lines, left-aligned from y0; visible from frame 0, settles in a few frames. */
function vHook(v, lines, y0, { size = 84, lh = 1.08, color = '#FFFFFF', accent = null, weight = 800, spacing = -1.5, alpha = 1 } = {}) {
  const k = E.outExpo(prog(v, -6, 12));
  lines.forEach((ln, i) => {
    const kk = E.outExpo(prog(v, -12 + i * 2, 8 + i * 2));
    vText(ln, VL, y0 + i * size * lh + (1 - kk) * 30, { size, weight, spacing, color: accent && i === lines.length - 1 ? accent : color, alpha: alpha * Math.max(0.25, kk), max: VR - VL });
  });
  return k;
}
/** Closing card, the last 60 frames: piece title, "drawn in code · bytepatterns.com". l = frames into the card. */
function vEndCard(l, { title, line = '', ink = '#FFFFFF', dim = 'rgba(255,255,255,0.66)', accent = '#FFFFFF', scrim = '0,0,0', a = 0.84 }) {
  const k = E.outCubic(prog(l, 0, 12));
  vx.save(); vx.setTransform(1, 0, 0, 1, 0, 0);
  vx.fillStyle = `rgba(${scrim},${a * k})`; vx.fillRect(0, 0, VW, VH);
  vx.restore();
  const t1 = E.outExpo(prog(l, 3, 19)), t2 = E.outExpo(prog(l, 11, 27)), t3 = E.outExpo(prog(l, 19, 35));
  vx.fillStyle = accent; vx.globalAlpha = t1; vx.fillRect(VL, 742, 88 * t1, 7); vx.globalAlpha = 1;
  const size = vText(title, VL, 850 + (1 - t1) * 40, { size: 92, weight: 800, color: ink, spacing: -2, alpha: t1, max: VR - VL });
  const y2 = 850 + Math.max(size, 60) * 0.25 + 70;
  vx.font = `600 44px ${FONT}`;
  const lead = 'drawn in code  ·  ', lw = vx.measureText(lead).width;
  vText(lead, VL, y2 + (1 - t2) * 24, { size: 44, weight: 600, color: dim, alpha: t2 });
  vText('bytepatterns.com', VL + lw, y2 + (1 - t2) * 24, { size: 44, weight: 800, color: accent, alpha: t2 });
  if (line) vText(line, VL, y2 + 72 + (1 - t3) * 18, { size: 32, weight: 500, color: dim, alpha: t3, max: VR - VL });
}
/** Seeks a cut. The first frame a page draws is drawn twice: the very first read of a
 *  GPU-backed source canvas can come out a shade different from every later one. */
let vWarm = false;
function vSeek(draw, i, frames) {
  const f = Math.max(0, Math.min(frames - 1, Math.floor(i)));
  if (!vWarm) { vWarm = true; draw(f); }
  draw(f);
}
/** The soundtrack of a cut: the piece's own audio() spliced to the same segments as the picture. */
async function vAudio(segs, frames, { xf = 0.025, fadeOut = 0.6, extra = null } = {}) {
  const src = await renderAudio();
  const SR = 48000, dur = frames / FPS, ac = new OfflineAudioContext(2, Math.round(SR * dur), SR);
  const out = ac.createGain(); out.connect(ac.destination);
  out.gain.setValueAtTime(1, 0); out.gain.setValueAtTime(1, dur - fadeOut); out.gain.linearRampToValueAtTime(0, dur - 0.01);
  segs.forEach((s, k) => {
    const at = s.at / FPS, off = s.src / FPS, d = s.len / FPS;
    const pre = k === 0 ? 0 : Math.min(xf, off), post = k === segs.length - 1 ? 0 : xf;
    const b = ac.createBufferSource(), g = ac.createGain(); b.buffer = src;
    g.gain.setValueAtTime(pre ? 0 : 1, at - pre);
    if (pre) g.gain.linearRampToValueAtTime(1, at + pre);
    if (post) { g.gain.setValueAtTime(1, at + d - post); g.gain.linearRampToValueAtTime(0, at + d + post); }
    b.connect(g).connect(out); b.start(at - pre, off - pre, d + pre + post);
  });
  if (extra) extra(ac, out);
  const buf = await ac.startRendering();
  let peak = 0; for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) peak = Math.max(peak, Math.abs(d[i])); }
  if (peak > 0.9) for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] *= 0.9 / peak; }
  return buf;
}
/** A soft three-partial bell, for the closing card. */
function vChime(ac, dest, at, freq, vol = 0.08) {
  for (const [mul, v, dec] of [[1, 1, 1.8], [2.01, 0.35, 0.8], [3.02, 0.12, 0.4]]) {
    const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.value = freq * mul;
    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol * v, at + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, at + dec);
    o.connect(g).connect(dest); o.start(at); o.stop(at + dec + 0.05);
  }
}

/* VERTICAL CUT — this piece */
// Its own noise field on a portrait grid (540 x 960, drawn at 1080 x 1920) and a faster clock.
const TLV = buildTL({ cap0: 34, push0: 76, push1: 132, p1: 2.6, oct0: 140, oct1: 236, deep0: 244, deep1: 300, p2: 7.5, stone1: 310, stone2: 402, calm: 492, end: 534 });
const VFR = TLV.end + 60, VEND = VFR - 60;
const GV = { TL: TLV, w: VW, h: VH, nx: 540, ny: 960, cells: 4.4, ox: 5.37, oy: 2.71, stripes: 4, glint: 160,
  scrims: [[230, 580, 0.9], [1400, 1180, 0.92]],
  capX: VL, capY: 390, cap: 48, capTwo: true, capMax: VR - VL,
  fo: 30, fo2: 28, foX: VL, foY: 1306, foAlign: 'left', foX2: VL, foY2: 1356, foAlign2: 'left', foMax: VR - VL,
  fn: 76, fnX: VL, fnY: 820, fnAlign: 'left', fnMax: VR - VL };
buildField(GV);
function hookV(v) {
  const o = 1 - E.inCubic(prog(v, TLV.cap0 - 10, TLV.cap0 + 4));
  if (o <= 0) return;
  vx.save(); vx.fillStyle = `rgba(${C.bgRGB},${0.82 * o})`; vx.fillRect(SAFE.x, 400, SAFE.w, 560); vx.restore();
  vHook(v, ['One sine', 'wave.', 'Add noise.', 'Get marble.'], 510, { size: 104, accent: C.accent, color: C.paper, weight: 900, spacing: -2, alpha: o });
}
function vDraw(v) {
  if (vx.reset) vx.reset();
  vReset();
  vx.fillStyle = C.bg; vx.fillRect(0, 0, VW, VH);
  scene(vx, GV, v);
  hookV(v);
  vReset();
  vShade(C.bgRGB, 0.95);
  vTag('PERLIN MARBLE', C.accent);
  if (v >= VEND) vEndCard(v - VEND, { title: 'Marble from One Sine', line: `${OCT} octaves of Perlin noise  ·  ${STONES.length} ramps  ·  no images`,
    ink: C.paper, dim: 'rgba(241,238,230,0.72)', accent: C.accent, scrim: C.bgRGB, a: 0.88 });
  vReset();
}

// The player asks for a frame on every display refresh; at 30 fps on a 60 Hz screen every other call
// asks for the frame already on the canvas, which is then left as it is (same frame, same pixels).
const shown = { L: -1, V: -1 };
window.__motion = {
  title: 'Marble from One Sine',
  description: `Generative: sin(x + power · turbulence) on a ${GL.nx} × ${GL.ny} grid, where the turbulence sums ${OCT} octaves of seeded Perlin noise (${fmt(GL.samples)} samples, each octave twice as fine and half as strong), bends straight stripes into marble veins as the power grows from 0 to ${TLL.p2} and the octaves from 1 to ${OCT}, while ${STONES.length} colour ramps turn the same field into ${STONES.map(s => s.name).join(', ')} stone.`,
  fps: FPS, width: W, height: H, frames: FRAMES,
  poster: TLL.stone2 + WIPE + 30,
  gifStart: Math.floor(TLL.stone1 / FPS),
  seek(i) { const f = Math.max(0, Math.min(FRAMES - 1, Math.floor(i))); if (f !== shown.L) { shown.L = f; draw(f); } },
  audio: () => renderAudio(TLL, FRAMES),
  variants: {
    vertical: {
      width: VW, height: VH, frames: VFR, canvas: vcv,
      poster: TLV.stone2 + WIPE + 20, gifStart: Math.floor(TLV.stone1 / FPS),
      seek(i) { const v = Math.max(0, Math.min(VFR - 1, Math.floor(i))); if (v !== shown.V) { shown.V = v; vSeek(vDraw, v, VFR); } },
      audio: () => renderAudio(TLV, VFR),
    },
  },
};

/* ==========================================================================
   PLAYER — identical in every piece; keep as is.
   Autoplays and loops, starts sound on the first click, ?frame=N pauses on a
   frame, ?variant=vertical plays the vertical cut (if the piece has one).
   When the renderer sets window.__MOTION_RENDER__ it stays out of the way.
   ========================================================================== */
(function player() {
  const btn = document.getElementById('sound'), q = new URLSearchParams(location.search);
  let M = window.__motion;
  const V = !window.__MOTION_RENDER__ && M.variants && M.variants[q.get('variant')];
  if (V) {                                                // show the variant's own canvas instead
    M = Object.assign({}, M, V);
    V.canvas.style.cssText = `width:min(100vw,calc(100vh*${V.width}/${V.height}));height:auto;aspect-ratio:${V.width}/${V.height}`;
    document.querySelector('canvas').replaceWith(V.canvas);
  }
  const dur = M.frames / M.fps;
  if (window.__MOTION_RENDER__) { btn.hidden = true; M.seek(0); return; }
  if (q.has('frame')) { btn.hidden = true; M.seek(+q.get('frame') || 0); return; }
  let t0 = performance.now(), ac = null, src = null, buf = null, paused = false, pausedAt = 0;
  const clock = () => ac && src ? (ac.currentTime - t0) : (performance.now() - t0) / 1000;
  function loop() {
    if (!paused) M.seek(Math.floor(((clock() % dur) + dur) % dur * M.fps));
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  btn.addEventListener('click', async () => {
    if (src) { src.stop(); src = null; btn.textContent = 'Click for sound'; t0 = performance.now(); return; }
    btn.textContent = 'Loading sound…';
    ac = ac || new AudioContext({ sampleRate: 48000 });
    buf = buf || await M.audio();
    await ac.resume();
    src = ac.createBufferSource(); src.buffer = buf; src.loop = true; src.connect(ac.destination);
    t0 = ac.currentTime + 0.05; src.start(t0);        // picture restarts from frame 0 in sync with the sound
    btn.textContent = 'Sound on — click to mute';
  });
  addEventListener('keydown', e => {
    if (e.code !== 'Space') return;
    e.preventDefault(); paused = !paused;
    if (ac) paused ? ac.suspend() : ac.resume();
    if (!ac) { if (paused) pausedAt = performance.now(); else t0 += performance.now() - pausedAt; }
  });
})();
</script>
