<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="teambytepatterns">
<meta name="description" content="Kinetic type: seven words hashed three times each into a 32-bit Bloom filter with real FNV-1a, then three lookups: one maybe, one definitely not, one false positive.">
<title>Bloom Filter: No, or Maybe — motion-lab</title>
<style>
  /* Player chrome. The piece itself lives entirely in the canvas. */
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; font: 500 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; }
  canvas { display: block; width: min(100vw, calc(100vh * 16 / 9)); height: auto; aspect-ratio: 16 / 9; }
  #sound { position: fixed; left: 16px; bottom: 16px; padding: 8px 14px; border: 1px solid rgba(255,255,255,.35); border-radius: 999px;
           background: rgba(0,0,0,.55); color: #fff; font: inherit; cursor: pointer; }
  #sound[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080" aria-label="Big words drop in one at a time; three coloured hash lines run from each word to a row of 32 bits and flip them to 1; then three words are looked up and answered maybe, definitely not, and a false maybe"></canvas>
<button id="sound" type="button">Click for sound</button>
<script>
'use strict';
/* ==========================================================================
   PIECE — Bloom Filter: No, or Maybe.
   A Bloom filter is a row of m bits and k hash functions. To ADD a word,
   set the k bits its hashes point to. To LOOK UP a word, check those k
   bits: if any is 0 the word was DEFINITELY NOT added; if all are 1 it
   MAYBE was: other words may have set the same bits (a false positive).
   Here m = 32 and k = 3, and hash i of a word is 32-bit FNV-1a of the
   string "i:word", modulo 32 (FNV-1a: h = 2166136261; for each byte,
   h ^= byte, h *= 16777619).
   The words, the bits, the lookups and the numbers at the end are all
   computed at load: the lookups are the fourth added word, the first word
   of a fixed list of others whose bits are not all set, and the
   first one whose bits all are. The measured false-positive rate is
   counted over 1,000 strings that were never added.
   ========================================================================== */
const W = 1920, H = 1080, FPS = 30;
const cv = document.getElementById('stage');
const ctx = cv.getContext('2d', { willReadFrequently: true });   // CPU raster: identical pixels on every redraw
const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
const MONO = 'ui-monospace, "Cascadia Code", Consolas, Menlo, monospace';

// ---- helpers -------------------------------------------------------------
// ---- helpers -------------------------------------------------------------
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (f, a, b) => clamp((f - a) / (b - a));
const smooth = t => t * t * (3 - 2 * t);
const E = {
  inCubic: t => t * t * t,
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inOutCubic: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outExpo: t => t === 1 ? 1 : 1 - Math.pow(2, -10 * t),
  inExpo: t => t === 0 ? 0 : Math.pow(2, 10 * t - 10),
  inOutExpo: t => t === 0 ? 0 : t === 1 ? 1 : t < .5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2,
  outBack: t => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2),
};
/** Canvas text; `max` shrinks the size until the line fits. Returns the width drawn. */
function text(g, str, x, y, { size = 40, weight = 600, color = '#fff', alpha = 1, spacing = 0, align = 'left', fam = FONT, base = 'alphabetic', max = 0 } = {}) {
  if (alpha <= 0.002 || !str) return 0;
  g.font = `${weight} ${size}px ${fam}`; g.letterSpacing = spacing + 'px';
  if (max) { const w0 = g.measureText(str).width; if (w0 > max) { size *= max / w0; g.font = `${weight} ${size}px ${fam}`; } }
  g.textAlign = align; g.textBaseline = base;
  const a0 = g.globalAlpha; g.globalAlpha = a0 * alpha; g.fillStyle = color;
  g.fillText(str, x, y);
  const w = g.measureText(str).width;
  g.globalAlpha = a0; g.letterSpacing = '0px';

}
const measure = (g, str, size, weight = 800, fam = FONT, spacing = 0) => { g.font = `${weight} ${size}px ${fam}`; g.letterSpacing = spacing + 'px'; const w = g.measureText(str).width; g.letterSpacing = '0px'; return w; };
const env = (f, a, b, fin = 12, fout = 10) => {
  const i = E.outCubic(prog(f, a, a + fin)), o = 1 - E.inCubic(prog(f, b - fout, b));
  return [Math.min(i, o), (1 - i) * 24 - (1 - o) * 10];
};

// ---- palette -------------------------------------------------------------
const C = {
  bg: '#120E14', bgRGB: '18,14,20', paper: '#F5EEF2', dim: 'rgba(245,238,242,0.62)', faint: 'rgba(245,238,242,0.16)',
  cell: '#1E1822', on: '#FFD166', onRGB: '255,209,102',
  h: ['#FF6FA1', '#6FD3FF', '#B5F07A'],
  maybe: '#FFD166', no: '#5EE0C0', fp: '#FF6B5E',
};

// ---- the model: FNV-1a, a 32-bit Bloom filter, computed once at load ------------------------
function fnv1a(s) {                                          // 32-bit FNV-1a over the UTF-16 code units (ASCII here)
  let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h >>> 0;
}
const M = 32, K = 3;
const hashes = w => [1, 2, 3].map(i => fnv1a(i + ':' + w) % M);
const SET = ['cat', 'dog', 'owl', 'fox', 'bee', 'elk', 'ant'];
const BITS = new Array(M).fill(0);
for (const w of SET) for (const b of hashes(w)) BITS[b] = 1;
const ONES = BITS.reduce((a, b) => a + b, 0);
const maybe = w => hashes(w).every(b => BITS[b]);
const OTHERS = ['yak', 'emu', 'pig', 'cow', 'bat', 'rat', 'hen', 'ram', 'eel', 'gnu', 'ape', 'koi', 'jay', 'cod'];
const QUERIES = [
  { w: SET[3], kind: 'in' },
  { w: OTHERS.find(w => !maybe(w)), kind: 'no' },
  { w: OTHERS.find(w => maybe(w)), kind: 'fp' },
];
const PROBE = 1000;
const FP = (() => { let n = 0; for (let i = 0; i < PROBE; i++) if (maybe('probe' + i)) n++; return n; })();
const EST = Math.pow(1 - Math.exp(-K * SET.length / M), K);
const pctS = x => (x * 100).toFixed(1) + '%';

// ---- timeline (frames) ---------------------------------------------------------------------
function buildTL(o) {
  const TL = { o, ins: [], q: [] };
  let t = o.start;
  SET.forEach((w, n) => {
    const s = n < o.slowN ? o.slow : 1;
    const e = { w, n, h: hashes(w), t0: t };
    const L = o.letters * s, gap = o.gap * s, arr = o.arrow * s, hold = o.hold * s, ex = o.exit * s;
    e.th = [0, 1, 2].map(i => Math.round(t + L + i * gap));
    e.ta = e.th.map(x => Math.round(x + arr));
    e.t1 = Math.round(e.ta[2] + hold); e.t2 = Math.round(e.t1 + ex);
    TL.ins.push(e);
    t = e.t1 + Math.round(ex * o.overlap);

  t = TL.insEnd + o.pause;
  TL.qStart = t;
  QUERIES.forEach((q, k) => {
    const e = { w: q.w, kind: q.kind, k, h: hashes(q.w), t0: t };
    e.th = [0, 1, 2].map(i => Math.round(t + o.qLetters + i * o.qGap));
    e.ta = e.th.map(x => Math.round(x + o.qArrow));
    e.tv = e.ta[2] + 4;
    e.t1 = e.tv + o.qHold + (q.kind === 'fp' ? o.fpExtra : 0); e.t2 = e.t1 + o.exit;
    TL.q.push(e);
    t = e.t2 + 2;
  });
  TL.stats = t + 4;
  TL.end = TL.stats + o.statLen;
  TL.caps = [
    [o.start - 6, TL.ins[1].t1, 'Add a word:|set the 3 bits its hashes pick.'],
    [TL.ins[1].t1 - 2, TL.insEnd + 6, 'Seven words.|Some bits get picked twice.'],
    [TL.qStart - 4, TL.q[1].t0 + 2, 'Look one up:|check the same 3 bits.'],
    [TL.q[1].t0 - 2, TL.q[2].t0 + 2, 'One bit is 0?|Definitely not.'],
    [TL.q[2].t0 - 2, TL.stats + 4, 'All 3 are 1?|Maybe. Only maybe.'],
  ];
  TL.hits = [];                                             // every bit write, for the flashes and the sound
  for (const e of TL.ins) e.h.forEach((b, i) => TL.hits.push({ t: e.ta[i], b, i, n: e.n }));
  return TL;
}
const TLL = buildTL({ start: 58, slowN: 2, slow: 1.7, letters: 7, gap: 5, arrow: 8, hold: 5, exit: 9, overlap: 0.55,
  pause: 18, qLetters: 10, qGap: 7, qArrow: 9, qHold: 30, fpExtra: 26, statLen: 110 });
const FRAMES = TLL.end + 72;

// ---- drawing ------------------------------------------------------------------------------
function cellXY(G, b) {
  const per = M / G.rows, r = Math.floor(b / per), c = b % per;
  return [G.cx + (c - (per - 1) / 2) * G.pitch, G.bitY + r * G.rowGap];
}
/** A point on the cubic from the word to the top of cell b, at u in 0..1. */
/** Centre x of part i of a word's hash readout. */
function roX(G, e, i) {
  const gw = measure(ctx, '     ', G.ro, 700, MONO), ws = e.h.map((b, k) => measure(ctx, `h${'₁₂₃'[k]} = ${b}`, G.ro, 700, MONO));
  let x = G.wx - (ws.reduce((a, b) => a + b, 0) + gw * 2) / 2;
  for (let k = 0; k < i; k++) x += ws[k] + gw;
  return x + ws[i] / 2;
}
function arrowPt(G, i, b, u, x0) {
  const y0 = G.roY + G.a0;
  const [x3, cy] = cellXY(G, b), y3 = cy - G.cs / 2 - 8;
  const x1 = x0, y1 = y0 + (y3 - y0) * 0.55, x2 = x3, y2 = y3 - (y3 - y0) * 0.45;
  const m = 1 - u;
  return [m * m * m * x0 + 3 * m * m * u * x1 + 3 * m * u * u * x2 + u * u * u * x3, m * m * m * y0 + 3 * m * m * u * y1 + 3 * m * u * u * y2 + u * u * u * y3];
}
function arrow(g, G, i, b, u, alpha, lw, x0) {
  if (u <= 0 || alpha <= 0.01) return;
  g.save(); g.globalAlpha = alpha; g.strokeStyle = C.h[i]; g.lineWidth = lw; g.lineCap = 'round';
  g.beginPath();
  const n = 28; for (let k = 0; k <= n; k++) { const [x, y] = arrowPt(G, i, b, u * k / n, x0); k ? g.lineTo(x, y) : g.moveTo(x, y); }
  g.stroke();
  const [hx, hy] = arrowPt(G, i, b, u, x0);
  g.fillStyle = C.h[i]; g.beginPath(); g.arc(hx, hy, lw * 1.9, 0, Math.PI * 2); g.fill();
  g.restore();
}
/** A big word whose letters drop in one by one from t0; `scale`/`dx`/`dy` move it as a whole. */
function bigWord(g, G, w, f, t0, { color = C.paper, alpha = 1, scale = 1, x = G.wx, y = G.wy, size = G.word, stag = 2.5, outline = false } = {}) {
  if (alpha <= 0.01) return;
  g.save(); g.translate(x, y); g.scale(scale, scale);
  const sp = -size * 0.02, tot = measure(g, w, size, 900, FONT, sp);
  let cx = -tot / 2;
  for (let k = 0; k < w.length; k++) {
    const ch = w[k], cw = measure(g, ch, size, 900, FONT, sp);
    const p = prog(f, t0 + k * stag, t0 + k * stag + 10), e = E.outBack(p);
    if (p > 0) {
      const dy = (1 - e) * -size * 0.5;
      if (outline) { g.font = `900 ${size}px ${FONT}`; g.letterSpacing = sp + 'px'; g.textAlign = 'left'; g.textBaseline = 'alphabetic';
        g.globalAlpha = alpha * clamp(p * 2); g.strokeStyle = color; g.lineWidth = size * 0.035; g.strokeText(ch, cx, size * 0.34 + dy); g.letterSpacing = '0px'; g.globalAlpha = 1; }
      else text(g, ch, cx, size * 0.34 + dy, { size, weight: 900, color, alpha: alpha * clamp(p * 2), spacing: sp });
    }
    cx += cw;
  }
  g.restore();
}
/** The hash readout under the word: h1 22   h2 15   h3 12, each part appearing with its arrow. */
function readout(g, G, e, f, alpha) {
  if (alpha <= 0.01) return;
  const parts = e.h.map((b, i) => [`h${'₁₂₃'[i]} = ${b}`, i]);
  const gapS = '     ', gw = measure(g, gapS, G.ro, 700, MONO);
  const ws = parts.map(([s]) => measure(g, s, G.ro, 700, MONO));
  let x = G.wx - (ws.reduce((a, b) => a + b, 0) + gw * 2) / 2;
  parts.forEach(([s, i], k) => {
    const a = E.outCubic(prog(f, e.th[i] - 2, e.th[i] + 5));
    text(g, s, x, G.roY + (1 - a) * 12, { size: G.ro, weight: 700, color: C.h[i], fam: MONO, alpha: alpha * a });
    x += ws[k] + gw;
  });
}
function bitsRow(g, G, f) {
  const TL = G.TL;
  const qNow = TL.q.find(q => f >= q.t0 && f < q.t2);
  for (let b = 0; b < M; b++) {
    const [x, y] = cellXY(G, b);
    let on = 0, flash = 0;
    for (const h of TL.hits) if (h.b === b && f >= h.t) { on = 1; flash = Math.max(flash, Math.exp(-(f - h.t) / 7)); }
    const pop = 1 + 0.25 * flash;
    g.save(); g.translate(x, y); g.scale(pop, pop);
    g.fillStyle = on ? C.on : C.cell; g.beginPath(); g.roundRect(-G.cs / 2, -G.cs / 2, G.cs, G.cs, 7); g.fill();
    if (!on) { g.strokeStyle = C.faint; g.lineWidth = 1.5; g.stroke(); }
    if (flash > 0.02) { g.globalAlpha = flash; g.strokeStyle = C.paper; g.lineWidth = 3; g.beginPath(); g.roundRect(-G.cs / 2 - 5, -G.cs / 2 - 5, G.cs + 10, G.cs + 10, 10); g.stroke(); g.globalAlpha = 1; }
    // a lookup checks this bit: a ring, green-ish when it is 1, red when it is 0
    if (qNow) qNow.h.forEach((qb, i) => {
      if (qb !== b || f < qNow.ta[i]) return;
      const a = 1 - E.inCubic(prog(f, qNow.t1, qNow.t2)), k = E.outBack(prog(f, qNow.ta[i], qNow.ta[i] + 8));
      g.globalAlpha = a; g.strokeStyle = BITS[b] ? C.h[i] : C.fp; g.lineWidth = 4;
      const r = G.cs / 2 + 4 + 6 * k; g.beginPath(); g.roundRect(-r, -r, 2 * r, 2 * r, 10); g.stroke(); g.globalAlpha = 1;
    });

    g.restore();

    if (G.idx) {
      let ia = 0, col = C.dim;
      for (const e of [...TL.ins, ...TL.q]) e.h.forEach((hb, i) => {
        if (hb !== b) return; const a = Math.min(E.outCubic(prog(f, e.ta[i] - 2, e.ta[i] + 4)), 1 - E.inCubic(prog(f, e.t1, e.t2)));
        if (a > ia) { ia = a; col = C.h[i]; }
      });
      if (ia > 0.01) text(g, String(b), x, y + G.cs / 2 + G.idx + 10, { size: G.idx, weight: 800, color: col, fam: MONO, align: 'center', alpha: ia });

}
function words(g, G, f) {
  const TL = G.TL;
  for (const e of TL.ins) {
    if (f < e.t0 - 2 || f > e.t2 + 400) continue;
    const u = E.inOutCubic(prog(f, e.t1, e.t2));
    const [lx, ly] = listXY(G, e.n);
    if (u < 1) {
      const sc = lerp(1, G.listSize / G.word, u);
      bigWord(g, G, e.w, f, e.t0, { x: lerp(G.wx, lx, u), y: lerp(G.wy, ly - G.listSize * 0.34 + G.listSize * 0.02, u), scale: sc, alpha: 1 });
      readout(g, G, e, f, 1 - E.inCubic(prog(f, e.t1, e.t1 + 6)));
      e.h.forEach((b, i) => arrow(g, G, i, b, E.outCubic(prog(f, e.th[i], e.ta[i])), 1 - E.inCubic(prog(f, e.t1, e.t1 + 7)), G.alw, roX(G, e, i)));

  for (const e of TL.q) {
    if (f < e.t0 - 2 || f > e.t2) continue;
    const out = E.inCubic(prog(f, e.t1, e.t2));
    const col = f >= e.tv ? (e.kind === 'no' ? C.no : e.kind === 'fp' && f >= e.tv + TL.o.fpExtra * 0.6 ? C.fp : C.maybe) : C.paper;
    bigWord(g, G, e.w, f, e.t0, { alpha: 1 - out, y: G.wy - out * 40, color: col, stag: 3.5, outline: f < e.tv });
    readout(g, G, e, f, 1 - out);
    e.h.forEach((b, i) => arrow(g, G, i, b, E.outCubic(prog(f, e.th[i], e.ta[i])), (1 - out) * (BITS[b] ? 1 : 0.9), G.alw, roX(G, e, i)));

function verdict(g, G, e, f, alpha) {

    : e.kind === 'no' ? ['DEFINITELY NOT', C.no, `bit ${zero} is 0, so “${e.w}” was never added`]
    : ['MAYBE', C.maybe, `all 3 bits are 1, set by other words`];

  g.restore();
  const r = e.kind === 'fp' ? E.outCubic(prog(f, e.tv + e.fpX, e.tv + e.fpX + 10)) : 0;
  text(g, small, G.vX, G.vY + G.vS * 0.62 + 14, { size: G.vs, weight: 650, color: C.paper, align: G.vAlign, alpha: a * 0.9 * (1 - r), max: G.vMax });

}
function listXY(G, n) {

function setList(g, G, f) {

  if (a <= 0) return;
  text(g, 'added', G.listX, G.listY, { size: G.listSize * 0.8, weight: 700, color: C.dim, spacing: 2, alpha: a });
  for (const e of TL.ins) if (f >= e.t2) { const [x] = listXY(G, e.n); text(g, e.w, x, G.listY, { size: G.listSize, weight: 900, color: C.paper, spacing: -G.listSize * 0.02, align: 'center', alpha: a }); }

  const w2 = measure(g, s2, G.listSize * 0.8, 700);
  text(g, s1, G.cntX - w2, G.cntY, { size: G.listSize, weight: 900, color: C.on, fam: MONO, align: 'right', alpha: a });

function stats(g, G, f) {

  stX: VL, stY: 1050, st1: 40, st2: 32, stAlign: 'left', stMax: VR - VL, stWrap: true };
function hookV(v) {
  const o = 1 - E.inCubic(prog(v, TLV.o.start - 16, TLV.o.start - 2));
  if (o <= 0) return;
  vHook(v, ['Is it in', 'the set?', 'No. Or maybe.'], 480, { size: 112, accent: C.maybe, color: C.paper, weight: 900, spacing: -2, alpha: o });
}
function vDraw(v) {
  vReset();
  backdrop(vx, VW, VH);
  scene(vx, GV, v);
  hookV(v);
  vReset();
  vShade(C.bgRGB, 0.84);
  vTag('BLOOM FILTER', C.maybe);
  if (v >= VEND) vEndCard(v - VEND, { title: 'Bloom Filter', line: `${M} bits  ·  ${K} FNV-1a hashes  ·  no, or maybe`,
    ink: C.paper, dim: 'rgba(245,238,242,0.72)', accent: C.maybe, scrim: C.bgRGB, a: 0.9 });
  vReset();
}

window.__motion = {
  title: 'Bloom Filter: No, or Maybe',
  description: `Kinetic type: ${SET.length} words go into a ${M}-bit Bloom filter through ${K} hashes each (32-bit FNV-1a of "i:word" mod ${M}), setting ${ONES} bits; then "${QUERIES[0].w}" comes back maybe, "${QUERIES[1].w}" definitely not, and "${QUERIES[2].w}", never added, maybe: a false positive. Of ${PROBE.toLocaleString('en-US')} strings never added, ${FP} came back maybe.`,
  fps: FPS, width: W, height: H, frames: FRAMES,
  poster: TLL.q[2].tv + TLL.q[2].fpX + 14,
  gifStart: Math.floor(TLL.ins[2].t0 / FPS),
  seek(i) { draw(Math.max(0, Math.min(FRAMES - 1, Math.floor(i)))); },
  audio: () => renderAudio(TLL, FRAMES),
  variants: {
    vertical: {
      width: VW, height: VH, frames: VFR, canvas: vcv,
      poster: TLV.q[2].tv + TLV.q[2].fpX + 12, gifStart: Math.floor(TLV.q[0].t0 / FPS) - 1,
      seek(i) { vSeek(vDraw, i, VFR); },
      audio: () => renderAudio(TLV, VFR),
    },
  },
};

/* ==========================================================================
   PLAYER — identical in every piece; keep as is.
   Autoplays and loops, starts sound on the first click, ?frame=N pauses on a
   frame, ?variant=vertical plays the vertical cut (if the piece has one).
   When the renderer sets window.__MOTION_RENDER__ it stays out of the way.
   ========================================================================== */
(function player() {
  const btn = document.getElementById('sound'), q = new URLSearchParams(location.search);
  let M = window.__motion;
  const V = !window.__MOTION_RENDER__ && M.variants && M.variants[q.get('variant')];
  if (V) {                                                // show the variant's own canvas instead
    M = Object.assign({}, M, V);
    V.canvas.style.cssText = `width:min(100vw,calc(100vh*${V.width}/${V.height}));height:auto;aspect-ratio:${V.width}/${V.height}`;
    document.querySelector('canvas').replaceWith(V.canvas);
  }
  const dur = M.frames / M.fps;
  if (window.__MOTION_RENDER__) { btn.hidden = true; M.seek(0); return; }
  if (q.has('frame')) { btn.hidden = true; M.seek(+q.get('frame') || 0); return; }
  let t0 = performance.now(), ac = null, src = null, buf = null, paused = false, pausedAt = 0;
  const clock = () => ac && src ? (ac.currentTime - t0) : (performance.now() - t0) / 1000;
  function loop() {
    if (!paused) M.seek(Math.floor(((clock() % dur) + dur) % dur * M.fps));
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  btn.addEventListener('click', async () => {
    if (src) { src.stop(); src = null; btn.textContent = 'Click for sound'; t0 = performance.now(); return; }
    btn.textContent = 'Loading sound…';
    ac = ac || new AudioContext({ sampleRate: 48000 });
    buf = buf || await M.audio();
    await ac.resume();
    src = ac.createBufferSource(); src.buffer = buf; src.loop = true; src.connect(ac.destination);
    t0 = ac.currentTime + 0.05; src.start(t0);        // picture restarts from frame 0 in sync with the sound
    btn.textContent = 'Sound on — click to mute';
  });
  addEventListener('keydown', e => {
    if (e.code !== 'Space') return;
    e.preventDefault(); paused = !paused;
    if (ac) paused ? ac.suspend() : ac.resume();
    if (!ac) { if (paused) pausedAt = performance.now(); else t0 += performance.now() - pausedAt; }
  });
})();
</script>
</body>
