<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="teambytepatterns">
<meta name="description" content="Seven nodes and ten one-way edges, one of them negative: Dijkstra settles B at 2 before the minus-five edge from A can reach it, so five of the seven distances come out one too high and the target reads 9; Bellman-Ford relaxes all ten edges in the same order, round after round, needs six rounds of changes and a seventh quiet one that proves there is no negative cycle, and finds 8 after 70 edge checks and 15 relaxations.">
<title>Bellman-Ford: One Negative Edge — motion-lab</title>
<style>
  /* Player chrome. The piece itself lives entirely in the canvas. */
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; font: 500 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; }
  canvas { display: block; width: min(100vw, calc(100vh * 16 / 9)); height: auto; aspect-ratio: 16 / 9; }
  #sound { position: fixed; left: 16px; bottom: 16px; padding: 8px 14px; border: 1px solid rgba(255,255,255,.35); border-radius: 999px;
           background: rgba(0,0,0,.55); color: #fff; font: inherit; cursor: pointer; }
  #sound[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080" aria-label="A graph of seven lettered circles joined by arrows with small weights, one arrow pink with a weight of minus five; first the circles lock one by one in the nearest-first order and the pink arrow is refused; then a list of the ten arrows on the right is scanned again and again while the numbers beside the circles drop, until a whole pass changes nothing and the final number at T reads 8 instead of 9"></canvas>
<button id="sound" type="button">Click for sound</button>
<script>
'use strict';
/* ==========================================================================
   PIECE — Bellman-Ford: One Negative Edge.
   Shortest paths from S on a small directed graph with one negative weight.
   Dijkstra takes the nearest unsettled node, settles it for good and relaxes
   its out-edges; with a negative edge a settled node can still get cheaper
   later, but Dijkstra never looks back, so its answers stay too high.
   Bellman-Ford relaxes every edge (d[v] = min(d[v], d[u] + w)) in a fixed
   order, round after round. Round k fixes every shortest path of k edges,
   so V - 1 rounds always suffice; if round V still improves something, a
   negative cycle is reachable. Here the edge order is the worst one (from
   the far end back to S), so it takes all V - 1 rounds, and round V is the
   quiet check.
   Both runs, every check and every distance snapshot are computed once at
   load. A frame maps to a step of that record, so seek(i) is pure in i.
   ========================================================================== */
const W = 1920, H = 1080, FPS = 30;
const cv = document.getElementById('stage');
const ctx = cv.getContext('2d', { willReadFrequently: true });   // CPU raster: identical pixels on every redraw
const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
const MONO = 'ui-monospace, "Cascadia Code", Consolas, Menlo, monospace';

// ---- helpers -------------------------------------------------------------
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (f, a, b) => clamp((f - a) / (b - a));
const smooth = t => t * t * (3 - 2 * t);
const E = {
  inCubic: t => t * t * t,
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inOutCubic: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outExpo: t => t === 1 ? 1 : 1 - Math.pow(2, -10 * t),
  inExpo: t => t === 0 ? 0 : Math.pow(2, 10 * t - 10),
  inOutExpo: t => t === 0 ? 0 : t === 1 ? 1 : t < .5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2,
  outBack: t => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2),
};
/** Canvas text; `max` shrinks the size until the line fits. Returns the width drawn. */
function text(g, str, x, y, { size = 40, weight = 600, color = '#fff', alpha = 1, spacing = 0, align = 'left', fam = FONT, base = 'alphabetic', max = 0 } = {}) {
  if (alpha <= 0.002 || !str) return 0;
  g.font = `${weight} ${size}px ${fam}`; g.letterSpacing = spacing + 'px';
  if (max) { const w0 = g.measureText(str).width; if (w0 > max) { size *= max / w0; g.font = `${weight} ${size}px ${fam}`; } }
  g.textAlign = align; g.textBaseline = base;
  const a0 = g.globalAlpha; g.globalAlpha = a0 * alpha; g.fillStyle = color;
  g.fillText(str, x, y);
  const w = g.measureText(str).width;
  g.globalAlpha = a0; g.letterSpacing = '0px';
  return w;
}
const measure = (g, str, size, weight = 800, fam = FONT, spacing = 0) => { g.font = `${weight} ${size}px ${fam}`; g.letterSpacing = spacing + 'px'; const w = g.measureText(str).width; g.letterSpacing = '0px'; return w; };
const env = (f, a, b, fin = 12, fout = 10) => {
  const i = E.outCubic(prog(f, a, a + fin)), o = 1 - E.inCubic(prog(f, b - fout, b));
  return [Math.min(i, o), (1 - i) * 24 - (1 - o) * 10];
};


// ---- palette -------------------------------------------------------------
const C = {
  bg: '#0B0D14', bgRGB: '11,13,20', paper: '#F1EEE6', paperRGB: '241,238,230', dim: 'rgba(241,238,230,0.62)', faint: 'rgba(241,238,230,0.16)',
  accent: '#FFC857', accentRGB: '255,200,87', go: '#5CD6CB', goRGB: '92,214,203', no: '#FF5E6C', noRGB: '255,94,108', node: '#151A28',
  blue: '#8FA8FF', blueRGB: '143,168,255',
};

// ---- the graph and both runs ------------------------------------------------------------------
const NAMES = ['S', 'A', 'B', 'C', 'D', 'E', 'T'];
const V = NAMES.length, TGT = V - 1;
const POS = [[0, 0.5], [0.3, 0.06], [0.3, 0.94], [0.64, 0.94], [0.64, 0.3], [0.94, 0.8], [1, 0.12]];
// the scan order: from the far end back to S, the worst order for Bellman-Ford
const EDGES = [['E', 'T', 1], ['D', 'T', 4], ['D', 'E', 2], ['C', 'E', 4], ['C', 'D', 1], ['B', 'D', 5], ['B', 'C', 3], ['A', 'B', -5], ['S', 'B', 2], ['S', 'A', 6]]
  .map(([u, v, w]) => ({ u: NAMES.indexOf(u), v: NAMES.indexOf(v), w }));
const NE = EDGES.length, NEG = EDGES.find(e => e.w < 0);
const INF = Infinity;
// Dijkstra: settle the nearest, relax its out-edges into unsettled nodes only
const DJ = (function () {
  const d = Array(V).fill(INF), done = Array(V).fill(false), steps = []; d[0] = 0;
  for (let k = 0; k < V; k++) {
    let u = -1; for (let i = 0; i < V; i++) if (!done[i] && d[i] < INF && (u < 0 || d[i] < d[u])) u = i;
    if (u < 0) break;
    done[u] = true;
    const ed = [];
    EDGES.forEach((e, j) => { if (e.u !== u) return; const cand = d[u] + e.w;
      if (done[e.v]) ed.push({ j, v: e.v, cand, upd: false, blocked: cand < d[e.v] });
      else if (cand < d[e.v]) { d[e.v] = cand; ed.push({ j, v: e.v, cand, upd: true }); } else ed.push({ j, v: e.v, cand, upd: false }); });
    steps.push({ u, du: d[u], ed, d: d.slice(), done: done.slice() });
  }
  return steps;
})();
const DJD = DJ[DJ.length - 1].d;
// Bellman-Ford: every edge, in order, until a round changes nothing (at most V rounds)
const BF = (function () {
  const d = Array(V).fill(INF), checks = [], rounds = []; d[0] = 0;
  for (let r = 0; r < V; r++) {
    let ch = 0;
    EDGES.forEach((e, j) => { const cand = d[e.u] + e.w, upd = d[e.u] < INF && cand < d[e.v];
      if (upd) { d[e.v] = cand; ch++; } checks.push({ r, j, cand: d[e.u] < INF ? cand : INF, upd, d: d.slice() }); });
    rounds.push(ch);
    if (!ch) break;
  }
  return { checks, rounds, d: d.slice() };
})();
const ROUNDS = BF.rounds.length, CHECKS = BF.checks.length, RELAX = BF.checks.filter(c => c.upd).length;
const QUIET = BF.rounds[ROUNDS - 1] === 0;
const WRONG = DJD.filter((x, i) => x !== BF.d[i]).length;
const BLOCK = DJ.flatMap(s => s.ed.filter(e => e.blocked).map(e => ({ u: s.u, ...e })))[0];
const fmtD = x => x === INF ? '∞' : String(x).replace('-', '−');
const EN = e => `${NAMES[e.u]} → ${NAMES[e.v]}`;

// ---- timeline -------------------------------------------------------------------------------
function buildTL(o) {
  const T = Object.assign({}, o);
  T.pops = DJ.map((_, k) => T.d0 + k * T.pop);
  T.d1 = T.d0 + DJ.length * T.pop; T.dHold = T.d1 + T.dH;
  T.rs = []; let t = T.dHold + T.xf;
  for (let r = 0; r < ROUNDS; r++) { T.rs.push(t + T.rgap); t += T.rgap + NE * T.chk + T.rtail; }
  T.b0 = T.dHold + T.xf; T.b1 = t; T.calm = T.b1 + T.hold; T.end = Math.round(T.calm + T.calmT);
  T.chkAt = c => T.rs[BF.checks[c].r] + BF.checks[c].j * T.chk;
  const blockPop = T.pops[DJ.findIndex(s => s.u === BLOCK.u)];
  T.caps = [
    [T.g0, T.d0 - 2, `${V} nodes, ${NE} one-way edges, one weight below zero:|${EN(NEG)} costs ${fmtD(NEG.w)}.`],
    [T.d0, blockPop - 2, 'Dijkstra settles the nearest node for good|and never comes back to it.'],
    [blockPop, T.d1 - 2, `${NAMES[BLOCK.v]} was settled at ${fmtD(DJ.find(s => s.u === BLOCK.v).du)} before ${NAMES[BLOCK.u]} was reached:|the ${fmtD(NEG.w)} edge is ignored.`],
    [T.d1, T.b0 - 2, `Dijkstra says ${NAMES[TGT]} = ${DJD[TGT]}.|${WRONG} of ${V} distances are too high.`],
    [T.b0, T.rs[2] - 2, 'Bellman-Ford relaxes every edge, in the same order,|round after round, until nothing changes.'],
    [T.rs[2], T.rs[ROUNDS - 1] - 2, 'Round k fixes every shortest path of k edges:|' + `${V - 1} rounds are always enough for ${V} nodes.`],
    [T.rs[ROUNDS - 1], T.calm - 2, `Round ${ROUNDS} changes nothing,|so no negative cycle can be reached.`],
  ];
  return T;
}
/** Distances shown at frame f, and which act the frame is in. */
function stateAt(T, f) {
  if (f < T.b0) {
    let k = -1; for (let q = 0; q < DJ.length; q++) if (f >= T.pops[q] + T.pop * 0.35) k = q;
    return { act: 'D', k, d: k >= 0 ? DJ[k].d : [0, INF, INF, INF, INF, INF, INF], done: k >= 0 ? DJ[k].done : Array(V).fill(false) };
  }
  let c = -1; for (let q = 0; q < CHECKS; q++) { if (f >= T.chkAt(q) + T.chk * 0.5) c = q; else break; }
  return { act: 'B', c, d: c >= 0 ? BF.checks[c].d : [0, INF, INF, INF, INF, INF, INF] };
}

// ---- drawing ------------------------------------------------------------------------------
const NP = (G, i) => [G.gx + POS[i][0] * G.gw, G.gy + POS[i][1] * G.gh];
function arrow(g, a, b, r, lw, col, alpha) {
  const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L;
  const x0 = a[0] + ux * r, y0 = a[1] + uy * r, x1 = b[0] - ux * (r + 4), y1 = b[1] - uy * (r + 4), hs = 10 + lw * 2;
  g.save(); g.globalAlpha = alpha; g.strokeStyle = col; g.fillStyle = col; g.lineWidth = lw; g.lineCap = 'round';
  g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1 - ux * hs * 0.6, y1 - uy * hs * 0.6); g.stroke();
  g.beginPath(); g.moveTo(x1, y1); g.lineTo(x1 - ux * hs - uy * hs * 0.55, y1 - uy * hs + ux * hs * 0.55); g.lineTo(x1 - ux * hs + uy * hs * 0.55, y1 - uy * hs - ux * hs * 0.55); g.closePath(); g.fill();
  g.restore();
}
function graph(g, G, f, S) {
  const T = G.TL, [a] = env(f, T.g0 - 6, T.end + 14, 16, 20);
  if (a <= 0) return;
  // which edge is lit: Dijkstra = out-edges of the node being settled; Bellman-Ford = the edge being checked
  let lit = -1, litCol = C.accent, blockLit = false;
  const hot = new Map();
  if (S.act === 'D') {
    for (let q = 0; q < DJ.length; q++) {
      const t0 = T.pops[q]; if (f < t0 || f >= t0 + T.pop) continue;
      DJ[q].ed.forEach(e => hot.set(e.j, e.blocked ? C.no : e.upd ? C.go : C.accent));
      if (DJ[q].ed.some(e => e.blocked)) blockLit = true;
    }
  } else {
    for (let q = 0; q < CHECKS; q++) { const t0 = T.chkAt(q); if (f >= t0 && f < t0 + T.chk + (BF.checks[q].upd ? 6 : 0)) { lit = BF.checks[q].j; litCol = BF.checks[q].upd ? C.go : C.accent; } }
  }
  EDGES.forEach((e, j) => {
    const p0 = NP(G, e.u), p1 = NP(G, e.v), ia = a * E.outCubic(prog(f, T.g0 + 4 + j * 2, T.g0 + 18 + j * 2));
    const isHot = hot.has(j) || lit === j, col = isHot ? (hot.get(j) || litCol) : e.w < 0 ? C.no : 'rgba(241,238,230,0.45)';
    arrow(g, p0, p1, G.r, isHot ? G.lw * 1.8 : G.lw, col, ia);
    const mx = (p0[0] + p1[0]) / 2, my = (p0[1] + p1[1]) / 2, dx = p1[0] - p0[0], dy = p1[1] - p0[1], L = Math.hypot(dx, dy);
    const side = e.u === 0 ? -1 : 1, ox = -dy / L * G.wo * side, oy = dx / L * G.wo * side;
    g.save(); g.globalAlpha = ia; g.fillStyle = C.bg; g.beginPath(); g.roundRect(mx + ox - 30, my + oy - 21, 60, 42, 10); g.fill(); g.restore();
    text(g, fmtD(e.w), mx + ox, my + oy + 2, { size: G.ws, weight: 850, color: e.w < 0 ? C.no : isHot ? col : C.paper, align: 'center', base: 'middle', fam: MONO, alpha: ia });
  });
  // the refused edge: a cross on it while A is being settled
  if (blockLit && BLOCK) {
    const q = DJ.findIndex(s => s.u === BLOCK.u), t0 = T.pops[q], k = E.outBack(prog(f, t0 + 4, t0 + 14));
    const e = EDGES[BLOCK.j], p0 = NP(G, e.u), p1 = NP(G, e.v), mx = lerp(p0[0], p1[0], 0.62), my = lerp(p0[1], p1[1], 0.62), s = 16 * clamp(k);
    g.save(); g.globalAlpha = a; g.strokeStyle = C.no; g.lineWidth = 7; g.lineCap = 'round';
    g.beginPath(); g.moveTo(mx - s, my - s); g.lineTo(mx + s, my + s); g.moveTo(mx + s, my - s); g.lineTo(mx - s, my + s); g.stroke(); g.restore();
  }
  // nodes and their distances
  const fin = f >= T.b1 ? E.outCubic(prog(f, T.b1, T.b1 + 16)) : 0;
  for (let i = 0; i < V; i++) {
    const [x, y] = NP(G, i), ia = a * E.outBack(prog(f, T.g0 + i * 3, T.g0 + 14 + i * 3));
    const settled = S.act === 'D' && S.done[i];
    g.save(); g.globalAlpha = a; g.translate(x, y); g.scale(clamp(ia, 0, 1.2), clamp(ia, 0, 1.2));
    g.fillStyle = i === 0 ? C.accent : C.node; g.beginPath(); g.arc(0, 0, G.r, 0, Math.PI * 2); g.fill();
    g.strokeStyle = settled ? C.blue : i === TGT ? C.accent : 'rgba(241,238,230,0.5)'; g.lineWidth = settled ? 6 : 3; g.stroke();
    g.restore();
    text(g, NAMES[i], x, y + 2, { size: G.ns, weight: 900, color: i === 0 ? C.bg : C.paper, align: 'center', base: 'middle', alpha: a * clamp(ia) });
    // distance tag above the node
    const d = S.d[i];
    let flash = 0;
    if (S.act === 'B' && S.c >= 0) { for (let q = Math.max(0, S.c - 3); q <= S.c; q++) { const ck = BF.checks[q]; if (ck.upd && EDGES[ck.j].v === i) flash = Math.max(flash, 1 - prog(f, T.chkAt(q) + T.chk * 0.5, T.chkAt(q) + T.chk * 0.5 + 16)); } }
    if (S.act === 'D' && S.k >= 0) { const st = DJ[S.k]; if (st.ed.some(e => e.v === i && e.upd)) flash = Math.max(flash, 1 - prog(f, T.pops[S.k] + T.pop * 0.35, T.pops[S.k] + T.pop * 0.35 + 16)); }
    const tx = x + G.tagDx[i], ty = y + G.tagDy[i];
    const col = flash > 0.05 ? C.go : S.act === 'D' ? (settled ? C.blue : C.paper) : fin > 0 ? C.accent : C.paper;
    text(g, fmtD(d), tx, ty, { size: G.ds * (1 + 0.2 * flash), weight: 900, color: col, align: 'center', base: 'middle', fam: MONO, alpha: a * clamp(ia) });
    // at the end: Dijkstra's wrong value, struck through, beside the right one
    if (fin > 0 && DJD[i] !== BF.d[i]) {
      const wx = tx + G.ds * 1.25, wy = ty;
      text(g, fmtD(DJD[i]), wx, wy, { size: G.ds * 0.75, weight: 800, color: C.no, align: 'center', base: 'middle', fam: MONO, alpha: a * fin });
      g.save(); g.globalAlpha = a * fin; g.strokeStyle = C.no; g.lineWidth = 3; g.beginPath(); g.moveTo(wx - G.ds * 0.45 * fin, wy); g.lineTo(wx + G.ds * 0.45 * fin, wy); g.stroke(); g.restore();
    }
  }
}
/** The side panel: Dijkstra's settle order, then the edge list being scanned. */
function panel(g, G, f, S) {
  const T = G.TL, P = G.P;
  const [aD, dyD] = env(f, T.d0 - 4, T.b0 + 4, 12, 12);
  if (aD > 0) {
    text(g, 'DIJKSTRA  ·  SETTLED', P.x, P.y, { size: 28, weight: 800, color: C.blue, spacing: 4, alpha: aD });
    DJ.forEach((s, q) => {
      const ka = aD * E.outCubic(prog(f, T.pops[q] + 4, T.pops[q] + 14)); if (ka <= 0) return;
      const [cx, cy] = P.cell(q), wrong = s.du !== BF.d[s.u];
      text(g, `${q + 1}.`, cx, cy + dyD, { size: P.fs, weight: 700, color: C.dim, fam: MONO, alpha: ka });
      text(g, `${NAMES[s.u]}  ${fmtD(s.du)}`, cx + P.fs * 1.6, cy + dyD, { size: P.fs, weight: 850, color: f >= T.d1 && wrong ? C.no : C.paper, fam: MONO, alpha: ka });
    });
  }
  const [aB, dyB] = env(f, T.b0, T.end + 10, 12, 16);
  if (aB > 0) {
    const r = S.act === 'B' && S.c >= 0 ? BF.checks[S.c].r : 0;
    text(g, 'BELLMAN-FORD  ·  EDGES', P.x, P.y, { size: 28, weight: 800, color: C.go, spacing: 4, alpha: aB });
    EDGES.forEach((e, j) => {
      const [cx, cy] = P.cell(j), ka = aB * E.outCubic(prog(f, T.b0 + j * 2, T.b0 + 12 + j * 2));
      let cur = false, upd = false;
      for (let q = 0; q < CHECKS; q++) { const ck = BF.checks[q]; if (ck.j !== j) continue; const t0 = T.chkAt(q);
        if (f >= t0 && f < t0 + T.chk) cur = true; if (ck.upd && f >= t0 + T.chk * 0.5 && ck.r === r) upd = true; }
      if (cur) { g.save(); g.globalAlpha = ka; g.fillStyle = `rgba(${C.accentRGB},0.18)`; g.beginPath(); g.roundRect(cx - 14, cy - P.fs * 0.95, P.cw, P.fs * 1.4, 8); g.fill(); g.restore(); }
      text(g, EN(e), cx, cy + dyB, { size: P.fs, weight: 800, color: cur ? C.accent : C.paper, fam: MONO, alpha: ka });
      text(g, fmtD(e.w), cx + P.fs * 5.6, cy + dyB, { size: P.fs, weight: 850, color: e.w < 0 ? C.no : C.dim, fam: MONO, alpha: ka, align: 'right' });
      if (upd) text(g, '✓', cx + P.fs * 6.4, cy + dyB, { size: P.fs, weight: 900, color: C.go, fam: MONO, alpha: ka });

}
function caption(g, G, f) {
  for (const [t0, t1, str] of G.TL.caps) {
    const [a, dy] = env(f, t0, t1, 10, 8); if (a <= 0) continue;
    const [p1, p2] = str.split('|');
    if (G.capTwo) {
      text(g, p1, G.capX, G.capY + dy, { size: G.cap, weight: 850, color: C.paper, spacing: -1, alpha: a, max: G.capMax });
      text(g, p2, G.capX, G.capY + G.cap * 1.14 + dy, { size: G.cap, weight: 850, color: C.accent, spacing: -1, alpha: a, max: G.capMax });
    } else {
      const w1 = measure(g, p1 + ' ', G.cap, 850, FONT, -1), w2 = measure(g, p2, G.cap, 850, FONT, -1), sc = Math.min(1, G.capMax / (w1 + w2));
      const w = text(g, p1 + ' ', G.capX, G.capY + dy, { size: G.cap * sc, weight: 850, color: C.paper, spacing: -1, alpha: a });
      text(g, p2, G.capX + w, G.capY + dy, { size: G.cap * sc, weight: 850, color: C.accent, spacing: -1, alpha: a });
    }
  }
}
function readout(g, G, f, S) {
  const T = G.TL, [a] = env(f, T.g0 + 20, T.calm, 12, 10);
  if (a <= 0) return;
  let s;
  if (S.act === 'D') s = `settled ${S.k + 1} / ${V}  ·  ${NAMES[TGT]} = ${fmtD(S.d[TGT])}`;
  else {
    const c = S.c, r = c >= 0 ? BF.checks[c].r + 1 : 1, rel = BF.checks.slice(0, c + 1).filter(x => x.upd).length;

// ---- sound: a note per settled node, a buzz for the refused edge, a tick per edge check, a chime per relaxation ----
async function renderAudio(TL = TLL, frames = FRAMES) {
  const SR = 48000, dur = frames / FPS, LEN = Math.round(SR * dur);
  const ac = new OfflineAudioContext(2, LEN, SR);
  const at = fr => fr / FPS;
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -16; comp.ratio.value = 3; comp.attack.value = 0.005; comp.release.value = 0.25;
  const master = ac.createGain(); master.gain.value = 0.9; master.connect(comp).connect(ac.destination);
  master.gain.setValueAtTime(0.9, dur - 1.0); master.gain.linearRampToValueAtTime(0.0001, dur - 0.02);
  const rnd = mulberry32(0x69AD);
  const ir = ac.createBuffer(2, SR * 2, SR);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let k = 0; k < d.length; k++) d[k] = (rnd() * 2 - 1) * Math.pow(1 - k / d.length, 3); }
  const verb = ac.createConvolver(); verb.buffer = ir; const vg = ac.createGain(); vg.gain.value = 0.28; verb.connect(vg).connect(master);
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  const pluck = (t0, m, amp, pan, dec = 0.35, type = 'triangle') => {
    const o = ac.createOscillator(), g = ac.createGain(), p = ac.createStereoPanner(); o.type = type; o.frequency.value = hz(m);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(amp, t0 + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dec);
    p.pan.value = pan; o.connect(g).connect(p); p.connect(master); p.connect(verb); o.start(t0); o.stop(t0 + dec + 0.05);
  };
  const pad = (t0, t1, notes, amp, cutoff) => {
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = cutoff; lp.Q.value = 1; lp.connect(master); lp.connect(verb);
    notes.forEach((m, i) => { for (const det of [-6, 6]) {
      const o = ac.createOscillator(), g = ac.createGain(), p = ac.createStereoPanner(); o.type = 'sawtooth'; o.frequency.value = hz(m); o.detune.value = det;
      p.pan.value = (i / Math.max(1, notes.length - 1) - 0.5) * 0.8 * Math.sign(det);
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(amp, t0 + 0.8); g.gain.setValueAtTime(amp, Math.max(t0 + 0.8, t1 - 0.6)); g.gain.exponentialRampToValueAtTime(0.0001, t1 + 0.4);
      o.connect(g).connect(p).connect(lp); o.start(t0); o.stop(t1 + 0.45); } });
  };
  const PENTA = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24, 26, 28, 31, 33, 36];
  pad(0, at(TL.d1 + 4), [45, 52, 57, 60, 64], 0.011, 900);
  pad(at(TL.d1), at(TL.b0 + 4), [44, 51, 56, 59, 63], 0.011, 800);
  pad(at(TL.b0), at(TL.calm + 4), [41, 48, 53, 57, 60], 0.011, 1100);
  pad(at(TL.calm), at(TL.end + 50), [48, 55, 60, 64, 67], 0.012, 1300);
  DJ.forEach((s, q) => {
    pluck(at(TL.pops[q] + TL.pop * 0.35), 60 + PENTA[q], 0.05, -0.3 + q * 0.1, 0.5);
    if (s.ed.some(e => e.blocked)) [0, 1].forEach(k => pluck(at(TL.pops[q] + 8) + k * 0.07, 58 + k, 0.035, 0.3, 0.35, 'square'));
  });
  BF.checks.forEach((ck, q) => {
    const t0 = at(TL.chkAt(q));
    pluck(t0, 79 + PENTA[ck.j % 8], 0.012, (ck.j / (NE - 1) - 0.5) * 1.2, 0.08, 'sine');
    if (ck.upd) pluck(t0 + at(TL.chk * 0.5), 64 + PENTA[Math.min(12, 3 + Math.max(0, ck.d[EDGES[ck.j].v]))], 0.045, 0, 0.45);
  });
  [60, 64, 67, 72].forEach((m, i) => pluck(at(TL.calm) + i * 0.09, m, 0.05, -0.3 + i * 0.2, 1.6, 'sine'));
  [76, 81, 84, 88].forEach((m, i) => pluck(at(TL.end + 10 + i * 6), m, 0.05, -0.45 + i * 0.3, 1.8, 'sine'));
  const buf = await ac.startRendering();
  let peak = 0; for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let k = 0; k < d.length; k++) peak = Math.max(peak, Math.abs(d[k])); }
  const norm = 0.85 / Math.max(peak, 1e-6);                          // every piece peaks at the same level
  for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let k = 0; k < d.length; k++) d[k] *= norm; }
  return buf;
}

/* ==========================================================================
   VERTICAL CUT — shared block, identical in every piece.
   1080x1920 for Reels, Shorts and TikTok (__motion.variants.vertical). The
   piece's own scene code is re-used and recomposed for a phone: everything a
   viewer must read stays inside the area no platform covers (x 60..900,
   y 230..1400); outside it there is only dimmed texture.

const VW = 1080, VH = 1920, SAFE = { x: 60, y: 230, w: 840, h: 1170, r: 900, b: 1400 };
const vcv = document.createElement('canvas'); vcv.width = VW; vcv.height = VH;
const vx = vcv.getContext('2d', { willReadFrequently: true });   // CPU raster: identical pixels on every redraw
const VL = 96, VR = 864;                                          // text column inside the safe area

function vReset() {
  vx.setTransform(1, 0, 0, 1, 0, 0); vx.globalAlpha = 1; vx.globalCompositeOperation = 'source-over';
  vx.filter = 'none'; vx.shadowBlur = 0; vx.shadowColor = 'transparent'; vx.letterSpacing = '0px'; vx.setLineDash([]);
  vx.textAlign = 'left'; vx.textBaseline = 'alphabetic'; vx.lineCap = 'butt'; vx.lineJoin = 'miter';
}
/** Canvas text on the vertical frame; `max` shrinks the size until the line fits. */
function vText(str, x, y, { size = 40, weight = 700, color = '#FFFFFF', align = 'left', spacing = 0, alpha = 1, fam = FONT, max = 0 } = {}) {
  if (alpha <= 0.002 || !str) return size;
  vx.font = `${weight} ${size}px ${fam}`; vx.letterSpacing = spacing + 'px';
  if (max) { const w = vx.measureText(str).width; if (w > max) { size = size * max / w; vx.font = `${weight} ${size}px ${fam}`; } }
  vx.textAlign = align; vx.textBaseline = 'alphabetic';
  const a0 = vx.globalAlpha; vx.globalAlpha = a0 * alpha; vx.fillStyle = color;
  vx.fillText(str, x + (align === 'center' ? spacing / 2 : align === 'right' ? spacing : 0), y);   // tracking is added after the last glyph too
  vx.globalAlpha = a0; vx.letterSpacing = '0px';
  return size;
}
/** Word-wraps with the given font; returns the lines. */
function vWrap(str, maxW, size, weight = 700, fam = FONT) {
  vx.font = `${weight} ${size}px ${fam}`; vx.letterSpacing = '0px';
  const words = str.split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (vx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur);
  return lines;
}
/** Fade envelope with a small rise: [alpha, dy]. */
function vEnv(v, a, b, fin = 8, fout = 8) {
  const i = E.outCubic(prog(v, a, a + fin)), o = 1 - E.inCubic(prog(v, b - fout, b));
  return [Math.min(i, o), (1 - i) * 22 - (1 - o) * 10];
}
/** Which segment of a cut list a vertical frame is in: segs = [{ at, src, len }] in frames. */
function vSeg(segs, v) {
  let k = 0; while (k < segs.length - 1 && v >= segs[k + 1].at) k++;
  const s = segs[k];
  return { k, s, local: v - s.at, src: s.src + (v - s.at) };
}
/** Dims everything outside the safe area to a quiet texture (brightness x 0.2), with a soft inner edge. */
function vShade(rgb, a = 0.8, feather = 40) {
  vx.save(); vx.setTransform(1, 0, 0, 1, 0, 0); vx.globalAlpha = 1; vx.globalCompositeOperation = 'source-over';
  vx.fillStyle = `rgba(${rgb},${a})`;
  vx.beginPath(); vx.rect(0, 0, VW, VH); vx.rect(SAFE.x, SAFE.y, SAFE.w, SAFE.h); vx.fill('evenodd');
  const strip = (x0, y0, x1, y1, rx, ry, rw, rh) => {
    const g = vx.createLinearGradient(x0, y0, x1, y1);
    g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`);
    vx.fillStyle = g; vx.fillRect(rx, ry, rw, rh);
  };
  strip(SAFE.x, 0, SAFE.x + feather, 0, SAFE.x, SAFE.y, feather, SAFE.h);
  strip(SAFE.r, 0, SAFE.r - feather, 0, SAFE.r - feather, SAFE.y, feather, SAFE.h);
  strip(0, SAFE.y, 0, SAFE.y + feather, SAFE.x, SAFE.y, SAFE.w, feather);
  strip(0, SAFE.b, 0, SAFE.b - feather, SAFE.x, SAFE.b - feather, SAFE.w, feather);
  vx.restore();
}
/** Series tag at the top of the safe area, e.g. MADE IN CODE · 04. */
function vTag(label, color, alpha = 1) {
  vText('MADE IN CODE', VL, 292, { size: 28, weight: 800, color, spacing: 5, alpha });
  vx.font = `800 28px ${FONT}`; vx.letterSpacing = '5px';
  const w = vx.measureText('MADE IN CODE').width; vx.letterSpacing = '0px';
  vText('·  ' + label, VL + w + 14, 292, { size: 28, weight: 600, color: 'rgba(255,255,255,0.72)', spacing: 3, alpha, max: VR - VL - w - 14 });
}
/** Big hook lines, left-aligned from y0; visible from frame 0, settles in a few frames. */
function vHook(v, lines, y0, { size = 84, lh = 1.08, color = '#FFFFFF', accent = null, weight = 800, spacing = -1.5, alpha = 1 } = {}) {
  const k = E.outExpo(prog(v, -6, 12));
  lines.forEach((ln, i) => {
    const kk = E.outExpo(prog(v, -12 + i * 2, 8 + i * 2));
    vText(ln, VL, y0 + i * size * lh + (1 - kk) * 30, { size, weight, spacing, color: accent && i === lines.length - 1 ? accent : color, alpha: alpha * Math.max(0.25, kk), max: VR - VL });
  });
  return k;
}
/** Closing card, the last 60 frames: piece title, "drawn in code · bytepatterns.com". l = frames into the card. */
function vEndCard(l, { title, line = '', ink = '#FFFFFF', dim = 'rgba(255,255,255,0.66)', accent = '#FFFFFF', scrim = '0,0,0', a = 0.84 }) {
  const k = E.outCubic(prog(l, 0, 12));
  vx.save(); vx.setTransform(1, 0, 0, 1, 0, 0);
  vx.fillStyle = `rgba(${scrim},${a * k})`; vx.fillRect(0, 0, VW, VH);
  vx.restore();
  const t1 = E.outExpo(prog(l, 3, 19)), t2 = E.outExpo(prog(l, 11, 27)), t3 = E.outExpo(prog(l, 19, 35));
  vx.fillStyle = accent; vx.globalAlpha = t1; vx.fillRect(VL, 742, 88 * t1, 7); vx.globalAlpha = 1;
  const size = vText(title, VL, 850 + (1 - t1) * 40, { size: 92, weight: 800, color: ink, spacing: -2, alpha: t1, max: VR - VL });
  const y2 = 850 + Math.max(size, 60) * 0.25 + 70;
  vx.font = `600 44px ${FONT}`;
  const lead = 'drawn in code  ·  ', lw = vx.measureText(lead).width;
  vText(lead, VL, y2 + (1 - t2) * 24, { size: 44, weight: 600, color: dim, alpha: t2 });
  vText('bytepatterns.com', VL + lw, y2 + (1 - t2) * 24, { size: 44, weight: 800, color: accent, alpha: t2 });
  if (line) vText(line, VL, y2 + 72 + (1 - t3) * 18, { size: 32, weight: 500, color: dim, alpha: t3, max: VR - VL });
}
/** Seeks a cut. The first frame a page draws is drawn twice: the very first read of a
 *  GPU-backed source canvas can come out a shade different from every later one. */
let vWarm = false;
function vSeek(draw, i, frames) {
  const f = Math.max(0, Math.min(frames - 1, Math.floor(i)));
  if (!vWarm) { vWarm = true; draw(f); }
  draw(f);
}
/** The soundtrack of a cut: the piece's own audio() spliced to the same segments as the picture. */
async function vAudio(segs, frames, { xf = 0.025, fadeOut = 0.6, extra = null } = {}) {
  const src = await renderAudio();
  const SR = 48000, dur = frames / FPS, ac = new OfflineAudioContext(2, Math.round(SR * dur), SR);
  const out = ac.createGain(); out.connect(ac.destination);
  out.gain.setValueAtTime(1, 0); out.gain.setValueAtTime(1, dur - fadeOut); out.gain.linearRampToValueAtTime(0, dur - 0.01);
  segs.forEach((s, k) => {
    const at = s.at / FPS, off = s.src / FPS, d = s.len / FPS;
    const pre = k === 0 ? 0 : Math.min(xf, off), post = k === segs.length - 1 ? 0 : xf;
    const b = ac.createBufferSource(), g = ac.createGain(); b.buffer = src;
    g.gain.setValueAtTime(pre ? 0 : 1, at - pre);
    if (pre) g.gain.linearRampToValueAtTime(1, at + pre);
    if (post) { g.gain.setValueAtTime(1, at + d - post); g.gain.linearRampToValueAtTime(0, at + d + post); }
    b.connect(g).connect(out); b.start(at - pre, off - pre, d + pre + post);
  });
  if (extra) extra(ac, out);
  const buf = await ac.startRendering();
  let peak = 0; for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) peak = Math.max(peak, Math.abs(d[i])); }
  if (peak > 0.9) for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] *= 0.9 / peak; }
  return buf;

function vChime(ac, dest, at, freq, vol = 0.08) {
  for (const [mul, v, dec] of [[1, 1, 1.8], [2.01, 0.35, 0.8], [3.02, 0.12, 0.4]]) {
    const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.value = freq * mul;
    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol * v, at + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, at + dec);
    o.connect(g).connect(dest); o.start(at); o.stop(at + dec + 0.05);
  }
}

window.__motion = {
  title: 'Bellman-Ford: One Negative Edge',
  description: `${V} nodes and ${NE} one-way edges, one of them ${EN(NEG)} at ${NEG.w}: Dijkstra settles ${NAMES[BLOCK.v]} at ${DJ.find(s => s.u === BLOCK.v).du} before that edge can lower it, so ${WRONG} of ${V} distances come out too high and ${NAMES[TGT]} reads ${DJD[TGT]}; Bellman-Ford relaxes all ${NE} edges in the same order, round after round, changes something in ${BF.rounds.filter(x => x).length} rounds (${BF.rounds.filter(x => x).join(', ')} relaxations) and nothing in round ${ROUNDS}, which rules out a negative cycle, and finds ${NAMES[TGT]} = ${BF.d[TGT]} after ${CHECKS} edge checks and ${RELAX} relaxations.`,
  fps: FPS, width: W, height: H, frames: FRAMES,
  poster: Math.round(TLL.chkAt(38) + 2),
  gifStart: Math.floor(TLL.b0 / FPS),
  seek(i) { const f = Math.max(0, Math.min(FRAMES - 1, Math.floor(i))); if (f !== shown.L) { shown.L = f; draw(f); } },
  audio: () => renderAudio(TLL, FRAMES),
  variants: {
    vertical: {
      width: VW, height: VH, frames: VFR, canvas: vcv,
      poster: Math.round(TLV.chkAt(38) + 2), gifStart: Math.floor(TLV.b0 / FPS),
      seek(i) { const v = Math.max(0, Math.min(VFR - 1, Math.floor(i))); if (v !== shown.V) { shown.V = v; vSeek(vDraw, v, VFR); } },
      audio: () => renderAudio(TLV, VFR),
    },
  },
};


/* ==========================================================================
   PLAYER — identical in every piece; keep as is.
   Autoplays and loops, starts sound on the first click, ?frame=N pauses on a
   frame, ?variant=vertical plays the vertical cut (if the piece has one).
   When the renderer sets window.__MOTION_RENDER__ it stays out of the way.
   ========================================================================== */
(function player() {
  const btn = document.getElementById('sound'), q = new URLSearchParams(location.search);
  let M = window.__motion;
  const V = !window.__MOTION_RENDER__ && M.variants && M.variants[q.get('variant')];
  if (V) {                                                // show the variant's own canvas instead
    M = Object.assign({}, M, V);
    V.canvas.style.cssText = `width:min(100vw,calc(100vh*${V.width}/${V.height}));height:auto;aspect-ratio:${V.width}/${V.height}`;
    document.querySelector('canvas').replaceWith(V.canvas);
  }
  const dur = M.frames / M.fps;
  if (window.__MOTION_RENDER__) { btn.hidden = true; M.seek(0); return; }
  if (q.has('frame')) { btn.hidden = true; M.seek(+q.get('frame') || 0); return; }
  let t0 = performance.now(), ac = null, src = null, buf = null, paused = false, pausedAt = 0;
  const clock = () => ac && src ? (ac.currentTime - t0) : (performance.now() - t0) / 1000;
  function loop() {
    if (!paused) M.seek(Math.floor(((clock() % dur) + dur) % dur * M.fps));
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  btn.addEventListener('click', async () => {
    if (src) { src.stop(); src = null; btn.textContent = 'Click for sound'; t0 = performance.now(); return; }
    btn.textContent = 'Loading sound…';
    ac = ac || new AudioContext({ sampleRate: 48000 });
    buf = buf || await M.audio();
    await ac.resume();
    src = ac.createBufferSource(); src.buffer = buf; src.loop = true; src.connect(ac.destination);
    t0 = ac.currentTime + 0.05; src.start(t0);        // picture restarts from frame 0 in sync with the sound
    btn.textContent = 'Sound on — click to mute';
  });
  addEventListener('keydown', e => {
    if (e.code !== 'Space') return;
    e.preventDefault(); paused = !paused;
    if (ac) paused ? ac.suspend() : ac.resume();
    if (!ac) { if (paused) pausedAt = performance.now(); else t0 += performance.now() - pausedAt; }
  });
})();
</script>
