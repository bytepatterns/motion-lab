<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="teambytepatterns">
<meta name="description" content="Exactly 312 dots, one for every BytePatterns lesson, fly in and settle into the number 312, then sort themselves into the 30 modules they belong to.">
<title>312 Lessons — motion-lab</title>
<style>
  /* Player chrome. The piece itself lives entirely in the canvas. */
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; font: 500 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; }
  canvas { display: block; width: min(100vw, calc(100vh * 16 / 9)); height: auto; aspect-ratio: 16 / 9; }
  #sound { position: fixed; left: 16px; bottom: 16px; padding: 8px 14px; border: 1px solid rgba(255,255,255,.35); border-radius: 999px;
           background: rgba(0,0,0,.55); color: #fff; font: inherit; cursor: pointer; }
  #sound[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080" aria-label="Particles gather into the number 312, then re-sort into thirty columns, one per module"></canvas>
<button id="sound" type="button">Click for sound</button>
<script>
'use strict';
/* ==========================================================================
   PIECE — 312 Lessons.
   There are exactly 312 bright dots: one per lesson in the BytePatterns
   course, grouped by the 30 modules they belong to (the counts below come
   from the lesson manifest). They drift in a flow, then land on points
   sampled inside the glyphs "312" — module by module, so the number writes
   itself left to right. Then each dot flies to its module's column: the
   columns are the real module sizes, from 4 lessons to 25. A few thousand
   faint specks fill the glyphs around them; they are texture, not lessons.
   Determinism: the glyph masks are drawn once at load; each dot's position
   is a closed-form function of the frame (flow = sums of sines, landing =
   eased blends with fixed, seeded timings).
   ========================================================================== */
const W = 1920, H = 1080, FPS = 30, FRAMES = 600;          // 20 s
const cv = document.getElementById('stage');
const ctx = cv.getContext('2d');
const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
const MONO = 'ui-monospace, "Cascadia Code", Consolas, Menlo, monospace';

// ---- helpers -------------------------------------------------------------
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (f, a, b) => clamp((f - a) / (b - a));
const smooth = t => t * t * (3 - 2 * t);
const E = {
  inCubic: t => t * t * t,
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inOutCubic: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outExpo: t => t === 1 ? 1 : 1 - Math.pow(2, -10 * t),
  inExpo: t => t === 0 ? 0 : Math.pow(2, 10 * t - 10),
  inOutExpo: t => t === 0 ? 0 : t === 1 ? 1 : t < .5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2,
  outBack: t => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2),
};
function text(g, str, x, y, { size = 40, weight = 600, color = '#fff', alpha = 1, spacing = 0, align = 'left', fam = FONT, base = 'alphabetic' } = {}) {
  if (alpha <= 0.002 || !str) return 0;
  g.font = `${weight} ${size}px ${fam}`; g.letterSpacing = spacing + 'px';
  g.textAlign = align; g.textBaseline = base;
  const a0 = g.globalAlpha; g.globalAlpha = a0 * alpha; g.fillStyle = color;
  g.fillText(str, x, y);
  const w = g.measureText(str).width;
  g.globalAlpha = a0; g.letterSpacing = '0px';
  return w;
}
const env = (f, a, b, fin = 12, fout = 10) => {
  const i = E.outCubic(prog(f, a, a + fin)), o = 1 - E.inCubic(prog(f, b - fout, b));
  return [Math.min(i, o), (1 - i) * 24 - (1 - o) * 10];
};

// ---- palette -------------------------------------------------------------
const C = { bg: '#0A0C14', bgRGB: '10,12,20', paper: '#F2EEE6', dim: 'rgba(242,238,230,0.64)', amber: '#F5B83D', teal: '#58C4B8' };
// module colour ramp: teal -> blue -> violet -> coral -> amber
const RAMP = [[88, 196, 184], [96, 150, 255], [150, 110, 240], [230, 96, 159], [255, 122, 89], [245, 184, 61]];
function rampAt(t) { const s = clamp(t) * (RAMP.length - 1), i = Math.min(RAMP.length - 2, Math.floor(s)), r = s - i;
  return RAMP[i].map((v, k) => Math.round(lerp(v, RAMP[i + 1][k], r))); }

// ---- the course: lessons per module, in course order (from the lesson manifest) ----
const MODULES = [
  ['big-o', 5], ['arrays', 14], ['strings', 11], ['searching', 8], ['sorting', 10], ['linked lists', 10], ['stacks & queues', 9],
  ['hash tables', 8], ['recursion', 8], ['backtracking', 5], ['greedy', 5], ['trees', 14], ['tries', 4], ['heaps', 7],
  ['two heaps & k-way', 4], ['graphs', 16], ['matrix & grid', 5], ['union-find', 4], ['intervals', 4], ['bit manipulation', 5],
  ['math & number theory', 5], ['dynamic programming', 20], ['system design', 17], ['system design cases', 20], ['ai & ml', 25],
  ['low-level design', 15], ['concurrency', 15], ['sql', 15], ['behavioral', 12], ['aws', 12],
];
const LESSONS = [];                                          // { m, j }: module index, index within the module
MODULES.forEach(([, n], m) => { for (let j = 0; j < n; j++) LESSONS.push({ m, j }); });
const NL = LESSONS.length, NM = MODULES.length;              // 312, 30
const MINM = Math.min(...MODULES.map(x => x[1])), MAXM = Math.max(...MODULES.map(x => x[1]));
const COL = MODULES.map((_, m) => rampAt(m / (NM - 1)));
const ND = 1500;                                             // faint specks (texture)

// ---- timeline ------------------------------------------------------------------------
const T = { gather: 36, word: 214, sort0: 336, sort1: 410, back0: 468, back1: 516, end: 528 };

// ---- sampling the glyphs, once per layout -----------------------------------------------
/** L = { w, h, size, x, y }: draws "312" into a mask and returns NL lesson targets and ND speck targets. */
function sampleGlyphs(L) {
  const m = document.createElement('canvas'); m.width = L.w; m.height = L.h;
  const g = m.getContext('2d', { willReadFrequently: true });
  g.fillStyle = '#fff'; g.font = `900 ${L.size}px ${FONT}`; g.letterSpacing = (L.track || 0) + 'px'; g.textBaseline = 'alphabetic';
  g.fillText(String(NL), L.x, L.y);
  const d = g.getImageData(0, 0, L.w, L.h).data, A = (x, y) => (x < 0 || y < 0 || x >= L.w || y >= L.h) ? 0 : d[(Math.floor(y) * L.w + Math.floor(x)) * 4 + 3];
  const deep = (x, y, r) => A(x, y) > 200 && A(x + r, y) > 128 && A(x - r, y) > 128 && A(x, y + r) > 128 && A(x, y - r) > 128;
  const grid = s => { const pts = []; for (let y = s / 2; y < L.h; y += s) for (let x = s / 2 + ((Math.round(y / s) % 2) * s / 2); x < L.w; x += s) if (deep(x, y, s * 0.3)) pts.push([x, y]); return pts; };
  let lo = 6, hi = 80;
  for (let k = 0; k < 30; k++) { const mid = (lo + hi) / 2; if (grid(mid).length >= NL) lo = mid; else hi = mid; }
  let pts = grid(lo);
  const r = mulberry32(0x312);
  while (pts.length > NL) pts.splice(Math.floor(r() * pts.length), 1);
  pts.sort((a, b) => (a[0] - b[0]) || (a[1] - b[1]));       // left to right: modules write the number in order
  const specks = [];
  for (let tries = 0; specks.length < ND && tries < 400000; tries++) { const x = r() * L.w, y = r() * L.h; if (A(x, y) > 128) specks.push([x, y]); }
  return { lessons: pts, specks, pitch: lo };
}

// ---- the particles ----------------------------------------------------------------------
function makeSeeds(n, seed, w, h) {
  const r = mulberry32(seed), out = [];
  for (let i = 0; i < n; i++) out.push({ hx: r() * (w + 400) - 200, hy: r() * (h + 200) - 100, a1: r() * 6.283, a2: r() * 6.283,
    w1: 0.35 + r() * 0.5, w2: 0.5 + r() * 0.7, A1: 50 + r() * 90, A2: 30 + r() * 60, vx: (r() - 0.5) * 50, vy: (r() - 0.5) * 30, d: r(), q: r() });
  return out;
}
function flow(s, t, out) {
  out[0] = s.hx + s.A1 * Math.sin(s.w1 * t + s.a1) + s.A2 * Math.sin(s.w2 * 1.7 * t + s.a2) + s.vx * t;
  out[1] = s.hy + s.A1 * 0.7 * Math.cos(s.w1 * 0.8 * t + s.a2) + s.A2 * Math.sin(s.w2 * t + s.a1) + s.vy * t;
  return out;
}
/** Everything that depends on the layout: glyph targets, columns, seeds. */
function makeScene(L) {
  const gs = sampleGlyphs(L);
  const S = { L, G: gs.lessons, D: gs.specks, pitch: gs.pitch, seeds: makeSeeds(NL, 0xA11CE, L.w, L.h), dseeds: makeSeeds(ND, 0xD057, L.w, L.h) };
  // columns: module m at x, lesson j stacked upward
  S.K = LESSONS.map(({ m, j }) => [L.cx0 + m * L.cpitch, L.cy1 - j * L.dpitch]);
  // timings: lessons land in course order (rank), specks at seeded times
  S.arr = LESSONS.map((_, i) => T.gather + 10 + i * 0.44);
  S.srt = LESSONS.map(({ m, j }) => T.sort0 + m * 1.4 + j * 0.5);
  S.bak = LESSONS.map((_, i) => T.back0 + (NL - 1 - i) * 0.05 + S.seeds[i].q * 8);
  return S;
}
const P = [0, 0], Q = [0, 0];
function lessonPos(S, i, f, out) {
  const s = S.seeds[i], t = f / FPS, G = S.G[i], K = S.K[i];
  const a = S.arr[i], u = E.inOutCubic(prog(f, a, a + 40));
  if (u < 1) {
    flow(s, t, P);
    out[0] = lerp(P[0], G[0], u); out[1] = lerp(P[1], G[1], u) - Math.sin(u * Math.PI) * 40 * (s.d - 0.5);
    return out;
  }
  const v = E.inOutCubic(prog(f, S.srt[i], S.srt[i] + 34)), b = E.inOutCubic(prog(f, S.bak[i], S.bak[i] + 30));
  const w = v * (1 - b);
  const lift = Math.sin(v * Math.PI) * (1 - b) * S.L.arc + Math.sin(b * Math.PI) * S.L.arc * 0.6;
  out[0] = lerp(G[0], K[0], w); out[1] = lerp(G[1], K[1], w) - lift;
  return out;
}
function speckPos(S, i, f, out) {
  const s = S.dseeds[i], t = f / FPS, G = S.D[i];
  const a = T.gather + s.d * 150, u = E.inOutCubic(prog(f, a, a + 50));
  const rel = E.inOutCubic(prog(f, T.sort0 - 6 + s.q * 20, T.sort0 + 40 + s.q * 20)) * (1 - E.inOutCubic(prog(f, T.back0 + s.q * 20, T.back0 + 40 + s.q * 12)));
  const k = u * (1 - rel);
  flow(s, t, P);
  out[0] = lerp(P[0], G[0], k); out[1] = lerp(P[1], G[1], k);
  return out;
}

// ---- drawing ----------------------------------------------------------------------------
function drawDots(g, S, f, alpha = 1) {
  const L = S.L;
  // specks
  g.fillStyle = 'rgba(242,238,230,0.55)';
  for (let i = 0; i < ND; i++) {
    speckPos(S, i, f, Q);
    if (Q[0] < -4 || Q[1] < -4 || Q[0] > L.w + 4 || Q[1] > L.h + 4) continue;
    g.globalAlpha = alpha * (0.35 + 0.35 * S.dseeds[i].q);
    g.fillRect(Q[0] - L.sp / 2, Q[1] - L.sp / 2, L.sp, L.sp);
  }
  g.globalAlpha = alpha;
  // a light that sweeps across the settled number once, when the word arrives
  const sweep = prog(f, T.word - 6, T.word + 40) * (L.w + 400) - 200;
  const r = L.r;
  for (let i = 0; i < NL; i++) {
    lessonPos(S, i, f, Q);
    const c = COL[LESSONS[i].m];
    const moving = f < S.arr[i] + 40 || (f > S.srt[i] && f < S.srt[i] + 34) || (f > S.bak[i] && f < S.bak[i] + 30);
    if (moving) {                                           // a short streak from where it was 2 frames ago
      lessonPos(S, i, f - 2, P);
      g.strokeStyle = `rgba(${c.join(',')},0.45)`; g.lineWidth = r * 1.3; g.lineCap = 'round';
      g.beginPath(); g.moveTo(P[0], P[1]); g.lineTo(Q[0], Q[1]); g.stroke();
    }
    const glow = Math.exp(-Math.pow((Q[0] - sweep) / 90, 2));
    g.fillStyle = `rgba(${c.map(v => Math.round(lerp(v, 255, glow * 0.7))).join(',')},1)`;
    g.beginPath(); g.arc(Q[0], Q[1], r * (1 + glow * 0.25), 0, Math.PI * 2); g.fill();
  }
  g.globalAlpha = 1;
}
/** The dot counter that ticks up as lessons land. */
const landed = (S, f) => { let n = 0; for (let i = 0; i < NL; i++) if (f >= S.arr[i] + 40) n++; return n; };
function backdrop(g, w, h) {
  g.fillStyle = C.bg; g.fillRect(0, 0, w, h);
  const gr = g.createRadialGradient(w * 0.5, h * 0.55, 30, w * 0.5, h * 0.55, Math.max(w, h) * 0.7);
  gr.addColorStop(0, 'rgba(36,40,78,0.7)'); gr.addColorStop(1, 'rgba(10,12,20,0)');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
}

// ---- landscape picture ------------------------------------------------------------------
const LAY_L = { w: W, h: H, size: 640, x: 150, y: 790, track: -18, r: 8.5, sp: 2.4, arc: 90,
  cx0: 150, cpitch: 56, cy1: 900, dpitch: 22 };
let SL = null;
function draw(f) {
  if (!SL) SL = makeScene(LAY_L);
  if (ctx.reset) ctx.reset();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none'; ctx.shadowBlur = 0;
  backdrop(ctx, W, H);
  const endK = E.inOutCubic(prog(f, T.end, T.end + 20)), a = 1 - endK;
  text(ctx, 'BYTEPATTERNS  ·  THE COURSE', 120, 104, { size: 26, weight: 600, color: C.dim, spacing: 5, alpha: a });
  const n = landed(SL, f);
  text(ctx, `${String(n).padStart(3)} / ${NL} lessons`, 1800, 104, { size: 30, weight: 700, fam: MONO, color: C.amber, align: 'right', alpha: a * E.outCubic(prog(f, T.gather, T.gather + 20)) });
  drawDots(ctx, SL, f);
  // hook
  {
    const k = E.outExpo(prog(f, -20, 4)), k2 = E.outExpo(prog(f, -16, 8)), o = 1 - E.inCubic(prog(f, 66, 86));
    const sc = ctx.createRadialGradient(420, 360, 40, 420, 360, 720);
    sc.addColorStop(0, `rgba(${C.bgRGB},${0.7 * o})`); sc.addColorStop(1, `rgba(${C.bgRGB},0)`);
    ctx.fillStyle = sc; ctx.fillRect(0, 0, W, H);
    text(ctx, 'Every dot', 116, 330 + (1 - k) * 30, { size: 132, weight: 850, color: C.paper, spacing: -3, alpha: Math.min(k, o) });
    text(ctx, 'is a lesson.', 116, 468 + (1 - k2) * 30, { size: 132, weight: 850, color: C.amber, spacing: -3, alpha: Math.min(k2, o) });
  }
  // the word
  {
    const [al, dy] = env(f, T.word, T.sort0 + 4, 14, 12);
    text(ctx, 'lessons', 1290, 700 + dy, { size: 150, weight: 850, color: C.paper, spacing: -4, alpha: al * a });
    text(ctx, `${NM} modules · one path`, 1298, 780 + dy, { size: 44, weight: 600, color: C.amber, alpha: al * a });
  }
  // the columns
  {
    const [al, dy] = env(f, T.sort1 - 20, T.back0 + 6, 14, 10);
    text(ctx, `${NM} modules`, 116, 290 + dy, { size: 110, weight: 850, color: C.paper, spacing: -3, alpha: al * a });
    text(ctx, `${MINM} to ${MAXM} lessons each, from Big-O to system design`, 122, 360 + dy, { size: 40, weight: 500, color: C.dim, alpha: al * a });
    MODULES.forEach(([, cnt], m) => {
      const k = E.outCubic(prog(f, SL.srt[LESSONS.findIndex(q => q.m === m)] + 30, SL.srt[LESSONS.findIndex(q => q.m === m)] + 44)) * (1 - E.inCubic(prog(f, T.back0 - 4, T.back0 + 6)));
      text(ctx, String(cnt), LAY_L.cx0 + m * LAY_L.cpitch, LAY_L.cy1 - (cnt - 1) * LAY_L.dpitch - 26, { size: 28, weight: 800, fam: MONO, color: `rgb(${COL[m].join(',')})`, align: 'center', alpha: k * a });
    });
    const k = E.outCubic(prog(f, T.sort1 - 10, T.sort1 + 8)) * (1 - E.inCubic(prog(f, T.back0 - 4, T.back0 + 6))) * a;
    text(ctx, 'big-o', LAY_L.cx0 - 12, 950, { size: 28, weight: 600, color: C.dim, alpha: k });
    text(ctx, 'aws', LAY_L.cx0 + (NM - 1) * LAY_L.cpitch + 12, 950, { size: 28, weight: 600, color: C.dim, align: 'right', alpha: k });
    text(ctx, 'ai & ml: 25', LAY_L.cx0 + 24 * LAY_L.cpitch, 990, { size: 28, weight: 600, color: C.dim, align: 'center', alpha: k });
  }
  if (endK > 0) {
    ctx.fillStyle = `rgba(${C.bgRGB},${0.8 * endK})`; ctx.fillRect(0, 0, W, H);
    const k1 = E.outCubic(prog(f, T.end + 6, T.end + 28)), k2 = E.outCubic(prog(f, T.end + 16, T.end + 38)), k3 = E.outCubic(prog(f, T.end + 26, T.end + 48));
    text(ctx, `${NL} Lessons`, W / 2, 500 + (1 - k1) * 30, { size: 150, weight: 850, color: C.paper, spacing: -4, align: 'center', alpha: k1 });
    text(ctx, `${NM} modules  ·  one dot each  ·  bytepatterns.com`, W / 2, 584 + (1 - k2) * 20, { size: 44, weight: 600, color: C.amber, align: 'center', alpha: k2 });
    text(ctx, 'bytepatterns · motion lab', W / 2, 1000, { size: 32, weight: 600, color: C.paper, spacing: 3, align: 'center', alpha: k3 * 0.8 });
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.letterSpacing = '0px';
}

// ---- sound: a grain per landing lesson, a note per module column, a warm pad -----------------
async function renderAudio() {
  if (!SL) SL = makeScene(LAY_L);
  const S = SL;
  const SR = 48000, dur = FRAMES / FPS, LEN = Math.round(SR * dur);
  const ac = new OfflineAudioContext(2, LEN, SR);
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -15; comp.ratio.value = 3; comp.attack.value = 0.006; comp.release.value = 0.22;
  const master = ac.createGain(); master.gain.value = 0.95; master.connect(comp).connect(ac.destination);
  master.gain.setValueAtTime(0.95, dur - 0.8); master.gain.linearRampToValueAtTime(0.0001, dur - 0.02);
  const rnd = mulberry32(0x3121E);
  const ir = ac.createBuffer(2, SR * 2.8, SR);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let k = 0; k < d.length; k++) d[k] = (rnd() * 2 - 1) * Math.pow(1 - k / d.length, 3.2); }
  const verb = ac.createConvolver(); verb.buffer = ir; const vg = ac.createGain(); vg.gain.value = 0.4; verb.connect(vg).connect(master);
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  const pad = (fa, fb, notes, amp) => { const a = fa / FPS, b = Math.min(dur, fb / FPS), lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1000; lp.connect(master); lp.connect(verb);
    for (const m of notes) for (const det of [-7, 7]) {
      const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = hz(m); o.detune.value = det;
      const g = ac.createGain(); g.gain.setValueAtTime(0, a); g.gain.linearRampToValueAtTime(amp, a + (fa === 0 ? 0.1 : 1.0));
      g.gain.setValueAtTime(amp, Math.max(a + 1, b - 0.9)); g.gain.linearRampToValueAtTime(0, b);
      o.connect(g).connect(lp); o.start(a); o.stop(b + 0.05);
    } };
  pad(0, 230, [38, 45, 50, 57, 62], 0.02); pad(210, 350, [43, 50, 55, 59, 62, 67], 0.022); pad(330, 480, [40, 47, 52, 55, 59], 0.02); pad(460, FRAMES, [38, 45, 50, 54, 57, 62], 0.022);
  const tone = (at, freq, amp, len, type = 'sine', pan = 0, wet = true) => { const o = ac.createOscillator(), g = ac.createGain(), p = ac.createStereoPanner();
    o.type = type; o.frequency.value = freq; p.pan.value = pan;
    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(amp, at + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, at + len);
    o.connect(g).connect(p); p.connect(master); if (wet) p.connect(verb); o.start(at); o.stop(at + len + 0.03); };
  const PENTA = [62, 64, 66, 69, 71, 74, 76, 78, 81, 83, 86];
  tone(0, 55, 0.5, 1.4); tone(0.02, hz(74), 0.08, 1.8);
  // a soft grain for every lesson that lands, pitched by its module
  for (let i = 0; i < NL; i++) {
    const at = (S.arr[i] + 40) / FPS + rnd() * 0.01, m = LESSONS[i].m;
    tone(at, hz(PENTA[m % PENTA.length]), 0.045, 0.16, 'triangle', (S.G[i][0] / LAY_L.w) * 1.4 - 0.7);
  }
  // the word
  tone(T.word / FPS, 50, 0.45, 1.2); [74, 78, 81, 86].forEach((m, k) => tone(T.word / FPS + k * 0.06, hz(m), 0.06, 1.6, 'sine', -0.4 + k * 0.27));
  // the columns: a note per module as its last lesson lands, higher for bigger modules
  MODULES.forEach(([, cnt], m) => {
    const last = LESSONS.findIndex(q => q.m === m) + cnt - 1, at = (S.srt[last] + 34) / FPS;
    tone(at, hz(55 + cnt), 0.08, 0.6, 'triangle', -0.7 + m / (NM - 1) * 1.4);
  });
  // back to the number: a whoosh of grains
  for (let k = 0; k < 40; k++) tone((T.back0 + 10 + k * 0.9) / FPS, hz(PENTA[(k * 3) % PENTA.length] + 12), 0.02, 0.12, 'sine', rnd() * 1.4 - 0.7);
  [69, 74, 78, 81].forEach((m, k) => tone((T.end + 8 + k * 6) / FPS, hz(m), 0.09, 1.8, 'sine', -0.45 + k * 0.3));
  const buf = await ac.startRendering();
  let peak = 0; for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let k = 0; k < d.length; k++) peak = Math.max(peak, Math.abs(d[k])); }
  if (peak > 0.89) for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let k = 0; k < d.length; k++) d[k] *= 0.89 / peak; }
  return buf;
}

/* ==========================================================================
   VERTICAL CUT — shared block, identical in every piece.
   1080x1920 for Reels, Shorts and TikTok (__motion.variants.vertical). The
   piece's own scene code is re-used and recomposed for a phone: everything a
   viewer must read stays inside the area no platform covers (x 60..900,
   y 230..1400); outside it there is only dimmed texture.
   ========================================================================== */
const VW = 1080, VH = 1920, SAFE = { x: 60, y: 230, w: 840, h: 1170, r: 900, b: 1400 };
const vcv = document.createElement('canvas'); vcv.width = VW; vcv.height = VH;
const vx = vcv.getContext('2d', { willReadFrequently: true });   // CPU raster: identical pixels on every redraw
const VL = 96, VR = 864;                                          // text column inside the safe area

function vReset() {
  vx.setTransform(1, 0, 0, 1, 0, 0); vx.globalAlpha = 1; vx.globalCompositeOperation = 'source-over';
  vx.filter = 'none'; vx.shadowBlur = 0; vx.shadowColor = 'transparent'; vx.letterSpacing = '0px'; vx.setLineDash([]);
  vx.textAlign = 'left'; vx.textBaseline = 'alphabetic'; vx.lineCap = 'butt'; vx.lineJoin = 'miter';
}
/** Canvas text on the vertical frame; `max` shrinks the size until the line fits. */
function vText(str, x, y, { size = 40, weight = 700, color = '#FFFFFF', align = 'left', spacing = 0, alpha = 1, fam = FONT, max = 0 } = {}) {
  if (alpha <= 0.002 || !str) return size;
  vx.font = `${weight} ${size}px ${fam}`; vx.letterSpacing = spacing + 'px';
  if (max) { const w = vx.measureText(str).width; if (w > max) { size = size * max / w; vx.font = `${weight} ${size}px ${fam}`; } }
  vx.textAlign = align; vx.textBaseline = 'alphabetic';
  const a0 = vx.globalAlpha; vx.globalAlpha = a0 * alpha; vx.fillStyle = color;
  vx.fillText(str, x + (align === 'center' ? spacing / 2 : align === 'right' ? spacing : 0), y);   // tracking is added after the last glyph too
  vx.globalAlpha = a0; vx.letterSpacing = '0px';
  return size;
}
/** Word-wraps with the given font; returns the lines. */
function vWrap(str, maxW, size, weight = 700, fam = FONT) {
  vx.font = `${weight} ${size}px ${fam}`; vx.letterSpacing = '0px';
  const words = str.split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (vx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur);
  return lines;
}
/** Fade envelope with a small rise: [alpha, dy]. */
function vEnv(v, a, b, fin = 8, fout = 8) {
  const i = E.outCubic(prog(v, a, a + fin)), o = 1 - E.inCubic(prog(v, b - fout, b));
  return [Math.min(i, o), (1 - i) * 22 - (1 - o) * 10];
}
/** Which segment of a cut list a vertical frame is in: segs = [{ at, src, len }] in frames. */
function vSeg(segs, v) {
  let k = 0; while (k < segs.length - 1 && v >= segs[k + 1].at) k++;
  const s = segs[k];
  return { k, s, local: v - s.at, src: s.src + (v - s.at) };
}
/** Dims everything outside the safe area to a quiet texture (brightness x 0.2), with a soft inner edge. */
function vShade(rgb, a = 0.8, feather = 40) {
  vx.save(); vx.setTransform(1, 0, 0, 1, 0, 0); vx.globalAlpha = 1; vx.globalCompositeOperation = 'source-over';
  vx.fillStyle = `rgba(${rgb},${a})`;
  vx.beginPath(); vx.rect(0, 0, VW, VH); vx.rect(SAFE.x, SAFE.y, SAFE.w, SAFE.h); vx.fill('evenodd');
  const strip = (x0, y0, x1, y1, rx, ry, rw, rh) => {
    const g = vx.createLinearGradient(x0, y0, x1, y1);
    g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`);
    vx.fillStyle = g; vx.fillRect(rx, ry, rw, rh);
  };
  strip(SAFE.x, 0, SAFE.x + feather, 0, SAFE.x, SAFE.y, feather, SAFE.h);
  strip(SAFE.r, 0, SAFE.r - feather, 0, SAFE.r - feather, SAFE.y, feather, SAFE.h);
  strip(0, SAFE.y, 0, SAFE.y + feather, SAFE.x, SAFE.y, SAFE.w, feather);
  strip(0, SAFE.b, 0, SAFE.b - feather, SAFE.x, SAFE.b - feather, SAFE.w, feather);
  vx.restore();
}
/** Series tag at the top of the safe area, e.g. MADE IN CODE · 04. */
function vTag(label, color, alpha = 1) {
  vText('MADE IN CODE', VL, 292, { size: 28, weight: 800, color, spacing: 5, alpha });
  vx.font = `800 28px ${FONT}`; vx.letterSpacing = '5px';
  const w = vx.measureText('MADE IN CODE').width; vx.letterSpacing = '0px';
  vText('·  ' + label, VL + w + 14, 292, { size: 28, weight: 600, color: 'rgba(255,255,255,0.72)', spacing: 3, alpha, max: VR - VL - w - 14 });
}
/** Big hook lines, left-aligned from y0; visible from frame 0, settles in a few frames. */
function vHook(v, lines, y0, { size = 84, lh = 1.08, color = '#FFFFFF', accent = null, weight = 800, spacing = -1.5, alpha = 1 } = {}) {
  const k = E.outExpo(prog(v, -6, 12));
  lines.forEach((ln, i) => {
    const kk = E.outExpo(prog(v, -12 + i * 2, 8 + i * 2));
    vText(ln, VL, y0 + i * size * lh + (1 - kk) * 30, { size, weight, spacing, color: accent && i === lines.length - 1 ? accent : color, alpha: alpha * Math.max(0.25, kk), max: VR - VL });
  });
  return k;
}
/** Closing card, the last 60 frames: piece title, "drawn in code · bytepatterns.com". l = frames into the card. */
function vEndCard(l, { title, line = '', ink = '#FFFFFF', dim = 'rgba(255,255,255,0.66)', accent = '#FFFFFF', scrim = '0,0,0', a = 0.84 }) {
  const k = E.outCubic(prog(l, 0, 12));
  vx.save(); vx.setTransform(1, 0, 0, 1, 0, 0);
  vx.fillStyle = `rgba(${scrim},${a * k})`; vx.fillRect(0, 0, VW, VH);
  vx.restore();
  const t1 = E.outExpo(prog(l, 3, 19)), t2 = E.outExpo(prog(l, 11, 27)), t3 = E.outExpo(prog(l, 19, 35));
  vx.fillStyle = accent; vx.globalAlpha = t1; vx.fillRect(VL, 742, 88 * t1, 7); vx.globalAlpha = 1;
  const size = vText(title, VL, 850 + (1 - t1) * 40, { size: 92, weight: 800, color: ink, spacing: -2, alpha: t1, max: VR - VL });
  const y2 = 850 + Math.max(size, 60) * 0.25 + 70;
  vx.font = `600 44px ${FONT}`;
  const lead = 'drawn in code  ·  ', lw = vx.measureText(lead).width;
  vText(lead, VL, y2 + (1 - t2) * 24, { size: 44, weight: 600, color: dim, alpha: t2 });
  vText('bytepatterns.com', VL + lw, y2 + (1 - t2) * 24, { size: 44, weight: 800, color: accent, alpha: t2 });
  if (line) vText(line, VL, y2 + 72 + (1 - t3) * 18, { size: 32, weight: 500, color: dim, alpha: t3, max: VR - VL });
}
/** Seeks a cut. The first frame a page draws is drawn twice: the very first read of a
 *  GPU-backed source canvas can come out a shade different from every later one. */
let vWarm = false;
function vSeek(draw, i, frames) {
  const f = Math.max(0, Math.min(frames - 1, Math.floor(i)));
  if (!vWarm) { vWarm = true; draw(f); }
  draw(f);
}
/** The soundtrack of a cut: the piece's own audio() spliced to the same segments as the picture. */
async function vAudio(segs, frames, { xf = 0.025, fadeOut = 0.6, extra = null } = {}) {
  const src = await renderAudio();
  const SR = 48000, dur = frames / FPS, ac = new OfflineAudioContext(2, Math.round(SR * dur), SR);
  const out = ac.createGain(); out.connect(ac.destination);
  out.gain.setValueAtTime(1, 0); out.gain.setValueAtTime(1, dur - fadeOut); out.gain.linearRampToValueAtTime(0, dur - 0.01);
  segs.forEach((s, k) => {
    const at = s.at / FPS, off = s.src / FPS, d = s.len / FPS;
    const pre = k === 0 ? 0 : Math.min(xf, off), post = k === segs.length - 1 ? 0 : xf;
    const b = ac.createBufferSource(), g = ac.createGain(); b.buffer = src;
    g.gain.setValueAtTime(pre ? 0 : 1, at - pre);
    if (pre) g.gain.linearRampToValueAtTime(1, at + pre);
    if (post) { g.gain.setValueAtTime(1, at + d - post); g.gain.linearRampToValueAtTime(0, at + d + post); }
    b.connect(g).connect(out); b.start(at - pre, off - pre, d + pre + post);
  });
  if (extra) extra(ac, out);
  const buf = await ac.startRendering();
  let peak = 0; for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) peak = Math.max(peak, Math.abs(d[i])); }
  if (peak > 0.9) for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] *= 0.9 / peak; }
  return buf;
}
/** A soft three-partial bell, for the closing card. */
function vChime(ac, dest, at, freq, vol = 0.08) {
  for (const [mul, v, dec] of [[1, 1, 1.8], [2.01, 0.35, 0.8], [3.02, 0.12, 0.4]]) {
    const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.value = freq * mul;
    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol * v, at + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, at + dec);
    o.connect(g).connect(dest); o.start(at); o.stop(at + dec + 0.05);
  }
}

/* VERTICAL CUT — this piece */
// The same particles on a portrait stage: "312" across the safe area, the 30
// module columns narrower and shorter under the type.
const VSEG = [
  { at: 0, src: 20, len: 190 },                              // hook, the lessons land
  { at: 190, src: T.word, len: 100 },                        // "lessons"
  { at: 290, src: T.sort0, len: 190 },                       // the modules, and back
  { at: 480, src: T.end + 2, len: 60 },                      // closing card
];
const VFR = 540, VEND = VFR - 60;
const LAY_V = { w: VW, h: VH, size: 400, x: 96, y: 1050, track: -12, r: 6.2, sp: 2.2, arc: 60,
  cx0: 110, cpitch: 25.5, cy1: 1180, dpitch: 13.5 };
let SV = null;
function vDraw(v) {
  if (!SV) SV = makeScene(LAY_V);
  const { k: seg, src } = vSeg(VSEG, v), f = Math.min(FRAMES - 1, src);
  vReset();
  backdrop(vx, VW, VH);
  drawDots(vx, SV, f);
  vShade(C.bgRGB, 0.84);
  vTag('THE COURSE', C.amber);
  if (seg === 0) {
    const o = 1 - E.inCubic(prog(v, 150, 170));
    vHook(v, ['Every dot', 'is a lesson.'], 440, { size: 104, color: C.paper, accent: C.amber, alpha: o });
    vText(`${String(landed(SV, f)).padStart(3)} / ${NL}`, VL, 1360, { size: 44, weight: 800, fam: MONO, color: C.amber, alpha: E.outCubic(prog(v, 20, 36)) });
  } else if (seg === 1) {
    const [al, dy] = vEnv(v, 190, 290, 10, 8);
    vText('lessons', VL, 1250 + dy, { size: 120, weight: 850, color: C.paper, spacing: -3, alpha: al });
    vText(`${NM} modules · one path`, VL, 1330 + dy, { size: 44, weight: 600, color: C.amber, alpha: al });
  } else {
    const [al, dy] = vEnv(v, 330, VEND + 2, 10, 8);
    vText(`${NM} modules`, VL, 440 + dy, { size: 104, weight: 850, color: C.paper, spacing: -3, alpha: al });
    vText(`${MINM} to ${MAXM} lessons each`, VL, 510 + dy, { size: 40, weight: 500, color: C.dim, alpha: al });
    vText('from Big-O to system design', VL, 1300 + dy, { size: 36, weight: 600, color: C.amber, alpha: al * (1 - prog(f, T.back0, T.back0 + 10)), max: VR - VL });
  }
  if (v >= VEND) vEndCard(v - VEND, { title: `${NL} Lessons`, line: `${NM} modules · one dot per lesson`,
    ink: C.paper, dim: 'rgba(242,238,230,0.72)', accent: C.amber, scrim: C.bgRGB, a: 0.84 });
  vReset();
}

window.__motion = {
  title: '312 Lessons',
  description: `Exactly ${NL} dots, one for every BytePatterns lesson, fly in and settle into the number ${NL}, then sort themselves into the ${NM} modules they belong to.`,
  fps: FPS, width: W, height: H, frames: FRAMES,
  poster: 300,
  gifStart: 7.5,
  seek(i) { draw(Math.max(0, Math.min(FRAMES - 1, Math.floor(i)))); },
  audio: renderAudio,
  variants: {
    vertical: {
      width: VW, height: VH, frames: VFR, canvas: vcv,
      poster: 250, gifStart: 6,
      seek(i) { vSeek(vDraw, i, VFR); },
      audio: () => { if (!SL) SL = makeScene(LAY_L); return vAudio(VSEG, VFR); },
    },
  },
};

/* ==========================================================================
   PLAYER — identical in every piece; keep as is.
   Autoplays and loops, starts sound on the first click, ?frame=N pauses on a
   frame, ?variant=vertical plays the vertical cut (if the piece has one).
   When the renderer sets window.__MOTION_RENDER__ it stays out of the way.
   ========================================================================== */
(function player() {
  const btn = document.getElementById('sound'), q = new URLSearchParams(location.search);
  let M = window.__motion;
  const V = !window.__MOTION_RENDER__ && M.variants && M.variants[q.get('variant')];
  if (V) {                                                // show the variant's own canvas instead
    M = Object.assign({}, M, V);
    V.canvas.style.cssText = `width:min(100vw,calc(100vh*${V.width}/${V.height}));height:auto;aspect-ratio:${V.width}/${V.height}`;
    document.querySelector('canvas').replaceWith(V.canvas);
  }
  const dur = M.frames / M.fps;
  if (window.__MOTION_RENDER__) { btn.hidden = true; M.seek(0); return; }
  if (q.has('frame')) { btn.hidden = true; M.seek(+q.get('frame') || 0); return; }
  let t0 = performance.now(), ac = null, src = null, buf = null, paused = false, pausedAt = 0;
  const clock = () => ac && src ? (ac.currentTime - t0) : (performance.now() - t0) / 1000;
  function loop() {
    if (!paused) M.seek(Math.floor(((clock() % dur) + dur) % dur * M.fps));
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  btn.addEventListener('click', async () => {
    if (src) { src.stop(); src = null; btn.textContent = 'Click for sound'; t0 = performance.now(); return; }
    btn.textContent = 'Loading sound…';
    ac = ac || new AudioContext({ sampleRate: 48000 });
    buf = buf || await M.audio();
    await ac.resume();
    src = ac.createBufferSource(); src.buffer = buf; src.loop = true; src.connect(ac.destination);
    t0 = ac.currentTime + 0.05; src.start(t0);        // picture restarts from frame 0 in sync with the sound
    btn.textContent = 'Sound on — click to mute';
  });
  addEventListener('keydown', e => {
    if (e.code !== 'Space') return;
    e.preventDefault(); paused = !paused;
    if (ac) paused ? ac.suspend() : ac.resume();
    if (!ac) { if (paused) pausedAt = performance.now(); else t0 += performance.now() - pausedAt; }
  });
})();
</script>
