<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="teambytepatterns">
<meta name="description" content="A real quick sort of sixteen numbers with the Lomuto partition, danced out: the last number is the pivot, every smaller one hops left of a moving wall, one tick per swap.">
<title>Quick Sort: The Partition Dance — motion-lab</title>
<style>
  /* Player chrome. The piece itself lives entirely in the canvas. */
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; font: 500 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; }
  canvas { display: block; width: min(100vw, calc(100vh * 16 / 9)); height: auto; aspect-ratio: 16 / 9; }
  #sound { position: fixed; left: 16px; bottom: 16px; padding: 8px 14px; border: 1px solid rgba(255,255,255,.35); border-radius: 999px;
           background: rgba(0,0,0,.55); color: #fff; font: inherit; cursor: pointer; }
  #sound[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080" aria-label="Sixteen bars stand on a stage; a gold pivot line runs across them while a wall moves right, smaller bars hop over to its left, the pivot jumps into its final place, and the same dance repeats on each side until the row is sorted"></canvas>
<button id="sound" type="button">Click for sound</button>
<script>
'use strict';
/* ==========================================================================
   PIECE — Quick Sort: The Partition Dance.
   Quick sort with the Lomuto partition. In a range lo..hi the LAST number
   is the pivot. A wall starts just left of the range; j walks from lo to
   hi - 1 and compares each number with the pivot. A smaller number is
   swapped to the slot just right of the wall, and the wall moves one step
   right. At the end the pivot swaps into the slot right of the wall: every
   number left of it is smaller, every number right of it is not, so it is
   home for good. Then the same partition runs on the left side and on the
   right side, recursively, until every range has one number or none.
   A real quick sort runs ONCE at load on sixteen fixed numbers and logs
   every event (pivot, compare, swap, wall step, placement) together with
   the array before it. The bars, the wall, the counters and the sound all
   read that log; seek(i) only interpolates between two logged states.
   ========================================================================== */
const W = 1920, H = 1080, FPS = 30;
const cv = document.getElementById('stage');
const ctx = cv.getContext('2d', { willReadFrequently: true });   // CPU raster: identical pixels on every redraw
const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
const MONO = 'ui-monospace, "Cascadia Code", Consolas, Menlo, monospace';

// ---- helpers -------------------------------------------------------------
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (f, a, b) => clamp((f - a) / (b - a));
const smooth = t => t * t * (3 - 2 * t);
const E = {
  inCubic: t => t * t * t,
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inOutCubic: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outExpo: t => t === 1 ? 1 : 1 - Math.pow(2, -10 * t),
  inExpo: t => t === 0 ? 0 : Math.pow(2, 10 * t - 10),
  inOutExpo: t => t === 0 ? 0 : t === 1 ? 1 : t < .5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2,
  outBack: t => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2),
};
/** Canvas text; `max` shrinks the size until the line fits. Returns the width drawn. */
function text(g, str, x, y, { size = 40, weight = 600, color = '#fff', alpha = 1, spacing = 0, align = 'left', fam = FONT, base = 'alphabetic', max = 0 } = {}) {
  if (alpha <= 0.002 || !str) return 0;
  g.font = `${weight} ${size}px ${fam}`; g.letterSpacing = spacing + 'px';
  if (max) { const w0 = g.measureText(str).width; if (w0 > max) { size *= max / w0; g.font = `${weight} ${size}px ${fam}`; } }
  g.textAlign = align; g.textBaseline = base;
  const a0 = g.globalAlpha; g.globalAlpha = a0 * alpha; g.fillStyle = color;
  g.fillText(str, x, y);
  const w = g.measureText(str).width;
  g.globalAlpha = a0; g.letterSpacing = '0px';
  return w;
}
const measure = (g, str, size, weight = 800, fam = FONT, spacing = 0) => { g.font = `${weight} ${size}px ${fam}`; g.letterSpacing = spacing + 'px'; const w = g.measureText(str).width; g.letterSpacing = '0px'; return w; };
const env = (f, a, b, fin = 12, fout = 10) => {
  const i = E.outCubic(prog(f, a, a + fin)), o = 1 - E.inCubic(prog(f, b - fout, b));
  return [Math.min(i, o), (1 - i) * 24 - (1 - o) * 10];
};

// ---- palette -------------------------------------------------------------
const C = {
  bg: '#0E1320', bgRGB: '14,19,32', paper: '#F2F4F8', dim: 'rgba(242,244,248,0.62)', faint: 'rgba(242,244,248,0.14)',
  pivot: '#FFC857', pivotRGB: '255,200,87', less: '#3DDBB5', more: '#FF7A6B', pend: '#6B7591', wait: '#343D55', home: '#E9EEF7',
  floor: '#262E44',
};
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix = (a, b, t) => { const x = hex(a), y = hex(b); return `rgb(${x.map((v, k) => Math.round(lerp(v, y[k], t))).join(',')})`; };

// ---- the model: one real quick sort, logged ---------------------------------------------------
const VALS = [38, 81, 22, 67, 14, 93, 50, 7, 71, 29, 86, 45, 12, 60, 33, 48];
const N = VALS.length;
const EV = [], ST = [];                                     // event k runs from state ST[k] to ST[k + 1]
let CMPS = 0, SWAPS = 0, PIVOTS = 0;
{
  const arr = VALS.map((_, id) => id), home = new Array(N).fill(false);
  let part = null, wall = -1, jd = 0;
  const snap = () => ({ arr: arr.slice(), home: home.slice(), part: part && { ...part }, wall, jd });
  const push = e => { ST.push(snap()); EV.push(e); };
  const swap = (a, b) => { const t = arr[a]; arr[a] = arr[b]; arr[b] = t; };
  const tierOf = d => d === 0 ? 0 : d === 1 ? 1 : 2;
  function partition(lo, hi, depth) {
    const tier = tierOf(depth), pidx = PIVOTS++;
    push({ k: 'pivot', lo, hi, depth, tier, pidx, id: arr[hi] });
    part = { lo, hi, ps: hi, depth, pv: VALS[arr[hi]] }; wall = lo - 1; jd = lo;
    const pv = VALS[arr[hi]];
    for (let j = lo; j < hi; j++) {
      const less = VALS[arr[j]] < pv;
      push({ k: 'cmp', j, less, tier, id: arr[j], pv, n: ++CMPS });
      jd = j + 1;
      if (less) {
        if (wall + 1 !== j) { push({ k: 'swap', a: wall + 1, b: j, tier, ida: arr[wall + 1], idb: arr[j], n: ++SWAPS }); swap(wall + 1, j); }
        else push({ k: 'grow', a: j, tier, id: arr[j] });
        wall++;
      }
    }
    const p = wall + 1, self = p === hi;
    push({ k: 'place', a: p, b: hi, tier, self, ida: arr[p], idb: arr[hi], pidx, n: self ? SWAPS : ++SWAPS });
    if (!self) swap(p, hi);
    home[p] = true; part = null; wall = -1; jd = 0;
    return p;
  }
  function qs(lo, hi, depth) {
    if (lo > hi) return;
    if (lo === hi) { push({ k: 'home1', a: lo, tier: 2, id: arr[lo] }); home[lo] = true; return; }
    const p = partition(lo, hi, depth);
    qs(lo, p - 1, depth + 1); qs(p + 1, hi, depth + 1);
  }
  qs(0, N - 1, 0);
  ST.push(snap());
}
const SORTED = ST[ST.length - 1].arr.map(id => VALS[id]);
const FIRST_SWAPS = EV.filter(e => e.k === 'swap' && e.tier === 0).length + 1;
const FIRST_HOME = EV.find(e => e.k === 'place').a;

// ---- timeline (frames) ------------------------------------------------------------------------
function buildTL(o) {
  const TL = { o, ev: [] };
  let t = o.start;
  EV.forEach(e => {
    if (e.k === 'pivot' && e.pidx === 1) t += o.breath;
    const d = o.dur[e.tier][e.k];
    TL.ev.push({ t0: t, t1: t + d, mid: t + Math.round(d * 0.5) });
    t += d;
  });
  TL.sortEnd = t;
  TL.finale = t + 8;
  TL.stats = TL.finale + o.finale;
  TL.end = TL.stats + o.statLen;
  const at = (pred) => TL.ev[EV.findIndex(pred)];
  const piv1 = at(e => e.k === 'pivot' && e.pidx === 1), place0 = at(e => e.k === 'place'), sw0 = at(e => e.k === 'swap');
  TL.caps = [
    [o.start - 6, sw0.t0 - 2, 'The last number is the pivot.|Everyone else is compared to it.'],
    [sw0.t0 - 4, place0.t0 + 2, 'Smaller than the pivot?|Swap it to the left of the wall.'],
    [place0.t0, piv1.t0 + 16, 'Then the pivot jumps the wall.|It is home for good.'],
    [piv1.t0 + 14, TL.sortEnd - 6, 'Same dance on each side,|with a new pivot every time.'],
    [TL.sortEnd - 8, TL.stats + 6, 'Every pivot lands home.|Sorted.'],
  ];
  return TL;
}
const DUR = {
  slow: { pivot: 22, cmp: 9, grow: 9, swap: 15, place: 22, home1: 6 },
  mid: { pivot: 10, cmp: 4, grow: 4, swap: 8, place: 10, home1: 4 },
  fast: { pivot: 6, cmp: 3, grow: 3, swap: 5, place: 6, home1: 3 },
};
const TLL = buildTL({ start: 54, breath: 10, finale: 36, statLen: 92, dur: [DUR.slow, DUR.mid, DUR.fast] });
const FRAMES = TLL.end + 72;

/** The state at frame f: before/after states, the running event and its progress u. */
function stateAt(TL, f) {
  let lo = 0, hi = TL.ev.length - 1, k = -1;
  while (lo <= hi) { const m = (lo + hi) >> 1; if (TL.ev[m].t0 <= f) { k = m; lo = m + 1; } else hi = m - 1; }
  if (k < 0) return { k: -1, e: null, u: 1, A: ST[0], B: ST[0] };
  const u = prog(f, TL.ev[k].t0, TL.ev[k].t1);
  if (u >= 1) return { k, e: null, u: 1, A: ST[k + 1], B: ST[k + 1] };
  return { k, e: EV[k], ev: TL.ev[k], u, A: ST[k], B: ST[k + 1] };
}
function colorOf(S, s) {
  if (S.home[s]) return C.home;
  const P = S.part;
  if (P && s >= P.lo && s <= P.hi) {
    if (s === P.ps) return C.pivot;
    if (s <= S.wall) return C.less;
    if (s < S.jd) return C.more;
    return C.pend;
  }
  return C.wait;
}
const count = (TL, f, kind) => { let n = 0; EV.forEach((e, k) => { if ((kind === 'swap' ? (e.k === 'swap' || (e.k === 'place' && !e.self)) : e.k === kind) && f >= TL.ev[k].mid) n++; }); return n; };

// ---- drawing -------------------------------------------------------------------------------------
const slotX = (G, s) => G.cx + (s - (N - 1) / 2) * G.pitch;
const barH = (G, v) => G.h0 + v * G.hk;
const wallX = (G, w) => slotX(G, w) + G.pitch / 2;

function bar(g, G, x, v, col, { dy = 0, sy = 1, rot = 0, alpha = 1, ring = 0, label = 1 } = {}) {
  if (alpha <= 0.01) return;
  const h = barH(G, v) * sy, bw = G.bw;
  const ga = g.globalAlpha;
  g.save(); g.globalAlpha = ga * alpha; g.translate(x, G.floorY + dy); g.rotate(rot);
  g.fillStyle = col; g.beginPath(); g.roundRect(-bw / 2, -h, bw, h, [bw * 0.32, bw * 0.32, 3, 3]); g.fill();
  if (ring > 0.01) { g.globalAlpha = ga * alpha * ring; g.strokeStyle = C.paper; g.lineWidth = 4; g.beginPath(); g.roundRect(-bw / 2 - 7, -h - 7, bw + 14, h + 10, [bw * 0.4, bw * 0.4, 5, 5]); g.stroke(); g.globalAlpha = ga * alpha; }
  text(g, String(v), 0, -h - G.numGap, { size: G.num, weight: 800, color: C.paper, fam: MONO, align: 'center', alpha: label });
  g.restore();
}
function stage(g, G, f) {
  const TL = G.TL, s = stateAt(TL, f), { A, B, e, u } = s;
  const eu = E.inOutCubic(u), cu = smooth(prog(u, 0.3, 0.62));
  const fin = f >= TL.sortEnd;
  // floor, range underline, slot numbers
  g.fillStyle = C.floor; g.fillRect(slotX(G, 0) - G.pitch * 0.62, G.floorY, G.pitch * (N + 0.24), 4);
  const P = A.part || B.part;
  let pa = 1;
  if (e && e.k === 'pivot') pa = E.outCubic(u); else if (e && e.k === 'place') pa = 1 - E.inCubic(prog(u, 0.55, 1));
  if (P && pa > 0.01) {
    g.save(); g.globalAlpha *= pa; g.fillStyle = C.pivot;
    g.fillRect(slotX(G, P.lo) - G.pitch * 0.42, G.floorY + 8, (P.hi - P.lo) * G.pitch + G.pitch * 0.84, 5); g.restore();
  }
  for (let k = 0; k < N; k++) {
    const inR = P && k >= P.lo && k <= P.hi;
    text(g, String(k), slotX(G, k), G.idxY, { size: G.idx, weight: 700, color: inR ? C.paper : 'rgba(242,244,248,0.42)', fam: MONO, align: 'center', alpha: inR ? 0.62 + 0.3 * pa : 1 });
  }
  // home plates
  for (let k = 0; k < N; k++) {
    const hA = A.home[k], hB = B.home[k];
    if (!hA && !hB) continue;
    const a = hA ? 1 : E.outCubic(prog(u, 0.55, 1));
    g.save(); g.globalAlpha *= a; g.fillStyle = C.pivot; g.fillRect(slotX(G, k) - G.bw / 2 - 4, G.floorY - 2, G.bw + 8, 8); g.restore();
  }
  // pivot line and the wall
  if (P && pa > 0.01) {
    const y = G.floorY - barH(G, P.pv), x0 = slotX(G, P.lo) - G.pitch * 0.5, x1 = slotX(G, P.hi) + G.pitch * 0.5;
    const grow = e && e.k === 'pivot' ? E.outCubic(u) : 1;
    g.save(); g.globalAlpha *= pa * 0.85; g.strokeStyle = C.pivot; g.lineWidth = 3; g.setLineDash([12, 10]);
    g.beginPath(); g.moveTo(x1, y); g.lineTo(lerp(x1, x0, grow), y); g.stroke(); g.setLineDash([]); g.restore();
    if (G.pvLab && P.depth === 0) text(g, `pivot ${P.pv}`, x0 - 16, y + 10, { size: G.pvLab, weight: 800, color: C.pivot, align: 'right', alpha: pa });
    // the wall: a vertical line between slot `wall` and `wall + 1`
    const wA = A.part ? A.wall : B.wall, wB = B.part ? B.wall : A.wall;
    const wx = wallX(G, lerp(wA, wB, eu));
    const wa = pa;
    g.save(); g.globalAlpha *= wa; g.strokeStyle = C.less; g.lineWidth = 5; g.lineCap = 'round';
    g.beginPath(); g.moveTo(wx, G.floorY + 2); g.lineTo(wx, G.wallTop); g.stroke(); g.restore();
    text(g, 'wall', wx, G.wallTop - 16, { size: G.wallLab, weight: 800, color: C.less, align: 'center', alpha: wa });
    // j: the next number to compare
    const jA = A.part ? A.jd : B.jd, jB = B.part ? B.jd : A.jd;
    const jx = slotX(G, lerp(jA, jB, E.inOutCubic(prog(u, 0.2, 0.9))));
    const ja = wa * (e && e.k === 'place' ? 1 - E.inCubic(prog(u, 0, 0.4)) : 1);
    if (ja > 0.01 && Math.min(jA, jB) < P.hi) {
      g.save(); g.globalAlpha *= ja; g.fillStyle = C.paper; g.beginPath();
      g.moveTo(jx, G.jY); g.lineTo(jx - 13, G.jY + 20); g.lineTo(jx + 13, G.jY + 20); g.closePath(); g.fill(); g.restore();
      text(g, 'j', jx + 22, G.jY + 22, { size: G.idx, weight: 800, color: C.paper, fam: MONO, alpha: ja });
    }
  }
  // the bars: still ones first, the dancers on top
  const moving = new Set();
  let movers = [];
  if (e && (e.k === 'swap' || (e.k === 'place' && !e.self))) {
    moving.add(e.ida); moving.add(e.idb);
    // idb (at b, the smaller one / the pivot) hops left over the top; ida slides right under it
    const hop = e.k === 'place' ? G.arcH * 1.35 : G.arcH;
    movers = [
      { id: e.ida, x: lerp(slotX(G, e.a), slotX(G, e.b), eu), dy: 0, sy: 1 - 0.1 * Math.sin(Math.PI * u), rot: 0 },
      { id: e.idb, x: lerp(slotX(G, e.b), slotX(G, e.a), eu), dy: -hop * Math.sin(Math.PI * eu), sy: 1, rot: -0.16 * Math.sin(2 * Math.PI * eu) },
    ];
  }
  const colAt = (id) => {
    const sa = A.arr.indexOf(id), sb = B.arr.indexOf(id);
    const ca = colorOf(A, sa), cb = colorOf(B, sb);
    return ca === cb ? ca : mix(ca, cb, cu);
  };
  const fwave = k => fin ? Math.sin(Math.PI * clamp((f - TL.finale - k * 2) / 12)) : 0;
  for (let s2 = 0; s2 < N; s2++) {
    const id = A.arr[s2];
    if (moving.has(id)) continue;
    let dy = 0, ring = 0, rot = 0;
    if (e && e.k === 'cmp' && e.id === id) { dy = -G.lift * Math.sin(Math.PI * u); ring = Math.sin(Math.PI * u); rot = 0; }
    if (e && (e.k === 'grow' && e.id === id)) dy = -G.lift * 0.8 * Math.sin(Math.PI * u);
    if (e && e.k === 'home1' && e.id === id) ring = Math.sin(Math.PI * u);
    if (e && e.k === 'place' && e.self && e.idb === id) { dy = -G.lift * 1.4 * Math.sin(Math.PI * eu); ring = Math.sin(Math.PI * u); }
    dy -= G.lift * 2.2 * fwave(s2);
    let col = colAt(id);
    if (fin) col = mix(C.home, C.pivot, clamp((f - TL.finale - s2 * 2) / 10) * (VALS[id] / 93) * 0.9);
    bar(g, G, slotX(G, s2), VALS[id], col, { dy, ring, rot });
    // compare verdict over the bar (slow and medium speed only)
    if (e && e.k === 'cmp' && e.id === id && e.tier < 2) {
      const a = Math.sin(Math.PI * clamp(u * 1.15));
      text(g, `${e.less ? '<' : '≥'} ${e.pv}`, slotX(G, s2), G.floorY - barH(G, VALS[id]) - G.numGap - G.num - 12 + dy, { size: G.verd, weight: 900, color: e.less ? C.less : C.more, align: 'center', alpha: a });
    }
  }
  for (const m of movers) bar(g, G, m.x, VALS[m.id], colAt(m.id), { dy: m.dy, sy: m.sy, rot: m.rot, ring: 0.6 * Math.sin(Math.PI * u) });
}
function counters(g, G, f) {
  const TL = G.TL, [a] = env(f, TL.o.start - 4, TL.stats + 10, 12, 10);
  if (a <= 0) return;
  const c = count(TL, f, 'cmp'), sw = count(TL, f, 'swap');
  const pairs = [['comparisons', c, C.paper], ['swaps', sw, C.pivot]];
  if (G.cntSplit) {
    text(g, 'comparisons', G.cntX0, G.cntY, { size: G.cntL, weight: 700, color: C.dim, alpha: a });
    text(g, String(c), G.cntX0, G.cntY + G.cnt + 4, { size: G.cnt, weight: 900, color: C.paper, fam: MONO, alpha: a });
    text(g, 'swaps', G.cntX1, G.cntY, { size: G.cntL, weight: 700, color: C.dim, align: 'right', alpha: a });
    text(g, String(sw), G.cntX1, G.cntY + G.cnt + 4, { size: G.cnt, weight: 900, color: C.pivot, fam: MONO, align: 'right', alpha: a });
    return;
  }
  let y = G.cntY;
  for (const [lab, n, col] of pairs) {
    const wn = measure(g, String(n).padStart(2, ' '), G.cnt, 900, MONO);
    text(g, String(n), G.cntX1, y, { size: G.cnt, weight: 900, color: col, fam: MONO, align: 'right', alpha: a });
    text(g, lab, G.cntX1 - wn - 18, y, { size: G.cntL, weight: 700, color: C.dim, align: 'right', alpha: a });
    y += G.cnt * 1.2;
  }
}
function caption(g, G, f) {
  for (const [t0, t1, str] of G.TL.caps) {
    const [a, dy] = env(f, t0, t1, 10, 8); if (a <= 0) continue;
    const [p1, p2] = str.split('|');
    text(g, p1, G.capX, G.capY + dy, { size: G.cap, weight: 850, color: C.paper, spacing: -1, alpha: a, max: G.capMax });
    text(g, p2, G.capX, G.capY + G.cap * 1.16 + dy, { size: G.cap, weight: 850, color: C.pivot, spacing: -1, alpha: a, max: G.capMax });
  }
}
function stats(g, G, f) {
  const TL = G.TL, out = 1 - E.inCubic(prog(f, TL.end - 4, TL.end + 12));
  const k0 = E.outCubic(prog(f, TL.stats - 2, TL.stats + 14)) * out;
  if (k0 <= 0) return;
  const k1 = E.outCubic(prog(f, TL.stats + 4, TL.stats + 20)) * out, k2 = E.outCubic(prog(f, TL.stats + 16, TL.stats + 32)) * out, k3 = E.outCubic(prog(f, TL.stats + 28, TL.stats + 44)) * out;
  const lines = [
    [`${N} numbers  ·  ${PIVOTS} pivots  ·  ${CMPS} comparisons  ·  ${SWAPS} swaps`, C.paper, 850, G.st1, k1],
    [`First partition: ${N - 1} comparisons, ${FIRST_SWAPS} swaps, and ${VALS[N - 1]} landed in slot ${FIRST_HOME}.`, C.pivot, 700, G.st2, k2],
    ['Smaller left, larger right, then recurse.', C.less, 800, G.st2, k3],
  ];
  let y = G.stY;
  for (const [s, c, wt, sz, k] of lines) {
    const ls = G.stWrap ? vWrap(s, G.stMax, sz, wt) : [s];
    ls.forEach(l => { text(g, l, G.stX, y + (1 - k) * 18, { size: sz, weight: wt, color: c, align: G.stAlign, alpha: k, max: G.stMax }); y += sz * 1.28; });
    y += sz * 0.45;
  }
}
function backdrop(g, w, h) { g.fillStyle = C.bg; g.fillRect(0, 0, w, h); }
function scene(g, G, f) {

// ---- landscape picture ------------------------------------------------------------------
const GL = { TL: TLL, W, H, cx: 1000, pitch: 92, bw: 60, floorY: 850, h0: 34, hk: 4.4, num: 32, numGap: 12, idx: 28, idxY: 902, jY: 928, lift: 22, arcH: 150,
  wallTop: 372, wallLab: 28, pvLab: 30, verd: 34,
  capX: 120, capY: 206, cap: 50, capMax: 1180, cntX1: 1800, cntY: 206, cnt: 50, cntL: 30, cntSplit: false,
  stX: 960, stY: 440, st1: 56, st2: 44, stAlign: 'center', stMax: 1680, stWrap: false };
function hookL(f) {
  const o = 1 - E.inCubic(prog(f, TLL.o.start - 22, TLL.o.start - 4));

  text(ctx, 'Smaller than the pivot?', W / 2, 500 + (1 - k) * 30, { size: 116, weight: 900, color: C.paper, spacing: -3, align: 'center', alpha: o * Math.max(0.3, k) });
  text(ctx, 'Step left of the wall.', W / 2, 650 + (1 - clamp(k2)) * 30, { size: 116, weight: 900, color: C.pivot, spacing: -3, align: 'center', alpha: o * Math.max(0.3, clamp(k2)) });
}
function draw(f) {

  backdrop(ctx, W, H);
  const T = TLL, endK = E.inOutCubic(prog(f, T.end, T.end + 20)), a = 1 - endK;
  text(ctx, 'ALGORITHMS  ·  QUICK SORT', 120, 104, { size: 26, weight: 600, color: C.dim, spacing: 5, alpha: a });
  text(ctx, 'BYTEPATTERNS', 1800, 104, { size: 26, weight: 600, color: C.dim, spacing: 5, align: 'right', alpha: a });
  scene(ctx, GL, f);
  hookL(f);
  if (endK > 0) {
    ctx.fillStyle = `rgba(${C.bgRGB},${0.9 * endK})`; ctx.fillRect(0, 0, W, H);
    const k1 = E.outCubic(prog(f, T.end + 6, T.end + 28)), k2 = E.outCubic(prog(f, T.end + 16, T.end + 38)), k3 = E.outCubic(prog(f, T.end + 26, T.end + 48));
    text(ctx, 'Quick Sort', W / 2, 500 + (1 - k1) * 30, { size: 140, weight: 850, color: C.paper, spacing: -3, align: 'center', alpha: k1 });
    text(ctx, `Lomuto partition  ·  ${CMPS} comparisons  ·  ${SWAPS} swaps`, W / 2, 580 + (1 - k2) * 20, { size: 42, weight: 500, color: C.pivot, align: 'center', alpha: k2 });
    text(ctx, 'drawn in code  ·  bytepatterns.com', W / 2, 1000, { size: 32, weight: 600, color: C.paper, spacing: 3, align: 'center', alpha: k3 * 0.8 });

// ---- sound: a tick on every swap, a softer tap per comparison, a bell per pivot home ---------------
const PENTA = [0, 2, 4, 7, 9];
const noteOf = v => { const i = Math.min(14, Math.floor(v / 100 * 15)); return 60 + 12 * Math.floor(i / 5) + PENTA[i % 5]; };
async function renderAudio(TL = TLL, frames = FRAMES) {
  const SR = 48000, dur = frames / FPS, LEN = Math.round(SR * dur);
  const ac = new OfflineAudioContext(2, LEN, SR);
  const at = fr => fr / FPS;
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -14; comp.ratio.value = 3.5; comp.attack.value = 0.003; comp.release.value = 0.18;
  const master = ac.createGain(); master.gain.value = 0.95; master.connect(comp).connect(ac.destination);
  master.gain.setValueAtTime(0.95, dur - 0.8); master.gain.linearRampToValueAtTime(0.0001, dur - 0.02);
  const rnd = mulberry32(0x36A1);
  const ir = ac.createBuffer(2, SR * 1.5, SR);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let k = 0; k < d.length; k++) d[k] = (rnd() * 2 - 1) * Math.pow(1 - k / d.length, 3.4); }
  const verb = ac.createConvolver(); verb.buffer = ir; const vg = ac.createGain(); vg.gain.value = 0.2; verb.connect(vg).connect(master);
  const noise = ac.createBuffer(1, SR, SR); { const d = noise.getChannelData(0); for (let k = 0; k < d.length; k++) d[k] = rnd() * 2 - 1; }
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  const click = (t0, amp, f0, pan = 0, q = 6, len = 0.035) => { const s = ac.createBufferSource(); s.buffer = noise; const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f0; bp.Q.value = q;
    const g = ac.createGain(), p = ac.createStereoPanner(); p.pan.value = clamp(pan, -1, 1); g.gain.setValueAtTime(amp, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + len);
    s.connect(bp).connect(g).connect(p).connect(master); s.start(t0, (t0 * 3.7) % 0.9, len + 0.02); };
  const tone = (t0, m, pan, amp, dec, type = 'sine') => { const o = ac.createOscillator(), g = ac.createGain(), p = ac.createStereoPanner();
    o.type = type; o.frequency.value = hz(m); p.pan.value = clamp(pan, -1, 1);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(amp, t0 + 0.003); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dec);
    o.connect(g).connect(p); p.connect(master); p.connect(verb); o.start(t0); o.stop(t0 + dec + 0.03); };
  const mar = (t0, m, pan, amp = 0.14) => { tone(t0, m, pan, amp, 0.24); tone(t0, m + 24.2, pan, amp * 0.22, 0.05); };
  const wood = (t0, pan, amp = 0.16) => { click(t0, amp, 1750, pan, 9, 0.05); tone(t0, 83, pan, amp * 0.35, 0.05, 'triangle'); };
  const bell = (t0, m, amp, pn = 0) => { for (const [r2, a2, d2] of [[1, 1, 1.3], [2.76, 0.3, 0.5], [5.4, 0.1, 0.2]]) tone(t0, m + 12 * Math.log2(r2), pn, amp * a2, d2); };
  const panS = s => (s / (N - 1) - 0.5) * 1.3;
  // a quiet bed: bass on the bar, hats on the eighths
  const BEAT = 16, BASS = [45, 41, 38, 40];
  for (let bar = 0; bar * BEAT * 4 < TL.stats; bar++) {
    const t0 = at(bar * BEAT * 4), o = ac.createOscillator(), g = ac.createGain(), lp = ac.createBiquadFilter();
    o.type = 'sawtooth'; o.frequency.value = hz(BASS[bar % 4]); lp.type = 'lowpass'; lp.frequency.value = 280;
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.075, t0 + 0.04); g.gain.exponentialRampToValueAtTime(0.0001, t0 + BEAT * 4 / FPS);
    o.connect(lp).connect(g).connect(master); o.start(t0); o.stop(t0 + BEAT * 4 / FPS + 0.05);

  for (let b = 0; b * BEAT < TL.stats; b++) { if (b % 2 === 0) click(at(b * BEAT), 0.05, 140, 0, 1, 0.12); click(at(b * BEAT + BEAT / 2), 0.016, 8500); }
  EV.forEach((e, k) => {
    const T = TL.ev[k];
    if (e.k === 'pivot') { bell(at(T.t0), noteOf(VALS[e.id]) - 12, e.tier === 0 ? 0.08 : 0.05, panS(e.hi)); }
    else if (e.k === 'cmp') click(at(T.mid), e.tier === 2 ? 0.03 : 0.045, e.less ? 4200 : 2600, panS(e.j));
    else if (e.k === 'grow') mar(at(T.mid), noteOf(VALS[e.id]), panS(e.a), 0.09);
    else if (e.k === 'swap') { wood(at(T.mid), panS((e.a + e.b) / 2)); mar(at(T.mid), noteOf(VALS[e.idb]), panS(e.a), 0.12); }
    else if (e.k === 'place') {
      if (!e.self) wood(at(T.mid), panS((e.a + e.b) / 2), 0.18);
      mar(at(T.t1 - 2), noteOf(VALS[e.idb]), panS(e.a), 0.14); bell(at(T.t1 - 2), noteOf(VALS[e.idb]), 0.05, panS(e.a));
    } else if (e.k === 'home1') mar(at(T.mid), noteOf(VALS[e.id]), panS(e.a), 0.08);
  });
  for (let s = 0; s < N; s++) mar(at(TL.finale + s * 2), noteOf(SORTED[s]) + 12, panS(s), 0.1);
  [60, 64, 67, 72].forEach((m, i) => bell(at(TL.stats + 4) + i * 0.06, m, 0.06, -0.3 + i * 0.2));
  [72, 76, 79, 84].forEach((m, i) => bell(at(TL.end + 8 + i * 6), m, 0.07, -0.45 + i * 0.3));
  const buf = await ac.startRendering();
  let peak = 0; for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let k = 0; k < d.length; k++) peak = Math.max(peak, Math.abs(d[k])); }
  if (peak > 0.89) for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let k = 0; k < d.length; k++) d[k] *= 0.89 / peak; }
  return buf;
}

/* ==========================================================================
   VERTICAL CUT — shared block, identical in every piece.
   1080x1920 for Reels, Shorts and TikTok (__motion.variants.vertical). The
   piece's own scene code is re-used and recomposed for a phone: everything a
   viewer must read stays inside the area no platform covers (x 60..900,
   y 230..1400); outside it there is only dimmed texture.
   ========================================================================== */
const VW = 1080, VH = 1920, SAFE = { x: 60, y: 230, w: 840, h: 1170, r: 900, b: 1400 };
const vcv = document.createElement('canvas'); vcv.width = VW; vcv.height = VH;
const vx = vcv.getContext('2d', { willReadFrequently: true });   // CPU raster: identical pixels on every redraw
const VL = 96, VR = 864;                                          // text column inside the safe area

function vReset() {
  vx.setTransform(1, 0, 0, 1, 0, 0); vx.globalAlpha = 1; vx.globalCompositeOperation = 'source-over';
  vx.filter = 'none'; vx.shadowBlur = 0; vx.shadowColor = 'transparent'; vx.letterSpacing = '0px'; vx.setLineDash([]);
  vx.textAlign = 'left'; vx.textBaseline = 'alphabetic'; vx.lineCap = 'butt'; vx.lineJoin = 'miter';
}
/** Canvas text on the vertical frame; `max` shrinks the size until the line fits. */
function vText(str, x, y, { size = 40, weight = 700, color = '#FFFFFF', align = 'left', spacing = 0, alpha = 1, fam = FONT, max = 0 } = {}) {
  if (alpha <= 0.002 || !str) return size;
  vx.font = `${weight} ${size}px ${fam}`; vx.letterSpacing = spacing + 'px';
  if (max) { const w = vx.measureText(str).width; if (w > max) { size = size * max / w; vx.font = `${weight} ${size}px ${fam}`; } }
  vx.textAlign = align; vx.textBaseline = 'alphabetic';
  const a0 = vx.globalAlpha; vx.globalAlpha = a0 * alpha; vx.fillStyle = color;
  vx.fillText(str, x + (align === 'center' ? spacing / 2 : align === 'right' ? spacing : 0), y);   // tracking is added after the last glyph too
  vx.globalAlpha = a0; vx.letterSpacing = '0px';
  return size;
}
/** Word-wraps with the given font; returns the lines. */
function vWrap(str, maxW, size, weight = 700, fam = FONT) {
  vx.font = `${weight} ${size}px ${fam}`; vx.letterSpacing = '0px';
  const words = str.split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (vx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur);
  return lines;
}
/** Fade envelope with a small rise: [alpha, dy]. */
function vEnv(v, a, b, fin = 8, fout = 8) {
  const i = E.outCubic(prog(v, a, a + fin)), o = 1 - E.inCubic(prog(v, b - fout, b));
  return [Math.min(i, o), (1 - i) * 22 - (1 - o) * 10];
}
/** Which segment of a cut list a vertical frame is in: segs = [{ at, src, len }] in frames. */
function vSeg(segs, v) {
  let k = 0; while (k < segs.length - 1 && v >= segs[k + 1].at) k++;
  const s = segs[k];
  return { k, s, local: v - s.at, src: s.src + (v - s.at) };
}
/** Dims everything outside the safe area to a quiet texture (brightness x 0.2), with a soft inner edge. */
function vShade(rgb, a = 0.8, feather = 40) {
  vx.save(); vx.setTransform(1, 0, 0, 1, 0, 0); vx.globalAlpha = 1; vx.globalCompositeOperation = 'source-over';
  vx.fillStyle = `rgba(${rgb},${a})`;
  vx.beginPath(); vx.rect(0, 0, VW, VH); vx.rect(SAFE.x, SAFE.y, SAFE.w, SAFE.h); vx.fill('evenodd');
  const strip = (x0, y0, x1, y1, rx, ry, rw, rh) => {
    const g = vx.createLinearGradient(x0, y0, x1, y1);
    g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`);
    vx.fillStyle = g; vx.fillRect(rx, ry, rw, rh);
  };
  strip(SAFE.x, 0, SAFE.x + feather, 0, SAFE.x, SAFE.y, feather, SAFE.h);
  strip(SAFE.r, 0, SAFE.r - feather, 0, SAFE.r - feather, SAFE.y, feather, SAFE.h);
  strip(0, SAFE.y, 0, SAFE.y + feather, SAFE.x, SAFE.y, SAFE.w, feather);
  strip(0, SAFE.b, 0, SAFE.b - feather, SAFE.x, SAFE.b - feather, SAFE.w, feather);
  vx.restore();
}
/** Series tag at the top of the safe area, e.g. MADE IN CODE · 04. */
function vTag(label, color, alpha = 1) {
  vText('MADE IN CODE', VL, 292, { size: 28, weight: 800, color, spacing: 5, alpha });
  vx.font = `800 28px ${FONT}`; vx.letterSpacing = '5px';
  const w = vx.measureText('MADE IN CODE').width; vx.letterSpacing = '0px';
  vText('·  ' + label, VL + w + 14, 292, { size: 28, weight: 600, color: 'rgba(255,255,255,0.72)', spacing: 3, alpha, max: VR - VL - w - 14 });
}
/** Big hook lines, left-aligned from y0; visible from frame 0, settles in a few frames. */
function vHook(v, lines, y0, { size = 84, lh = 1.08, color = '#FFFFFF', accent = null, weight = 800, spacing = -1.5, alpha = 1 } = {}) {
  const k = E.outExpo(prog(v, -6, 12));
  lines.forEach((ln, i) => {
    const kk = E.outExpo(prog(v, -12 + i * 2, 8 + i * 2));
    vText(ln, VL, y0 + i * size * lh + (1 - kk) * 30, { size, weight, spacing, color: accent && i === lines.length - 1 ? accent : color, alpha: alpha * Math.max(0.25, kk), max: VR - VL });
  });
  return k;
}
/** Closing card, the last 60 frames: piece title, "drawn in code · bytepatterns.com". l = frames into the card. */
function vEndCard(l, { title, line = '', ink = '#FFFFFF', dim = 'rgba(255,255,255,0.66)', accent = '#FFFFFF', scrim = '0,0,0', a = 0.84 }) {
  const k = E.outCubic(prog(l, 0, 12));
  vx.save(); vx.setTransform(1, 0, 0, 1, 0, 0);
  vx.fillStyle = `rgba(${scrim},${a * k})`; vx.fillRect(0, 0, VW, VH);
  vx.restore();
  const t1 = E.outExpo(prog(l, 3, 19)), t2 = E.outExpo(prog(l, 11, 27)), t3 = E.outExpo(prog(l, 19, 35));
  vx.fillStyle = accent; vx.globalAlpha = t1; vx.fillRect(VL, 742, 88 * t1, 7); vx.globalAlpha = 1;
  const size = vText(title, VL, 850 + (1 - t1) * 40, { size: 92, weight: 800, color: ink, spacing: -2, alpha: t1, max: VR - VL });
  const y2 = 850 + Math.max(size, 60) * 0.25 + 70;
  vx.font = `600 44px ${FONT}`;
  const lead = 'drawn in code  ·  ', lw = vx.measureText(lead).width;
  vText(lead, VL, y2 + (1 - t2) * 24, { size: 44, weight: 600, color: dim, alpha: t2 });
  vText('bytepatterns.com', VL + lw, y2 + (1 - t2) * 24, { size: 44, weight: 800, color: accent, alpha: t2 });
  if (line) vText(line, VL, y2 + 72 + (1 - t3) * 18, { size: 32, weight: 500, color: dim, alpha: t3, max: VR - VL });

/** Seeks a cut. The first frame a page draws is drawn twice: the very first read of a
 *  GPU-backed source canvas can come out a shade different from every later one. */
let vWarm = false;
function vSeek(draw, i, frames) {
  const f = Math.max(0, Math.min(frames - 1, Math.floor(i)));
  if (!vWarm) { vWarm = true; draw(f); }
  draw(f);
}
/** The soundtrack of a cut: the piece's own audio() spliced to the same segments as the picture. */
async function vAudio(segs, frames, { xf = 0.025, fadeOut = 0.6, extra = null } = {}) {
  const src = await renderAudio();
  const SR = 48000, dur = frames / FPS, ac = new OfflineAudioContext(2, Math.round(SR * dur), SR);
  const out = ac.createGain(); out.connect(ac.destination);
  out.gain.setValueAtTime(1, 0); out.gain.setValueAtTime(1, dur - fadeOut); out.gain.linearRampToValueAtTime(0, dur - 0.01);
  segs.forEach((s, k) => {
    const at = s.at / FPS, off = s.src / FPS, d = s.len / FPS;
    const pre = k === 0 ? 0 : Math.min(xf, off), post = k === segs.length - 1 ? 0 : xf;
    const b = ac.createBufferSource(), g = ac.createGain(); b.buffer = src;
    g.gain.setValueAtTime(pre ? 0 : 1, at - pre);
    if (pre) g.gain.linearRampToValueAtTime(1, at + pre);
    if (post) { g.gain.setValueAtTime(1, at + d - post); g.gain.linearRampToValueAtTime(0, at + d + post); }
    b.connect(g).connect(out); b.start(at - pre, off - pre, d + pre + post);

  let peak = 0; for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) peak = Math.max(peak, Math.abs(d[i])); }
  if (peak > 0.9) for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] *= 0.9 / peak; }

  for (const [mul, v, dec] of [[1, 1, 1.8], [2.01, 0.35, 0.8], [3.02, 0.12, 0.4]]) {

// The same sort on a phone: sixteen narrower bars across the safe area,

const TLV = buildTL({ start: 36, breath: 6, finale: 28, statLen: 62, dur: [
  { pivot: 14, cmp: 5, grow: 5, swap: 10, place: 14, home1: 4 },
  { pivot: 6, cmp: 2, grow: 2, swap: 5, place: 6, home1: 2 },
  { pivot: 4, cmp: 2, grow: 2, swap: 4, place: 4, home1: 2 }] });
const VFR = TLV.end + 60, VEND = VFR - 60;
const GV = { TL: TLV, W: VW, H: VH, cx: 480, pitch: 48, bw: 34, floorY: 1160, h0: 26, hk: 5.3, num: 28, numGap: 10, idx: 28, idxY: 1206, jY: 1226, lift: 16, arcH: 110,
  wallTop: 560, wallLab: 28, pvLab: 0, verd: 30,
  capX: VL, capY: 392, cap: 44, capMax: VR - VL, cntSplit: true, cntX0: VL, cntX1: VR, cntY: 1300, cnt: 60, cntL: 30,
  stX: VL, stY: 600, st1: 48, st2: 38, stAlign: 'left', stMax: VR - VL, stWrap: true };
function hookV(v) {

window.__motion = {

/* ==========================================================================
   PLAYER — identical in every piece; keep as is.
   Autoplays and loops, starts sound on the first click, ?frame=N pauses on a
   frame, ?variant=vertical plays the vertical cut (if the piece has one).
   When the renderer sets window.__MOTION_RENDER__ it stays out of the way.
   ========================================================================== */
(function player() {
  const btn = document.getElementById('sound'), q = new URLSearchParams(location.search);
  let M = window.__motion;
  const V = !window.__MOTION_RENDER__ && M.variants && M.variants[q.get('variant')];
  if (V) {                                                // show the variant's own canvas instead
    M = Object.assign({}, M, V);
    V.canvas.style.cssText = `width:min(100vw,calc(100vh*${V.width}/${V.height}));height:auto;aspect-ratio:${V.width}/${V.height}`;
    document.querySelector('canvas').replaceWith(V.canvas);
  }
  const dur = M.frames / M.fps;
  if (window.__MOTION_RENDER__) { btn.hidden = true; M.seek(0); return; }
  if (q.has('frame')) { btn.hidden = true; M.seek(+q.get('frame') || 0); return; }
  let t0 = performance.now(), ac = null, src = null, buf = null, paused = false, pausedAt = 0;
  const clock = () => ac && src ? (ac.currentTime - t0) : (performance.now() - t0) / 1000;
  function loop() {
    if (!paused) M.seek(Math.floor(((clock() % dur) + dur) % dur * M.fps));
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  btn.addEventListener('click', async () => {
    if (src) { src.stop(); src = null; btn.textContent = 'Click for sound'; t0 = performance.now(); return; }
    btn.textContent = 'Loading sound…';
    ac = ac || new AudioContext({ sampleRate: 48000 });
    buf = buf || await M.audio();
    await ac.resume();
    src = ac.createBufferSource(); src.buffer = buf; src.loop = true; src.connect(ac.destination);
    t0 = ac.currentTime + 0.05; src.start(t0);        // picture restarts from frame 0 in sync with the sound
    btn.textContent = 'Sound on — click to mute';
  });
  addEventListener('keydown', e => {
    if (e.code !== 'Space') return;
    e.preventDefault(); paused = !paused;
    if (ac) paused ? ac.suspend() : ac.resume();
    if (!ac) { if (paused) pausedAt = performance.now(); else t0 += performance.now() - pausedAt; }
  });
})();
</script>
</body>
</html>
