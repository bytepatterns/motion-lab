<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="teambytepatterns">
<meta name="description" content="Dijkstra's algorithm spreads through a generated city at rush hour, where every street costs its travel time, and the fastest route home is not the shortest one.">
<title>Dijkstra at Rush Hour — motion-lab</title>
<style>
  /* Player chrome. The piece itself lives entirely in the canvas. */
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; font: 500 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; }
  canvas { display: block; width: min(100vw, calc(100vh * 16 / 9)); height: auto; aspect-ratio: 16 / 9; }
  #sound { position: fixed; left: 16px; bottom: 16px; padding: 8px 14px; border: 1px solid rgba(255,255,255,.35); border-radius: 999px;
           background: rgba(0,0,0,.55); color: #fff; font: inherit; cursor: pointer; }
  #sound[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080" aria-label="A generated city map at rush hour: Dijkstra's search spreads from home along the streets, slower through traffic, until it reaches work"></canvas>
<button id="sound" type="button">Click for sound</button>
<script>
'use strict';
/* ==========================================================================
   PIECE — Dijkstra at Rush Hour.
   A city is generated from a seed: a jittered street grid, four avenues, a
   diagonal boulevard, a river that only three bridges cross, and a few
   streets closed at random (never cutting the city in two). Rush-hour
   traffic is a smooth congestion field over the map. Every street costs its
   travel time: length / speed x (1 + traffic).
   Dijkstra runs once at load from HOME and stops when WORK is settled. The
   film shows its distance front D growing at a constant rate: an
   intersection lights up when its travel time is <= D, and each street fills
   from its settled end at the same rate, so the wave crawls through red
   streets and runs along clear avenues. A second run with plain length as
   the cost gives the shortest route, to compare. Every number on screen
   comes from those two runs; seek(i) only reads them.
   ========================================================================== */
const W = 1920, H = 1080, FPS = 30, FRAMES = 720;          // 24 s
const cv = document.getElementById('stage');
const ctx = cv.getContext('2d', { willReadFrequently: true });   // CPU raster: identical pixels on every redraw
const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
const MONO = 'ui-monospace, "Cascadia Code", Consolas, Menlo, monospace';

// ---- helpers -------------------------------------------------------------
// ---- helpers -------------------------------------------------------------
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (f, a, b) => clamp((f - a) / (b - a));
const smooth = t => t * t * (3 - 2 * t);
const E = {
  inCubic: t => t * t * t,
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inOutCubic: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outExpo: t => t === 1 ? 1 : 1 - Math.pow(2, -10 * t),
  inExpo: t => t === 0 ? 0 : Math.pow(2, 10 * t - 10),
  inOutExpo: t => t === 0 ? 0 : t === 1 ? 1 : t < .5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2,
  outBack: t => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2),
};
function text(g, str, x, y, { size = 40, weight = 600, color = '#fff', alpha = 1, spacing = 0, align = 'left', fam = FONT, base = 'alphabetic' } = {}) {
  if (alpha <= 0.002 || !str) return 0;
  g.font = `${weight} ${size}px ${fam}`; g.letterSpacing = spacing + 'px';
  g.textAlign = align; g.textBaseline = base;
  const a0 = g.globalAlpha; g.globalAlpha = a0 * alpha; g.fillStyle = color;
  g.fillText(str, x, y);
  const w = g.measureText(str).width;
  g.globalAlpha = a0; g.letterSpacing = '0px';
  return w;
}
const env = (f, a, b, fin = 12, fout = 10) => {
  const i = E.outCubic(prog(f, a, a + fin)), o = 1 - E.inCubic(prog(f, b - fout, b));
  return [Math.min(i, o), (1 - i) * 24 - (1 - o) * 10];
};

// ---- palette -------------------------------------------------------------
const C = {
  bg: '#0B0D12', bgRGB: '11,13,18', paper: '#EEEAE2', dim: 'rgba(238,234,226,0.64)', faint: 'rgba(238,234,226,0.3)',
  teal: '#58C4B8', amber: '#F5B83D', coral: '#FF6B57', wave: '#E6FBF7',
};
const RAMP = [[88, 196, 184], [245, 184, 61], [255, 107, 87]];   // traffic: clear -> slow -> jammed
const rampRGB = t => { const s = clamp(t) * 2, i = Math.min(1, Math.floor(s)), r = s - i; return RAMP[i].map((v, k) => Math.round(lerp(v, RAMP[i + 1][k], r))); };

// ---- the city (metres) ------------------------------------------------------
const COLS = 24, ROWS = 15, SP = 160, MAPW = (COLS - 1) * SP, MAPH = (ROWS - 1) * SP;
const riverX = y => MAPW * 0.5 + 150 * Math.sin(y / MAPH * Math.PI * 1.25 + 0.5);
const KIND = { street: 0, avenue: 1, bridge: 2, blvd: 3 };
const SPEED = [30, 50, 40, 40];                              // km/h by kind
const id = (i, j) => j * COLS + i;
const HOME = id(1, 8), WORK = id(22, 7);
const CITY = (() => {
  const r = mulberry32(0xC17E5);
  const P = [];
  for (let j = 0; j < ROWS; j++) for (let i = 0; i < COLS; i++) {
    let x = i * SP + (r() - 0.5) * 56, y = j * SP + (r() - 0.5) * 56 + 26 * Math.sin(i * 0.45);
    const d = x - riverX(y); if (Math.abs(d) < 72) x = riverX(y) + (d < 0 ? -72 : 72);   // keep the banks clear
    P.push([x, y]);
  }
  const side = n => Math.sign(P[n][0] - riverX(P[n][1]));
  const AV_ROW = [3, 11], AV_COL = [5, 18], BRIDGE_ROW = [3, 7, 11];
  const edges = [];
  const add = (a, b, kind) => edges.push({ a, b, kind });
  for (let j = 0; j < ROWS; j++) for (let i = 0; i < COLS; i++) {
    if (i < COLS - 1) {
      const a = id(i, j), b = id(i + 1, j);
      if (side(a) !== side(b)) { if (BRIDGE_ROW.includes(j)) add(a, b, KIND.bridge); }
      else add(a, b, AV_ROW.includes(j) ? KIND.avenue : KIND.street);
    }
    if (j < ROWS - 1) {
      const a = id(i, j), b = id(i, j + 1);
      if (side(a) === side(b)) add(a, b, AV_COL.includes(i) ? KIND.avenue : KIND.street);
    }
  }
  for (let k = 0; k < 7; k++) add(id(2 + k, 13 - k), id(3 + k, 12 - k), KIND.blvd);   // the boulevard, south-west to the centre
  // close some streets, but never cut the city in two
  const connected = (skip) => {
    const adj = P.map(() => []);
    edges.forEach((e, k) => { if (k === skip || e.closed) return; adj[e.a].push(e.b); adj[e.b].push(e.a); });
    const seen = new Uint8Array(P.length), st = [0]; seen[0] = 1; let n = 1;
    while (st.length) for (const v of adj[st.pop()]) if (!seen[v]) { seen[v] = 1; n++; st.push(v); }
    return n === P.length;
  };
  edges.forEach((e, k) => { if (e.kind === KIND.street && r() < 0.15 && connected(k)) e.closed = true; });
  const open = edges.filter(e => !e.closed);
  // city blocks for the backdrop: the cells a diagonal or the river does not cross
  const blocks = [];
  for (let j = 0; j < ROWS - 1; j++) for (let i = 0; i < COLS - 1; i++) {
    const q = [id(i, j), id(i + 1, j), id(i + 1, j + 1), id(i, j + 1)];
    if (new Set(q.map(side)).size > 1) continue;
    if (i >= 2 && i <= 8 && i + j === 14) continue;
    blocks.push({ q, park: r() < 0.09 });
  }
  return { P, edges: open, blocks };
})();
const NN = CITY.P.length, P = CITY.P, EDGES = CITY.edges;

// ---- rush hour: a congestion field, and each street's travel time -----------------
const SPOTS = [                                             // x, y, radius, weight
  [riverX(7 * SP), 7 * SP, 560, 1.0],                       // the middle bridge
  [MAPW * 0.64, MAPH * 0.42, 620, 0.85],                    // downtown, across the river
  [MAPW * 0.27, MAPH * 0.6, 460, 0.55],                     // the old town near home
  [MAPW * 0.83, MAPH * 0.78, 420, 0.4],
];
const jam = (x, y) => clamp(SPOTS.reduce((s, [sx, sy, rr, w]) => s + w * Math.exp(-((x - sx) ** 2 + (y - sy) ** 2) / (2 * rr * rr)), 0));
for (const e of EDGES) {
  const a = P[e.a], b = P[e.b];
  e.len = Math.hypot(b[0] - a[0], b[1] - a[1]);
  e.jam = jam((a[0] + b[0]) / 2, (a[1] + b[1]) / 2);
  e.slow = 1 + (e.kind === KIND.street ? 4 : 2.6) * e.jam;                      // how many times slower than free flow
  e.min = e.len / (SPEED[e.kind] * 1000 / 60) * e.slow;                          // minutes
}
const ADJ = P.map(() => []);
EDGES.forEach((e, k) => { ADJ[e.a].push([e.b, k]); ADJ[e.b].push([e.a, k]); });

/** Dijkstra from src with the given edge cost; stops once dst is settled. */
function dijkstra(src, dst, cost) {
  const dist = new Float64Array(NN).fill(Infinity), par = new Int32Array(NN).fill(-1), pe = new Int32Array(NN).fill(-1);
  const done = new Uint8Array(NN), order = [];
  dist[src] = 0;
  for (;;) {
    let u = -1, best = Infinity;
    for (let v = 0; v < NN; v++) if (!done[v] && dist[v] < best) { best = dist[v]; u = v; }
    if (u < 0) break;
    done[u] = 1; order.push(u);
    if (u === dst) break;
    for (const [v, k] of ADJ[u]) {
      const nd = dist[u] + cost(EDGES[k]);
      if (nd < dist[v]) { dist[v] = nd; par[v] = u; pe[v] = k; }
    }
  }
  const path = [], pedges = [];
  for (let v = dst; v >= 0; v = par[v]) { path.unshift(v); if (pe[v] >= 0) pedges.unshift(pe[v]); }
  return { dist, done, order, path, pedges };
}
const FAST = dijkstra(HOME, WORK, e => e.min);
const SHORT = dijkstra(HOME, WORK, e => e.len);
const routeStats = pe => ({ km: pe.reduce((s, k) => s + EDGES[k].len, 0) / 1000, min: pe.reduce((s, k) => s + EDGES[k].min, 0) });
const RF = routeStats(FAST.pedges), RS = routeStats(SHORT.pedges);
const DGOAL = FAST.dist[WORK], SETTLED = FAST.order.length;
const SETTLE_D = FAST.order.map(v => FAST.dist[v]);          // ascending
const settledBy = d => { let lo = 0, hi = SETTLE_D.length; while (lo < hi) { const m = (lo + hi) >> 1; if (SETTLE_D[m] <= d) lo = m + 1; else hi = m; } return lo; };

// ---- timeline (frames) ---------------------------------------------------------
const T = { reveal: 40, wave: 110, found: 400, path: 470, compare: 480, end: 648 };
const frontAt = f => DGOAL * prog(f, T.wave, T.found);        // the distance front, in minutes
const nodeF = v => T.wave + FAST.dist[v] / DGOAL * (T.found - T.wave);   // frame at which v is settled
const PATHLEN = FAST.pedges.reduce((s, k) => s + EDGES[k].len, 0);

// ---- drawing ------------------------------------------------------------------------
const BGC = [11, 13, 18], GREY = [92, 96, 104];
const mixRGB = (a, b, t) => a.map((v, k) => Math.round(lerp(v, b[k], t)));
/** Screen points of a route (a list of edges from `from`). */
function routePts(pedges, from, proj) {
  const pts = [proj(...P[from])]; let cur = from;
  for (const k of pedges) { const e = EDGES[k], nx = e.a === cur ? e.b : e.a; pts.push(proj(...P[nx])); cur = nx; }
  return pts;
}
/** Strokes the first u (0..1) of a polyline's screen length; returns the head point. */
function strokeUpto(g, pts, u) {
  let L = 0; const seg = [];
  for (let k = 1; k < pts.length; k++) { const d = Math.hypot(pts[k][0] - pts[k - 1][0], pts[k][1] - pts[k - 1][1]); seg.push(d); L += d; }
  let left = u * L, head = pts[0];
  g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
  for (let k = 1; k < pts.length && left > 0; k++) {
    const t = Math.min(1, left / seg[k - 1]); head = [lerp(pts[k - 1][0], pts[k][0], t), lerp(pts[k - 1][1], pts[k][1], t)];
    g.lineTo(head[0], head[1]); left -= seg[k - 1];
  }
  g.stroke();
  return head;
}
/** The whole map at frame f. proj(x, y) -> screen [x, y]; s: pixels per metre. */
function drawCity(g, f, proj, s) {
  const k = s / 0.3;                                          // line weights follow the zoom
  g.lineCap = 'round'; g.lineJoin = 'round';
  // the river
  g.beginPath();
  for (let y = -600; y <= MAPH + 600; y += 40) { const p = proj(riverX(y), y); if (y === -600) g.moveTo(p[0], p[1]); else g.lineTo(p[0], p[1]); }
  g.strokeStyle = '#12263A'; g.lineWidth = 120 * s; g.stroke();
  g.strokeStyle = '#1A3550'; g.lineWidth = 60 * s; g.stroke();
  // blocks and parks
  for (const b of CITY.blocks) {
    const c = b.q.map(n => P[n]), mx = c.reduce((s2, p) => s2 + p[0], 0) / 4, my = c.reduce((s2, p) => s2 + p[1], 0) / 4;
    g.beginPath();
    c.forEach((p, q) => { const sp = proj(lerp(p[0], mx, 0.24), lerp(p[1], my, 0.24)); if (q) g.lineTo(sp[0], sp[1]); else g.moveTo(sp[0], sp[1]); });
    g.closePath(); g.fillStyle = b.park ? '#16241E' : '#15181F'; g.fill();
  }
  // streets: grey, then coloured by traffic in a sweep from west to east
  const cmp = prog(f, T.compare, T.compare + 20);
  for (const e of EDGES) {
    const a = proj(...P[e.a]), b = proj(...P[e.b]);
    const mx = (P[e.a][0] + P[e.b][0]) / 2 / MAPW, kr = E.outCubic(prog(f, T.reveal + mx * 34, T.reveal + mx * 34 + 22));
    const col = mixRGB(BGC, mixRGB(GREY, rampRGB((e.slow - 1) / 4), kr), lerp(0.62, 0.9, kr) * (1 - 0.35 * cmp));
    g.strokeStyle = `rgb(${col.join(',')})`; g.lineWidth = (e.kind === KIND.street ? 4.2 : 7.5) * k;
    g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke();
  }
  // the search: each street fills from its settled end as the front passes
  const D = f >= T.found ? DGOAL : frontAt(f);
  const wa = 1 - 0.45 * prog(f, T.found + 10, T.found + 40) - 0.25 * cmp;
  if (D > 0) {
    g.strokeStyle = C.wave; g.globalAlpha = wa;
    const heads = [];
    for (const e of EDGES) {
      const lw = (e.kind === KIND.street ? 2.2 : 3.4) * k;
      for (const [u, v] of [[e.a, e.b], [e.b, e.a]]) {
        if (!FAST.done[u] || FAST.dist[u] > D) continue;
        const t = Math.min(1, (D - FAST.dist[u]) / e.min);
        if (t <= 0) continue;
        const a = proj(...P[u]), b = proj(...P[v]);
        g.lineWidth = lw; g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(lerp(a[0], b[0], t), lerp(a[1], b[1], t)); g.stroke();
        if (t < 1 && f < T.found) heads.push([lerp(a[0], b[0], t), lerp(a[1], b[1], t)]);
      }
    }
    g.fillStyle = '#FFFFFF';                                  // the tips of the front
    for (const h of heads) { g.beginPath(); g.arc(h[0], h[1], 3.6 * k, 0, Math.PI * 2); g.fill(); }
    // settled intersections, and the ones on the frontier (seen, not settled yet)
    for (let v = 0; v < NN; v++) {
      const p = proj(...P[v]);
      if (FAST.done[v] && FAST.dist[v] <= D) {
        const age = D - FAST.dist[v], pop = 1 - clamp(age / (DGOAL * 0.035));
        g.fillStyle = C.wave; g.beginPath(); g.arc(p[0], p[1], (2.6 + 4 * pop) * k, 0, Math.PI * 2); g.fill();
      } else if (f < T.found && ADJ[v].some(([u]) => FAST.done[u] && FAST.dist[u] <= D)) {
        g.strokeStyle = C.teal; g.lineWidth = 2 * k; g.beginPath(); g.arc(p[0], p[1], 5.5 * k, 0, Math.PI * 2); g.stroke();
      }
    }
    g.globalAlpha = 1;
  }
  // the shortest route (compare), dashed
  if (f >= T.compare) {
    const u = E.inOutCubic(prog(f, T.compare + 6, T.compare + 46));
    g.strokeStyle = C.paper; g.lineWidth = 5 * k; g.setLineDash([12 * k, 10 * k]);
    strokeUpto(g, routePts(SHORT.pedges, HOME, proj), u); g.setLineDash([]);
  }
  // the fastest route, traced back from work along the parent links
  if (f >= T.found) {
    const u = E.inOutCubic(prog(f, T.found + 4, T.path)), pts = routePts(FAST.pedges, HOME, proj).reverse();
    g.strokeStyle = C.bg; g.lineWidth = 15 * k; strokeUpto(g, pts, u);
    g.strokeStyle = C.amber; g.lineWidth = 8.5 * k; const hd = strokeUpto(g, pts, u);
    if (u < 1) { g.fillStyle = C.paper; g.beginPath(); g.arc(hd[0], hd[1], 8 * k, 0, Math.PI * 2); g.fill(); }
  }
  // home and work
  for (const [n, col, label] of [[HOME, C.teal, 'HOME'], [WORK, C.amber, 'WORK']]) {
    const p = proj(...P[n]);
    g.fillStyle = C.bg; g.beginPath(); g.arc(p[0], p[1], 15 * k, 0, Math.PI * 2); g.fill();
    g.strokeStyle = col; g.lineWidth = 4 * k; g.beginPath(); g.arc(p[0], p[1], 12 * k, 0, Math.PI * 2); g.stroke();
    g.fillStyle = col; g.beginPath(); g.arc(p[0], p[1], 5.5 * k, 0, Math.PI * 2); g.fill();
    g.font = `800 28px ${FONT}`; g.letterSpacing = '3px'; const tw = g.measureText(label).width; g.letterSpacing = '0px';
    g.fillStyle = 'rgba(11,13,18,0.82)'; g.fillRect(p[0] - tw / 2 - 10, p[1] - 30 * k - 34, tw + 20, 42);
    text(g, label, p[0] + 1.5, p[1] - 30 * k - 4, { size: 28, weight: 800, color: col, spacing: 3, align: 'center' });
  }
}
/** A route label: a pill with the time. */
function pill(g, x, y, str, col, alpha) {
  if (alpha <= 0.01) return;
  g.font = `800 30px ${MONO}`; g.letterSpacing = '0px'; const w = g.measureText(str).width + 28;
  g.globalAlpha = alpha; g.fillStyle = col; g.beginPath(); g.roundRect(x - w / 2, y - 24, w, 48, 24); g.fill(); g.globalAlpha = 1;
  text(g, str, x, y + 11, { size: 30, weight: 800, fam: MONO, color: C.bg, align: 'center', alpha });
}
/** Screen point at fraction t along a route. */
function routeAt(pedges, proj, t) {
  const pts = routePts(pedges, HOME, proj); return pts[Math.min(pts.length - 1, Math.round(t * (pts.length - 1)))];
}
function backdrop(g, w, h) { g.fillStyle = C.bg; g.fillRect(0, 0, w, h); }
function legend(g, x, y, w, alpha) {
  if (alpha <= 0.01) return;
  const gr = g.createLinearGradient(x, 0, x + w, 0);
  RAMP.forEach((c, q) => gr.addColorStop(q / 2, `rgb(${c.join(',')})`));
  g.globalAlpha = alpha; g.fillStyle = gr; g.fillRect(x, y, w, 10); g.globalAlpha = 1;
  text(g, 'clear', x, y + 46, { size: 28, weight: 600, color: C.dim, alpha });
  text(g, 'jammed', x + w, y + 46, { size: 28, weight: 600, color: C.dim, align: 'right', alpha });
  text(g, 'RUSH-HOUR TRAFFIC', x, y - 18, { size: 26, weight: 700, color: C.dim, spacing: 4, alpha });
}

// ---- landscape picture ------------------------------------------------------------------
function camL(f) {
  const push = E.inOutCubic(prog(f, 0, T.found)), back = E.inOutCubic(prog(f, T.compare - 10, T.compare + 40));
  const s = lerp(lerp(0.292, 0.308, push), 0.296, back);
  return { s, proj: (x, y) => [1250 + (x - MAPW / 2) * s, 574 + (y - MAPH / 2) * s] };
}
const fmin = m => m.toFixed(1);
function draw(f) {
  if (ctx.reset) ctx.reset();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none'; ctx.shadowBlur = 0;
  backdrop(ctx, W, H);
  const cam = camL(f);
  drawCity(ctx, f, cam.proj, cam.s);
  const endK = E.inOutCubic(prog(f, T.end, T.end + 20)), a = 1 - endK;
  // a scrim under the text column
  const sg = ctx.createLinearGradient(560, 0, 760, 0); sg.addColorStop(0, 'rgba(11,13,18,0.9)'); sg.addColorStop(1, 'rgba(11,13,18,0)');
  ctx.fillStyle = 'rgba(11,13,18,0.9)'; ctx.fillRect(0, 0, 560, H); ctx.fillStyle = sg; ctx.fillRect(560, 0, 200, H);
  text(ctx, 'ALGORITHMS  ·  DIJKSTRA', 120, 104, { size: 26, weight: 600, color: C.dim, spacing: 5, alpha: a });
  text(ctx, 'BYTEPATTERNS', 1800, 104, { size: 26, weight: 600, color: C.dim, spacing: 5, align: 'right', alpha: a });
  // hook
  {
    const k = E.outExpo(prog(f, -20, 4)), k2 = E.outExpo(prog(f, -14, 10)), k3 = E.outExpo(prog(f, 8, 30)), o = 1 - E.inCubic(prog(f, T.wave - 16, T.wave + 2));
    text(ctx, 'Rush hour.', 114, 330 + (1 - k) * 30, { size: 108, weight: 850, color: C.paper, spacing: -3, alpha: Math.min(k, o) });
    text(ctx, 'Home → work.', 118, 420 + (1 - k2) * 30, { size: 64, weight: 800, color: C.amber, spacing: -1, alpha: Math.min(k2, o) });

// ---- sound: a hum of traffic, a soft pluck per settled intersection, the route as a rising line --------
async function renderAudio() {

    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 420;
    const g = ac.createGain(); g.gain.setValueAtTime(0.0001, 0); g.gain.exponentialRampToValueAtTime(0.16, 0.25);
    g.gain.setValueAtTime(0.16, T.reveal / FPS); g.gain.linearRampToValueAtTime(0.26, (T.reveal + 50) / FPS);
    g.gain.setValueAtTime(0.26, T.compare / FPS); g.gain.linearRampToValueAtTime(0.12, (T.compare + 60) / FPS);

      const g = ac.createGain(); g.gain.setValueAtTime(0, a); g.gain.linearRampToValueAtTime(amp, a + (fa === 0 ? 0.1 : 1.2));

  return buf;
}

/* ==========================================================================
   VERTICAL CUT — shared block, identical in every piece.
   1080x1920 for Reels, Shorts and TikTok (__motion.variants.vertical). The
   piece's own scene code is re-used and recomposed for a phone: everything a
   viewer must read stays inside the area no platform covers (x 60..900,
   y 230..1400); outside it there is only dimmed texture.

const VW = 1080, VH = 1920, SAFE = { x: 60, y: 230, w: 840, h: 1170, r: 900, b: 1400 };

const VL = 96, VR = 864;                                          // text column inside the safe area

  vx.setTransform(1, 0, 0, 1, 0, 0); vx.globalAlpha = 1; vx.globalCompositeOperation = 'source-over';
  vx.filter = 'none'; vx.shadowBlur = 0; vx.shadowColor = 'transparent'; vx.letterSpacing = '0px'; vx.setLineDash([]);
  vx.textAlign = 'left'; vx.textBaseline = 'alphabetic'; vx.lineCap = 'butt'; vx.lineJoin = 'miter';
}
/** Canvas text on the vertical frame; `max` shrinks the size until the line fits. */
function vText(str, x, y, { size = 40, weight = 700, color = '#FFFFFF', align = 'left', spacing = 0, alpha = 1, fam = FONT, max = 0 } = {}) {
  if (alpha <= 0.002 || !str) return size;
  vx.font = `${weight} ${size}px ${fam}`; vx.letterSpacing = spacing + 'px';
  if (max) { const w = vx.measureText(str).width; if (w > max) { size = size * max / w; vx.font = `${weight} ${size}px ${fam}`; } }
  vx.textAlign = align; vx.textBaseline = 'alphabetic';
  const a0 = vx.globalAlpha; vx.globalAlpha = a0 * alpha; vx.fillStyle = color;
  vx.fillText(str, x + (align === 'center' ? spacing / 2 : align === 'right' ? spacing : 0), y);   // tracking is added after the last glyph too
  vx.globalAlpha = a0; vx.letterSpacing = '0px';

}
/** Word-wraps with the given font; returns the lines. */
function vWrap(str, maxW, size, weight = 700, fam = FONT) {
  vx.font = `${weight} ${size}px ${fam}`; vx.letterSpacing = '0px';
  const words = str.split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (vx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur);

}
/** Fade envelope with a small rise: [alpha, dy]. */
function vEnv(v, a, b, fin = 8, fout = 8) {
  const i = E.outCubic(prog(v, a, a + fin)), o = 1 - E.inCubic(prog(v, b - fout, b));

/** Which segment of a cut list a vertical frame is in: segs = [{ at, src, len }] in frames. */
function vSeg(segs, v) {
  let k = 0; while (k < segs.length - 1 && v >= segs[k + 1].at) k++;
  const s = segs[k];

  vx.fillStyle = `rgba(${rgb},${a})`;

/** Series tag at the top of the safe area, e.g. MADE IN CODE · 04. */
function vTag(label, color, alpha = 1) {
  vText('MADE IN CODE', VL, 292, { size: 28, weight: 800, color, spacing: 5, alpha });
  vx.font = `800 28px ${FONT}`; vx.letterSpacing = '5px';

/** Big hook lines, left-aligned from y0; visible from frame 0, settles in a few frames. */

/** Seeks a cut. The first frame a page draws is drawn twice: the very first read of a

let vWarm = false;

/** The soundtrack of a cut: the piece's own audio() spliced to the same segments as the picture. */

  const src = await renderAudio();

  for (const [mul, v, dec] of [[1, 1, 1.8], [2.01, 0.35, 0.8], [3.02, 0.12, 0.4]]) {
    const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.value = freq * mul;
    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol * v, at + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, at + dec);
    o.connect(g).connect(dest); o.start(at); o.stop(at + dec + 0.05);
  }
}

/* VERTICAL CUT — this piece */
// The same city and the same two searches, turned a quarter turn so home is
// at the bottom and work at the top; the camera climbs with the front, then
// pulls back to show both routes. A short stretch before the search is cut.
const VSEG = [
  { at: 0, src: 0, len: 90 },                                // hook and the traffic
  { at: 90, src: T.wave, len: 290 },                         // the whole search
  { at: 380, src: T.found, len: 70 },                        // the route
  { at: 450, src: T.compare, len: 90 },                      // shortest vs fastest
  { at: 540, src: T.end + 2, len: 60 },                      // closing card
];
const VFR = 600, VEND = VFR - 60;
const HX = P[HOME][0], WX = P[WORK][0];
function camV(v, seg, f) {
  const sNear = 0.345, sFar = 0.208, c0 = HX + 1000, c1 = WX - 1000;
  let cx = c0, s = sNear;
  if (seg === 1) cx = lerp(c0, c1, smooth(prog(f, T.wave, T.found)));
  else if (seg >= 2) { const z = E.inOutCubic(prog(v, 380, 412)); cx = lerp(c1, MAPW / 2, z); s = lerp(sNear, sFar, z); }
  return { s, proj: (x, y) => [480 + (y - MAPH / 2) * s, 1010 - (x - cx) * s] };
}
function vDraw(v) {
  const { k: seg, src } = vSeg(VSEG, v), f = Math.min(FRAMES - 1, src);
  vReset();
  backdrop(vx, VW, VH);
  const cam = camV(v, seg, f);
  drawCity(vx, f, cam.proj, cam.s);
  vReset();
  // a scrim under the type at the top
  vx.fillStyle = 'rgba(11,13,18,0.9)'; vx.fillRect(0, 0, VW, 560);
  const sg = vx.createLinearGradient(0, 560, 0, 650); sg.addColorStop(0, 'rgba(11,13,18,0.9)'); sg.addColorStop(1, 'rgba(11,13,18,0)');
  vx.fillStyle = sg; vx.fillRect(0, 560, VW, 90);
  if (seg >= 3) {                                            // time pills on both routes
    const pa = E.outCubic(prog(v, 470, 486));
    const ps = routeAt(SHORT.pedges, cam.proj, 0.46), pf = routeAt(FAST.pedges, cam.proj, 0.62);
    pill(vx, ps[0] - 30, ps[1], `${fmin(RS.min)} min`, C.paper, pa);
    pill(vx, pf[0] + 30, pf[1], `${fmin(RF.min)} min`, C.amber, pa);
  }
  vShade(C.bgRGB, 0.84);
  vTag('DIJKSTRA', C.amber);
  if (seg === 0) {
    vHook(v, ['Rush hour.'], 430, { size: 112, color: C.paper });
    vText('Home → work.', VL, 520, { size: 64, weight: 800, color: C.amber });
    const k3 = E.outExpo(prog(v, 6, 24));
    vText('Which way is fastest?', VL, 588 + (1 - k3) * 16, { size: 44, weight: 600, color: C.paper, alpha: k3 });
  } else if (seg === 1) {
    const [al, dy] = vEnv(v, 90, 382, 10, 8);
    const D = frontAt(f), n = settledBy(D);
    vText('DISTANCE FRONT', VL, 372 + dy, { size: 30, weight: 700, color: C.teal, spacing: 4, alpha: al });
    vText(`${fmin(D)} min`, VL - 6, 486 + dy, { size: 112, weight: 800, fam: MONO, color: C.paper, spacing: -4, alpha: al });
    vText(`${n} / ${NN} intersections settled`, VL, 548 + dy, { size: 34, weight: 600, color: C.amber, alpha: al, max: VR - VL });
  } else if (seg === 2) {
    const [al, dy] = vEnv(v, 380, 452, 8, 8);
    vText('Work reached.', VL, 400 + dy, { size: 84, weight: 850, color: C.paper, spacing: -2, alpha: al });
    vText(`${fmin(RF.min)} min`, VL - 6, 520 + dy, { size: 112, weight: 800, fam: MONO, color: C.amber, spacing: -4, alpha: al });
  } else {
    const [al, dy] = vEnv(v, 450, VEND + 4, 8, 8);
    vText('Shortest', VL, 390 + dy, { size: 84, weight: 850, color: C.paper, spacing: -3, alpha: al });
    vText('isn’t fastest.', VL, 470 + dy, { size: 84, weight: 850, color: C.amber, spacing: -3, alpha: al, max: VR - VL });
    const [a2, d2] = vEnv(v, 466, VEND + 4, 10, 8);
    vx.globalAlpha = a2; vx.strokeStyle = C.paper; vx.lineWidth = 5; vx.setLineDash([12, 10]);
    vx.beginPath(); vx.moveTo(VL, 530 + d2); vx.lineTo(VL + 56, 530 + d2); vx.stroke(); vx.setLineDash([]);
    vx.strokeStyle = C.amber; vx.lineWidth = 9; vx.beginPath(); vx.moveTo(VL, 580 + d2); vx.lineTo(VL + 56, 580 + d2); vx.stroke(); vx.globalAlpha = 1;
    vText(`shortest ${RS.km.toFixed(1)} km`, VL + 76, 541 + d2, { size: 32, weight: 700, color: C.paper, alpha: a2 });
    vText(`fastest ${RF.km.toFixed(1)} km`, VL + 76, 591 + d2, { size: 32, weight: 700, color: C.amber, alpha: a2 });
  }
  if (v >= VEND) vEndCard(v - VEND, { title: 'Dijkstra at Rush Hour', line: `shortest ${fmin(RS.min)} min · fastest ${fmin(RF.min)} min`,
    ink: C.paper, dim: 'rgba(238,234,226,0.72)', accent: C.amber, scrim: C.bgRGB, a: 0.86 });
  vReset();
}

window.__motion = {
  title: 'Dijkstra at Rush Hour',
  description: `Dijkstra's search spreads through a generated city where every street costs its rush-hour travel time; the fastest way to work is ${((RF.km / RS.km - 1) * 100).toFixed(0)}% longer than the shortest and ${fmin(RS.min - RF.min)} minutes sooner.`,
  fps: FPS, width: W, height: H, frames: FRAMES,
  poster: 330,
  gifStart: 5,
  seek(i) { draw(Math.max(0, Math.min(FRAMES - 1, Math.floor(i)))); },
  audio: renderAudio,
  variants: {
    vertical: {
      width: VW, height: VH, frames: VFR, canvas: vcv,
      poster: 300, gifStart: 4,
      seek(i) { vSeek(vDraw, i, VFR); },
      audio: () => vAudio(VSEG, VFR),
    },
  },
};

/* ==========================================================================
   PLAYER — identical in every piece; keep as is.
   Autoplays and loops, starts sound on the first click, ?frame=N pauses on a
   frame, ?variant=vertical plays the vertical cut (if the piece has one).
   When the renderer sets window.__MOTION_RENDER__ it stays out of the way.
   ========================================================================== */
(function player() {
  const btn = document.getElementById('sound'), q = new URLSearchParams(location.search);
  let M = window.__motion;
  const V = !window.__MOTION_RENDER__ && M.variants && M.variants[q.get('variant')];
  if (V) {                                                // show the variant's own canvas instead
    M = Object.assign({}, M, V);
    V.canvas.style.cssText = `width:min(100vw,calc(100vh*${V.width}/${V.height}));height:auto;aspect-ratio:${V.width}/${V.height}`;
    document.querySelector('canvas').replaceWith(V.canvas);
  }
  const dur = M.frames / M.fps;
  if (window.__MOTION_RENDER__) { btn.hidden = true; M.seek(0); return; }
  if (q.has('frame')) { btn.hidden = true; M.seek(+q.get('frame') || 0); return; }
  let t0 = performance.now(), ac = null, src = null, buf = null, paused = false, pausedAt = 0;
  const clock = () => ac && src ? (ac.currentTime - t0) : (performance.now() - t0) / 1000;
  function loop() {
    if (!paused) M.seek(Math.floor(((clock() % dur) + dur) % dur * M.fps));
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  btn.addEventListener('click', async () => {
    if (src) { src.stop(); src = null; btn.textContent = 'Click for sound'; t0 = performance.now(); return; }
    btn.textContent = 'Loading sound…';
    ac = ac || new AudioContext({ sampleRate: 48000 });
    buf = buf || await M.audio();
    await ac.resume();
    src = ac.createBufferSource(); src.buffer = buf; src.loop = true; src.connect(ac.destination);
    t0 = ac.currentTime + 0.05; src.start(t0);        // picture restarts from frame 0 in sync with the sound
    btn.textContent = 'Sound on — click to mute';
  });
  addEventListener('keydown', e => {
    if (e.code !== 'Space') return;
    e.preventDefault(); paused = !paused;
    if (ac) paused ? ac.suspend() : ac.resume();
    if (!ac) { if (paused) pausedAt = performance.now(); else t0 += performance.now() - pausedAt; }
  });
})();
</script>
