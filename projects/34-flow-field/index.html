<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="teambytepatterns">
<meta name="description" content="A field of arrows read from 3D Perlin noise, then 1,100 particles that follow it and draw rivers; halfway through the angle is turned up and the rivers curl.">
<title>Flow Field — motion-lab</title>
<style>
  /* Player chrome. The piece itself lives entirely in the canvas. */
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; font: 500 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; }
  canvas { display: block; width: min(100vw, calc(100vh * 16 / 9)); height: auto; aspect-ratio: 16 / 9; }
  #sound { position: fixed; left: 16px; bottom: 16px; padding: 8px 14px; border: 1px solid rgba(255,255,255,.35); border-radius: 999px;
           background: rgba(0,0,0,.55); color: #fff; font: inherit; cursor: pointer; }
  #sound[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080" aria-label="A grid of small arrows turning slowly over a grey noise pattern; then thousands of coloured particles stream along the arrows and draw river-like lines, which curl into eddies when the angle is turned up"></canvas>
<button id="sound" type="button">Click for sound</button>
<script>
'use strict';
/* ==========================================================================
   PIECE — Flow Field.
   3D Perlin noise ("improved" noise: a seeded permutation of 0..255,
   twelve gradient directions, the fade 6t^5 - 15t^4 + 10t^3) gives a
   smooth number between about -1 and 1 for every (x, y, t). Read as an
   angle, angle = noise(x / 380, y / 380, t) x 2pi x turn, it is a field of
   directions.
   1. The field: the noise as grey cells, and one arrow per cell.
   2. The flow: 1,100 particles start at seeded places; every frame each
      one steps 2.4 px in the direction under it. Where the arrows agree the
      particles bunch up into rivers. A particle that leaves the frame
      comes back on the opposite side; after its seeded lifetime it restarts
      at a new seeded place.
   3. The turn: the multiplier `turn` eases from 1 to 3, and the rivers
      curl into eddies.
   The whole run is simulated once (on first use) into Float32Arrays;
   each frame draws the last 26 positions of every particle from them, so
   seek(i) is pure in i.
   ========================================================================== */
const W = 1920, H = 1080, FPS = 30;
const cv = document.getElementById('stage');
const ctx = cv.getContext('2d', { willReadFrequently: true });   // CPU raster: identical pixels on every redraw
const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
const MONO = 'ui-monospace, "Cascadia Code", Consolas, Menlo, monospace';

// ---- helpers -------------------------------------------------------------
// ---- helpers -------------------------------------------------------------
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (f, a, b) => clamp((f - a) / (b - a));
const smooth = t => t * t * (3 - 2 * t);
const E = {
  inCubic: t => t * t * t,
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inOutCubic: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outExpo: t => t === 1 ? 1 : 1 - Math.pow(2, -10 * t),
  inExpo: t => t === 0 ? 0 : Math.pow(2, 10 * t - 10),
  inOutExpo: t => t === 0 ? 0 : t === 1 ? 1 : t < .5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2,
  outBack: t => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2),
};
/** Canvas text; `max` shrinks the size until the line fits. Returns the width drawn. */
function text(g, str, x, y, { size = 40, weight = 600, color = '#fff', alpha = 1, spacing = 0, align = 'left', fam = FONT, base = 'alphabetic', max = 0 } = {}) {
  if (alpha <= 0.002 || !str) return 0;
  g.font = `${weight} ${size}px ${fam}`; g.letterSpacing = spacing + 'px';
  if (max) { const w0 = g.measureText(str).width; if (w0 > max) { size *= max / w0; g.font = `${weight} ${size}px ${fam}`; } }
  g.textAlign = align; g.textBaseline = base;
  const a0 = g.globalAlpha; g.globalAlpha = a0 * alpha; g.fillStyle = color;
  g.fillText(str, x, y);
  const w = g.measureText(str).width;
  g.globalAlpha = a0; g.letterSpacing = '0px';
  return w;
}
const measure = (g, str, size, weight = 800, fam = FONT, spacing = 0) => { g.font = `${weight} ${size}px ${fam}`; g.letterSpacing = spacing + 'px'; const w = g.measureText(str).width; g.letterSpacing = '0px'; return w; };
const env = (f, a, b, fin = 12, fout = 10) => {
  const i = E.outCubic(prog(f, a, a + fin)), o = 1 - E.inCubic(prog(f, b - fout, b));
  return [Math.min(i, o), (1 - i) * 24 - (1 - o) * 10];
};

// ---- palette -------------------------------------------------------------
const C = {
  bg: '#07090F', bgRGB: '7,9,15', paper: '#EEF0F7', dim: 'rgba(238,240,247,0.62)', faint: 'rgba(238,240,247,0.16)',
  flow: ['#4FD1C5', '#6C8CFF', '#B07CFF', '#FF7AA8', '#FFC46B'],   // colour by heading, five sectors
  accent: '#FFC46B',
};

// ---- Perlin noise (improved, 3D), seeded permutation --------------------------------------
const PERM = (() => {
  const p = Array.from({ length: 256 }, (_, i) => i), r = mulberry32(0x34F10);
  for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [p[i], p[j]] = [p[j], p[i]]; }
  const out = new Uint8Array(512); for (let i = 0; i < 512; i++) out[i] = p[i & 255];
  return out;
})();
const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
function grad(h, x, y, z) {
  const k = h & 15, u = k < 8 ? x : y, v = k < 4 ? y : k === 12 || k === 14 ? x : z;
  return ((k & 1) ? -u : u) + ((k & 2) ? -v : v);
}
function noise3(x, y, z) {
  const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
  x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
  const u = fade(x), v = fade(y), w = fade(z), P = PERM;
  const A = P[X] + Y, AA = P[A] + Z, AB = P[A + 1] + Z, B = P[X + 1] + Y, BA = P[B] + Z, BB = P[B + 1] + Z;
  return lerp(lerp(lerp(grad(P[AA], x, y, z), grad(P[BA], x - 1, y, z), u), lerp(grad(P[AB], x, y - 1, z), grad(P[BB], x - 1, y - 1, z), u), v),
    lerp(lerp(grad(P[AA + 1], x, y, z - 1), grad(P[BA + 1], x - 1, y, z - 1), u), lerp(grad(P[AB + 1], x, y - 1, z - 1), grad(P[BB + 1], x - 1, y - 1, z - 1), u), v), w);
}
const SCALE = 380, ZSPEED = 0.0032, STEP = 2.4, TRAIL = 26, NP = 1100;
const TAU = Math.PI * 2;

// ---- timeline -------------------------------------------------------------------------------
function buildTL(o) {
  const TL = Object.assign({ o }, o);
  TL.caps = [
    [o.field - 4, o.flow + 40, 'Perlin noise:|smooth random numbers.'],
    [o.flow + 34, o.turn - 6, 'Read it as an angle.|Every particle follows it.'],
    [o.turn - 4, o.calm, 'Turn the angle up.|The rivers curl.'],
  ];
  return TL;
}
const turnAt = (TL, f) => 1 + 2 * E.inOutCubic(prog(f, TL.turn, TL.turn + TL.turnLen));
const angleAt = (TL, x, y, f, G) => noise3(x / SCALE * G.ns, y / SCALE * G.ns, f * ZSPEED) * TAU * turnAt(TL, f);
const TLL = buildTL({ field: 50, flow: 170, turn: 440, turnLen: 70, calm: 640, end: 700 });
const FRAMES = TLL.end + 72;

// ---- the simulation, run once on first use per cut ---------------------------------------
/** Steps NP particles through the field for `frames` frames on a w x h stage. */
function simulate(TL, G, frames) {
  const X = new Float32Array(NP * frames), Y = new Float32Array(NP * frames), K = new Uint8Array(NP * frames);
  const r = mulberry32(G.seed);
  const px = new Float32Array(NP), py = new Float32Array(NP), life = new Int32Array(NP);
  const spawn = i => { px[i] = r() * G.w; py[i] = r() * G.h; life[i] = 120 + Math.floor(r() * 140); };
  for (let i = 0; i < NP; i++) { spawn(i); life[i] = Math.floor(r() * 260); }
  let calls = 0;
  for (let f = 0; f < frames; f++) {
    for (let i = 0; i < NP; i++) {
      const a = angleAt(TL, px[i], py[i], f, G); calls++;
      if (f > 0) {
        px[i] += Math.cos(a) * G.step; py[i] += Math.sin(a) * G.step;
        if (px[i] < 0) px[i] += G.w; else if (px[i] >= G.w) px[i] -= G.w;
        if (py[i] < 0) py[i] += G.h; else if (py[i] >= G.h) py[i] -= G.h;
        if (--life[i] <= 0) spawn(i);
      }
      const o = f * NP + i;
      X[o] = px[i]; Y[o] = py[i];
      K[o] = Math.floor(((a % TAU) + TAU) % TAU / TAU * 5) % 5;
    }
  }
  return { X, Y, K, frames, calls };
}
const cache = {};
const simOf = (key, TL, G, frames) => cache[key] || (cache[key] = simulate(TL, G, frames));

// ---- drawing ------------------------------------------------------------------------------
function fieldLayer(g, G, f, alpha) {
  if (alpha <= 0.01) return;
  const TL = G.TL, cs = G.cell, nx = Math.ceil(G.w / cs), ny = Math.ceil(G.h / cs);
  g.save();
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
    const cx = (i + 0.5) * cs, cy = (j + 0.5) * cs;
    const n = noise3(cx / SCALE * G.ns, cy / SCALE * G.ns, f * ZSPEED);
    g.globalAlpha = alpha * (0.05 + 0.1 * (n + 1) / 2);
    g.fillStyle = C.paper; g.fillRect(i * cs + 1, j * cs + 1, cs - 2, cs - 2);
  }
  g.lineWidth = G.alw; g.lineCap = 'round';
  const paths = C.flow.map(() => new Path2D());
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
    const cx = (i + 0.5) * cs, cy = (j + 0.5) * cs, a = angleAt(TL, cx, cy, f, G), L = cs * 0.34;
    const k = Math.floor(((a % TAU) + TAU) % TAU / TAU * 5) % 5, p = paths[k];
    const dx = Math.cos(a) * L, dy = Math.sin(a) * L;
    p.moveTo(cx - dx, cy - dy); p.lineTo(cx + dx, cy + dy);
    p.moveTo(cx + dx - Math.cos(a - 0.5) * L * 0.55, cy + dy - Math.sin(a - 0.5) * L * 0.55); p.lineTo(cx + dx, cy + dy);
    p.lineTo(cx + dx - Math.cos(a + 0.5) * L * 0.55, cy + dy - Math.sin(a + 0.5) * L * 0.55);
  }
  g.globalAlpha = alpha * 0.85;
  paths.forEach((p, k) => { g.strokeStyle = C.flow[k]; g.stroke(p); });
  g.restore();
}
function particles(g, G, S, f, alpha) {
  if (alpha <= 0.01) return;
  const bands = 1, seg = TRAIL / bands, X = S.X, Y = S.Y, K = S.K;
  const paths = [];
  for (let k = 0; k < 5; k++) for (let b = 0; b < bands; b++) paths.push(new Path2D());
  const f0 = Math.max(0, f - TRAIL);
  for (let i = 0; i < NP; i++) {
    const kc = K[f * NP + i];
    for (let b = 0; b < bands; b++) {
      const a0 = Math.max(f0, f - TRAIL + b * seg), a1 = f - TRAIL + (b + 1) * seg;
      if (a1 <= a0) continue;
      const p = paths[kc * bands + b];
      let lx = X[a0 * NP + i], ly = Y[a0 * NP + i];
      p.moveTo(lx, ly);
      for (let t = a0 + 1; t <= a1; t++) {
        const x = X[t * NP + i], y = Y[t * NP + i];
        if (Math.abs(x - lx) > 40 || Math.abs(y - ly) > 40) p.moveTo(x, y); else p.lineTo(x, y);
        lx = x; ly = y;
      }
    }
  }
  g.save(); g.lineCap = 'round'; g.lineJoin = 'round'; g.lineWidth = G.plw;
  for (let k = 0; k < 5; k++) for (let b = 0; b < bands; b++) {
    g.globalAlpha = alpha * 0.92; g.strokeStyle = C.flow[k]; g.stroke(paths[k * bands + b]);
  }
  g.restore();
}
function caption(g, G, f) {
  for (const [t0, t1, str] of G.TL.caps) {
    const [a, dy] = env(f, t0, t1, 12, 10); if (a <= 0) continue;
    const [p1, p2] = str.split('|');
    if (G.capTwo) {
      text(g, p1, G.capX, G.capY + dy, { size: G.cap, weight: 850, color: C.paper, spacing: -1, alpha: a, max: G.capMax });
      text(g, p2, G.capX, G.capY + G.cap * 1.14 + dy, { size: G.cap, weight: 850, color: C.accent, spacing: -1, alpha: a, max: G.capMax });
    } else {
      const w1 = text(g, p1 + ' ', G.capX, G.capY + dy, { size: G.cap, weight: 850, color: C.paper, spacing: -1, alpha: a });
      text(g, p2, G.capX + w1, G.capY + dy, { size: G.cap, weight: 850, color: C.accent, spacing: -1, alpha: a });
    }
  }
}
/** The formula, with the live multiplier, and the particle count. */
function readout(g, G, f, S) {
  const TL = G.TL, [a] = env(f, TL.field - 6, TL.end + 10, 12, 12);
  if (a <= 0) return;
  const tn = turnAt(TL, f), s1 = 'angle = noise(x, y, t) × 2π × ', s2 = tn.toFixed(2);
  const w1 = measure(g, s1, G.fo, 700, MONO);
  const x0 = G.foAlign === 'left' ? G.foX : G.foX - w1 - measure(g, s2, G.fo, 800, MONO);
  g.save(); g.fillStyle = `rgba(${C.bgRGB},0.72)`; g.fillRect(x0 - 16, G.foY - G.fo * 1.05, w1 + measure(g, s2, G.fo, 800, MONO) + 32, G.fo * 1.5); g.restore();
  text(g, s1, x0, G.foY, { size: G.fo, weight: 700, color: C.paper, fam: MONO, alpha: a });
  text(g, s2, x0 + w1, G.foY, { size: G.fo, weight: 800, color: C.accent, fam: MONO, alpha: a });
  const pa = a * E.outCubic(prog(f, TL.flow, TL.flow + 20));
  if (pa > 0.01) {
    const s = `${NP.toLocaleString('en-US')} particles`;
    g.save(); const pw = measure(g, s, G.fo, 700, MONO); g.fillStyle = `rgba(${C.bgRGB},0.72)`;
    const px = G.pcAlign === 'right' ? G.pcX - pw : G.pcX; g.globalAlpha = pa; g.fillRect(px - 16, G.pcY - G.fo * 1.05, pw + 32, G.fo * 1.5); g.restore();
    text(g, s, G.pcX, G.pcY, { size: G.fo, weight: 700, color: C.paper, fam: MONO, align: G.pcAlign, alpha: pa });
  }
}
function finale(g, G, f, S) {
  const TL = G.TL, k1 = E.outCubic(prog(f, TL.calm, TL.calm + 18)), k2 = E.outCubic(prog(f, TL.calm + 10, TL.calm + 28));
  if (k1 <= 0) return;
  const out = 1 - E.inCubic(prog(f, TL.end - 6, TL.end + 12));
  const s1 = 'One function.', s2 = `${(S.frames * NP).toLocaleString('en-US')} steps.`;
  g.save(); g.fillStyle = `rgba(${C.bgRGB},${0.55 * k1 * out})`; g.fillRect(0, G.fnY - G.fn * 1.15, G.w, G.fn * 2.7); g.restore();
  text(g, s1, G.fnX, G.fnY, { size: G.fn, weight: 900, color: C.paper, spacing: -2, align: G.fnAlign, alpha: k1 * out });
  text(g, s2, G.fnX, G.fnY + G.fn * 1.1, { size: G.fn, weight: 900, color: C.accent, spacing: -2, align: G.fnAlign, alpha: k2 * out, max: G.fnMax });
}
function scene(g, G, f, S) {
  const TL = G.TL;
  const fa = 1 - E.inOutCubic(prog(f, TL.flow + 10, TL.flow + 70));
  fieldLayer(g, G, f, Math.max(G.fieldMin, fa) * (1 - E.inCubic(prog(f, TL.flow + 70, TL.flow + 90))));
  const pa = E.outCubic(prog(f, TL.flow, TL.flow + 40)) * (1 - 0.35 * E.inCubic(prog(f, TL.end - 10, TL.end + 20)));
  particles(g, G, S, f, pa);
  // soft scrims behind the type: top and bottom bands fade the lines out
  for (const [y0, y1] of G.scrims) {
    const gr = g.createLinearGradient(0, y0, 0, y1);
    gr.addColorStop(0, `rgba(${C.bgRGB},0.88)`); gr.addColorStop(1, `rgba(${C.bgRGB},0)`);
    g.fillStyle = gr; g.fillRect(0, Math.min(y0, y1), G.w, Math.abs(y1 - y0));
  }
  caption(g, G, f); readout(g, G, f, S); finale(g, G, f, S);
}

// ---- landscape picture ------------------------------------------------------------------
const GL = { TL: TLL, w: W, h: H, ns: 1, step: STEP, seed: 0x34A11, cell: 40, alw: 2, plw: 2.1, fieldMin: 0.45, scrims: [[0, 290], [H, 930]],
  capX: 120, capY: 216, cap: 52, capTwo: false, capMax: 1680,
  fo: 30, foX: 120, foY: 1004, foAlign: 'left', pcX: 1800, pcY: 1004, pcAlign: 'right',
  fn: 96, fnX: W / 2, fnY: 520, fnAlign: 'center', fnMax: 1680 };
function hookL(f) {
  const o = 1 - E.inCubic(prog(f, TLL.field - 6, TLL.field + 10));
  if (o <= 0) return;
  const k = E.outExpo(prog(f, -8, 10)), k2 = E.outBack(prog(f, -6, 12));
  ctx.save(); ctx.fillStyle = `rgba(${C.bgRGB},${0.6 * o})`; ctx.fillRect(0, 400, W, 330); ctx.restore();
  text(ctx, 'No one steers these lines.', W / 2, 540 + (1 - k) * 30, { size: 108, weight: 900, color: C.paper, spacing: -3, align: 'center', alpha: o * Math.max(0.3, k) });
  text(ctx, 'They follow one function.', W / 2, 670 + (1 - clamp(k2)) * 30, { size: 108, weight: 900, color: C.accent, spacing: -3, align: 'center', alpha: o * Math.max(0.3, clamp(k2)) });
}
function draw(f) {
  if (ctx.reset) ctx.reset();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none'; ctx.shadowBlur = 0;
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  const S = simOf('L', TLL, GL, FRAMES);
  const T = TLL, endK = E.inOutCubic(prog(f, T.end, T.end + 20)), a = 1 - endK;
  scene(ctx, GL, f, S);
  text(ctx, 'GENERATIVE  ·  FLOW FIELD', 120, 104, { size: 26, weight: 600, color: C.dim, spacing: 5, alpha: a });
  text(ctx, 'BYTEPATTERNS', 1800, 104, { size: 26, weight: 600, color: C.dim, spacing: 5, align: 'right', alpha: a });
  hookL(f);
  if (endK > 0) {
    ctx.fillStyle = `rgba(${C.bgRGB},${0.86 * endK})`; ctx.fillRect(0, 0, W, H);
    const k1 = E.outCubic(prog(f, T.end + 6, T.end + 28)), k2 = E.outCubic(prog(f, T.end + 16, T.end + 38)), k3 = E.outCubic(prog(f, T.end + 26, T.end + 48));
    text(ctx, 'Flow Field', W / 2, 500 + (1 - k1) * 30, { size: 140, weight: 850, color: C.paper, spacing: -3, align: 'center', alpha: k1 });
    text(ctx, `3D Perlin noise  ·  ${NP.toLocaleString('en-US')} particles  ·  one angle per point`, W / 2, 580 + (1 - k2) * 20, { size: 42, weight: 500, color: C.accent, align: 'center', alpha: k2 });
    text(ctx, 'drawn in code  ·  bytepatterns.com', W / 2, 1000, { size: 32, weight: 600, color: C.paper, spacing: 3, align: 'center', alpha: k3 * 0.8 });
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.letterSpacing = '0px';
}

// ---- sound: a slow pad whose filter opens with the turn, and a bell line read from the noise --------
const BEAT = 24;                                              // 75 BPM
const PENTA = [0, 2, 4, 7, 9];
async function renderAudio(TL = TLL, frames = FRAMES) {
  const SR = 48000, dur = frames / FPS, LEN = Math.round(SR * dur);
  const ac = new OfflineAudioContext(2, LEN, SR);
  const at = fr => fr / FPS;
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -16; comp.ratio.value = 3; comp.attack.value = 0.005; comp.release.value = 0.25;
  const master = ac.createGain(); master.gain.value = 0.9; master.connect(comp).connect(ac.destination);
  master.gain.setValueAtTime(0.9, dur - 1.0); master.gain.linearRampToValueAtTime(0.0001, dur - 0.02);
  const rnd = mulberry32(0x34B7);
  const ir = ac.createBuffer(2, SR * 2.6, SR);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let k = 0; k < d.length; k++) d[k] = (rnd() * 2 - 1) * Math.pow(1 - k / d.length, 2.6); }
  const verb = ac.createConvolver(); verb.buffer = ir; const vg = ac.createGain(); vg.gain.value = 0.36; verb.connect(vg).connect(master);
  const noise = ac.createBuffer(1, SR * 2, SR); { const d = noise.getChannelData(0); for (let k = 0; k < d.length; k++) d[k] = rnd() * 2 - 1; }
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  // pad: four chords, each two bars, through one low-pass whose cutoff follows the turn
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 2; lp.connect(master); lp.connect(verb);
  lp.frequency.setValueAtTime(380, 0);
  lp.frequency.linearRampToValueAtTime(700, at(TL.flow + 40));
  lp.frequency.setValueAtTime(700, at(TL.turn)); lp.frequency.exponentialRampToValueAtTime(2600, at(TL.turn + TL.turnLen));
  lp.frequency.setValueAtTime(2600, at(TL.calm)); lp.frequency.exponentialRampToValueAtTime(600, at(TL.end + 40));
  const CH = [[50, 57, 62, 69], [46, 53, 58, 65], [43, 50, 57, 62], [45, 52, 57, 64]];
  for (let bar = 0; bar * BEAT * 8 < frames; bar++) {
    const t0 = at(bar * BEAT * 8), len = BEAT * 8 / FPS;
    CH[bar % CH.length].forEach((m, i) => { for (const det of [-6, 6]) {
      const o = ac.createOscillator(), g = ac.createGain(), p = ac.createStereoPanner(); o.type = 'sawtooth'; o.frequency.value = hz(m); o.detune.value = det;
      p.pan.value = (i / 3 - 0.5) * 0.8 * Math.sign(det);
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.02, t0 + 0.9); g.gain.setValueAtTime(0.02, t0 + len - 0.6); g.gain.exponentialRampToValueAtTime(0.0001, t0 + len + 0.4);
      o.connect(g).connect(p).connect(lp); o.start(t0); o.stop(t0 + len + 0.45); } });
  }
  // the particles arrive: a swell of filtered noise
  { const s = ac.createBufferSource(); s.buffer = noise; s.loop = true; const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 0.8;
    bp.frequency.setValueAtTime(300, at(TL.flow)); bp.frequency.exponentialRampToValueAtTime(3000, at(TL.flow + 60));
    const g = ac.createGain(); g.gain.setValueAtTime(0.0001, at(TL.flow)); g.gain.exponentialRampToValueAtTime(0.05, at(TL.flow + 40)); g.gain.exponentialRampToValueAtTime(0.012, at(TL.flow + 120));
    g.gain.setValueAtTime(0.012, at(TL.end)); g.gain.exponentialRampToValueAtTime(0.0001, at(TL.end + 40));
    s.connect(bp).connect(g).connect(master); g.connect(verb); s.start(at(TL.flow)); s.stop(at(TL.end + 42)); }
  // bells: every half beat from the field on, the noise at a point moving across the stage picks a note
  const bell = (t0, m, amp, pn) => { for (const [r2, a2, d2] of [[1, 1, 2.0], [2.76, 0.28, 0.8], [5.4, 0.08, 0.3]]) {
    const o = ac.createOscillator(); o.frequency.value = hz(m) * r2; const g = ac.createGain(), p = ac.createStereoPanner();
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(amp * a2, t0 + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d2);
    p.pan.value = pn; o.connect(g).connect(p); p.connect(master); p.connect(verb); o.start(t0); o.stop(t0 + d2 + 0.05); } };
  for (let fr = TL.field; fr < TL.end; fr += BEAT / 2) {
    const u = (fr - TL.field) / (TL.end - TL.field), x = 200 + u * 1500, y = 540 + 300 * Math.sin(u * 5);
    const n = noise3(x / SCALE, y / SCALE, fr * ZSPEED), idx = clamp(Math.floor((n + 0.8) / 1.6 * 10), 0, 9);
    const m = 62 + 12 * Math.floor(idx / 5) + PENTA[idx % 5];
    bell(at(fr), m, fr >= TL.turn ? 0.06 : 0.045, (u - 0.5) * 1.2);
  }
  [62, 66, 69, 74].forEach((m, i) => bell(at(TL.calm) + i * 0.09, m, 0.06, -0.3 + i * 0.2));
  [69, 74, 78, 81].forEach((m, i) => bell(at(TL.end + 10 + i * 6), m, 0.06, -0.45 + i * 0.3));
  const buf = await ac.startRendering();
  let peak = 0; for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let k = 0; k < d.length; k++) peak = Math.max(peak, Math.abs(d[k])); }
  if (peak > 0.89) for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let k = 0; k < d.length; k++) d[k] *= 0.89 / peak; }
  return buf;
}

/* ==========================================================================
   VERTICAL CUT — shared block, identical in every piece.
   1080x1920 for Reels, Shorts and TikTok (__motion.variants.vertical). The
   piece's own scene code is re-used and recomposed for a phone: everything a
   viewer must read stays inside the area no platform covers (x 60..900,
   y 230..1400); outside it there is only dimmed texture.
   ========================================================================== */
const VW = 1080, VH = 1920, SAFE = { x: 60, y: 230, w: 840, h: 1170, r: 900, b: 1400 };
const vcv = document.createElement('canvas'); vcv.width = VW; vcv.height = VH;
const vx = vcv.getContext('2d', { willReadFrequently: true });   // CPU raster: identical pixels on every redraw
const VL = 96, VR = 864;                                          // text column inside the safe area

function vReset() {
  vx.setTransform(1, 0, 0, 1, 0, 0); vx.globalAlpha = 1; vx.globalCompositeOperation = 'source-over';
  vx.filter = 'none'; vx.shadowBlur = 0; vx.shadowColor = 'transparent'; vx.letterSpacing = '0px'; vx.setLineDash([]);
  vx.textAlign = 'left'; vx.textBaseline = 'alphabetic'; vx.lineCap = 'butt'; vx.lineJoin = 'miter';
}
/** Canvas text on the vertical frame; `max` shrinks the size until the line fits. */
function vText(str, x, y, { size = 40, weight = 700, color = '#FFFFFF', align = 'left', spacing = 0, alpha = 1, fam = FONT, max = 0 } = {}) {
  if (alpha <= 0.002 || !str) return size;
  vx.font = `${weight} ${size}px ${fam}`; vx.letterSpacing = spacing + 'px';
  if (max) { const w = vx.measureText(str).width; if (w > max) { size = size * max / w; vx.font = `${weight} ${size}px ${fam}`; } }
  vx.textAlign = align; vx.textBaseline = 'alphabetic';
  const a0 = vx.globalAlpha; vx.globalAlpha = a0 * alpha; vx.fillStyle = color;
  vx.fillText(str, x + (align === 'center' ? spacing / 2 : align === 'right' ? spacing : 0), y);   // tracking is added after the last glyph too
  vx.globalAlpha = a0; vx.letterSpacing = '0px';
  return size;
}
/** Word-wraps with the given font; returns the lines. */
function vWrap(str, maxW, size, weight = 700, fam = FONT) {
  vx.font = `${weight} ${size}px ${fam}`; vx.letterSpacing = '0px';
  const words = str.split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (vx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur);
  return lines;
}
/** Fade envelope with a small rise: [alpha, dy]. */
function vEnv(v, a, b, fin = 8, fout = 8) {
  const i = E.outCubic(prog(v, a, a + fin)), o = 1 - E.inCubic(prog(v, b - fout, b));
  return [Math.min(i, o), (1 - i) * 22 - (1 - o) * 10];
}
/** Which segment of a cut list a vertical frame is in: segs = [{ at, src, len }] in frames. */
function vSeg(segs, v) {
  let k = 0; while (k < segs.length - 1 && v >= segs[k + 1].at) k++;
  const s = segs[k];
  return { k, s, local: v - s.at, src: s.src + (v - s.at) };
}
/** Dims everything outside the safe area to a quiet texture (brightness x 0.2), with a soft inner edge. */
function vShade(rgb, a = 0.8, feather = 40) {
  vx.save(); vx.setTransform(1, 0, 0, 1, 0, 0); vx.globalAlpha = 1; vx.globalCompositeOperation = 'source-over';
  vx.fillStyle = `rgba(${rgb},${a})`;
  vx.beginPath(); vx.rect(0, 0, VW, VH); vx.rect(SAFE.x, SAFE.y, SAFE.w, SAFE.h); vx.fill('evenodd');
  const strip = (x0, y0, x1, y1, rx, ry, rw, rh) => {
    const g = vx.createLinearGradient(x0, y0, x1, y1);
    g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`);
    vx.fillStyle = g; vx.fillRect(rx, ry, rw, rh);
  };
  strip(SAFE.x, 0, SAFE.x + feather, 0, SAFE.x, SAFE.y, feather, SAFE.h);
  strip(SAFE.r, 0, SAFE.r - feather, 0, SAFE.r - feather, SAFE.y, feather, SAFE.h);
  strip(0, SAFE.y, 0, SAFE.y + feather, SAFE.x, SAFE.y, SAFE.w, feather);
  strip(0, SAFE.b, 0, SAFE.b - feather, SAFE.x, SAFE.b - feather, SAFE.w, feather);
  vx.restore();
}
/** Series tag at the top of the safe area, e.g. MADE IN CODE · 04. */
function vTag(label, color, alpha = 1) {
  vText('MADE IN CODE', VL, 292, { size: 28, weight: 800, color, spacing: 5, alpha });
  vx.font = `800 28px ${FONT}`; vx.letterSpacing = '5px';
  const w = vx.measureText('MADE IN CODE').width; vx.letterSpacing = '0px';
  vText('·  ' + label, VL + w + 14, 292, { size: 28, weight: 600, color: 'rgba(255,255,255,0.72)', spacing: 3, alpha, max: VR - VL - w - 14 });
}
/** Big hook lines, left-aligned from y0; visible from frame 0, settles in a few frames. */
function vHook(v, lines, y0, { size = 84, lh = 1.08, color = '#FFFFFF', accent = null, weight = 800, spacing = -1.5, alpha = 1 } = {}) {
  const k = E.outExpo(prog(v, -6, 12));
  lines.forEach((ln, i) => {
    const kk = E.outExpo(prog(v, -12 + i * 2, 8 + i * 2));
    vText(ln, VL, y0 + i * size * lh + (1 - kk) * 30, { size, weight, spacing, color: accent && i === lines.length - 1 ? accent : color, alpha: alpha * Math.max(0.25, kk), max: VR - VL });
  });
  return k;
}
/** Closing card, the last 60 frames: piece title, "drawn in code · bytepatterns.com". l = frames into the card. */
function vEndCard(l, { title, line = '', ink = '#FFFFFF', dim = 'rgba(255,255,255,0.66)', accent = '#FFFFFF', scrim = '0,0,0', a = 0.84 }) {
  const k = E.outCubic(prog(l, 0, 12));
  vx.save(); vx.setTransform(1, 0, 0, 1, 0, 0);
  vx.fillStyle = `rgba(${scrim},${a * k})`; vx.fillRect(0, 0, VW, VH);
  vx.restore();
  const t1 = E.outExpo(prog(l, 3, 19)), t2 = E.outExpo(prog(l, 11, 27)), t3 = E.outExpo(prog(l, 19, 35));
  vx.fillStyle = accent; vx.globalAlpha = t1; vx.fillRect(VL, 742, 88 * t1, 7); vx.globalAlpha = 1;
  const size = vText(title, VL, 850 + (1 - t1) * 40, { size: 92, weight: 800, color: ink, spacing: -2, alpha: t1, max: VR - VL });
  const y2 = 850 + Math.max(size, 60) * 0.25 + 70;
  vx.font = `600 44px ${FONT}`;
  const lead = 'drawn in code  ·  ', lw = vx.measureText(lead).width;
  vText(lead, VL, y2 + (1 - t2) * 24, { size: 44, weight: 600, color: dim, alpha: t2 });
  vText('bytepatterns.com', VL + lw, y2 + (1 - t2) * 24, { size: 44, weight: 800, color: accent, alpha: t2 });
  if (line) vText(line, VL, y2 + 72 + (1 - t3) * 18, { size: 32, weight: 500, color: dim, alpha: t3, max: VR - VL });
}
/** Seeks a cut. The first frame a page draws is drawn twice: the very first read of a
 *  GPU-backed source canvas can come out a shade different from every later one. */
let vWarm = false;
function vSeek(draw, i, frames) {
  const f = Math.max(0, Math.min(frames - 1, Math.floor(i)));
  if (!vWarm) { vWarm = true; draw(f); }
  draw(f);
}
/** The soundtrack of a cut: the piece's own audio() spliced to the same segments as the picture. */
async function vAudio(segs, frames, { xf = 0.025, fadeOut = 0.6, extra = null } = {}) {
  const src = await renderAudio();
  const SR = 48000, dur = frames / FPS, ac = new OfflineAudioContext(2, Math.round(SR * dur), SR);
  const out = ac.createGain(); out.connect(ac.destination);
  out.gain.setValueAtTime(1, 0); out.gain.setValueAtTime(1, dur - fadeOut); out.gain.linearRampToValueAtTime(0, dur - 0.01);
  segs.forEach((s, k) => {
    const at = s.at / FPS, off = s.src / FPS, d = s.len / FPS;
    const pre = k === 0 ? 0 : Math.min(xf, off), post = k === segs.length - 1 ? 0 : xf;
    const b = ac.createBufferSource(), g = ac.createGain(); b.buffer = src;
    g.gain.setValueAtTime(pre ? 0 : 1, at - pre);
    if (pre) g.gain.linearRampToValueAtTime(1, at + pre);
    if (post) { g.gain.setValueAtTime(1, at + d - post); g.gain.linearRampToValueAtTime(0, at + d + post); }
    b.connect(g).connect(out); b.start(at - pre, off - pre, d + pre + post);
  });
  if (extra) extra(ac, out);
  const buf = await ac.startRendering();
  let peak = 0; for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) peak = Math.max(peak, Math.abs(d[i])); }
  if (peak > 0.9) for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] *= 0.9 / peak; }
  return buf;
}
/** A soft three-partial bell, for the closing card. */
function vChime(ac, dest, at, freq, vol = 0.08) {
  for (const [mul, v, dec] of [[1, 1, 1.8], [2.01, 0.35, 0.8], [3.02, 0.12, 0.4]]) {
    const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.value = freq * mul;
    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol * v, at + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, at + dec);
    o.connect(g).connect(dest); o.start(at); o.stop(at + dec + 0.05);
  }
}

/* VERTICAL CUT — this piece */
// Its own run on a 1080 x 1920 stage (the same noise, the same rules, the
// same particle count), on a shorter clock; the type sits inside the safe
// area and everything outside it is dimmed by the shared shade.
const TLV = buildTL({ field: 34, flow: 110, turn: 290, turnLen: 60, calm: 430, end: 480 });
const VFR = TLV.end + 60, VEND = VFR - 60;
const GV = { TL: TLV, w: VW, h: VH, ns: 1, step: STEP, seed: 0x34B22, cell: 40, alw: 2, plw: 2.1, fieldMin: 0.45, scrims: [[230, 500], [1420, 1240]],
  capX: VL, capY: 372, cap: 46, capTwo: true, capMax: VR - VL,
  fo: 28, foX: VL, foY: 1300, foAlign: 'left', pcX: VL, pcY: 1360, pcAlign: 'left',
  fn: 88, fnX: VL, fnY: 800, fnAlign: 'left', fnMax: VR - VL };
function hookV(v) {
  const o = 1 - E.inCubic(prog(v, TLV.field - 4, TLV.field + 8));
  if (o <= 0) return;
  vx.save(); vx.fillStyle = `rgba(${C.bgRGB},${0.6 * o})`; vx.fillRect(SAFE.x, 400, SAFE.w, 560); vx.restore();
  vHook(v, ['No one steers', 'these lines.', 'They follow', 'one function.'], 500, { size: 100, accent: C.accent, color: C.paper, weight: 900, spacing: -2, alpha: o });
}
function vDraw(v) {
  vReset();
  vx.fillStyle = C.bg; vx.fillRect(0, 0, VW, VH);
  const S = simOf('V', TLV, GV, VFR);
  scene(vx, GV, v, S);
  hookV(v);
  vReset();
  vShade(C.bgRGB, 0.86);
  vTag('FLOW FIELD', C.accent);
  if (v >= VEND) vEndCard(v - VEND, { title: 'Flow Field', line: `3D Perlin noise  ·  ${NP.toLocaleString('en-US')} particles`,
    ink: C.paper, dim: 'rgba(238,240,247,0.72)', accent: C.accent, scrim: C.bgRGB, a: 0.88 });
  vReset();
}

window.__motion = {
  title: 'Flow Field',
  description: `Generative: 3D Perlin noise read as an angle, first as a field of arrows, then followed by ${NP.toLocaleString('en-US')} particles that bunch into rivers; the angle multiplier eases from 1 to 3 and the rivers curl into eddies. ${(FRAMES * NP).toLocaleString('en-US')} particle steps, simulated once and drawn from the log.`,
  fps: FPS, width: W, height: H, frames: FRAMES,
  poster: TLL.turn + TLL.turnLen + 30,
  gifStart: Math.floor((TLL.turn - 60) / FPS),
  seek(i) { draw(Math.max(0, Math.min(FRAMES - 1, Math.floor(i)))); },
  audio: () => renderAudio(TLL, FRAMES),
  variants: {
    vertical: {
      width: VW, height: VH, frames: VFR, canvas: vcv,
      poster: TLV.turn + TLV.turnLen + 20, gifStart: Math.floor((TLV.turn - 50) / FPS),
      seek(i) { vSeek(vDraw, i, VFR); },
      audio: () => renderAudio(TLV, VFR),
    },
  },
};

/* ==========================================================================
   PLAYER — identical in every piece; keep as is.
   Autoplays and loops, starts sound on the first click, ?frame=N pauses on a
   frame, ?variant=vertical plays the vertical cut (if the piece has one).
   When the renderer sets window.__MOTION_RENDER__ it stays out of the way.
   ========================================================================== */
(function player() {
  const btn = document.getElementById('sound'), q = new URLSearchParams(location.search);
  let M = window.__motion;
  const V = !window.__MOTION_RENDER__ && M.variants && M.variants[q.get('variant')];
  if (V) {                                                // show the variant's own canvas instead
    M = Object.assign({}, M, V);
    V.canvas.style.cssText = `width:min(100vw,calc(100vh*${V.width}/${V.height}));height:auto;aspect-ratio:${V.width}/${V.height}`;
    document.querySelector('canvas').replaceWith(V.canvas);
  }
  const dur = M.frames / M.fps;
  if (window.__MOTION_RENDER__) { btn.hidden = true; M.seek(0); return; }
  if (q.has('frame')) { btn.hidden = true; M.seek(+q.get('frame') || 0); return; }
  let t0 = performance.now(), ac = null, src = null, buf = null, paused = false, pausedAt = 0;
  const clock = () => ac && src ? (ac.currentTime - t0) : (performance.now() - t0) / 1000;
  function loop() {
    if (!paused) M.seek(Math.floor(((clock() % dur) + dur) % dur * M.fps));
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  btn.addEventListener('click', async () => {
    if (src) { src.stop(); src = null; btn.textContent = 'Click for sound'; t0 = performance.now(); return; }
    btn.textContent = 'Loading sound…';
    ac = ac || new AudioContext({ sampleRate: 48000 });
    buf = buf || await M.audio();
    await ac.resume();
    src = ac.createBufferSource(); src.buffer = buf; src.loop = true; src.connect(ac.destination);
    t0 = ac.currentTime + 0.05; src.start(t0);        // picture restarts from frame 0 in sync with the sound
    btn.textContent = 'Sound on — click to mute';
  });
  addEventListener('keydown', e => {
    if (e.code !== 'Space') return;
    e.preventDefault(); paused = !paused;
    if (ac) paused ? ac.suspend() : ac.resume();
    if (!ac) { if (paused) pausedAt = performance.now(); else t0 += performance.now() - pausedAt; }
  });
})();
</script>
