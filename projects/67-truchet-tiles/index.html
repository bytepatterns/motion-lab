<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="teambytepatterns">
<meta name="description" content="Generative: 640 square tiles, each holding two quarter circles that join the midpoints of its sides, turned one of two ways; all alike they draw long open waves and no loop, every other one turned closes them into hundreds of small circles, a coin per tile makes a maze of loops and paths that never cross, and turning a single tile always joins two curves or splits one.">
<title>Truchet Tiles: Two Arcs, One Coin — motion-lab</title>
<style>
  /* Player chrome. The piece itself lives entirely in the canvas. */
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; font: 500 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; }
  canvas { display: block; width: min(100vw, calc(100vh * 16 / 9)); height: auto; aspect-ratio: 16 / 9; }
  #sound { position: fixed; left: 16px; bottom: 16px; padding: 8px 14px; border: 1px solid rgba(255,255,255,.35); border-radius: 999px;
           background: rgba(0,0,0,.55); color: #fff; font: inherit; cursor: pointer; }
  #sound[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080" aria-label="A wide grid of square tiles, each with two quarter-circle arcs; tiles spin a quarter turn in sweeping waves, turning parallel wavy lines into rows of small circles and then into a maze of winding loops in teal and open paths in blue; the longest curve lights up yellow, then single tiles turn and curves join or split"></canvas>
<button id="sound" type="button">Click for sound</button>
<script>
'use strict';
/* ==========================================================================
   PIECE — Truchet Tiles: Two Arcs, One Coin.
   Smith's version of Truchet's tile: a square with two quarter circles,
   each joining the midpoints of two neighbouring sides. Turned 90° the arcs
   move to the other two corners, so every tile has two states. Arcs of
   neighbouring tiles meet at the shared midpoints, so the whole grid is a
   set of curves: closed loops, or open paths that end on the border. They
   are found with union-find over the side midpoints (every arc joins its
   two ends); a curve is open when it reaches the border.
   Turning one tile re-pairs the four curve ends at its sides: two curves
   become one, or one becomes two.
   The coin flips come from a fixed seed; every state, its curves, and the
   single flips of the last act are computed from the tile states at the
   frame, so seek(i) is pure in i.
   ========================================================================== */
const W = 1920, H = 1080, FPS = 30;
const cv = document.getElementById('stage');
const ctx = cv.getContext('2d', { willReadFrequently: true });   // CPU raster: identical pixels on every redraw
const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
const MONO = 'ui-monospace, "Cascadia Code", Consolas, Menlo, monospace';

// ---- helpers -------------------------------------------------------------
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (f, a, b) => clamp((f - a) / (b - a));
const smooth = t => t * t * (3 - 2 * t);
const E = {
  inCubic: t => t * t * t,
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inOutCubic: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outExpo: t => t === 1 ? 1 : 1 - Math.pow(2, -10 * t),
  inExpo: t => t === 0 ? 0 : Math.pow(2, 10 * t - 10),
  inOutExpo: t => t === 0 ? 0 : t === 1 ? 1 : t < .5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2,
  outBack: t => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2),
};
/** Canvas text; `max` shrinks the size until the line fits. Returns the width drawn. */
function text(g, str, x, y, { size = 40, weight = 600, color = '#fff', alpha = 1, spacing = 0, align = 'left', fam = FONT, base = 'alphabetic', max = 0 } = {}) {
  if (alpha <= 0.002 || !str) return 0;
  g.font = `${weight} ${size}px ${fam}`; g.letterSpacing = spacing + 'px';
  if (max) { const w0 = g.measureText(str).width; if (w0 > max) { size *= max / w0; g.font = `${weight} ${size}px ${fam}`; } }
  g.textAlign = align; g.textBaseline = base;
  const a0 = g.globalAlpha; g.globalAlpha = a0 * alpha; g.fillStyle = color;
  g.fillText(str, x, y);
  const w = g.measureText(str).width;
  g.globalAlpha = a0; g.letterSpacing = '0px';
  return w;
}
const measure = (g, str, size, weight = 800, fam = FONT, spacing = 0) => { g.font = `${weight} ${size}px ${fam}`; g.letterSpacing = spacing + 'px'; const w = g.measureText(str).width; g.letterSpacing = '0px'; return w; };
const env = (f, a, b, fin = 12, fout = 10) => {
  const i = E.outCubic(prog(f, a, a + fin)), o = 1 - E.inCubic(prog(f, b - fout, b));
  return [Math.min(i, o), (1 - i) * 24 - (1 - o) * 10];
};


// ---- palette -------------------------------------------------------------
const C = {
  bg: '#0B0D14', bgRGB: '11,13,20', paper: '#F1EEE6', paperRGB: '241,238,230', dim: 'rgba(241,238,230,0.62)', faint: 'rgba(241,238,230,0.16)',
  accent: '#FFC857', accentRGB: '255,200,87', go: '#5CD6CB', goRGB: '92,214,203', no: '#FF5E6C', node: '#151A28',
  open: '#8FA8FF', openRGB: '143,168,255',
};

// ---- a grid: its midpoints, arcs, curves ------------------------------------------------------
/** Everything about a cols x rows grid that does not depend on the tile states. */
function makeGrid(cols, rows, seed) {
  const HN = (rows + 1) * cols, NP = HN + rows * (cols + 1), NT = cols * rows;
  const h = (r, c) => r * cols + c, v = (r, c) => HN + r * (cols + 1) + c;
  const ends = new Int32Array(NT * 8);                   // per tile, per state, 2 arcs x 2 ends
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const t = r * cols + c, T = h(r, c), B = h(r + 1, c), L = v(r, c), R = v(r, c + 1);
    ends.set([T, L, B, R, T, R, B, L], t * 8);           // state 0: corners TL, BR; state 1: TR, BL
  }
  const border = new Uint8Array(NP);
  for (let c = 0; c < cols; c++) { border[h(0, c)] = 1; border[h(rows, c)] = 1; }
  for (let r = 0; r < rows; r++) { border[v(r, 0)] = 1; border[v(r, cols)] = 1; }
  const G = { cols, rows, NT, NP, ends, border, par: new Int32Array(NP), arcs: new Int32Array(NP), open: new Uint8Array(NP) };
  const R = mulberry32(seed);
  G.RAND = Uint8Array.from({ length: NT }, () => R() < 0.5 ? 1 : 0);
  G.CHECK = Uint8Array.from({ length: NT }, (_, t) => (Math.floor(t / cols) + t % cols) % 2);
  G.ALL0 = new Uint8Array(NT);
  G.s0 = curves(G, G.ALL0); G.s1 = curves(G, G.CHECK); G.s2 = curves(G, G.RAND);
  G.flips = pickFlips(G, 6);
  return G;
}
/** Curves of a state: counts, and per midpoint its curve's root (in G.par after the call). */
function curves(G, st) {
  const p = G.par;
  for (let i = 0; i < G.NP; i++) p[i] = i;
  const find = x => { while (p[x] !== x) { p[x] = p[p[x]]; x = p[x]; } return x; };
  for (let t = 0; t < G.NT; t++) {
    const o = t * 8 + st[t] * 4;
    let a = find(G.ends[o]), b = find(G.ends[o + 1]); if (a !== b) p[a] = b;
    a = find(G.ends[o + 2]); b = find(G.ends[o + 3]); if (a !== b) p[a] = b;
  }
  G.arcs.fill(0); G.open.fill(0);
  for (let i = 0; i < G.NP; i++) { const r = find(i); if (G.border[i]) G.open[r] = 1; }
  for (let t = 0; t < G.NT; t++) { const o = t * 8 + st[t] * 4; G.arcs[find(G.ends[o])]++; G.arcs[find(G.ends[o + 2])]++; }
  let loops = 0, open = 0, best = 0, bestRoot = -1;
  for (let i = 0; i < G.NP; i++) if (p[i] === i && G.arcs[i] > 0) {
    if (G.open[i]) open++; else loops++;
    if (G.arcs[i] > best) { best = G.arcs[i]; bestRoot = i; }
  }
  return { loops, open, total: loops + open, best, bestOpen: bestRoot >= 0 ? G.open[bestRoot] === 1 : false, bestRoot };
}
/** Six single turns on the coin-flip state, near the middle: join the two biggest, then split the biggest, in turn. */
function pickFlips(G, n) {
  const st = G.RAND.slice(), out = [];
  const cands = [];
  for (let r = 2; r < G.rows - 2; r++) for (let c = 2; c < G.cols - 2; c++) cands.push(r * G.cols + c);
  let cur = curves(G, st);
  for (let k = 0; k < n; k++) {
    const want = k % 2 === 0 ? -1 : 1;
    let pick = -1, score = -1, res = null;
    for (const t of cands) {
      if (out.some(x => x.t === t)) continue;
      st[t] ^= 1; const s = curves(G, st); st[t] ^= 1;
      if (s.total - cur.total !== want) continue;
      const sc = want < 0 ? s.best : cur.best - s.best;      // join: the longest gets as long as it can; split: cut the longest most
      if (sc > score) { score = sc; pick = t; res = s; }
    }
    if (pick < 0) break;
    st[pick] ^= 1; out.push({ t: pick, d: res.total - cur.total, before: cur, after: res }); cur = res;
  }
  G.FINAL = st; G.s3 = cur;
  return out;
}
const GRID_L = makeGrid(40, 16, 0x67A1), GRID_V = makeGrid(19, 18, 0x67A1);
const EXACT = g => g.flips.every(x => Math.abs(x.d) === 1);

// ---- timeline -------------------------------------------------------------------------------
function buildTL(o, g) {
  const T = Object.assign({}, o);
  T.ck1 = T.ck0 + T.ckW + T.fl; T.rd0 = T.ck1 + T.holdA; T.rd1 = T.rd0 + T.rdW + T.fl;
  T.hl0 = T.rd1 + 10; T.f0 = T.hl0 + T.hlT; T.f1 = T.f0 + g.flips.length * T.it;
  T.calm = T.f1 + T.hold; T.end = Math.round(T.calm + T.calmT);
  const s0 = g.s0, s1 = g.s1, s2 = g.s2;
  T.caps = [
    [T.g0, T.ck0 - 2, `${fmt(g.NT)} tiles, two quarter circles each, all turned|the same way: ${s0.open} open waves, ${s0.loops ? s0.loops + ' loops' : 'no loop'}.`],
    [T.ck0, T.rd0 - 2, `Turn every other tile by 90°: ${fmt(s1.loops)} closed|circles, and ${s1.open} short paths along the edge.`],
    [T.rd0, T.hl0 - 2, `Now flip a coin for every tile:|${s2.loops} loops and ${s2.open} open paths, none crossing.`],
    [T.hl0, T.f0 - 2, `The longest is ${s2.bestOpen ? 'a path' : 'a loop'} of ${s2.best} arcs,|winding through ${Math.round(s2.best / (2 * g.NT) * 100)}% of all arcs.`],
    [T.f0, T.calm - 2, `Turn one tile: two curves join, or one splits;|the count moves by ${EXACT(g) ? 'exactly' : 'at most'} one.`],
  ];
  return T;
}
function fmt(n) { return Math.round(n).toLocaleString('en-US'); }
/** Per tile: the times it starts a quarter turn (sorted). */
function flipTimes(T, g) {
  const out = Array.from({ length: g.NT }, () => []);
  const cx = (g.cols - 1) / 2, cy = (g.rows - 1) / 2, dmax = Math.hypot(cx, cy);
  for (let t = 0; t < g.NT; t++) {
    const r = Math.floor(t / g.cols), c = t % g.cols;
    if (g.CHECK[t] !== g.ALL0[t]) out[t].push(T.ck0 + (r + c) / (g.rows + g.cols - 2) * T.ckW);
    if (g.RAND[t] !== g.CHECK[t]) out[t].push(T.rd0 + Math.hypot(r - cy, c - cx) / dmax * T.rdW);
  }
  g.flips.forEach((x, k) => out[x.t].push(T.f0 + k * T.it + 4));
  return out;
}
/** Tile states at frame f: settled state (as counted) and turn progress (as drawn). */
function tilesAt(T, g, FT, f, st, rot) {
  for (let t = 0; t < g.NT; t++) {
    let s = 0, m = 0;
    for (const t0 of FT[t]) { if (f >= t0 + T.fl) s ^= 1; else if (f >= t0) { m = E.inOutCubic((f - t0) / T.fl); if (m >= 0.5) s ^= 1; } }
    st[t] = s; rot[t] = m;
  }
}

// ---- drawing ------------------------------------------------------------------------------
function arcsOf(g, t, s) { return s ? [[1, 0, Math.PI / 2, Math.PI], [0, 1, Math.PI * 1.5, Math.PI * 2]] : [[0, 0, 0, Math.PI / 2], [1, 1, Math.PI, Math.PI * 1.5]]; }
function grid(g, G, f) {
  const T = G.TL, gd = G.g, S = G.S, [a] = env(f, -30, T.end + 14, 1, 20);
  if (a <= 0) return null;
  const st = G.st, rot = G.rot;
  tilesAt(T, gd, G.FT, f, st, rot);
  const cs = curves(gd, st);
  // the base state of a turning tile is the one before its turn: count what is shown
  const hl = f >= T.hl0 ? E.outCubic(prog(f, T.hl0, T.hl0 + 16)) * (1 - E.inCubic(prog(f, T.f0 + 6, T.f0 + 20))) : 0;
  const fin = f >= T.f0 ? 1 - E.inCubic(prog(f, T.end - 6, T.end + 12)) : 0;
  const paths = { loop: new Path2D(), open: new Path2D(), best: new Path2D() };
  const p = gd.par, find = x => { while (p[x] !== x) x = p[x]; return x; };
  const r2 = S / 2;
  for (let t = 0; t < gd.NT; t++) {
    const r = Math.floor(t / gd.cols), c = t % gd.cols, x = G.x0 + c * S, y = G.y0 + r * S;
    // intro: tiles come in along a diagonal
    const ia = E.outCubic(prog(f, T.g0 + (r + c) * 0.9, T.g0 + 14 + (r + c) * 0.9));
    if (ia <= 0) continue;
    const s = st[t], m = rot[t];
    const base = m > 0 ? (m >= 0.5 ? s ^ 1 : s) : s;    // orientation before the turn
    const ang = m > 0 ? m * Math.PI / 2 : 0;
    arcsOf(gd, t, base).forEach(([cx, cy, a0, a1], j) => {
      const jj = m >= 0.5 && base === 1 ? 1 - j : j, o = t * 8 + s * 4 + jj * 2, root = find(gd.ends[o]);   // the turned arc j lies where arc jj of the new state is
      const key = hl + fin > 0 && root === cs.bestRoot ? 'best' : gd.open[root] ? 'open' : 'loop';
      const P = paths[key];
      if (ang === 0 && ia >= 1) { const ex = x + cx * S, ey = y + cy * S; P.moveTo(ex + r2 * Math.cos(a0), ey + r2 * Math.sin(a0)); P.arc(ex, ey, r2, a0, a1); }
      else {
        // a turning tile: rotate its arcs about the tile centre
        const k = ia < 1 ? ia : 1, co = Math.cos(ang), si = Math.sin(ang), mx = x + r2, my = y + r2;
        const ex0 = (cx - 0.5) * S * k, ey0 = (cy - 0.5) * S * k, ex = mx + ex0 * co - ey0 * si, ey = my + ex0 * si + ey0 * co;
        P.moveTo(ex + r2 * k * Math.cos(a0 + ang), ey + r2 * k * Math.sin(a0 + ang)); P.arc(ex, ey, r2 * k, a0 + ang, a1 + ang);
      }
    });
  }
  g.save(); g.globalAlpha = a; g.lineCap = 'round';
  const dimOthers = 1 - 0.55 * Math.max(hl, 0);
  g.lineWidth = G.lw; g.strokeStyle = `rgba(${C.openRGB},${0.8 * dimOthers})`; g.stroke(paths.open);
  g.strokeStyle = `rgba(${C.goRGB},${0.9 * dimOthers})`; g.stroke(paths.loop);
  if (hl + fin > 0) {
    g.strokeStyle = `rgba(${C.accentRGB},0.25)`; g.lineWidth = G.lw * 3; g.stroke(paths.best);
    g.strokeStyle = C.accent; g.lineWidth = G.lw * 1.2; g.stroke(paths.best);
  }
  g.restore();
  return cs;
}
/** The single turns of the last act: a ring on the tile and the change in the count. */
function flipMarks(g, G, f) {
  const T = G.TL, gd = G.g, S = G.S;
  gd.flips.forEach((x, k) => {
    const t0 = T.f0 + k * T.it + 4, [a] = env(f, t0 - 4, t0 + T.it + 6, 6, 8); if (a <= 0) return;
    const r = Math.floor(x.t / gd.cols), c = x.t % gd.cols, px = G.x0 + c * S, py = G.y0 + r * S;
    g.save(); g.globalAlpha = a; g.strokeStyle = C.paper; g.lineWidth = 3; g.strokeRect(px - 3, py - 3, S + 6, S + 6); g.restore();
    const la = E.outBack(prog(f, t0 + T.fl * 0.5, t0 + T.fl * 0.5 + 8));
    const lab = `${x.d > 0 ? '+1 curve' : '−1 curve'}`;
    g.save(); g.globalAlpha = a * clamp(la); g.fillStyle = `rgba(${C.bgRGB},0.85)`;
    const w = measure(g, lab, 30, 850, MONO) + 20, lx = clamp(px + S / 2 - w / 2, G.x0, G.x0 + gd.cols * S - w), ly = py - 58;
    g.beginPath(); g.roundRect(lx, ly, w, 44, 10); g.fill(); g.restore();
    text(g, lab, lx + w / 2, ly + 23, { size: 30, weight: 850, color: x.d > 0 ? C.go : C.accent, align: 'center', base: 'middle', fam: MONO, alpha: a * clamp(la) });
  });
}
function caption(g, G, f) {
  for (const [t0, t1, str] of G.TL.caps) {
    const [a, dy] = env(f, t0, t1, 10, 8); if (a <= 0) continue;
    const [p1, p2] = str.split('|');
    if (G.capTwo) {
      text(g, p1, G.capX, G.capY + dy, { size: G.cap, weight: 850, color: C.paper, spacing: -1, alpha: a, max: G.capMax });
      text(g, p2, G.capX, G.capY + G.cap * 1.14 + dy, { size: G.cap, weight: 850, color: C.accent, spacing: -1, alpha: a, max: G.capMax });
    } else {
      const w1 = measure(g, p1 + ' ', G.cap, 850, FONT, -1), w2 = measure(g, p2, G.cap, 850, FONT, -1), sc = Math.min(1, G.capMax / (w1 + w2));
      const w = text(g, p1 + ' ', G.capX, G.capY + dy, { size: G.cap * sc, weight: 850, color: C.paper, spacing: -1, alpha: a });
      text(g, p2, G.capX + w, G.capY + dy, { size: G.cap * sc, weight: 850, color: C.accent, spacing: -1, alpha: a });
    }
  }
}
function readout(g, G, f, cs) {
  const T = G.TL, [a] = env(f, T.g0 + 20, T.calm, 12, 10);
  if (a <= 0 || !cs) return;
  const x0 = G.foX;
  let x = x0;
  const seg = (s, col) => { x += text(g, s, x, G.foY, { size: G.fo, weight: 800, color: col, fam: MONO, alpha: a }); };
  seg(`loops ${cs.loops}`, C.go); seg('  ·  ', C.dim); seg(`open ${cs.open}`, C.open); seg('  ·  ', C.dim); seg(`longest ${cs.best} arcs`, C.accent);
  if (G.foY2) text(g, `${fmt(G.g.NT)} tiles  ·  ${fmt(2 * G.g.NT)} arcs`, G.foX2, G.foY2, { size: G.fo, weight: 700, color: C.dim, fam: MONO, alpha: a, align: G.foAlign2 });
}
function finale(g, G, f) {
  const T = G.TL, gd = G.g, k1 = E.outCubic(prog(f, T.calm, T.calm + 18)), k2 = E.outCubic(prog(f, T.calm + 10, T.calm + 28));
  if (k1 <= 0) return;

  g.save(); g.fillStyle = `rgba(${C.bgRGB},${0.86 * k1 * out})`; g.fillRect(0, G.fnY - G.fn * 1.2, G.w, G.fn * (G.fnTwo ? 3.9 : 2.9)); g.restore();
  text(g, 'Two arcs. One coin.', G.fnX, G.fnY, { size: G.fn, weight: 900, color: C.paper, spacing: -2, align: G.fnAlign, alpha: k1 * out, max: G.fnMax });
  const s = gd.s2;
  if (G.fnTwo) {
    text(g, `${s.loops} loops, ${s.open} paths;`, G.fnX, G.fnY + G.fn * 1.05, { size: G.fn * 0.55, weight: 850, color: C.accent, spacing: -1, align: G.fnAlign, alpha: k2 * out, max: G.fnMax });
    text(g, `the longest ${s.best} arcs.`, G.fnX, G.fnY + G.fn * 1.75, { size: G.fn * 0.55, weight: 850, color: C.accent, spacing: -1, align: G.fnAlign, alpha: k2 * out, max: G.fnMax });
  } else text(g, `${fmt(gd.NT)} tiles  ·  ${s.loops} loops, ${s.open} paths  ·  the longest ${s.best} arcs`, G.fnX, G.fnY + G.fn * 1.05, { size: G.fn * 0.5, weight: 850, color: C.accent, spacing: -1, align: G.fnAlign, alpha: k2 * out, max: G.fnMax });
}
function scene(g, G, f) {
  const cs = grid(g, G, f);
  flipMarks(g, G, f);
  caption(g, G, f); readout(g, G, f, cs); finale(g, G, f);
}
function stage(G) { G.S = G.S; G.st = new Uint8Array(G.g.NT); G.rot = new Float32Array(G.g.NT); G.FT = flipTimes(G.TL, G.g); return G; }

// ---- landscape picture ------------------------------------------------------------------
const TLL = buildTL({ g0: 20, ck0: 150, ckW: 80, fl: 14, holdA: 56, rdW: 110, hlT: 110, it: 22, hold: 12, calmT: 34 }, GRID_L);
const FRAMES = TLL.end + 72;
const GL = stage({ TL: TLL, g: GRID_L, w: W, h: H, S: 42, x0: 120, y0: 272, lw: 5.5,
  capX: 120, capY: 216, cap: 50, capTwo: false, capMax: 1680,
  fo: 30, foX: 120, foY: 1012, foAlign: 'left', foX2: 1800, foY2: 1012, foAlign2: 'right',
  fn: 100, fnX: W / 2, fnY: 600, fnAlign: 'center', fnMax: 1680 });
function hookL(f) {
  const o = 1 - E.inCubic(prog(f, TLL.g0 + 6, TLL.g0 + 24));
  if (o <= 0) return;

// ---- sound: a soft click per quarter turn, thinned to a patter in the waves; a chord per act; a bell per single turn ----
async function renderAudio(G = GL, frames = FRAMES) {

    const o = ac.createOscillator(), g = ac.createGain(), p = ac.createStereoPanner(); o.type = type; o.frequency.value = hz(m);

    p.pan.value = pan; o.connect(g).connect(p); p.connect(master); p.connect(verb); o.start(t0); o.stop(t0 + dec + 0.05);

    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = cutoff; lp.Q.value = 1; lp.connect(master); lp.connect(verb);

  pad(at(TL.ck0), at(TL.rd0 + 4), [43, 50, 55, 59, 62], 0.011, 1000);
  pad(at(TL.rd0), at(TL.f0 + 4), [41, 48, 53, 57, 60], 0.011, 1100);
  pad(at(TL.f0), at(TL.end + 50), [48, 55, 60, 64, 67], 0.012, 1300);

  const byFrame = new Map();

  }
  gd.flips.forEach((x, k) => {
    const t0 = TL.f0 + k * TL.it + 4;
    pluck(at(t0), 67, 0.04, 0, 0.3);
    (x.d > 0 ? [0, 7, 12] : [12, 7, 0]).forEach((m, i) => pluck(at(t0 + TL.fl * 0.5) + i * 0.05, 72 + m, 0.035, 0.2, 0.7, 'sine'));
  });
  [55, 62, 67].forEach((m, i) => pluck(at(TL.hl0) + i * 0.06, m + 12, 0.04, -0.2 + i * 0.2, 1.4, 'sine'));
  [60, 64, 67, 72].forEach((m, i) => pluck(at(TL.calm) + i * 0.09, m, 0.05, -0.3 + i * 0.2, 1.6, 'sine'));

  for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let k = 0; k < d.length; k++) d[k] *= norm; }

}

/* ==========================================================================

    buf = buf || await M.audio();
    await ac.resume();
    src = ac.createBufferSource(); src.buffer = buf; src.loop = true; src.connect(ac.destination);
    t0 = ac.currentTime + 0.05; src.start(t0);        // picture restarts from frame 0 in sync with the sound
    btn.textContent = 'Sound on — click to mute';
  });
  addEventListener('keydown', e => {
    if (e.code !== 'Space') return;
    e.preventDefault(); paused = !paused;
    if (ac) paused ? ac.suspend() : ac.resume();
    if (!ac) { if (paused) pausedAt = performance.now(); else t0 += performance.now() - pausedAt; }
  });
})();
</script>
