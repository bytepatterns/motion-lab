<title>Heap: Sift Up, Sift Down — motion-lab</title>
<style>
  /* Player chrome. The piece itself lives entirely in the canvas. */

  body { display: grid; place-items: center; font: 500 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; }

<body>
<canvas id="stage" width="1920" height="1080" aria-label="Fifteen numbers pushed one by one into a min-heap drawn as a binary tree above its array; each new number sifts up past larger parents, then the smallest is popped three times and the last number sifts down"></canvas>
<button id="sound" type="button">Click for sound</button>
<script>
'use strict';
/* ==========================================================================
   PIECE — Heap: Sift Up, Sift Down.
   A min-heap: a binary tree where every parent is smaller than (or equal
   to) its children, stored in a plain array: the children of slot i are
   2i + 1 and 2i + 2, its parent is (i - 1) / 2 rounded down.
   PUSH: the new number goes into the first free slot, then SIFTS UP: while
   its parent is larger, the two swap.
   POP: the root is the smallest number; it leaves, the last number takes
   its place, then SIFTS DOWN: while a child is smaller, it swaps with the
   smaller child.
   A real heap runs ONCE at load on fifteen seeded numbers (fifteen pushes,
   then three pops) and logs every step with the array before and after it.
   The tree, the array row, the counters and the sound all read that log;

// ---- helpers -------------------------------------------------------------

const C = {

      if (l < h.length && h[l] < h[m]) m = l;

    [F.cmpUpU - 2, s0 + 2, 'Parent bigger?|Swap. Sift up.'],
    [s0 - 2, TL.pushEnd + 10, 'Every parent|smaller than its children.'],
    [TL.pushEnd + 6, F.moveD + 2, 'Pop takes the root:|the smallest.'],
    [F.moveD - 2, F.cmpDownD + 4, 'The last one|jumps to the top.'],
    [F.cmpDownD, TL.steps.filter(s => s.q === 1)[0].t + 2, 'Swap with the smaller child|until it fits.'],
    [TL.steps.filter(s => s.q === 1)[0].t - 2, TL.fin + 2, 'Pop again.|Always the smallest.'],

// ---- state at a frame --------------------------------------------------------------------

  out.gain.setValueAtTime(1, 0); out.gain.setValueAtTime(1, dur - fadeOut); out.gain.linearRampToValueAtTime(0, dur - 0.01);
  segs.forEach((s, k) => {
    const at = s.at / FPS, off = s.src / FPS, d = s.len / FPS;
    const pre = k === 0 ? 0 : Math.min(xf, off), post = k === segs.length - 1 ? 0 : xf;
    const b = ac.createBufferSource(), g = ac.createGain(); b.buffer = src;
    g.gain.setValueAtTime(pre ? 0 : 1, at - pre);
    if (pre) g.gain.linearRampToValueAtTime(1, at + pre);
    if (post) { g.gain.setValueAtTime(1, at + d - post); g.gain.linearRampToValueAtTime(0, at + d + post); }
    b.connect(g).connect(out); b.start(at - pre, off - pre, d + pre + post);
  });
  if (extra) extra(ac, out);
  const buf = await ac.startRendering();
  let peak = 0; for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) peak = Math.max(peak, Math.abs(d[i])); }
  if (peak > 0.9) for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] *= 0.9 / peak; }
  return buf;
}
/** A soft three-partial bell, for the closing card. */
function vChime(ac, dest, at, freq, vol = 0.08) {
  for (const [mul, v, dec] of [[1, 1, 1.8], [2.01, 0.35, 0.8], [3.02, 0.12, 0.4]]) {
    const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.value = freq * mul;
    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol * v, at + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, at + dec);
    o.connect(g).connect(dest); o.start(at); o.stop(at + dec + 0.05);
  }
}

/* VERTICAL CUT — this piece */
// The same heap on a phone: a narrower tree, the array row under it with
// smaller cells, the two queues above the tree, the caption on two lines on
// top and the counter at the foot. It runs its own, faster clock; the
// soundtrack is rendered from that clock, so every tick lands on its swap.
const TLV = buildTL({ start: 40, slowN: 2, slow: 1.4, push: 6, cmp: 3, stop: 3, swap: 6, pop: 10, move: 9, pause: 14, popGap: 3, hold: 44 });
const VFR = TLV.end + 60, VEND = VFR - 60;
const GV = { TL: TLV, cx: 480, tw: 780, rowY: [650, 772, 894, 1016], nr: 34, lw: 2, ring: 5, num: 30, smallR: 0.78,
  incX: 124, incY: 540, incP: 62, incN: 3, outX: 864 - 4 * 62, outY: 540, outP: 62, outDir: 1, outLabX: 890, outAlign: 'right', lab: 28,
  ay: 1142, ap: 55, cs: 50, cnum: 28, idx: 28, arcH: 44,
  capX: VL, capY: 392, cap: 46, capTwo: true, capMax: VR - VL,
  phX: VR, phY: 1392 - 70, ph: 28, phAlign: 'right', phMax: 380,
  cnX: VL, cnY: 1332, cn: 76, cnL: 32, exX: VR, exY: 1260, ex: 44, exAlign: 'right' };
function hookV(v) {
  const o = 1 - E.inCubic(prog(v, TLV.o.start - 16, TLV.o.start - 2));
  if (o <= 0) return;
  vHook(v, ['The smallest', 'is always', 'on top.'], 440, { size: 104, accent: C.gold, color: C.paper, weight: 900, spacing: -2, alpha: o });
}
function vDraw(v) {
  vReset();
  backdrop(vx, VW, VH, GV);
  scene(vx, GV, v);
  hookV(v);
  vReset();
  vShade(C.bgRGB, 0.84);
  vTag('BINARY HEAP', C.gold);
  if (v >= VEND) vEndCard(v - VEND, { title: 'Binary Heap', line: `${N} pushes  ·  ${POPS} pops  ·  ${SWAPS_UP + SWAPS_DOWN} swaps`,
    ink: C.paper, dim: 'rgba(238,242,236,0.72)', accent: C.gold, scrim: C.bgRGB, a: 0.9 });
  vReset();
}

window.__motion = {
  title: 'Heap: Sift Up, Sift Down',
  description: `A real min-heap drawn as a tree over the array it lives in: ${N} pushes sift up with ${SWAPS_UP} swaps (one climbs ${MAXCLIMB} levels to the root), then ${POPS} pops sift down with ${SWAPS_DOWN} more and come out in order, ${POPPED.join(', ')}; one tick per swap.`,
  fps: FPS, width: W, height: H, frames: FRAMES,
  poster: TLL.steps.find(s => s.q === 1 && s.k === 'swap').t + 5,
  gifStart: Math.floor(TLL.steps.find(s => s.ins === 7).t / FPS),
  seek(i) { draw(Math.max(0, Math.min(FRAMES - 1, Math.floor(i)))); },
  audio: () => renderAudio(TLL, FRAMES),
  variants: {
    vertical: {
      width: VW, height: VH, frames: VFR, canvas: vcv,
      poster: TLV.steps.find(s => s.q === 0 && s.k === 'swap').t + 3, gifStart: Math.floor(TLV.steps.find(s => s.ins === 8).t / FPS),
      seek(i) { vSeek(vDraw, i, VFR); },
      audio: () => renderAudio(TLV, VFR),
    },
  },
};

/* ==========================================================================
   PLAYER — identical in every piece; keep as is.
   Autoplays and loops, starts sound on the first click, ?frame=N pauses on a
   frame, ?variant=vertical plays the vertical cut (if the piece has one).
   When the renderer sets window.__MOTION_RENDER__ it stays out of the way.
   ========================================================================== */
(function player() {
  const btn = document.getElementById('sound'), q = new URLSearchParams(location.search);
  let M = window.__motion;
  const V = !window.__MOTION_RENDER__ && M.variants && M.variants[q.get('variant')];
  if (V) {                                                // show the variant's own canvas instead
    M = Object.assign({}, M, V);
    V.canvas.style.cssText = `width:min(100vw,calc(100vh*${V.width}/${V.height}));height:auto;aspect-ratio:${V.width}/${V.height}`;
    document.querySelector('canvas').replaceWith(V.canvas);
  }
  const dur = M.frames / M.fps;
  if (window.__MOTION_RENDER__) { btn.hidden = true; M.seek(0); return; }
  if (q.has('frame')) { btn.hidden = true; M.seek(+q.get('frame') || 0); return; }
  let t0 = performance.now(), ac = null, src = null, buf = null, paused = false, pausedAt = 0;
  const clock = () => ac && src ? (ac.currentTime - t0) : (performance.now() - t0) / 1000;
  function loop() {
    if (!paused) M.seek(Math.floor(((clock() % dur) + dur) % dur * M.fps));
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  btn.addEventListener('click', async () => {
    if (src) { src.stop(); src = null; btn.textContent = 'Click for sound'; t0 = performance.now(); return; }
    btn.textContent = 'Loading sound…';
    ac = ac || new AudioContext({ sampleRate: 48000 });
    buf = buf || await M.audio();
    await ac.resume();
    src = ac.createBufferSource(); src.buffer = buf; src.loop = true; src.connect(ac.destination);
    t0 = ac.currentTime + 0.05; src.start(t0);        // picture restarts from frame 0 in sync with the sound
    btn.textContent = 'Sound on — click to mute';
  });
  addEventListener('keydown', e => {
    if (e.code !== 'Space') return;
    e.preventDefault(); paused = !paused;
    if (ac) paused ? ac.suspend() : ac.resume();
    if (!ac) { if (paused) pausedAt = performance.now(); else t0 += performance.now() - pausedAt; }
  });
})();
</script>
