<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="description" content="A real merge sort of sixteen numbers drawn as its recursion tree: the row halves down to single tiles, then merges back up level by level, one tick per comparison.">
<title>Merge Sort, Drawn as a Tree — motion-lab</title>
<style>
  /* Player chrome. The piece itself lives entirely in the canvas. */
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; font: 500 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; }
  canvas { display: block; width: min(100vw, calc(100vh * 16 / 9)); height: auto; aspect-ratio: 16 / 9; }
  #sound { position: fixed; left: 16px; bottom: 16px; padding: 8px 14px; border: 1px solid rgba(255,255,255,.35); border-radius: 999px;
           background: rgba(0,0,0,.55); color: #fff; font: inherit; cursor: pointer; }
  #sound[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080" aria-label="Sixteen numbered tiles split in half level by level into a tree of single tiles, then merge back up into one sorted row, every comparison highlighted"></canvas>
<button id="sound" type="button">Click for sound</button>
<script>
'use strict';
/* ==========================================================================
   PIECE — Merge Sort, Drawn as a Tree.
   Sixteen numbered tiles in one row. DIVIDE: the row halves, and halves
   again, dropping one level each time, until sixteen single tiles sit on
   level 4 — the recursion tree, with thin lines from parent to child.
   CONQUER: the merges run bottom-up, level by level; in each one the two
   front tiles are compared (one tick), and the smaller rises into the
   merged row above.
   A real top-down merge sort runs ONCE at load and logs its events
   (split, compare, take, merge). The picture and the beat read that log;
   only the order in which the independent merges of one level are shown
   is level by level instead of depth first (the merges are the same).
   Motion trails are drawn by re-evaluating tile positions a few
   sub-frames earlier.
   ========================================================================== */
const W = 1920, H = 1080, FPS = 30;
const cv = document.getElementById('stage');
const ctx = cv.getContext('2d', { willReadFrequently: true });   // CPU raster: identical pixels on every redraw
const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
const MONO = 'ui-monospace, "Cascadia Code", Consolas, Menlo, monospace';

// ---- helpers -------------------------------------------------------------
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (f, a, b) => clamp((f - a) / (b - a));
const smooth = t => t * t * (3 - 2 * t);
const E = {
  inCubic: t => t * t * t,
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inOutCubic: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outExpo: t => t === 1 ? 1 : 1 - Math.pow(2, -10 * t),
  inExpo: t => t === 0 ? 0 : Math.pow(2, 10 * t - 10),
  inOutExpo: t => t === 0 ? 0 : t === 1 ? 1 : t < .5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2,

/** Canvas text; `max` shrinks the size until the line fits. Returns the width drawn. */
function text(g, str, x, y, { size = 40, weight = 600, color = '#fff', alpha = 1, spacing = 0, align = 'left', fam = FONT, base = 'alphabetic', max = 0 } = {}) {

  if (max) { const w0 = g.measureText(str).width; if (w0 > max) { size *= max / w0; g.font = `${weight} ${size}px ${fam}`; } }

const measure = (g, str, size, weight = 800, fam = FONT, spacing = 0) => { g.font = `${weight} ${size}px ${fam}`; g.letterSpacing = spacing + 'px'; const w = g.measureText(str).width; g.letterSpacing = '0px'; return w; };

  const i = E.outCubic(prog(f, a, a + fin)), o = 1 - E.inCubic(prog(f, b - fout, b));

// ---- palette -------------------------------------------------------------
const C = {
  bg: '#0B1017', bgRGB: '11,16,23', paper: '#EDF1F6', dim: 'rgba(237,241,246,0.62)', faint: 'rgba(237,241,246,0.16)',
  tile: '#172131', edge: 'rgba(237,241,246,0.42)',
  cool: '#6FA8FF', warm: '#FFB15E',
};

// ---- the model: a real merge sort, run once at load, logged ------------------------------
const N = 16, DEPTH = 4, BEAT = 18;                          // 16 tiles, 4 levels below the top; 18 frames = 100 BPM
const VALUES = (() => {                                      // 16 distinct values 1..99, seeded
  const r = mulberry32(0x26F00D), seen = new Set(), out = [];
  while (out.length < N) { const v = 1 + Math.floor(r() * 99); if (!seen.has(v)) { seen.add(v); out.push(v); } }

const LOG = [];
const SORTED = VALUES.slice();
(function msort(a, lo, hi, depth) {

  const out = []; let i = lo, j = mid;
  while (i < mid && j < hi) {

const SPLITS = LOG.filter(e => e.type === 'split');
const MERGES = (() => {                                      // the log grouped per merge: takes, each with the compare that decided it
  const map = new Map(), out = [];
  for (const e of LOG) {
    if (e.type === 'split') continue;
    const key = e.depth + ':' + e.lo;
    let m = map.get(key);
    if (!m) { m = { depth: e.depth, lo: e.lo, hi: e.hi, steps: [], pending: null }; map.set(key, m); out.push(m); }
    if (e.type === 'compare') m.pending = e;

})();
const TOTAL = LOG.filter(e => e.type === 'compare').length;
const NLOGN = N * Math.log2(N);                              // 64
const RANK = new Map(SORTED.map((v, r) => [v, r]));
/** The level at which the boundary before slot b first opens (1 = the first halving). */
const SPLIT_LV = b => b % 8 === 0 ? 1 : b % 4 === 0 ? 2 : b % 2 === 0 ? 3 : 4;

// ---- timeline (frames), built from the log; the vertical cut builds its own, faster --------
function buildTL(o) {

    levelStart: [], levelDone: [], caps: [] };
  VALUES.forEach(v => { TL.moves[v] = []; });
  let lastSplit = o.div;
  for (let d = 0; d < DEPTH; d++) {                          // DIVIDE, level by level
    SPLITS.filter(e => e.depth === d).sort((a, b) => a.lo - b.lo).forEach((e, gi) => {
      const t = o.div + d * o.divStep + gi * o.divStag[d];
      TL.splits.push({ t, depth: d, lo: e.lo, hi: e.hi }); TL.splitT[d + ':' + e.lo] = t; lastSplit = Math.max(lastSplit, t);
      for (let s = e.lo; s < e.hi; s++) TL.moves[VALUES[s]].push({ t, d: o.divMove, L: d + 1, s, kind: 'd' });
    });
  }

    const dt = o.dts[DEPTH - 1 - d], md = clamp(dt * 1.7, 8, 15), delay = Math.min(dt * 0.45, 5), restStep = Math.min(dt * 0.5, 3);
    TL.levelStart[d] = t; let end = t;
    for (const m of MERGES.filter(q => q.depth === d).sort((a, b) => a.lo - b.lo)) {
      let tc = t, last = t, rest = 0, mEnd = t;
      for (const st of m.steps) {
        let tm;
        if (st.cmp) { TL.compares.push({ t: tc, a: st.cmp.a, b: st.cmp.b, win: st.v, depth: d, lo: m.lo, hi: m.hi, dt }); tm = tc + delay; last = tc; tc += dt; }
        else tm = last + delay + (++rest) * restStep;        // the leftovers follow without a comparison

    [o.div - 6, TL.divEnd + 8, 'Halve every list,|until each holds one.'],
    [TL.divEnd + 2, ls[3] + 4, 'Sixteen lists of one:|each is already sorted.'],
    [ls[3] - 2, ls[2] + 4, 'Merge them in pairs:|1 + 1.'],
    [ls[2] - 2, ls[1] + 4, 'Merge 2 + 2:|the smaller front goes up.'],
    [ls[1] - 2, ls[0] + 4, 'Merge 4 + 4:|same rule.'],
    [ls[0] - 2, TL.fin + 4, 'Last merge:|8 + 8.'],

const TLL = buildTL({ land: 20, landStag: 1.5, div: 72, divStep: 18, divStag: [0, 5, 3, 2], divMove: 15, single: 22,
  dts: [4.5, 4.5, 6, 10], lvlGap: 12, arp: 3, hold: 46 });
const FRAMES = TLL.end + 72;

// ---- layout ------------------------------------------------------------------------------
/** Pre-computes the x of every slot on every level: gaps open where the row has been halved. */
function layout(G) {
  G.xs = [];

    const xs = []; let x = 0;
    for (let s = 0; s < N; s++) { if (s > 0) { x += G.pitch; const lv = SPLIT_LV(s); if (lv <= L) x += G.gap[lv]; } xs.push(x); }
    const off = G.cx - x / 2; G.xs.push(xs.map(q => q + off));

}
function rrect(g, x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
/** Where tile v is at frame f, with how fast it is moving (0..1). */
function tileAt(G, TL, v, f) {
  const k = VALUES.indexOf(v);
  let x = G.xs[0][k], y = G.rowY[0], moving = 0, conq = false, div = false;
  for (const m of TL.moves[v]) {

      else { x = lerp(x, tx, E.inOutCubic(u)); y = lerp(y, ty, E.inOutCubic(u)); }

/** A numbered tile centred at (x, y); a strip along its foot shows the value's size. */

}
/** The box around one list of the tree (level L, slots lo..hi-1). */
const boxOf = (G, L, lo, hi) => { const x0 = G.xs[L][lo] - G.tw / 2 - G.pad, x1 = G.xs[L][hi - 1] + G.tw / 2 + G.pad;
  return { x0, x1, cx: (x0 + x1) / 2, y0: G.rowY[L] - G.tw / 2 - G.pad, y1: G.rowY[L] + G.tw / 2 + G.pad }; };

// ---- sound: a 100 BPM beat; splits pluck downwards, every comparison is a marimba tick ------------
const PENTA = [0, 2, 4, 7, 9];

  dts: [3, 3, 4.5, 6], lvlGap: 8, arp: 2, hold: 48 });
const VFR = TLV.end + 60, VEND = VFR - 60;
const GV = layout({ TL: TLV, cx: 480, pitch: 47, tw: 44, r: 8, lw: 2, ring: 4, num: 28, strip: 3, pad: 5, gap: [0, 8, 6, 3, 2],
  rowY: [694, 812, 930, 1048, 1166], dropH: 90,
  capX: VL, capY: 430, cap: 46, capTwo: true, capMax: VR - VL,
  phX: VL, phY: 566, ph: 28, phAlign: 'left', phMax: VR - VL,
  cnX: VL, cnY: 1316, cn: 80, cnL: 34, exX: VR, exY: 1312, ex: 52, exAlign: 'right',
  lnX: VL, lnY: 1296, ln: 44, lineTwo: true, lnMax: VR - VL });
function hookV(v) {
  const o = 1 - E.inCubic(prog(v, TLV.o.div - 18, TLV.o.div - 4));
  if (o <= 0) return;
  vHook(v, ['Split it until', 'it\u2019s trivial.', 'Then merge.'], 396, { size: 92, accent: C.warm, color: C.paper, weight: 900, spacing: -2, alpha: o });
}
function vDraw(v) {
  vReset();
  backdrop(vx, VW, VH, GV);
  scene(vx, GV, v);
  hookV(v);
  vReset();
  vShade(C.bgRGB, 0.84);
  vTag('MERGE SORT', C.warm);
  if (v >= VEND) vEndCard(v - VEND, { title: 'Merge Sort', line: `${N} numbers  ·  ${TOTAL} comparisons  ·  n log\u2082 n = ${NLOGN}`,
    ink: C.paper, dim: 'rgba(237,241,246,0.72)', accent: C.warm, scrim: C.bgRGB, a: 0.9 });
  vReset();
}

window.__motion = {
  title: 'Merge Sort, Drawn as a Tree',
  description: `A real merge sort of ${N} numbers drawn as its recursion tree: the row halves ${DEPTH} times down to single tiles, then merges back up level by level in ${TOTAL} comparisons, one tick each.`,
  fps: FPS, width: W, height: H, frames: FRAMES,
  poster: TLL.levelStart[0] + 70,
  gifStart: Math.floor(TLL.levelStart[1] / FPS),
  seek(i) { draw(Math.max(0, Math.min(FRAMES - 1, Math.floor(i)))); },
  audio: () => renderAudio(TLL, FRAMES),
  variants: {
    vertical: {
      width: VW, height: VH, frames: VFR, canvas: vcv,
      poster: TLV.levelStart[0] + 50, gifStart: Math.floor(TLV.levelStart[1] / FPS),
      seek(i) { vSeek(vDraw, i, VFR); },
      audio: () => renderAudio(TLV, VFR),
    },
  },
};

/* ==========================================================================
   PLAYER — identical in every piece; keep as is.
   Autoplays and loops, starts sound on the first click, ?frame=N pauses on a
   frame, ?variant=vertical plays the vertical cut (if the piece has one).
   When the renderer sets window.__MOTION_RENDER__ it stays out of the way.
   ========================================================================== */
(function player() {
  const btn = document.getElementById('sound'), q = new URLSearchParams(location.search);
  let M = window.__motion;
  const V = !window.__MOTION_RENDER__ && M.variants && M.variants[q.get('variant')];
  if (V) {                                                // show the variant's own canvas instead
    M = Object.assign({}, M, V);
    V.canvas.style.cssText = `width:min(100vw,calc(100vh*${V.width}/${V.height}));height:auto;aspect-ratio:${V.width}/${V.height}`;
    document.querySelector('canvas').replaceWith(V.canvas);
  }
  const dur = M.frames / M.fps;
  if (window.__MOTION_RENDER__) { btn.hidden = true; M.seek(0); return; }
  if (q.has('frame')) { btn.hidden = true; M.seek(+q.get('frame') || 0); return; }
  let t0 = performance.now(), ac = null, src = null, buf = null, paused = false, pausedAt = 0;
  const clock = () => ac && src ? (ac.currentTime - t0) : (performance.now() - t0) / 1000;
  function loop() {
    if (!paused) M.seek(Math.floor(((clock() % dur) + dur) % dur * M.fps));
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  btn.addEventListener('click', async () => {
    if (src) { src.stop(); src = null; btn.textContent = 'Click for sound'; t0 = performance.now(); return; }
    btn.textContent = 'Loading sound…';
    ac = ac || new AudioContext({ sampleRate: 48000 });
    buf = buf || await M.audio();
    await ac.resume();
    src = ac.createBufferSource(); src.buffer = buf; src.loop = true; src.connect(ac.destination);
    t0 = ac.currentTime + 0.05; src.start(t0);        // picture restarts from frame 0 in sync with the sound
    btn.textContent = 'Sound on — click to mute';
  });
  addEventListener('keydown', e => {
    if (e.code !== 'Space') return;
    e.preventDefault(); paused = !paused;
    if (ac) paused ? ac.suspend() : ac.resume();
    if (!ac) { if (paused) pausedAt = performance.now(); else t0 += performance.now() - pausedAt; }
  });
})();
</script>
