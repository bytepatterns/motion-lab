<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="teambytepatterns">
<meta name="description" content="A Kubernetes rolling update of four pods from v1 to v2 with maxSurge 1 and maxUnavailable 0: each new pod must pass its readiness probe before an old one is let go, so four pods are always ready.">
<title>Rolling Update — motion-lab</title>
<style>
  /* Player chrome. The piece itself lives entirely in the canvas. */
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; font: 500 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; }
  canvas { display: block; width: min(100vw, calc(100vh * 16 / 9)); height: auto; aspect-ratio: 16 / 9; }
  #sound { position: fixed; left: 16px; bottom: 16px; padding: 8px 14px; border: 1px solid rgba(255,255,255,.35); border-radius: 999px;
           background: rgba(0,0,0,.55); color: #fff; font: inherit; cursor: pointer; }
  #sound[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080" aria-label="Four v1 pods are replaced one at a time by v2 pods; a Service sends traffic only to ready pods, and a chart shows ready pods never dropping below four"></canvas>
<button id="sound" type="button">Click for sound</button>
<script>
'use strict';
/* ==========================================================================
   PIECE — Rolling Update.
   A Deployment with 4 replicas moves from v1 to v2 with the strategy
     type: RollingUpdate, maxSurge: 1, maxUnavailable: 0
   (the example values here; the defaults are 25% and 25%). The rollout is
   simulated once, at load, as a list of timed events:
   - a new pod is Pending while it is scheduled and its image is pulled,
     then Running; its readiness probe (initialDelaySeconds 2,
     periodSeconds 2) fails until the app has started, and the first
     success makes it Ready, so the Service starts sending it traffic;
   - once a new pod is available the controller scales the old ReplicaSet
     down by one: that pod leaves the Service and gets SIGTERM; with the
     surge room free again the next new pod is created.
   Terminating pods do not count toward the surge limit. The chart plots
   ready pods and (non-terminating) pods from the same events, and the
   numbers in the summary are measured from them. seek(i) only reads them.
   ========================================================================== */
const W = 1920, H = 1080, FPS = 30, FRAMES = 720;          // 24 s
const cv = document.getElementById('stage');
const ctx = cv.getContext('2d', { willReadFrequently: true });   // CPU raster: identical pixels on every redraw
const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
const MONO = 'ui-monospace, "Cascadia Code", Consolas, Menlo, monospace';

// ---- helpers -------------------------------------------------------------
// ---- helpers -------------------------------------------------------------
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (f, a, b) => clamp((f - a) / (b - a));
const smooth = t => t * t * (3 - 2 * t);
const E = {
  inCubic: t => t * t * t,
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inOutCubic: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outExpo: t => t === 1 ? 1 : 1 - Math.pow(2, -10 * t),
  inExpo: t => t === 0 ? 0 : Math.pow(2, 10 * t - 10),
  inOutExpo: t => t === 0 ? 0 : t === 1 ? 1 : t < .5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2,
  outBack: t => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2),
};
function text(g, str, x, y, { size = 40, weight = 600, color = '#fff', alpha = 1, spacing = 0, align = 'left', fam = FONT, base = 'alphabetic' } = {}) {
  if (alpha <= 0.002 || !str) return 0;
  g.font = `${weight} ${size}px ${fam}`; g.letterSpacing = spacing + 'px';
  g.textAlign = align; g.textBaseline = base;
  const a0 = g.globalAlpha; g.globalAlpha = a0 * alpha; g.fillStyle = color;
  g.fillText(str, x, y);
  const w = g.measureText(str).width;
  g.globalAlpha = a0; g.letterSpacing = '0px';
  return w;
}
const env = (f, a, b, fin = 12, fout = 10) => {
  const i = E.outCubic(prog(f, a, a + fin)), o = 1 - E.inCubic(prog(f, b - fout, b));
  return [Math.min(i, o), (1 - i) * 24 - (1 - o) * 10];
};

// ---- palette -------------------------------------------------------------
const C = {
  bg: '#0C0F14', bgRGB: '12,15,20', card: '#151A22', paper: '#ECE8E0', dim: 'rgba(236,232,224,0.62)', faint: 'rgba(236,232,224,0.3)',
  v1: '#58C4B8', v2: '#F5B83D', ready: '#9BE36D', warn: '#FF7A59', grey: '#6B7079',
};

// ---- the rollout, simulated (seconds) ------------------------------------------
const R = 4, SURGE = 1, UNAVAIL = 0;
const PROBE = { initialDelay: 2, period: 2 };
const STARTUP = [2.9, 1.6, 3.3, 2.4];                       // how long each v2 app takes to answer its probe
const SIM = (() => {
  const r = mulberry32(0x8E57);
  const pods = [];
  for (let k = 0; k < R; k++) pods.push({ ver: 1, slot: k, name: `web-v1-${k + 1}`, tCreate: -1e3, tRunning: -1e3, tReady: -1e3, probes: [], tTerm: Infinity, tGone: Infinity });
  let t = 0.4;                                              // the new pod template is applied at t = 0
  for (let k = 0; k < R; k++) {
    const p = { ver: 2, slot: k, name: `web-v2-${k + 1}`, tCreate: t, tTerm: Infinity, tGone: Infinity, probes: [] };
    p.tRunning = t + 1.5 + 0.3 * r();                       // scheduled, image pulled, container started
    p.tHealthy = p.tRunning + STARTUP[k];
    for (let q = p.tRunning + PROBE.initialDelay; ; q += PROBE.period) {
      const ok = q >= p.tHealthy; p.probes.push({ t: q, ok });
      if (ok) { p.tReady = q; break; }
    }
    pods.push(p);
    const old = pods[k];                                    // the controller scales the old ReplicaSet down by one
    old.tTerm = p.tReady + 0.3; old.tGone = old.tTerm + 1.2 + 0.3 * r();
    t = p.tReady + 0.6;                                     // and, with room under the surge again, adds the next new pod
  }
  const tDone = Math.max(...pods.map(p => p.ver === 1 ? p.tGone : p.tReady));
  return { pods, tDone };
})();
const PODS = SIM.pods, TDONE = SIM.tDone;
const isReady = (p, t) => t >= p.tReady && t < p.tTerm;
const readyAt = t => PODS.reduce((n, p) => n + (isReady(p, t) ? 1 : 0), 0);
const podsAt = t => PODS.reduce((n, p) => n + (t >= p.tCreate && t < p.tTerm ? 1 : 0), 0);   // Terminating not counted
const STATS = (() => {
  let minReady = 99, maxPods = 0;
  for (let t = -1; t <= TDONE + 1; t += 0.01) { minReady = Math.min(minReady, readyAt(t)); maxPods = Math.max(maxPods, podsAt(t)); }
  const fails = PODS.reduce((n, p) => n + p.probes.filter(q => !q.ok).length, 0);
  return { minReady, maxPods, fails };
})();
// the step changes of both counts, for the chart
const STEPS = [...new Set(PODS.flatMap(p => [p.tCreate, p.tReady, p.tTerm]).filter(t => t >= 0 && t < 1e3))].sort((a, b) => a - b);

// ---- timelines: frame <-> simulated seconds ---------------------------------------
/** roll: frame of t = 0; spd: frames per simulated second. */
const TL = { roll: 72, spd: (596 - 72) / TDONE, sum: 604, end: 648 };
const simT = (f, tl) => (f - tl.roll) / tl.spd;
const frameOf = (t, tl) => tl.roll + t * tl.spd;

// ---- drawing ------------------------------------------------------------------------
function bez(A, a, B, b, u) {                               // cubic from A (control a) to B (control b)
  const v = 1 - u;
  return [v * v * v * A[0] + 3 * v * v * u * a[0] + 3 * v * u * u * b[0] + u * u * u * B[0],
          v * v * v * A[1] + 3 * v * v * u * a[1] + 3 * v * u * u * b[1] + u * u * u * B[1]];
}
function rrect(g, x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
/** Where a pod's card sits, and the two ends of its link to the Service. */
function cardBox(L, p) {
  const x = L.card.x0 + p.slot * (L.card.w + L.card.gap), y = L.rowY[p.ver - 1];
  return { x, y, w: L.card.w, h: L.card.h };
}
/** The Service's link to a pod as a cubic [A, a, B, b]: sideways (landscape) or up and down (vertical). */
function link(L, p) {
  const b = cardBox(L, p), s = L.svc;
  if (L.side) {
    const A = [s.x + s.w, s.y + s.h / 2], B = [b.x, b.y + b.h / 2], d = (B[0] - A[0]) * 0.5;
    return [A, [A[0] + d, A[1]], B, [B[0] - d, B[1]]];
  }
  const up = p.ver === 1, A = [s.x + s.w / 2, up ? s.y : s.y + s.h], B = [b.x + b.w / 2, up ? b.y + b.h : b.y], d = (B[1] - A[1]) * 0.5;
  return [A, [A[0], A[1] + d], B, [B[0], B[1] - d]];
}
/** Link strength of a pod (0..1): on while it is Ready and not Terminating. */
const progF = (t, a, d) => isFinite(a) ? prog(t, a, a + d) : 0;         // 0 while the event has not been scheduled
const linkOn = (p, t) => Math.min(E.outCubic(prog(t, p.tReady, p.tReady + 0.25)), 1 - progF(t, p.tTerm, 0.2));
function podState(p, t) {
  if (t < p.tCreate) return null;
  if (t >= p.tTerm) return 'Terminating';
  if (t >= p.tReady) return 'Ready';
  if (t >= p.tRunning) return 'Running';
  return 'Pending';
}
function drawPod(g, L, p, t) {
  const st = podState(p, t);
  if (!st) return;
  const gone = progF(t, p.tGone, 0.35);
  if (gone >= 1) return;
  const b = cardBox(L, p), vc = p.ver === 1 ? C.v1 : C.v2;
  const inK = E.outBack(prog(t, p.tCreate, p.tCreate + 0.45)), readyK = prog(t, p.tReady, p.tReady + 0.35);
  const pop = st === 'Ready' ? 1 + 0.06 * Math.sin(Math.PI * readyK) : 1;
  const sc = lerp(0.86, 1, inK) * pop * (1 - 0.08 * gone);
  g.save();
  g.globalAlpha = clamp(inK) * (1 - gone);
  g.translate(b.x + b.w / 2, b.y + b.h / 2 + gone * 30); g.scale(sc, sc); g.translate(-b.w / 2, -b.h / 2);
  // probe flash
  let flash = null;
  for (const q of p.probes) { const a = 1 - prog(t, q.t, q.t + 0.9); if (t >= q.t && a > 0) flash = { ok: q.ok, a }; }
  const fill = st === 'Ready' ? (p.ver === 1 ? '#17302D' : '#382D14') : st === 'Terminating' ? '#14161B' : C.card;
  rrect(g, 0, 0, b.w, b.h, 16); g.fillStyle = fill; g.fill();
  if (st === 'Ready' && readyK < 1) { g.fillStyle = `rgba(255,255,255,${0.35 * (1 - readyK)})`; g.fill(); }
  g.lineWidth = 3;
  if (st === 'Pending') { g.setLineDash([10, 8]); g.strokeStyle = C.faint; }
  else if (st === 'Terminating') g.strokeStyle = C.grey;
  else g.strokeStyle = vc;
  if (flash && st === 'Running') { g.strokeStyle = flash.ok ? C.ready : C.warn; g.lineWidth = 3 + 3 * flash.a; }
  g.stroke(); g.setLineDash([]);
  const ink = st === 'Terminating' ? C.faint : C.paper;
  text(g, p.name, 20, 44, { size: 28, weight: 700, fam: MONO, color: ink });
  const sc2 = { Pending: C.dim, Running: C.warn, Ready: C.ready, Terminating: C.grey }[st];
  text(g, st, 20, 90, { size: 30, weight: 800, color: sc2 });
  let l3 = st === 'Ready' ? 'ready 1/1' : st === 'Terminating' ? 'SIGTERM' : 'ready 0/1', c3 = C.dim;
  if (flash && st === 'Running') { l3 = flash.ok ? 'probe 200' : 'probe 503'; c3 = flash.ok ? C.ready : C.warn; }
  if (st === 'Ready' && readyK < 1) { l3 = 'probe 200'; c3 = C.ready; }
  text(g, l3, 20, 132, { size: 28, weight: 600, fam: MONO, color: c3 });
  // probe ping: a ring from the top-right corner
  for (const q of p.probes) {
    const u = prog(t, q.t, q.t + 0.6);
    if (u <= 0 || u >= 1) continue;
    g.strokeStyle = q.ok ? C.ready : C.warn; g.globalAlpha = clamp(inK) * (1 - u); g.lineWidth = 3;
    g.beginPath(); g.arc(b.w - 26, 30, 8 + 26 * E.outCubic(u), 0, Math.PI * 2); g.stroke();
  }
  g.globalAlpha = clamp(inK) * (1 - gone);
  g.fillStyle = st === 'Ready' ? C.ready : st === 'Running' ? C.warn : C.grey;
  g.beginPath(); g.arc(b.w - 26, 30, 8, 0, Math.PI * 2); g.fill();
  g.restore();
}
/** Requests from the Service, round robin over the pods that are Ready at that moment. */
const RATE = 7, TRIP = 0.5;
function drawRequests(g, L, t) {
  const n0 = Math.ceil((t - TRIP) * RATE), n1 = Math.floor(t * RATE);
  g.fillStyle = C.paper;
  for (let n = n0; n <= n1; n++) {
    const tn = n / RATE, ready = PODS.filter(p => isReady(p, tn));
    if (!ready.length) continue;
    const p = ready[((n % ready.length) + ready.length) % ready.length];
    const on = linkOn(p, t); if (on <= 0.05) continue;
    const [A, a, B, b] = link(L, p), u = E.inOutCubic((t - tn) / TRIP), q = bez(A, a, B, b, u);
    g.globalAlpha = on * (u < 0.9 ? 1 : (1 - u) * 10); g.beginPath(); g.arc(q[0], q[1], 6, 0, Math.PI * 2); g.fill();
  }
  g.globalAlpha = 1;
}
function drawStage(g, L, t) {
  // row labels
  text(g, 'ReplicaSet v1', L.labelX, L.labelY[0], { size: 28, weight: 700, color: C.v1, spacing: 1 });
  const nv = E.outCubic(prog(t, -0.2, 0.3));
  text(g, 'ReplicaSet v2', L.labelX, L.labelY[1], { size: 28, weight: 700, color: C.v2, spacing: 1, alpha: nv });
  if (nv < 1) { g.globalAlpha = 1 - nv; for (let k = 0; k < R; k++) { const b = cardBox(L, { slot: k, ver: 2 }); rrect(g, b.x, b.y, b.w, b.h, 16); g.strokeStyle = 'rgba(236,232,224,0.12)'; g.lineWidth = 2; g.setLineDash([6, 8]); g.stroke(); g.setLineDash([]); } g.globalAlpha = 1; }
  // links (endpoints of the Service)
  for (const p of PODS) {
    const on = linkOn(p, t); if (on <= 0.01 || podState(p, t) === null) continue;
    const [A, a, B, b] = link(L, p);
    g.strokeStyle = p.ver === 1 ? C.v1 : C.v2; g.globalAlpha = 0.5 * on; g.lineWidth = 3;
    g.beginPath(); g.moveTo(A[0], A[1]); g.bezierCurveTo(a[0], a[1], b[0], b[1], B[0], B[1]); g.stroke();
  }
  g.globalAlpha = 1;
  drawRequests(g, L, t);
  // the Service
  const s = L.svc;
  rrect(g, s.x, s.y, s.w, s.h, 18); g.fillStyle = '#1B212B'; g.fill(); g.strokeStyle = C.paper; g.lineWidth = 3; g.stroke();
  text(g, 'Service', s.x + s.w / 2, s.y + s.h / 2 - 4, { size: 32, weight: 800, color: C.paper, align: 'center' });
  text(g, 'web', s.x + s.w / 2, s.y + s.h / 2 + 36, { size: 28, weight: 600, fam: MONO, color: C.dim, align: 'center' });
  for (const p of PODS) drawPod(g, L, p, t);
}
/** The chart: ready pods and pods over the rollout, with both limits. */
function drawChart(g, c, t, alpha = 1) {
  if (alpha <= 0.01) return;
  g.save(); g.globalAlpha = alpha;
  const T1 = TDONE + 0.8, X = s => c.x + clamp(s / T1) * c.w, Y = n => c.y + c.h - (n - 2.6) / 3 * c.h;
  g.strokeStyle = 'rgba(236,232,224,0.18)'; g.lineWidth = 2; g.beginPath(); g.moveTo(c.x, c.y + c.h); g.lineTo(c.x + c.w, c.y + c.h); g.stroke();
  // limits
  g.setLineDash([10, 9]); g.lineWidth = 2.5;
  g.strokeStyle = C.warn; g.beginPath(); g.moveTo(c.x, Y(5)); g.lineTo(c.x + c.w, Y(5)); g.stroke();
  g.strokeStyle = C.ready; g.beginPath(); g.moveTo(c.x, Y(4)); g.lineTo(c.x + c.w, Y(4)); g.stroke();
  g.setLineDash([]);
  text(g, `at most ${R + SURGE} pods`, c.x + c.w, Y(5) - 14, { size: 28, weight: 700, color: C.warn, align: 'right' });
  text(g, `at least ${R - UNAVAIL} ready`, c.x + c.w, Y(4) + 38, { size: 28, weight: 700, color: C.ready, align: 'right' });
  // the two step lines, drawn up to now
  const tt = clamp(t, 0, T1);
  const step = (fn, col, lw, off) => {
    g.strokeStyle = col; g.lineWidth = lw; g.beginPath();
    let prev = fn(0); g.moveTo(X(0), Y(prev) + off);
    for (const s of STEPS) { if (s > tt) break; g.lineTo(X(s), Y(prev) + off); prev = fn(s + 1e-6); g.lineTo(X(s), Y(prev) + off); }
    g.lineTo(X(tt), Y(prev) + off); g.stroke();
    g.fillStyle = col; g.beginPath(); g.arc(X(tt), Y(prev) + off, 7, 0, Math.PI * 2); g.fill();
  };
  if (t > 0) { step(podsAt, C.paper, 4, 0); step(readyAt, C.ready, 5, 0); }
  text(g, 'pods', c.x, c.y - 8, { size: 28, weight: 700, color: C.paper });
  g.font = `700 28px ${FONT}`; const pw = g.measureText('pods').width;
  text(g, '·  ready', c.x + pw + 14, c.y - 8, { size: 28, weight: 700, color: C.ready });
  g.restore();
}
const YAML = [
  ['spec:', ''], ['  replicas: ', '4'], ['  strategy:', ''], ['    type: ', 'RollingUpdate'],
  ['    rollingUpdate:', ''], ['      maxSurge: ', '1'], ['      maxUnavailable: ', '0'],
];
function drawYaml(g, x, y, lh, alpha, hi = -1) {
  if (alpha <= 0.01) return;
  YAML.forEach(([k, v], i) => {
    const ky = y + i * lh;
    if (i === hi) { g.globalAlpha = alpha * 0.16; g.fillStyle = C.paper; g.fillRect(x - 12, ky - lh * 0.72, 440, lh); g.globalAlpha = 1; }
    const w = text(g, k, x, ky, { size: 28, weight: 500, fam: MONO, color: C.dim, alpha });
    if (v) text(g, v, x + w, ky, { size: 28, weight: 800, fam: MONO, color: i === 5 ? C.warn : i === 6 ? C.ready : C.paper, alpha });
  });
}
function backdrop(g, w, h) {
  g.fillStyle = C.bg; g.fillRect(0, 0, w, h);
  const gr = g.createRadialGradient(w * 0.62, h * 0.42, 40, w * 0.62, h * 0.42, Math.max(w, h) * 0.7);
  gr.addColorStop(0, 'rgba(40,52,70,0.55)'); gr.addColorStop(1, 'rgba(12,15,20,0)');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
}

// ---- landscape picture ------------------------------------------------------------------
const LAY_L = {
  side: true, svc: { x: 640, y: 402, w: 170, h: 120 },
  card: { x0: 880, w: 224, h: 150, gap: 16 }, rowY: [262, 512], labelX: 880, labelY: [246, 496],
  chart: { x: 880, y: 800, w: 944, h: 170 },
};
function draw(f) {
  if (ctx.reset) ctx.reset();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none'; ctx.shadowBlur = 0;
  backdrop(ctx, W, H);
  const t = simT(f, TL);
  drawStage(ctx, LAY_L, t);
  drawChart(ctx, LAY_L.chart, t, E.outCubic(prog(f, TL.roll - 20, TL.roll + 6)));
  const endK = E.inOutCubic(prog(f, TL.end, TL.end + 20)), a = 1 - endK;
  text(ctx, 'KUBERNETES  ·  ROLLING UPDATE', 120, 104, { size: 26, weight: 600, color: C.dim, spacing: 5, alpha: a });
  text(ctx, 'BYTEPATTERNS', 1800, 104, { size: 26, weight: 600, color: C.dim, spacing: 5, align: 'right', alpha: a });
  // hook
  {
    const k = E.outExpo(prog(f, -20, 4)), k2 = E.outExpo(prog(f, -14, 10)), k3 = E.outExpo(prog(f, 6, 26)), o = 1 - E.inCubic(prog(f, TL.roll - 14, TL.roll + 4));
    text(ctx, 'Replace', 114, 300 + (1 - k) * 30, { size: 100, weight: 850, color: C.paper, spacing: -3, alpha: Math.min(k, o) });
    text(ctx, 'all 4 pods.', 114, 400 + (1 - k) * 30, { size: 100, weight: 850, color: C.paper, spacing: -3, alpha: Math.min(k, o) });
    text(ctx, 'Keep 4 ready.', 116, 500 + (1 - k2) * 30, { size: 76, weight: 850, color: C.ready, spacing: -2, alpha: Math.min(k2, o) });
    text(ctx, 'v1 → v2, one pod at a time', 120, 580 + (1 - k3) * 20, { size: 36, weight: 600, color: C.dim, alpha: Math.min(k3, o) });
  }
  // the spec, the two rules, the clock
  {
    const [al, dy] = env(f, TL.roll - 4, TL.sum + 4, 16, 10);
    const t2 = Math.max(0, t), hi = podsAt(t2) > R ? 5 : -1;
    drawYaml(ctx, 122, 250 + dy, 42, al * a, hi);
    const [a2, d2] = env(f, TL.roll + 20, TL.sum + 4, 16, 10);
    ctx.globalAlpha = a2 * a;
    ctx.fillStyle = C.warn; ctx.beginPath(); ctx.arc(130, 590 + d2, 8, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = C.ready; ctx.beginPath(); ctx.arc(130, 640 + d2, 8, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;
    text(ctx, `never more than ${R + SURGE} pods`, 154, 600 + d2, { size: 32, weight: 700, color: C.paper, alpha: a2 * a });
    text(ctx, `never fewer than ${R - UNAVAIL} ready`, 154, 650 + d2, { size: 32, weight: 700, color: C.paper, alpha: a2 * a });

// ---- sound: probes knock, a ready pod ticks, an old one winds down ----------------------------------
/** The soundtrack on a timeline (landscape or vertical): frames long, t = 0 at tl.roll. */
async function renderAudio(tl = TL, frames = FRAMES, endAt = TL.end) {
  const SR = 48000, dur = frames / FPS, LEN = Math.round(SR * dur);
  const ac = new OfflineAudioContext(2, LEN, SR);
  const at = t => frameOf(t, tl) / FPS;
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -14; comp.ratio.value = 3; comp.attack.value = 0.003; comp.release.value = 0.2;
  const master = ac.createGain(); master.gain.value = 0.95; master.connect(comp).connect(ac.destination);
  master.gain.setValueAtTime(0.95, dur - 0.8); master.gain.linearRampToValueAtTime(0.0001, dur - 0.02);
  const rnd = mulberry32(0x22A0);
  const ir = ac.createBuffer(2, SR * 2, SR);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let k = 0; k < d.length; k++) d[k] = (rnd() * 2 - 1) * Math.pow(1 - k / d.length, 3.4); }
  const verb = ac.createConvolver(); verb.buffer = ir; const vg = ac.createGain(); vg.gain.value = 0.28; verb.connect(vg).connect(master);
  const noise = ac.createBuffer(1, SR, SR); { const d = noise.getChannelData(0); for (let k = 0; k < d.length; k++) d[k] = rnd() * 2 - 1; }
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  const endS = endAt / FPS;
  const pad = (a, b, notes, amp) => { const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 850; lp.connect(master); lp.connect(verb);
    for (const m of notes) for (const det of [-5, 5]) {
      const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = hz(m); o.detune.value = det;
      const g = ac.createGain(); g.gain.setValueAtTime(0, a); g.gain.linearRampToValueAtTime(amp, a + (a === 0 ? 0.1 : 1));
      g.gain.setValueAtTime(amp, Math.max(a + 1, b - 1)); g.gain.linearRampToValueAtTime(0, b);
      o.connect(g).connect(lp); o.start(a); o.stop(b + 0.05);
    } };
  const mid = at(TDONE * 0.5);
  pad(0, mid + 0.6, [38, 45, 50, 54, 57], 0.015); pad(mid - 0.4, dur, [43, 50, 55, 59, 62], 0.016);
  const pan = p => -0.55 + p.slot * 0.37;
  // traffic: a very soft tick for each request that reaches a pod
  const tick = (t0, pn, amp, f0 = 7000) => {
    const s = ac.createBufferSource(); s.buffer = noise; const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f0; bp.Q.value = 2;
    const g = ac.createGain(); g.gain.setValueAtTime(amp, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.03);
    const p = ac.createStereoPanner(); p.pan.value = pn; s.connect(bp).connect(g).connect(p).connect(master); s.start(t0, (t0 * 7.31) % 0.9, 0.05);
  };
  for (let n = Math.ceil(simT(0, tl) * RATE); n / RATE < simT(frames, tl); n++) {
    const tn = n / RATE, ready = PODS.filter(p => isReady(p, tn)); if (!ready.length) continue;
    const p = ready[((n % ready.length) + ready.length) % ready.length], s0 = at(tn + TRIP);
    if (s0 > 0 && s0 < endS) tick(s0, pan(p), 0.05);
  }
  const blip = (t0, f0, amp, type = 'sine', d = 0.08, pn = 0) => {
    const o = ac.createOscillator(), g = ac.createGain(), p = ac.createStereoPanner(), lp = ac.createBiquadFilter();
    o.type = type; o.frequency.value = f0; lp.type = 'lowpass'; lp.frequency.value = type === 'sine' ? 12000 : 900; p.pan.value = pn;
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(amp, t0 + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    o.connect(lp).connect(g).connect(p); p.connect(master); p.connect(verb); o.start(t0); o.stop(t0 + d + 0.05);
  };
  const bell = (t0, m, amp, pn) => { for (const [r2, a2, d2] of [[1, 1, 1.6], [2.76, 0.3, 0.7], [5.4, 0.1, 0.3]]) {
    const o = ac.createOscillator(); o.frequency.value = hz(m) * r2; const g = ac.createGain(), p = ac.createStereoPanner();
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(amp * a2, t0 + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d2);
    p.pan.value = pn; o.connect(g).connect(p); p.connect(master); p.connect(verb); o.start(t0); o.stop(t0 + d2 + 0.05); } };
  const READY_NOTES = [72, 76, 79, 84];
  for (const p of PODS) {
    if (p.ver !== 2) continue;
    const pn = pan(p);
    // created: a soft rising pop
    { const t0 = at(p.tCreate), o = ac.createOscillator(), g = ac.createGain(), pp = ac.createStereoPanner();
      o.frequency.setValueAtTime(420, t0); o.frequency.exponentialRampToValueAtTime(900, t0 + 0.12); pp.pan.value = pn;
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.08, t0 + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.2);
      o.connect(g).connect(pp).connect(master); o.start(t0); o.stop(t0 + 0.25); }
    // probes: a dull double knock when one fails, a clean tick when one passes
    for (const q of p.probes) {
      if (q.ok) blip(at(q.t), 2400, 0.1, 'sine', 0.05, pn);
      else { blip(at(q.t), 190, 0.16, 'square', 0.09, pn); blip(at(q.t) + 0.11, 170, 0.13, 'square', 0.09, pn); }
    }
    // ready: the tick, a bright click and a bell, one note higher per pod
    { const t0 = at(p.tReady) + 0.02; tick(t0, pn, 0.4, 3200); bell(t0, READY_NOTES[p.slot], 0.12, pn); }
  }
  for (const p of PODS) {                                     // an old pod winds down
    if (p.ver !== 1 || !isFinite(p.tTerm)) continue;
    const t0 = at(p.tTerm), o = ac.createOscillator(), g = ac.createGain(), pp = ac.createStereoPanner();
    o.type = 'triangle'; o.frequency.setValueAtTime(520, t0); o.frequency.exponentialRampToValueAtTime(130, t0 + 0.5); pp.pan.value = pan(p);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.07, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.6);
    o.connect(g).connect(pp); pp.connect(master); pp.connect(verb); o.start(t0); o.stop(t0 + 0.65);
  }
  [67, 71, 74, 79].forEach((m, i) => bell(at(TDONE) + 0.25 + i * 0.09, m, 0.07, -0.3 + i * 0.2));
  [69, 72, 76, 81].forEach((m, i) => bell(endS + (8 + i * 6) / FPS, m, 0.08, -0.45 + i * 0.3));
  const buf = await ac.startRendering();
  let peak = 0; for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let k = 0; k < d.length; k++) peak = Math.max(peak, Math.abs(d[k])); }
  if (peak > 0.89) for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let k = 0; k < d.length; k++) d[k] *= 0.89 / peak; }
  return buf;
}

/* ==========================================================================
   VERTICAL CUT — shared block, identical in every piece.
   1080x1920 for Reels, Shorts and TikTok (__motion.variants.vertical). The
   piece's own scene code is re-used and recomposed for a phone: everything a
   viewer must read stays inside the area no platform covers (x 60..900,
   y 230..1400); outside it there is only dimmed texture.
   ========================================================================== */
const VW = 1080, VH = 1920, SAFE = { x: 60, y: 230, w: 840, h: 1170, r: 900, b: 1400 };
const vcv = document.createElement('canvas'); vcv.width = VW; vcv.height = VH;
const vx = vcv.getContext('2d', { willReadFrequently: true });   // CPU raster: identical pixels on every redraw
const VL = 96, VR = 864;                                          // text column inside the safe area

function vReset() {
  vx.setTransform(1, 0, 0, 1, 0, 0); vx.globalAlpha = 1; vx.globalCompositeOperation = 'source-over';
  vx.filter = 'none'; vx.shadowBlur = 0; vx.shadowColor = 'transparent'; vx.letterSpacing = '0px'; vx.setLineDash([]);
  vx.textAlign = 'left'; vx.textBaseline = 'alphabetic'; vx.lineCap = 'butt'; vx.lineJoin = 'miter';
}
/** Canvas text on the vertical frame; `max` shrinks the size until the line fits. */
function vText(str, x, y, { size = 40, weight = 700, color = '#FFFFFF', align = 'left', spacing = 0, alpha = 1, fam = FONT, max = 0 } = {}) {
  if (alpha <= 0.002 || !str) return size;
  vx.font = `${weight} ${size}px ${fam}`; vx.letterSpacing = spacing + 'px';
  if (max) { const w = vx.measureText(str).width; if (w > max) { size = size * max / w; vx.font = `${weight} ${size}px ${fam}`; } }
  vx.textAlign = align; vx.textBaseline = 'alphabetic';
  const a0 = vx.globalAlpha; vx.globalAlpha = a0 * alpha; vx.fillStyle = color;
  vx.fillText(str, x + (align === 'center' ? spacing / 2 : align === 'right' ? spacing : 0), y);   // tracking is added after the last glyph too
  vx.globalAlpha = a0; vx.letterSpacing = '0px';
  return size;
}
/** Word-wraps with the given font; returns the lines. */
function vWrap(str, maxW, size, weight = 700, fam = FONT) {
  vx.font = `${weight} ${size}px ${fam}`; vx.letterSpacing = '0px';
  const words = str.split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (vx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur);
  return lines;
}
/** Fade envelope with a small rise: [alpha, dy]. */
function vEnv(v, a, b, fin = 8, fout = 8) {
  const i = E.outCubic(prog(v, a, a + fin)), o = 1 - E.inCubic(prog(v, b - fout, b));
  return [Math.min(i, o), (1 - i) * 22 - (1 - o) * 10];
}
/** Which segment of a cut list a vertical frame is in: segs = [{ at, src, len }] in frames. */
function vSeg(segs, v) {
  let k = 0; while (k < segs.length - 1 && v >= segs[k + 1].at) k++;
  const s = segs[k];
  return { k, s, local: v - s.at, src: s.src + (v - s.at) };
}
/** Dims everything outside the safe area to a quiet texture (brightness x 0.2), with a soft inner edge. */
function vShade(rgb, a = 0.8, feather = 40) {
  vx.save(); vx.setTransform(1, 0, 0, 1, 0, 0); vx.globalAlpha = 1; vx.globalCompositeOperation = 'source-over';
  vx.fillStyle = `rgba(${rgb},${a})`;
  vx.beginPath(); vx.rect(0, 0, VW, VH); vx.rect(SAFE.x, SAFE.y, SAFE.w, SAFE.h); vx.fill('evenodd');
  const strip = (x0, y0, x1, y1, rx, ry, rw, rh) => {
    const g = vx.createLinearGradient(x0, y0, x1, y1);
    g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`);
    vx.fillStyle = g; vx.fillRect(rx, ry, rw, rh);
  };
  strip(SAFE.x, 0, SAFE.x + feather, 0, SAFE.x, SAFE.y, feather, SAFE.h);
  strip(SAFE.r, 0, SAFE.r - feather, 0, SAFE.r - feather, SAFE.y, feather, SAFE.h);
  strip(0, SAFE.y, 0, SAFE.y + feather, SAFE.x, SAFE.y, SAFE.w, feather);
  strip(0, SAFE.b, 0, SAFE.b - feather, SAFE.x, SAFE.b - feather, SAFE.w, feather);
  vx.restore();
}
/** Series tag at the top of the safe area, e.g. MADE IN CODE · 04. */
function vTag(label, color, alpha = 1) {
  vText('MADE IN CODE', VL, 292, { size: 28, weight: 800, color, spacing: 5, alpha });
  vx.font = `800 28px ${FONT}`; vx.letterSpacing = '5px';
  const w = vx.measureText('MADE IN CODE').width; vx.letterSpacing = '0px';
  vText('·  ' + label, VL + w + 14, 292, { size: 28, weight: 600, color: 'rgba(255,255,255,0.72)', spacing: 3, alpha, max: VR - VL - w - 14 });
}
/** Big hook lines, left-aligned from y0; visible from frame 0, settles in a few frames. */
function vHook(v, lines, y0, { size = 84, lh = 1.08, color = '#FFFFFF', accent = null, weight = 800, spacing = -1.5, alpha = 1 } = {}) {
  const k = E.outExpo(prog(v, -6, 12));
  lines.forEach((ln, i) => {
    const kk = E.outExpo(prog(v, -12 + i * 2, 8 + i * 2));
    vText(ln, VL, y0 + i * size * lh + (1 - kk) * 30, { size, weight, spacing, color: accent && i === lines.length - 1 ? accent : color, alpha: alpha * Math.max(0.25, kk), max: VR - VL });
  });
  return k;
}
/** Closing card, the last 60 frames: piece title, "drawn in code · bytepatterns.com". l = frames into the card. */
function vEndCard(l, { title, line = '', ink = '#FFFFFF', dim = 'rgba(255,255,255,0.66)', accent = '#FFFFFF', scrim = '0,0,0', a = 0.84 }) {
  const k = E.outCubic(prog(l, 0, 12));
  vx.save(); vx.setTransform(1, 0, 0, 1, 0, 0);
  vx.fillStyle = `rgba(${scrim},${a * k})`; vx.fillRect(0, 0, VW, VH);
  vx.restore();
  const t1 = E.outExpo(prog(l, 3, 19)), t2 = E.outExpo(prog(l, 11, 27)), t3 = E.outExpo(prog(l, 19, 35));
  vx.fillStyle = accent; vx.globalAlpha = t1; vx.fillRect(VL, 742, 88 * t1, 7); vx.globalAlpha = 1;
  const size = vText(title, VL, 850 + (1 - t1) * 40, { size: 92, weight: 800, color: ink, spacing: -2, alpha: t1, max: VR - VL });
  const y2 = 850 + Math.max(size, 60) * 0.25 + 70;
  vx.font = `600 44px ${FONT}`;
  const lead = 'drawn in code  ·  ', lw = vx.measureText(lead).width;
  vText(lead, VL, y2 + (1 - t2) * 24, { size: 44, weight: 600, color: dim, alpha: t2 });
  vText('bytepatterns.com', VL + lw, y2 + (1 - t2) * 24, { size: 44, weight: 800, color: accent, alpha: t2 });
  if (line) vText(line, VL, y2 + 72 + (1 - t3) * 18, { size: 32, weight: 500, color: dim, alpha: t3, max: VR - VL });

/** Seeks a cut. The first frame a page draws is drawn twice: the very first read of a
 *  GPU-backed source canvas can come out a shade different from every later one. */
let vWarm = false;
function vSeek(draw, i, frames) {
  const f = Math.max(0, Math.min(frames - 1, Math.floor(i)));
  if (!vWarm) { vWarm = true; draw(f); }
  draw(f);
}
/** The soundtrack of a cut: the piece's own audio() spliced to the same segments as the picture. */
async function vAudio(segs, frames, { xf = 0.025, fadeOut = 0.6, extra = null } = {}) {
  const src = await renderAudio();
  const SR = 48000, dur = frames / FPS, ac = new OfflineAudioContext(2, Math.round(SR * dur), SR);
  const out = ac.createGain(); out.connect(ac.destination);
  out.gain.setValueAtTime(1, 0); out.gain.setValueAtTime(1, dur - fadeOut); out.gain.linearRampToValueAtTime(0, dur - 0.01);
  segs.forEach((s, k) => {
    const at = s.at / FPS, off = s.src / FPS, d = s.len / FPS;
    const pre = k === 0 ? 0 : Math.min(xf, off), post = k === segs.length - 1 ? 0 : xf;
    const b = ac.createBufferSource(), g = ac.createGain(); b.buffer = src;
    g.gain.setValueAtTime(pre ? 0 : 1, at - pre);
    if (pre) g.gain.linearRampToValueAtTime(1, at + pre);
    if (post) { g.gain.setValueAtTime(1, at + d - post); g.gain.linearRampToValueAtTime(0, at + d + post); }
    b.connect(g).connect(out); b.start(at - pre, off - pre, d + pre + post);
  });

  const buf = await ac.startRendering();
  let peak = 0; for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) peak = Math.max(peak, Math.abs(d[i])); }
  if (peak > 0.9) for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] *= 0.9 / peak; }
  return buf;
}
/** A soft three-partial bell, for the closing card. */
function vChime(ac, dest, at, freq, vol = 0.08) {
  for (const [mul, v, dec] of [[1, 1, 1.8], [2.01, 0.35, 0.8], [3.02, 0.12, 0.4]]) {
    const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.value = freq * mul;
    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol * v, at + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, at + dec);
    o.connect(g).connect(dest); o.start(at); o.stop(at + dec + 0.05);
  }
}

/* VERTICAL CUT — this piece */
// The same rollout on its own, faster clock: the old ReplicaSet above the
// Service, the new one below it, the chart underneath. The soundtrack is
// rendered from the same events on this clock.
const VFR = 540, VEND = VFR - 60;
const TLV = { roll: 46, spd: (428 - 46) / TDONE, sum: 436, end: VEND };
const LAY_V = {
  side: false, svc: { x: 380, y: 806, w: 200, h: 104 },
  card: { x0: 70, w: 196, h: 150, gap: 12 }, rowY: [620, 952], labelX: 70, labelY: [602, 1140],
  chart: { x: 96, y: 1222, w: 768, h: 150 },
};
function vDraw(v) {
  vReset();
  backdrop(vx, VW, VH);
  const t = simT(v, TLV), t2 = Math.max(0, t);
  drawStage(vx, LAY_V, t);
  drawChart(vx, LAY_V.chart, t, E.outCubic(prog(v, TLV.roll - 16, TLV.roll + 4)));
  vReset();
  vShade(C.bgRGB, 0.84);
  vTag('ROLLING UPDATE', C.v2);
  if (v < TLV.roll + 4) {
    const o = 1 - E.inCubic(prog(v, TLV.roll - 8, TLV.roll + 4));
    vHook(v, ['Replace all 4 pods.'], 410, { size: 84, color: C.paper, alpha: o });
    vText('Keep 4 ready.', VL, 510, { size: 84, weight: 850, color: C.ready, spacing: -2, alpha: o });
  } else if (v < TLV.sum) {
    const [al, dy] = vEnv(v, TLV.roll + 4, TLV.sum + 2, 8, 8);
    vx.font = `600 32px ${MONO}`;
    const w1 = vx.measureText('maxSurge ').width, w2 = vx.measureText('maxSurge 1  ·  maxUnavailable ').width;
    vText('maxSurge ', VL, 390 + dy, { size: 32, weight: 600, fam: MONO, color: C.dim, alpha: al });
    vText('1', VL + w1, 390 + dy, { size: 32, weight: 800, fam: MONO, color: C.warn, alpha: al });
    vText('  ·  maxUnavailable ', VL + w1 + vx.measureText('1').width, 390 + dy, { size: 32, weight: 600, fam: MONO, color: C.dim, alpha: al });
    vText('0', VL + w2, 390 + dy, { size: 32, weight: 800, fam: MONO, color: C.ready, alpha: al });
    vText(`t = ${t2.toFixed(1).padStart(4)} s`, VL - 4, 490 + dy, { size: 76, weight: 800, fam: MONO, color: C.paper, spacing: -2, alpha: al });
    vText(`ready ${readyAt(t2)}  ·  pods ${podsAt(t2)}`, VL, 552 + dy, { size: 36, weight: 700, fam: MONO, color: C.ready, alpha: al });
  } else {
    const [al, dy] = vEnv(v, TLV.sum, VEND + 4, 8, 8);
    vText('Rolled out.', VL, 420 + dy, { size: 92, weight: 850, color: C.paper, spacing: -3, alpha: al });
    vText(`${TDONE.toFixed(1)} s · ready never below ${STATS.minReady}`, VL, 500 + dy, { size: 40, weight: 700, color: C.ready, alpha: al, max: VR - VL });
  }
  if (v >= VEND) vEndCard(v - VEND, { title: 'Rolling Update', line: `maxSurge ${SURGE} · maxUnavailable ${UNAVAIL} · ${R} pods, v1 → v2`,
    ink: C.paper, dim: 'rgba(236,232,224,0.72)', accent: C.v2, scrim: C.bgRGB, a: 0.86 });
  vReset();
}

window.__motion = {
  title: 'Rolling Update',
  description: `A Kubernetes rolling update of ${R} pods from v1 to v2 with maxSurge ${SURGE} and maxUnavailable ${UNAVAIL}: each new pod must pass its readiness probe before an old one is let go, so ready pods never drop below ${STATS.minReady}.`,
  fps: FPS, width: W, height: H, frames: FRAMES,
  poster: 250,
  gifStart: 4,
  seek(i) { draw(Math.max(0, Math.min(FRAMES - 1, Math.floor(i)))); },
  audio: () => renderAudio(TL, FRAMES, TL.end),
  variants: {
    vertical: {
      width: VW, height: VH, frames: VFR, canvas: vcv,
      poster: 200, gifStart: 3,
      seek(i) { vSeek(vDraw, i, VFR); },
      audio: () => renderAudio(TLV, VFR, VEND),
    },
  },
};

/* ==========================================================================
   PLAYER — identical in every piece; keep as is.
   Autoplays and loops, starts sound on the first click, ?frame=N pauses on a
   frame, ?variant=vertical plays the vertical cut (if the piece has one).
   When the renderer sets window.__MOTION_RENDER__ it stays out of the way.
   ========================================================================== */
(function player() {
  const btn = document.getElementById('sound'), q = new URLSearchParams(location.search);
  let M = window.__motion;
  const V = !window.__MOTION_RENDER__ && M.variants && M.variants[q.get('variant')];
  if (V) {                                                // show the variant's own canvas instead
    M = Object.assign({}, M, V);
    V.canvas.style.cssText = `width:min(100vw,calc(100vh*${V.width}/${V.height}));height:auto;aspect-ratio:${V.width}/${V.height}`;
    document.querySelector('canvas').replaceWith(V.canvas);
  }
  const dur = M.frames / M.fps;
  if (window.__MOTION_RENDER__) { btn.hidden = true; M.seek(0); return; }
  if (q.has('frame')) { btn.hidden = true; M.seek(+q.get('frame') || 0); return; }
  let t0 = performance.now(), ac = null, src = null, buf = null, paused = false, pausedAt = 0;
  const clock = () => ac && src ? (ac.currentTime - t0) : (performance.now() - t0) / 1000;
  function loop() {
    if (!paused) M.seek(Math.floor(((clock() % dur) + dur) % dur * M.fps));
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  btn.addEventListener('click', async () => {
    if (src) { src.stop(); src = null; btn.textContent = 'Click for sound'; t0 = performance.now(); return; }
    btn.textContent = 'Loading sound…';
    ac = ac || new AudioContext({ sampleRate: 48000 });
    buf = buf || await M.audio();
    await ac.resume();
    src = ac.createBufferSource(); src.buffer = buf; src.loop = true; src.connect(ac.destination);
    t0 = ac.currentTime + 0.05; src.start(t0);        // picture restarts from frame 0 in sync with the sound
    btn.textContent = 'Sound on — click to mute';
  });
  addEventListener('keydown', e => {
    if (e.code !== 'Space') return;
    e.preventDefault(); paused = !paused;
    if (ac) paused ? ac.suspend() : ac.resume();
    if (!ac) { if (paused) pausedAt = performance.now(); else t0 += performance.now() - pausedAt; }
  });
})();
</script>
