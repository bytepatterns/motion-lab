<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="teambytepatterns">
<meta name="description" content="Lloyd's relaxation on a Voronoi diagram: 150 clumped random dots, each owning the space nearest to it, move to the centre of their own cells again and again until every cell is about the same size.">
<title>Lloyd's Relaxation — motion-lab</title>
<style>
  /* Player chrome. The piece itself lives entirely in the canvas. */
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; font: 500 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; }
  canvas { display: block; width: min(100vw, calc(100vh * 16 / 9)); height: auto; aspect-ratio: 16 / 9; }
  #sound { position: fixed; left: 16px; bottom: 16px; padding: 8px 14px; border: 1px solid rgba(255,255,255,.35); border-radius: 999px;
           background: rgba(0,0,0,.55); color: #fff; font: inherit; cursor: pointer; }
  #sound[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080" aria-label="A mosaic of irregular cells around clumped dots, coloured by size; arrows point from each dot to the centre of its cell, the dots move there, and after a few dozen rounds the mosaic becomes an even honeycomb of one colour"></canvas>
<button id="sound" type="button">Click for sound</button>
<script>
'use strict';
/* ==========================================================================
   PIECE — Lloyd's Relaxation.
   A Voronoi diagram gives every dot the part of the plane that is closer to
   it than to any other dot. Lloyd's algorithm repeats one move: put every
   dot at the centroid (centre of area) of its own cell, then redraw the
   cells. Clumped dots spread out, big cells shrink, small cells grow, and
   the diagram settles into an even, honeycomb-like mesh.
   The cells are computed exactly: each one starts as the frame rectangle
   and is clipped by the perpendicular bisector to every other dot, nearest
   first, until no further dot can cut it. The centroid comes from the
   shoelace formula. All iterations are computed once; each frame blends the
   dots between two iterations and rebuilds the diagram from those
   positions, so seek(i) is pure in i.
   Cell colour is its area against the mean: warm when small, teal when
   about average, blue when large.
   ========================================================================== */
const W = 1920, H = 1080, FPS = 30;
const cv = document.getElementById('stage');
const ctx = cv.getContext('2d', { willReadFrequently: true });   // CPU raster: identical pixels on every redraw
const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
const MONO = 'ui-monospace, "Cascadia Code", Consolas, Menlo, monospace';

// ---- helpers -------------------------------------------------------------
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (f, a, b) => clamp((f - a) / (b - a));
const smooth = t => t * t * (3 - 2 * t);
const E = {
  inCubic: t => t * t * t,
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inOutCubic: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outExpo: t => t === 1 ? 1 : 1 - Math.pow(2, -10 * t),
  inExpo: t => t === 0 ? 0 : Math.pow(2, 10 * t - 10),
  inOutExpo: t => t === 0 ? 0 : t === 1 ? 1 : t < .5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2,
  outBack: t => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2),
};
/** Canvas text; `max` shrinks the size until the line fits. Returns the width drawn. */
function text(g, str, x, y, { size = 40, weight = 600, color = '#fff', alpha = 1, spacing = 0, align = 'left', fam = FONT, base = 'alphabetic', max = 0 } = {}) {
  if (alpha <= 0.002 || !str) return 0;
  g.font = `${weight} ${size}px ${fam}`; g.letterSpacing = spacing + 'px';
  if (max) { const w0 = g.measureText(str).width; if (w0 > max) { size *= max / w0; g.font = `${weight} ${size}px ${fam}`; } }
  g.textAlign = align; g.textBaseline = base;
  const a0 = g.globalAlpha; g.globalAlpha = a0 * alpha; g.fillStyle = color;
  g.fillText(str, x, y);
  const w = g.measureText(str).width;
  g.globalAlpha = a0; g.letterSpacing = '0px';
  return w;
}
const measure = (g, str, size, weight = 800, fam = FONT, spacing = 0) => { g.font = `${weight} ${size}px ${fam}`; g.letterSpacing = spacing + 'px'; const w = g.measureText(str).width; g.letterSpacing = '0px'; return w; };
const env = (f, a, b, fin = 12, fout = 10) => {
  const i = E.outCubic(prog(f, a, a + fin)), o = 1 - E.inCubic(prog(f, b - fout, b));
  return [Math.min(i, o), (1 - i) * 24 - (1 - o) * 10];
};

// ---- palette -------------------------------------------------------------
const C = {
  bg: '#0A0E13', bgRGB: '10,14,19', paper: '#EEF1EC', dim: 'rgba(238,241,236,0.62)', faint: 'rgba(238,241,236,0.16)',
  accent: '#7EE0D3', ring: '#FFD37A',
  // area / mean, on a log2 scale from -1.6 (small) to +1.6 (large)
  ramp: [[255, 107, 87], [245, 184, 61], [88, 196, 184], [111, 150, 255], [150, 110, 240]],
};
const rampAt = r => { const s = clamp((r + 1.6) / 3.2) * (C.ramp.length - 1), i = Math.min(C.ramp.length - 2, Math.floor(s)), t = s - i;
  return C.ramp[i].map((v, k) => Math.round(lerp(v, C.ramp[i + 1][k], t))); };

// ---- Voronoi by half-plane clipping, and Lloyd's iteration ---------------------------------
/** Keeps the part of polygon `poly` (flat [x,y,...]) closer to (ax,ay) than to (bx,by). */
function clip(poly, ax, ay, bx, by) {
  const nx = bx - ax, ny = by - ay, c = (bx * bx + by * by - ax * ax - ay * ay) / 2, out = [];
  const n = poly.length / 2;
  for (let i = 0; i < n; i++) {
    const px = poly[2 * i], py = poly[2 * i + 1], j = (i + 1) % n, qx = poly[2 * j], qy = poly[2 * j + 1];
    const dp = px * nx + py * ny - c, dq = qx * nx + qy * ny - c;
    if (dp <= 0) out.push(px, py);
    if ((dp < 0 && dq > 0) || (dp > 0 && dq < 0)) { const t = dp / (dp - dq); out.push(px + (qx - px) * t, py + (qy - py) * t); }
  }
  return out;
}
/** Every cell of the Voronoi diagram of n points P (flat) inside the box. */
function voronoi(P, n, box) {
  const cells = new Array(n), d2 = new Float64Array(n), idx = new Int32Array(n);
  for (let i = 0; i < n; i++) {
    const x = P[2 * i], y = P[2 * i + 1];
    for (let j = 0; j < n; j++) { const dx = P[2 * j] - x, dy = P[2 * j + 1] - y; d2[j] = dx * dx + dy * dy; idx[j] = j; }
    idx.sort((a, b) => d2[a] - d2[b]);
    let poly = [box.x0, box.y0, box.x1, box.y0, box.x1, box.y1, box.x0, box.y1];
    for (let q = 1; q < n; q++) {
      const j = idx[q];
      let r2 = 0; for (let k = 0; k < poly.length; k += 2) { const dx = poly[k] - x, dy = poly[k + 1] - y; r2 = Math.max(r2, dx * dx + dy * dy); }
      if (d2[j] > 4 * r2) break;                                   // no farther dot can cut this cell
      if (d2[j] < 1e-9) continue;
      poly = clip(poly, x, y, P[2 * j], P[2 * j + 1]);
    }
    cells[i] = poly;
  }
  return cells;
}
/** Area and centroid of a polygon (shoelace). */
function areaCentroid(poly) {
  let a = 0, cx = 0, cy = 0; const n = poly.length / 2;
  for (let i = 0; i < n; i++) {
    const j = (i + 1) % n, x0 = poly[2 * i], y0 = poly[2 * i + 1], x1 = poly[2 * j], y1 = poly[2 * j + 1], cr = x0 * y1 - x1 * y0;
    a += cr; cx += (x0 + x1) * cr; cy += (y0 + y1) * cr;
  }
  a /= 2; return a === 0 ? [0, poly[0], poly[1]] : [Math.abs(a), cx / (6 * a), cy / (6 * a)];
}
/** Spread of the cell areas: standard deviation / mean. */
function spreadOf(cells) {
  const A = cells.map(c => areaCentroid(c)[0]), m = A.reduce((s, v) => s + v, 0) / A.length;
  return Math.sqrt(A.reduce((s, v) => s + (v - m) * (v - m), 0) / A.length) / m;
}
/** Clumped random dots: some spread evenly, most packed into a few seeded clusters. */
function seedDots(G) {
  const r = mulberry32(G.seed), P = new Float64Array(G.n * 2), b = G.box, bw = b.x1 - b.x0, bh = b.y1 - b.y0;
  const gauss = () => Math.sqrt(-2 * Math.log(1 - r())) * Math.cos(2 * Math.PI * r());
  const K = G.clusters.map(([u, v, s]) => [b.x0 + u * bw, b.y0 + v * bh, s * Math.min(bw, bh)]);
  for (let i = 0; i < G.n; i++) {
    let x, y;
    if (i < G.n * 0.3) { x = b.x0 + r() * bw; y = b.y0 + r() * bh; }
    else { const [cx, cy, s] = K[i % K.length]; x = cx + gauss() * s; y = cy + gauss() * s; }
    P[2 * i] = clamp(x, b.x0 + 6, b.x1 - 6); P[2 * i + 1] = clamp(y, b.y0 + 6, b.y1 - 6);
  }
  return P;
}
const ITER = 100;
/** Runs Lloyd's algorithm ITER times from the seeded dots. */
function relax(G) {
  const runs = [seedDots(G)], spread = [], moved = [];
  for (let k = 0; k < ITER; k++) {
    const P = runs[k], cells = voronoi(P, G.n, G.box), Q = new Float64Array(P.length);
    let mv = 0, A = [];
    cells.forEach((c, i) => { const [a, cx, cy] = areaCentroid(c); A.push(a); Q[2 * i] = cx; Q[2 * i + 1] = cy; mv += Math.hypot(cx - P[2 * i], cy - P[2 * i + 1]); });
    const m = A.reduce((s, v) => s + v, 0) / A.length;
    spread.push(Math.sqrt(A.reduce((s, v) => s + (v - m) * (v - m), 0) / A.length) / m);
    moved.push(mv / G.n);
    runs.push(Q);
  }
  spread.push(spreadOf(voronoi(runs[ITER], G.n, G.box)));
  return { runs, spread, moved };
}
const cache = {};
const runOf = G => cache[G.key] || (cache[G.key] = relax(G));

// ---- timeline -------------------------------------------------------------------------------
function buildTL(o) {
  const TL = Object.assign({ step: 44 }, o);
  TL.caps = [
    [TL.cells - 4, TL.cent - 2, 'Every dot owns the space|closest to it.'],
    [TL.cent, TL.it2 + TL.step + 6, 'Move each dot to the centre|of its own cell.'],
    [TL.it2 + TL.step + 2, TL.runEnd, 'Then again, and again.|The cells even out.'],
  ];
  return TL;
}
/** Iterations done by frame f, as a float. The first two moves are slow and eased. */
function iterAt(TL, f) {
  if (f < TL.it1) return 0;
  if (f < TL.it2) return E.inOutCubic(prog(f, TL.it1, TL.it1 + TL.step));
  if (f < TL.run) return 1 + E.inOutCubic(prog(f, TL.it2, TL.it2 + TL.step));
  return 2 + (ITER - 2) * Math.pow(prog(f, TL.run, TL.runEnd), 1.6);
}
const arrowsAt = (TL, f) => Math.max(
  Math.min(E.outCubic(prog(f, TL.cent, TL.cent + 16)), 1 - E.inCubic(prog(f, TL.it1 + 6, TL.it1 + 20))),
  Math.min(E.outCubic(prog(f, TL.it1 + TL.step, TL.it1 + TL.step + 10)), 1 - E.inCubic(prog(f, TL.it2 + 6, TL.it2 + 20))));

// ---- drawing ------------------------------------------------------------------------------
function mesh(g, G, f) {
  const TL = G.TL, R = runOf(G), u = Math.min(ITER, iterAt(TL, f)), k = Math.min(ITER - 1, Math.floor(u)), t = u - k;
  const A = R.runs[k], B = R.runs[k + 1], P = new Float64Array(A.length);
  for (let i = 0; i < A.length; i++) P[i] = lerp(A[i], B[i], t);
  const cells = voronoi(P, G.n, G.box), info = cells.map(areaCentroid);
  const mean = info.reduce((s, v) => s + v[0], 0) / G.n;
  const grow = E.outCubic(prog(f, TL.cells - 30, TL.cells + 20));
  // fills, bucketed by colour
  const buckets = new Map();
  cells.forEach((c, i) => {
    const col = rampAt(Math.log2(Math.max(1e-6, info[i][0] / mean))).map(v => Math.round(v / 8) * 8).join(',');
    let p = buckets.get(col); if (!p) buckets.set(col, p = new Path2D());
    p.moveTo(c[0], c[1]); for (let q = 2; q < c.length; q += 2) p.lineTo(c[q], c[q + 1]); p.closePath();
  });
  g.save();
  // the tint is mixed with the background here, so the cells are filled opaque (cheaper than blending every pixel)
  const fa = 0.1 + 0.26 * grow, bg = C.bgRGB.split(',').map(Number);
  for (const [col, p] of buckets) { const c = col.split(',').map((v, q) => Math.round(lerp(bg[q], +v, fa))); g.fillStyle = `rgb(${c.join(',')})`; g.fill(p); }
  // edges
  const edges = new Path2D();
  for (const c of cells) { edges.moveTo(c[0], c[1]); for (let q = 2; q < c.length; q += 2) edges.lineTo(c[q], c[q + 1]); edges.closePath(); }
  g.globalAlpha = 0.22 + 0.4 * grow; g.strokeStyle = C.paper; g.lineWidth = G.lw; g.lineJoin = 'round'; g.stroke(edges);
  // dots
  g.globalAlpha = 1; g.fillStyle = C.paper;
  const dots = new Path2D();
  for (let i = 0; i < G.n; i++) { dots.moveTo(P[2 * i] + G.dot, P[2 * i + 1]); dots.arc(P[2 * i], P[2 * i + 1], G.dot, 0, Math.PI * 2); }
  g.fill(dots);
  // centroids and arrows while the first moves are explained
  const aa = arrowsAt(TL, f);
  if (aa > 0.01) {
    const arr = new Path2D(), rings = new Path2D();
    for (let i = 0; i < G.n; i++) {
      const x = P[2 * i], y = P[2 * i + 1], cx = info[i][1], cy = info[i][2], dx = cx - x, dy = cy - y, L = Math.hypot(dx, dy);
      rings.moveTo(cx + G.dot * 1.8, cy); rings.arc(cx, cy, G.dot * 1.8, 0, Math.PI * 2);
      if (L < G.dot * 3) continue;
      const ux = dx / L, uy = dy / L, ex = cx - ux * G.dot * 2.2, ey = cy - uy * G.dot * 2.2, h = Math.min(12, L * 0.35);
      arr.moveTo(x + ux * G.dot * 1.4, y + uy * G.dot * 1.4); arr.lineTo(ex, ey);
      arr.moveTo(ex - ux * h - uy * h * 0.55, ey - uy * h + ux * h * 0.55); arr.lineTo(ex, ey); arr.lineTo(ex - ux * h + uy * h * 0.55, ey - uy * h - ux * h * 0.55);
    }
    g.globalAlpha = aa; g.strokeStyle = C.ring; g.lineWidth = 2.2; g.lineCap = 'round'; g.stroke(arr);
    g.lineWidth = 2; g.stroke(rings);
  }
  g.restore();
  const spread = Math.sqrt(info.reduce((s, v) => s + (v[0] - mean) * (v[0] - mean), 0) / G.n) / mean;
  return { u, spread };
}
function caption(g, G, f) {
  for (const [t0, t1, str] of G.TL.caps) {
    const [a, dy] = env(f, t0, t1, 12, 10); if (a <= 0) continue;
    const [p1, p2] = str.split('|');
    if (G.capTwo) {
      text(g, p1, G.capX, G.capY + dy, { size: G.cap, weight: 850, color: C.paper, spacing: -1, alpha: a, max: G.capMax });
      text(g, p2, G.capX, G.capY + G.cap * 1.14 + dy, { size: G.cap, weight: 850, color: C.accent, spacing: -1, alpha: a, max: G.capMax });
    } else {
      const w1 = text(g, p1 + ' ', G.capX, G.capY + dy, { size: G.cap, weight: 850, color: C.paper, spacing: -1, alpha: a });
      text(g, p2, G.capX + w1, G.capY + dy, { size: G.cap, weight: 850, color: C.accent, spacing: -1, alpha: a });
    }

}
function plate(g, x, y, w, size, alpha) {
  g.save(); g.globalAlpha = alpha; g.fillStyle = `rgba(${C.bgRGB},0.8)`; g.fillRect(x - 16, y - size * 1.05, w + 32, size * 1.5); g.restore();
}
function readout(g, G, f, st) {
  const TL = G.TL, [a] = env(f, TL.cells - 6, TL.end + 10, 12, 12);
  if (a <= 0) return;
  const s1 = 'iteration ', s2 = String(Math.floor(st.u + 1e-6)), w1 = measure(g, s1, G.fo, 700, MONO), w2 = measure(g, s2, G.fo, 800, MONO);
  plate(g, G.foX, G.foY, w1 + w2, G.fo, a);
  text(g, s1, G.foX, G.foY, { size: G.fo, weight: 700, color: C.dim, fam: MONO, alpha: a });
  text(g, s2, G.foX + w1, G.foY, { size: G.fo, weight: 800, color: C.paper, fam: MONO, alpha: a });
  const r1 = 'cell sizes vary ', r2 = `±${Math.round(st.spread * 100)}%`, v1 = measure(g, r1, G.fo, 700, MONO), v2 = measure(g, r2, G.fo, 800, MONO);
  const x = G.pcAlign === 'right' ? G.pcX - v1 - v2 : G.pcX;
  const col = `rgb(${rampAt(-clamp(st.spread * 2.2, 0, 1.6)).join(',')})`;
  plate(g, x, G.pcY, v1 + v2, G.fo, a);
  text(g, r1, x, G.pcY, { size: G.fo, weight: 700, color: C.dim, fam: MONO, alpha: a });

function finale(g, G, f) {

  if (k1 <= 0) return;

  text(g, `±${Math.round(R.spread[0] * 100)}% down to ±${Math.round(R.spread[ITER] * 100)}%.`, G.fnX, G.fnY + G.fn * 1.1,
    { size: G.fn, weight: 900, color: C.accent, spacing: -2, align: G.fnAlign, alpha: k2 * out, max: G.fnMax });

function scene(g, G, f) {
  const st = mesh(g, G, f);
  for (const [y0, y1] of G.scrims) {
    const gr = g.createLinearGradient(0, y0, 0, y1);
    gr.addColorStop(0, `rgba(${C.bgRGB},0.9)`); gr.addColorStop(1, `rgba(${C.bgRGB},0)`);

// ---- landscape picture ------------------------------------------------------------------
const TLL = buildTL({ cells: 56, cent: 140, it1: 206, it2: 280, run: 350, runEnd: 640, calm: 650, end: 720 });
const FRAMES = TLL.end + 72;
const GL = { key: 'L', TL: TLL, w: W, h: H, n: 150, seed: 0x39A1, box: { x0: 0, y0: 0, x1: W, y1: H }, lw: 2, dot: 4.5,
  clusters: [[0.3, 0.42, 0.07], [0.62, 0.62, 0.05], [0.8, 0.35, 0.06], [0.45, 0.72, 0.04]],
  scrims: [[0, 300], [H, 930]],
  capX: 120, capY: 216, cap: 52, capTwo: false, capMax: 1680,
  fo: 30, foX: 120, foY: 1004, pcX: 1800, pcY: 1004, pcAlign: 'right',
  fn: 96, fnX: W / 2, fnY: 520, fnAlign: 'center', fnMax: 1680 };
function hookL(f) {
  const o = 1 - E.inCubic(prog(f, TLL.cells - 12, TLL.cells + 4));
  if (o <= 0) return;
  const k = E.outExpo(prog(f, -8, 10)), k2 = E.outBack(prog(f, -6, 12));
  ctx.save(); ctx.fillStyle = `rgba(${C.bgRGB},${0.72 * o})`; ctx.fillRect(0, 400, W, 330); ctx.restore();
  text(ctx, 'Random dots, unfair cells.', W / 2, 540 + (1 - k) * 30, { size: 108, weight: 900, color: C.paper, spacing: -3, align: 'center', alpha: o * Math.max(0.3, k) });
  text(ctx, 'Watch them even out.', W / 2, 670 + (1 - clamp(k2)) * 30, { size: 108, weight: 900, color: C.accent, spacing: -3, align: 'center', alpha: o * Math.max(0.3, clamp(k2)) });
}
function draw(f) {
  if (ctx.reset) ctx.reset();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none'; ctx.shadowBlur = 0;
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  const T = TLL, endK = E.inOutCubic(prog(f, T.end, T.end + 20)), a = 1 - endK;
  scene(ctx, GL, f);
  text(ctx, 'GEOMETRY  ·  VORONOI + LLOYD', 120, 104, { size: 26, weight: 600, color: C.dim, spacing: 5, alpha: a });
  text(ctx, 'BYTEPATTERNS', 1800, 104, { size: 26, weight: 600, color: C.dim, spacing: 5, align: 'right', alpha: a });
  hookL(f);
  if (endK > 0) {
    ctx.fillStyle = `rgba(${C.bgRGB},${0.86 * endK})`; ctx.fillRect(0, 0, W, H);
    const k1 = E.outCubic(prog(f, T.end + 6, T.end + 28)), k2 = E.outCubic(prog(f, T.end + 16, T.end + 38)), k3 = E.outCubic(prog(f, T.end + 26, T.end + 48));
    text(ctx, 'Lloyd’s Relaxation', W / 2, 500 + (1 - k1) * 30, { size: 140, weight: 850, color: C.paper, spacing: -3, align: 'center', alpha: k1 });
    text(ctx, `${GL.n} dots  ·  ${ITER} iterations  ·  every dot to the centre of its cell`, W / 2, 580 + (1 - k2) * 20, { size: 42, weight: 500, color: C.accent, align: 'center', alpha: k2 });
    text(ctx, 'drawn in code  ·  bytepatterns.com', W / 2, 1000, { size: 32, weight: 600, color: C.paper, spacing: 3, align: 'center', alpha: k3 * 0.8 });
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.letterSpacing = '0px';
}

// ---- sound: a glass pluck per iteration, loud while the dots still travel far, settling onto one chord ----
async function renderAudio(TL = TLL, frames = FRAMES, G = GL) {
  const SR = 48000, dur = frames / FPS, LEN = Math.round(SR * dur);
  const ac = new OfflineAudioContext(2, LEN, SR);
  const at = fr => fr / FPS;
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -16; comp.ratio.value = 3; comp.attack.value = 0.005; comp.release.value = 0.25;
  const master = ac.createGain(); master.gain.value = 0.9; master.connect(comp).connect(ac.destination);
  master.gain.setValueAtTime(0.9, dur - 1.0); master.gain.linearRampToValueAtTime(0.0001, dur - 0.02);
  const rnd = mulberry32(0x39B7);
  const ir = ac.createBuffer(2, SR * 2.6, SR);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let k = 0; k < d.length; k++) d[k] = (rnd() * 2 - 1) * Math.pow(1 - k / d.length, 2.6); }
  const verb = ac.createConvolver(); verb.buffer = ir; const vg = ac.createGain(); vg.gain.value = 0.38; verb.connect(vg).connect(master);
  const noise = ac.createBuffer(1, SR * 2, SR); { const d = noise.getChannelData(0); for (let k = 0; k < d.length; k++) d[k] = rnd() * 2 - 1; }
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  const bell = (t0, m, amp, pn, len = 1.6) => { for (const [r2, a2, d2] of [[1, 1, len], [2.76, 0.25, len * 0.4], [5.4, 0.07, len * 0.15]]) {
    const o = ac.createOscillator(); o.frequency.value = hz(m) * r2; const g = ac.createGain(), p = ac.createStereoPanner();
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(amp * a2, t0 + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d2);
    p.pan.value = pn; o.connect(g).connect(p); p.connect(master); p.connect(verb); o.start(t0); o.stop(t0 + d2 + 0.05); } };
  // pad: starts as a cluster, resolves to a major chord as the cells even out
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 1.5; lp.connect(master); lp.connect(verb);
  lp.frequency.setValueAtTime(500, 0); lp.frequency.exponentialRampToValueAtTime(1800, at(TL.runEnd)); lp.frequency.exponentialRampToValueAtTime(700, at(TL.end + 60));
  const chord = (t0, t1, notes, amp) => notes.forEach((m, i) => { for (const det of [-6, 6]) {
    const o = ac.createOscillator(), g = ac.createGain(), p = ac.createStereoPanner(); o.type = 'sawtooth'; o.frequency.value = hz(m); o.detune.value = det;
    p.pan.value = (i / (notes.length - 1) - 0.5) * 0.8 * Math.sign(det);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(amp, t0 + 1.0); g.gain.setValueAtTime(amp, t1 - 0.6); g.gain.exponentialRampToValueAtTime(0.0001, t1 + 0.5);
    o.connect(g).connect(p).connect(lp); o.start(t0); o.stop(t1 + 0.55); } });
  chord(0, at(TL.it2 + 40), [50, 56, 61, 63], 0.016);
  chord(at(TL.it2 + 20), at(TL.runEnd), [50, 57, 59, 64], 0.016);
  chord(at(TL.runEnd - 20), dur, [50, 57, 62, 66, 69], 0.017);
  // the two slow moves: a breath of filtered noise
  for (const f0 of [TL.it1, TL.it2]) {
    const s = ac.createBufferSource(); s.buffer = noise; s.loop = true; const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.4;
    bp.frequency.setValueAtTime(500, at(f0)); bp.frequency.exponentialRampToValueAtTime(2400, at(f0 + TL.step * 0.6)); bp.frequency.exponentialRampToValueAtTime(900, at(f0 + TL.step));
    const g = ac.createGain(); g.gain.setValueAtTime(0.0001, at(f0)); g.gain.exponentialRampToValueAtTime(0.06, at(f0 + TL.step * 0.5)); g.gain.exponentialRampToValueAtTime(0.0001, at(f0 + TL.step + 6));
    s.connect(bp).connect(g).connect(master); s.start(at(f0)); s.stop(at(f0 + TL.step + 8));
  }
  // one pluck per iteration, at the frame the dots arrive; loudness follows how far they moved
  const R = runOf(G), PENTA = [0, 2, 4, 7, 9], mv0 = R.moved[0];
  let last = 0, lastFr = -9;
  for (let fr = TL.it1; fr <= TL.runEnd + 1; fr++) {
    const k = Math.floor(iterAt(TL, fr) + 1e-9);
    if (k <= last) continue;
    last = k;
    if (fr - lastFr < 3) continue;
    lastFr = fr;
    const amp = 0.025 + 0.07 * Math.sqrt(R.moved[k - 1] / mv0), m = 62 + 12 * Math.floor((k - 1) / 8) % 24 + PENTA[(k - 1) % 5];
    bell(at(fr), Math.min(93, m), amp, ((k * 0.37) % 1 - 0.5) * 1.2, 1.2);
  }
  [62, 66, 69, 74].forEach((m, i) => bell(at(TL.calm) + i * 0.09, m, 0.06, -0.3 + i * 0.2));
  [69, 74, 78, 81].forEach((m, i) => bell(at(TL.end + 10 + i * 6), m, 0.06, -0.45 + i * 0.3));
  const buf = await ac.startRendering();
  let peak = 0; for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let k = 0; k < d.length; k++) peak = Math.max(peak, Math.abs(d[k])); }
  const norm = 0.85 / Math.max(peak, 1e-6);                          // every piece peaks at the same level
  for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let k = 0; k < d.length; k++) d[k] *= norm; }
  return buf;
}

/* ==========================================================================
   VERTICAL CUT — shared block, identical in every piece.
   1080x1920 for Reels, Shorts and TikTok (__motion.variants.vertical). The
   piece's own scene code is re-used and recomposed for a phone: everything a
   viewer must read stays inside the area no platform covers (x 60..900,
   y 230..1400); outside it there is only dimmed texture.
   ========================================================================== */
const VW = 1080, VH = 1920, SAFE = { x: 60, y: 230, w: 840, h: 1170, r: 900, b: 1400 };
const vcv = document.createElement('canvas'); vcv.width = VW; vcv.height = VH;
const vx = vcv.getContext('2d', { willReadFrequently: true });   // CPU raster: identical pixels on every redraw
const VL = 96, VR = 864;                                          // text column inside the safe area

function vReset() {
  vx.setTransform(1, 0, 0, 1, 0, 0); vx.globalAlpha = 1; vx.globalCompositeOperation = 'source-over';
  vx.filter = 'none'; vx.shadowBlur = 0; vx.shadowColor = 'transparent'; vx.letterSpacing = '0px'; vx.setLineDash([]);
  vx.textAlign = 'left'; vx.textBaseline = 'alphabetic'; vx.lineCap = 'butt'; vx.lineJoin = 'miter';
}
/** Canvas text on the vertical frame; `max` shrinks the size until the line fits. */
function vText(str, x, y, { size = 40, weight = 700, color = '#FFFFFF', align = 'left', spacing = 0, alpha = 1, fam = FONT, max = 0 } = {}) {
  if (alpha <= 0.002 || !str) return size;
  vx.font = `${weight} ${size}px ${fam}`; vx.letterSpacing = spacing + 'px';
  if (max) { const w = vx.measureText(str).width; if (w > max) { size = size * max / w; vx.font = `${weight} ${size}px ${fam}`; } }
  vx.textAlign = align; vx.textBaseline = 'alphabetic';
  const a0 = vx.globalAlpha; vx.globalAlpha = a0 * alpha; vx.fillStyle = color;
  vx.fillText(str, x + (align === 'center' ? spacing / 2 : align === 'right' ? spacing : 0), y);   // tracking is added after the last glyph too
  vx.globalAlpha = a0; vx.letterSpacing = '0px';
  return size;
}
/** Word-wraps with the given font; returns the lines. */
function vWrap(str, maxW, size, weight = 700, fam = FONT) {
  vx.font = `${weight} ${size}px ${fam}`; vx.letterSpacing = '0px';
  const words = str.split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (vx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur);
  return lines;
}
/** Fade envelope with a small rise: [alpha, dy]. */
function vEnv(v, a, b, fin = 8, fout = 8) {
  const i = E.outCubic(prog(v, a, a + fin)), o = 1 - E.inCubic(prog(v, b - fout, b));
  return [Math.min(i, o), (1 - i) * 22 - (1 - o) * 10];
}
/** Which segment of a cut list a vertical frame is in: segs = [{ at, src, len }] in frames. */
function vSeg(segs, v) {
  let k = 0; while (k < segs.length - 1 && v >= segs[k + 1].at) k++;
  const s = segs[k];
  return { k, s, local: v - s.at, src: s.src + (v - s.at) };
}
/** Dims everything outside the safe area to a quiet texture (brightness x 0.2), with a soft inner edge. */
function vShade(rgb, a = 0.8, feather = 40) {
  vx.save(); vx.setTransform(1, 0, 0, 1, 0, 0); vx.globalAlpha = 1; vx.globalCompositeOperation = 'source-over';
  vx.fillStyle = `rgba(${rgb},${a})`;
  vx.beginPath(); vx.rect(0, 0, VW, VH); vx.rect(SAFE.x, SAFE.y, SAFE.w, SAFE.h); vx.fill('evenodd');
  const strip = (x0, y0, x1, y1, rx, ry, rw, rh) => {
    const g = vx.createLinearGradient(x0, y0, x1, y1);
    g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`);
    vx.fillStyle = g; vx.fillRect(rx, ry, rw, rh);
  };
  strip(SAFE.x, 0, SAFE.x + feather, 0, SAFE.x, SAFE.y, feather, SAFE.h);
  strip(SAFE.r, 0, SAFE.r - feather, 0, SAFE.r - feather, SAFE.y, feather, SAFE.h);
  strip(0, SAFE.y, 0, SAFE.y + feather, SAFE.x, SAFE.y, SAFE.w, feather);
  strip(0, SAFE.b, 0, SAFE.b - feather, SAFE.x, SAFE.b - feather, SAFE.w, feather);
  vx.restore();
}
/** Series tag at the top of the safe area, e.g. MADE IN CODE · 04. */
function vTag(label, color, alpha = 1) {
  vText('MADE IN CODE', VL, 292, { size: 28, weight: 800, color, spacing: 5, alpha });
  vx.font = `800 28px ${FONT}`; vx.letterSpacing = '5px';
  const w = vx.measureText('MADE IN CODE').width; vx.letterSpacing = '0px';
  vText('·  ' + label, VL + w + 14, 292, { size: 28, weight: 600, color: 'rgba(255,255,255,0.72)', spacing: 3, alpha, max: VR - VL - w - 14 });
}
/** Big hook lines, left-aligned from y0; visible from frame 0, settles in a few frames. */
function vHook(v, lines, y0, { size = 84, lh = 1.08, color = '#FFFFFF', accent = null, weight = 800, spacing = -1.5, alpha = 1 } = {}) {
  const k = E.outExpo(prog(v, -6, 12));
  lines.forEach((ln, i) => {
    const kk = E.outExpo(prog(v, -12 + i * 2, 8 + i * 2));
    vText(ln, VL, y0 + i * size * lh + (1 - kk) * 30, { size, weight, spacing, color: accent && i === lines.length - 1 ? accent : color, alpha: alpha * Math.max(0.25, kk), max: VR - VL });
  });
  return k;
}
/** Closing card, the last 60 frames: piece title, "drawn in code · bytepatterns.com". l = frames into the card. */
function vEndCard(l, { title, line = '', ink = '#FFFFFF', dim = 'rgba(255,255,255,0.66)', accent = '#FFFFFF', scrim = '0,0,0', a = 0.84 }) {
  const k = E.outCubic(prog(l, 0, 12));
  vx.save(); vx.setTransform(1, 0, 0, 1, 0, 0);
  vx.fillStyle = `rgba(${scrim},${a * k})`; vx.fillRect(0, 0, VW, VH);
  vx.restore();
  const t1 = E.outExpo(prog(l, 3, 19)), t2 = E.outExpo(prog(l, 11, 27)), t3 = E.outExpo(prog(l, 19, 35));
  vx.fillStyle = accent; vx.globalAlpha = t1; vx.fillRect(VL, 742, 88 * t1, 7); vx.globalAlpha = 1;
  const size = vText(title, VL, 850 + (1 - t1) * 40, { size: 92, weight: 800, color: ink, spacing: -2, alpha: t1, max: VR - VL });
  const y2 = 850 + Math.max(size, 60) * 0.25 + 70;
  vx.font = `600 44px ${FONT}`;
  const lead = 'drawn in code  ·  ', lw = vx.measureText(lead).width;
  vText(lead, VL, y2 + (1 - t2) * 24, { size: 44, weight: 600, color: dim, alpha: t2 });
  vText('bytepatterns.com', VL + lw, y2 + (1 - t2) * 24, { size: 44, weight: 800, color: accent, alpha: t2 });
  if (line) vText(line, VL, y2 + 72 + (1 - t3) * 18, { size: 32, weight: 500, color: dim, alpha: t3, max: VR - VL });
}
/** Seeks a cut. The first frame a page draws is drawn twice: the very first read of a
 *  GPU-backed source canvas can come out a shade different from every later one. */
let vWarm = false;
function vSeek(draw, i, frames) {
  const f = Math.max(0, Math.min(frames - 1, Math.floor(i)));
  if (!vWarm) { vWarm = true; draw(f); }
  draw(f);
}
/** The soundtrack of a cut: the piece's own audio() spliced to the same segments as the picture. */
async function vAudio(segs, frames, { xf = 0.025, fadeOut = 0.6, extra = null } = {}) {
  const src = await renderAudio();
  const SR = 48000, dur = frames / FPS, ac = new OfflineAudioContext(2, Math.round(SR * dur), SR);
  const out = ac.createGain(); out.connect(ac.destination);
  out.gain.setValueAtTime(1, 0); out.gain.setValueAtTime(1, dur - fadeOut); out.gain.linearRampToValueAtTime(0, dur - 0.01);
  segs.forEach((s, k) => {
    const at = s.at / FPS, off = s.src / FPS, d = s.len / FPS;
    const pre = k === 0 ? 0 : Math.min(xf, off), post = k === segs.length - 1 ? 0 : xf;
    const b = ac.createBufferSource(), g = ac.createGain(); b.buffer = src;
    g.gain.setValueAtTime(pre ? 0 : 1, at - pre);
    if (pre) g.gain.linearRampToValueAtTime(1, at + pre);
    if (post) { g.gain.setValueAtTime(1, at + d - post); g.gain.linearRampToValueAtTime(0, at + d + post); }
    b.connect(g).connect(out); b.start(at - pre, off - pre, d + pre + post);
  });
  if (extra) extra(ac, out);
  const buf = await ac.startRendering();
  let peak = 0; for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) peak = Math.max(peak, Math.abs(d[i])); }
  if (peak > 0.9) for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] *= 0.9 / peak; }
  return buf;
}
/** A soft three-partial bell, for the closing card. */
function vChime(ac, dest, at, freq, vol = 0.08) {
  for (const [mul, v, dec] of [[1, 1, 1.8], [2.01, 0.35, 0.8], [3.02, 0.12, 0.4]]) {
    const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.value = freq * mul;
    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol * v, at + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, at + dec);
    o.connect(g).connect(dest); o.start(at); o.stop(at + dec + 0.05);
  }
}

/* VERTICAL CUT — this piece */
// Its own 110 dots in a tall box around the safe area (clumped the same way),
// on a shorter clock; type sits inside the safe area, the shade dims the rest.
const TLV = buildTL({ cells: 40, cent: 100, it1: 150, it2: 214, run: 276, runEnd: 470, calm: 474, end: 520, step: 40 });
const VFR = TLV.end + 60, VEND = VFR - 60;
const GV = { key: 'V', TL: TLV, w: VW, h: VH, n: 110, seed: 0x39B2, box: { x0: 40, y0: 210, x1: 920, y1: 1420 }, lw: 2, dot: 4.5,
  clusters: [[0.32, 0.36, 0.07], [0.62, 0.55, 0.05], [0.45, 0.66, 0.06], [0.7, 0.3, 0.04]],
  scrims: [[230, 520], [1420, 1230]],
  capX: VL, capY: 380, cap: 50, capTwo: true, capMax: VR - VL,
  fo: 30, foX: VL, foY: 1300, pcX: VL, pcY: 1360, pcAlign: 'left',
  fn: 80, fnX: VL, fnY: 800, fnAlign: 'left', fnMax: VR - VL };
function hookV(v) {
  const o = 1 - E.inCubic(prog(v, TLV.cells - 10, TLV.cells + 4));
  if (o <= 0) return;
  vx.save(); vx.fillStyle = `rgba(${C.bgRGB},${0.72 * o})`; vx.fillRect(SAFE.x, 400, SAFE.w, 560); vx.restore();
  vHook(v, ['Random dots,', 'unfair cells.', 'Watch them', 'even out.'], 500, { size: 104, accent: C.accent, color: C.paper, weight: 900, spacing: -2, alpha: o });
}
function vDraw(v) {
  if (vx.reset) vx.reset();
  vReset();
  vx.fillStyle = C.bg; vx.fillRect(0, 0, VW, VH);
  scene(vx, GV, v);
  hookV(v);
  vReset();
  vShade(C.bgRGB, 0.86);
  vTag('LLOYD’S RELAXATION', C.accent);
  if (v >= VEND) vEndCard(v - VEND, { title: 'Lloyd’s Relaxation', line: `${GV.n} dots  ·  ${ITER} iterations  ·  Voronoi cells`,
    ink: C.paper, dim: 'rgba(238,241,236,0.72)', accent: C.accent, scrim: C.bgRGB, a: 0.88 });
  vReset();
}

// The player asks for a frame on every display refresh; at 30 fps on a 60 Hz screen every other call
// asks for the frame already on the canvas, which is then left as it is (same frame, same pixels).
const shown = { L: -1, V: -1 };
window.__motion = {
  title: "Lloyd's Relaxation",
  description: `Generative geometry: ${GL.n} clumped random dots own the Voronoi cells around them; ${ITER} times over, every dot moves to the centroid of its own cell and the cells are rebuilt, until the cell sizes, which varied by ±${Math.round(runOf(GL).spread[0] * 100)}%, vary by only ±${Math.round(runOf(GL).spread[ITER] * 100)}%. Each cell is clipped exactly from the frame by its neighbours' bisectors.`,
  fps: FPS, width: W, height: H, frames: FRAMES,
  poster: TLL.run + 60,
  gifStart: Math.floor((TLL.it2 - 10) / FPS),
  seek(i) { const f = Math.max(0, Math.min(FRAMES - 1, Math.floor(i))); if (f !== shown.L) { shown.L = f; draw(f); } },
  audio: () => renderAudio(TLL, FRAMES, GL),
  variants: {
    vertical: {
      width: VW, height: VH, frames: VFR, canvas: vcv,
      poster: TLV.run + 40, gifStart: Math.floor((TLV.it2 - 10) / FPS),
      seek(i) { const v = Math.max(0, Math.min(VFR - 1, Math.floor(i))); if (v !== shown.V) { shown.V = v; vSeek(vDraw, v, VFR); } },
      audio: () => renderAudio(TLV, VFR, GV),
    },
  },
};

/* ==========================================================================
   PLAYER — identical in every piece; keep as is.
   Autoplays and loops, starts sound on the first click, ?frame=N pauses on a
   frame, ?variant=vertical plays the vertical cut (if the piece has one).
   When the renderer sets window.__MOTION_RENDER__ it stays out of the way.
   ========================================================================== */
(function player() {
  const btn = document.getElementById('sound'), q = new URLSearchParams(location.search);
  let M = window.__motion;
  const V = !window.__MOTION_RENDER__ && M.variants && M.variants[q.get('variant')];
  if (V) {                                                // show the variant's own canvas instead
    M = Object.assign({}, M, V);
    V.canvas.style.cssText = `width:min(100vw,calc(100vh*${V.width}/${V.height}));height:auto;aspect-ratio:${V.width}/${V.height}`;
    document.querySelector('canvas').replaceWith(V.canvas);
  }
  const dur = M.frames / M.fps;
  if (window.__MOTION_RENDER__) { btn.hidden = true; M.seek(0); return; }
  if (q.has('frame')) { btn.hidden = true; M.seek(+q.get('frame') || 0); return; }
  let t0 = performance.now(), ac = null, src = null, buf = null, paused = false, pausedAt = 0;
  const clock = () => ac && src ? (ac.currentTime - t0) : (performance.now() - t0) / 1000;
  function loop() {
    if (!paused) M.seek(Math.floor(((clock() % dur) + dur) % dur * M.fps));
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  btn.addEventListener('click', async () => {
    if (src) { src.stop(); src = null; btn.textContent = 'Click for sound'; t0 = performance.now(); return; }
    btn.textContent = 'Loading sound…';
    ac = ac || new AudioContext({ sampleRate: 48000 });
    buf = buf || await M.audio();
    await ac.resume();
    src = ac.createBufferSource(); src.buffer = buf; src.loop = true; src.connect(ac.destination);
    t0 = ac.currentTime + 0.05; src.start(t0);        // picture restarts from frame 0 in sync with the sound
    btn.textContent = 'Sound on — click to mute';
  });
  addEventListener('keydown', e => {
    if (e.code !== 'Space') return;
    e.preventDefault(); paused = !paused;
    if (ac) paused ? ac.suspend() : ac.resume();
    if (!ac) { if (paused) pausedAt = performance.now(); else t0 += performance.now() - pausedAt; }
  });
})();
</script>
