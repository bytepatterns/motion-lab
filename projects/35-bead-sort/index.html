<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="teambytepatterns">
<meta name="description" content="Bead sort: every number is a row of beads on an abacus; let go, every bead falls down its own rod under gravity and bounces, and the rows read out sorted without a single comparison.">
<title>Gravity Sort — motion-lab</title>
<style>
  /* Player chrome. The piece itself lives entirely in the canvas. */
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; font: 500 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; }
  canvas { display: block; width: min(100vw, calc(100vh * 16 / 9)); height: auto; aspect-ratio: 16 / 9; }
  #sound { position: fixed; left: 16px; bottom: 16px; padding: 8px 14px; border: 1px solid rgba(255,255,255,.35); border-radius: 999px;
           background: rgba(0,0,0,.55); color: #fff; font: inherit; cursor: pointer; }
  #sound[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080" aria-label="An abacus with vertical rods: each row of beads is one number; the beads are let go, fall down their rods and bounce, and the rows now read from shortest to longest"></canvas>
<button id="sound" type="button">Click for sound</button>
<script>
'use strict';
/* ==========================================================================
   PIECE — Gravity Sort (bead sort).
   Each number n is a row of n beads on vertical rods, pushed to the left.
   Let go, and every bead slides down its own rod as far as it can. Column
   c then holds one bead for every number bigger than c, stacked at the
   bottom, so row k from the bottom holds as many beads as the k-th biggest
   number: the rows, read top to bottom, are sorted. Nothing is compared.
   The fall is closed-form physics: from rest, y = g t^2 / 2 until the bead
   reaches its resting place, then bounces with restitution 0.3 (each hop a
   parabola, 4 hops); a bead never passes the one below it on its rod.
   Two runs: 8 seeded numbers from 1 to 9, then 14 from 1 to 12, both let go
   in one drop. Every position is a function of the frame number and of the
   rows computed at load, so seek(i) is pure in i.
   ========================================================================== */
const W = 1920, H = 1080, FPS = 30;
const cv = document.getElementById('stage');
const ctx = cv.getContext('2d', { willReadFrequently: true });   // CPU raster: identical pixels on every redraw
const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
const MONO = 'ui-monospace, "Cascadia Code", Consolas, Menlo, monospace';

// ---- helpers -------------------------------------------------------------
// ---- helpers -------------------------------------------------------------
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (f, a, b) => clamp((f - a) / (b - a));
const smooth = t => t * t * (3 - 2 * t);
const E = {
  inCubic: t => t * t * t,
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inOutCubic: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outExpo: t => t === 1 ? 1 : 1 - Math.pow(2, -10 * t),
  inExpo: t => t === 0 ? 0 : Math.pow(2, 10 * t - 10),
  inOutExpo: t => t === 0 ? 0 : t === 1 ? 1 : t < .5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2,
  outBack: t => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2),
};
/** Canvas text; `max` shrinks the size until the line fits. Returns the width drawn. */
function text(g, str, x, y, { size = 40, weight = 600, color = '#fff', alpha = 1, spacing = 0, align = 'left', fam = FONT, base = 'alphabetic', max = 0 } = {}) {
  if (alpha <= 0.002 || !str) return 0;
  g.font = `${weight} ${size}px ${fam}`; g.letterSpacing = spacing + 'px';
  if (max) { const w0 = g.measureText(str).width; if (w0 > max) { size *= max / w0; g.font = `${weight} ${size}px ${fam}`; } }
  g.textAlign = align; g.textBaseline = base;
  const a0 = g.globalAlpha; g.globalAlpha = a0 * alpha; g.fillStyle = color;
  g.fillText(str, x, y);
  const w = g.measureText(str).width;
  g.globalAlpha = a0; g.letterSpacing = '0px';
  return w;
}
const measure = (g, str, size, weight = 800, fam = FONT, spacing = 0) => { g.font = `${weight} ${size}px ${fam}`; g.letterSpacing = spacing + 'px'; const w = g.measureText(str).width; g.letterSpacing = '0px'; return w; };
const env = (f, a, b, fin = 12, fout = 10) => {
  const i = E.outCubic(prog(f, a, a + fin)), o = 1 - E.inCubic(prog(f, b - fout, b));
  return [Math.min(i, o), (1 - i) * 24 - (1 - o) * 10];
};

// ---- palette -------------------------------------------------------------
const C = {
  bg: '#14110E', bgRGB: '20,17,14', paper: '#F6EFE6', dim: 'rgba(246,239,230,0.62)', faint: 'rgba(246,239,230,0.14)',
  frame: '#2A231C', rod: 'rgba(246,239,230,0.20)',
  beadA: [255, 196, 92], beadB: [255, 112, 84],             // left columns warm gold, right columns coral
  sorted: '#7FE3B0', accent: '#FFC45C',
};

// ---- the model: two runs of bead sort, computed at load --------------------------------------------
const G_PX = 3600;                                           // gravity in px/s^2 at a rod pitch of 76 px (scaled with the pitch)
const REST = 0.3, HOPS = 4;
function makeRun(n, max, r) {
  const vals = Array.from({ length: n }, () => 1 + Math.floor(r() * max));
  const beads = [];
  for (let c = 0; c < max; c++) {
    const rows = []; for (let k = 0; k < n; k++) if (vals[k] > c) rows.push(k);
    rows.forEach((r0, j) => beads.push({ c, r0, r1: n - rows.length + j }));   // j-th from the top lands j-th from the top of the stack
  }
  const out = Array.from({ length: n }, (_, k) => beads.filter(b => b.r1 === k).length);
  return { n, max, vals, beads, out, sum: vals.reduce((a, b) => a + b, 0), drop: Math.max(...beads.map(b => b.r1 - b.r0)) };
}
const RNG = mulberry32(0x3554);
const RUNS = [makeRun(8, 9, RNG), makeRun(14, 12, RNG)];
// the result really is sorted, and nothing was compared to get it
RUNS.forEach(R => { R.ok = R.out.every((v, k) => k === 0 || R.out[k - 1] <= v) && R.out.join() === R.vals.slice().sort((a, b) => a - b).join(); });
/** Fall distance (in rows) covered after t seconds, with bounces; g in rows/s^2. */
function fallRows(d, t, g) {
  if (d <= 0 || t <= 0) return 0;
  const th = Math.sqrt(2 * d / g);
  if (t < th) return 0.5 * g * t * t;
  let v = g * th * REST, tt = t - th;
  for (let k = 0; k < HOPS; k++) { const tb = 2 * v / g; if (tt < tb) return d - (v * tt - 0.5 * g * tt * tt); tt -= tb; v *= REST; }
  return d;
}
const fallTime = (d, g) => Math.sqrt(2 * d / g);
/** Seconds until every bead of a run is at rest: the fall plus its HOPS bounces. */
const settleTime = R => { const th = fallTime(R.drop, G_PX / 76); let s = th, v = G_PX / 76 * th * REST; for (let k = 0; k < HOPS; k++) { s += 2 * v / (G_PX / 76); v *= REST; } return s; };

// ---- timeline (frames) ------------------------------------------------------------------------
function buildTL(o) {
  const TL = { o, acts: [] };
  let t = o.start;
  RUNS.forEach((R, a) => {
    const A = { R, build: t, rowStep: o.rowStep[a] };
    A.built = t + (R.n - 1) * A.rowStep + o.slide;
    A.release = A.built + o.wait[a];
    A.settle = A.release + Math.ceil(settleTime(R) * FPS) + 3;   // the last hop of the longest fall
    A.read = A.settle + 4;
    A.readStep = o.readStep[a];
    A.readEnd = A.read + R.n * A.readStep + 6;
    A.out = A.readEnd + o.hold[a];                           // the trapdoor opens (act 1) or the summary starts (act 2)
    TL.acts.push(A);
    t = A.out + o.gapAfter;
  });
  TL.sum = TL.acts[1].out;
  TL.end = TL.sum + o.sumLen;
  const A1 = TL.acts[0], A2 = TL.acts[1];
  TL.caps = [
    [A1.build - 4, A1.release - 2, 'Each number is|a row of beads.'],
    [A1.release - 4, A1.read + 2, 'Let go.|Every bead falls down its rod.'],
    [A1.read - 2, A1.out + 6, 'Read the rows:|sorted. Nothing compared.'],
    [A2.build - 4, A2.read + 2, `${RUNS[1].n} numbers.|Still one drop.`],
    [A2.read - 2, TL.sum + 4, 'Rows again:|sorted.'],
  ];
  return TL;
}
const TLL = buildTL({ start: 60, rowStep: [9, 3], slide: 14, wait: [22, 12], readStep: [8, 3], hold: [34, 20], gapAfter: 22, sumLen: 110 });
const FRAMES = TLL.end + 72;

// ---- drawing ------------------------------------------------------------------------------
function geo(G, a) {
  const R = RUNS[a], p = G.pitch[a];
  const x0 = G.cx - (R.max - 1) / 2 * p, y0 = G.cy - (R.n - 1) / 2 * p;
  return { R, p, x0, y0, colX: c => x0 + c * p, rowY: k => y0 + k * p, g: G_PX / 76 };   // g in rows/s^2 (pitch-independent)
}
const beadRGB = (c, max) => C.beadA.map((v, i) => Math.round(lerp(v, C.beadB[i], c / Math.max(1, max - 1))));
/** Bead positions of act a at frame f (rows), with the no-overlap rule applied per rod. */
function beadRows(TL, a, f) {
  const A = TL.acts[a], R = A.R, g = G_PX / 76, t = (f - A.release) / FPS;
  const out = new Map();
  for (let c = 0; c < R.max; c++) {
    const col = R.beads.filter(b => b.c === c).sort((p, q) => q.r1 - p.r1);   // bottom first
    let below = Infinity;
    for (const b of col) {
      let y = b.r0 + fallRows(b.r1 - b.r0, t, g);
      y = Math.min(y, below - 1); below = y;
      out.set(b, y);
    }
  }
  return out;
}
function abacus(g, G, f, a) {
  const TL = G.TL, A = TL.acts[a], { R, p, x0, y0, colX, rowY } = geo(G, a);
  const inA = E.outCubic(prog(f, A.build - 16, A.build + 4));
  const trap = a === 0 ? (f - A.out) / FPS : -1;              // act 1 ends with the floor opening
  const outA = a === 0 ? 1 - E.inCubic(prog(f, A.out + 10, A.out + 26)) : 1 - E.inCubic(prog(f, TL.end - 4, TL.end + 14)) * 0.3;
  const al = inA * outA;
  if (al <= 0.01) return;
  const bw = (R.max - 1) * p + p * 1.1, bh = (R.n - 1) * p + p * 1.1;
  g.save(); g.globalAlpha = al;
  g.fillStyle = 'rgba(246,239,230,0.025)'; g.beginPath(); g.roundRect(x0 - p * 0.55, y0 - p * 0.55, bw, bh, 18); g.fill();
  g.strokeStyle = C.frame; g.lineWidth = 6; g.stroke();
  g.strokeStyle = C.rod; g.lineWidth = 2;
  for (let c = 0; c < R.max; c++) { g.beginPath(); g.moveTo(colX(c), y0 - p * 0.5); g.lineTo(colX(c), y0 + (R.n - 1) * p + p * 0.5); g.stroke(); }
  // the floor: a bar under the rods that swings open at the end of act 1
  const open = trap > 0 ? E.inCubic(clamp(trap / 0.35)) : 0;
  g.strokeStyle = C.accent; g.lineWidth = 6; g.lineCap = 'round';
  const fy = y0 + (R.n - 1) * p + p * 0.55;
  g.beginPath(); g.moveTo(x0 - p * 0.55, fy); g.lineTo(x0 - p * 0.55 + Math.cos(open * 1.4) * bw, fy + Math.sin(open * 1.4) * bw); g.stroke();
  g.restore();
  // beads
  const built = k => E.outCubic(prog(f, A.build + k * A.rowStep, A.build + k * A.rowStep + TL.o.slide));
  const pos = f >= A.release ? beadRows(TL, a, f) : null;
  for (const b of R.beads) {
    const s = built(b.r0); if (s <= 0) continue;
    let yr = pos ? pos.get(b) : b.r0, x = colX(b.c) - (1 - s) * (b.c + 2) * p * 0.6, y = rowY(0) + yr * p;
    if (trap > 0) y += 0.5 * G_PX * (p / 76) * trap * trap * 1.4 * clamp(trap / 0.1);
    const rgb = beadRGB(b.c, R.max), r = p * G.beadR;
    g.save(); g.globalAlpha = al * clamp(s * 1.5);
    g.fillStyle = `rgb(${rgb.join(',')})`; g.beginPath(); g.ellipse(x, y, r, r * 0.86, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = 'rgba(255,255,255,0.35)'; g.beginPath(); g.ellipse(x - r * 0.3, y - r * 0.32, r * 0.32, r * 0.2, -0.4, 0, Math.PI * 2); g.fill();
    g.fillStyle = `rgba(${C.bgRGB},0.55)`; g.fillRect(x - 1.5, y - r * 0.86, 3, r * 1.72);   // the rod shows through the hole
    g.restore();
  }
  // row labels: the input before the drop, the output after it
  for (let k = 0; k < R.n; k++) {
    const y = rowY(k) + G.lab * 0.36, lx = x0 + (R.max - 1) * p + p * 0.55 + G.labGap;
    const aIn = built(k) * (1 - E.inCubic(prog(f, A.release - 2, A.release + 8)));
    text(g, String(R.vals[k]), lx, y, { size: G.lab, weight: 800, color: C.dim, fam: MONO, alpha: aIn * al });
    const tk = A.read + k * A.readStep, aOut = E.outBack(prog(f, tk, tk + 8));
    if (aOut > 0) {
      g.save(); g.globalAlpha = al * clamp(aOut); g.translate(lx, y); const sc = clamp(aOut, 0, 1.3); g.scale(sc, sc);
      text(g, String(R.out[k]), 0, 0, { size: G.lab, weight: 900, color: C.sorted, fam: MONO });
      g.restore();
      // a sweep under the row, left to right, as it is read
      const sw = E.outCubic(prog(f, tk, tk + 10)) * (1 - prog(f, tk + 10, tk + 22));
      if (sw > 0.01) { g.save(); g.globalAlpha = al * sw * 0.5; g.fillStyle = C.sorted; g.fillRect(x0 - p * 0.5, rowY(k) + p * 0.46, (R.out[k] - 0.5) * p * E.outCubic(prog(f, tk, tk + 8)) + p * 0.5, 3); g.restore(); }
    }
  }
}
function counters(g, G, f) {
  const TL = G.TL, [a] = env(f, TL.acts[0].build - 10, TL.end + 20, 12, 10);
  if (a <= 0) return;
  const act = f >= TL.acts[1].build - 10 ? 1 : 0, R = RUNS[act];
  const beadsShown = R.beads.length;
  const items = [[String(R.n), 'numbers', C.paper], [String(beadsShown), 'beads', C.accent], ['0', 'comparisons', C.sorted]];
  items.forEach(([v, l, c], i) => {
    const [x, y] = G.ctrPos(i);
    text(g, v, x, y, { size: G.ctr, weight: 900, color: c, spacing: -2, alpha: a });
    text(g, l, x, y + G.ctrL * 1.3, { size: G.ctrL, weight: 700, color: C.dim, alpha: a, spacing: 1 });
  });
}
function fallInfo(g, G, f) {
  const TL = G.TL;
  for (let a = 0; a < 2; a++) {
    const A = TL.acts[a], R = A.R, [al] = env(f, A.release + 4, A.out + (a ? 30 : 8), 10, 10);
    if (al <= 0) continue;
    const ft = fallTime(R.drop, G_PX / 76);
    text(g, `longest fall: ${R.drop} rows in ${ft.toFixed(2)} s`, G.fiX, G.fiY, { size: G.fi, weight: 700, color: C.paper, fam: MONO, alpha: al * 0.9, align: G.fiAlign, max: G.fiMax });
  }
}
function caption(g, G, f) {
  for (const [t0, t1, str] of G.TL.caps) {
    const [a, dy] = env(f, t0, t1, 10, 8); if (a <= 0) continue;
    const [p1, p2] = str.split('|');
    if (G.capTwo) {
      text(g, p1, G.capX, G.capY + dy, { size: G.cap, weight: 850, color: C.paper, spacing: -1, alpha: a, max: G.capMax });
      text(g, p2, G.capX, G.capY + G.cap * 1.14 + dy, { size: G.cap, weight: 850, color: C.accent, spacing: -1, alpha: a, max: G.capMax });
    } else {
      const w1 = text(g, p1 + ' ', G.capX, G.capY + dy, { size: G.cap, weight: 850, color: C.paper, spacing: -1, alpha: a });
      text(g, p2, G.capX + w1, G.capY + dy, { size: G.cap, weight: 850, color: C.accent, spacing: -1, alpha: a });
    }
  }
}
function summary(g, G, f) {
  const TL = G.TL, out = 1 - E.inCubic(prog(f, TL.end - 4, TL.end + 12));
  const k1 = E.outCubic(prog(f, TL.sum, TL.sum + 16)) * out, k2 = E.outCubic(prog(f, TL.sum + 12, TL.sum + 28)) * out;
  if (k1 <= 0) return;
  const s1 = `${RUNS[0].sum + RUNS[1].sum} beads, ${RUNS[0].n + RUNS[1].n} numbers, 0 comparisons.`;
  const s2 = 'Every bead just falls.';
  const lines = G.sumWrap ? [...vWrap(s1, G.sumMax, G.sum1, 850).map(s => [s, C.paper, G.sum1, 850, k1]), [s2, C.sorted, G.sum1, 850, k2]]
    : [[s1, C.paper, G.sum1, 850, k1], [s2, C.sorted, G.sum1, 850, k2]];
  g.save(); g.fillStyle = `rgba(${C.bgRGB},${0.8 * k1})`; g.fillRect(0, G.sumY - G.sum1 * 1.2, g.canvas.width, lines.length * G.sum1 * 1.25 + G.sum1 * 0.9); g.restore();
  lines.forEach(([s, c, sz, wt, k], i) => text(g, s, G.sumX, G.sumY + i * sz * 1.25 + (1 - k) * 16, { size: sz, weight: wt, color: c, align: G.sumAlign, alpha: k, spacing: -1, max: G.sumMax }));
}
function backdrop(g, w, h) { g.fillStyle = C.bg; g.fillRect(0, 0, w, h); }
function scene(g, G, f) {
  abacus(g, G, f, 0);
  if (f >= G.TL.acts[1].build - 20) abacus(g, G, f, 1);
  caption(g, G, f); counters(g, G, f); fallInfo(g, G, f); summary(g, G, f);
}

// ---- landscape picture ------------------------------------------------------------------
const GL = { TL: TLL, cx: 760, cy: 610, pitch: [76, 46], beadR: 0.42, lab: 44, labGap: 36,
  capX: 120, capY: 216, cap: 52, capTwo: false, capMax: 1680,
  ctr: 88, ctrL: 28, ctrPos: i => [1440, 420 + i * 190],
  fi: 30, fiX: 120, fiY: 1006, fiAlign: 'left', fiMax: 1000,
  sum1: 64, sumX: 960, sumY: 500, sumAlign: 'center', sumMax: 1680, sumWrap: false };
function hookL(f) {
  const o = 1 - E.inCubic(prog(f, TLL.o.start - 18, TLL.o.start - 4));
  if (o <= 0) return;
  const k = E.outExpo(prog(f, -8, 10)), k2 = E.outBack(prog(f, -6, 12));
  text(ctx, 'Sort without comparing.', W / 2, 560 + (1 - k) * 30, { size: 120, weight: 900, color: C.paper, spacing: -3, align: 'center', alpha: o * Math.max(0.3, k) });
  text(ctx, 'Just let go.', W / 2, 700 + (1 - clamp(k2)) * 30, { size: 120, weight: 900, color: C.accent, spacing: -3, align: 'center', alpha: o * Math.max(0.3, clamp(k2)) });
}
function draw(f) {
  if (ctx.reset) ctx.reset();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none'; ctx.shadowBlur = 0;
  backdrop(ctx, W, H);
  const T = TLL, endK = E.inOutCubic(prog(f, T.end, T.end + 20)), a = 1 - endK;
  text(ctx, 'ALGORITHMS  ·  BEAD SORT', 120, 104, { size: 26, weight: 600, color: C.dim, spacing: 5, alpha: a });
  text(ctx, 'BYTEPATTERNS', 1800, 104, { size: 26, weight: 600, color: C.dim, spacing: 5, align: 'right', alpha: a });
  scene(ctx, GL, f);
  hookL(f);
  if (endK > 0) {
    ctx.fillStyle = `rgba(${C.bgRGB},${0.9 * endK})`; ctx.fillRect(0, 0, W, H);
    const k1 = E.outCubic(prog(f, T.end + 6, T.end + 28)), k2 = E.outCubic(prog(f, T.end + 16, T.end + 38)), k3 = E.outCubic(prog(f, T.end + 26, T.end + 48));
    text(ctx, 'Gravity Sort', W / 2, 500 + (1 - k1) * 30, { size: 140, weight: 850, color: C.paper, spacing: -3, align: 'center', alpha: k1 });
    text(ctx, 'bead sort  ·  every number a row of beads  ·  every bead just falls', W / 2, 580 + (1 - k2) * 20, { size: 42, weight: 500, color: C.accent, align: 'center', alpha: k2 });
    text(ctx, 'drawn in code  ·  bytepatterns.com', W / 2, 1000, { size: 32, weight: 600, color: C.paper, spacing: 3, align: 'center', alpha: k3 * 0.8 });
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.letterSpacing = '0px';
}

// ---- sound: 100 BPM; rows slide in, the drop whooshes, every bead clacks where it lands ---------
const BEAT = 18;
const PENTA = [0, 2, 4, 7, 9];
const noteOfN = (v, max) => { const i = Math.min(14, Math.floor((v - 1) / max * 15)); return 57 + 12 * Math.floor(i / 5) + PENTA[i % 5]; };
async function renderAudio(TL = TLL, frames = FRAMES) {
  const SR = 48000, dur = frames / FPS, LEN = Math.round(SR * dur);
  const ac = new OfflineAudioContext(2, LEN, SR);
  const at = fr => fr / FPS;
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -14; comp.ratio.value = 4; comp.attack.value = 0.002; comp.release.value = 0.15;
  const master = ac.createGain(); master.gain.value = 0.9; master.connect(comp).connect(ac.destination);
  master.gain.setValueAtTime(0.9, dur - 0.8); master.gain.linearRampToValueAtTime(0.0001, dur - 0.02);
  const rnd = mulberry32(0x35B7);
  const ir = ac.createBuffer(2, SR * 1.4, SR);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let k = 0; k < d.length; k++) d[k] = (rnd() * 2 - 1) * Math.pow(1 - k / d.length, 3.4); }
  const verb = ac.createConvolver(); verb.buffer = ir; const vg = ac.createGain(); vg.gain.value = 0.2; verb.connect(vg).connect(master);
  const noise = ac.createBuffer(1, SR * 2, SR); { const d = noise.getChannelData(0); for (let k = 0; k < d.length; k++) d[k] = rnd() * 2 - 1; }
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  const kick = (t0, amp = 0.4) => { const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.setValueAtTime(120, t0); o.frequency.exponentialRampToValueAtTime(42, t0 + 0.14);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(amp, t0 + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.3);
    o.connect(g).connect(master); o.start(t0); o.stop(t0 + 0.32); };
  const tone = (t0, m, pan, amp, dec, type = 'sine') => { if (hz(m) > 18000) return; const o = ac.createOscillator(), g = ac.createGain(), p = ac.createStereoPanner();
    o.type = type; o.frequency.value = hz(m); p.pan.value = clamp(pan, -1, 1);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(amp, t0 + 0.003); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dec);
    o.connect(g).connect(p); p.connect(master); p.connect(verb); o.start(t0); o.stop(t0 + dec + 0.03); };
  // wood: a short band-passed noise burst with a pitched body
  const clack = (t0, m, pan, amp) => { const s = ac.createBufferSource(); s.buffer = noise; const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = hz(m) * 4; bp.Q.value = 8;
    const g = ac.createGain(), p = ac.createStereoPanner(); p.pan.value = clamp(pan, -1, 1); g.gain.setValueAtTime(amp, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.06);
    s.connect(bp).connect(g).connect(p); p.connect(master); p.connect(verb); s.start(t0, (t0 * 7.1) % 1.8, 0.08); tone(t0, m, pan, amp * 0.5, 0.09, 'triangle'); };
  const bell = (t0, m, amp, pn = 0) => { for (const [r2, a2, d2] of [[1, 1, 1.4], [2.76, 0.3, 0.6], [5.4, 0.1, 0.25]]) tone(t0, m + 12 * Math.log2(r2), pn, amp * a2, d2); };
  const BASS = [33, 36, 29, 31];
  for (let bar = 0; bar * BEAT * 4 < TL.end; bar++) {
    const t0 = at(bar * BEAT * 4), o = ac.createOscillator(), g = ac.createGain(), lp = ac.createBiquadFilter();
    o.type = 'sawtooth'; o.frequency.value = hz(BASS[bar % BASS.length]); lp.type = 'lowpass'; lp.frequency.value = 280;
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.085, t0 + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t0 + BEAT * 4 / FPS);
    o.connect(lp).connect(g).connect(master); o.start(t0); o.stop(t0 + BEAT * 4 / FPS + 0.05);
  }
  for (let b = 0; b * BEAT < TL.end; b++) { const t0 = at(b * BEAT); if (b % 2 === 0) kick(t0, 0.3); }
  TL.acts.forEach((A, a) => {
    const R = A.R, g = G_PX / 76, panC = c => (c / (R.max - 1) - 0.5) * 1.2;
    // rows slide in: a pluck pitched by the number
    R.vals.forEach((v, k) => tone(at(A.build + k * A.rowStep + 6), noteOfN(v, R.max), -0.5, 0.1, 0.35, 'triangle'));
    // the drop: a falling whoosh
    { const s = ac.createBufferSource(); s.buffer = noise; const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.2;
      const t0 = at(A.release); bp.frequency.setValueAtTime(2400, t0); bp.frequency.exponentialRampToValueAtTime(300, t0 + 0.5);
      const gg = ac.createGain(); gg.gain.setValueAtTime(0.0001, t0); gg.gain.exponentialRampToValueAtTime(0.08, t0 + 0.08); gg.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.6);
      s.connect(bp).connect(gg).connect(master); s.start(t0, 0.3, 0.7); }
    // impacts: first landing and first bounce of every bead that moves, grouped per frame and rod
    const hits = new Map();
    for (const b of R.beads) {
      const d = b.r1 - b.r0; if (d <= 0) continue;
      const th = fallTime(d, g), v = g * th * REST;
      for (const [tt, amp] of [[th, 1], [th + 2 * v / g, 0.35]]) {
        const fr = Math.round(A.release + tt * FPS), key = fr + ':' + b.c;
        const h = hits.get(key) || { fr, c: b.c, amp: 0, row: b.r1 }; h.amp += amp; hits.set(key, h);

    }
    for (const h of hits.values()) clack(at(h.fr), 72 - h.row * (a ? 1 : 2) + h.c, panC(h.c), Math.min(0.16, 0.06 * Math.sqrt(h.amp)));
    // reading the rows: marimba, ascending
    R.out.forEach((v, k) => { tone(at(A.read + k * A.readStep), noteOfN(v, R.max) + 12, (k / (R.n - 1) - 0.5) * 0.8, 0.14, 0.3); tone(at(A.read + k * A.readStep), noteOfN(v, R.max) + 12 + 23.7, 0, 0.03, 0.05); });
    [69, 73, 76, 81].forEach((m, i) => bell(at(A.readEnd) + i * 0.05, m + (a ? 3 : 0), 0.05, -0.3 + i * 0.2));
    if (a === 0) { const s = ac.createBufferSource(); s.buffer = noise; const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900;
      const gg = ac.createGain(), t0 = at(A.out); gg.gain.setValueAtTime(0.0001, t0); gg.gain.exponentialRampToValueAtTime(0.1, t0 + 0.1); gg.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.8);
      s.connect(lp).connect(gg).connect(master); s.start(t0, 0.9, 0.9); kick(t0 + 0.25, 0.5); }
  });
  [60, 64, 67, 72].forEach((m, i) => bell(at(TL.sum) + i * 0.06, m, 0.06, -0.3 + i * 0.2));
  [72, 76, 79, 84].forEach((m, i) => bell(at(TL.end + 8 + i * 6), m, 0.07, -0.45 + i * 0.3));
  const buf = await ac.startRendering();
  let peak = 0; for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let k = 0; k < d.length; k++) peak = Math.max(peak, Math.abs(d[k])); }
  if (peak > 0.89) for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let k = 0; k < d.length; k++) d[k] *= 0.89 / peak; }
  return buf;
}

/* ==========================================================================
   VERTICAL CUT — shared block, identical in every piece.
   1080x1920 for Reels, Shorts and TikTok (__motion.variants.vertical). The
   piece's own scene code is re-used and recomposed for a phone: everything a
   viewer must read stays inside the area no platform covers (x 60..900,
   y 230..1400); outside it there is only dimmed texture.
   ========================================================================== */
const VW = 1080, VH = 1920, SAFE = { x: 60, y: 230, w: 840, h: 1170, r: 900, b: 1400 };
const vcv = document.createElement('canvas'); vcv.width = VW; vcv.height = VH;
const vx = vcv.getContext('2d', { willReadFrequently: true });   // CPU raster: identical pixels on every redraw
const VL = 96, VR = 864;                                          // text column inside the safe area

function vReset() {
  vx.setTransform(1, 0, 0, 1, 0, 0); vx.globalAlpha = 1; vx.globalCompositeOperation = 'source-over';
  vx.filter = 'none'; vx.shadowBlur = 0; vx.shadowColor = 'transparent'; vx.letterSpacing = '0px'; vx.setLineDash([]);
  vx.textAlign = 'left'; vx.textBaseline = 'alphabetic'; vx.lineCap = 'butt'; vx.lineJoin = 'miter';
}
/** Canvas text on the vertical frame; `max` shrinks the size until the line fits. */
function vText(str, x, y, { size = 40, weight = 700, color = '#FFFFFF', align = 'left', spacing = 0, alpha = 1, fam = FONT, max = 0 } = {}) {
  if (alpha <= 0.002 || !str) return size;
  vx.font = `${weight} ${size}px ${fam}`; vx.letterSpacing = spacing + 'px';
  if (max) { const w = vx.measureText(str).width; if (w > max) { size = size * max / w; vx.font = `${weight} ${size}px ${fam}`; } }
  vx.textAlign = align; vx.textBaseline = 'alphabetic';
  const a0 = vx.globalAlpha; vx.globalAlpha = a0 * alpha; vx.fillStyle = color;
  vx.fillText(str, x + (align === 'center' ? spacing / 2 : align === 'right' ? spacing : 0), y);   // tracking is added after the last glyph too
  vx.globalAlpha = a0; vx.letterSpacing = '0px';
  return size;
}
/** Word-wraps with the given font; returns the lines. */
function vWrap(str, maxW, size, weight = 700, fam = FONT) {
  vx.font = `${weight} ${size}px ${fam}`; vx.letterSpacing = '0px';
  const words = str.split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (vx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur);
  return lines;
}
/** Fade envelope with a small rise: [alpha, dy]. */
function vEnv(v, a, b, fin = 8, fout = 8) {
  const i = E.outCubic(prog(v, a, a + fin)), o = 1 - E.inCubic(prog(v, b - fout, b));
  return [Math.min(i, o), (1 - i) * 22 - (1 - o) * 10];
}
/** Which segment of a cut list a vertical frame is in: segs = [{ at, src, len }] in frames. */
function vSeg(segs, v) {
  let k = 0; while (k < segs.length - 1 && v >= segs[k + 1].at) k++;
  const s = segs[k];
  return { k, s, local: v - s.at, src: s.src + (v - s.at) };
}
/** Dims everything outside the safe area to a quiet texture (brightness x 0.2), with a soft inner edge. */
function vShade(rgb, a = 0.8, feather = 40) {
  vx.save(); vx.setTransform(1, 0, 0, 1, 0, 0); vx.globalAlpha = 1; vx.globalCompositeOperation = 'source-over';
  vx.fillStyle = `rgba(${rgb},${a})`;
  vx.beginPath(); vx.rect(0, 0, VW, VH); vx.rect(SAFE.x, SAFE.y, SAFE.w, SAFE.h); vx.fill('evenodd');
  const strip = (x0, y0, x1, y1, rx, ry, rw, rh) => {
    const g = vx.createLinearGradient(x0, y0, x1, y1);
    g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`);
    vx.fillStyle = g; vx.fillRect(rx, ry, rw, rh);
  };
  strip(SAFE.x, 0, SAFE.x + feather, 0, SAFE.x, SAFE.y, feather, SAFE.h);
  strip(SAFE.r, 0, SAFE.r - feather, 0, SAFE.r - feather, SAFE.y, feather, SAFE.h);
  strip(0, SAFE.y, 0, SAFE.y + feather, SAFE.x, SAFE.y, SAFE.w, feather);
  strip(0, SAFE.b, 0, SAFE.b - feather, SAFE.x, SAFE.b - feather, SAFE.w, feather);
  vx.restore();
}
/** Series tag at the top of the safe area, e.g. MADE IN CODE · 04. */
function vTag(label, color, alpha = 1) {
  vText('MADE IN CODE', VL, 292, { size: 28, weight: 800, color, spacing: 5, alpha });
  vx.font = `800 28px ${FONT}`; vx.letterSpacing = '5px';
  const w = vx.measureText('MADE IN CODE').width; vx.letterSpacing = '0px';
  vText('·  ' + label, VL + w + 14, 292, { size: 28, weight: 600, color: 'rgba(255,255,255,0.72)', spacing: 3, alpha, max: VR - VL - w - 14 });
}
/** Big hook lines, left-aligned from y0; visible from frame 0, settles in a few frames. */
function vHook(v, lines, y0, { size = 84, lh = 1.08, color = '#FFFFFF', accent = null, weight = 800, spacing = -1.5, alpha = 1 } = {}) {
  const k = E.outExpo(prog(v, -6, 12));
  lines.forEach((ln, i) => {
    const kk = E.outExpo(prog(v, -12 + i * 2, 8 + i * 2));
    vText(ln, VL, y0 + i * size * lh + (1 - kk) * 30, { size, weight, spacing, color: accent && i === lines.length - 1 ? accent : color, alpha: alpha * Math.max(0.25, kk), max: VR - VL });
  });
  return k;
}
/** Closing card, the last 60 frames: piece title, "drawn in code · bytepatterns.com". l = frames into the card. */
function vEndCard(l, { title, line = '', ink = '#FFFFFF', dim = 'rgba(255,255,255,0.66)', accent = '#FFFFFF', scrim = '0,0,0', a = 0.84 }) {
  const k = E.outCubic(prog(l, 0, 12));
  vx.save(); vx.setTransform(1, 0, 0, 1, 0, 0);
  vx.fillStyle = `rgba(${scrim},${a * k})`; vx.fillRect(0, 0, VW, VH);
  vx.restore();
  const t1 = E.outExpo(prog(l, 3, 19)), t2 = E.outExpo(prog(l, 11, 27)), t3 = E.outExpo(prog(l, 19, 35));
  vx.fillStyle = accent; vx.globalAlpha = t1; vx.fillRect(VL, 742, 88 * t1, 7); vx.globalAlpha = 1;
  const size = vText(title, VL, 850 + (1 - t1) * 40, { size: 92, weight: 800, color: ink, spacing: -2, alpha: t1, max: VR - VL });
  const y2 = 850 + Math.max(size, 60) * 0.25 + 70;
  vx.font = `600 44px ${FONT}`;
  const lead = 'drawn in code  ·  ', lw = vx.measureText(lead).width;
  vText(lead, VL, y2 + (1 - t2) * 24, { size: 44, weight: 600, color: dim, alpha: t2 });
  vText('bytepatterns.com', VL + lw, y2 + (1 - t2) * 24, { size: 44, weight: 800, color: accent, alpha: t2 });
  if (line) vText(line, VL, y2 + 72 + (1 - t3) * 18, { size: 32, weight: 500, color: dim, alpha: t3, max: VR - VL });
}
/** Seeks a cut. The first frame a page draws is drawn twice: the very first read of a
 *  GPU-backed source canvas can come out a shade different from every later one. */
let vWarm = false;
function vSeek(draw, i, frames) {
  const f = Math.max(0, Math.min(frames - 1, Math.floor(i)));
  if (!vWarm) { vWarm = true; draw(f); }
  draw(f);
}
/** The soundtrack of a cut: the piece's own audio() spliced to the same segments as the picture. */
async function vAudio(segs, frames, { xf = 0.025, fadeOut = 0.6, extra = null } = {}) {
  const src = await renderAudio();
  const SR = 48000, dur = frames / FPS, ac = new OfflineAudioContext(2, Math.round(SR * dur), SR);
  const out = ac.createGain(); out.connect(ac.destination);
  out.gain.setValueAtTime(1, 0); out.gain.setValueAtTime(1, dur - fadeOut); out.gain.linearRampToValueAtTime(0, dur - 0.01);
  segs.forEach((s, k) => {
    const at = s.at / FPS, off = s.src / FPS, d = s.len / FPS;
    const pre = k === 0 ? 0 : Math.min(xf, off), post = k === segs.length - 1 ? 0 : xf;
    const b = ac.createBufferSource(), g = ac.createGain(); b.buffer = src;
    g.gain.setValueAtTime(pre ? 0 : 1, at - pre);
    if (pre) g.gain.linearRampToValueAtTime(1, at + pre);
    if (post) { g.gain.setValueAtTime(1, at + d - post); g.gain.linearRampToValueAtTime(0, at + d + post); }
    b.connect(g).connect(out); b.start(at - pre, off - pre, d + pre + post);
  });
  if (extra) extra(ac, out);
  const buf = await ac.startRendering();
  let peak = 0; for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) peak = Math.max(peak, Math.abs(d[i])); }
  if (peak > 0.9) for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] *= 0.9 / peak; }
  return buf;
}
/** A soft three-partial bell, for the closing card. */
function vChime(ac, dest, at, freq, vol = 0.08) {
  for (const [mul, v, dec] of [[1, 1, 1.8], [2.01, 0.35, 0.8], [3.02, 0.12, 0.4]]) {
    const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.value = freq * mul;
    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol * v, at + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, at + dec);
    o.connect(g).connect(dest); o.start(at); o.stop(at + dec + 0.05);
  }
}

/* VERTICAL CUT — this piece */
// The same two drops on a phone: the abacus centred a little left so the row
// labels fit on its right, the counters in a row under it, the caption on two
// lines above; a faster clock, and the soundtrack rendered from it.
const TLV = buildTL({ start: 40, rowStep: [5, 2], slide: 10, wait: [10, 8], readStep: [4, 2], hold: [14, 10], gapAfter: 12, sumLen: 70 });
const VFR = TLV.end + 60, VEND = VFR - 60;
const GV = { TL: TLV, cx: 440, cy: 850, pitch: [70, 42], beadR: 0.42, lab: 40, labGap: 26,
  capX: VL, capY: 382, cap: 46, capTwo: true, capMax: VR - VL,
  ctr: 64, ctrL: 28, ctrPos: i => [VL + i * 280, 1296],
  fi: 28, fiX: VL, fiY: 492, fiAlign: 'left', fiMax: VR - VL,
  sum1: 58, sumX: VL, sumY: 760, sumAlign: 'left', sumMax: VR - VL, sumWrap: true };
function hookV(v) {
  const o = 1 - E.inCubic(prog(v, TLV.o.start - 16, TLV.o.start - 2));
  if (o <= 0) return;
  vHook(v, ['Sort without', 'comparing.', 'Just let go.'], 520, { size: 108, accent: C.accent, color: C.paper, weight: 900, spacing: -2, alpha: o });
}
function vDraw(v) {
  vReset();
  backdrop(vx, VW, VH);
  scene(vx, GV, v);
  hookV(v);
  vReset();
  vShade(C.bgRGB, 0.84);
  vTag('BEAD SORT', C.accent);
  if (v >= VEND) vEndCard(v - VEND, { title: 'Gravity Sort', line: 'every number a row of beads  ·  every bead just falls',
    ink: C.paper, dim: 'rgba(246,239,230,0.72)', accent: C.accent, scrim: C.bgRGB, a: 0.9 });
  vReset();
}

window.__motion = {
  title: 'Gravity Sort',
  description: `Bead sort: ${RUNS[0].n} numbers (${RUNS[0].vals.join(', ')}) as rows of beads on an abacus fall down their rods under gravity and bounce, and the rows read ${RUNS[0].out.join(', ')}; then ${RUNS[1].n} numbers, ${RUNS[1].sum} beads, in one drop. No comparisons: each bead only falls.`,
  fps: FPS, width: W, height: H, frames: FRAMES,
  poster: TLL.acts[0].readEnd + 4,
  gifStart: Math.floor((TLL.acts[0].release - 40) / FPS),
  seek(i) { draw(Math.max(0, Math.min(FRAMES - 1, Math.floor(i)))); },
  audio: () => renderAudio(TLL, FRAMES),
  variants: {
    vertical: {
      width: VW, height: VH, frames: VFR, canvas: vcv,
      poster: TLV.acts[0].readEnd + 2, gifStart: Math.floor((TLV.acts[0].release - 30) / FPS),
      seek(i) { vSeek(vDraw, i, VFR); },
      audio: () => renderAudio(TLV, VFR),
    },
  },
};

/* ==========================================================================
   PLAYER — identical in every piece; keep as is.
   Autoplays and loops, starts sound on the first click, ?frame=N pauses on a
   frame, ?variant=vertical plays the vertical cut (if the piece has one).
   When the renderer sets window.__MOTION_RENDER__ it stays out of the way.
   ========================================================================== */
(function player() {
  const btn = document.getElementById('sound'), q = new URLSearchParams(location.search);
  let M = window.__motion;
  const V = !window.__MOTION_RENDER__ && M.variants && M.variants[q.get('variant')];
  if (V) {                                                // show the variant's own canvas instead
    M = Object.assign({}, M, V);
    V.canvas.style.cssText = `width:min(100vw,calc(100vh*${V.width}/${V.height}));height:auto;aspect-ratio:${V.width}/${V.height}`;
    document.querySelector('canvas').replaceWith(V.canvas);
  }
  const dur = M.frames / M.fps;
  if (window.__MOTION_RENDER__) { btn.hidden = true; M.seek(0); return; }
  if (q.has('frame')) { btn.hidden = true; M.seek(+q.get('frame') || 0); return; }
  let t0 = performance.now(), ac = null, src = null, buf = null, paused = false, pausedAt = 0;
  const clock = () => ac && src ? (ac.currentTime - t0) : (performance.now() - t0) / 1000;
  function loop() {
    if (!paused) M.seek(Math.floor(((clock() % dur) + dur) % dur * M.fps));
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  btn.addEventListener('click', async () => {
    if (src) { src.stop(); src = null; btn.textContent = 'Click for sound'; t0 = performance.now(); return; }
    btn.textContent = 'Loading sound…';
    ac = ac || new AudioContext({ sampleRate: 48000 });
    buf = buf || await M.audio();
    await ac.resume();
    src = ac.createBufferSource(); src.buffer = buf; src.loop = true; src.connect(ac.destination);
    t0 = ac.currentTime + 0.05; src.start(t0);        // picture restarts from frame 0 in sync with the sound
    btn.textContent = 'Sound on — click to mute';
  });
  addEventListener('keydown', e => {
    if (e.code !== 'Space') return;
    e.preventDefault(); paused = !paused;
    if (ac) paused ? ac.suspend() : ac.resume();
    if (!ac) { if (paused) pausedAt = performance.now(); else t0 += performance.now() - pausedAt; }
  });
})();
