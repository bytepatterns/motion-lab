<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="teambytepatterns">
<meta name="description" content="A title sequence typed live: six lines of code, each one running the moment it is entered, until the last one writes the title.">
<title>Six Lines — motion-lab</title>
<style>
  /* Player chrome. The piece itself lives entirely in the canvas. */
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; font: 500 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; }
  canvas { display: block; width: min(100vw, calc(100vh * 16 / 9)); height: auto; aspect-ratio: 16 / 9; }
  #sound { position: fixed; left: 16px; bottom: 16px; padding: 8px 14px; border: 1px solid rgba(255,255,255,.35); border-radius: 999px;
           background: rgba(0,0,0,.55); color: #fff; font: inherit; cursor: pointer; }
  #sound[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080" aria-label="Code typed into an editor, each line animating a preview, ending in a kinetic title"></canvas>
<button id="sound" type="button">Click for sound</button>
<script>
'use strict';
/* ==========================================================================
   PIECE — Six Lines.
   A title sequence that is typed while you watch. An editor on the left,
   a preview on the right; every line runs the moment Enter is pressed:
   random bars, a sort, a grid of dots, a wave, a palette, and the title.
   The typing rhythm is a fixed schedule (a seeded jitter per key), so every
   caret position, every preview state and every key click is a function of
   the frame number.
   ========================================================================== */
const W = 1920, H = 1080, FPS = 30, FRAMES = 600;          // 20 s
const cv = document.getElementById('stage');
const ctx = cv.getContext('2d');
const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
const MONO = 'ui-monospace, "Cascadia Code", Consolas, Menlo, monospace';

// ---- helpers -------------------------------------------------------------
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (f, a, b) => clamp((f - a) / (b - a));
const E = {
  inCubic: t => t * t * t,
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inOutCubic: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outExpo: t => t === 1 ? 1 : 1 - Math.pow(2, -10 * t),
  inExpo: t => t === 0 ? 0 : Math.pow(2, 10 * t - 10),
  inOutExpo: t => t === 0 ? 0 : t === 1 ? 1 : t < .5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2,
  outBack: t => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2),
};
function text(g, str, x, y, { size = 40, weight = 600, color = '#fff', alpha = 1, spacing = 0, align = 'left', fam = FONT, base = 'alphabetic' } = {}) {
  if (alpha <= 0.002 || !str) return 0;
  g.font = `${weight} ${size}px ${fam}`; g.letterSpacing = spacing + 'px';
  g.textAlign = align; g.textBaseline = base;
  const a0 = g.globalAlpha; g.globalAlpha = a0 * alpha; g.fillStyle = color;
  g.fillText(str, x, y);
  const w = g.measureText(str).width;
  g.globalAlpha = a0; g.letterSpacing = '0px';
  return w;
}
const env = (f, a, b, fin = 12, fout = 10) => {
  const i = E.outCubic(prog(f, a, a + fin)), o = 1 - E.inCubic(prog(f, b - fout, b));
  return [Math.min(i, o), (1 - i) * 24 - (1 - o) * 10];
};
const mixRGB = (a, b, t) => a.map((v, i) => Math.round(lerp(v, b[i], t)));
const rgb = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

// ---- palette -------------------------------------------------------------
const C = {
  bg: '#0B0C10', panel: '#101219', chrome: '#161922', paper: '#EEEAE2', dim: 'rgba(238,234,226,0.58)', faint: 'rgba(238,234,226,0.28)',
  kw: '#FF7AB6', fn: '#5CE1FF', num: '#F5B83D', str: '#9BE38A', punct: 'rgba(238,234,226,0.55)', id: '#EEEAE2',
  amber: '#F5B83D',
};
const GREY = [72, 78, 92];
const DUSK = [[60, 64, 190], [180, 70, 170], [255, 110, 110], [245, 184, 61]];     // the "dusk" palette, low to high
const duskAt = t => { const s = clamp(t) * (DUSK.length - 1), i = Math.min(DUSK.length - 2, Math.floor(s)); return mixRGB(DUSK[i], DUSK[i + 1], s - i); };

// ---- the script: six lines, and what each one means -------------------------
const LINES = [
  { code: 'const bars = random(24)', what: '24 random numbers become 24 bars', wait: 30 },
  { code: 'bars.sort((a, b) => a - b)', what: 'sorted: every bar slides to its rank', wait: 48 },
  { code: 'const dots = grid(12, 7)', what: 'a 12 × 7 grid of dots', wait: 26 },
  { code: 'dots.wave(x => sin(t + x / 3))', what: 'each column rides a sine wave', wait: 30 },
  { code: 'paint(bars, dots, dusk)', what: 'one palette for everything', wait: 26 },
  { code: 'title("bytepatterns")', what: 'and the title, one letter at a time', wait: 0 },
];
// typing schedule: KEYS[k] = { line, col, at } for every key, RUN[l] = frame line l runs
const KEYS = [], RUN = [];
(function schedule() {
  const r = mulberry32(0x7E1E);
  let f = 14;
  LINES.forEach((ln, l) => {
    for (let c = 0; c < ln.code.length; c++) {
      KEYS.push({ line: l, col: c + 1, at: f, ch: ln.code[c] });
      const ch = ln.code[c];
      f += 1 + (r() < 0.22 ? 1 : 0) + (ch === '(' || ch === ',' || ch === '=' ? 1 : 0) + (ch === ' ' && r() < 0.3 ? 1 : 0);
    }
    f += 5;                                                  // a beat before Enter
    RUN[l] = f;
    f += 3 + ln.wait;
  });
})();
const T = { full: RUN[5] + 4, end: 540 };
function typed(f) {                                          // chars visible per line, and the caret
  const n = LINES.map(() => 0); let caret = { line: 0, col: 0 };
  for (const k of KEYS) { if (k.at > f) break; n[k.line] = k.col; caret = { line: k.line, col: k.col }; }
  for (let l = 0; l < LINES.length; l++) if (f >= RUN[l]) caret = { line: l + 1, col: 0 };
  return { n, caret };
}
const since = (f, l) => f - RUN[l];                          // frames since line l ran (negative: not yet)

// ---- tokens for syntax colour ------------------------------------------------------
function tokens(code) {
  const out = [], re = /(const|=>)|("[^"]*"?)|(\d+)|([A-Za-z_]\w*)(?=\()|([A-Za-z_]\w*)|(\s+)|(.)/g;
  let m;
  while ((m = re.exec(code))) {
    const s = m[0];
    const col = m[1] ? C.kw : m[2] ? C.str : m[3] ? C.num : m[4] ? C.fn : m[5] ? C.id : m[6] ? C.id : C.punct;
    out.push([s, col]);
  }
  return out;
}
const TOK = LINES.map(l => tokens(l.code));

// ---- the preview scene ---------------------------------------------------------------
const NB = 24;
const VALS = (() => { const r = mulberry32(0xBA25); return Array.from({ length: NB }, () => 0.12 + 0.88 * r()); })();
const RANK = (() => { const idx = VALS.map((v, i) => i).sort((a, b) => VALS[a] - VALS[b] || a - b); const rk = []; idx.forEach((i, k) => { rk[i] = k; }); return rk; })();

/** Draws the program's output into rect r at frame f. big = 0..1 grows the title stage. */
function preview(g, f, r, { big = 0, titleSize = 150 } = {}) {
  g.save(); g.beginPath(); g.roundRect(r.x, r.y, r.w, r.h, 18); g.clip();
  const s1 = since(f, 0), s2 = since(f, 1), s3 = since(f, 2), s4 = since(f, 3), s5 = since(f, 4), s6 = since(f, 5);
  const pk = E.inOutCubic(prog(s5, 0, 24));                 // paint
  // background glow once painted
  g.fillStyle = C.panel; g.fillRect(r.x, r.y, r.w, r.h);
  if (pk > 0) {
    const gr = g.createRadialGradient(r.x + r.w * 0.5, r.y + r.h * 0.9, 10, r.x + r.w * 0.5, r.y + r.h * 0.9, r.h * 1.1);
    gr.addColorStop(0, rgb([120, 50, 140], 0.55 * pk)); gr.addColorStop(1, rgb([16, 18, 25], 0));
    g.fillStyle = gr; g.fillRect(r.x, r.y, r.w, r.h);
  }
  const t = f / FPS;
  // dots
  if (s3 >= 0) {
    const cols = 12, rows = 7, gx = r.w / (cols + 1), gy = r.h * 0.62 / (rows + 1);
    for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
      const k = E.outBack(prog(s3, (i + j) * 1.2, (i + j) * 1.2 + 14));
      if (k <= 0) continue;
      const wv = s4 >= 0 ? E.outCubic(prog(s4, 0, 20)) * Math.sin(t * 3 + i / 3 * Math.PI * 0.9) * gy * 0.55 : 0;
      const x = r.x + gx * (i + 1), y = r.y + r.h * 0.06 + gy * (j + 1) + wv;
      const col = mixRGB([150, 156, 170], duskAt(i / (cols - 1)), pk);
      g.fillStyle = rgb(col, 0.9 * (1 - big * 0.5)); g.beginPath(); g.arc(x, y, Math.max(0.1, 6 * k * (1 + big * 0.4)), 0, Math.PI * 2); g.fill();
    }
  }
  // bars
  if (s1 >= 0) {
    const pad = r.w * 0.06, bw = (r.w - 2 * pad) / NB, base = r.y + r.h * 0.94, hmax = r.h * 0.5;
    for (let i = 0; i < NB; i++) {
      const grow = E.outBack(prog(s1, i * 0.8, i * 0.8 + 16));
      if (grow <= 0) continue;
      const rk = RANK[i], mv = E.inOutCubic(prog(s2, rk * 0.9, rk * 0.9 + 18));
      const x = r.x + pad + bw * lerp(i, rk, mv);
      const bounce = s6 >= 0 ? 1 + 0.18 * Math.max(0, Math.sin(t * 6 + rk * 0.5)) * E.outCubic(prog(s6, 10, 40)) : 1;
      const h = hmax * VALS[i] * grow * bounce;
      const col = mixRGB(GREY, duskAt(rk / (NB - 1)), pk);
      const hot = s2 >= 0 && s2 < rk * 0.9 + 18 && s2 > rk * 0.9 ? 1 : 0;
      g.fillStyle = hot ? C.paper : rgb(col); g.beginPath(); g.roundRect(x + bw * 0.14, base - h, bw * 0.72, h, Math.min(6, bw * 0.2)); g.fill();
    }
  }
  // the title
  if (s6 >= 0) {
    const word = 'bytepatterns';
    g.font = `850 ${titleSize}px ${FONT}`; g.letterSpacing = '-4px';
    const total = g.measureText(word).width;
    let x = r.x + r.w / 2 - total / 2; const y = r.y + r.h * 0.46;
    g.textBaseline = 'alphabetic'; g.textAlign = 'left';
    for (let i = 0; i < word.length; i++) {
      const ch = word[i], w = g.measureText(ch).width - 4;
      const k = E.outBack(prog(s6, 4 + i * 2.2, 4 + i * 2.2 + 16)), a = clamp(prog(s6, 4 + i * 2.2, 8 + i * 2.2));
      if (a > 0) {
        g.save(); g.translate(x + w / 2, y - (1 - k) * titleSize * 0.8); g.rotate((1 - k) * (i % 2 ? 0.25 : -0.25));
        g.globalAlpha = a; g.fillStyle = mixRGB(duskAt(i / (word.length - 1)), [238, 234, 226], 0.55).reduce((s, v, j) => s + (j ? ',' : '') + v, 'rgb(') + ')';
        g.fillText(ch, -w / 2, 0); g.restore();
      }
      x += w;
    }
    g.letterSpacing = '0px';
    const [a2, d2] = env(s6, 44, 1e9, 16, 1);
    text(g, 'drawn in code  ·  six lines', r.x + r.w / 2, y + titleSize * 0.42 + d2, { size: Math.max(30, titleSize * 0.22), weight: 600, color: C.paper, align: 'center', alpha: a2 * 0.85 });
  }
  g.restore();
}

// ---- the editor ------------------------------------------------------------------------
function editor(g, f, r, { size = 34, lh = 62, alpha = 1 } = {}) {
  if (alpha <= 0.002) return;
  g.save(); g.globalAlpha = alpha;
  g.fillStyle = C.panel; g.beginPath(); g.roundRect(r.x, r.y, r.w, r.h, 18); g.fill();
  g.fillStyle = C.chrome; g.beginPath(); g.roundRect(r.x, r.y, r.w, 58, [18, 18, 0, 0]); g.fill();
  ['#FF6B5B', '#F5B83D', '#58C4B8'].forEach((c, i) => { g.fillStyle = c; g.beginPath(); g.arc(r.x + 32 + i * 28, r.y + 29, 8, 0, Math.PI * 2); g.fill(); });
  text(g, 'title.js', r.x + r.w / 2, r.y + 38, { size: 28, weight: 600, fam: MONO, color: C.dim, align: 'center' });
  const { n, caret } = typed(f);
  const x0 = r.x + 92, y0 = r.y + 58 + lh * 0.95;
  g.font = `500 ${size}px ${MONO}`;
  const cw = g.measureText('M').width;
  for (let l = 0; l < LINES.length; l++) {
    const y = y0 + l * lh;
    const ran = since(f, l);
    if (ran >= 0) {                                          // a flash on the line that just ran
      const fl = 1 - prog(ran, 0, 14);
      if (fl > 0) { g.fillStyle = `rgba(245,184,61,${0.22 * fl})`; g.fillRect(r.x + 6, y - lh * 0.68, r.w - 12, lh * 0.92); }
    }
    text(g, String(l + 1), r.x + 56, y, { size: size * 0.82, weight: 500, fam: MONO, color: l === caret.line ? C.dim : C.faint, align: 'right' });
    let x = x0, left = n[l];
    for (const [s, col] of TOK[l]) {
      if (left <= 0) break;
      const part = s.slice(0, left); left -= s.length;
      text(g, part, x, y, { size, weight: 500, fam: MONO, color: col });
      x += cw * part.length;
    }
    if (ran >= 0 && ran < 40) text(g, '✓', r.x + r.w - 34, y, { size: size * 0.8, weight: 700, color: C.str, align: 'right', alpha: 1 - prog(ran, 26, 40) });
  }
  // caret: solid while typing, blinking when idle
  const last = KEYS.filter(k => k.at <= f).pop();
  const idle = last ? f - last.at : f;
  const on = idle < 8 || Math.floor(f / 12) % 2 === 0;
  if (on && caret.line < LINES.length) {
    const cx = x0 + cw * caret.col, cy = y0 + caret.line * lh;
    g.fillStyle = C.amber; g.fillRect(cx + 1, cy - size * 0.82, 4, size * 1.02);
  }
  g.restore();
}

// ---- landscape picture ---------------------------------------------------------------------
const ED = { x: 96, y: 180, w: 800, h: 700 }, PV = { x: 952, y: 180, w: 872, h: 700 };
function draw(f) {
  if (ctx.reset) ctx.reset();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none'; ctx.shadowBlur = 0;
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  const endK = E.inOutCubic(prog(f, T.end, T.end + 20));
  const bigK = E.inOutCubic(prog(f, T.full + 6, T.full + 40));   // the preview takes the whole frame
  const ha = (1 - bigK) * (1 - endK);
  text(ctx, 'LIVE CODING  ·  SIX LINES', 120, 104, { size: 26, weight: 600, color: C.dim, spacing: 5, alpha: ha });
  text(ctx, 'BYTEPATTERNS', 1800, 104, { size: 26, weight: 600, color: C.dim, spacing: 5, align: 'right', alpha: ha });
  editor(ctx, f, { x: ED.x - bigK * 900, y: ED.y, w: ED.w, h: ED.h }, { alpha: 1 - bigK });
  const pr = { x: lerp(PV.x, 0, bigK), y: lerp(PV.y, 0, bigK), w: lerp(PV.w, W, bigK), h: lerp(PV.h, H, bigK) };
  preview(ctx, f, pr, { big: bigK, titleSize: lerp(128, 230, bigK) });
  // hook, inside the empty preview
  {
    const o = 1 - E.inCubic(prog(f, RUN[0] - 10, RUN[0] + 4));
    const k = E.outExpo(prog(f, -8, 12)), k2 = E.outExpo(prog(f, 2, 20));
    text(ctx, 'Six lines.', PV.x + 56, PV.y + 300 + (1 - k) * 30, { size: 120, weight: 850, color: C.paper, spacing: -3, alpha: Math.min(k, o) });
    text(ctx, 'Each one runs', PV.x + 56, PV.y + 420 + (1 - k2) * 30, { size: 84, weight: 800, color: C.amber, spacing: -2, alpha: Math.min(k2, o) });
    text(ctx, 'as it is typed.', PV.x + 56, PV.y + 510 + (1 - k2) * 30, { size: 84, weight: 800, color: C.amber, spacing: -2, alpha: Math.min(k2, o) });
  }
  // what the last line did
  for (let l = 0; l < LINES.length; l++) {
    const b = l < LINES.length - 1 ? RUN[l + 1] : T.full + 10;
    const [al, dy] = env(f, RUN[l] + 2, b, 10, 8);
    if (al <= 0.002) continue;
    text(ctx, String(l + 1).padStart(2, '0'), 120, 986 + dy, { size: 40, weight: 700, fam: MONO, color: C.amber, alpha: al * ha });
    text(ctx, LINES[l].what, 196, 986 + dy, { size: 44, weight: 700, color: C.paper, alpha: al * ha });
  }
  if (endK > 0) {
    ctx.fillStyle = `rgba(11,12,16,${0.93 * endK})`; ctx.fillRect(0, 0, W, H);
    const k1 = E.outCubic(prog(f, T.end + 6, T.end + 26)), k2 = E.outCubic(prog(f, T.end + 14, T.end + 34)), k3 = E.outCubic(prog(f, T.end + 22, T.end + 42));
    text(ctx, 'Six Lines', W / 2, 500 + (1 - k1) * 30, { size: 136, weight: 850, color: C.paper, spacing: -3, align: 'center', alpha: k1 });
    text(ctx, 'typed, run and drawn in code', W / 2, 580 + (1 - k2) * 20, { size: 44, weight: 500, color: C.amber, align: 'center', alpha: k2 });
    text(ctx, 'bytepatterns · motion lab', W / 2, 1000, { size: 32, weight: 600, color: C.paper, spacing: 3, align: 'center', alpha: k3 * 0.8 });
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.letterSpacing = '0px';
}

// ---- sound: every key clicks, every line plays its own part -------------------------------------
async function renderAudio() {
  const SR = 48000, dur = FRAMES / FPS, LEN = Math.round(SR * dur);
  const ac = new OfflineAudioContext(2, LEN, SR);
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -15; comp.ratio.value = 3; comp.attack.value = 0.004; comp.release.value = 0.2;
  const master = ac.createGain(); master.gain.value = 0.9; master.connect(comp).connect(ac.destination);
  master.gain.setValueAtTime(0.9, dur - 0.7); master.gain.linearRampToValueAtTime(0.0001, dur - 0.02);
  const rnd = mulberry32(0x5EC14);
  const ir = ac.createBuffer(2, SR * 2.2, SR);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let k = 0; k < d.length; k++) d[k] = (rnd() * 2 - 1) * Math.pow(1 - k / d.length, 3.2); }
  const verb = ac.createConvolver(); verb.buffer = ir; const vg = ac.createGain(); vg.gain.value = 0.3; verb.connect(vg).connect(master);
  const noise = ac.createBuffer(1, SR, SR); { const d = noise.getChannelData(0); for (let k = 0; k < d.length; k++) d[k] = rnd() * 2 - 1; }
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  const click = (at, freq, amp, pan, len = 0.025) => {
    const s = ac.createBufferSource(); s.buffer = noise;
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = 3;
    const g = ac.createGain(); g.gain.setValueAtTime(amp, at); g.gain.exponentialRampToValueAtTime(0.0001, at + len);
    const p = ac.createStereoPanner(); p.pan.value = pan;
    s.connect(bp).connect(g).connect(p).connect(master); s.start(at, (at * 11.3) % 0.9, len + 0.02);
  };
  const tone = (at, m, amp, pan, { type = 'triangle', dec = 0.6, att = 0.004 } = {}) => {
    const o = ac.createOscillator(); o.type = type; o.frequency.value = hz(m);
    const g = ac.createGain(); g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(amp, at + att); g.gain.exponentialRampToValueAtTime(0.0001, at + dec);
    const p = ac.createStereoPanner(); p.pan.value = pan; o.connect(g).connect(p); p.connect(master); p.connect(verb); o.start(at); o.stop(at + dec + 0.05);
  };
  const boom = (at, f0, f1, amp, len) => {
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.setValueAtTime(f0, at); o.frequency.exponentialRampToValueAtTime(f1, at + len * 0.6);
    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(amp, at + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, at + len);
    o.connect(g).connect(master); o.start(at); o.stop(at + len + 0.05);
  };
  const pad = (fa, fb, notes, amp = 0.022, cut = 900) => {
    const a = fa / FPS, b = Math.min(dur, fb / FPS), lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = cut; lp.connect(master); lp.connect(verb);
    for (const m of notes) for (const det of [-7, 7]) {
      const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = hz(m); o.detune.value = det;
      const g = ac.createGain(); g.gain.setValueAtTime(0, a); g.gain.linearRampToValueAtTime(amp, a + 0.5);
      g.gain.setValueAtTime(amp, Math.max(a + 0.5, b - 0.5)); g.gain.linearRampToValueAtTime(0, b);
      o.connect(g).connect(lp); o.start(a); o.stop(b + 0.05);
    }
  };
  // keys
  for (const k of KEYS) click(k.at / FPS, k.ch === ' ' ? 1500 : 2600 + 900 * rnd(), k.ch === ' ' ? 0.22 : 0.16 + 0.06 * rnd(), -0.2 + 0.4 * (k.col / 32));
  // Enter on each line, and what the line starts
  RUN.forEach((f, l) => { click(f / FPS, 700, 0.45, 0, 0.06); });
  boom(RUN[0] / FPS, 110, 55, 0.5, 0.8);
  for (let i = 0; i < NB; i++) tone((RUN[0] + i * 0.8) / FPS, 45 + [0, 7, 12, 15][i % 4], 0.03, -0.6 + 1.2 * i / NB, { type: 'sine', dec: 0.25 });
  const PENT = [0, 3, 5, 7, 10];
  for (let rk = 0; rk < NB; rk++) tone((RUN[1] + rk * 0.9 + 16) / FPS, 57 + 12 * Math.floor(rk / 5) + PENT[rk % 5], 0.07, -0.7 + 1.4 * rk / NB, { dec: 0.35 });
  pad(RUN[2], T.end + 40, [45, 52, 57, 60, 64], 0.02, 700);
  // the wave: a slow pulsing bass
  { const a = RUN[3] / FPS, b = T.end / FPS, o = ac.createOscillator(), g = ac.createGain(), lfo = ac.createOscillator(), lg = ac.createGain();
    o.type = 'triangle'; o.frequency.value = hz(33); lfo.frequency.value = 3 / (2 * Math.PI); lg.gain.value = 0.05;
    g.gain.setValueAtTime(0, a); g.gain.linearRampToValueAtTime(0.07, a + 0.6); g.gain.setValueAtTime(0.07, b - 0.4); g.gain.linearRampToValueAtTime(0, b);
    lfo.connect(lg).connect(g.gain); o.connect(g).connect(master); o.start(a); o.stop(b + 0.05); lfo.start(a); lfo.stop(b + 0.05); }
  pad(RUN[4], T.end + 40, [57, 64, 69, 72, 76], 0.016, 2200);
  [69, 72, 76, 79].forEach((m, i) => tone(RUN[4] / FPS + i * 0.06, m, 0.06, -0.4 + i * 0.25, { dec: 1.2 }));
  // the title: a hit, then a note per letter
  boom(RUN[5] / FPS, 140, 40, 0.7, 1.4);
  const word = 'bytepatterns';
  for (let i = 0; i < word.length; i++) tone((RUN[5] + 4 + i * 2.2 + 6) / FPS, 69 + 12 * Math.floor(i / 5) + PENT[i % 5], 0.08, -0.6 + 1.2 * i / word.length, { dec: 0.9 });
  [69, 73, 76, 81].forEach((m, i) => tone((T.end + 6 + i * 6) / FPS, m, 0.09, -0.45 + i * 0.3, { dec: 1.8 }));

  const buf = await ac.startRendering();
  let peak = 0; for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let k = 0; k < d.length; k++) peak = Math.max(peak, Math.abs(d[k])); }
  if (peak > 0.89) for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let k = 0; k < d.length; k++) d[k] *= 0.89 / peak; }
  return buf;
}

/* ==========================================================================
   VERTICAL CUT — shared block, identical in every piece.
   1080x1920 for Reels, Shorts and TikTok (__motion.variants.vertical). The
   piece's own scene code is re-used and recomposed for a phone: everything a
   viewer must read stays inside the area no platform covers (x 60..900,
   y 230..1400); outside it there is only dimmed texture.
   ========================================================================== */
const VW = 1080, VH = 1920, SAFE = { x: 60, y: 230, w: 840, h: 1170, r: 900, b: 1400 };
const vcv = document.createElement('canvas'); vcv.width = VW; vcv.height = VH;
const vx = vcv.getContext('2d', { willReadFrequently: true });   // CPU raster: identical pixels on every redraw
const VL = 96, VR = 864;                                          // text column inside the safe area

function vReset() {
  vx.setTransform(1, 0, 0, 1, 0, 0); vx.globalAlpha = 1; vx.globalCompositeOperation = 'source-over';
  vx.filter = 'none'; vx.shadowBlur = 0; vx.shadowColor = 'transparent'; vx.letterSpacing = '0px'; vx.setLineDash([]);
  vx.textAlign = 'left'; vx.textBaseline = 'alphabetic'; vx.lineCap = 'butt'; vx.lineJoin = 'miter';
}
/** Canvas text on the vertical frame; `max` shrinks the size until the line fits. */
function vText(str, x, y, { size = 40, weight = 700, color = '#FFFFFF', align = 'left', spacing = 0, alpha = 1, fam = FONT, max = 0 } = {}) {
  if (alpha <= 0.002 || !str) return size;
  vx.font = `${weight} ${size}px ${fam}`; vx.letterSpacing = spacing + 'px';
  if (max) { const w = vx.measureText(str).width; if (w > max) { size = size * max / w; vx.font = `${weight} ${size}px ${fam}`; } }
  vx.textAlign = align; vx.textBaseline = 'alphabetic';
  const a0 = vx.globalAlpha; vx.globalAlpha = a0 * alpha; vx.fillStyle = color;
  vx.fillText(str, x + (align === 'center' ? spacing / 2 : align === 'right' ? spacing : 0), y);   // tracking is added after the last glyph too
  vx.globalAlpha = a0; vx.letterSpacing = '0px';
  return size;
}
/** Word-wraps with the given font; returns the lines. */
function vWrap(str, maxW, size, weight = 700, fam = FONT) {
  vx.font = `${weight} ${size}px ${fam}`; vx.letterSpacing = '0px';
  const words = str.split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (vx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur);
  return lines;
}
/** Fade envelope with a small rise: [alpha, dy]. */
function vEnv(v, a, b, fin = 8, fout = 8) {
  const i = E.outCubic(prog(v, a, a + fin)), o = 1 - E.inCubic(prog(v, b - fout, b));
  return [Math.min(i, o), (1 - i) * 22 - (1 - o) * 10];
}
/** Which segment of a cut list a vertical frame is in: segs = [{ at, src, len }] in frames. */
function vSeg(segs, v) {
  let k = 0; while (k < segs.length - 1 && v >= segs[k + 1].at) k++;
  const s = segs[k];
  return { k, s, local: v - s.at, src: s.src + (v - s.at) };
}
/** Dims everything outside the safe area to a quiet texture (brightness x 0.2), with a soft inner edge. */
function vShade(rgb, a = 0.8, feather = 40) {
  vx.save(); vx.setTransform(1, 0, 0, 1, 0, 0); vx.globalAlpha = 1; vx.globalCompositeOperation = 'source-over';
  vx.fillStyle = `rgba(${rgb},${a})`;
  vx.beginPath(); vx.rect(0, 0, VW, VH); vx.rect(SAFE.x, SAFE.y, SAFE.w, SAFE.h); vx.fill('evenodd');
  const strip = (x0, y0, x1, y1, rx, ry, rw, rh) => {
    const g = vx.createLinearGradient(x0, y0, x1, y1);
    g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`);
    vx.fillStyle = g; vx.fillRect(rx, ry, rw, rh);
  };
  strip(SAFE.x, 0, SAFE.x + feather, 0, SAFE.x, SAFE.y, feather, SAFE.h);
  strip(SAFE.r, 0, SAFE.r - feather, 0, SAFE.r - feather, SAFE.y, feather, SAFE.h);
  strip(0, SAFE.y, 0, SAFE.y + feather, SAFE.x, SAFE.y, SAFE.w, feather);
  strip(0, SAFE.b, 0, SAFE.b - feather, SAFE.x, SAFE.b - feather, SAFE.w, feather);
  vx.restore();
}
/** Series tag at the top of the safe area, e.g. MADE IN CODE · 04. */
function vTag(label, color, alpha = 1) {
  vText('MADE IN CODE', VL, 292, { size: 28, weight: 800, color, spacing: 5, alpha });
  vx.font = `800 28px ${FONT}`; vx.letterSpacing = '5px';
  const w = vx.measureText('MADE IN CODE').width; vx.letterSpacing = '0px';
  vText('·  ' + label, VL + w + 14, 292, { size: 28, weight: 600, color: 'rgba(255,255,255,0.72)', spacing: 3, alpha, max: VR - VL - w - 14 });
}
/** Big hook lines, left-aligned from y0; visible from frame 0, settles in a few frames. */
function vHook(v, lines, y0, { size = 84, lh = 1.08, color = '#FFFFFF', accent = null, weight = 800, spacing = -1.5, alpha = 1 } = {}) {
  const k = E.outExpo(prog(v, -6, 12));
  lines.forEach((ln, i) => {
    const kk = E.outExpo(prog(v, -12 + i * 2, 8 + i * 2));
    vText(ln, VL, y0 + i * size * lh + (1 - kk) * 30, { size, weight, spacing, color: accent && i === lines.length - 1 ? accent : color, alpha: alpha * Math.max(0.25, kk), max: VR - VL });
  });
  return k;
}
/** Closing card, the last 60 frames: piece title, "drawn in code · bytepatterns.com". l = frames into the card. */
function vEndCard(l, { title, line = '', ink = '#FFFFFF', dim = 'rgba(255,255,255,0.66)', accent = '#FFFFFF', scrim = '0,0,0', a = 0.84 }) {
  const k = E.outCubic(prog(l, 0, 12));
  vx.save(); vx.setTransform(1, 0, 0, 1, 0, 0);
  vx.fillStyle = `rgba(${scrim},${a * k})`; vx.fillRect(0, 0, VW, VH);
  vx.restore();
  const t1 = E.outExpo(prog(l, 3, 19)), t2 = E.outExpo(prog(l, 11, 27)), t3 = E.outExpo(prog(l, 19, 35));
  vx.fillStyle = accent; vx.globalAlpha = t1; vx.fillRect(VL, 742, 88 * t1, 7); vx.globalAlpha = 1;
  const size = vText(title, VL, 850 + (1 - t1) * 40, { size: 92, weight: 800, color: ink, spacing: -2, alpha: t1, max: VR - VL });
  const y2 = 850 + Math.max(size, 60) * 0.25 + 70;
  vx.font = `600 44px ${FONT}`;
  const lead = 'drawn in code  ·  ', lw = vx.measureText(lead).width;
  vText(lead, VL, y2 + (1 - t2) * 24, { size: 44, weight: 600, color: dim, alpha: t2 });
  vText('bytepatterns.com', VL + lw, y2 + (1 - t2) * 24, { size: 44, weight: 800, color: accent, alpha: t2 });
  if (line) vText(line, VL, y2 + 72 + (1 - t3) * 18, { size: 32, weight: 500, color: dim, alpha: t3, max: VR - VL });
}
/** Seeks a cut. The first frame a page draws is drawn twice: the very first read of a
 *  GPU-backed source canvas can come out a shade different from every later one. */
let vWarm = false;
function vSeek(draw, i, frames) {
  const f = Math.max(0, Math.min(frames - 1, Math.floor(i)));
  if (!vWarm) { vWarm = true; draw(f); }
  draw(f);
}
/** The soundtrack of a cut: the piece's own audio() spliced to the same segments as the picture. */
async function vAudio(segs, frames, { xf = 0.025, fadeOut = 0.6, extra = null } = {}) {
  const src = await renderAudio();
  const SR = 48000, dur = frames / FPS, ac = new OfflineAudioContext(2, Math.round(SR * dur), SR);
  const out = ac.createGain(); out.connect(ac.destination);
  out.gain.setValueAtTime(1, 0); out.gain.setValueAtTime(1, dur - fadeOut); out.gain.linearRampToValueAtTime(0, dur - 0.01);
  segs.forEach((s, k) => {
    const at = s.at / FPS, off = s.src / FPS, d = s.len / FPS;
    const pre = k === 0 ? 0 : Math.min(xf, off), post = k === segs.length - 1 ? 0 : xf;
    const b = ac.createBufferSource(), g = ac.createGain(); b.buffer = src;
    g.gain.setValueAtTime(pre ? 0 : 1, at - pre);
    if (pre) g.gain.linearRampToValueAtTime(1, at + pre);
    if (post) { g.gain.setValueAtTime(1, at + d - post); g.gain.linearRampToValueAtTime(0, at + d + post); }
    b.connect(g).connect(out); b.start(at - pre, off - pre, d + pre + post);
  });
  if (extra) extra(ac, out);
  const buf = await ac.startRendering();
  let peak = 0; for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) peak = Math.max(peak, Math.abs(d[i])); }
  if (peak > 0.9) for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] *= 0.9 / peak; }
  return buf;
}
/** A soft three-partial bell, for the closing card. */
function vChime(ac, dest, at, freq, vol = 0.08) {
  for (const [mul, v, dec] of [[1, 1, 1.8], [2.01, 0.35, 0.8], [3.02, 0.12, 0.4]]) {
    const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.value = freq * mul;
    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol * v, at + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, at + dec);
    o.connect(g).connect(dest); o.start(at); o.stop(at + dec + 0.05);
  }
}

/* VERTICAL CUT — this piece */
// The editor on top, the preview under it, the caption between them; the last
// line grows the preview over the whole safe area for the title.
const VSEG = [{ at: 0, src: 0, len: 480 }, { at: 480, src: T.end, len: 60 }];
const VFR = 540, VEND = VFR - 60;
const VED = { x: SAFE.x, y: 470, w: SAFE.w, h: 470 }, VPV = { x: SAFE.x, y: 990, w: SAFE.w, h: 410 };
function vDraw(v) {
  const { src } = vSeg(VSEG, v), f = Math.min(FRAMES - 1, src);
  vReset();
  vx.fillStyle = C.bg; vx.fillRect(0, 0, VW, VH);
  const bigK = E.inOutCubic(prog(f, T.full + 6, T.full + 40));
  vTag('SIX LINES', C.amber, 1 - bigK);
  editor(vx, f, { x: VED.x, y: VED.y - bigK * 200, w: VED.w, h: VED.h }, { size: 30, lh: 62, alpha: 1 - bigK });
  const pr = { x: SAFE.x, y: lerp(VPV.y, SAFE.y, bigK), w: SAFE.w, h: lerp(VPV.h, SAFE.h, bigK) };
  preview(vx, f, pr, { big: bigK, titleSize: lerp(92, 128, bigK) });
  // hook, then the caption for the line that just ran
  if (f < RUN[0] + 4) {
    const o = 1 - E.inCubic(prog(f, RUN[0] - 10, RUN[0] + 4));
    vHook(v, ['Six lines of code.', 'Each one runs.'], 356, { size: 66, color: C.paper, accent: C.amber, alpha: o });
  }
  for (let l = 0; l < LINES.length; l++) {
    const b = l < LINES.length - 1 ? RUN[l + 1] : T.full + 10;
    const [al, dy] = vEnv(f, RUN[l] + 2, b, 8, 6);
    if (al <= 0.002) continue;
    const lines = vWrap(LINES[l].what, VR - VL - 70, 44, 700);
    vText(String(l + 1).padStart(2, '0'), VL, 386 + dy, { size: 40, weight: 700, fam: MONO, color: C.amber, alpha: al });
    lines.slice(0, 2).forEach((ln, i) => vText(ln, VL + 70, 386 + i * 52 + dy, { size: 44, weight: 700, color: C.paper, alpha: al }));
  }
  vShade('11,12,16');
  if (v >= VEND) vEndCard(v - VEND, { title: 'Six Lines', line: 'typed, run and drawn in code',
    ink: C.paper, dim: 'rgba(238,234,226,0.7)', accent: C.amber, scrim: '11,12,16', a: 0.93 });
  vReset();
}

window.__motion = {
  title: 'Six Lines',
  description: 'A title sequence typed live: six lines of code, each one running the moment it is entered, until the last one writes the title.',
  fps: FPS, width: W, height: H, frames: FRAMES,
  poster: 330,
  gifStart: 7,
  seek(i) { draw(Math.max(0, Math.min(FRAMES - 1, Math.floor(i)))); },
  audio: renderAudio,
  variants: {
    vertical: {
      width: VW, height: VH, frames: VFR, canvas: vcv,
      poster: 330, gifStart: 7,
      seek(i) { vSeek(vDraw, i, VFR); },
      audio: () => vAudio(VSEG, VFR),
    },
  },
};

/* ==========================================================================
   PLAYER — identical in every piece; keep as is.
   Autoplays and loops, starts sound on the first click, ?frame=N pauses on a
   frame, ?variant=vertical plays the vertical cut (if the piece has one).
   When the renderer sets window.__MOTION_RENDER__ it stays out of the way.
   ========================================================================== */
(function player() {
  const btn = document.getElementById('sound'), q = new URLSearchParams(location.search);
  let M = window.__motion;
  const V = !window.__MOTION_RENDER__ && M.variants && M.variants[q.get('variant')];
  if (V) {                                                // show the variant's own canvas instead
    M = Object.assign({}, M, V);
    V.canvas.style.cssText = `width:min(100vw,calc(100vh*${V.width}/${V.height}));height:auto;aspect-ratio:${V.width}/${V.height}`;
    document.querySelector('canvas').replaceWith(V.canvas);
  }
  const dur = M.frames / M.fps;
  if (window.__MOTION_RENDER__) { btn.hidden = true; M.seek(0); return; }
  if (q.has('frame')) { btn.hidden = true; M.seek(+q.get('frame') || 0); return; }
  let t0 = performance.now(), ac = null, src = null, buf = null, paused = false, pausedAt = 0;
  const clock = () => ac && src ? (ac.currentTime - t0) : (performance.now() - t0) / 1000;
  function loop() {
    if (!paused) M.seek(Math.floor(((clock() % dur) + dur) % dur * M.fps));
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  btn.addEventListener('click', async () => {
    if (src) { src.stop(); src = null; btn.textContent = 'Click for sound'; t0 = performance.now(); return; }
    btn.textContent = 'Loading sound…';
    ac = ac || new AudioContext({ sampleRate: 48000 });
    buf = buf || await M.audio();
    await ac.resume();
    src = ac.createBufferSource(); src.buffer = buf; src.loop = true; src.connect(ac.destination);
    t0 = ac.currentTime + 0.05; src.start(t0);        // picture restarts from frame 0 in sync with the sound
    btn.textContent = 'Sound on — click to mute';
  });
  addEventListener('keydown', e => {
    if (e.code !== 'Space') return;
    e.preventDefault(); paused = !paused;
    if (ac) paused ? ac.suspend() : ac.resume();
    if (!ac) { if (paused) pausedAt = performance.now(); else t0 += performance.now() - pausedAt; }
  });
})();
</script>
