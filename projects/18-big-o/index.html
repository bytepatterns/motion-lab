<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="teambytepatterns">
<meta name="description" content="Kinetic type against a twenty-second clock: O(1), O(log n), O(n), O(n log n) and O(n²) each count their own steps, then n grows to a million.">
<title>Big-O in 20 Seconds — motion-lab</title>
<style>
  /* Player chrome. The piece itself lives entirely in the canvas. */
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; font: 500 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; }
  canvas { display: block; width: min(100vw, calc(100vh * 16 / 9)); height: auto; aspect-ratio: 16 / 9; }
  #sound { position: fixed; left: 16px; bottom: 16px; padding: 8px 14px; border: 1px solid rgba(255,255,255,.35); border-radius: 999px;
           background: rgba(0,0,0,.55); color: #fff; font: inherit; cursor: pointer; }
  #sound[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080" aria-label="Kinetic typography: five Big-O complexity classes with step counters and a growing log-scale bar chart"></canvas>
<button id="sound" type="button">Click for sound</button>
<script>
'use strict';
/* ==========================================================================
   PIECE — Big-O in 20 Seconds.
   A clock counts twenty seconds down. Five complexity classes slam in one by
   one, each with a strip of n = 16 cells that does exactly that many steps
   (1, 4, 16, 64, 256) — and each step is a tick in the soundtrack, so O(n²)
   is heard as a buzz. Their bars stand on a log scale; then n grows to a
   million and the bars show the real step counts, and what they cost at one
   nanosecond per step.
   Determinism: every element is a closed-form function of the frame; the
   vertical cut runs the same scene code on its own, shorter clock.
   ========================================================================== */
const W = 1920, H = 1080, FPS = 30, FRAMES = 690;          // 23 s
const cv = document.getElementById('stage');
const ctx = cv.getContext('2d');
const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
const MONO = 'ui-monospace, "Cascadia Code", Consolas, Menlo, monospace';

// ---- helpers -------------------------------------------------------------
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (f, a, b) => clamp((f - a) / (b - a));
const smooth = t => t * t * (3 - 2 * t);
const E = {
  inCubic: t => t * t * t,
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inOutCubic: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outExpo: t => t === 1 ? 1 : 1 - Math.pow(2, -10 * t),
  inExpo: t => t === 0 ? 0 : Math.pow(2, 10 * t - 10),
  inOutExpo: t => t === 0 ? 0 : t === 1 ? 1 : t < .5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2,
  outBack: t => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2),
};
function text(g, str, x, y, { size = 40, weight = 600, color = '#fff', alpha = 1, spacing = 0, align = 'left', fam = FONT, base = 'alphabetic' } = {}) {
  if (alpha <= 0.002 || !str) return 0;
  g.font = `${weight} ${size}px ${fam}`; g.letterSpacing = spacing + 'px';
  g.textAlign = align; g.textBaseline = base;
  const a0 = g.globalAlpha; g.globalAlpha = a0 * alpha; g.fillStyle = color;
  g.fillText(str, x, y);
  const w = g.measureText(str).width;
  g.globalAlpha = a0; g.letterSpacing = '0px';
  return w;
}
const env = (f, a, b, fin = 12, fout = 10) => {
  const i = E.outCubic(prog(f, a, a + fin)), o = 1 - E.inCubic(prog(f, b - fout, b));
  return [Math.min(i, o), (1 - i) * 24 - (1 - o) * 10];
};

// ---- palette -------------------------------------------------------------
const C = { bg: '#0B0B10', bgRGB: '11,11,16', paper: '#F2EEE6', dim: 'rgba(242,238,230,0.62)', faint: 'rgba(242,238,230,0.16)',
  amber: '#F5B83D' };
const CLS = [
  { name: 'O(1)', short: '1', ex: 'array[i]: one step, any n', color: '#58C4B8', steps: n => 1 },
  { name: 'O(log n)', short: 'log n', ex: 'binary search: halve until one is left', color: '#6FA8FF', steps: n => Math.log2(n) },
  { name: 'O(n)', short: 'n', ex: 'one loop: look at everything once', color: '#F5B83D', steps: n => n },
  { name: 'O(n log n)', short: 'n log n', ex: 'merge sort: log n levels of n work', color: '#FF7A59', steps: n => n * Math.log2(n) },
  { name: 'O(n²)', short: 'n²', ex: 'nested loops: every pair', color: '#E6609F', steps: n => n * n },
];
const N0 = 16, N1 = 1e6;

// ---- timelines: the landscape piece and the vertical cut share the scene code ----
const TL_L = { F: FRAMES, cl0: 75, clLen: 72, grow0: 440, grow1: 560, punch: 572, end: 620, clock0: 15, secs: 20 };
const TL_V = { F: 540, cl0: 48, clLen: 54, grow0: 322, grow1: 420, punch: 428, end: 480, clock0: 15, secs: 15 };
const clsStart = (TL, i) => TL.cl0 + i * TL.clLen;
const nAt = (TL, f) => N0 * Math.pow(N1 / N0, E.inOutCubic(prog(f, TL.grow0 + 10, TL.grow1)));
/** Frame (local to the class) at which step s of class i happens, for the strip and for the ticks. */
function stepFrames(TL, i) {
  const s0 = 14, len = TL.clLen - 26, total = [1, 4, 16, 64, 256][i], out = [];
  for (let s = 0; s < total; s++) out.push(s0 + (i === 0 ? 0 : i === 1 ? s * len / 4 : s * len / total));
  return out;
}
const fmtSteps = v => fmtS(v).replace('.0', '');
const fmtS = v => v < 1e3 ? String(Math.round(v)) : v < 1e6 ? (v / 1e3).toFixed(v < 1e4 ? 1 : 0) + 'k' : v < 1e9 ? (v / 1e6).toFixed(v < 1e7 ? 1 : 1) + 'M' : v < 1e12 * 0.999 ? (v / 1e9).toFixed(1) + 'B' : (v / 1e12).toFixed(1) + 'T';
function fmtTime(ns) {
  if (ns < 1e3) return `${Math.round(ns)} ns`;
  if (ns < 1e6) return `${(ns / 1e3).toFixed(1)} µs`;
  if (ns < 1e9) return `${(ns / 1e6).toFixed(ns < 1e7 ? 1 : 0).replace('.0', '')} ms`;
  if (ns < 60e9) return `${(ns / 1e9).toFixed(1)} s`;
  return `${(ns / 60e9).toFixed(1)} min`;
}

// ---- kinetic type ------------------------------------------------------------------
/** Letters rise from under a baseline one after another (l = local frame), and leave upward at `out`. */
function slam(g, str, x, y, size, color, l, { out = 1e9, weight = 850, fam = FONT, spacing = -4, alpha = 1, stagger = 1.6 } = {}) {
  if (alpha <= 0.002 || l < -1) return 0;
  g.save();
  g.font = `${weight} ${size}px ${fam}`; g.letterSpacing = spacing + 'px'; g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  const total = g.measureText(str).width;
  g.beginPath(); g.rect(x - 40, y - size * 1.02, total + 120, size * 1.32); g.clip();
  g.fillStyle = color;
  const chars = [...str];
  let pre = '';
  chars.forEach((ch, j) => {
    const px = x + g.measureText(pre).width; pre += ch;
    const p = E.outExpo(prog(l, j * stagger, j * stagger + 13)), q = E.inCubic(prog(l, out + j * 0.8, out + j * 0.8 + 10));
    const a = alpha * p * (1 - q);
    if (a <= 0.002) return;
    g.globalAlpha = a;
    g.fillText(ch, px, y + (1 - p) * size * 0.95 - q * size * 1.1);
  });
  g.restore(); g.letterSpacing = '0px';
  return total;
}
function clockText(TL, f) {
  const rem = clamp(TL.secs - (f - TL.clock0) / FPS, 0, TL.secs);
  return rem.toFixed(1);
}

// ---- the strip: n = 16 cells doing exactly this class's steps ------------------------
function strip(g, i, x, y, l, TL, alpha, cell = 40, gap = 6, gridK = 0.36) {
  if (alpha <= 0.002) return;
  const col = CLS[i].color, sf = stepFrames(TL, i), done = sf.filter(t => l >= t).length;
  g.save(); g.globalAlpha = alpha;
  text(g, `n = ${N0}`, x, y - 22, { size: 30, weight: 700, fam: MONO, color: C.dim });
  text(g, `steps ${done}`, x + 16 * (cell + gap) - gap, y - 22, { size: 30, weight: 800, fam: MONO, color: col, align: 'right' });
  const box = (cx, cy, w, h, fill) => { g.fillStyle = fill; g.beginPath(); g.roundRect(cx, cy, w, h, Math.min(6, w / 4)); g.fill(); };
  const lit = (a = 1) => `rgba(${hexRGB(col)},${a})`;
  if (i <= 2) {
    let lo = 0, hi = 15;
    for (let k = 0; k < 16; k++) {
      let fill = 'rgba(242,238,230,0.12)';
      if (i === 0 && done && k === 11) fill = col;
      if (i === 2 && k < done) fill = k === done - 1 ? col : lit(0.45);
      box(x + k * (cell + gap), y, cell, cell, fill);
    }
    if (i === 1) {                                              // binary search for 11 in 0..15: 4 halvings
      const target = 11; lo = 0; hi = 15;
      for (let s = 0; s < done; s++) { const mid = (lo + hi) >> 1; if (mid < target) lo = mid + 1; else hi = mid; }
      for (let k = 0; k < 16; k++) if (k >= lo && k <= hi) box(x + k * (cell + gap), y, cell, cell, done ? lit(done === 4 ? 1 : 0.5) : 'rgba(242,238,230,0.12)');
      if (done) {
        g.strokeStyle = col; g.lineWidth = 3; g.beginPath(); g.roundRect(x + lo * (cell + gap) - 5, y - 5, (hi - lo + 1) * (cell + gap) - gap + 10, cell + 10, 9); g.stroke();
      }
    }
  } else if (i === 3) {                                         // log2(16) = 4 levels of 16
    const h = Math.round(cell * 0.42);
    for (let r = 0; r < 4; r++) for (let k = 0; k < 16; k++) {
      const s = r * 16 + k;
      box(x + k * (cell + gap), y + r * (h + 6), cell, h, s < done ? (s === done - 1 ? col : lit(0.5)) : 'rgba(242,238,230,0.12)');
    }
  } else {                                                      // 16 x 16 pairs
    const c2 = Math.round((16 * (cell + gap) - gap) / 16 * gridK), step = c2 + 2;
    for (let r = 0; r < 16; r++) for (let k = 0; k < 16; k++) {
      const s = r * 16 + k;
      g.fillStyle = s < done ? (s === done - 1 ? '#FFFFFF' : lit(0.75)) : 'rgba(242,238,230,0.12)';
      g.fillRect(x + k * step, y + r * step, c2, c2);
    }
  }
  g.restore();
}
function hexRGB(h) { const n = parseInt(h.slice(1), 16); return `${n >> 16},${(n >> 8) & 255},${n & 255}`; }

// ---- the chart: steps on a log scale, 1 .. 10^12 --------------------------------------
function chart(g, TL, f, L, alpha) {
  if (alpha <= 0.002) return;
  const n = nAt(TL, f), growing = f >= TL.grow0;
  g.save(); g.globalAlpha = alpha;
  const Y = v => L.y1 - Math.log10(Math.max(1, v)) / 12 * (L.y1 - L.y0);
  // grid
  [[1, '1'], [1e3, '1k'], [1e6, '1M'], [1e9, '1B'], [1e12, '1T']].forEach(([v, s]) => {
    const y = Y(v);
    g.fillStyle = C.faint; g.fillRect(L.x0, y - 1, L.x1 - L.x0, 2);
    text(g, s, L.x0 - 14, y + 10, { size: 28, weight: 600, fam: MONO, color: C.dim, align: 'right' });
  });
  const bw = L.bw, gap = (L.x1 - L.x0 - 5 * bw) / 6;
  text(g, growing ? `steps at n = ${Math.round(n).toLocaleString('en-US')}` : `steps at n = ${N0}`, L.x0, L.y0 - 34, { size: 30, weight: 700, color: C.paper });
  CLS.forEach((c, i) => {
    const t0 = clsStart(TL, i) + 16, k = E.outCubic(prog(f, t0, t0 + 14));
    if (k <= 0.002) return;
    const x = L.x0 + gap + i * (bw + gap), v = c.steps(n), top = lerp(L.y1, Y(v), k), hot = f >= TL.grow0 ? 1 : 1 - prog(f, t0 + 30, t0 + 50) * 0.3;
    g.globalAlpha = alpha * (0.35 + 0.65 * hot);
    g.fillStyle = c.color; g.fillRect(x, top, bw, Math.max(3, L.y1 - top));
    g.globalAlpha = alpha;
    text(g, c.short, x + bw / 2, L.y1 + 40, { size: 28, weight: 800, fam: MONO, color: c.color, align: 'center', alpha: k });
    text(g, fmtSteps(v), x + bw / 2, top - 14, { size: 28, weight: 700, fam: MONO, color: C.paper, align: 'center', alpha: k });
    if (L.times) text(g, fmtTime(v), x + bw / 2, L.y1 + 82, { size: 28, weight: 600, fam: MONO, color: C.dim, align: 'center', alpha: k * E.outCubic(prog(f, TL.grow1 - 20, TL.grow1)) });
  });
  if (L.times) text(g, 'at 1 ns per step', L.x1, L.y1 + 128, { size: 28, weight: 500, color: C.dim, align: 'right', alpha: E.outCubic(prog(f, TL.grow1 - 20, TL.grow1)) });
  g.restore();
}

// ---- landscape picture ------------------------------------------------------------------
const CH_L = { x0: 1230, x1: 1800, y0: 250, y1: 820, bw: 84, times: true };
function backdrop(g, w, h, f, TL) {
  g.fillStyle = C.bg; g.fillRect(0, 0, w, h);
  // a soft wash in the colour of the class on stage
  let i = Math.floor((f - TL.cl0) / TL.clLen); i = clamp(i, 0, 4);
  const c = f < TL.cl0 ? '245,184,61' : f >= TL.grow0 ? '230,96,159' : hexRGB(CLS[i].color);
  const gr = g.createRadialGradient(w * 0.2, h * 0.55, 20, w * 0.2, h * 0.55, Math.max(w, h) * 0.6);
  gr.addColorStop(0, `rgba(${c},0.10)`); gr.addColorStop(1, `rgba(${c},0)`);
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
}
function draw(f) {
  const TL = TL_L;
  if (ctx.reset) ctx.reset();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none'; ctx.shadowBlur = 0;
  backdrop(ctx, W, H, f, TL);
  const endK = E.inOutCubic(prog(f, TL.end, TL.end + 20)), a = 1 - endK;
  text(ctx, 'COMPLEXITY  ·  BIG-O', 120, 104, { size: 26, weight: 600, color: C.dim, spacing: 5, alpha: a });
  const cl = clockText(TL, f);
  text(ctx, cl + ' s', 1800, 108, { size: 44, weight: 800, fam: MONO, color: cl === '0.0' ? '#E6609F' : C.amber, align: 'right', alpha: a });
  // hook
  if (f < TL.cl0 + 4) {
    const out = TL.cl0 - 12;
    slam(ctx, 'Big-O', 110, 520, 300, C.paper, f + 22, { out: out + 22, spacing: -10 });
    slam(ctx, 'in 20 seconds.', 122, 650, 96, C.amber, f + 22, { out: out + 22, spacing: -2, stagger: 0.6 });
  }
  // the five classes
  CLS.forEach((c, i) => {
    const s = clsStart(TL, i), l = f - s;
    if (l < -2 || l > TL.clLen + 4) return;
    const out = TL.clLen - 12;
    slam(ctx, c.name, 110, 460, c.name.length > 6 ? 156 : 196, c.color, l, { out, spacing: -6 });
    slam(ctx, c.ex, 122, 560, 42, C.paper, l - 6, { out: out + 2, weight: 600, spacing: 0, stagger: 0.35 });
    const sa = E.outCubic(prog(l, 8, 16)) * (1 - E.inCubic(prog(l, out, out + 10)));
    strip(ctx, i, 122, 690, l, TL, sa * a);
  });
  // n grows
  {
    const g0 = TL.grow0, l = f - g0;
    if (l >= -2 && f < TL.end + 4) {
      slam(ctx, 'Now let n grow.', 110, 330, 100, C.paper, l, { out: TL.end - g0 - 6, spacing: -3 });
      const k = E.outCubic(prog(l, 8, 20)) * a;
      text(ctx, 'n = ' + Math.round(nAt(TL, f)).toLocaleString('en-US'), 116, 480, { size: 116, weight: 800, fam: MONO, color: C.amber, spacing: -4, alpha: k });
      const p = f - TL.punch;
      slam(ctx, 'Same n:', 116, 700, 64, C.paper, p, { out: TL.end - TL.punch - 6, spacing: -1 });
      slam(ctx, '20 ms or 17 minutes.', 112, 800, 80, '#E6609F', p - 8, { out: TL.end - TL.punch - 6, spacing: -2, stagger: 0.9 });
    }
  }
  chart(ctx, TL, f, CH_L, E.outCubic(prog(f, TL.cl0 + 6, TL.cl0 + 24)) * a);
  if (endK > 0) {
    ctx.fillStyle = `rgba(${C.bgRGB},${0.84 * endK})`; ctx.fillRect(0, 0, W, H);
    const l = f - TL.end;
    slam(ctx, 'Big-O in 20 Seconds', W / 2 - 700, 520, 136, C.paper, l - 6, { spacing: -3, stagger: 0.8 });
    const k2 = E.outCubic(prog(l, 20, 40)), k3 = E.outCubic(prog(l, 30, 52));
    text(ctx, 'O(1)  ·  O(log n)  ·  O(n)  ·  O(n log n)  ·  O(n²)', W / 2, 600 + (1 - k2) * 20, { size: 42, weight: 600, fam: MONO, color: C.amber, align: 'center', alpha: k2 });
    text(ctx, 'bytepatterns · motion lab', W / 2, 1000, { size: 32, weight: 600, color: C.paper, spacing: 3, align: 'center', alpha: k3 * 0.8 });
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.letterSpacing = '0px';
}

// ---- sound: a 120 BPM kit, a hit per class, one tick per step, five glissandi ------------
async function buildAudio(TL) {
  const SR = 48000, dur = TL.F / FPS, LEN = Math.round(SR * dur);
  const ac = new OfflineAudioContext(2, LEN, SR);
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -14; comp.ratio.value = 3.5; comp.attack.value = 0.004; comp.release.value = 0.18;
  const master = ac.createGain(); master.gain.value = 0.9; master.connect(comp).connect(ac.destination);
  master.gain.setValueAtTime(0.9, dur - 0.7); master.gain.linearRampToValueAtTime(0.0001, dur - 0.02);
  const rnd = mulberry32(0xB16);
  const ir = ac.createBuffer(2, SR * 1.8, SR);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let k = 0; k < d.length; k++) d[k] = (rnd() * 2 - 1) * Math.pow(1 - k / d.length, 4); }
  const verb = ac.createConvolver(); verb.buffer = ir; const vg = ac.createGain(); vg.gain.value = 0.25; verb.connect(vg).connect(master);
  const noise = ac.createBuffer(1, SR, SR); { const d = noise.getChannelData(0); for (let k = 0; k < d.length; k++) d[k] = rnd() * 2 - 1; }
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  const kick = (at, amp = 0.7) => { const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.setValueAtTime(140, at); o.frequency.exponentialRampToValueAtTime(42, at + 0.12);
    g.gain.setValueAtTime(amp, at); g.gain.exponentialRampToValueAtTime(0.001, at + 0.3); o.connect(g).connect(master); o.start(at); o.stop(at + 0.32); };
  const hat = (at, amp = 0.05, len = 0.04, f0 = 7000, pan = 0) => { const s = ac.createBufferSource(); s.buffer = noise;
    const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = f0;
    const g = ac.createGain(); g.gain.setValueAtTime(amp, at); g.gain.exponentialRampToValueAtTime(0.0001, at + len);
    const p = ac.createStereoPanner(); p.pan.value = pan;
    s.connect(hp).connect(g).connect(p).connect(master); s.start(at, (at * 13.7) % 0.9, len + 0.02); };
  const tone = (at, m, amp, len, type = 'triangle', pan = 0) => { const o = ac.createOscillator(), g = ac.createGain(), p = ac.createStereoPanner();
    o.type = type; o.frequency.value = hz(m); p.pan.value = pan;
    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(amp, at + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, at + len);
    o.connect(g).connect(p); p.connect(master); p.connect(verb); o.start(at); o.stop(at + len + 0.03); };
  // the kit: kick on the beat, hats off the beat, from the hook to the card
  for (let f = 0; f < TL.end; f += 15) { kick(f / FPS, f === 0 ? 0.8 : 0.5); hat((f + 7.5) / FPS, 0.045); }
  // bass: one note per class, then a rising line under the growth
  const BASS = [33, 36, 38, 41, 43];
  CLS.forEach((c, i) => {
    const s = clsStart(TL, i) / FPS;
    tone(s, BASS[i], 0.32, 1.4, 'sawtooth', 0); tone(s, BASS[i] + 36, 0.08, 0.5, 'sine', 0.2);
    hat(s, 0.22, 0.25, 1800, 0);                                    // the slam
    // one tick per step
    const sf = stepFrames(TL, i), amp = [0.2, 0.14, 0.09, 0.05, 0.03][i];
    sf.forEach((t, k) => { const at = (clsStart(TL, i) + t) / FPS; tone(at, 72 + i * 3 + (i === 1 ? k * 2 : 0), amp, 0.05, 'square', -0.5 + (k % 16) / 16); });
  });
  // the growth: five sustained voices, pitch follows log10(steps)
  {
    const a = TL.grow0 / FPS, b = (TL.end + 6) / FPS, n = Math.max(2, Math.round((b - a) * FPS));
    CLS.forEach((c, i) => {
      const o = ac.createOscillator(), g = ac.createGain(), p = ac.createStereoPanner(); o.type = 'sawtooth'; p.pan.value = -0.6 + i * 0.3;
      const fc = new Float32Array(n); for (let k = 0; k < n; k++) fc[k] = hz(40 + 5 * Math.log10(Math.max(1, c.steps(nAt(TL, TL.grow0 + k))))) ;
      o.frequency.setValueCurveAtTime(fc, a, b - a);
      const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1400;
      g.gain.setValueAtTime(0.0001, a); g.gain.exponentialRampToValueAtTime(0.035, a + 0.4); g.gain.setValueAtTime(0.035, b - 0.4); g.gain.exponentialRampToValueAtTime(0.0001, b);
      o.connect(lp).connect(g).connect(p); p.connect(master); p.connect(verb); o.start(a); o.stop(b + 0.05);
    });
    kick(TL.punch / FPS, 0.8); hat(TL.punch / FPS, 0.25, 0.4, 1200);
  }
  // the clock hits zero, then the card
  [69, 74, 78, 81].forEach((m, i) => tone((TL.end + 6 + i * 5) / FPS, m, 0.08, 1.6, 'sine', -0.45 + i * 0.3));
  const buf = await ac.startRendering();
  let peak = 0; for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let k = 0; k < d.length; k++) peak = Math.max(peak, Math.abs(d[k])); }
  if (peak > 0.89) for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let k = 0; k < d.length; k++) d[k] *= 0.89 / peak; }

const renderAudio = () => buildAudio(TL_L);

/* ==========================================================================
   VERTICAL CUT — shared block, identical in every piece.
   1080x1920 for Reels, Shorts and TikTok (__motion.variants.vertical). The
   piece's own scene code is re-used and recomposed for a phone: everything a
   viewer must read stays inside the area no platform covers (x 60..900,
   y 230..1400); outside it there is only dimmed texture.
   ========================================================================== */
const VW = 1080, VH = 1920, SAFE = { x: 60, y: 230, w: 840, h: 1170, r: 900, b: 1400 };
const vcv = document.createElement('canvas'); vcv.width = VW; vcv.height = VH;
const vx = vcv.getContext('2d', { willReadFrequently: true });   // CPU raster: identical pixels on every redraw
const VL = 96, VR = 864;                                          // text column inside the safe area

function vReset() {
  vx.setTransform(1, 0, 0, 1, 0, 0); vx.globalAlpha = 1; vx.globalCompositeOperation = 'source-over';
  vx.filter = 'none'; vx.shadowBlur = 0; vx.shadowColor = 'transparent'; vx.letterSpacing = '0px'; vx.setLineDash([]);
  vx.textAlign = 'left'; vx.textBaseline = 'alphabetic'; vx.lineCap = 'butt'; vx.lineJoin = 'miter';
}
/** Canvas text on the vertical frame; `max` shrinks the size until the line fits. */
function vText(str, x, y, { size = 40, weight = 700, color = '#FFFFFF', align = 'left', spacing = 0, alpha = 1, fam = FONT, max = 0 } = {}) {
  if (alpha <= 0.002 || !str) return size;
  vx.font = `${weight} ${size}px ${fam}`; vx.letterSpacing = spacing + 'px';
  if (max) { const w = vx.measureText(str).width; if (w > max) { size = size * max / w; vx.font = `${weight} ${size}px ${fam}`; } }
  vx.textAlign = align; vx.textBaseline = 'alphabetic';
  const a0 = vx.globalAlpha; vx.globalAlpha = a0 * alpha; vx.fillStyle = color;
  vx.fillText(str, x + (align === 'center' ? spacing / 2 : align === 'right' ? spacing : 0), y);   // tracking is added after the last glyph too
  vx.globalAlpha = a0; vx.letterSpacing = '0px';

}
/** Word-wraps with the given font; returns the lines. */
function vWrap(str, maxW, size, weight = 700, fam = FONT) {
  vx.font = `${weight} ${size}px ${fam}`; vx.letterSpacing = '0px';
  const words = str.split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (vx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur);
  return lines;
}
/** Fade envelope with a small rise: [alpha, dy]. */
function vEnv(v, a, b, fin = 8, fout = 8) {
  const i = E.outCubic(prog(v, a, a + fin)), o = 1 - E.inCubic(prog(v, b - fout, b));
  return [Math.min(i, o), (1 - i) * 22 - (1 - o) * 10];
}
/** Which segment of a cut list a vertical frame is in: segs = [{ at, src, len }] in frames. */
function vSeg(segs, v) {
  let k = 0; while (k < segs.length - 1 && v >= segs[k + 1].at) k++;
  const s = segs[k];
  return { k, s, local: v - s.at, src: s.src + (v - s.at) };
}
/** Dims everything outside the safe area to a quiet texture (brightness x 0.2), with a soft inner edge. */
function vShade(rgb, a = 0.8, feather = 40) {
  vx.save(); vx.setTransform(1, 0, 0, 1, 0, 0); vx.globalAlpha = 1; vx.globalCompositeOperation = 'source-over';
  vx.fillStyle = `rgba(${rgb},${a})`;
  vx.beginPath(); vx.rect(0, 0, VW, VH); vx.rect(SAFE.x, SAFE.y, SAFE.w, SAFE.h); vx.fill('evenodd');
  const strip = (x0, y0, x1, y1, rx, ry, rw, rh) => {
    const g = vx.createLinearGradient(x0, y0, x1, y1);
    g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`);
    vx.fillStyle = g; vx.fillRect(rx, ry, rw, rh);
  };
  strip(SAFE.x, 0, SAFE.x + feather, 0, SAFE.x, SAFE.y, feather, SAFE.h);
  strip(SAFE.r, 0, SAFE.r - feather, 0, SAFE.r - feather, SAFE.y, feather, SAFE.h);
  strip(0, SAFE.y, 0, SAFE.y + feather, SAFE.x, SAFE.y, SAFE.w, feather);
  strip(0, SAFE.b, 0, SAFE.b - feather, SAFE.x, SAFE.b - feather, SAFE.w, feather);
  vx.restore();
}
/** Series tag at the top of the safe area, e.g. MADE IN CODE · 04. */
function vTag(label, color, alpha = 1) {
  vText('MADE IN CODE', VL, 292, { size: 28, weight: 800, color, spacing: 5, alpha });
  vx.font = `800 28px ${FONT}`; vx.letterSpacing = '5px';
  const w = vx.measureText('MADE IN CODE').width; vx.letterSpacing = '0px';
  vText('·  ' + label, VL + w + 14, 292, { size: 28, weight: 600, color: 'rgba(255,255,255,0.72)', spacing: 3, alpha, max: VR - VL - w - 14 });
}
/** Big hook lines, left-aligned from y0; visible from frame 0, settles in a few frames. */
function vHook(v, lines, y0, { size = 84, lh = 1.08, color = '#FFFFFF', accent = null, weight = 800, spacing = -1.5, alpha = 1 } = {}) {
  const k = E.outExpo(prog(v, -6, 12));
  lines.forEach((ln, i) => {
    const kk = E.outExpo(prog(v, -12 + i * 2, 8 + i * 2));
    vText(ln, VL, y0 + i * size * lh + (1 - kk) * 30, { size, weight, spacing, color: accent && i === lines.length - 1 ? accent : color, alpha: alpha * Math.max(0.25, kk), max: VR - VL });
  });
  return k;
}
/** Closing card, the last 60 frames: piece title, "drawn in code · bytepatterns.com". l = frames into the card. */
function vEndCard(l, { title, line = '', ink = '#FFFFFF', dim = 'rgba(255,255,255,0.66)', accent = '#FFFFFF', scrim = '0,0,0', a = 0.84 }) {
  const k = E.outCubic(prog(l, 0, 12));
  vx.save(); vx.setTransform(1, 0, 0, 1, 0, 0);
  vx.fillStyle = `rgba(${scrim},${a * k})`; vx.fillRect(0, 0, VW, VH);
  vx.restore();
  const t1 = E.outExpo(prog(l, 3, 19)), t2 = E.outExpo(prog(l, 11, 27)), t3 = E.outExpo(prog(l, 19, 35));
  vx.fillStyle = accent; vx.globalAlpha = t1; vx.fillRect(VL, 742, 88 * t1, 7); vx.globalAlpha = 1;
  const size = vText(title, VL, 850 + (1 - t1) * 40, { size: 92, weight: 800, color: ink, spacing: -2, alpha: t1, max: VR - VL });
  const y2 = 850 + Math.max(size, 60) * 0.25 + 70;
  vx.font = `600 44px ${FONT}`;
  const lead = 'drawn in code  ·  ', lw = vx.measureText(lead).width;
  vText(lead, VL, y2 + (1 - t2) * 24, { size: 44, weight: 600, color: dim, alpha: t2 });
  vText('bytepatterns.com', VL + lw, y2 + (1 - t2) * 24, { size: 44, weight: 800, color: accent, alpha: t2 });
  if (line) vText(line, VL, y2 + 72 + (1 - t3) * 18, { size: 32, weight: 500, color: dim, alpha: t3, max: VR - VL });
}
/** Seeks a cut. The first frame a page draws is drawn twice: the very first read of a
 *  GPU-backed source canvas can come out a shade different from every later one. */
let vWarm = false;
function vSeek(draw, i, frames) {
  const f = Math.max(0, Math.min(frames - 1, Math.floor(i)));
  if (!vWarm) { vWarm = true; draw(f); }
  draw(f);
}
/** The soundtrack of a cut: the piece's own audio() spliced to the same segments as the picture. */
async function vAudio(segs, frames, { xf = 0.025, fadeOut = 0.6, extra = null } = {}) {
  const src = await renderAudio();
  const SR = 48000, dur = frames / FPS, ac = new OfflineAudioContext(2, Math.round(SR * dur), SR);
  const out = ac.createGain(); out.connect(ac.destination);
  out.gain.setValueAtTime(1, 0); out.gain.setValueAtTime(1, dur - fadeOut); out.gain.linearRampToValueAtTime(0, dur - 0.01);
  segs.forEach((s, k) => {
    const at = s.at / FPS, off = s.src / FPS, d = s.len / FPS;
    const pre = k === 0 ? 0 : Math.min(xf, off), post = k === segs.length - 1 ? 0 : xf;
    const b = ac.createBufferSource(), g = ac.createGain(); b.buffer = src;
    g.gain.setValueAtTime(pre ? 0 : 1, at - pre);
    if (pre) g.gain.linearRampToValueAtTime(1, at + pre);
    if (post) { g.gain.setValueAtTime(1, at + d - post); g.gain.linearRampToValueAtTime(0, at + d + post); }
    b.connect(g).connect(out); b.start(at - pre, off - pre, d + pre + post);
  });
  if (extra) extra(ac, out);
  const buf = await ac.startRendering();
  let peak = 0; for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) peak = Math.max(peak, Math.abs(d[i])); }
  if (peak > 0.9) for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] *= 0.9 / peak; }
  return buf;
}
/** A soft three-partial bell, for the closing card. */
function vChime(ac, dest, at, freq, vol = 0.08) {
  for (const [mul, v, dec] of [[1, 1, 1.8], [2.01, 0.35, 0.8], [3.02, 0.12, 0.4]]) {
    const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.value = freq * mul;
    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol * v, at + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, at + dec);
    o.connect(g).connect(dest); o.start(at); o.stop(at + dec + 0.05);
  }
}

/* VERTICAL CUT — this piece */
// Re-timed rather than cut: the same scene code on a 15-second clock, with the
// type stacked over the strip and the chart underneath.
const VFR = TL_V.F, VEND = TL_V.end;
const CH_V = { x0: 160, x1: 864, y0: 990, y1: 1256, bw: 100, times: true };
function vDraw(v) {
  const TL = TL_V, f = v;
  vReset();
  backdrop(vx, VW, VH, f, TL);
  vShade(C.bgRGB, 0.8);
  vTag('BIG-O', C.amber);
  const cl = clockText(TL, f);
  vText(cl + ' s', VR, 296, { size: 40, weight: 800, fam: MONO, color: cl === '0.0' ? '#E6609F' : C.amber, align: 'right', alpha: 1 - prog(v, VEND, VEND + 8) });
  if (f < TL.cl0 + 4) {
    slam(vx, 'Big-O', 90, 560, 230, C.paper, f + 22, { out: TL.cl0 - 12 + 22, spacing: -8 });
    slam(vx, 'in 15 seconds.', 100, 680, 84, C.amber, f + 22, { out: TL.cl0 - 12 + 22, spacing: -2, stagger: 0.6 });
  }
  CLS.forEach((c, i) => {
    const s = clsStart(TL, i), l = f - s;
    if (l < -2 || l > TL.clLen + 4) return;
    const out = TL.clLen - 10, ex = vWrap(c.ex, VR - VL, 36, 600);
    slam(vx, c.name, 92, 500, c.name.length > 6 ? 136 : 164, c.color, l, { out, spacing: -5 });
    ex.forEach((ln, j) => slam(vx, ln, VL, 572 + j * 44, 36, C.paper, l - 4 - j * 2, { out: out + 2, weight: 600, spacing: 0, stagger: 0.3 }));
    const sa = E.outCubic(prog(l, 8, 14)) * (1 - E.inCubic(prog(l, out, out + 8)));
    strip(vx, i, VL, 700, l, TL, sa, 41, 6, 0.24);
  });
  if (f >= TL.grow0 - 2 && f < TL.end + 4) {
    const l = f - TL.grow0;
    slam(vx, 'Now let n grow.', 92, 450, 84, C.paper, l, { out: TL.end - TL.grow0 - 6, spacing: -2 });
    vText('n = ' + Math.round(nAt(TL, f)).toLocaleString('en-US'), VL, 560, { size: 80, weight: 800, fam: MONO, color: C.amber, spacing: -3, alpha: E.outCubic(prog(l, 6, 16)), max: VR - VL });
    const p = f - TL.punch;
    slam(vx, 'Same n:', 94, 690, 56, C.paper, p, { out: 1e9, spacing: -1 });
    slam(vx, '20 ms or 17 min.', 92, 780, 76, '#E6609F', p - 6, { out: 1e9, spacing: -2, stagger: 0.9 });
  }
  chart(vx, TL, f, CH_V, E.outCubic(prog(f, TL.cl0 + 6, TL.cl0 + 20)) * (1 - prog(v, VEND, VEND + 10)));
  if (v >= VEND) vEndCard(v - VEND, { title: 'Big-O in 15 Seconds', line: 'the short cut of Big-O in 20 Seconds',
    ink: C.paper, dim: 'rgba(242,238,230,0.72)', accent: C.amber, scrim: C.bgRGB, a: 0.86 });
  vReset();
}

window.__motion = {
  title: 'Big-O in 20 Seconds',
  description: 'Kinetic type against a twenty-second clock: O(1), O(log n), O(n), O(n log n) and O(n²) each count their own steps, then n grows to a million.',
  fps: FPS, width: W, height: H, frames: FRAMES,
  poster: 400,
  gifStart: 11,
  seek(i) { draw(Math.max(0, Math.min(FRAMES - 1, Math.floor(i)))); },
  audio: renderAudio,
  variants: {
    vertical: {
      width: VW, height: VH, frames: VFR, canvas: vcv,
      poster: 285, gifStart: 8,
      seek(i) { vSeek(vDraw, i, VFR); },
      audio: () => buildAudio(TL_V),
    },
  },
};

/* ==========================================================================
   PLAYER — identical in every piece; keep as is.
   Autoplays and loops, starts sound on the first click, ?frame=N pauses on a
   frame, ?variant=vertical plays the vertical cut (if the piece has one).
   When the renderer sets window.__MOTION_RENDER__ it stays out of the way.
   ========================================================================== */
(function player() {
  const btn = document.getElementById('sound'), q = new URLSearchParams(location.search);
  let M = window.__motion;
  const V = !window.__MOTION_RENDER__ && M.variants && M.variants[q.get('variant')];
  if (V) {                                                // show the variant's own canvas instead
    M = Object.assign({}, M, V);
    V.canvas.style.cssText = `width:min(100vw,calc(100vh*${V.width}/${V.height}));height:auto;aspect-ratio:${V.width}/${V.height}`;
    document.querySelector('canvas').replaceWith(V.canvas);
  }
  const dur = M.frames / M.fps;
  if (window.__MOTION_RENDER__) { btn.hidden = true; M.seek(0); return; }
  if (q.has('frame')) { btn.hidden = true; M.seek(+q.get('frame') || 0); return; }
  let t0 = performance.now(), ac = null, src = null, buf = null, paused = false, pausedAt = 0;
  const clock = () => ac && src ? (ac.currentTime - t0) : (performance.now() - t0) / 1000;
  function loop() {
    if (!paused) M.seek(Math.floor(((clock() % dur) + dur) % dur * M.fps));
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  btn.addEventListener('click', async () => {
    if (src) { src.stop(); src = null; btn.textContent = 'Click for sound'; t0 = performance.now(); return; }
    btn.textContent = 'Loading sound…';
    ac = ac || new AudioContext({ sampleRate: 48000 });
    buf = buf || await M.audio();
    await ac.resume();
    src = ac.createBufferSource(); src.buffer = buf; src.loop = true; src.connect(ac.destination);
    t0 = ac.currentTime + 0.05; src.start(t0);        // picture restarts from frame 0 in sync with the sound
    btn.textContent = 'Sound on — click to mute';
  });
  addEventListener('keydown', e => {
    if (e.code !== 'Space') return;
    e.preventDefault(); paused = !paused;
    if (ac) paused ? ac.suspend() : ac.resume();
    if (!ac) { if (paused) pausedAt = performance.now(); else t0 += performance.now() - pausedAt; }
  });
})();
