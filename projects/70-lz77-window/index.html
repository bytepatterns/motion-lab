<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="teambytepatterns">
<meta name="description" content="LZ77 reads a 59-character tongue twister left to right, keeps the last 32 characters as a window, and replaces every repeat of three or more with a pointer back into it: 19 letters and 10 copies, 29 tokens in all, 271 bits instead of 472, 57 percent of the size; the final she sells is 50 characters back, outside the window, so it is rebuilt from three shorter copies.">
<title>LZ77: Copy from the Window — motion-lab</title>
<style>
  /* Player chrome. The piece itself lives entirely in the canvas. */
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; font: 500 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; }
  canvas { display: block; width: min(100vw, calc(100vh * 16 / 9)); height: auto; aspect-ratio: 16 / 9; }
  #sound { position: fixed; left: 16px; bottom: 16px; padding: 8px 14px; border: 1px solid rgba(255,255,255,.35); border-radius: 999px;
           background: rgba(0,0,0,.55); color: #fff; font: inherit; cursor: pointer; }
  #sound[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080" aria-label="A line of text in letter cells is read left to right; a teal band marks the window of recent letters behind the cursor; when the next letters already appear in the window, an arc jumps back to them and a pointer token is added to the output row, otherwise a single letter is; two bars below compare the raw size with the compressed size"></canvas>
<button id="sound" type="button">Click for sound</button>
<script>
'use strict';
/* ==========================================================================
   PIECE — LZ77: Copy from the Window.
   LZ77 (Lempel and Ziv, 1977) compresses by pointing back. It reads the
   text left to right and keeps the last W characters as a window. At each
   position it looks for the longest run in the window that matches what
   comes next (the run may reach into the look-ahead). A match of at least
   MIN characters is written as a pointer (back o, copy l); anything shorter
   is written as the letter itself.
   Here each token starts with one flag bit: a letter costs 1 + 8 bits, a
   pointer 1 + 5 bits of offset (W = 32) + 4 bits of length (3..18).
   The text is fixed; the tokens, the search at every position and every
   running total are computed once at load. A frame maps to a step of that
   record, so seek(i) is pure in i.
   ========================================================================== */
const W = 1920, H = 1080, FPS = 30;
const cv = document.getElementById('stage');
const ctx = cv.getContext('2d', { willReadFrequently: true });   // CPU raster: identical pixels on every redraw
const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
const MONO = 'ui-monospace, "Cascadia Code", Consolas, Menlo, monospace';

// ---- helpers -------------------------------------------------------------
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (f, a, b) => clamp((f - a) / (b - a));
const smooth = t => t * t * (3 - 2 * t);
const E = {
  inCubic: t => t * t * t,
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inOutCubic: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outExpo: t => t === 1 ? 1 : 1 - Math.pow(2, -10 * t),
  inExpo: t => t === 0 ? 0 : Math.pow(2, 10 * t - 10),
  inOutExpo: t => t === 0 ? 0 : t === 1 ? 1 : t < .5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2,
  outBack: t => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2),
};
/** Canvas text; `max` shrinks the size until the line fits. Returns the width drawn. */
function text(g, str, x, y, { size = 40, weight = 600, color = '#fff', alpha = 1, spacing = 0, align = 'left', fam = FONT, base = 'alphabetic', max = 0 } = {}) {
  if (alpha <= 0.002 || !str) return 0;
  g.font = `${weight} ${size}px ${fam}`; g.letterSpacing = spacing + 'px';
  if (max) { const w0 = g.measureText(str).width; if (w0 > max) { size *= max / w0; g.font = `${weight} ${size}px ${fam}`; } }
  g.textAlign = align; g.textBaseline = base;
  const a0 = g.globalAlpha; g.globalAlpha = a0 * alpha; g.fillStyle = color;
  g.fillText(str, x, y);
  const w = g.measureText(str).width;
  g.globalAlpha = a0; g.letterSpacing = '0px';
  return w;
}
const measure = (g, str, size, weight = 800, fam = FONT, spacing = 0) => { g.font = `${weight} ${size}px ${fam}`; g.letterSpacing = spacing + 'px'; const w = g.measureText(str).width; g.letterSpacing = '0px'; return w; };
const env = (f, a, b, fin = 12, fout = 10) => {
  const i = E.outCubic(prog(f, a, a + fin)), o = 1 - E.inCubic(prog(f, b - fout, b));
  return [Math.min(i, o), (1 - i) * 24 - (1 - o) * 10];
};


// ---- palette -------------------------------------------------------------
const C = {
  bg: '#0B0D14', bgRGB: '11,13,20', paper: '#F1EEE6', paperRGB: '241,238,230', dim: 'rgba(241,238,230,0.62)', faint: 'rgba(241,238,230,0.16)',
  accent: '#FFC857', accentRGB: '255,200,87', go: '#5CD6CB', goRGB: '92,214,203', no: '#FF5E6C', node: '#151A28',
  blue: '#8FA8FF', blueRGB: '143,168,255',
};

// ---- the text and its tokens ----------------------------------------------------------------
const TEXT = 'she sells sea shells on the sea shore, the shells she sells';
const N = TEXT.length, WIN = 32, MIN = 3, MAXL = 18;
const OBITS = Math.log2(WIN), LBITS = Math.ceil(Math.log2(MAXL - MIN + 1));
const LITB = 1 + 8, PTRB = 1 + OBITS + LBITS;
const TOK = (function () {
  const out = []; let i = 0;
  while (i < N) {
    let bl = 0, bo = 0;
    for (let j = Math.max(0, i - WIN); j < i; j++) {
      let l = 0; while (i + l < N && TEXT[j + l] === TEXT[i + l] && l < MAXL) l++;
      if (l > bl || (l === bl && l > 0 && i - j < bo)) { bl = l; bo = i - j; }
    }
    if (bl >= MIN) { out.push({ i, o: bo, l: bl, bits: PTRB }); i += bl; }
    else { out.push({ i, c: TEXT[i], l: 1, bits: LITB, near: bl }); i++; }
  }
  let b = 0; out.forEach(t => { b += t.bits; t.cum = b; });
  return out;
})();
const NT = TOK.length, NLIT = TOK.filter(t => t.c !== undefined).length, NPTR = NT - NLIT;
const RAWB = N * 8, OUTB = TOK[NT - 1].cum, PCT = Math.round(OUTB / RAWB * 100);
const LONG = TOK.filter(t => t.o).reduce((a, t) => t.l > a.l || (t.l === a.l && !a.o) ? t : a, { l: 0 });
const PH = TEXT.slice(0, TEXT.indexOf(' ', TEXT.indexOf(' ') + 1)), PHI = TEXT.lastIndexOf(PH), PHD = PHI - TEXT.indexOf(PH);
const PHT = TOK.filter(t => t.i < PHI + PH.length && t.i + t.l > PHI);
const FIRSTP = TOK.findIndex(t => t.o);
const show = ch => ch === ' ' ? '·' : ch;
const qs = s => '“' + s + '”';

// ---- timeline -------------------------------------------------------------------------------
function buildTL(o) {
  const T = Object.assign({}, o);
  let t = T.t0; T.tk = TOK.map(tk => { const e = { a: t, d: tk.o ? T.mat : T.lit }; t += e.d; return e; });
  T.t1 = t; T.calm = T.t1 + T.hold; T.end = Math.round(T.calm + T.calmT);
  const at = k => T.tk[Math.max(0, Math.min(NT - 1, k))].a;
  const kLong = TOK.indexOf(LONG), kPh = TOK.indexOf(PHT[0]);
  T.caps = [
    [T.g0, at(FIRSTP) - 2, `Read left to right and keep the last ${WIN} characters|as a window to copy from.`],
    [at(FIRSTP), at(FIRSTP + 3) - 2, `A repeat becomes a pointer: go back ${TOK[FIRSTP].o}, copy ${TOK[FIRSTP].l}.|Fewer than ${MIN} in a row: write the letter itself.`],
    [at(FIRSTP + 3), at(kLong) - 2, `A letter costs ${LITB} bits, a pointer ${PTRB}:|one flag, ${OBITS} bits back, ${LBITS} bits of length.`],
    [at(kLong), at(kPh) - 2, `The longest copy: ${LONG.l} characters, ${qs(TEXT.substr(LONG.i, LONG.l).replace(/ /g, '·'))},|from ${LONG.o} back.`],
    [at(kPh), T.t1 + 10, `The first ${qs(PH)} is ${PHD} back, outside the window:|it is rebuilt from ${PHT.length} shorter copies.`],
    [T.t1 + 10, T.calm - 2, `${N} characters, ${RAWB} bits, became ${NT} tokens:|${NLIT} letters and ${NPTR} copies, ${OUTB} bits.`],
  ];
  return T;
}
/** Token k in progress at frame f (-1 before the first) and how far into it. */
function stateAt(T, f) {
  let k = -1; for (let q = 0; q < NT; q++) { if (f >= T.tk[q].a) k = q; else break; }
  if (k < 0) return { k, u: 0, pos: 0, emitted: 0 };
  const e = T.tk[k], u = clamp((f - e.a) / e.d);
  const emitted = k + (u >= 0.72 ? 1 : 0);
  return { k, u, pos: u >= 0.92 ? TOK[k].i + TOK[k].l : TOK[k].i, emitted };
}

// ---- drawing ------------------------------------------------------------------------------
const cellXY = (G, q) => [G.x0 + (q % G.cols) * G.cw, G.y0 + Math.floor(q / G.cols) * G.rh];
function tape(g, G, f, S) {
  const T = G.TL, [a] = env(f, T.g0 - 6, T.end + 14, 16, 20);
  if (a <= 0) return;
  const tk = S.k >= 0 ? TOK[S.k] : null, u = S.u;
  const w0 = Math.max(0, S.pos - WIN);
  // the window: a teal band behind the last WIN characters
  const wa = a * E.outCubic(prog(f, T.t0 - 20, T.t0));
  for (let q = w0; q < S.pos; q++) {
    const [x, y] = cellXY(G, q);
    g.save(); g.globalAlpha = wa; g.fillStyle = `rgba(${C.goRGB},0.12)`; g.fillRect(x, y, G.cw, G.ch); g.restore();
  }
  // window outline per row
  const rowsIn = new Map();
  for (let q = w0; q < S.pos; q++) { const r = Math.floor(q / G.cols); if (!rowsIn.has(r)) rowsIn.set(r, [q, q]); rowsIn.get(r)[1] = q; }
  g.save(); g.globalAlpha = wa; g.strokeStyle = `rgba(${C.goRGB},0.75)`; g.lineWidth = 2.5;
  for (const [, [q0, q1]] of rowsIn) { const [x0, y] = cellXY(G, q0), [x1] = cellXY(G, q1); g.beginPath(); g.roundRect(x0 - 2, y - 2, x1 - x0 + G.cw + 4, G.ch + 4, 8); g.stroke(); }
  g.restore();
  if (S.pos > 0 && S.pos < N) { const [x, y] = cellXY(G, Math.max(w0, 0)); text(g, S.pos > WIN ? `WINDOW · LAST ${WIN}` : 'WINDOW', x, y - 14, { size: 28, weight: 800, color: C.go, spacing: 3, alpha: wa * 0.9 }); }
  // the search: a scan head sweeps the window, then the match lights up
  let src = -1, len = 0;
  if (tk && S.pos === tk.i) {
    const scanU = clamp(u / 0.35);
    if (scanU < 1 && tk.i > 0) {
      const q = Math.floor(lerp(Math.max(0, tk.i - WIN), tk.i, scanU));
      const [x, y] = cellXY(G, q); g.save(); g.globalAlpha = a * 0.9; g.strokeStyle = C.paper; g.lineWidth = 3; g.strokeRect(x + 2, y + 2, G.cw - 4, G.ch - 4); g.restore();
    }
    if (tk.o && u >= 0.3) { src = tk.i - tk.o; len = tk.l; }
  }
  // cells
  for (let q = 0; q < N; q++) {
    const [x, y] = cellXY(G, q), ia = a * E.outCubic(prog(f, T.g0 + q * 0.7, T.g0 + 12 + q * 0.7));
    if (ia <= 0) continue;
    const isCur = tk && S.pos === tk.i && q >= tk.i && q < tk.i + tk.l && u >= 0.3;
    const isSrc = src >= 0 && q >= src && q < src + len;
    const done = q < S.pos, outside = q < w0;
    let fill = C.node, ink = C.paper, al = 1;
    if (isCur) { fill = tk.o ? `rgba(${C.accentRGB},0.9)` : `rgba(${C.blueRGB},0.85)`; ink = C.bg; }
    else if (isSrc) { fill = `rgba(${C.goRGB},0.85)`; ink = C.bg; }
    else if (outside) al = 0.35;
    else if (!done) al = 0.75;
    g.save(); g.globalAlpha = ia * al; g.fillStyle = fill; g.beginPath(); g.roundRect(x + 3, y + 3, G.cw - 6, G.ch - 6, 7); g.fill(); g.restore();
    text(g, show(TEXT[q]), x + G.cw / 2, y + G.ch / 2 + 2, { size: G.fs, weight: 800, color: TEXT[q] === ' ' && !isCur && !isSrc ? C.dim : ink, align: 'center', base: 'middle', fam: MONO, alpha: ia * al });
  }
  // cursor
  if (S.pos < N && S.k >= 0) { const [x, y] = cellXY(G, S.pos); g.save(); g.globalAlpha = a; g.fillStyle = C.accent; g.fillRect(x - 2, y - 8, 4, G.ch + 16); g.restore(); }
  // the pointer arc
  if (src >= 0) {
    const k = E.outCubic(prog(u, 0.3, 0.6)), [sx, sy] = cellXY(G, src), [tx, ty] = cellXY(G, tk.i);
    const x0 = tx + G.cw / 2, y0 = ty - 4, x1 = sx + G.cw / 2, y1 = sy - 4, lift = Math.min(G.lift, 30 + Math.abs(x1 - x0) * 0.35);
    g.save(); g.globalAlpha = a; g.strokeStyle = C.accent; g.lineWidth = 4; g.lineCap = 'round';
    const cx = (x0 + x1) / 2, cy = Math.min(y0, y1) - lift;
    g.beginPath(); for (let s = 0; s <= 1.0001; s += 0.04) { const v = s * k, px = (1 - v) * (1 - v) * x0 + 2 * v * (1 - v) * cx + v * v * x1, py = (1 - v) * (1 - v) * y0 + 2 * v * (1 - v) * cy + v * v * y1; s === 0 ? g.moveTo(px, py) : g.lineTo(px, py); } g.stroke();
    g.restore();
    const la = E.outBack(prog(u, 0.45, 0.62));
    const lab = `back ${tk.o}, copy ${tk.l}`, lw = measure(g, lab, 28, 850, MONO) + 24, lx = clamp(cx - lw / 2, G.x0, G.x0 + G.cols * G.cw - lw), ly = Math.min(y0, y1) - lift * 0.5 - 48;
    g.save(); g.globalAlpha = a * clamp(la); g.fillStyle = C.bg; g.beginPath(); g.roundRect(lx, ly, lw, 42, 10); g.fill(); g.strokeStyle = C.accent; g.lineWidth = 2; g.stroke(); g.restore();
    text(g, lab, lx + lw / 2, ly + 22, { size: 28, weight: 850, color: C.accent, align: 'center', base: 'middle', fam: MONO, alpha: a * clamp(la) });
  }
}
function tokW(g, t) { return t.o ? measure(g, `${t.o},${t.l}`, 30, 850, MONO) + 30 : 40; }
function output(g, G, f, S) {
  const T = G.TL, O = G.O, [a] = env(f, T.t0 - 10, T.end + 14, 12, 20);
  if (a <= 0) return;
  text(g, 'OUTPUT', O.x, O.y - 18, { size: 28, weight: 800, color: C.dim, spacing: 3, alpha: a });
  let x = O.x, y = O.y;
  for (let q = 0; q < NT; q++) {
    const t = TOK[q], w = tokW(g, t);
    if (x + w > O.x + O.w) { x = O.x; y += O.rh; }
    if (q < S.emitted) {
      const e = T.tk[q], ka = E.outBack(prog(f, e.a + e.d * 0.72, e.a + e.d * 0.72 + 8));
      g.save(); g.globalAlpha = a * clamp(ka); g.translate(x + w / 2, y + O.h / 2); const s = 0.6 + 0.4 * clamp(ka); g.scale(s, s);
      g.fillStyle = t.o ? `rgba(${C.accentRGB},0.18)` : C.node; g.strokeStyle = t.o ? C.accent : 'rgba(241,238,230,0.35)'; g.lineWidth = 2;
      g.beginPath(); g.roundRect(-w / 2 + 2, -O.h / 2, w - 4, O.h, 8); g.fill(); g.stroke(); g.restore();
      text(g, t.o ? `${t.o},${t.l}` : show(t.c), x + w / 2, y + O.h / 2 + 2, { size: 30, weight: 850, color: t.o ? C.accent : C.paper, align: 'center', base: 'middle', fam: MONO, alpha: a * clamp(ka) });
    }
    x += w + 6;
  }
}
function bars(g, G, f, S) {
  const T = G.TL, B = G.B, [a] = env(f, T.t0 - 10, T.calm, 12, 10);
  if (a <= 0) return;
  const rawB = Math.min(N, S.pos) * 8, outB = S.emitted > 0 ? TOK[S.emitted - 1].cum : 0, sc = B.w / RAWB;
  const row = (y, bits, col, lab) => {
    g.save(); g.globalAlpha = a; g.fillStyle = 'rgba(241,238,230,0.08)'; g.fillRect(B.x, y, B.w, B.h); g.fillStyle = col; g.fillRect(B.x, y, bits * sc, B.h); g.restore();
    text(g, lab, B.x, y - 10, { size: B.fs, weight: 750, color: C.paper, fam: MONO, alpha: a });
  };
  row(B.y, rawB, `rgba(${C.paperRGB},0.55)`, `raw  ${Math.min(N, S.pos)} chars × 8 = ${rawB} bits`);
  row(B.y + B.gap, outB, C.accent, `LZ77  ${S.emitted} tokens = ${outB} bits`);
}
function caption(g, G, f) {
  for (const [t0, t1, str] of G.TL.caps) {
    const [a, dy] = env(f, t0, t1, 10, 8); if (a <= 0) continue;
    const [p1, p2] = str.split('|');
    if (G.capTwo) {
      text(g, p1, G.capX, G.capY + dy, { size: G.cap, weight: 850, color: C.paper, spacing: -1, alpha: a, max: G.capMax });
      text(g, p2, G.capX, G.capY + G.cap * 1.14 + dy, { size: G.cap, weight: 850, color: C.accent, spacing: -1, alpha: a, max: G.capMax });
    } else {
      const w1 = measure(g, p1 + ' ', G.cap, 850, FONT, -1), w2 = measure(g, p2, G.cap, 850, FONT, -1), sc = Math.min(1, G.capMax / (w1 + w2));
      const w = text(g, p1 + ' ', G.capX, G.capY + dy, { size: G.cap * sc, weight: 850, color: C.paper, spacing: -1, alpha: a });
      text(g, p2, G.capX + w, G.capY + dy, { size: G.cap * sc, weight: 850, color: C.accent, spacing: -1, alpha: a });
    }
  }
}
function readout(g, G, f, S) {
  const T = G.TL, [a] = env(f, T.t0, T.calm, 12, 10);
  if (a <= 0) return;
  const outB = S.emitted > 0 ? TOK[S.emitted - 1].cum : 0, lit = TOK.slice(0, S.emitted).filter(t => !t.o).length;
  text(g, `letters ${lit}  ·  copies ${S.emitted - lit}  ·  read ${Math.min(N, S.pos)} / ${N}  ·  size ${S.pos ? Math.round(outB / (S.pos * 8) * 100) : 0}%`, G.foX, G.foY, { size: G.fo, weight: 700, color: C.paper, fam: MONO, alpha: a, max: G.foMax });
}
function finale(g, G, f) {
  const T = G.TL, k1 = E.outCubic(prog(f, T.calm, T.calm + 18)), k2 = E.outCubic(prog(f, T.calm + 10, T.calm + 28));
  if (k1 <= 0) return;
  const out = 1 - E.inCubic(prog(f, T.end - 6, T.end + 12));
  g.save(); g.fillStyle = `rgba(${C.bgRGB},${0.86 * k1 * out})`; g.fillRect(0, G.fnBand[0], G.w, G.fnBand[1] - G.fnBand[0]); g.restore();
  text(g, `${OUTB} bits, not ${RAWB}.`, G.fnX, G.fnY, { size: G.fn, weight: 900, color: C.paper, spacing: -2, align: G.fnAlign, alpha: k1 * out, max: G.fnMax });
  if (G.fnTwo) {
    text(g, `${PCT}% of the size, from`, G.fnX, G.fnY + G.fn * 1.05, { size: G.fn * 0.55, weight: 850, color: C.accent, spacing: -1, align: G.fnAlign, alpha: k2 * out, max: G.fnMax });
    text(g, `${NLIT} letters and ${NPTR} copies.`, G.fnX, G.fnY + G.fn * 1.75, { size: G.fn * 0.55, weight: 850, color: C.accent, spacing: -1, align: G.fnAlign, alpha: k2 * out, max: G.fnMax });
  } else text(g, `${PCT}% of the size  ·  ${NT} tokens: ${NLIT} letters, ${NPTR} copies  ·  a ${WIN}-character window`, G.fnX, G.fnY + G.fn * 1.05, { size: G.fn * 0.5, weight: 850, color: C.accent, spacing: -1, align: G.fnAlign, alpha: k2 * out, max: G.fnMax });
}
function scene(g, G, f) {
  const S = stateAt(G.TL, f);
  tape(g, G, f, S); output(g, G, f, S); bars(g, G, f, S);
  caption(g, G, f); readout(g, G, f, S); finale(g, G, f);
}

// ---- landscape picture ------------------------------------------------------------------
const TLL = buildTL({ g0: 34, t0: 110, lit: 11, mat: 30, hold: 60, calmT: 36 });
const FRAMES = TLL.end + 72;
const GL = { TL: TLL, w: W, h: H, cols: 30, cw: 56, ch: 70, rh: 150, x0: 120, y0: 400, fs: 38, lift: 110,
  O: { x: 120, y: 720, w: 1680, h: 50, rh: 62 },
  B: { x: 120, y: 902, w: 1680, h: 16, gap: 60, fs: 28 },
  capX: 120, capY: 216, cap: 50, capTwo: false, capMax: 1680,
  fo: 30, foX: 120, foY: 1030, foMax: 1680,
  fn: 100, fnX: W / 2, fnY: 600, fnAlign: 'center', fnMax: 1680, fnBand: [290, 1060] };
function hookL(f) {
  const o = 1 - E.inCubic(prog(f, TLL.g0 - 14, TLL.g0 + 4));
  if (o <= 0) return;
  const k = E.outExpo(prog(f, -8, 10)), k2 = E.outBack(prog(f, -6, 12));
  ctx.save(); ctx.fillStyle = `rgba(${C.bgRGB},${0.8 * o})`; ctx.fillRect(0, 400, W, 330); ctx.restore();
  text(ctx, 'Never write the same thing twice.', W / 2, 540 + (1 - k) * 30, { size: 108, weight: 900, color: C.paper, spacing: -3, align: 'center', alpha: o * Math.max(0.3, k), max: 1700 });
  text(ctx, 'Point back to it.', W / 2, 670 + (1 - clamp(k2)) * 30, { size: 108, weight: 900, color: C.accent, spacing: -3, align: 'center', alpha: o * Math.max(0.3, clamp(k2)) });
}
function draw(f) {
  if (ctx.reset) ctx.reset();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none'; ctx.shadowBlur = 0;
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  const T = TLL, endK = E.inOutCubic(prog(f, T.end, T.end + 20)), a = 1 - endK;
  scene(ctx, GL, f);
  text(ctx, 'COMPRESSION  ·  LZ77', 120, 104, { size: 26, weight: 600, color: C.dim, spacing: 5, alpha: a });
  text(ctx, 'BYTEPATTERNS', 1800, 104, { size: 26, weight: 600, color: C.dim, spacing: 5, align: 'right', alpha: a });
  hookL(f);
  if (endK > 0) {
    ctx.fillStyle = `rgba(${C.bgRGB},${0.86 * endK})`; ctx.fillRect(0, 0, W, H);
    const k1 = E.outCubic(prog(f, T.end + 6, T.end + 28)), k2 = E.outCubic(prog(f, T.end + 16, T.end + 38)), k3 = E.outCubic(prog(f, T.end + 26, T.end + 48));
    text(ctx, 'LZ77: Copy from the Window', W / 2, 500 + (1 - k1) * 30, { size: 112, weight: 850, color: C.paper, spacing: -3, align: 'center', alpha: k1, max: 1680 });
    text(ctx, `${N} characters  ·  ${NT} tokens  ·  ${OUTB} bits instead of ${RAWB}  ·  ${PCT}% of the size`, W / 2, 580 + (1 - k2) * 20, { size: 42, weight: 500, color: C.accent, align: 'center', alpha: k2, max: 1680 });
    text(ctx, 'drawn in code  ·  bytepatterns.com', W / 2, 1000, { size: 32, weight: 600, color: C.paper, spacing: 3, align: 'center', alpha: k3 * 0.8 });
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.letterSpacing = '0px';
}

// ---- sound: a key tap per letter, a rising two-note hop per copy, a soft scan under every search ----
async function renderAudio(TL = TLL, frames = FRAMES) {
  const SR = 48000, dur = frames / FPS, LEN = Math.round(SR * dur);
  const ac = new OfflineAudioContext(2, LEN, SR);
  const at = fr => fr / FPS;
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -16; comp.ratio.value = 3; comp.attack.value = 0.005; comp.release.value = 0.25;
  const master = ac.createGain(); master.gain.value = 0.9; master.connect(comp).connect(ac.destination);
  master.gain.setValueAtTime(0.9, dur - 1.0); master.gain.linearRampToValueAtTime(0.0001, dur - 0.02);
  const rnd = mulberry32(0x70AD);
  const ir = ac.createBuffer(2, SR * 2, SR);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let k = 0; k < d.length; k++) d[k] = (rnd() * 2 - 1) * Math.pow(1 - k / d.length, 3); }
  const verb = ac.createConvolver(); verb.buffer = ir; const vg = ac.createGain(); vg.gain.value = 0.28; verb.connect(vg).connect(master);
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  const pluck = (t0, m, amp, pan, dec = 0.35, type = 'triangle') => {
    const o = ac.createOscillator(), g = ac.createGain(), p = ac.createStereoPanner(); o.type = type; o.frequency.value = hz(m);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(amp, t0 + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dec);
    p.pan.value = pan; o.connect(g).connect(p); p.connect(master); p.connect(verb); o.start(t0); o.stop(t0 + dec + 0.05);
  };
  const pad = (t0, t1, notes, amp, cutoff) => {
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = cutoff; lp.Q.value = 1; lp.connect(master); lp.connect(verb);
    notes.forEach((m, i) => { for (const det of [-6, 6]) {
      const o = ac.createOscillator(), g = ac.createGain(), p = ac.createStereoPanner(); o.type = 'sawtooth'; o.frequency.value = hz(m); o.detune.value = det;
      p.pan.value = (i / Math.max(1, notes.length - 1) - 0.5) * 0.8 * Math.sign(det);
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(amp, t0 + 0.8); g.gain.setValueAtTime(amp, Math.max(t0 + 0.8, t1 - 0.6)); g.gain.exponentialRampToValueAtTime(0.0001, t1 + 0.4);
      o.connect(g).connect(p).connect(lp); o.start(t0); o.stop(t1 + 0.45); } });
  };
  const PENTA = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24, 26, 28, 31, 33, 36];
  const mid = TL.tk[Math.floor(NT / 2)].a;
  pad(0, at(mid + 4), [45, 52, 57, 60, 64], 0.011, 900);
  pad(at(mid), at(TL.calm + 4), [41, 48, 53, 57, 60], 0.011, 1100);
  pad(at(TL.calm), at(TL.end + 50), [48, 55, 60, 64, 67], 0.012, 1300);
  TOK.forEach((t, q) => {
    const e = TL.tk[q], pan = ((t.i % 30) / 29 - 0.5) * 1.2;
    if (t.o) {
      pluck(at(e.a + e.d * 0.3), 67, 0.03, pan, 0.25, 'sine');
      pluck(at(e.a + e.d * 0.45), 67 + PENTA[Math.min(9, t.l)], 0.045, pan, 0.6);
      pluck(at(e.a + e.d * 0.72), 55, 0.04, 0, 0.4, 'sine');
    } else pluck(at(e.a + e.d * 0.72), 72 + PENTA[(t.c.charCodeAt(0) * 7) % 10], 0.03, pan, 0.14, 'sine');
  });
  [60, 64, 67, 72].forEach((m, i) => pluck(at(TL.calm) + i * 0.09, m, 0.05, -0.3 + i * 0.2, 1.6, 'sine'));
  [76, 81, 84, 88].forEach((m, i) => pluck(at(TL.end + 10 + i * 6), m, 0.05, -0.45 + i * 0.3, 1.8, 'sine'));
  const buf = await ac.startRendering();
  let peak = 0; for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let k = 0; k < d.length; k++) peak = Math.max(peak, Math.abs(d[k])); }
  const norm = 0.85 / Math.max(peak, 1e-6);                          // every piece peaks at the same level
  for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let k = 0; k < d.length; k++) d[k] *= norm; }
  return buf;
}

/* ==========================================================================
   VERTICAL CUT — shared block, identical in every piece.
   1080x1920 for Reels, Shorts and TikTok (__motion.variants.vertical). The
   piece's own scene code is re-used and recomposed for a phone: everything a
   viewer must read stays inside the area no platform covers (x 60..900,
   y 230..1400); outside it there is only dimmed texture.
   ========================================================================== */
const VW = 1080, VH = 1920, SAFE = { x: 60, y: 230, w: 840, h: 1170, r: 900, b: 1400 };
const vcv = document.createElement('canvas'); vcv.width = VW; vcv.height = VH;
const vx = vcv.getContext('2d', { willReadFrequently: true });   // CPU raster: identical pixels on every redraw
const VL = 96, VR = 864;                                          // text column inside the safe area

function vReset() {
  vx.setTransform(1, 0, 0, 1, 0, 0); vx.globalAlpha = 1; vx.globalCompositeOperation = 'source-over';
  vx.filter = 'none'; vx.shadowBlur = 0; vx.shadowColor = 'transparent'; vx.letterSpacing = '0px'; vx.setLineDash([]);
  vx.textAlign = 'left'; vx.textBaseline = 'alphabetic'; vx.lineCap = 'butt'; vx.lineJoin = 'miter';
}
/** Canvas text on the vertical frame; `max` shrinks the size until the line fits. */
function vText(str, x, y, { size = 40, weight = 700, color = '#FFFFFF', align = 'left', spacing = 0, alpha = 1, fam = FONT, max = 0 } = {}) {
  if (alpha <= 0.002 || !str) return size;
  vx.font = `${weight} ${size}px ${fam}`; vx.letterSpacing = spacing + 'px';
  if (max) { const w = vx.measureText(str).width; if (w > max) { size = size * max / w; vx.font = `${weight} ${size}px ${fam}`; } }
  vx.textAlign = align; vx.textBaseline = 'alphabetic';
  const a0 = vx.globalAlpha; vx.globalAlpha = a0 * alpha; vx.fillStyle = color;
  vx.fillText(str, x + (align === 'center' ? spacing / 2 : align === 'right' ? spacing : 0), y);   // tracking is added after the last glyph too
  vx.globalAlpha = a0; vx.letterSpacing = '0px';
  return size;
}
/** Word-wraps with the given font; returns the lines. */
function vWrap(str, maxW, size, weight = 700, fam = FONT) {
  vx.font = `${weight} ${size}px ${fam}`; vx.letterSpacing = '0px';
  const words = str.split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (vx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur);
  return lines;
}
/** Fade envelope with a small rise: [alpha, dy]. */
function vEnv(v, a, b, fin = 8, fout = 8) {
  const i = E.outCubic(prog(v, a, a + fin)), o = 1 - E.inCubic(prog(v, b - fout, b));
  return [Math.min(i, o), (1 - i) * 22 - (1 - o) * 10];
}
/** Which segment of a cut list a vertical frame is in: segs = [{ at, src, len }] in frames. */
function vSeg(segs, v) {
  let k = 0; while (k < segs.length - 1 && v >= segs[k + 1].at) k++;
  const s = segs[k];
  return { k, s, local: v - s.at, src: s.src + (v - s.at) };
}
/** Dims everything outside the safe area to a quiet texture (brightness x 0.2), with a soft inner edge. */
function vShade(rgb, a = 0.8, feather = 40) {
  vx.save(); vx.setTransform(1, 0, 0, 1, 0, 0); vx.globalAlpha = 1; vx.globalCompositeOperation = 'source-over';
  vx.fillStyle = `rgba(${rgb},${a})`;
  vx.beginPath(); vx.rect(0, 0, VW, VH); vx.rect(SAFE.x, SAFE.y, SAFE.w, SAFE.h); vx.fill('evenodd');
  const strip = (x0, y0, x1, y1, rx, ry, rw, rh) => {
    const g = vx.createLinearGradient(x0, y0, x1, y1);
    g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`);
    vx.fillStyle = g; vx.fillRect(rx, ry, rw, rh);
  };
  strip(SAFE.x, 0, SAFE.x + feather, 0, SAFE.x, SAFE.y, feather, SAFE.h);
  strip(SAFE.r, 0, SAFE.r - feather, 0, SAFE.r - feather, SAFE.y, feather, SAFE.h);
  strip(0, SAFE.y, 0, SAFE.y + feather, SAFE.x, SAFE.y, SAFE.w, feather);
  strip(0, SAFE.b, 0, SAFE.b - feather, SAFE.x, SAFE.b - feather, SAFE.w, feather);
  vx.restore();
}
/** Series tag at the top of the safe area, e.g. MADE IN CODE · 04. */
function vTag(label, color, alpha = 1) {
  vText('MADE IN CODE', VL, 292, { size: 28, weight: 800, color, spacing: 5, alpha });
  vx.font = `800 28px ${FONT}`; vx.letterSpacing = '5px';
  const w = vx.measureText('MADE IN CODE').width; vx.letterSpacing = '0px';
  vText('·  ' + label, VL + w + 14, 292, { size: 28, weight: 600, color: 'rgba(255,255,255,0.72)', spacing: 3, alpha, max: VR - VL - w - 14 });
}
/** Big hook lines, left-aligned from y0; visible from frame 0, settles in a few frames. */
function vHook(v, lines, y0, { size = 84, lh = 1.08, color = '#FFFFFF', accent = null, weight = 800, spacing = -1.5, alpha = 1 } = {}) {
  const k = E.outExpo(prog(v, -6, 12));
  lines.forEach((ln, i) => {
    const kk = E.outExpo(prog(v, -12 + i * 2, 8 + i * 2));
    vText(ln, VL, y0 + i * size * lh + (1 - kk) * 30, { size, weight, spacing, color: accent && i === lines.length - 1 ? accent : color, alpha: alpha * Math.max(0.25, kk), max: VR - VL });
  });
  return k;
}
/** Closing card, the last 60 frames: piece title, "drawn in code · bytepatterns.com". l = frames into the card. */
function vEndCard(l, { title, line = '', ink = '#FFFFFF', dim = 'rgba(255,255,255,0.66)', accent = '#FFFFFF', scrim = '0,0,0', a = 0.84 }) {
  const k = E.outCubic(prog(l, 0, 12));
  vx.save(); vx.setTransform(1, 0, 0, 1, 0, 0);
  vx.fillStyle = `rgba(${scrim},${a * k})`; vx.fillRect(0, 0, VW, VH);
  vx.restore();
  const t1 = E.outExpo(prog(l, 3, 19)), t2 = E.outExpo(prog(l, 11, 27)), t3 = E.outExpo(prog(l, 19, 35));
  vx.fillStyle = accent; vx.globalAlpha = t1; vx.fillRect(VL, 742, 88 * t1, 7); vx.globalAlpha = 1;
  const size = vText(title, VL, 850 + (1 - t1) * 40, { size: 92, weight: 800, color: ink, spacing: -2, alpha: t1, max: VR - VL });
  const y2 = 850 + Math.max(size, 60) * 0.25 + 70;
  vx.font = `600 44px ${FONT}`;
  const lead = 'drawn in code  ·  ', lw = vx.measureText(lead).width;
  vText(lead, VL, y2 + (1 - t2) * 24, { size: 44, weight: 600, color: dim, alpha: t2 });
  vText('bytepatterns.com', VL + lw, y2 + (1 - t2) * 24, { size: 44, weight: 800, color: accent, alpha: t2 });
  if (line) vText(line, VL, y2 + 72 + (1 - t3) * 18, { size: 32, weight: 500, color: dim, alpha: t3, max: VR - VL });
}
/** Seeks a cut. The first frame a page draws is drawn twice: the very first read of a
 *  GPU-backed source canvas can come out a shade different from every later one. */
let vWarm = false;
function vSeek(draw, i, frames) {
  const f = Math.max(0, Math.min(frames - 1, Math.floor(i)));
  if (!vWarm) { vWarm = true; draw(f); }
  draw(f);
}
/** The soundtrack of a cut: the piece's own audio() spliced to the same segments as the picture. */
async function vAudio(segs, frames, { xf = 0.025, fadeOut = 0.6, extra = null } = {}) {
  const src = await renderAudio();
  const SR = 48000, dur = frames / FPS, ac = new OfflineAudioContext(2, Math.round(SR * dur), SR);
  const out = ac.createGain(); out.connect(ac.destination);
  out.gain.setValueAtTime(1, 0); out.gain.setValueAtTime(1, dur - fadeOut); out.gain.linearRampToValueAtTime(0, dur - 0.01);
  segs.forEach((s, k) => {
    const at = s.at / FPS, off = s.src / FPS, d = s.len / FPS;
    const pre = k === 0 ? 0 : Math.min(xf, off), post = k === segs.length - 1 ? 0 : xf;
    const b = ac.createBufferSource(), g = ac.createGain(); b.buffer = src;
    g.gain.setValueAtTime(pre ? 0 : 1, at - pre);
    if (pre) g.gain.linearRampToValueAtTime(1, at + pre);
    if (post) { g.gain.setValueAtTime(1, at + d - post); g.gain.linearRampToValueAtTime(0, at + d + post); }
    b.connect(g).connect(out); b.start(at - pre, off - pre, d + pre + post);
  });
  if (extra) extra(ac, out);
  const buf = await ac.startRendering();
  let peak = 0; for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) peak = Math.max(peak, Math.abs(d[i])); }
  if (peak > 0.9) for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] *= 0.9 / peak; }
  return buf;
}
/** A soft three-partial bell, for the closing card. */
function vChime(ac, dest, at, freq, vol = 0.08) {
  for (const [mul, v, dec] of [[1, 1, 1.8], [2.01, 0.35, 0.8], [3.02, 0.12, 0.4]]) {
    const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.value = freq * mul;
    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol * v, at + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, at + dec);
    o.connect(g).connect(dest); o.start(at); o.stop(at + dec + 0.05);
  }
}

/* VERTICAL CUT — this piece */
// The same tokens on a 1080 x 1920 stage and a faster clock: the text in three rows of twenty.
const TLV = buildTL({ g0: 30, t0: 84, lit: 8, mat: 22, hold: 40, calmT: 26 });
const VFR = TLV.end + 60, VEND = VFR - 60;
const GV = { TL: TLV, w: VW, h: VH, cols: 20, cw: 40, ch: 56, rh: 112, x0: 80, y0: 590, fs: 30, lift: 64,
  O: { x: VL, y: 990, w: VR - VL, h: 44, rh: 54 },
  B: { x: VL, y: 1250, w: VR - VL, h: 14, gap: 58, fs: 28 },
  capX: VL, capY: 390, cap: 42, capTwo: true, capMax: VR - VL,
  fo: 28, foX: VL, foY: 1392, foMax: VR - VL,
  fn: 76, fnX: VL, fnY: 760, fnAlign: 'left', fnMax: VR - VL, fnTwo: true, fnBand: [470, 1330] };
function hookV(v) {
  const o = 1 - E.inCubic(prog(v, TLV.g0 - 10, TLV.g0 + 4));
  if (o <= 0) return;
  vx.save(); vx.fillStyle = `rgba(${C.bgRGB},${0.86 * o})`; vx.fillRect(SAFE.x, 400, SAFE.w, 560); vx.restore();
  vHook(v, ['Never write', 'the same thing', 'twice.', 'Point back.'], 510, { size: 104, accent: C.accent, color: C.paper, weight: 900, spacing: -2, alpha: o });
}
function vDraw(v) {
  if (vx.reset) vx.reset();
  vReset();
  vx.fillStyle = C.bg; vx.fillRect(0, 0, VW, VH);
  scene(vx, GV, v);
  hookV(v);
  vReset();
  vShade(C.bgRGB, 0.86);
  vTag('LZ77', C.accent);
  if (v >= VEND) vEndCard(v - VEND, { title: 'LZ77: Copy from the Window', line: `${N} characters  ·  ${NT} tokens  ·  ${OUTB} bits, not ${RAWB}  ·  ${PCT}%`,
    ink: C.paper, dim: 'rgba(241,238,230,0.72)', accent: C.accent, scrim: C.bgRGB, a: 0.88 });
  vReset();
}

// The player asks for a frame on every display refresh; at 30 fps on a 60 Hz screen every other call
// asks for the frame already on the canvas, which is then left as it is (same frame, same pixels).
const shown = { L: -1, V: -1 };
window.__motion = {
  title: 'LZ77: Copy from the Window',
  description: `LZ77 reads “${TEXT}” (${N} characters) with a ${WIN}-character window and turns every repeat of ${MIN} or more into a pointer back into it: ${NLIT} letters at ${LITB} bits and ${NPTR} copies at ${PTRB} bits, ${NT} tokens and ${OUTB} bits instead of ${RAWB}, ${PCT}% of the size; the longest copy is ${LONG.l} characters, and the final “${PH}”, ${PHD} characters after the first, is outside the window and comes back as ${PHT.length} shorter copies.`,
  fps: FPS, width: W, height: H, frames: FRAMES,
  poster: Math.round(TLL.tk[TOK.indexOf(LONG)].a + TLL.mat * 0.6),
  gifStart: Math.floor(TLL.tk[FIRSTP].a / FPS),
  seek(i) { const f = Math.max(0, Math.min(FRAMES - 1, Math.floor(i))); if (f !== shown.L) { shown.L = f; draw(f); } },
  audio: () => renderAudio(TLL, FRAMES),
  variants: {
    vertical: {
      width: VW, height: VH, frames: VFR, canvas: vcv,
      poster: Math.round(TLV.tk[TOK.indexOf(LONG)].a + TLV.mat * 0.6), gifStart: Math.floor(TLV.tk[FIRSTP].a / FPS),
      seek(i) { const v = Math.max(0, Math.min(VFR - 1, Math.floor(i))); if (v !== shown.V) { shown.V = v; vSeek(vDraw, v, VFR); } },
      audio: () => renderAudio(TLV, VFR),
    },
  },
};


/* ==========================================================================
   PLAYER — identical in every piece; keep as is.
   Autoplays and loops, starts sound on the first click, ?frame=N pauses on a
   frame, ?variant=vertical plays the vertical cut (if the piece has one).
   When the renderer sets window.__MOTION_RENDER__ it stays out of the way.
   ========================================================================== */
(function player() {
  const btn = document.getElementById('sound'), q = new URLSearchParams(location.search);
  let M = window.__motion;
  const V = !window.__MOTION_RENDER__ && M.variants && M.variants[q.get('variant')];
  if (V) {                                                // show the variant's own canvas instead
    M = Object.assign({}, M, V);
    V.canvas.style.cssText = `width:min(100vw,calc(100vh*${V.width}/${V.height}));height:auto;aspect-ratio:${V.width}/${V.height}`;
    document.querySelector('canvas').replaceWith(V.canvas);
  }
  const dur = M.frames / M.fps;
  if (window.__MOTION_RENDER__) { btn.hidden = true; M.seek(0); return; }
  if (q.has('frame')) { btn.hidden = true; M.seek(+q.get('frame') || 0); return; }
  let t0 = performance.now(), ac = null, src = null, buf = null, paused = false, pausedAt = 0;
  const clock = () => ac && src ? (ac.currentTime - t0) : (performance.now() - t0) / 1000;
  function loop() {
    if (!paused) M.seek(Math.floor(((clock() % dur) + dur) % dur * M.fps));
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  btn.addEventListener('click', async () => {
    if (src) { src.stop(); src = null; btn.textContent = 'Click for sound'; t0 = performance.now(); return; }
    btn.textContent = 'Loading sound…';
    ac = ac || new AudioContext({ sampleRate: 48000 });
    buf = buf || await M.audio();
    await ac.resume();
    src = ac.createBufferSource(); src.buffer = buf; src.loop = true; src.connect(ac.destination);
    t0 = ac.currentTime + 0.05; src.start(t0);        // picture restarts from frame 0 in sync with the sound
    btn.textContent = 'Sound on — click to mute';
  });
  addEventListener('keydown', e => {
    if (e.code !== 'Space') return;
    e.preventDefault(); paused = !paused;
    if (ac) paused ? ac.suspend() : ac.resume();
    if (!ac) { if (paused) pausedAt = performance.now(); else t0 += performance.now() - pausedAt; }
  });
})();
</script>
