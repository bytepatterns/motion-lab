<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="teambytepatterns">
<meta name="description" content="Three equal masses under Newton's gravity chase each other around one figure eight; a 1% kick only makes the eight wobble, a 30% kick breaks the dance into chaos, and the period, energy and closest passes are measured by the simulation itself.">
<title>Three Bodies, One Eight — motion-lab</title>
<style>
  /* Player chrome. The piece itself lives entirely in the canvas. */
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; font: 500 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; }
  canvas { display: block; width: min(100vw, calc(100vh * 16 / 9)); height: auto; aspect-ratio: 16 / 9; }
  #sound { position: fixed; left: 16px; bottom: 16px; padding: 8px 14px; border: 1px solid rgba(255,255,255,.35); border-radius: 999px;
           background: rgba(0,0,0,.55); color: #fff; font: inherit; cursor: pointer; }
  #sound[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080" aria-label="Three glowing dots in teal, amber and rose trace long fading trails around a figure-eight shaped path; one dot flashes as it is kicked and the eight begins to precess; a second, harder kick sends the three into a tangled, looping chase as the camera pulls back"></canvas>
<button id="sound" type="button">Click for sound</button>
<script>
'use strict';
/* ==========================================================================
   PIECE — Three Bodies, One Eight.
   Three equal masses (G = m = 1) start on the figure-eight orbit found by
   Chenciner and Montgomery: all three follow the same closed path, a third
   of a lap apart. The motion is integrated with fourth-order Runge-Kutta,
   with the step shrinking as any two bodies get close. The period is not
   typed in: the eight is integrated once and the time at which the state
   returns closest to where it started is measured (refined with a
   parabola through the nearest samples).
   Then one body's velocity is kicked by 1% and the eight only wobbles;
   later the same body is kicked by 30% and the orbit breaks into a chaotic
   three-body tangle. Energy, its drift since the last kick, the lap count
   and the closest pass between any two bodies are all read from the run.
   The whole run is sampled once at load (480 samples per lap); each frame
   looks up its own simulation time, so seek(i) is pure in i.
   ========================================================================== */
const W = 1920, H = 1080, FPS = 30;
const cv = document.getElementById('stage');
const ctx = cv.getContext('2d', { willReadFrequently: true });   // CPU raster: identical pixels on every redraw
const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
const MONO = 'ui-monospace, "Cascadia Code", Consolas, Menlo, monospace';

// ---- helpers -------------------------------------------------------------
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (f, a, b) => clamp((f - a) / (b - a));
const smooth = t => t * t * (3 - 2 * t);
const E = {
  inCubic: t => t * t * t,
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inOutCubic: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outExpo: t => t === 1 ? 1 : 1 - Math.pow(2, -10 * t),
  inExpo: t => t === 0 ? 0 : Math.pow(2, 10 * t - 10),
  inOutExpo: t => t === 0 ? 0 : t === 1 ? 1 : t < .5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2,
  outBack: t => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2),
};
/** Canvas text; `max` shrinks the size until the line fits. Returns the width drawn. */
function text(g, str, x, y, { size = 40, weight = 600, color = '#fff', alpha = 1, spacing = 0, align = 'left', fam = FONT, base = 'alphabetic', max = 0 } = {}) {
  if (alpha <= 0.002 || !str) return 0;
  g.font = `${weight} ${size}px ${fam}`; g.letterSpacing = spacing + 'px';
  if (max) { const w0 = g.measureText(str).width; if (w0 > max) { size *= max / w0; g.font = `${weight} ${size}px ${fam}`; } }
  g.textAlign = align; g.textBaseline = base;
  const a0 = g.globalAlpha; g.globalAlpha = a0 * alpha; g.fillStyle = color;
  g.fillText(str, x, y);
  const w = g.measureText(str).width;
  g.globalAlpha = a0; g.letterSpacing = '0px';
  return w;
}
const measure = (g, str, size, weight = 800, fam = FONT, spacing = 0) => { g.font = `${weight} ${size}px ${fam}`; g.letterSpacing = spacing + 'px'; const w = g.measureText(str).width; g.letterSpacing = '0px'; return w; };
const env = (f, a, b, fin = 12, fout = 10) => {
  const i = E.outCubic(prog(f, a, a + fin)), o = 1 - E.inCubic(prog(f, b - fout, b));
  return [Math.min(i, o), (1 - i) * 24 - (1 - o) * 10];
};

// ---- palette -------------------------------------------------------------
const C = {
  bg: '#07090F', bgRGB: '7,9,15', paper: '#F2EFE8', dim: 'rgba(242,239,232,0.62)', faint: 'rgba(242,239,232,0.12)',
  accent: '#FFC857', accentRGB: '255,200,87', kick: '#FF6B6B', kickRGB: '255,107,107',
  body: [[92, 214, 203], [255, 200, 87], [255, 107, 154]],
};

// ---- the three-body run, integrated once --------------------------------------------------
const NB = 3, MASS = [1, 1, 1];
const AX = new Float64Array(6), K = Array.from({ length: 4 }, () => [new Float64Array(6), new Float64Array(6)]), TP = new Float64Array(6), TV = new Float64Array(6);
function accel(p, a) {
  a.fill(0);
  for (let i = 0; i < NB; i++) for (let j = i + 1; j < NB; j++) {
    const dx = p[2 * j] - p[2 * i], dy = p[2 * j + 1] - p[2 * i + 1], r2 = dx * dx + dy * dy, f = 1 / (r2 * Math.sqrt(r2));
    a[2 * i] += MASS[j] * dx * f; a[2 * i + 1] += MASS[j] * dy * f; a[2 * j] -= MASS[i] * dx * f; a[2 * j + 1] -= MASS[i] * dy * f;
  }
}
/** One RK4 step of size h on position p and velocity v (in place). */
function rk4(p, v, h) {
  const st = [[0, 0], [0.5, 0], [0.5, 1], [1, 2]];
  for (let s = 0; s < 4; s++) {
    const [c, from] = st[s];
    for (let k = 0; k < 6; k++) { TP[k] = p[k] + (s ? c * h * K[from][0][k] : 0); TV[k] = v[k] + (s ? c * h * K[from][1][k] : 0); }
    K[s][0].set(TV); accel(TP, K[s][1]);
  }
  for (let k = 0; k < 6; k++) {
    p[k] += h / 6 * (K[0][0][k] + 2 * K[1][0][k] + 2 * K[2][0][k] + K[3][0][k]);
    v[k] += h / 6 * (K[0][1][k] + 2 * K[1][1][k] + 2 * K[2][1][k] + K[3][1][k]);
  }
}
const pairMin = p => Math.min(Math.hypot(p[2] - p[0], p[3] - p[1]), Math.hypot(p[4] - p[0], p[5] - p[1]), Math.hypot(p[4] - p[2], p[5] - p[3]));
function energy(p, v) {
  let e = 0;
  for (let i = 0; i < NB; i++) { e += 0.5 * MASS[i] * (v[2 * i] ** 2 + v[2 * i + 1] ** 2);
    for (let j = i + 1; j < NB; j++) e -= MASS[i] * MASS[j] / Math.hypot(p[2 * j] - p[2 * i], p[2 * j + 1] - p[2 * i + 1]); }
  return e;
}
const X1 = 0.97000436, Y1 = -0.24308753, VX3 = -0.93240737, VY3 = -0.86473146;   // the figure-eight initial state
const P0 = [X1, Y1, -X1, -Y1, 0, 0], V0 = [-VX3 / 2, -VY3 / 2, -VX3 / 2, -VY3 / 2, VX3, VY3];
/** The period: when does the state come back closest to where it started? */
const PERIOD = (() => {
  const p = Float64Array.from(P0), v = Float64Array.from(V0), h = 0.001, d = [];
  for (let t = 0; t < 9; t += h) {
    rk4(p, v, h);
    let s = 0; for (let k = 0; k < 6; k++) s += (p[k] - P0[k]) ** 2 + (v[k] - V0[k]) ** 2;
    d.push(s);
  }
  let b = Math.round(3 / h); for (let k = b; k < d.length - 1; k++) if (d[k] < d[b]) b = k;
  const y0 = d[b - 1], y1 = d[b], y2 = d[b + 1], off = (y0 - y2) / (2 * (y0 - 2 * y1 + y2));
  return (b + 1 + off) * h;
})();
const T = PERIOD, SPL = 480, DS = T / SPL;                  // samples per lap
const KICK1 = { body: 0, k: 0.01, at: 2.5 }, KICK2 = { body: 0, k: 0.30, at: 4.25 }, LAPS = 10.2;   // kicks at these laps
/** The run: positions at every sample, closest pair so far (per stretch between kicks), energy and its drift. */
const RUN = (() => {
  const n = Math.ceil(LAPS * SPL) + 2, px = new Float32Array(n * 6), rmin = new Float32Array(n), cur = new Float32Array(n), en = new Float64Array(n), drift = new Float32Array(n);
  const p = Float64Array.from(P0), v = Float64Array.from(V0);
  const k1 = Math.round(KICK1.at * SPL), k2 = Math.round(KICK2.at * SPL);
  let E0 = energy(p, v), rm = pairMin(p), dr = 0, steps = 0;
  for (let s = 0; s < n; s++) {
    if (s === k1 || s === k2) {                               // a kick: scale one body's velocity, keep total momentum zero
      const K_ = s === k1 ? KICK1 : KICK2;
      v[2 * K_.body] *= 1 + K_.k; v[2 * K_.body + 1] *= 1 + K_.k;
      let mx = 0, my = 0; for (let i = 0; i < NB; i++) { mx += v[2 * i] / NB; my += v[2 * i + 1] / NB; }
      for (let i = 0; i < NB; i++) { v[2 * i] -= mx; v[2 * i + 1] -= my; }
      E0 = energy(p, v); rm = pairMin(p); dr = 0;
    }
    for (let k = 0; k < 6; k++) px[s * 6 + k] = p[k];
    const r = pairMin(p); rm = Math.min(rm, r); rmin[s] = rm; cur[s] = r;
    const e = energy(p, v); en[s] = e; dr = Math.max(dr, Math.abs((e - E0) / E0)); drift[s] = dr;
    let t = 0;
    while (t < DS - 1e-12) { const h = Math.min(DS - t, DS / 3, 0.004 * Math.pow(pairMin(p), 1.5)); rk4(p, v, h); t += h; steps++; }
  }
  // a third of a lap apart: how far is body 2 now from where body 1 was a third of a lap earlier?
  let lag = 0; const third = SPL / 3;
  for (let s = Math.ceil(third); s < k1; s++) { const a = Math.floor(s - third), u = s - third - a;
    for (const [i, j] of [[1, 0], [2, 1], [0, 2]]) { const x = lerp(px[a * 6 + 2 * j], px[(a + 1) * 6 + 2 * j], u), y = lerp(px[a * 6 + 2 * j + 1], px[(a + 1) * 6 + 2 * j + 1], u);
      lag = Math.max(lag, Math.hypot(px[s * 6 + 2 * i] - x, px[s * 6 + 2 * i + 1] - y)); } }
  return { n, px, rmin, cur, en, drift, k1, k2, steps, lag };
})();
const RMIN8 = RUN.rmin[RUN.k1 - 1], RMIN1 = RUN.rmin[RUN.k2 - 1], RMIN30 = RUN.rmin[RUN.n - 1];
const DRIFT8 = RUN.drift[RUN.k1 - 1];
/** Position of body b at sample time s (a float), interpolated. */
function posAt(s, b) {
  const a = clamp(Math.floor(s), 0, RUN.n - 2), u = clamp(s - a, 0, 1), P = RUN.px;
  return [lerp(P[a * 6 + 2 * b], P[(a + 1) * 6 + 2 * b], u), lerp(P[a * 6 + 2 * b + 1], P[(a + 1) * 6 + 2 * b + 1], u)];
}

// ---- timeline: frames -> laps --------------------------------------------------------------
// Each stage runs at its own pace: `lap0` is the lap shown on frame 0; the eight until KICK1, the
// 1% stretch until KICK2, then the tangle, faster, until the end.
function buildTL(o) {
  const TL = Object.assign({}, o);
  TL.lapAt = f => f <= TL.k1 ? lerp(TL.lap0, KICK1.at, f / TL.k1)
    : f <= TL.k2 ? lerp(KICK1.at, KICK2.at, (f - TL.k1) / (TL.k2 - TL.k1))
    : KICK2.at + (f - TL.k2) / TL.fpl3;
  TL.frames = TL.end + TL.card;
  TL.caps = [
    [TL.cap0, TL.cap1, 'Three equal masses, Newton’s gravity:|one path, shared by all three.'],
    [TL.cap1 + 4, TL.k1 - 6, `Each a third of a lap behind the next;|one lap takes ${T.toFixed(4)} time units.`],
    [TL.k1 - 2, TL.k2 - 6, `Kick one by ${Math.round(KICK1.k * 100)}%:|the eight wobbles, but holds.`],
    [TL.k2 - 2, TL.calm, `Kick it by ${Math.round(KICK2.k * 100)}%:|the dance falls apart.`],
  ];
  // the camera: fit the recent trails, smoothed over neighbouring frames
  const raw = [];
  for (let f = 0; f < TL.frames; f++) {
    const s1 = TL.lapAt(f) * SPL, s0 = Math.max(0, s1 - SPL * 1.1);
    let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
    for (let s = Math.floor(s0); s <= Math.ceil(s1); s += 4) for (let b = 0; b < NB; b++) { const [x, y] = posAt(s, b);
      if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    raw.push({ sc: Math.min(TL.view.w / Math.max(0.6, x1 - x0), TL.view.h / Math.max(0.6, y1 - y0)), cx: (x0 + x1) / 2, cy: (y0 + y1) / 2 });
  }
  TL.cam = raw.map((_, f) => {
    let w = 0, sc = 0, cx = 0, cy = 0;
    for (let d = -18; d <= 18; d++) { const r = raw[clamp(f + d, 0, raw.length - 1)], k = 1 - Math.abs(d) / 19; w += k; sc += k * Math.log(r.sc); cx += k * r.cx; cy += k * r.cy; }
    return { sc: Math.min(TL.maxSc, Math.exp(sc / w)), cx: cx / w, cy: cy / w };
  });
  return TL;
}

// ---- drawing ------------------------------------------------------------------------------
function scene(g, G, f) {
  const TL = G.TL, lap = TL.lapAt(f), s = lap * SPL, cam = TL.cam[f];
  const X = (x) => G.vcx + (x - cam.cx) * cam.sc, Y = (y) => G.vcy + (y - cam.cy) * cam.sc;
  g.save(); g.lineCap = 'round'; g.lineJoin = 'round';
  // the eight itself, faint, until the tangle
  const ghostA = 0.5 * E.outCubic(prog(f, 0, 30)) * (1 - E.inOutCubic(prog(f, TL.k2, TL.k2 + 60)));
  if (ghostA > 0.01) {
    g.strokeStyle = `rgba(242,239,232,${0.16 * ghostA * 2})`; g.lineWidth = 1; g.beginPath();
    for (let k = 0; k <= SPL; k += 3) { const [x, y] = posAt(k, 0); if (k) g.lineTo(X(x), Y(y)); else g.moveTo(X(x), Y(y)); }
    g.stroke();
  }
  // trails: 1.1 laps long, in chunks that fade and thin towards the tail
  const TR = SPL * 1.1, CH = 18, step = 2;
  for (let b = 0; b < NB; b++) {
    const [r, gg, bb] = C.body[b];
    for (let c = 0; c < CH; c++) {
      const a0 = s - TR * (c + 1) / CH, a1 = s - TR * c / CH; if (a1 <= 0) continue;
      const q = 1 - c / CH;
      g.strokeStyle = `rgba(${r},${gg},${bb},${0.08 + 0.85 * q * q})`; g.lineWidth = 1 + G.trailW * q * q;
      g.beginPath();
      const st = Math.max(0, a0);
      let first = true;
      for (let k = st; ; k = Math.min(a1, k + step)) { const [x, y] = posAt(k, b); if (first) { g.moveTo(X(x), Y(y)); first = false; } else g.lineTo(X(x), Y(y)); if (k >= a1) break; }
      g.stroke();
    }
  }
  // bodies, with a glow; a ring on the kicked one at each kick
  for (let b = 0; b < NB; b++) {
    const [x, y] = posAt(s, b), sx = X(x), sy = Y(y), [r, gg, bb] = C.body[b];
    const gl = g.createRadialGradient(sx, sy, 0, sx, sy, G.glow);
    gl.addColorStop(0, `rgba(${r},${gg},${bb},0.55)`); gl.addColorStop(1, `rgba(${r},${gg},${bb},0)`);
    g.fillStyle = gl; g.fillRect(sx - G.glow, sy - G.glow, 2 * G.glow, 2 * G.glow);
    g.fillStyle = '#FFFFFF'; g.beginPath(); g.arc(sx, sy, G.dot * 0.55, 0, Math.PI * 2); g.fill();
    g.strokeStyle = `rgb(${r},${gg},${bb})`; g.lineWidth = 3; g.beginPath(); g.arc(sx, sy, G.dot, 0, Math.PI * 2); g.stroke();
    for (const [kf, K_] of [[TL.k1, KICK1], [TL.k2, KICK2]]) {
      if (b !== K_.body) continue;
      const q = prog(f, kf - 2, kf + 34); if (q <= 0 || q >= 1) continue;
      g.strokeStyle = `rgba(${C.kickRGB},${1 - q})`; g.lineWidth = 4 * (1 - q) + 1;
      g.beginPath(); g.arc(sx, sy, G.dot + E.outCubic(q) * G.glow * 1.6, 0, Math.PI * 2); g.stroke();

}
function caption(g, G, f) {
  for (const [t0, t1, str] of G.TL.caps) {
    const [a, dy] = env(f, t0, t1, 12, 10); if (a <= 0) continue;
    const [p1, p2] = str.split('|');
    if (G.capTwo) {
      text(g, p1, G.capX, G.capY + dy, { size: G.cap, weight: 850, color: C.paper, spacing: -1, alpha: a, max: G.capMax });
      text(g, p2, G.capX, G.capY + G.cap * 1.14 + dy, { size: G.cap, weight: 850, color: C.accent, spacing: -1, alpha: a, max: G.capMax });
    } else {
      const w1 = text(g, p1 + ' ', G.capX, G.capY + dy, { size: G.cap, weight: 850, color: C.paper, spacing: -1, alpha: a });
      text(g, p2, G.capX + w1, G.capY + dy, { size: G.cap, weight: 850, color: C.accent, spacing: -1, alpha: a });

}
const expo = x => { if (x === 0) return '0'; const e = Math.floor(Math.log10(x)); return `${(x / 10 ** e).toFixed(1)}e${e}`; };
function readout(g, G, f, st) {

  if (a <= 0) return;
  const s = clamp(Math.floor(st.s), 0, RUN.n - 1);
  const l1 = `lap ${st.lap.toFixed(2)}  ·  closest pass ${RUN.rmin[s].toFixed(3)}`;
  const l2 = `energy ${RUN.en[s].toFixed(4)}  ·  drift ${expo(RUN.drift[s])}`;
  text(g, l1, G.foX, G.foY, { size: G.fo, weight: 700, color: C.paper, fam: MONO, alpha: a, align: G.foAlign, max: G.foMax });
  text(g, l2, G.foX2, G.foY2, { size: G.fo, weight: 700, color: C.dim, fam: MONO, alpha: a, align: G.foAlign2, max: G.foMax });

  const TL = G.TL, k1 = E.outCubic(prog(f, TL.calm, TL.calm + 18)), k2 = E.outCubic(prog(f, TL.calm + 10, TL.calm + 28));
  if (k1 <= 0) return;

  text(g, `${Math.round(KICK1.k * 100)}% kick: still an eight.`, G.fnX, G.fnY, { size: G.fn, weight: 900, color: C.paper, spacing: -2, align: G.fnAlign, alpha: k1 * out, max: G.fnMax });
  text(g, `${Math.round(KICK2.k * 100)}% kick: chaos.`, G.fnX, G.fnY + G.fn * 1.1, { size: G.fn, weight: 900, color: C.accent, spacing: -2, align: G.fnAlign, alpha: k2 * out, max: G.fnMax });
}
function frameScene(g, G, f) {
  const st = scene(g, G, f);
  caption(g, G, f); readout(g, G, f, st); finale(g, G, f);
  return st;
}

// ---- landscape picture ------------------------------------------------------------------
const TLL = buildTL({ lap0: 0, k1: 300, k2: 488, fpl3: 56, calm: 690, end: 734, card: 72, cap0: 56, cap1: 176,
  view: { w: 1500, h: 560 }, maxSc: 640 });
const FRAMES = TLL.frames;
const GL = { TL: TLL, w: W, h: H, vcx: 960, vcy: 600, trailW: 7, glow: 46, dot: 11,
  capX: 120, capY: 216, cap: 52, capTwo: false, capMax: 1680,
  fo: 30, foX: 120, foY: 1004, foAlign: 'left', foX2: 1800, foY2: 1004, foAlign2: 'right', foMax: 820,
  fn: 96, fnX: W / 2, fnY: 530, fnAlign: 'center', fnMax: 1680 };
function hookL(f) {
  const o = 1 - E.inCubic(prog(f, TLL.cap0 - 14, TLL.cap0 + 2));
  if (o <= 0) return;
  const k = E.outExpo(prog(f, -8, 10)), k2 = E.outBack(prog(f, -6, 12));
  ctx.save(); ctx.fillStyle = `rgba(${C.bgRGB},${0.6 * o})`; ctx.fillRect(0, 400, W, 330); ctx.restore();
  text(ctx, 'Three bodies. One path.', W / 2, 540 + (1 - k) * 30, { size: 108, weight: 900, color: C.paper, spacing: -3, align: 'center', alpha: o * Math.max(0.3, k) });
  text(ctx, 'Until you kick one.', W / 2, 670 + (1 - clamp(k2)) * 30, { size: 108, weight: 900, color: C.accent, spacing: -3, align: 'center', alpha: o * Math.max(0.3, clamp(k2)) });
}
function draw(f) {
  if (ctx.reset) ctx.reset();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none'; ctx.shadowBlur = 0;
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  const T_ = TLL, endK = E.inOutCubic(prog(f, T_.end, T_.end + 20)), a = 1 - endK;

  text(ctx, 'BYTEPATTERNS', 1800, 104, { size: 26, weight: 600, color: C.dim, spacing: 5, align: 'right', alpha: a });

    text(ctx, `period ${T.toFixed(4)}  ·  energy drift ${expo(DRIFT8)}  ·  closest pass ${RMIN8.toFixed(3)} → ${RMIN30.toFixed(3)}`, W / 2, 580 + (1 - k2) * 20, { size: 42, weight: 500, color: C.accent, align: 'center', alpha: k2, max: 1680 });

// ---- sound: each body is a tone whose pitch follows its speed, panned by where it is; a chime per lap, a hit per kick, a click at every close pass ----
async function renderAudio(TL = TLL, frames = FRAMES) {
  const SR = 48000, dur = frames / FPS, LEN = Math.round(SR * dur);
  const ac = new OfflineAudioContext(2, LEN, SR);
  const at = fr => fr / FPS;
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -16; comp.ratio.value = 3; comp.attack.value = 0.005; comp.release.value = 0.25;
  const master = ac.createGain(); master.gain.value = 0.9; master.connect(comp).connect(ac.destination);
  master.gain.setValueAtTime(0.9, dur - 1.0); master.gain.linearRampToValueAtTime(0.0001, dur - 0.02);
  const rnd = mulberry32(0x48E1A8);
  const ir = ac.createBuffer(2, SR * 3, SR);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let k = 0; k < d.length; k++) d[k] = (rnd() * 2 - 1) * Math.pow(1 - k / d.length, 2.4); }
  const verb = ac.createConvolver(); verb.buffer = ir; const vg = ac.createGain(); vg.gain.value = 0.4; verb.connect(vg).connect(master);
  const noise = ac.createBuffer(1, SR, SR); { const d = noise.getChannelData(0); for (let k = 0; k < d.length; k++) d[k] = rnd() * 2 - 1; }
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  const pluck = (t0, m, amp, pan, dec = 0.35, type = 'triangle') => {
    const o = ac.createOscillator(), g = ac.createGain(), p = ac.createStereoPanner(); o.type = type; o.frequency.value = hz(m);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(amp, t0 + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dec);
    p.pan.value = pan; o.connect(g).connect(p); p.connect(master); p.connect(verb); o.start(t0); o.stop(t0 + dec + 0.05);
  };
  // the three voices: pitch from speed, pan from x, one automation point per frame
  const base = [57, 61, 64];
  for (let b = 0; b < NB; b++) {
    const o = ac.createOscillator(), g = ac.createGain(), p = ac.createStereoPanner(), lp = ac.createBiquadFilter();
    o.type = 'triangle'; lp.type = 'lowpass'; lp.frequency.value = 1400;
    g.gain.setValueAtTime(0.0001, 0); g.gain.exponentialRampToValueAtTime(0.05, 1.2); g.gain.setValueAtTime(0.05, Math.max(1.3, dur - 2)); g.gain.exponentialRampToValueAtTime(0.0001, dur - 0.1);
    for (let fr = 0; fr < frames; fr++) {
      const s = TL.lapAt(fr) * SPL, [x0, y0] = posAt(s - 1, b), [x1, y1] = posAt(s + 1, b), sp = Math.hypot(x1 - x0, y1 - y0) / (2 * DS);
      o.frequency.setValueAtTime(hz(base[b]) * clamp(Math.pow(sp / 1.1, 0.6), 0.5, 3.2), at(fr));
      p.pan.setValueAtTime(clamp((x0 - TL.cam[fr].cx) * 0.8, -0.9, 0.9), at(fr));
    }
    o.connect(lp).connect(g).connect(p); p.connect(master); p.connect(verb); o.start(0); o.stop(dur);
  }
  // a soft chime at every whole lap, a hit at each kick, a click at each close pass (a dip in the pair distance under 0.3)
  let lastLap = Math.floor(TL.lapAt(0));
  for (let fr = 1; fr < frames; fr++) {
    const L = TL.lapAt(fr), s0 = TL.lapAt(fr - 1) * SPL, s1 = L * SPL;
    if (Math.floor(L) > lastLap) { lastLap = Math.floor(L); if (fr < TL.k2) pluck(at(fr), 81, 0.04, 0, 1.4, 'sine'); }
    for (let s = Math.ceil(s0); s < s1 && s < RUN.n - 1; s++) {
      if (s < 1) continue;
      const c = RUN.cur;
      if (c[s] < 0.3 && c[s] < c[s - 1] && c[s] <= c[s + 1]) pluck(at(fr), 76 + Math.round(12 * (0.3 - c[s]) / 0.3), 0.05, (rnd() - 0.5) * 0.8, 0.3);
    }
  }
  for (const [kf, K_] of [[TL.k1, KICK1], [TL.k2, KICK2]]) {
    const t0 = at(kf), big = K_.k > 0.1;

    o.frequency.setValueAtTime(big ? 110 : 160, t0); o.frequency.exponentialRampToValueAtTime(big ? 40 : 70, t0 + 0.2);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(big ? 0.35 : 0.18, t0 + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t0 + (big ? 0.9 : 0.5));
    o.connect(g).connect(master); o.start(t0); o.stop(t0 + 1);
    const n = ac.createBufferSource(); n.buffer = noise; const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = big ? 900 : 1800; bp.Q.value = 1.4;
    const ng = ac.createGain(); ng.gain.setValueAtTime(0.0001, t0); ng.gain.exponentialRampToValueAtTime(big ? 0.12 : 0.05, t0 + 0.005); ng.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.35);
    n.connect(bp).connect(ng).connect(master); n.connect(bp); n.start(t0); n.stop(t0 + 0.4);
    pluck(t0 + 0.05, big ? 70 : 81, 0.05, 0, 1.2, 'sine');
  }
  [69, 73, 76, 81].forEach((m, i) => pluck(at(TL.calm) + i * 0.09, m, 0.05, -0.3 + i * 0.2, 1.6, 'sine'));
  [76, 81, 85, 88].forEach((m, i) => pluck(at(TL.end + 10 + i * 6), m, 0.045, -0.45 + i * 0.3, 1.8, 'sine'));
  const buf = await ac.startRendering();
  let peak = 0; for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let k = 0; k < d.length; k++) peak = Math.max(peak, Math.abs(d[k])); }
  const norm = 0.85 / Math.max(peak, 1e-6);                          // every piece peaks at the same level
  for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let k = 0; k < d.length; k++) d[k] *= norm; }
  return buf;
}

/* ==========================================================================
   VERTICAL CUT — shared block, identical in every piece.
   1080x1920 for Reels, Shorts and TikTok (__motion.variants.vertical). The
   piece's own scene code is re-used and recomposed for a phone: everything a
   viewer must read stays inside the area no platform covers (x 60..900,
   y 230..1400); outside it there is only dimmed texture.
   ========================================================================== */
const VW = 1080, VH = 1920, SAFE = { x: 60, y: 230, w: 840, h: 1170, r: 900, b: 1400 };
const vcv = document.createElement('canvas'); vcv.width = VW; vcv.height = VH;
const vx = vcv.getContext('2d', { willReadFrequently: true });   // CPU raster: identical pixels on every redraw
const VL = 96, VR = 864;                                          // text column inside the safe area

function vReset() {
  vx.setTransform(1, 0, 0, 1, 0, 0); vx.globalAlpha = 1; vx.globalCompositeOperation = 'source-over';
  vx.filter = 'none'; vx.shadowBlur = 0; vx.shadowColor = 'transparent'; vx.letterSpacing = '0px'; vx.setLineDash([]);
  vx.textAlign = 'left'; vx.textBaseline = 'alphabetic'; vx.lineCap = 'butt'; vx.lineJoin = 'miter';
}
/** Canvas text on the vertical frame; `max` shrinks the size until the line fits. */
function vText(str, x, y, { size = 40, weight = 700, color = '#FFFFFF', align = 'left', spacing = 0, alpha = 1, fam = FONT, max = 0 } = {}) {
  if (alpha <= 0.002 || !str) return size;
  vx.font = `${weight} ${size}px ${fam}`; vx.letterSpacing = spacing + 'px';
  if (max) { const w = vx.measureText(str).width; if (w > max) { size = size * max / w; vx.font = `${weight} ${size}px ${fam}`; } }
  vx.textAlign = align; vx.textBaseline = 'alphabetic';
  const a0 = vx.globalAlpha; vx.globalAlpha = a0 * alpha; vx.fillStyle = color;
  vx.fillText(str, x + (align === 'center' ? spacing / 2 : align === 'right' ? spacing : 0), y);   // tracking is added after the last glyph too
  vx.globalAlpha = a0; vx.letterSpacing = '0px';
  return size;
}
/** Word-wraps with the given font; returns the lines. */
function vWrap(str, maxW, size, weight = 700, fam = FONT) {
  vx.font = `${weight} ${size}px ${fam}`; vx.letterSpacing = '0px';
  const words = str.split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (vx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur);
  return lines;
}
/** Fade envelope with a small rise: [alpha, dy]. */
function vEnv(v, a, b, fin = 8, fout = 8) {
  const i = E.outCubic(prog(v, a, a + fin)), o = 1 - E.inCubic(prog(v, b - fout, b));
  return [Math.min(i, o), (1 - i) * 22 - (1 - o) * 10];
}
/** Which segment of a cut list a vertical frame is in: segs = [{ at, src, len }] in frames. */
function vSeg(segs, v) {
  let k = 0; while (k < segs.length - 1 && v >= segs[k + 1].at) k++;
  const s = segs[k];
  return { k, s, local: v - s.at, src: s.src + (v - s.at) };
}
/** Dims everything outside the safe area to a quiet texture (brightness x 0.2), with a soft inner edge. */
function vShade(rgb, a = 0.8, feather = 40) {
  vx.save(); vx.setTransform(1, 0, 0, 1, 0, 0); vx.globalAlpha = 1; vx.globalCompositeOperation = 'source-over';
  vx.fillStyle = `rgba(${rgb},${a})`;
  vx.beginPath(); vx.rect(0, 0, VW, VH); vx.rect(SAFE.x, SAFE.y, SAFE.w, SAFE.h); vx.fill('evenodd');
  const strip = (x0, y0, x1, y1, rx, ry, rw, rh) => {
    const g = vx.createLinearGradient(x0, y0, x1, y1);
    g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`);
    vx.fillStyle = g; vx.fillRect(rx, ry, rw, rh);

  strip(SAFE.r, 0, SAFE.r - feather, 0, SAFE.r - feather, SAFE.y, feather, SAFE.h);
  strip(0, SAFE.y, 0, SAFE.y + feather, SAFE.x, SAFE.y, SAFE.w, feather);
  strip(0, SAFE.b, 0, SAFE.b - feather, SAFE.x, SAFE.b - feather, SAFE.w, feather);

/** Series tag at the top of the safe area, e.g. MADE IN CODE · 04. */
function vTag(label, color, alpha = 1) {
  vText('MADE IN CODE', VL, 292, { size: 28, weight: 800, color, spacing: 5, alpha });
  vx.font = `800 28px ${FONT}`; vx.letterSpacing = '5px';
  const w = vx.measureText('MADE IN CODE').width; vx.letterSpacing = '0px';
  vText('·  ' + label, VL + w + 14, 292, { size: 28, weight: 600, color: 'rgba(255,255,255,0.72)', spacing: 3, alpha, max: VR - VL - w - 14 });
}
/** Big hook lines, left-aligned from y0; visible from frame 0, settles in a few frames. */
function vHook(v, lines, y0, { size = 84, lh = 1.08, color = '#FFFFFF', accent = null, weight = 800, spacing = -1.5, alpha = 1 } = {}) {
  const k = E.outExpo(prog(v, -6, 12));
  lines.forEach((ln, i) => {
    const kk = E.outExpo(prog(v, -12 + i * 2, 8 + i * 2));
    vText(ln, VL, y0 + i * size * lh + (1 - kk) * 30, { size, weight, spacing, color: accent && i === lines.length - 1 ? accent : color, alpha: alpha * Math.max(0.25, kk), max: VR - VL });
  });
  return k;
}
/** Closing card, the last 60 frames: piece title, "drawn in code · bytepatterns.com". l = frames into the card. */
function vEndCard(l, { title, line = '', ink = '#FFFFFF', dim = 'rgba(255,255,255,0.66)', accent = '#FFFFFF', scrim = '0,0,0', a = 0.84 }) {
  const k = E.outCubic(prog(l, 0, 12));
  vx.save(); vx.setTransform(1, 0, 0, 1, 0, 0);
  vx.fillStyle = `rgba(${scrim},${a * k})`; vx.fillRect(0, 0, VW, VH);
  vx.restore();
  const t1 = E.outExpo(prog(l, 3, 19)), t2 = E.outExpo(prog(l, 11, 27)), t3 = E.outExpo(prog(l, 19, 35));
  vx.fillStyle = accent; vx.globalAlpha = t1; vx.fillRect(VL, 742, 88 * t1, 7); vx.globalAlpha = 1;
  const size = vText(title, VL, 850 + (1 - t1) * 40, { size: 92, weight: 800, color: ink, spacing: -2, alpha: t1, max: VR - VL });
  const y2 = 850 + Math.max(size, 60) * 0.25 + 70;
  vx.font = `600 44px ${FONT}`;
  const lead = 'drawn in code  ·  ', lw = vx.measureText(lead).width;
  vText(lead, VL, y2 + (1 - t2) * 24, { size: 44, weight: 600, color: dim, alpha: t2 });
  vText('bytepatterns.com', VL + lw, y2 + (1 - t2) * 24, { size: 44, weight: 800, color: accent, alpha: t2 });
  if (line) vText(line, VL, y2 + 72 + (1 - t3) * 18, { size: 32, weight: 500, color: dim, alpha: t3, max: VR - VL });

/** Seeks a cut. The first frame a page draws is drawn twice: the very first read of a
 *  GPU-backed source canvas can come out a shade different from every later one. */
let vWarm = false;
function vSeek(draw, i, frames) {
  const f = Math.max(0, Math.min(frames - 1, Math.floor(i)));
  if (!vWarm) { vWarm = true; draw(f); }
  draw(f);

/** The soundtrack of a cut: the piece's own audio() spliced to the same segments as the picture. */
async function vAudio(segs, frames, { xf = 0.025, fadeOut = 0.6, extra = null } = {}) {
  const src = await renderAudio();
  const SR = 48000, dur = frames / FPS, ac = new OfflineAudioContext(2, Math.round(SR * dur), SR);
  const out = ac.createGain(); out.connect(ac.destination);
  out.gain.setValueAtTime(1, 0); out.gain.setValueAtTime(1, dur - fadeOut); out.gain.linearRampToValueAtTime(0, dur - 0.01);
  segs.forEach((s, k) => {

  if (peak > 0.9) for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] *= 0.9 / peak; }

/** A soft three-partial bell, for the closing card. */

/* VERTICAL CUT — this piece */
// The same run, entered one lap in (the eight is periodic, so the picture is the same and the
// trails already have a past), on a 1080 x 1920 stage with a shorter clock; the camera fits
// the trails into the safe area.
const TLV = buildTL({ lap0: 1, k1: 170, k2: 300, fpl3: 50, calm: 470, end: 500, card: 60, cap0: 40, cap1: 110,
  view: { w: 740, h: 700 }, maxSc: 380 });
const VFR = TLV.frames, VEND = VFR - 60;
const GV = { TL: TLV, w: VW, h: VH, vcx: 480, vcy: 880, trailW: 6, glow: 40, dot: 10,
  capX: VL, capY: 390, cap: 48, capTwo: true, capMax: VR - VL,
  fo: 30, foX: VL, foY: 1296, foAlign: 'left', foX2: VL, foY2: 1346, foAlign2: 'left', foMax: VR - VL,
  fn: 84, fnX: VL, fnY: 620, fnAlign: 'left', fnMax: VR - VL };
function hookV(v) {
  const o = 1 - E.inCubic(prog(v, TLV.cap0 - 10, TLV.cap0 + 4));
  if (o <= 0) return;
  vx.save(); vx.fillStyle = `rgba(${C.bgRGB},${0.7 * o})`; vx.fillRect(SAFE.x, 400, SAFE.w, 560); vx.restore();
  vHook(v, ['Three bodies.', 'One path.', 'Until you', 'kick one.'], 510, { size: 104, accent: C.accent, color: C.paper, weight: 900, spacing: -2, alpha: o });
}
function vDraw(v) {
  if (vx.reset) vx.reset();
  vReset();
  vx.fillStyle = C.bg; vx.fillRect(0, 0, VW, VH);
  frameScene(vx, GV, v);
  hookV(v);
  vReset();
  vShade(C.bgRGB, 0.86);
  vTag('THREE-BODY PROBLEM', C.accent);
  if (v >= VEND) vEndCard(v - VEND, { title: 'Three Bodies, One Eight', line: `period ${T.toFixed(4)}  ·  1% holds  ·  30% breaks it`,
    ink: C.paper, dim: 'rgba(242,239,232,0.72)', accent: C.accent, scrim: C.bgRGB, a: 0.88 });
  vReset();
}

// The player asks for a frame on every display refresh; at 30 fps on a 60 Hz screen every other call
// asks for the frame already on the canvas, which is then left as it is (same frame, same pixels).
const shown = { L: -1, V: -1 };
window.__motion = {
  title: 'Three Bodies, One Eight',
  description: `Three equal masses under Newton's gravity share one figure-eight path, each a third of a lap behind the next (to within ${expo(RUN.lag)}); the simulation measures one lap as ${T.toFixed(4)} time units and holds energy to a drift of ${expo(DRIFT8)}. A ${Math.round(KICK1.k * 100)}% kick to one body only makes the eight wobble (closest pass ${RMIN8.toFixed(3)} before, ${RMIN1.toFixed(3)} after); a ${Math.round(KICK2.k * 100)}% kick breaks it into a chaotic tangle with passes as close as ${RMIN30.toFixed(3)}. Each body's tone follows its own speed.`,
  fps: FPS, width: W, height: H, frames: FRAMES,
  poster: TLL.k2 + 120,
  gifStart: Math.floor(TLL.k2 / FPS) - 2,
  seek(i) { const f = Math.max(0, Math.min(FRAMES - 1, Math.floor(i))); if (f !== shown.L) { shown.L = f; draw(f); } },
  audio: () => renderAudio(TLL, FRAMES),
  variants: {
    vertical: {
      width: VW, height: VH, frames: VFR, canvas: vcv,
      poster: TLV.k2 + 90, gifStart: Math.floor(TLV.k2 / FPS) - 2,
      seek(i) { const v = Math.max(0, Math.min(VFR - 1, Math.floor(i))); if (v !== shown.V) { shown.V = v; vSeek(vDraw, v, VFR); } },
      audio: () => renderAudio(TLV, VFR),

/* ==========================================================================
   PLAYER — identical in every piece; keep as is.
   Autoplays and loops, starts sound on the first click, ?frame=N pauses on a
   frame, ?variant=vertical plays the vertical cut (if the piece has one).
   When the renderer sets window.__MOTION_RENDER__ it stays out of the way.
   ========================================================================== */
(function player() {
  const btn = document.getElementById('sound'), q = new URLSearchParams(location.search);
  let M = window.__motion;
  const V = !window.__MOTION_RENDER__ && M.variants && M.variants[q.get('variant')];
  if (V) {                                                // show the variant's own canvas instead
    M = Object.assign({}, M, V);
    V.canvas.style.cssText = `width:min(100vw,calc(100vh*${V.width}/${V.height}));height:auto;aspect-ratio:${V.width}/${V.height}`;
    document.querySelector('canvas').replaceWith(V.canvas);
  }
  const dur = M.frames / M.fps;

  btn.addEventListener('click', async () => {
    if (src) { src.stop(); src = null; btn.textContent = 'Click for sound'; t0 = performance.now(); return; }
    btn.textContent = 'Loading sound…';
    ac = ac || new AudioContext({ sampleRate: 48000 });
    buf = buf || await M.audio();
    await ac.resume();
    src = ac.createBufferSource(); src.buffer = buf; src.loop = true; src.connect(ac.destination);
    t0 = ac.currentTime + 0.05; src.start(t0);        // picture restarts from frame 0 in sync with the sound
    btn.textContent = 'Sound on — click to mute';
  });
  addEventListener('keydown', e => {
    if (e.code !== 'Space') return;
    e.preventDefault(); paused = !paused;
    if (ac) paused ? ac.suspend() : ac.resume();
    if (!ac) { if (paused) pausedAt = performance.now(); else t0 += performance.now() - pausedAt; }
  });
})();
</script>
</body>
