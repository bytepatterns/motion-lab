<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="teambytepatterns">
<meta name="description" content="Two damped pendulums steer one pen through three frequency ratios, a fifth, a fourth and an octave, and the soundtrack plays the same sum as two decaying tones.">
<title>Harmonograph — motion-lab</title>
<style>
  /* Player chrome. The piece itself lives entirely in the canvas. */
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; font: 500 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; }
  canvas { display: block; width: min(100vw, calc(100vh * 16 / 9)); height: auto; aspect-ratio: 16 / 9; }
  #sound { position: fixed; left: 16px; bottom: 16px; padding: 8px 14px; border: 1px solid rgba(255,255,255,.35); border-radius: 999px;
           background: rgba(0,0,0,.55); color: #fff; font: inherit; cursor: pointer; }
  #sound[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080" aria-label="A harmonograph: a pen driven by two damped pendulums draws three figures, for the ratios 2 to 3, 3 to 4 and 1 to 2, each spiralling slowly into the centre"></canvas>
<button id="sound" type="button">Click for sound</button>
<script>
'use strict';
/* ==========================================================================
   PIECE — Harmonograph.
   A pen is steered by two damped pendulums, one for x and one for y:
     x(t) = A1 sin(f1 t + p1) e^(-d1 t) + A2 sin(f2 t + p2) e^(-d2 t)
     y(t) = A3 sin(f3 t + p3) e^(-d3 t) + A4 sin(f4 t + p4) e^(-d4 t)
   Three drawings, one per ratio f1 : f3 = 2 : 3, 3 : 4, 1 : 2. The y swing
   runs 0.01 fast, so the figure turns slowly as it decays into the centre.
   The curves are sampled once at load; every frame re-strokes the curve from
   t = 0 up to the pen, and the pen's glow is the formula re-evaluated a few
   sub-frames back. The soundtrack is the same sum: two tones in the same
   ratio, with the same e^(-d t) envelopes, x on the left, y on the right.
   ========================================================================== */
const W = 1920, H = 1080, FPS = 30, FRAMES = 798;          // 26.6 s
const cv = document.getElementById('stage');
const ctx = cv.getContext('2d', { willReadFrequently: true });   // CPU raster: identical pixels on every redraw
const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
const MONO = 'ui-monospace, "Cascadia Code", Consolas, Menlo, monospace';

// ---- helpers -------------------------------------------------------------
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (f, a, b) => clamp((f - a) / (b - a));
const E = {
  inCubic: t => t * t * t,
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inOutCubic: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outExpo: t => t === 1 ? 1 : 1 - Math.pow(2, -10 * t),
  inExpo: t => t === 0 ? 0 : Math.pow(2, 10 * t - 10),
  outBack: t => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2),
};
function text(g, str, x, y, { size = 40, weight = 600, color = '#fff', alpha = 1, spacing = 0, align = 'left', fam = FONT, base = 'alphabetic' } = {}) {
  if (alpha <= 0.002 || !str) return 0;
  g.font = `${weight} ${size}px ${fam}`; g.letterSpacing = spacing + 'px';
  g.textAlign = align; g.textBaseline = base;
  const a0 = g.globalAlpha; g.globalAlpha = a0 * alpha; g.fillStyle = color;
  g.fillText(str, x, y);
  const w = g.measureText(str).width;
  g.globalAlpha = a0; g.letterSpacing = '0px';
  return w;
}
/** Width of a string in a font. */
function measure(g, str, size, weight = 900, spacing = 0) {
  g.font = `${weight} ${size}px ${FONT}`; g.letterSpacing = spacing + 'px';
  const w = g.measureText(str).width; g.letterSpacing = '0px'; return w;
}
const env = (f, a, b, fin = 12, fout = 10) => {
  const i = E.outCubic(prog(f, a, a + fin)), o = 1 - E.inCubic(prog(f, b - fout, b));
  return [Math.min(i, o), (1 - i) * 24 - (1 - o) * 10];
};

// ---- palette: coral for x, periwinkle for y, on a deep aubergine ------------
const C = {
  bg: '#110D17', bgRGB: '17,13,23', paper: '#F3EDE6', dim: 'rgba(243,237,230,0.62)', faint: 'rgba(243,237,230,0.16)',
  warm: '#FF8C6B', warmRGB: [255, 140, 107], cool: '#8EA6FF', coolRGB: [142, 166, 255], pen: '#FFF6EC',
};
const mix = (u, a = 1) => { const w = C.warmRGB, c = C.coolRGB;
  return `rgba(${Math.round(lerp(w[0], c[0], u))},${Math.round(lerp(w[1], c[1], u))},${Math.round(lerp(w[2], c[2], u))},${a})`; };

// ---- the model: three harmonographs, sampled once ---------------------------
const LOOPS = 20, TMAX = 2 * Math.PI * LOOPS;               // the figure closes every 2π; twenty turns
const DETUNE = 0.01;                                         // y runs this much fast: the figure turns
const NPTS = 12000;                                          // samples per curve (= line segments at the end)
const dk = v => v / TMAX;                                    // damping as "e-folds over the whole drawing"
const DR = [
  { a: 2, b: 3, name: 'a perfect fifth', short: 'fifth', base: 110, p: [0, 0.5, Math.PI / 2, 2], d: [dk(2.1), dk(3), dk(2.1), dk(3)] },
  { a: 3, b: 4, name: 'a perfect fourth', short: 'fourth', base: 110, p: [0, 0.5, Math.PI / 2, 2], d: [dk(2.0), dk(3), dk(2.0), dk(3)] },
  { a: 1, b: 2, name: 'an octave', short: 'octave', base: 220, p: [0, 0.5, Math.PI / 2, 2], d: [dk(2.2), dk(3), dk(2.2), dk(3)] },
].map(D => {
  // x: the a-swing plus a little of the b-swing; y: the (b + detune)-swing plus a little of the a-swing
  D.f = [D.a, D.b, D.b + DETUNE, D.a]; D.A = [0.8, 0.2, 0.8, 0.2];
  D.at = t => {
    const e = k => D.A[k] * Math.sin(D.f[k] * t + D.p[k]) * Math.exp(-D.d[k] * t);
    return [e(0) + e(1), e(2) + e(3)];
  };
  D.xs = new Float32Array(NPTS); D.ys = new Float32Array(NPTS);
  for (let i = 0; i < NPTS; i++) { const [x, y] = D.at(TMAX * i / (NPTS - 1)); D.xs[i] = x; D.ys[i] = y; }
  D.endSwing = Math.round(100 * Math.exp(-D.d[0] * TMAX));   // what is left of the x swing when the pen stops
  return D;
});
const fmt = v => (Math.round(v * 100) / 100).toString();
/** Pen time for drawing progress u: starts slow so the first turn reads, then speeds up. */
const S = u => 0.5 * u + 0.5 * u * u;
const Sinv = s => -0.5 + Math.sqrt(0.25 + 2 * s);

// ---- timelines (frames). s: first frame of each drawing, L: its length ---------
function timeline(s, L, hold, exit, fin, end) { return { s, L, hold, exit, fin, end }; }
const TLL = timeline([-12, 210, 432], 186, 24, 18, 652, 726);
const uOf = (TL, k, f) => clamp((f - TL.s[k]) / TL.L);
const exitOf = (TL, k, f) => { const e0 = TL.s[k] + TL.L + TL.hold; return E.inCubic(prog(f, e0, e0 + TL.exit)); };
/** Frames at which the pen of drawing k finishes each turn. */
const loopFrames = (TL, k) => Array.from({ length: LOOPS }, (_, m) => TL.s[k] + Sinv((m + 1) / LOOPS) * TL.L);

// ---- drawing ------------------------------------------------------------------------
const NB = 24;                                               // colour bands along the curve
/** The curve of drawing D from t = 0 to the pen at progress u, centred at (cx, cy), radius R. */
function figure(g, D, cx, cy, R, u, { alpha = 1, lw = 1.6, step = 1, head = true, uPrev = null } = {}) {
  if (alpha <= 0.01 || u <= 0) return;
  const tNow = TMAX * S(u), iEnd = tNow / TMAX * (NPTS - 1), last = Math.floor(iEnd);
  const band = (NPTS - 1) / NB, bNow = Math.floor(iEnd / band);
  const X = i => cx + R * D.xs[i], Y = i => cy + R * D.ys[i];
  const [ex, ey] = D.at(tNow), px = cx + R * ex, py = cy + R * ey;
  g.save(); g.lineCap = 'round'; g.lineJoin = 'round';
  // the drawn line, band by band: older bands a little dimmer and thinner (changes only when a band is passed)
  for (let b = 0; b <= bNow && b < NB; b++) {
    const i0 = Math.floor(b * band), i1 = Math.min(last, Math.floor((b + 1) * band));
    const age = clamp((bNow - b) / 7);
    g.globalAlpha = alpha * (head ? lerp(0.95, 0.5, age) : 0.9);
    g.strokeStyle = mix(b / (NB - 1)); g.lineWidth = lw * (head ? lerp(1.25, 0.8, age) : 1);
    g.beginPath(); g.moveTo(X(i0), Y(i0));
    for (let i = i0 + step; i <= i1; i += step) g.lineTo(X(i), Y(i));
    if (i1 === last) g.lineTo(px, py);
    else g.lineTo(X(i1), Y(i1));
    g.stroke();
  }
  if (head && uPrev !== null) {
    // the glow: the last moments of the pen, re-evaluated as sub-frames
    const t0 = TMAX * S(uPrev), n = 18;
    g.strokeStyle = C.pen; g.lineWidth = lw * 2.2; g.globalAlpha = alpha * 0.85;
    g.shadowColor = C.warm; g.shadowBlur = 14;
    g.beginPath();
    for (let k = 0; k <= n; k++) { const [x, y] = D.at(lerp(t0, tNow, k / n)); if (k) g.lineTo(cx + R * x, cy + R * y); else g.moveTo(cx + R * x, cy + R * y); }
    g.stroke();
    g.fillStyle = C.pen; g.globalAlpha = alpha; g.shadowBlur = 22;
    g.beginPath(); g.arc(px, py, lw * 3.8, 0, Math.PI * 2); g.fill();
    g.shadowBlur = 0; g.shadowColor = 'transparent';
  }
  g.restore();
  return [px, py];
}
/** A ring that opens at the pen each time it finishes a turn. */
function turnRing(g, TL, k, f, px, py, alpha) {
  for (const lf of loopFrames(TL, k)) {
    const a = prog(f, lf, lf + 12);
    if (a <= 0 || a >= 1) continue;
    g.save(); g.globalAlpha = alpha * (1 - a) * 0.8; g.strokeStyle = C.pen; g.lineWidth = 2;
    g.beginPath(); g.arc(px, py, 8 + 34 * E.outCubic(a), 0, Math.PI * 2); g.stroke(); g.restore();
  }
}
/** One drawing at frame f in timeline TL: the curve, the pen, the turn rings. Returns progress info. */
function drawing(g, G, TL, k, f) {
  const u = uOf(TL, k, f), out = exitOf(TL, k, f);
  if (f < TL.s[k] || out >= 1) return null;
  const D = DR[k], sc = lerp(1, 0.9, out), live = f <= TL.s[k] + TL.L;
  const headA = 1 - prog(f, TL.s[k] + TL.L, TL.s[k] + TL.L + 10);
  figure(g, D, G.cx, G.cy, G.R * sc, u, { alpha: 1 - out, lw: G.lw, head: true, uPrev: uOf(TL, k, f - 1.5) });
  if (headA > 0) {
    const [ex, ey] = D.at(TMAX * S(u));
    turnRing(g, TL, k, f, G.cx + G.R * sc * ex, G.cy + G.R * sc * ey, headA);
  }
  return { u, out, live, t: TMAX * S(u) };
}
/** A pendulum whose angle is the x or y sum of drawing k at time t. */
function pendulum(g, px, py, len, ang, col, label, alpha) {
  if (alpha <= 0.01) return;
  const MAXA = 0.42;
  g.save(); g.globalAlpha = alpha;
  g.strokeStyle = C.faint; g.lineWidth = 2;
  g.beginPath(); g.arc(px, py, len, Math.PI / 2 - MAXA, Math.PI / 2 + MAXA); g.stroke();
  const bx = px + Math.sin(ang * MAXA) * len, by = py + Math.cos(ang * MAXA) * len;
  g.strokeStyle = 'rgba(243,237,230,0.55)'; g.lineWidth = 3; g.lineCap = 'round';
  g.beginPath(); g.moveTo(px, py); g.lineTo(bx, by); g.stroke();
  g.fillStyle = C.paper; g.beginPath(); g.arc(px, py, 6, 0, Math.PI * 2); g.fill();
  g.fillStyle = col; g.beginPath(); g.arc(bx, by, 17, 0, Math.PI * 2); g.fill();
  g.restore();
  text(g, label, px + 26, py + 12, { size: 34, weight: 800, color: col, alpha });
}
/** The ratio, big: "2 : 3" with the x number warm and the y number cool. Returns its width. */
function ratio(g, D, x, y, size, align, alpha, dy = 0) {
  if (alpha <= 0.01) return;
  const sp = -size * 0.03, a = String(D.a), b = String(D.b), mid = ' : ';
  const wa = measure(g, a, size, 900, sp), wm = measure(g, mid, size * 0.8, 800, 0), wb = measure(g, b, size, 900, sp);
  const tot = wa + wm + wb, x0 = align === 'center' ? x - tot / 2 : x;
  text(g, a, x0, y + dy, { size, weight: 900, color: C.warm, spacing: sp, alpha });
  text(g, mid, x0 + wa, y + dy - size * 0.06, { size: size * 0.8, weight: 800, color: C.dim, alpha });
  text(g, b, x0 + wa + wm, y + dy, { size, weight: 900, color: C.cool, spacing: sp, alpha });
  return tot;
}
function backdrop(g, w, h, G) {
  g.fillStyle = C.bg; g.fillRect(0, 0, w, h);
  // paper: a faint, static dot grid centred on the drawing
  g.fillStyle = 'rgba(243,237,230,0.06)';
  const s = 40, ox = G.cx % s, oy = G.cy % s;
  for (let y = oy; y < h; y += s) for (let x = ox; x < w; x += s) g.fillRect(x - 1, y - 1, 2, 2);
}

// ---- landscape picture ------------------------------------------------------------------
const GL = { cx: 1150, cy: 560, R: 372, lw: 1.7, colX: 120, pend: [[1716, 196], [1716, 566]], pendLen: 226 };
function hookL(f) {
  const o = 1 - E.inCubic(prog(f, 50, 64));
  if (o <= 0) return;
  const lines = [['Two', C.paper], ['pendulums.', C.paper], ['One pen.', C.warm]];
  const size = Math.min(132, 132 * 600 / measure(ctx, 'pendulums.', 132, 900, -4));
  lines.forEach(([s, col], i) => {
    const k = E.outExpo(prog(f, -12 + i * 3, 8 + i * 3));
    text(ctx, s, GL.colX, 420 + i * size * 1.02 + (1 - k) * 30 - (1 - o) * 16, { size, weight: 900, color: col, spacing: -4, alpha: o * Math.max(0.3, k) });
  });
}
/** The left column for drawing k: ratio, interval, what it means, the pen's turn and swing. */
function labelsL(f, TL, k, info) {
  const D = DR[k], s0 = k === 0 ? 62 : TL.s[k] + 6, e1 = TL.s[k] + TL.L + TL.hold + TL.exit;
  const x = GL.colX;
  const a = E.outBack(prog(f, s0, s0 + 16)), o = 1 - E.inCubic(prog(f, e1 - 14, e1));
  if (a <= 0 || o <= 0) return;
  ratio(ctx, D, x, 420, 210, 'left', clamp(a * 1.5) * o, (1 - clamp(a)) * 40);
  const [a2, d2] = env(f, s0 + 8, e1, 12, 14), [a3, d3] = env(f, s0 + 14, e1, 12, 14), [a4, d4] = env(f, s0 + 20, e1, 12, 14);
  text(ctx, D.name, x, 520 + d2, { size: 56, weight: 850, color: C.paper, spacing: -1, alpha: a2 });
  text(ctx, `x swings ${D.a} time${D.a > 1 ? 's' : ''} while y swings ${fmt(D.b + DETUNE)}`, x, 590 + d3, { size: 32, weight: 600, color: C.dim, alpha: a3 });
  text(ctx, `${fmt(DETUNE)} off, so the figure turns`, x, 636 + d3, { size: 32, weight: 600, color: C.dim, alpha: a3 });
  // the pen: which turn, how much swing is left
  const turn = Math.min(LOOPS, Math.floor(info.t / (2 * Math.PI)) + 1), swing = Math.round(100 * Math.exp(-D.d[0] * info.t));
  text(ctx, `turn ${turn} of ${LOOPS}`, x, 760 + d4, { size: 40, weight: 800, color: C.paper, alpha: a4 });
  ctx.save(); ctx.globalAlpha = a4;
  ctx.fillStyle = C.faint; ctx.fillRect(x, 800 + d4, 420, 10);
  ctx.fillStyle = C.warm; ctx.fillRect(x, 800 + d4, 420 * swing / 100, 10);
  ctx.restore();
  text(ctx, `swing left  ${swing}%`, x, 858 + d4, { size: 32, weight: 700, color: C.dim, alpha: a4 });
}
function pendulumsL(f, TL, k, info) {
  if (!info) return;
  const D = DR[k], a = E.outCubic(prog(f, TL.s[k] + 4, TL.s[k] + 20)) * (1 - info.out);
  const [x, y] = D.at(info.t);
  pendulum(ctx, GL.pend[0][0], GL.pend[0][1], GL.pendLen, x, C.warm, 'x', a);
  pendulum(ctx, GL.pend[1][0], GL.pend[1][1], GL.pendLen, y, C.cool, 'y', a);
}
/** The ending: the three finished figures side by side. */
function finaleL(f, TL) {
  const o = 1 - E.inCubic(prog(f, TL.end + 4, TL.end + 20));
  if (f < TL.fin || o <= 0) return;
  const [ha, hdy] = env(f, TL.fin + 2, TL.end + 20, 14, 16);
  text(ctx, 'One sum. Three ratios.', W / 2, 228 + hdy, { size: 64, weight: 850, color: C.paper, spacing: -1.5, align: 'center', alpha: ha });
  DR.forEach((D, k) => {
    const a = E.outBack(prog(f, TL.fin + 6 + k * 9, TL.fin + 22 + k * 9)), cx = 480 + k * 480, cy = 560;
    if (a <= 0) return;
    figure(ctx, D, cx, cy, 196 * lerp(0.6, 1, clamp(a)), 1, { alpha: clamp(a * 1.4) * o, lw: 1.3, step: 2, head: false });
    ratio(ctx, D, cx, 880, 84, 'center', clamp(a * 1.4) * o, (1 - clamp(a)) * 30);
    text(ctx, D.short, cx, 936 + (1 - clamp(a)) * 30, { size: 36, weight: 700, color: C.dim, align: 'center', alpha: clamp(a * 1.4) * o });
  });
}
function draw(f) {
  if (ctx.reset) ctx.reset();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none'; ctx.shadowBlur = 0;
  backdrop(ctx, W, H, GL);
  const TL = TLL, endK = E.inOutCubic(prog(f, TL.end, TL.end + 20)), a = 1 - endK;
  text(ctx, 'MATH  ·  HARMONOGRAPH', 120, 104, { size: 26, weight: 600, color: C.dim, spacing: 5, alpha: a });
  text(ctx, 'BYTEPATTERNS', 1800, 104, { size: 26, weight: 600, color: C.dim, spacing: 5, align: 'right', alpha: a });
  for (let k = 0; k < DR.length; k++) {
    const info = drawing(ctx, GL, TL, k, f);
    if (!info) continue;
    pendulumsL(f, TL, k, info);
    labelsL(f, TL, k, info);
  }
  hookL(f);
  finaleL(f, TL);
  if (endK > 0) {
    ctx.fillStyle = `rgba(${C.bgRGB},${0.9 * endK})`; ctx.fillRect(0, 0, W, H);
    const k1 = E.outCubic(prog(f, TL.end + 6, TL.end + 28)), k2 = E.outCubic(prog(f, TL.end + 16, TL.end + 38)), k3 = E.outCubic(prog(f, TL.end + 26, TL.end + 48));
    text(ctx, 'Harmonograph', W / 2, 500 + (1 - k1) * 30, { size: 140, weight: 850, color: C.paper, spacing: -3, align: 'center', alpha: k1 });
    text(ctx, 'two damped pendulums  ·  one pen  ·  a fifth, a fourth, an octave', W / 2, 580 + (1 - k2) * 20, { size: 42, weight: 500, color: C.warm, align: 'center', alpha: k2 });
    text(ctx, 'drawn in code  ·  bytepatterns.com', W / 2, 1000, { size: 32, weight: 600, color: C.paper, spacing: 3, align: 'center', alpha: k3 * 0.8 });
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.letterSpacing = '0px'; ctx.shadowBlur = 0;
}

// ---- sound: the same sum, heard. x tones on the left, y tones on the right, same ratio, same decay ----
async function renderAudio(TL = TLL, frames = FRAMES) {
  const SR = 48000, dur = frames / FPS, LEN = Math.round(SR * dur);
  const ac = new OfflineAudioContext(2, LEN, SR);
  const at = fr => Math.max(0, fr / FPS);
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -16; comp.ratio.value = 3; comp.attack.value = 0.005; comp.release.value = 0.25;
  const master = ac.createGain(); master.gain.value = 0.95; master.connect(comp).connect(ac.destination);
  master.gain.setValueAtTime(0.95, dur - 0.9); master.gain.linearRampToValueAtTime(0.0001, dur - 0.02);
  const rnd = mulberry32(0x29A7);
  const ir = ac.createBuffer(2, SR * 2.4, SR);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let k = 0; k < d.length; k++) d[k] = (rnd() * 2 - 1) * Math.pow(1 - k / d.length, 3.2); }
  const verb = ac.createConvolver(); verb.buffer = ir; const vg = ac.createGain(); vg.gain.value = 0.3; verb.connect(vg).connect(master);
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  const voice = (pan) => { const p = ac.createStereoPanner(); p.pan.value = pan; p.connect(master); p.connect(verb); return p; };
  const pluck = (t0, freq, pan, amp = 0.12) => {
    for (const [mul, v, dec] of [[1, 1, 0.9], [2, 0.35, 0.35], [3, 0.12, 0.18]]) {
      const o = ac.createOscillator(), g = ac.createGain(); o.type = mul === 1 ? 'triangle' : 'sine'; o.frequency.value = freq * mul;
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(amp * v, t0 + 0.003); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dec);
      o.connect(g).connect(voice(pan)); o.start(t0); o.stop(t0 + dec + 0.05);
    }
  };
  const bell = (t0, freq, amp, pan) => { for (const [r2, a2, d2] of [[1, 1, 1.6], [2.76, 0.25, 0.6], [5.4, 0.08, 0.25]]) {
    const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = freq * r2;
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(amp * a2, t0 + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d2);
    o.connect(g).connect(voice(pan)); o.start(t0); o.stop(t0 + d2 + 0.05); } };
  // a gentle pad under everything: A and E, low and soft
  for (const [m, det] of [[45, -4], [45, 4], [52, -3], [52, 3], [57, 0]]) {
    const o = ac.createOscillator(), g = ac.createGain(), lp = ac.createBiquadFilter();
    o.type = 'sawtooth'; o.frequency.value = hz(m); o.detune.value = det; lp.type = 'lowpass'; lp.frequency.value = 480; lp.Q.value = 0.4;
    g.gain.setValueAtTime(0.0001, 0); g.gain.exponentialRampToValueAtTime(0.012, 2.0);
    g.gain.setValueAtTime(0.012, at(TL.end + 30)); g.gain.exponentialRampToValueAtTime(0.0001, dur - 0.05);
    o.connect(lp).connect(g); g.connect(master); g.connect(verb); o.start(0); o.stop(dur);
  }
  // the drawings: four sines per figure, the same terms as the pen, with the same decay
  DR.forEach((D, k) => {
    const s = TL.s[k], fEnd = s + TL.L, fOut = fEnd + TL.hold + TL.exit, f0 = Math.max(0, s);
    const terms = [[D.f[0], D.A[0], D.d[0], -0.6], [D.f[1], D.A[1], D.d[1], -0.6], [D.f[2], D.A[2], D.d[2], 0.6], [D.f[3], D.A[3], D.d[3], 0.6]];
    terms.forEach(([fr, A, d, pan]) => {
      const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.value = D.base * fr;
      const vol = 0.13 * A / (D.base * fr / 220) ** 0.35;                     // higher tones a little softer
      const amp = ff => vol * Math.exp(-d * TMAX * S(uOf(TL, k, ff)));
      g.gain.setValueAtTime(0.0001, at(f0)); g.gain.exponentialRampToValueAtTime(amp(f0), at(f0) + 0.05);
      for (let ff = f0 + 3; ff <= fEnd; ff += 3) g.gain.linearRampToValueAtTime(amp(ff), at(ff));
      g.gain.exponentialRampToValueAtTime(0.0001, at(fOut));
      o.connect(g).connect(voice(pan)); o.start(at(f0)); o.stop(at(fOut) + 0.05);
    });
    // a soft pluck as the pen touches the paper
    pluck(at(s), D.base * D.a * 2, -0.5); pluck(at(s) + 0.03, D.base * D.b * 2, 0.5);
    // a quiet bell for every turn the pen finishes, softer as the swing dies
    loopFrames(TL, k).forEach((lf, m) => {
      if (lf < 0) return;
      const sw = Math.exp(-D.d[0] * TMAX * S(uOf(TL, k, lf)));
      bell(at(lf), D.base * (m % 2 ? D.b : D.a) * 4, 0.05 * (0.35 + 0.65 * sw), m % 2 ? 0.35 : -0.35);
    });
  });
  // the finale: each figure's interval once more, as it appears
  DR.forEach((D, k) => { const t0 = at(TL.fin + 6 + k * 9); pluck(t0, D.base * D.a * 2, -0.4, 0.1); pluck(t0 + 0.04, D.base * D.b * 2, 0.4, 0.1); });
  // the closing bell chord
  [69, 73, 76, 81].forEach((m, i) => bell(at(TL.end + 8 + i * 6), hz(m), 0.07, -0.45 + i * 0.3));
  const buf = await ac.startRendering();
  let peak = 0; for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let k = 0; k < d.length; k++) peak = Math.max(peak, Math.abs(d[k])); }
  if (peak > 0.89 || peak < 0.5) for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let k = 0; k < d.length; k++) d[k] *= 0.89 / peak; }
  return buf;
}

/* ==========================================================================
   VERTICAL CUT — shared block, identical in every piece.
   1080x1920 for Reels, Shorts and TikTok (__motion.variants.vertical). The
   piece's own scene code is re-used and recomposed for a phone: everything a
   viewer must read stays inside the area no platform covers (x 60..900,
   y 230..1400); outside it there is only dimmed texture.
   ========================================================================== */
const VW = 1080, VH = 1920, SAFE = { x: 60, y: 230, w: 840, h: 1170, r: 900, b: 1400 };
const vcv = document.createElement('canvas'); vcv.width = VW; vcv.height = VH;
const vx = vcv.getContext('2d', { willReadFrequently: true });   // CPU raster: identical pixels on every redraw
const VL = 96, VR = 864;                                          // text column inside the safe area

function vReset() {
  vx.setTransform(1, 0, 0, 1, 0, 0); vx.globalAlpha = 1; vx.globalCompositeOperation = 'source-over';
  vx.filter = 'none'; vx.shadowBlur = 0; vx.shadowColor = 'transparent'; vx.letterSpacing = '0px'; vx.setLineDash([]);
  vx.textAlign = 'left'; vx.textBaseline = 'alphabetic'; vx.lineCap = 'butt'; vx.lineJoin = 'miter';
}
/** Canvas text on the vertical frame; `max` shrinks the size until the line fits. */
function vText(str, x, y, { size = 40, weight = 700, color = '#FFFFFF', align = 'left', spacing = 0, alpha = 1, fam = FONT, max = 0 } = {}) {
  if (alpha <= 0.002 || !str) return size;
  vx.font = `${weight} ${size}px ${fam}`; vx.letterSpacing = spacing + 'px';
  if (max) { const w = vx.measureText(str).width; if (w > max) { size = size * max / w; vx.font = `${weight} ${size}px ${fam}`; } }
  vx.textAlign = align; vx.textBaseline = 'alphabetic';
  const a0 = vx.globalAlpha; vx.globalAlpha = a0 * alpha; vx.fillStyle = color;
  vx.fillText(str, x + (align === 'center' ? spacing / 2 : align === 'right' ? spacing : 0), y);   // tracking is added after the last glyph too
  vx.globalAlpha = a0; vx.letterSpacing = '0px';
  return size;
}
/** Word-wraps with the given font; returns the lines. */
function vWrap(str, maxW, size, weight = 700, fam = FONT) {
  vx.font = `${weight} ${size}px ${fam}`; vx.letterSpacing = '0px';
  const words = str.split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (vx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur);
  return lines;
}
/** Fade envelope with a small rise: [alpha, dy]. */
function vEnv(v, a, b, fin = 8, fout = 8) {
  const i = E.outCubic(prog(v, a, a + fin)), o = 1 - E.inCubic(prog(v, b - fout, b));
  return [Math.min(i, o), (1 - i) * 22 - (1 - o) * 10];
}
/** Which segment of a cut list a vertical frame is in: segs = [{ at, src, len }] in frames. */
function vSeg(segs, v) {
  let k = 0; while (k < segs.length - 1 && v >= segs[k + 1].at) k++;
  const s = segs[k];
  return { k, s, local: v - s.at, src: s.src + (v - s.at) };
}
/** Dims everything outside the safe area to a quiet texture (brightness x 0.2), with a soft inner edge. */
function vShade(rgb, a = 0.8, feather = 40) {
  vx.save(); vx.setTransform(1, 0, 0, 1, 0, 0); vx.globalAlpha = 1; vx.globalCompositeOperation = 'source-over';
  vx.fillStyle = `rgba(${rgb},${a})`;
  vx.beginPath(); vx.rect(0, 0, VW, VH); vx.rect(SAFE.x, SAFE.y, SAFE.w, SAFE.h); vx.fill('evenodd');
  const strip = (x0, y0, x1, y1, rx, ry, rw, rh) => {
    const g = vx.createLinearGradient(x0, y0, x1, y1);
    g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`);
    vx.fillStyle = g; vx.fillRect(rx, ry, rw, rh);
  };
  strip(SAFE.x, 0, SAFE.x + feather, 0, SAFE.x, SAFE.y, feather, SAFE.h);
  strip(SAFE.r, 0, SAFE.r - feather, 0, SAFE.r - feather, SAFE.y, feather, SAFE.h);
  strip(0, SAFE.y, 0, SAFE.y + feather, SAFE.x, SAFE.y, SAFE.w, feather);
  strip(0, SAFE.b, 0, SAFE.b - feather, SAFE.x, SAFE.b - feather, SAFE.w, feather);
  vx.restore();
}
/** Series tag at the top of the safe area, e.g. MADE IN CODE · 04. */
function vTag(label, color, alpha = 1) {
  vText('MADE IN CODE', VL, 292, { size: 28, weight: 800, color, spacing: 5, alpha });
  vx.font = `800 28px ${FONT}`; vx.letterSpacing = '5px';
  const w = vx.measureText('MADE IN CODE').width; vx.letterSpacing = '0px';
  vText('·  ' + label, VL + w + 14, 292, { size: 28, weight: 600, color: 'rgba(255,255,255,0.72)', spacing: 3, alpha, max: VR - VL - w - 14 });
}
/** Big hook lines, left-aligned from y0; visible from frame 0, settles in a few frames. */
function vHook(v, lines, y0, { size = 84, lh = 1.08, color = '#FFFFFF', accent = null, weight = 800, spacing = -1.5, alpha = 1 } = {}) {
  const k = E.outExpo(prog(v, -6, 12));
  lines.forEach((ln, i) => {
    const kk = E.outExpo(prog(v, -12 + i * 2, 8 + i * 2));
    vText(ln, VL, y0 + i * size * lh + (1 - kk) * 30, { size, weight, spacing, color: accent && i === lines.length - 1 ? accent : color, alpha: alpha * Math.max(0.25, kk), max: VR - VL });
  });
  return k;
}
/** Closing card, the last 60 frames: piece title, "drawn in code · bytepatterns.com". l = frames into the card. */
function vEndCard(l, { title, line = '', ink = '#FFFFFF', dim = 'rgba(255,255,255,0.66)', accent = '#FFFFFF', scrim = '0,0,0', a = 0.84 }) {
  const k = E.outCubic(prog(l, 0, 12));
  vx.save(); vx.setTransform(1, 0, 0, 1, 0, 0);
  vx.fillStyle = `rgba(${scrim},${a * k})`; vx.fillRect(0, 0, VW, VH);
  vx.restore();
  const t1 = E.outExpo(prog(l, 3, 19)), t2 = E.outExpo(prog(l, 11, 27)), t3 = E.outExpo(prog(l, 19, 35));
  vx.fillStyle = accent; vx.globalAlpha = t1; vx.fillRect(VL, 742, 88 * t1, 7); vx.globalAlpha = 1;
  const size = vText(title, VL, 850 + (1 - t1) * 40, { size: 92, weight: 800, color: ink, spacing: -2, alpha: t1, max: VR - VL });
  const y2 = 850 + Math.max(size, 60) * 0.25 + 70;
  vx.font = `600 44px ${FONT}`;
  const lead = 'drawn in code  ·  ', lw = vx.measureText(lead).width;
  vText(lead, VL, y2 + (1 - t2) * 24, { size: 44, weight: 600, color: dim, alpha: t2 });
  vText('bytepatterns.com', VL + lw, y2 + (1 - t2) * 24, { size: 44, weight: 800, color: accent, alpha: t2 });
  if (line) vText(line, VL, y2 + 72 + (1 - t3) * 18, { size: 32, weight: 500, color: dim, alpha: t3, max: VR - VL });
}
/** Seeks a cut. The first frame a page draws is drawn twice: the very first read of a
 *  GPU-backed source canvas can come out a shade different from every later one. */
let vWarm = false;
function vSeek(draw, i, frames) {
  const f = Math.max(0, Math.min(frames - 1, Math.floor(i)));
  if (!vWarm) { vWarm = true; draw(f); }
  draw(f);
}
/** The soundtrack of a cut: the piece's own audio() spliced to the same segments as the picture. */
async function vAudio(segs, frames, { xf = 0.025, fadeOut = 0.6, extra = null } = {}) {
  const src = await renderAudio();
  const SR = 48000, dur = frames / FPS, ac = new OfflineAudioContext(2, Math.round(SR * dur), SR);
  const out = ac.createGain(); out.connect(ac.destination);
  out.gain.setValueAtTime(1, 0); out.gain.setValueAtTime(1, dur - fadeOut); out.gain.linearRampToValueAtTime(0, dur - 0.01);
  segs.forEach((s, k) => {
    const at = s.at / FPS, off = s.src / FPS, d = s.len / FPS;
    const pre = k === 0 ? 0 : Math.min(xf, off), post = k === segs.length - 1 ? 0 : xf;
    const b = ac.createBufferSource(), g = ac.createGain(); b.buffer = src;
    g.gain.setValueAtTime(pre ? 0 : 1, at - pre);
    if (pre) g.gain.linearRampToValueAtTime(1, at + pre);
    if (post) { g.gain.setValueAtTime(1, at + d - post); g.gain.linearRampToValueAtTime(0, at + d + post); }
    b.connect(g).connect(out); b.start(at - pre, off - pre, d + pre + post);
  });
  if (extra) extra(ac, out);
  const buf = await ac.startRendering();
  let peak = 0; for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) peak = Math.max(peak, Math.abs(d[i])); }
  if (peak > 0.9) for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] *= 0.9 / peak; }
  return buf;
}
/** A soft three-partial bell, for the closing card. */
function vChime(ac, dest, at, freq, vol = 0.08) {
  for (const [mul, v, dec] of [[1, 1, 1.8], [2.01, 0.35, 0.8], [3.02, 0.12, 0.4]]) {
    const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.value = freq * mul;
    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol * v, at + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, at + dec);
    o.connect(g).connect(dest); o.start(at); o.stop(at + dec + 0.05);
  }
}

/* VERTICAL CUT — this piece */
// The vertical cut runs its own, tighter clock: the same three drawings, one
// at a time, large, with the ratio above; then the three figures stacked and
// the closing card. Its soundtrack is the same renderAudio() re-timed to it.
const TLV = timeline([-8, 148, 304], 140, 12, 16, 470, 530);
const VFR = 590, VEND = VFR - 60;
const GV = { cx: 480, cy: 890, R: 318, lw: 1.6 };
function hookV(v) {
  const o = 1 - E.inCubic(prog(v, 44, 58));
  if (o <= 0) return;
  vHook(v, ['Two pendulums.', 'One pen.'], 440, { size: 92, accent: C.warm, weight: 900, spacing: -2.5, alpha: o });
}
function labelsV(v, TL, k, info) {
  const D = DR[k], s0 = k === 0 ? 56 : TL.s[k] + 4, e1 = TL.s[k] + TL.L + TL.hold + TL.exit;
  const a = E.outBack(prog(v, s0, s0 + 14)), o = 1 - E.inCubic(prog(v, e1 - 12, e1));
  if (a <= 0 || o <= 0) return;
  ratio(vx, D, GV.cx, 500, 170, 'center', clamp(a * 1.5) * o, (1 - clamp(a)) * 40);
  const [a2, d2] = env(v, s0 + 6, e1, 12, 12), [a3, d3] = env(v, s0 + 12, e1, 12, 12);
  vText(D.name, GV.cx, 1300 + d2, { size: 56, weight: 850, color: C.paper, spacing: -1, align: 'center', alpha: a2 });
  const turn = Math.min(LOOPS, Math.floor(info.t / (2 * Math.PI)) + 1), swing = Math.round(100 * Math.exp(-D.d[0] * info.t));
  vText(`turn ${turn} of ${LOOPS}  ·  swing ${swing}%`, GV.cx, 1366 + d3, { size: 34, weight: 700, color: C.dim, align: 'center', alpha: a3 });
}
function finaleV(v, TL) {
  if (v < TL.fin) return;
  DR.forEach((D, k) => {
    const a = E.outBack(prog(v, TL.fin + 4 + k * 8, TL.fin + 20 + k * 8)), cx = 260, cy = 520 + k * 330;
    if (a <= 0) return;
    figure(vx, D, cx, cy, 136 * lerp(0.6, 1, clamp(a)), 1, { alpha: clamp(a * 1.4), lw: 1.3, step: 2, head: false });
    ratio(vx, D, 470, cy + 20 + (1 - clamp(a)) * 30, 104, 'left', clamp(a * 1.4));
    vText(D.short, 474, cy + 84 + (1 - clamp(a)) * 30, { size: 40, weight: 700, color: C.dim, alpha: clamp(a * 1.4) });
  });
}
function vDraw(v) {
  vReset();
  backdrop(vx, VW, VH, GV);
  for (let k = 0; k < DR.length; k++) {
    const info = drawing(vx, GV, TLV, k, v);
    if (info) labelsV(v, TLV, k, info);
  }
  hookV(v);
  finaleV(v, TLV);
  vReset();
  vShade(C.bgRGB, 0.84);
  vTag('HARMONOGRAPH', C.warm);
  if (v >= VEND) vEndCard(v - VEND, { title: 'Harmonograph', line: 'two pendulums · one pen · three ratios',
    ink: C.paper, dim: 'rgba(243,237,230,0.72)', accent: C.warm, scrim: C.bgRGB, a: 0.9 });
  vReset();
}

window.__motion = {
  title: 'Harmonograph',
  description: `Two damped pendulums steer one pen through ${DR.map(D => D.a + ':' + D.b).join(', ')}, a fifth, a fourth and an octave: each figure is ${LOOPS} turns of the same sum, drawn until the swing has decayed to ${Math.min(...DR.map(D => D.endSwing))}-${Math.max(...DR.map(D => D.endSwing))}%, and the soundtrack plays that sum as two decaying tones.`,
  fps: FPS, width: W, height: H, frames: FRAMES,
  poster: 700,
  gifStart: 8,
  seek(i) { draw(Math.max(0, Math.min(FRAMES - 1, Math.floor(i)))); },
  audio: renderAudio,
  variants: {
    vertical: {
      width: VW, height: VH, frames: VFR, canvas: vcv,
      poster: 250, gifStart: 5,
      seek(i) { vSeek(vDraw, i, VFR); },
      audio: () => renderAudio(TLV, VFR),
    },
  },
};

/* ==========================================================================
   PLAYER — identical in every piece; keep as is.
   Autoplays and loops, starts sound on the first click, ?frame=N pauses on a
   frame, ?variant=vertical plays the vertical cut (if the piece has one).
   When the renderer sets window.__MOTION_RENDER__ it stays out of the way.
   ========================================================================== */
(function player() {
  const btn = document.getElementById('sound'), q = new URLSearchParams(location.search);
  let M = window.__motion;
  const V = !window.__MOTION_RENDER__ && M.variants && M.variants[q.get('variant')];
  if (V) {                                                // show the variant's own canvas instead
    M = Object.assign({}, M, V);
    V.canvas.style.cssText = `width:min(100vw,calc(100vh*${V.width}/${V.height}));height:auto;aspect-ratio:${V.width}/${V.height}`;
    document.querySelector('canvas').replaceWith(V.canvas);
  }
  const dur = M.frames / M.fps;
  if (window.__MOTION_RENDER__) { btn.hidden = true; M.seek(0); return; }
  if (q.has('frame')) { btn.hidden = true; M.seek(+q.get('frame') || 0); return; }
  let t0 = performance.now(), ac = null, src = null, buf = null, paused = false, pausedAt = 0;
  const clock = () => ac && src ? (ac.currentTime - t0) : (performance.now() - t0) / 1000;
  function loop() {
    if (!paused) M.seek(Math.floor(((clock() % dur) + dur) % dur * M.fps));
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  btn.addEventListener('click', async () => {
    if (src) { src.stop(); src = null; btn.textContent = 'Click for sound'; t0 = performance.now(); return; }
    btn.textContent = 'Loading sound…';
    ac = ac || new AudioContext({ sampleRate: 48000 });
    buf = buf || await M.audio();
    await ac.resume();
    src = ac.createBufferSource(); src.buffer = buf; src.loop = true; src.connect(ac.destination);
    t0 = ac.currentTime + 0.05; src.start(t0);        // picture restarts from frame 0 in sync with the sound
    btn.textContent = 'Sound on — click to mute';
  });
  addEventListener('keydown', e => {
    if (e.code !== 'Space') return;
    e.preventDefault(); paused = !paused;
    if (ac) paused ? ac.suspend() : ac.resume();
    if (!ac) { if (paused) pausedAt = performance.now(); else t0 += performance.now() - pausedAt; }
  });
})();
</script>
