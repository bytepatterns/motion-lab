<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="teambytepatterns">
<meta name="description" content="Elementary cellular automata, one row at a time: the eight cases of rule 30, its chaotic triangle grown from one live cell, rule 110 from random cells, and a last cascade steered row by row into the word code.">
<title>One Row at a Time — motion-lab</title>
<style>
  /* Player chrome. The piece itself lives entirely in the canvas. */
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; font: 500 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; }
  canvas { display: block; width: min(100vw, calc(100vh * 16 / 9)); height: auto; aspect-ratio: 16 / 9; }
  #sound { position: fixed; left: 16px; bottom: 16px; padding: 8px 14px; border: 1px solid rgba(255,255,255,.35); border-radius: 999px;
           background: rgba(0,0,0,.55); color: #fff; font: inherit; cursor: pointer; }
  #sound[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080" aria-label="A row of square cells grows downward one row at a time: the eight cases of rule 30, its chaotic triangle, rule 110, and a last cascade that resolves into the word code"></canvas>
<button id="sound" type="button">Click for sound</button>
<script>
'use strict';
/* ==========================================================================
   PIECE — One Row at a Time.
   Elementary cellular automata: a row of cells, and every new row is
   computed from the three cells above each cell by an 8-bit rule.
   1. The rule: the eight three-cell cases of rule 30 and their outputs;
      read as a binary number, the outputs are 00011110 = 30.
   2. Rule 30 from one live cell, one row at a time: the first rows slowly
      (the three parent cells boxed), then faster and faster. Each row is a
      tick; its pitch comes from the centre column, which looks random.
   3. Rule 110 (01101110) from a block of random cells.
   4. A last rule-30 cascade from a few random cells. The rule runs as usual;
      then, row by row, every cell is steered onto a bitmap of the word
      "code" (a 5x7 font defined below): cells of the word light up, the rest
      of the texture dims. The rule does not compute the word; the steering
      does, and the piece counts how many cells it had to change.
   Every row is computed once, at load, into Uint8Arrays; each frame draws
   rows 0..k from scratch, so seek(i) is pure in i.
   ========================================================================== */
const W = 1920, H = 1080, FPS = 30;
const cv = document.getElementById('stage');
const ctx = cv.getContext('2d', { willReadFrequently: true });   // CPU raster: identical pixels on every redraw
const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
const MONO = 'ui-monospace, "Cascadia Code", Consolas, Menlo, monospace';

// ---- helpers -------------------------------------------------------------
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (f, a, b) => clamp((f - a) / (b - a));
const E = {
  inCubic: t => t * t * t,
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inOutCubic: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outExpo: t => t === 1 ? 1 : 1 - Math.pow(2, -10 * t),
  inExpo: t => t === 0 ? 0 : Math.pow(2, 10 * t - 10),
  inOutExpo: t => t === 0 ? 0 : t === 1 ? 1 : t < .5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2,
  outBack: t => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2),
};
function text(g, str, x, y, { size = 40, weight = 600, color = '#fff', alpha = 1, spacing = 0, align = 'left', fam = FONT, base = 'alphabetic' } = {}) {
  if (alpha <= 0.002 || !str) return 0;
  g.font = `${weight} ${size}px ${fam}`; g.letterSpacing = spacing + 'px';
  g.textAlign = align; g.textBaseline = base;
  const a0 = g.globalAlpha; g.globalAlpha = a0 * alpha; g.fillStyle = color;
  g.fillText(str, x, y);
  const w = g.measureText(str).width;
  g.globalAlpha = a0; g.letterSpacing = '0px';
  return w;
}
const env = (f, a, b, fin = 12, fout = 10) => {
  const i = E.outCubic(prog(f, a, a + fin)), o = 1 - E.inCubic(prog(f, b - fout, b));
  return [Math.min(i, o), (1 - i) * 24 - (1 - o) * 10];
};
const fmt = n => n.toLocaleString('en-US');

// ---- palette -------------------------------------------------------------
const C = {
  bg: '#100E0C', bgRGB: '16,14,12', panel: '#16130F', paper: '#F4EDE2', dim: 'rgba(244,237,226,0.6)', faint: 'rgba(244,237,226,0.24)',
  warm: '#FF8A3D', warmHi: '#FFC77A', hot: '#FFF1DC', cool: '#4FD1E0', coolHi: '#D2F8FF',
};

// ---- the rules -----------------------------------------------------------------------
// Case j (0..7) is the three-cell pattern 7 - j: 111, 110, 101, 100, 011, 010, 001, 000.
// The rule's number is its eight outputs read as one binary number.
const bitsOf = r => Array.from({ length: 8 }, (_, j) => (r >> (7 - j)) & 1);
const ruleOf = bits => bits.reduce((a, b) => a * 2 + b, 0);
const B30 = bitsOf(30), B110 = bitsOf(110);
const N30 = ruleOf(B30), N110 = ruleOf(B110);
const PLACES = B30.map((b, j) => b ? 1 << (7 - j) : 0).filter(Boolean);        // 16 + 8 + 4 + 2

// ---- a 5x7 font, only the four letters it needs -----------------------------------------
const FONT57 = {
  c: ['.....', '.....', '.####', '#....', '#....', '#....', '.####'],
  o: ['.....', '.....', '.###.', '#...#', '#...#', '#...#', '.###.'],
  d: ['....#', '....#', '.####', '#...#', '#...#', '#...#', '.####'],
  e: ['.....', '.....', '.###.', '#...#', '#####', '#....', '.####'],
};
const WORD = 'code';
const BMW = WORD.length * 6 - 1, BMH = 7;                    // 23 x 7 font pixels
const bitmapAt = (x, y) => {
  if (x < 0 || y < 0 || x >= BMW || y >= BMH || x % 6 === 5) return 0;
  return FONT57[WORD[(x / 6) | 0]][y][x % 6] === '#' ? 1 : 0;
};

// ---- timeline (frames; 120 BPM = 15 frames a beat) --------------------------------------
const BEAT = 15;
const T = {
  hookOut: 44, tab: 60, bin: 127.5, eq: 142.5, leg: 180,
  c30: 195, slow: 210, zoom0: 262, zoom1: 322, fast0: 270, acc: 330,
  col0: 402, col1: 446,
  r110: 450, r110row: 465, note1: 496, note2: 530,
  code: 585, codeRow: 597, wordA: 650,
  end: 726,
};
T.done = T.wordA + 7 * 2.7 + 16;                             // the word has settled
const FRAMES = T.end + 72;                                   // 798 = 26.6 s
const SW = 6;                                                // a slow row is written left to right over 6 frames
const PX = 2.7;                                              // frames per font-pixel row of the steering front

// when each row appears (shared by every layout; a layout just shows fewer or more rows)
const MAXR = 112;
const ROW30 = [], ROW110 = [], ROWC = [];
ROW30[0] = T.c30;
for (let k = 1; k <= 8; k++) ROW30[k] = T.slow + (k - 1) * 7.5;          // eighth notes
for (let k = 9; k <= 24; k++) ROW30[k] = T.fast0 + (k - 9) * 3.75;       // sixteenths
{ let t = T.acc; for (let k = 25; k < MAXR; k++) { ROW30[k] = t; t += Math.max(1 / 3, 3.75 * Math.pow(0.93, k - 25)); } }
ROW110[0] = T.r110row;
{ let t = T.r110row + 8; for (let k = 1; k < MAXR; k++) { ROW110[k] = t; t += Math.max(1 / 3, 2.5 * Math.pow(0.92, k - 1)); } }
for (let k = 0; k < MAXR; k++) ROWC[k] = T.codeRow + k * 0.5;
const shown = (sched, f, n) => { let k = 0; while (k < n && sched[k] <= f) k++; return k; };

// ---- the model: every row, computed once ---------------------------------------------------
/** Runs the automata for a layout: `cols` visible cells, `rows` rows. The run is wider
 *  than the view (dead cells beyond it) so nothing hits an edge that would not be there. */
function makeModel(G) {
  const cols = G.cols, rows = G.rows, pad = rows + 8, MW = cols + 2 * pad, cc = cols >> 1;
  const run = (rule, init) => {
    const out = []; let p = init;
    for (let k = 0; k < rows; k++) {
      if (k) {
        const r = new Uint8Array(MW);
        for (let c = 0; c < MW; c++) { const a = c ? p[c - 1] : 0, b = p[c], d = c < MW - 1 ? p[c + 1] : 0; r[c] = (rule >> (a << 2 | b << 1 | d)) & 1; }
        p = r;
      }
      out.push(p.slice(pad, pad + cols));
    }
    return out;
  };
  const i30 = new Uint8Array(MW); i30[pad + cc] = 1;
  const r30 = run(N30, i30);
  const rA = mulberry32(0x0110), b0 = Math.floor(cols * 0.6);
  const i110 = new Uint8Array(MW); for (let c = b0; c < cols; c++) i110[pad + c] = rA() < 0.5 ? 1 : 0;
  const r110 = run(N110, i110);
  const rB = mulberry32(0xC0DE);
  const iC = new Uint8Array(MW); for (let c = cc - 4; c <= cc + 4; c++) iC[pad + c] = rB() < 0.5 ? 1 : 0; iC[pad + cc] = 1;
  const rC = run(N30, iC);
  // the target: the word, font pixel (x, y) = a scale x scale block of cells
  const s = G.word.scale, c0 = Math.floor((cols - BMW * s) / 2), w0 = G.word.row0;
  const tgt = [];
  for (let k = 0; k < rows; k++) { const r = new Uint8Array(cols); for (let c = 0; c < cols; c++) r[c] = bitmapAt(Math.floor((c - c0) / s), Math.floor((k - w0) / s)); tgt.push(r); }
  const rJ = mulberry32(0x5E77), jit = new Float32Array(rows * cols); for (let q = 0; q < jit.length; q++) jit[q] = rJ();
  const settle = new Float32Array(rows * cols);
  let changed = 0;
  for (let k = 0; k < rows; k++) for (let c = 0; c < cols; c++) {
    settle[k * cols + c] = T.wordA + (k - w0) / s * PX + 10 * jit[k * cols + c];
    if (rC[k][c] !== tgt[k][c]) changed++;
  }
  const centre = r30.map(r => r[cc]);
  const live30 = []; { let a = 0; r30.forEach(r => { for (const v of r) a += v; live30.push(a); }); }
  return { cols, rows, cc, r30, r110, rC, tgt, settle, changed, centre, live30, block: cols - b0, wordCells: tgt.reduce((a, r) => a + r.reduce((x, y) => x + y, 0), 0) };
}

// ---- drawing the field ------------------------------------------------------------------------
/** The field's apex: the top edge of the centre column; zoom scales about it. */
const apex = G => [G.fx + (G.M.cc + 0.5) * G.cs, G.fy];
/** Cell (k, c) at zoom z, snapped to whole pixels, with a 1 px (or wider when zoomed) gap. sc scales it about its centre. */
function cell(g, G, z, k, c, sc = 1) {
  const s = G.cs * z, [px, py] = apex(G), cc = G.M.cc;
  const x0 = Math.round(px + (c - cc - 0.5) * s), x1 = Math.round(px + (c - cc + 0.5) * s);
  const y0 = Math.round(py + k * s), y1 = Math.round(py + (k + 1) * s);
  const gap = s >= 16 ? Math.round(s * 0.08) : 1, w = x1 - x0 - gap, h = y1 - y0 - gap;
  if (sc === 1) { g.fillRect(x0, y0, w, h); return; }
  if (sc <= 0.02) return;
  g.fillRect(x0 + w * (1 - sc) / 2, y0 + h * (1 - sc) / 2, w * sc, h * sc);
}
function cellBox(G, z, k, c0, c1) {                          // outer box of cells c0..c1 in row k
  const s = G.cs * z, [px, py] = apex(G), cc = G.M.cc;
  return [Math.round(px + (c0 - cc - 0.5) * s), Math.round(py + k * s), Math.round(px + (c1 - cc + 0.5) * s), Math.round(py + (k + 1) * s)];
}
function clipField(g, G) { g.save(); g.beginPath(); g.rect(G.fx, G.fy, G.cols * G.cs, G.rows * G.cs); g.clip(); }
/** Which columns / rows are on screen at zoom z. */
function span(G, z) {
  const s = G.cs * z, [px] = apex(G), cc = G.M.cc;
  const c0 = Math.max(0, Math.floor(cc + 0.5 + (G.fx - px) / s) - 1), c1 = Math.min(G.cols - 1, Math.ceil(cc + 0.5 + (G.fx + G.cols * G.cs - px) / s) + 1);
  return [c0, c1, Math.min(G.rows, Math.ceil(G.rows / z) + 1)];
}
const zoomAt = (G, f) => Math.exp(Math.log(G.z0) * (1 - E.inOutCubic(prog(f, T.zoom0, T.zoom1))));

/** The slow rows: which cell is being written, and the pattern of its three parents. */
function slowCursor(G, f) {
  for (let k = 1; k <= 8; k++) {
    if (f < ROW30[k] || f >= ROW30[k] + SW) continue;
    const n = 2 * k + 1, j = Math.min(n - 1, Math.floor(prog(f, ROW30[k], ROW30[k] + SW) * n)), c = G.M.cc - k + j, p = G.M.r30[k - 1];
    return { k, c, pat: p[c - 1] << 2 | p[c] << 1 | p[c + 1] };
  }
  return null;
}

/** Frame 0: the whole rule-30 triangle, dim, behind the hook. */
function sceneTeaser(g, G, f, a0 = 0.22) {
  const a = a0 * (1 - E.inOutCubic(prog(f, 30, 58)));
  if (a <= 0.004) return;
  const M = G.M;
  g.globalAlpha = a; g.fillStyle = C.warm;
  for (let k = 0; k < M.rows; k++) { const r = M.r30[k]; for (let c = 0; c < M.cols; c++) if (r[c]) cell(g, G, 1, k, c); }
  g.globalAlpha = 1;
}
/** Act 2: rule 30 from one live cell. */
function sceneRule30(g, G, f) {
  if (f < T.c30 || f >= T.r110 + 14) return;
  const M = G.M, a = 1 - E.inCubic(prog(f, T.r110, T.r110 + 14)), z = zoomAt(G, f);
  const n = shown(ROW30, f, M.rows), [c0, c1, kv] = span(G, z);
  clipField(g, G);
  g.globalAlpha = a; g.fillStyle = C.warm;
  for (let k = 0; k < Math.min(n, kv); k++) {
    const r = M.r30[k], slowK = k >= 1 && k <= 8, lo = M.cc - k;
    for (let c = c0; c <= c1; c++) {
      if (!r[c]) continue;
      let sc = 1;
      if (k === 0) sc = E.outBack(prog(f, T.c30, T.c30 + 10));
      else if (slowK) {
        const tc = ROW30[k] + SW * (c - lo) / (2 * k + 1);
        if (f < tc) continue;
        sc = lerp(0.3, 1, E.outBack(prog(f, tc, tc + 4)));
      }
      cell(g, G, z, k, c, sc);
    }
  }
  // the newest rows glow, and each row's centre cell flashes as it lands
  for (let k = 0; k < Math.min(n, kv); k++) {
    const age = f - ROW30[k];
    if (age < 4 && k > 8) {
      g.globalAlpha = a * 0.85 * (1 - age / 4); g.fillStyle = C.hot;
      const r = M.r30[k]; for (let c = c0; c <= c1; c++) if (r[c]) cell(g, G, z, k, c);
    }
    const cAge = k >= 1 && k <= 8 ? f - (ROW30[k] + SW * k / (2 * k + 1)) : age;     // slow rows: when the sweep reaches the centre
    if (cAge >= 0 && cAge < 12 && M.centre[k]) { g.globalAlpha = a * (1 - cAge / 12); g.fillStyle = C.hot; cell(g, G, z, k, M.cc); }
  }
  // the centre column, top to bottom
  const cu = prog(f, T.col0, T.col0 + 30), co = (1 - prog(f, T.col1 - 12, T.col1)) * a;
  if (cu > 0 && co > 0) {
    const kk = Math.floor(E.inOutCubic(cu) * (M.rows - 1));
    for (let k = 0; k <= Math.min(kk, n - 1, kv - 1); k++) {
      g.globalAlpha = co * 0.22; g.fillStyle = C.paper; cell(g, G, z, k, M.cc);
      if (M.centre[k]) { g.globalAlpha = co; g.fillStyle = C.hot; cell(g, G, z, k, M.cc); }
    }
    const [x0, y0, x1] = cellBox(G, z, 0, M.cc, M.cc), y1 = cellBox(G, z, Math.min(kk, n - 1), M.cc, M.cc)[3];
    g.globalAlpha = co * 0.9; g.strokeStyle = C.warmHi; g.lineWidth = 2; g.strokeRect(x0 - 3, y0 - 3, x1 - x0 + 5, y1 - y0 + 5);
  }
  // the slow rows: the three parents boxed, the new cell outlined
  const cur = slowCursor(G, f);
  if (cur) {
    const b = cellBox(G, z, cur.k - 1, cur.c - 1, cur.c + 1), t = cellBox(G, z, cur.k, cur.c, cur.c), lw = Math.max(2, Math.round(G.cs * z * 0.08));
    g.globalAlpha = a; g.strokeStyle = C.paper; g.lineWidth = lw;
    g.strokeRect(b[0] - lw, b[1] - lw, b[2] - b[0] + lw, b[3] - b[1] + lw);
    g.strokeStyle = C.warmHi; g.strokeRect(t[0] - lw, t[1] - lw / 2, t[2] - t[0] + lw, t[3] - t[1] + lw / 2);
  }
  g.globalAlpha = 1; g.restore();
}
/** Act 3: rule 110 from a block of random cells on the right; it grows to the left. */
function sceneRule110(g, G, f) {
  if (f < T.r110row || f >= T.code + 12) return;
  const M = G.M, a = 1 - E.inCubic(prog(f, T.code, T.code + 12)), n = shown(ROW110, f, M.rows);
  clipField(g, G);
  g.globalAlpha = a; g.fillStyle = C.cool;
  const b0 = M.cols - M.block;
  for (let k = 0; k < n; k++) {
    const r = M.r110[k];
    for (let c = 0; c < M.cols; c++) {
      if (!r[c]) continue;
      if (k === 0) { const tc = T.r110row + 6 * (c - b0) / M.block; if (f < tc) continue; cell(g, G, 1, 0, c, lerp(0.3, 1, E.outBack(prog(f, tc, tc + 5)))); }
      else cell(g, G, 1, k, c);
    }
  }
  for (let k = 1; k < n; k++) {
    const age = f - ROW110[k]; if (age >= 4) continue;
    g.globalAlpha = a * 0.85 * (1 - age / 4); g.fillStyle = C.coolHi;
    const r = M.r110[k]; for (let c = 0; c < M.cols; c++) if (r[c]) cell(g, G, 1, k, c);
  }
  g.globalAlpha = 1; g.restore();
}
/** Act 4: rule 30 again, then every cell steered onto the word. Returns how many cells the steering has changed so far. */
function sceneCode(g, G, f) {
  if (f < T.codeRow) return 0;
  const M = G.M, n = shown(ROWC, f, M.rows), cols = M.cols;
  let changed = 0, style = '', al = -1;
  const set = (s, a) => { if (s !== style) { g.fillStyle = style = s; } if (a !== al) { g.globalAlpha = al = a; } };
  clipField(g, G);
  for (let k = 0; k < n; k++) {
    const r = M.rC[k], t = M.tgt[k], age = f - ROWC[k];
    for (let c = 0; c < cols; c++) {
      const v = r[c], tg = t[c], st = M.settle[k * cols + c];
      if (f < st) {
        if (!v) continue;
        if (k === 0) { set(C.warm, 1); cell(g, G, 1, 0, c, E.outBack(prog(f, T.codeRow, T.codeRow + 8))); continue; }
        set(age < 1.5 ? C.hot : age < 3.5 ? C.warmHi : C.warm, 1); cell(g, G, 1, k, c); continue;
      }
      if (v !== tg) changed++;
      const u = prog(f, st, st + 6);
      if (tg) { set(u < 1 ? (u < 0.5 ? C.warmHi : C.hot) : C.paper, 1); cell(g, G, 1, k, c, v ? 1 : clamp(E.outBack(u), 0, 1.3)); }
      else if (v) { set(C.warm, lerp(1, 0.16, E.outCubic(u))); cell(g, G, 1, k, c); }
    }
  }
  // the steering front: a thin line across the field
  const kf = G.word.row0 + (f - T.wordA) / PX * G.word.scale;
  const fa = Math.min(prog(f, T.wordA - G.word.row0 / G.word.scale * PX - 4, T.wordA - G.word.row0 / G.word.scale * PX + 4), 1 - prog(kf, M.rows - 6, M.rows));
  if (fa > 0 && kf < M.rows) { const y = Math.round(G.fy + kf * G.cs); set(C.paper, 0.5 * fa); g.fillRect(G.fx, y, cols * G.cs, 2); }
  g.globalAlpha = 1; g.restore();
  return changed;
}

// ---- the rule table / legend ---------------------------------------------------------------
/** One case: three cells, and under the middle one the output. (x, y) = top-left. */
function drawCase(g, x, y, cs, gap, pat, out, outCol, { alpha = 1, sc = 1, outK = 1, hl = 0 } = {}) {
  if (alpha <= 0.01) return;
  const st = cs + gap, wd = 3 * cs + 2 * gap, ht = 2.5 * cs + gap;
  g.save(); g.translate(x + wd / 2, y + ht / 2); g.scale(sc, sc); g.translate(-wd / 2, -ht / 2);
  const lw = Math.max(1.5, cs * 0.07);
  const box = (bx, by, on, col, a) => {
    if (on) { g.globalAlpha = alpha * a; g.fillStyle = col; g.fillRect(bx, by, cs, cs); }
    else { g.globalAlpha = alpha * 0.4 * a; g.strokeStyle = C.paper; g.lineWidth = lw; g.strokeRect(bx + lw / 2, by + lw / 2, cs - lw, cs - lw); }
  };
  for (let b = 0; b < 3; b++) box(b * st, 0, (pat >> (2 - b)) & 1, C.paper, 1);
  if (outK > 0) box(st, cs * 1.5 + gap, out, outCol, outK);
  if (hl > 0) { g.globalAlpha = alpha * hl; g.strokeStyle = C.warmHi; g.lineWidth = lw * 2; g.strokeRect(-lw * 3, -lw * 3, wd + lw * 6, ht + lw * 6); }
  g.restore();
}
const flipAt = j => [T.r110 + 2 * j, T.code + 2 * j];
const ruleAt = (j, f) => { const [a, b] = flipAt(j); return f >= a && f < b ? N110 : N30; };
const outBit = (j, f) => (ruleAt(j, f) === N110 ? B110 : B30)[j];
const numAt = f => f >= T.r110 + 16 && f < T.code + 16 ? N110 : N30;
function monoAdv(g, size) { g.font = `800 ${size}px ${MONO}`; g.letterSpacing = '0px'; return g.measureText('0').width; }

function tableLegend(g, G, f) {
  if (f < T.tab) return;

  const TB = G.tab, LG = G.leg;

  const big = G.big, advB = monoAdv(g, big.size), bx0 = big.cx - advB * 13 / 2;
  const advS = monoAdv(g, G.bin.size);
  for (let j = 0; j < 8; j++) {
    const t0 = T.tab + 7.5 * j, pj = E.outBack(prog(f, t0, t0 + 10));
    const [px, py] = TB.pos[j], lx = LG.x + j * LG.sp, ly = LG.y;
    const cs = lerp(TB.cs, LG.cs, m), gap = lerp(TB.gap, LG.gap, m);

    const fl = flipAt(j).reduce((s, ft) => s + Math.sin(Math.PI * prog(f, ft, ft + 8)), 0);

    const d1x = bx0 + (j + 0.5) * advB, d1y = big.y;
    const d2x = G.bin.x + (j + 0.5) * advS, d2y = G.bin.y;

    const x0 = lerp(bx0, G.bin.x, m), y = lerp(big.y, G.bin.y, m), num = numAt(f);
    const pk = [T.r110 + 16, T.code + 16].reduce((s, ft) => s + Math.sin(Math.PI * prog(f, ft, ft + 8)), 0);
    text(g, '=', x0 + 9.5 * adv, y, { size, weight: 800, fam: MONO, align: 'center', color: C.dim, alpha: clamp(ke) });
    g.save(); g.translate(x0 + 11 * adv, y); g.scale(ke * (1 + 0.2 * pk), ke * (1 + 0.2 * pk));
    text(g, String(num), 0, 0, { size, weight: 800, fam: MONO, color: num === N110 ? C.cool : C.warm, alpha: clamp(ke) });
    g.restore();
  }
  // 16 + 8 + 4 + 2, under the big number
  const [wa, wdy] = env(f, T.eq + 8, T.leg + 4, 10, 8);
  text(g, PLACES.join(' + ') + ' = ' + N30, big.cx, big.y + big.wy + wdy, { size: big.wsize, weight: 700, fam: MONO, align: 'center', color: C.dim, alpha: wa });
}

function backdrop(g, w, h) { g.fillStyle = C.bg; g.fillRect(0, 0, w, h); }

/** The small centre-column readout: the last n bits, newest on the right. */
function centreBits(g, G, f, x, y, size, n, align, alpha) {

  }
}

// ---- sound: a sparse 120 BPM techno pulse; every row is a click pitched by the centre column ---------------
async function renderAudio() {
  const SR = 48000, dur = FRAMES / FPS, LEN = Math.round(SR * dur);
  const ac = new OfflineAudioContext(2, LEN, SR);
  const at = fr => fr / FPS;
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -14; comp.ratio.value = 3.5; comp.attack.value = 0.003; comp.release.value = 0.18;
  const master = ac.createGain(); master.gain.value = 0.95; master.connect(comp).connect(ac.destination);
  master.gain.setValueAtTime(0.95, dur - 0.8); master.gain.linearRampToValueAtTime(0.0001, dur - 0.02);
  const rnd = mulberry32(0x30B7);
  const ir = ac.createBuffer(2, SR * 1.6, SR);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let k = 0; k < d.length; k++) d[k] = (rnd() * 2 - 1) * Math.pow(1 - k / d.length, 3.8); }
  const verb = ac.createConvolver(); verb.buffer = ir; const vg = ac.createGain(); vg.gain.value = 0.22; verb.connect(vg).connect(master);
  const noise = ac.createBuffer(1, SR, SR); { const d = noise.getChannelData(0); for (let k = 0; k < d.length; k++) d[k] = rnd() * 2 - 1; }
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  const kick = (t0, amp = 0.5) => { const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.setValueAtTime(150, t0); o.frequency.exponentialRampToValueAtTime(44, t0 + 0.12);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(amp, t0 + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.26);
    o.connect(g).connect(master); o.start(t0); o.stop(t0 + 0.28); };
  const hat = (t0, amp = 0.05, d = 0.04) => { const s = ac.createBufferSource(); s.buffer = noise; const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 8000;
    const g = ac.createGain(); g.gain.setValueAtTime(amp, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    s.connect(hp).connect(g).connect(master); s.start(t0, (t0 * 3.1) % 0.9, d + 0.02); };
  const blip = (t0, m, amp, pan = 0, type = 'triangle', dec = 0.05, wet = true) => { const o = ac.createOscillator(), g = ac.createGain(), p = ac.createStereoPanner();
    o.type = type; o.frequency.value = hz(m); p.pan.value = pan;
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(amp, t0 + 0.002); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dec);
    if (type === 'square') { const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = hz(m) * 3; o.connect(lp).connect(g); } else o.connect(g);
    g.connect(p); p.connect(master); if (wet) p.connect(verb); o.start(t0); o.stop(t0 + dec + 0.02); };
  const bell = (t0, m, amp, pn = 0) => { for (const [r2, a2, d2] of [[1, 1, 1.4], [2.76, 0.3, 0.6], [5.4, 0.1, 0.25]]) {
    const o = ac.createOscillator(); o.frequency.value = hz(m) * r2; const g = ac.createGain(), p = ac.createStereoPanner();
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(amp * a2, t0 + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d2);
    p.pan.value = pn; o.connect(g).connect(p); p.connect(master); p.connect(verb); o.start(t0); o.stop(t0 + d2 + 0.05); } };
  const sweep = (t0, d) => {                                    // a rule change: filtered noise and a gliding tone, rising
    const s = ac.createBufferSource(); s.buffer = noise; const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 4;
    bp.frequency.setValueAtTime(300, t0); bp.frequency.exponentialRampToValueAtTime(5000, t0 + d);
    const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.16, t0 + d * 0.7); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    s.connect(bp).connect(g).connect(master); s.start(t0, 0.1, d + 0.05);
    const o = ac.createOscillator(), og = ac.createGain(); o.type = 'sawtooth'; const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1400;
    o.frequency.setValueAtTime(110, t0); o.frequency.exponentialRampToValueAtTime(880, t0 + d);
    og.gain.setValueAtTime(0.0001, t0); og.gain.exponentialRampToValueAtTime(0.05, t0 + d * 0.8); og.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    o.connect(lp).connect(og).connect(master); og.connect(verb); o.start(t0); o.stop(t0 + d + 0.05); };
  const pad = (t0, notes, d, amp) => notes.forEach((m, i) => { const o = ac.createOscillator(), g = ac.createGain(), lp = ac.createBiquadFilter(), p = ac.createStereoPanner();
    o.type = 'sawtooth'; o.frequency.value = hz(m); o.detune.value = (i % 2 ? 6 : -6); lp.type = 'lowpass'; lp.frequency.setValueAtTime(500, t0); lp.frequency.exponentialRampToValueAtTime(2400, t0 + d * 0.4);
    p.pan.value = -0.5 + i / Math.max(1, notes.length - 1);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(amp, t0 + d * 0.25); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    o.connect(lp).connect(g).connect(p); p.connect(master); p.connect(verb); o.start(t0); o.stop(t0 + d + 0.05); });
  const M = GL.M;
  // the pulse: half-time kick under the rule table, four on the floor from the first row, off-beat hats and bass
  const BASS = [45, 45, 48, 43];
  for (let b = 0; b * BEAT < T.end + 8; b++) {
    const fr = b * BEAT, t0 = at(fr);
    if (fr < T.c30) { if (b % 2 === 0) kick(t0, b === 0 ? 0.8 : 0.4); continue; }
    kick(t0, fr === T.c30 ? 0.7 : 0.4);
    hat(at(fr + BEAT / 2), 0.05);
    if (fr >= T.slow) blip(at(fr + BEAT / 2), BASS[Math.floor(b / 4) % 4], 0.16, 0, 'sawtooth', 0.14, false);
  }
  // the hook: one low stab
  blip(0.001, 45, 0.2, 0, 'sawtooth', 0.6); blip(0.001, 57, 0.12, 0, 'triangle', 0.6);
  // the table: each case pops with a tick, its output answers high (1) or low (0)
  for (let j = 0; j < 8; j++) {
    const t0 = T.tab + 7.5 * j;
    hat(at(t0), 0.07, 0.03);
    blip(at(t0 + 4), B30[j] ? 81 : 69, 0.14, -0.6 + j * 0.17);
  }
  for (let j = 0; j < 8; j++) blip(at(T.bin + 1.5 * j), 76 + (B30[j] ? 5 : 0), 0.06, -0.5 + j * 0.14, 'sine', 0.05);
  [69, 72, 76, 81].forEach((m, i) => bell(at(T.eq) + i * 0.05, m, 0.07, -0.3 + i * 0.2));
  // rows of rule 30: one click per sixteenth; its pitch = the last three bits of the centre column
  const SC30 = [69, 72, 74, 76, 79, 81, 84, 86];
  const clicks = (sched, n, fn) => { let last = -1; for (let k = 0; k < n; k++) { const slot = Math.round(sched[k] / 3.75); if (slot === last) continue; last = slot; fn(k, at(sched[k])); } };
  const cb = k => k < 0 ? 0 : M.centre[k];
  clicks(ROW30, M.rows, (k, t0) => {
    const v = cb(k - 2) << 2 | cb(k - 1) << 1 | cb(k);
    blip(t0, SC30[v], k <= 8 ? 0.2 : 0.12, (v - 3.5) / 8, 'triangle', k <= 8 ? 0.09 : 0.05);
    if (k <= 8) blip(t0, SC30[v] - 24, 0.12, 0, 'sine', 0.12, false);
  });
  // the centre column, read aloud: 1 high, 0 low, on sixteenths
  for (let q = 0; q < 12; q++) { const fr = T.col0 + q * 3.75, k = Math.floor(E.inOutCubic(prog(fr, T.col0, T.col0 + 30)) * (M.rows - 1));
    blip(at(fr), M.centre[k] ? 88 : 76, 0.1, 0.3, 'sine', 0.07); }
  // rule changes
  sweep(at(T.r110 - 6), 0.6); sweep(at(T.code - 6), 0.6);
  // rows of rule 110: square clicks, pitch from how many cells are alive in the row
  const SC110 = [62, 65, 67, 69, 72, 74, 77, 79];
  clicks(ROW110, M.rows, (k, t0) => { const live = M.r110[k].reduce((a, b) => a + b, 0); blip(t0, SC110[live % 8], 0.1, 0.35, 'square', 0.05); });
  // the last cascade, then the word forming: one rising chord tone per font row
  clicks(ROWC, M.rows, (k, t0) => { const v = M.rC[k][M.cc] << 1 | M.rC[k][M.cc + 1]; blip(t0, SC30[v * 2], 0.09, -0.2, 'triangle', 0.04); });
  const CH = [57, 60, 64, 67, 71, 72, 76];
  CH.forEach((m, p) => bell(at(T.wordA + p * PX + 5), m + 12, 0.07, -0.45 + p * 0.15));
  pad(at(T.wordA), [45, 57, 60, 64, 67, 71], 3.2, 0.045);
  kick(at(T.done), 0.6);
  [69, 72, 76, 81].forEach((m, i) => bell(at(T.end + 8 + i * 6), m, 0.08, -0.45 + i * 0.3));
  const buf = await ac.startRendering();
  let peak = 0; for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let k = 0; k < d.length; k++) peak = Math.max(peak, Math.abs(d[k])); }
  if (peak > 0.89) for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let k = 0; k < d.length; k++) d[k] *= 0.89 / peak; }
  return buf;
}

/* ==========================================================================
   VERTICAL CUT — shared block, identical in every piece.
   1080x1920 for Reels, Shorts and TikTok (__motion.variants.vertical). The
   piece's own scene code is re-used and recomposed for a phone: everything a
   viewer must read stays inside the area no platform covers (x 60..900,
   y 230..1400); outside it there is only dimmed texture.

const VW = 1080, VH = 1920, SAFE = { x: 60, y: 230, w: 840, h: 1170, r: 900, b: 1400 };
const vcv = document.createElement('canvas'); vcv.width = VW; vcv.height = VH;
const vx = vcv.getContext('2d', { willReadFrequently: true });   // CPU raster: identical pixels on every redraw
const VL = 96, VR = 864;                                          // text column inside the safe area

function vReset() {
  vx.setTransform(1, 0, 0, 1, 0, 0); vx.globalAlpha = 1; vx.globalCompositeOperation = 'source-over';
  vx.filter = 'none'; vx.shadowBlur = 0; vx.shadowColor = 'transparent'; vx.letterSpacing = '0px'; vx.setLineDash([]);
  vx.textAlign = 'left'; vx.textBaseline = 'alphabetic'; vx.lineCap = 'butt'; vx.lineJoin = 'miter';
}
/** Canvas text on the vertical frame; `max` shrinks the size until the line fits. */
function vText(str, x, y, { size = 40, weight = 700, color = '#FFFFFF', align = 'left', spacing = 0, alpha = 1, fam = FONT, max = 0 } = {}) {
  if (alpha <= 0.002 || !str) return size;
  vx.font = `${weight} ${size}px ${fam}`; vx.letterSpacing = spacing + 'px';
  if (max) { const w = vx.measureText(str).width; if (w > max) { size = size * max / w; vx.font = `${weight} ${size}px ${fam}`; } }
  vx.textAlign = align; vx.textBaseline = 'alphabetic';
  const a0 = vx.globalAlpha; vx.globalAlpha = a0 * alpha; vx.fillStyle = color;
  vx.fillText(str, x + (align === 'center' ? spacing / 2 : align === 'right' ? spacing : 0), y);   // tracking is added after the last glyph too
  vx.globalAlpha = a0; vx.letterSpacing = '0px';
  return size;
}
/** Word-wraps with the given font; returns the lines. */
function vWrap(str, maxW, size, weight = 700, fam = FONT) {
  vx.font = `${weight} ${size}px ${fam}`; vx.letterSpacing = '0px';
  const words = str.split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (vx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur);
  return lines;
}
/** Fade envelope with a small rise: [alpha, dy]. */
function vEnv(v, a, b, fin = 8, fout = 8) {
  const i = E.outCubic(prog(v, a, a + fin)), o = 1 - E.inCubic(prog(v, b - fout, b));
  return [Math.min(i, o), (1 - i) * 22 - (1 - o) * 10];
}
/** Which segment of a cut list a vertical frame is in: segs = [{ at, src, len }] in frames. */
function vSeg(segs, v) {
  let k = 0; while (k < segs.length - 1 && v >= segs[k + 1].at) k++;
  const s = segs[k];
  return { k, s, local: v - s.at, src: s.src + (v - s.at) };
}
/** Dims everything outside the safe area to a quiet texture (brightness x 0.2), with a soft inner edge. */
function vShade(rgb, a = 0.8, feather = 40) {
  vx.save(); vx.setTransform(1, 0, 0, 1, 0, 0); vx.globalAlpha = 1; vx.globalCompositeOperation = 'source-over';
  vx.fillStyle = `rgba(${rgb},${a})`;
  vx.beginPath(); vx.rect(0, 0, VW, VH); vx.rect(SAFE.x, SAFE.y, SAFE.w, SAFE.h); vx.fill('evenodd');
  const strip = (x0, y0, x1, y1, rx, ry, rw, rh) => {
    const g = vx.createLinearGradient(x0, y0, x1, y1);
    g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`);
    vx.fillStyle = g; vx.fillRect(rx, ry, rw, rh);
  };
  strip(SAFE.x, 0, SAFE.x + feather, 0, SAFE.x, SAFE.y, feather, SAFE.h);
  strip(SAFE.r, 0, SAFE.r - feather, 0, SAFE.r - feather, SAFE.y, feather, SAFE.h);
  strip(0, SAFE.y, 0, SAFE.y + feather, SAFE.x, SAFE.y, SAFE.w, feather);
  strip(0, SAFE.b, 0, SAFE.b - feather, SAFE.x, SAFE.b - feather, SAFE.w, feather);
  vx.restore();
}
/** Series tag at the top of the safe area, e.g. MADE IN CODE · 04. */
function vTag(label, color, alpha = 1) {
  vText('MADE IN CODE', VL, 292, { size: 28, weight: 800, color, spacing: 5, alpha });
  vx.font = `800 28px ${FONT}`; vx.letterSpacing = '5px';
  const w = vx.measureText('MADE IN CODE').width; vx.letterSpacing = '0px';
  vText('·  ' + label, VL + w + 14, 292, { size: 28, weight: 600, color: 'rgba(255,255,255,0.72)', spacing: 3, alpha, max: VR - VL - w - 14 });
}
/** Big hook lines, left-aligned from y0; visible from frame 0, settles in a few frames. */
function vHook(v, lines, y0, { size = 84, lh = 1.08, color = '#FFFFFF', accent = null, weight = 800, spacing = -1.5, alpha = 1 } = {}) {
  const k = E.outExpo(prog(v, -6, 12));
  lines.forEach((ln, i) => {
    const kk = E.outExpo(prog(v, -12 + i * 2, 8 + i * 2));
    vText(ln, VL, y0 + i * size * lh + (1 - kk) * 30, { size, weight, spacing, color: accent && i === lines.length - 1 ? accent : color, alpha: alpha * Math.max(0.25, kk), max: VR - VL });
  });
  return k;
}
/** Closing card, the last 60 frames: piece title, "drawn in code · bytepatterns.com". l = frames into the card. */
function vEndCard(l, { title, line = '', ink = '#FFFFFF', dim = 'rgba(255,255,255,0.66)', accent = '#FFFFFF', scrim = '0,0,0', a = 0.84 }) {
  const k = E.outCubic(prog(l, 0, 12));
  vx.save(); vx.setTransform(1, 0, 0, 1, 0, 0);
  vx.fillStyle = `rgba(${scrim},${a * k})`; vx.fillRect(0, 0, VW, VH);
  vx.restore();
  const t1 = E.outExpo(prog(l, 3, 19)), t2 = E.outExpo(prog(l, 11, 27)), t3 = E.outExpo(prog(l, 19, 35));
  vx.fillStyle = accent; vx.globalAlpha = t1; vx.fillRect(VL, 742, 88 * t1, 7); vx.globalAlpha = 1;
  const size = vText(title, VL, 850 + (1 - t1) * 40, { size: 92, weight: 800, color: ink, spacing: -2, alpha: t1, max: VR - VL });
  const y2 = 850 + Math.max(size, 60) * 0.25 + 70;
  vx.font = `600 44px ${FONT}`;
  const lead = 'drawn in code  ·  ', lw = vx.measureText(lead).width;
  vText(lead, VL, y2 + (1 - t2) * 24, { size: 44, weight: 600, color: dim, alpha: t2 });
  vText('bytepatterns.com', VL + lw, y2 + (1 - t2) * 24, { size: 44, weight: 800, color: accent, alpha: t2 });
  if (line) vText(line, VL, y2 + 72 + (1 - t3) * 18, { size: 32, weight: 500, color: dim, alpha: t3, max: VR - VL });
}
/** Seeks a cut. The first frame a page draws is drawn twice: the very first read of a
 *  GPU-backed source canvas can come out a shade different from every later one. */
let vWarm = false;
function vSeek(draw, i, frames) {
  const f = Math.max(0, Math.min(frames - 1, Math.floor(i)));
  if (!vWarm) { vWarm = true; draw(f); }
  draw(f);
}
/** The soundtrack of a cut: the piece's own audio() spliced to the same segments as the picture. */
async function vAudio(segs, frames, { xf = 0.025, fadeOut = 0.6, extra = null } = {}) {
  const src = await renderAudio();
  const SR = 48000, dur = frames / FPS, ac = new OfflineAudioContext(2, Math.round(SR * dur), SR);
  const out = ac.createGain(); out.connect(ac.destination);
  out.gain.setValueAtTime(1, 0); out.gain.setValueAtTime(1, dur - fadeOut); out.gain.linearRampToValueAtTime(0, dur - 0.01);
  segs.forEach((s, k) => {
    const at = s.at / FPS, off = s.src / FPS, d = s.len / FPS;
    const pre = k === 0 ? 0 : Math.min(xf, off), post = k === segs.length - 1 ? 0 : xf;
    const b = ac.createBufferSource(), g = ac.createGain(); b.buffer = src;
    g.gain.setValueAtTime(pre ? 0 : 1, at - pre);
    if (pre) g.gain.linearRampToValueAtTime(1, at + pre);
    if (post) { g.gain.setValueAtTime(1, at + d - post); g.gain.linearRampToValueAtTime(0, at + d + post); }
    b.connect(g).connect(out); b.start(at - pre, off - pre, d + pre + post);
  });
  if (extra) extra(ac, out);
  const buf = await ac.startRendering();
  let peak = 0; for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) peak = Math.max(peak, Math.abs(d[i])); }
  if (peak > 0.9) for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] *= 0.9 / peak; }
  return buf;
}
/** A soft three-partial bell, for the closing card. */
function vChime(ac, dest, at, freq, vol = 0.08) {
  for (const [mul, v, dec] of [[1, 1, 1.8], [2.01, 0.35, 0.8], [3.02, 0.12, 0.4]]) {
    const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.value = freq * mul;
    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol * v, at + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, at + dec);
    o.connect(g).connect(dest); o.start(at); o.stop(at + dec + 0.05);
  }
}

/* VERTICAL CUT — this piece */
// The same four acts, recomposed for a phone: text in the top of the safe
// area, a 101 x 88 cell field below it, the table in two rows of four and
// the word one scale smaller. Cut on the beat from the landscape timeline,
// so the soundtrack splices cleanly.
const VSEG = [
  { at: 0, src: 0, len: 45 },                                // hook
  { at: 45, src: 60, len: 105 },                             // the eight cases, 00011110 = 30
  { at: 150, src: 195, len: 195 },                           // rule 30, one row at a time
  { at: 345, src: 450, len: 90 },                            // rule 110
  { at: 435, src: 585, len: 105 },                           // steered into the word
  { at: 540, src: T.end + 2, len: 60 },                      // closing card
];
const VFR = 600, VEND = VFR - 60;
const GV = {
  fx: 76, fy: 680, cs: 8, cols: 101, rows: 88, z0: 5,
  word: { scale: 4, row0: 34 },
  tab: { cs: 40, gap: 4, dsize: 48, dDy: 56, pos: Array.from({ length: 8 }, (_, j) => [116 + (j % 4) * 200, j < 4 ? 560 : 800]) },
  big: { cx: 480, y: 1150, size: 88, wy: 64, wsize: 34 },
  leg: { x: VL, y: 420, cs: 16, gap: 2, sp: 64 },
  bin: { x: VL, y: 518, size: 30 },
};
GV.M = makeModel(GV);
function hookV(v) {
  const o = 1 - E.inCubic(prog(v, 38, 45));
  vHook(v, ['One rule.', 'Eight cases.', 'Chaos.'], 424, { size: 124, lh: 1.04, color: C.paper, accent: C.warm, weight: 900, spacing: -4, alpha: o });
}
function uiV(f, changed) {
  const M = GV.M, X = VL, R = VR;
  { const [a, dy] = env(f, T.tab - 4, T.leg + 8, 12, 10);
    text(vx, 'Each new cell looks', X, 420 + dy, { size: 58, weight: 850, color: C.paper, spacing: -1.5, alpha: a });
    text(vx, 'at the three above it.', X, 486 + dy, { size: 58, weight: 850, color: C.paper, spacing: -1.5, alpha: a }); }
  const heads = [[`Rule ${N30}`, T.leg + 4, T.r110 + 6], [`Rule ${N110}`, T.r110 + 6, T.code + 6],
    ['Steer every row.', T.code + 6, T.done + 4], ['One row at a time.', T.done + 4, T.end + 30]];
  for (const [s, a0, a1] of heads) { const [a, dy] = env(f, a0, a1, 10, 8); text(vx, s, X, 384 + dy, { size: 68, weight: 900, color: C.paper, spacing: -2.5, alpha: a }); }
  // right of the legend: the row counter, or how many cells the steering changed
  { const [a, dy] = env(f, T.c30, T.r110 + 6, 10, 8);
    text(vx, `row ${Math.max(0, shown(ROW30, f, M.rows) - 1)}`, R, 454 + dy, { size: 32, weight: 800, fam: MONO, color: C.paper, align: 'right', alpha: a }); }
  { const [a, dy] = env(f, T.r110 + 10, T.code + 6, 10, 8);
    text(vx, `row ${Math.max(0, shown(ROW110, f, M.rows) - 1)}`, R, 454 + dy, { size: 32, weight: 800, fam: MONO, color: C.paper, align: 'right', alpha: a }); }
  { const [a, dy] = env(f, T.code + 12, T.end + 30, 10, 8);
    text(vx, `${fmt(changed)} changed`, R, 454 + dy, { size: 32, weight: 800, fam: MONO, color: C.hot, align: 'right', alpha: a }); }
  // two caption lines above the field
  { const [a, dy] = env(f, T.leg + 12, T.r110 + 6, 10, 8);
    text(vx, 'from one live cell', X, 572 + dy, { size: 32, weight: 700, color: C.paper, alpha: a });
    const la = a * prog(f, T.c30, T.c30 + 6);
    text(vx, 'centre', X, 620 + dy, { size: 30, weight: 700, color: C.dim, alpha: la });
    centreBits(vx, GV, f, X + 118, 620 + dy, 30, 20, 'left', la); }
  { const [a, dy] = env(f, T.r110 + 10, T.code + 6, 10, 8);
    text(vx, `from ${M.block} random cells`, X, 572 + dy, { size: 32, weight: 700, color: C.paper, alpha: a }); }
  { const [a, dy] = env(f, T.note1, T.note2, 12, 8);
    text(vx, 'Structures travel and collide.', X, 620 + dy, { size: 34, weight: 800, color: C.coolHi, alpha: a }); }
  { const [a, dy] = env(f, T.note2, T.code + 6, 10, 8);
    text(vx, `Rule ${N110} is Turing complete.`, X, 620 + dy, { size: 34, weight: 800, color: C.cool, alpha: a }); }
  { const [a, dy] = env(f, T.code + 12, T.end + 30, 10, 8);
    text(vx, `rule ${N30} runs; then every row`, X, 572 + dy, { size: 32, weight: 700, color: C.paper, alpha: a });
    text(vx, 'is steered onto a 5×7 font', X, 616 + dy, { size: 32, weight: 700, color: C.paper, alpha: a }); }
}
function vDraw(v) {
  const { k: seg, src } = vSeg(VSEG, v), f = Math.min(FRAMES - 1, src);
  vReset();
  backdrop(vx, VW, VH);
  fieldPanel(vx, GV);
  sceneTeaser(vx, GV, f, 0.26);
  sceneRule30(vx, GV, f);
  sceneRule110(vx, GV, f);
  const changed = sceneCode(vx, GV, f);
  vReset();
  tableLegend(vx, GV, f);
  uiV(f, changed);
  vReset();
  vShade(C.bgRGB, 0.84);
  vTag('RULE 30', C.warm);
  if (seg === 0) hookV(v);
  if (v >= VEND) vEndCard(v - VEND, { title: 'One Row at a Time', line: `rule ${N30} · rule ${N110} · ${fmt(GV.M.changed)} cells changed into a word`,
    ink: C.paper, dim: 'rgba(244,237,226,0.72)', accent: C.warm, scrim: C.bgRGB, a: 0.9 });
  vReset();
}

window.__motion = {
  title: 'One Row at a Time',
  description: `Elementary cellular automata drawn one row at a time: the eight cases of rule ${N30} (${B30.join('')}), its chaotic triangle grown from one live cell over ${GL.M.rows} rows (${fmt(GL.M.live30[GL.M.rows - 1])} live cells) with a click per row pitched by its centre column, rule ${N110} from ${GL.M.block} random cells, and a last rule-${N30} cascade whose rows are then steered cell by cell onto a 5x7 bitmap of the word "code" (${fmt(GL.M.changed)} cells changed).`,
  fps: FPS, width: W, height: H, frames: FRAMES,
  poster: 420,
  gifStart: 10.4,
  seek(i) { draw(Math.max(0, Math.min(FRAMES - 1, Math.floor(i)))); },
  audio: renderAudio,
  variants: {
    vertical: {
      width: VW, height: VH, frames: VFR, canvas: vcv,
      poster: 330, gifStart: 8.6,
      seek(i) { vSeek(vDraw, i, VFR); },
      audio: () => vAudio(VSEG, VFR, { extra: (ac, out) => { vChime(ac, out, VEND / FPS + 0.3, 880, 0.07); vChime(ac, out, VEND / FPS + 0.5, 1318.5, 0.05); } }),
    },
  },
};

/* ==========================================================================
   PLAYER — identical in every piece; keep as is.
   Autoplays and loops, starts sound on the first click, ?frame=N pauses on a
   frame, ?variant=vertical plays the vertical cut (if the piece has one).
   When the renderer sets window.__MOTION_RENDER__ it stays out of the way.
   ========================================================================== */
(function player() {
  const btn = document.getElementById('sound'), q = new URLSearchParams(location.search);
  let M = window.__motion;
  const V = !window.__MOTION_RENDER__ && M.variants && M.variants[q.get('variant')];
  if (V) {                                                // show the variant's own canvas instead
    M = Object.assign({}, M, V);
    V.canvas.style.cssText = `width:min(100vw,calc(100vh*${V.width}/${V.height}));height:auto;aspect-ratio:${V.width}/${V.height}`;
    document.querySelector('canvas').replaceWith(V.canvas);
  }
  const dur = M.frames / M.fps;
  if (window.__MOTION_RENDER__) { btn.hidden = true; M.seek(0); return; }
  if (q.has('frame')) { btn.hidden = true; M.seek(+q.get('frame') || 0); return; }
  let t0 = performance.now(), ac = null, src = null, buf = null, paused = false, pausedAt = 0;
  const clock = () => ac && src ? (ac.currentTime - t0) : (performance.now() - t0) / 1000;
  function loop() {
    if (!paused) M.seek(Math.floor(((clock() % dur) + dur) % dur * M.fps));
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  btn.addEventListener('click', async () => {
    if (src) { src.stop(); src = null; btn.textContent = 'Click for sound'; t0 = performance.now(); return; }
    btn.textContent = 'Loading sound…';
    ac = ac || new AudioContext({ sampleRate: 48000 });
    buf = buf || await M.audio();
    await ac.resume();
    src = ac.createBufferSource(); src.buffer = buf; src.loop = true; src.connect(ac.destination);
    t0 = ac.currentTime + 0.05; src.start(t0);        // picture restarts from frame 0 in sync with the sound
    btn.textContent = 'Sound on — click to mute';
  });
  addEventListener('keydown', e => {
    if (e.code !== 'Space') return;
    e.preventDefault(); paused = !paused;
    if (ac) paused ? ac.suspend() : ac.resume();
    if (!ac) { if (paused) pausedAt = performance.now(); else t0 += performance.now() - pausedAt; }
  });
})();
